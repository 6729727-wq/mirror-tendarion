<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClaimsHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;font-size:17px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.grow{flex:1}
.who{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:12.5px;display:flex;gap:10px;align-items:center}
.who .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--mal) 22%,transparent);color:var(--mal3);font-weight:800;flex:none}
.who div{min-width:0}.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.how>div>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold2);flex:none;font-size:13px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f .err{font-size:11.5px;color:var(--red);margin-top:3px;min-height:0}
.input.bad{border-color:var(--red)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.grid2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);padding:9px 10px;background:var(--bg2);border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.ck{cursor:pointer} table.t tbody tr.ck:hover td{background:var(--panel2)}
table.t tr.sel td{background:color-mix(in srgb,var(--mal) 10%,transparent)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:color-mix(in srgb,var(--mal) 16%,transparent);border-color:var(--mal);color:var(--text)}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 70px 110px 36px;gap:8px;align-items:center}
.line .x{width:36px;height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer}
.elig{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg2);font-size:12.5px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.rules{list-style:none;padding:0;margin:0}
.rules li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;opacity:0;animation:pop .25s forwards}
@keyframes pop{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.rules .ico{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.rules .pass .ico{background:color-mix(in srgb,var(--mal) 20%,transparent);color:var(--mal3)}
.rules .warn .ico{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
.rules .pend .ico{background:color-mix(in srgb,var(--blue) 20%,transparent);color:var(--blue)}
.rules .deny .ico{background:color-mix(in srgb,var(--red) 20%,transparent);color:var(--red)}
.rules .k{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none;width:30px;padding-top:3px}
.fin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.fin div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fin span{display:block;font-size:11.5px;color:var(--muted)} .fin b{font-size:16px}
pre.x12{font-family:var(--mono);font-size:11.5px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;margin:0;max-height:260px;white-space:pre}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0 10px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--mal)}
.q{border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px;background:var(--bg2);cursor:pointer;display:flex;gap:12px;align-items:center}
.q.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 8%,var(--bg2))}
.q .sc{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.q .bd{flex:1;min-width:0}.q .bd b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .bd span{font-size:12px;color:var(--muted)}
.sig{display:grid;grid-template-columns:minmax(0,1fr) 90px 34px;gap:8px;align-items:center;font-size:12.5px;padding:4px 0}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px}
.prog{height:9px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0 3px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--mal2),var(--mal3))}
.mcard{border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#0f7a5c,#0b3d33 60%,#1d2a24);position:relative;overflow:hidden;aspect-ratio:1.586;max-width:380px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.mcard:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(243,215,154,.35),transparent 70%)}
.mcard .chip2{width:40px;height:30px;border-radius:6px;background:linear-gradient(135deg,#f3d79a,#a8812c)}
.mcard small{opacity:.75;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.mcard .nm{font-size:19px;font-weight:700}
.mlist{max-height:520px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.mi{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg2);text-align:left;width:100%}
.mi.on{border-color:var(--mal)}
.mi .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-weight:700;font-size:12px;flex:none}
.mi div{min-width:0;flex:1}.mi b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mi span{font-size:11.5px;color:var(--muted)}
.hist{font-size:12.5px;border-left:2px solid var(--line2);padding-left:12px;margin-top:8px}
.hist div{padding:3px 0}.hist .t{color:var(--dim);font-family:var(--mono);font-size:11px;margin-right:6px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.login{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 500px at 70% 10%,color-mix(in srgb,var(--mal) 14%,transparent),transparent)}
.lbox{width:100%;max-width:440px}
.lbox .card{padding:26px}
.lbox h2{margin:12px 0 4px;font-size:22px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.role{border:1px solid var(--line2);border-radius:12px;padding:10px;cursor:pointer;background:var(--bg2);text-align:left;font-size:12.5px}
.role b{display:block;font-size:13.5px}
.role.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 12%,transparent)}
.hint{font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--gold) 10%,transparent);border:1px dashed color-mix(in srgb,var(--gold) 45%,transparent);border-radius:10px;padding:8px 10px;margin-top:12px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13.5px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid2e,.intro{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
}
@media (max-width:560px){.how,.fgrid,.fin{grid-template-columns:1fr}.kpi .v{font-size:20px}.kpis{gap:10px}
  .line{grid-template-columns:minmax(0,1fr) 58px 36px}.line .ch{grid-column:1/3}.line .x{grid-row:1/3;grid-column:3;height:100%}
  .roles{grid-template-columns:1fr}.sig{grid-template-columns:minmax(0,1fr) 60px 30px}}
</style>
</head>

const RULES={R01:['Member eligibility','Право на покрытие'],R02:['Provider network','Сеть клиник'],R03:['Benefit coverage','Покрытие услуги'],R04:['Diagnosis ↔ procedure','Диагноз ↔ услуга'],R05:['Duplicate check','Проверка дублей'],R06:['Frequency limit','Лимит частоты'],R07:['Prior authorisation','Предавторизация'],R08:['Timely filing (90 d)','Срок подачи (90 дн.)'],R09:['Fee schedule','Тарифы']};
const ST={approved:['Approved','Одобрен','ok'],paid:['Paid','Оплачен','ok'],pended:['Pended','Отложен','warn'],fraud:['Fraud review','Проверка СБ','bad'],records:['Records requested','Запрошены документы','warn'],denied:['Denied','Отклонён','bad']};

/* ---------- engine ---------- */
function mem(id){return S.members.find(m=>m.id===id)}
function adjudicate(c,all){
  const m=mem(c.mem),p=PLANS[m.plan],R=[],dos=new Date(c.dos),hit=new Set();
  const add=(k,res,en,ru)=>{R.push({k,res,en,ru});if(res!=='pass')hit.add(k)};
  const elig=c.dos>=m.from&&c.dos<=m.to;
  add('R01',elig?'pass':'deny',elig?`Covered on ${c.dos} · plan ${p.en}`:`Coverage ended ${m.to}`,elig?`Покрыт на ${c.dos} · план «${p.ru}»`:`Покрытие закончилось ${m.to}`);
  const pr0=PROV[c.prov];
  add('R02',pr0.net?'pass':'warn',pr0.net?'In-network provider':'Out-of-network — allowed at 60%',pr0.net?'Клиника в сети':'Вне сети — признаётся 60%');
  c.lines.forEach(l=>{const pr=PROCS[l.c];
    if(pr.nc||p.ex.includes(l.c))add('R03','deny',`${l.c} not covered by plan ${p.en}`,`${l.c} не покрывается планом «${p.ru}»`);
    if(pr.dx!=='*'&&!pr.dx.includes(c.dx))add('R04','deny',`${l.c} not supported by diagnosis ${c.dx}`,`${l.c} не обоснован диагнозом ${c.dx}`);
    if(pr.pa&&!c.pa)add('R07','pend',`${l.c} requires prior authorisation`,`${l.c} требует предавторизации`);
    if(pr.freq){const prev=all.find(o=>o.id!==c.id&&o.mem===c.mem&&o.st!=='denied'&&o.lines.some(x=>x.c===l.c)&&Math.abs(new Date(o.dos)-dos)<pr.freq*DAY);
      if(prev)add('R06','deny',`${l.c}: max 1 per ${pr.freq} days (see ${prev.id})`,`${l.c}: не чаще 1 раза в ${pr.freq} дн. (см. ${prev.id})`)}
    if(l.ch>pr.fee*1.02)add('R09','warn',`${l.c} billed ${nf(l.ch)} > tariff ${nf(pr.fee)} — repriced`,`${l.c}: выставлено ${nf(l.ch)} > тариф ${nf(pr.fee)} — пересчитано`);
  });
  const d=all.find(o=>o.id!==c.id&&o.mem===c.mem&&o.dos===c.dos&&o.st!=='denied'&&o.lines.some(x=>c.lines.some(y=>y.c===x.c)));
  if(d)add('R05','deny',`Duplicate of ${d.id}`,`Дубль счёта ${d.id}`);
  const lag=(new Date(c.sub)-dos)/DAY;
  if(lag>90)add('R08','deny',`Filed ${Math.round(lag)} days after service`,`Подан через ${Math.round(lag)} дн. после услуги`);
  if(lag<0)add('R08','deny','Date of service is in the future','Дата услуги в будущем');
  const PASS={R03:['All lines covered by plan','Все услуги покрываются'],R04:['Diagnosis supports all lines','Диагноз обосновывает все услуги'],R05:['No duplicates found','Дублей не найдено'],R06:['Within frequency limits','В пределах лимитов'],R07:['No authorisation needed or on file','Предавторизация не нужна или есть'],R08:['Filed within 90 days','Подан в срок 90 дней'],R09:['Charges within tariff','Суммы в пределах тарифа']};
  Object.keys(PASS).forEach(k=>{if(!hit.has(k)&&!R.some(r=>r.k===k))add(k,'pass',PASS[k][0],PASS[k][1])});
  R.sort((a,b)=>a.k.localeCompare(b.k));
  // fraud model
  const sig=[];const sg=(w,en,ru)=>sig.push({w,en,ru});
  const ratio=c.lines.reduce((a,l)=>a+l.ch/PROCS[l.c].fee,0)/c.lines.length;
  if(ratio>1.6)sg(22,`Charges ${ratio.toFixed(1)}× tariff on average`,`Суммы в среднем ${ratio.toFixed(1)}× тарифа`);
  if(c.lines.some(l=>l.c==='99215'))sg(16,'Level-5 visit (upcoding pattern)','Приём уровня 5 (завышение уровня)');
  if(pr0.risk)sg(24,'Provider on watch list (peer outlier)','Клиника в списке наблюдения (выброс)');
  if(c.lines.some(l=>l.q>3))sg(12,'Unusual unit count on a line','Необычное количество единиц');
  if([0,6].includes(dos.getDay()))sg(7,'Service on weekend','Услуга в выходной');
  const recent=all.filter(o=>o.id!==c.id&&o.mem===c.mem&&Math.abs(new Date(o.dos)-dos)<14*DAY).length;
  if(recent>=2)sg(10,`${recent} other claims for member in 14 days`,`Ещё ${recent} счёта по застрахованному за 14 дн.`);
  if(c.lines.length>=5)sg(8,'Many lines on one encounter','Много услуг за один визит');
  const score=Math.min(99,sig.reduce((a,s)=>a+s.w,0)+3+hash(c.id)%9);
  c.rules=R;c.sig=sig;c.fraud=score;
  c.st=R.some(r=>r.res==='deny')?'denied':score>=60?'fraud':R.some(r=>r.res==='pend')?'pended':'approved';
  // financials
  const allowed=c.lines.reduce((a,l)=>a+Math.min(l.ch,PROCS[l.c].fee)*l.q,0)*(pr0.net?1:.6);
  c.billed=c.lines.reduce((a,l)=>a+l.ch*l.q,0);c.allowed=allowed;
  finCalc(c);
  if(c.st==='approved')accrue(c);
  return c;
}
function finCalc(c){const m=mem(c.mem),p=PLANS[m.plan];
  if(c.st==='denied'){c.share=0;c.pays=0;return}
  const dedPart=Math.min(c.allowed,Math.max(0,p.ded-m.ded));const co=(c.allowed-dedPart)*p.co/100;
  c.share=Math.min(dedPart+co,Math.max(0,p.oop-m.oop));c.dedPart=Math.min(dedPart,c.share);c.pays=c.allowed-c.share}
function accrue(c){const m=mem(c.mem);if(c.acc)return;finCalc(c);m.ded+=c.dedPart||0;m.oop+=c.share||0;c.acc=1}
function logc(c,en,ru){(c.log=c.log||[]).push({t:new Date().toISOString(),en,ru})}

function dayChart(){
  const W=640,H=210,P=28,days=[...Array(14)].map((_,i)=>iso(NOW-(13-i)*DAY));
  const grp=s=>['approved','paid'].includes(s)?0:['pended','records'].includes(s)?1:s==='fraud'?2:3;const cols=['--mal','--amber','--violet','--red'].map(cssv);
  const data=days.map(d=>{const a=[0,0,0,0];S.claims.filter(c=>c.sub===d).forEach(c=>a[grp(c.st)]++);return a});
  const mx=Math.max(3,...data.map(a=>a.reduce((x,y)=>x+y,0)));const bw=(W-P-10)/14;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(let g=0;g<=3;g++){const y=H-22-(H-40)*g/3;s+=`<line x1="${P}" x2="${W}" y1="${y}" y2="${y}" stroke="${cssv('--line')}"/><text x="${P-6}" y="${y+4}" text-anchor="end" font-size="10" fill="${cssv('--dim')}">${Math.round(mx*g/3)}</text>`}
  data.forEach((a,i)=>{let y=H-22;a.forEach((v,k)=>{if(!v)return;const h=(H-40)*v/mx;y-=h;s+=`<rect x="${P+i*bw+4}" y="${y}" width="${bw-8}" height="${h}" rx="3" fill="${cols[k]}"><title>${v}</title></rect>`});
    if(i%2===0)s+=`<text x="${P+i*bw+bw/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="${cssv('--dim')}">${new Date(days[i]).toLocaleDateString(PT.lang==='ru'?'ru-RU':'en-GB',{day:'numeric',month:'short'})}</text>`});
  return s+'</svg>'}
function donut(){
  const G=[['approved','paid'],['pended','records'],['fraud'],['denied']],cols=['--mal','--amber','--violet','--red'].map(cssv),lab=[['Approved/paid','Одобрено'],['Pended','Отложено'],['Fraud review','Проверка СБ'],['Denied','Отклонено']];
  const v=G.map(g=>S.claims.filter(c=>g.includes(c.st)).length),tot=v.reduce((a,b)=>a+b,0)||1,r=60,C=2*Math.PI*r;let off=0;
  let s=`<div class="row" style="gap:18px;justify-content:center"><svg viewBox="0 0 160 160" style="width:160px;flex:none">`;
  v.forEach((x,i)=>{const l=C*x/tot;s+=`<circle cx="80" cy="80" r="${r}" fill="none" stroke="${cols[i]}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;off+=l});
  s+=`<text x="80" y="78" text-anchor="middle" font-size="26" font-weight="800" fill="${cssv('--text')}">${tot}</text><text x="80" y="98" text-anchor="middle" font-size="11" fill="${cssv('--muted')}">${T('claims','счетов')}</text></svg><div style="font-size:13px">`;
  v.forEach((x,i)=>s+=`<div style="padding:3px 0"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${cols[i]};margin-right:6px"></i>${T(lab[i][0],lab[i][1])} <b>${Math.round(x/tot*100)}%</b></div>`);
  return s+'</div></div>'}
function ruleBars(){const cnt={};S.claims.forEach(c=>c.rules.forEach(r=>{if(r.res!=='pass')cnt[r.k]=(cnt[r.k]||0)+1}));

    if(a==='ok'){c.st='approved';accrue(c);logc(c,'Manually approved by '+who,'Одобрен вручную: '+who);toast(c.id+' · '+T('approved — queued for payment','одобрен — в очереди на оплату'))}
    if(a==='deny'){c.st='denied';c.share=0;c.pays=0;logc(c,'Denied by '+who+(c.fraud>=60?' · referred to SIU':''),'Отклонён: '+who+(c.fraud>=60?' · передан в СБ':''));toast(c.id+' · '+T('denied','отклонён'),'bad')}
    if(a==='rec'){c.st='records';logc(c,'Medical records requested from provider','У клиники запрошены медицинские документы');toast(T('Records request sent to provider','Запрос документов отправлен в клинику'),'gold')}
    if(a==='got'){c.fraud=Math.max(12,c.fraud-38);c.sig=c.sig.slice(0,1);logc(c,'Records reviewed · risk lowered to '+c.fraud,'Документы проверены · риск снижен до '+c.fraud);c.st=c.rules.some(r=>r.res==='pend')?'pended':'approved';if(c.st==='approved')accrue(c);toast(c.id+' → '+T(ST[c.st][0],ST[c.st][1]))}
    save();next()});
  if(needPA)$('#qPaGo').onclick=()=>{const v=$('#qPa').value.trim().toUpperCase();if(!/^PA-\d{5}$/.test(v)){toast(T('Format: PA-00000','Формат: PA-00000'),'bad');return}
    c.pa=v;const prevSig=c.fraud;adjudicate(c,S.claims);logc(c,'Prior auth '+v+' attached · re-adjudicated','Добавлена предавторизация '+v+' · перепроверен');toast(c.id+' → '+T(ST[c.st][0],ST[c.st][1]));save();next()};
}
function gauge(v){const r=50,a=Math.PI*v/100,x=60-r*Math.cos(a),y=62-r*Math.sin(a);
  return `<svg viewBox="0 0 120 74" style="width:130px;flex:none"><path d="M10 62 A50 50 0 0 1 110 62" fill="none" stroke="${cssv('--line')}" stroke-width="12" stroke-linecap="round"/><path d="M10 62 A50 50 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${v>=60?cssv('--red'):v>=35?cssv('--amber'):cssv('--mal')}" stroke-width="12" stroke-linecap="round"/><text x="60" y="58" text-anchor="middle" font-size="22" font-weight="800" fill="${cssv('--text')}">${v}</text><text x="60" y="72" text-anchor="middle" font-size="8.5" fill="${cssv('--muted')}">${T('FRAUD SCORE','БАЛЛ РИСКА')}</text></svg>`}

/* ---------- payments ---------- */
function rPay(){
  const el=$('#v-pay');const ready=S.claims.filter(c=>c.st==='approved');const amt=ready.reduce((a,c)=>a+c.pays,0);
  const b=S.batches.find(x=>x.id===S.psel)||S.batches[S.batches.length-1];
  el.innerHTML=`<div class="kpis">
   <div class="card kpi"><div class="l">${T('Ready to pay','К оплате')}</div><div class="v">${ready.length}</div><div class="d">${money(amt)}</div></div>
   <div class="card kpi"><div class="l">${T('Last cycle','Последний цикл')}</div><div class="v" style="font-size:20px">${fmtD(S.batches[S.batches.length-1].date)}</div><div class="d">${S.batches[S.batches.length-1].n} ${T('claims','счетов')}</div></div>
   <div class="card kpi"><div class="l">${T('Paid · 10 weeks','Оплачено · 10 недель')}</div><div class="v" style="font-size:20px">${money(S.batches.slice(-10).reduce((a,x)=>a+x.amt,0))}</div><div class="d">EFT · ISO 20022</div></div>
   <div class="card kpi"><div class="l">${T('Avg. days to pay','Средний срок оплаты')}</div><div class="v" style="color:var(--mal3)">6.4</div><div class="d">${T('statutory limit 30','норматив 30')}</div></div></div>
   <div class="grid2"><div class="card"><h3>${T('Payment cycle','Платёжный цикл')}<span class="sp"></span><button class="btn pri sm" id="payRun" ${ready.length?'':'disabled'}>💳 ${T('Run payment cycle','Запустить цикл')}</button></h3>
    ${ready.length?`<div class="tw"><table class="t"><thead><tr><th>${T('Claim','Счёт')}</th><th>${T('Provider','Клиника')}</th><th class="num">${T('Allowed','Признано')}</th><th class="num">${T('Member','Пациент')}</th><th class="num">${T('Plan pays','Платит фонд')}</th></tr></thead><tbody>${ready.map(c=>`<tr><td class="mono">${c.id}</td><td>${L(PROV[c.prov].n)}</td><td class="num">${money(c.allowed)}</td><td class="num">${money(c.share)}</td><td class="num"><b>${money(c.pays)}</b></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${T('No approved claims waiting. Approve some in the review queue or submit a clean claim.','Нет одобренных счетов. Одобрите в очереди или подайте чистый счёт.')}</div>`}
    <h3 style="margin-top:16px">${T('Weekly payments','Выплаты по неделям')}</h3><div class="chart">${payChart()}</div></div>
   <div class="card"><h3>${T('Batches','Платёжные реестры')}</h3><div class="tw"><table class="t" style="min-width:380px"><thead><tr><th>${T('Batch','Реестр')}</th><th>${T('Date','Дата')}</th><th class="num">${T('Claims','Счета')}</th><th class="num">${T('Amount','Сумма')}</th></tr></thead><tbody>
    ${S.batches.slice().reverse().map(x=>`<tr class="ck ${x.id===b.id?'sel':''}" data-b="${x.id}"><td class="mono">${x.id}</td><td style="white-space:nowrap">${fmtD(x.date)}</td><td class="num">${x.n}</td><td class="num">${money(x.amt)}</td></tr>`).join('')}</tbody></table></div>
    <h3 style="margin-top:14px">${T('835 remittance','Реестр 835')} · <span class="mono" style="font-size:12px">${b.id}</span></h3><pre class="x12">${esc(x835(b))}</pre></div></div>`;
  $$('[data-b]',el).forEach(r=>r.onclick=()=>{S.psel=r.dataset.b;save();rPay()});
  $('#payRun').onclick=()=>{const id='PAY-'+iso(NOW).replace(/-/g,'')+'-'+(S.batches.length+1);
    const bt={id,date:iso(NOW),n:ready.length,amt:Math.round(amt),eft:'EFT'+(88200000+Math.floor(Math.random()*99999)),ids:ready.map(c=>c.id)};
    ready.forEach(c=>{c.st='paid';c.batch=id;logc(c,'Paid in '+id+' · '+bt.eft,'Оплачен в '+id+' · '+bt.eft)});S.batches.push(bt);S.psel=id;save();render();
    toast(T(`Payment cycle ${id}: ${bt.n} claims, ${money(bt.amt)} sent by EFT`,`Цикл ${id}: ${bt.n} счетов, ${money(bt.amt)} отправлено`),'gold')};
}
function payChart(){const B=S.batches.slice(-11),W=640,H=180,P=8,mx=Math.max(...B.map(b=>b.amt))*1.1,bw=(W-P*2)/B.length;
  let s=`<svg viewBox="0 0 ${W} ${H}">`;B.forEach((b,i)=>{const h=(H-36)*b.amt/mx,x=P+i*bw;s+=`<rect x="${x+5}" y="${H-22-h}" width="${bw-10}" height="${h}" rx="4" fill="${i===B.length-1?cssv('--gold'):cssv('--mal')}" opacity="${i===B.length-1?1:.8}"><title>${money(b.amt)}</title></rect><text x="${x+bw/2}" y="${H-7}" text-anchor="middle" font-size="10" fill="${cssv('--dim')}">${new Date(b.date).toLocaleDateString(PT.lang==='ru'?'ru-RU':'en-GB',{day:'numeric',month:'short'})}</text>`});
  return s+'</svg>'}
function x835(b){const cl=b.ids.map(id=>S.claims.find(c=>c.id===id)).filter(Boolean);const dt=b.date.replace(/-/g,'');
  const L1=['ST*835*0001~',`BPR*I*${b.amt.toFixed(2)}*C*ACH*CCP*01*999000111*DA*4400172*NHFVALDORIA**01*888777666*DA*${b.eft.slice(3)}*${dt}~`,`TRN*1*${b.eft}*1990012345~`,`DTM*405*${dt}~`,'N1*PR*NATIONAL HEALTH INSURANCE FUND~'];
  if(!cl.length)L1.push(`* ${T('summary batch',  'сводный реестр')}: ${b.n} ${T('claims','счетов')} *`);
  cl.forEach(c=>{L1.push(`CLP*${c.id}*1*${c.billed.toFixed(2)}*${c.pays.toFixed(2)}*${c.share.toFixed(2)}*MC*${hash(c.id)}~`);if(c.billed-c.allowed>0.5)L1.push(`CAS*CO*45*${(c.billed-c.allowed).toFixed(2)}~`);if(c.share>0)L1.push(`CAS*PR*${c.dedPart>0?1:2}*${c.share.toFixed(2)}~`)});
  L1.push(`SE*${L1.length+1}*0001~`);return L1.join('\n')}

/* ---------- members ---------- */
function rMem(){
  const el=$('#v-mem');const q=(S.mq||'').toLowerCase();const list=S.members.filter(m=>!q||(m.n+' '+m.id).toLowerCase().includes(q));
  const m=mem(S.msel)||S.members[0],p=PLANS[m.plan];const act=iso(NOW)>=m.from&&iso(NOW)<=m.to;const cl=S.claims.filter(c=>c.mem===m.id);
  const BEN=[['Primary care visit','Приём терапевта',p.co+'%','—'],['Laboratory tests','Анализы',p.co+'%','—'],['X-ray & ECG','Рентген и ЭКГ',p.co+'%','—'],['MRI / CT','МРТ / КТ',p.ex.includes('70553')?'✕':p.co+'%',p.ex.includes('70553')?'—':T('required','нужна')],['Inpatient surgery','Стационарная хирургия',p.co+'%',T('required','нужна')],['Preventive & vaccines','Профилактика и прививки','0%','—'],['Cosmetic procedures','Косметология','✕','—']];
  el.innerHTML=`<div class="grid2"><div class="card"><h3>${T('Members','Застрахованные')}</h3><input class="input" id="mQ" value="${esc(S.mq||'')}" placeholder="${T('Name or member ID','Имя или номер полиса')}" style="margin-bottom:10px">
   <div class="mlist">${list.map(x=>`<button class="mi ${x.id===m.id?'on':''}" data-m="${x.id}"><span class="av">${x.n.split(' ').map(w=>w[0]).join('')}</span><div><b>${esc(x.n)}</b><span class="mono">${x.id}</span></div><span class="pill ${iso(NOW)<=x.to?'ok':'bad'}">${L(PLANS[x.plan])}</span></button>`).join('')||`<div class="empty">—</div>`}</div></div>
   <div class="card"><div class="mcard"><div class="row" style="justify-content:space-between"><div class="chip2"></div><b style="letter-spacing:.06em">NHF · ${L(p).toUpperCase()}</b></div>
    <div><small>${T('Member','Застрахованный')}</small><div class="nm">${esc(m.n)}</div><div class="mono" style="font-size:13px;opacity:.9">${m.id}</div></div>
    <div class="row" style="justify-content:space-between;font-size:12px"><span><small>${T('Valid','Действует')}</small><br>${m.from} → ${m.to}</span><span><small>${T('Dependents','Иждивенцы')}</small><br>${m.deps}</span></div></div>
    <div class="row" style="margin:14px 0 6px"><span class="pill ${act?'ok':'bad'}">${act?T('Active','Активен'):T('Terminated','Прекращён')}</span><span class="muted" style="font-size:12.5px">${L(m.emp)} · ${T('born','род.')} ${fmtD(m.dob)}</span><span class="grow"></span><button class="btn sm" id="mChk">⇄ ${T('Eligibility check 270/271','Проверка 270/271')}</button></div>
    ${m.chk?`<div class="elig" style="margin-bottom:8px"><span class="mono">271</span><span>${m.chk.ok?'✓ '+T('Active coverage confirmed','Покрытие подтверждено'):'✕ '+T('No active coverage','Нет активного покрытия')}</span><span class="muted">${new Date(m.chk.t).toLocaleTimeString(PT.lang==='ru'?'ru-RU':'en-GB',{hour:'2-digit',minute:'2-digit'})} · ${m.chk.ms} ms</span></div>`:''}
    <div style="font-size:13px;margin-top:8px">${T('Deductible','Франшиза')} <b>${money(Math.min(m.ded,p.ded))}</b> / ${money(p.ded)}<div class="prog"><i style="width:${Math.min(100,m.ded/p.ded*100)}%"></i></div></div>
    <div style="font-size:13px;margin-top:6px">${T('Out-of-pocket maximum','Лимит личных расходов')} <b>${money(Math.min(m.oop,p.oop))}</b> / ${money(p.oop)}<div class="prog"><i style="width:${Math.min(100,m.oop/p.oop*100)}%;background:linear-gradient(90deg,var(--gold),var(--gold2))"></i></div></div>
    <h3 style="margin-top:14px">${T('Benefits','Льготы плана')}</h3><div class="tw"><table class="t" style="min-width:320px"><thead><tr><th>${T('Service','Услуга')}</th><th class="num">${T('Member pays','Платит пациент')}</th><th>${T('Prior auth','Предавт.')}</th></tr></thead><tbody>${BEN.map(b=>`<tr><td>${T(b[0],b[1])}</td><td class="num">${b[2]==='✕'?`<span class="bad-t" style="color:var(--red)">${T('not covered','не покрыто')}</span>`:b[2]}</td><td>${b[3]}</td></tr>`).join('')}</tbody></table></div>
    <h3 style="margin-top:14px">${T('Claims history','История счетов')} <span class="pill">${cl.length}</span></h3>${cl.length?cl.map(c=>`<div class="row" style="padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px"><span class="mono">${c.id}</span><span class="muted">${fmtD(c.dos)}</span><span class="grow"></span><b>${money(c.pays)}</b>${stPill(c.st)}</div>`).join(''):`<div class="muted" style="font-size:13px">${T('No claims yet','Счетов пока нет')}</div>`}
   </div></div>`;
  $$('[data-m]',el).forEach(b=>b.onclick=()=>{S.msel=b.dataset.m;save();rMem()});
  $('#mQ').oninput=e=>{S.mq=e.target.value;const p=e.target.selectionStart;rMem();const i=$('#mQ');i.focus();i.setSelectionRange(p,p)};
  $('#mChk').onclick=()=>{m.chk={ok:act,t:Date.now(),ms:80+Math.floor(Math.random()*120)};save();rMem();toast(act?T('271: coverage active','271: покрытие активно'):T('271: coverage inactive','271: покрытие неактивно'),act?'':'bad')};
}

/* ---------- wiring ---------- */
$('#menuBtn').onclick=e=>{e.stopPropagation();$('#side').classList.toggle('open')};
document.addEventListener('click',e=>{const sd=$('#side');if(sd.classList.contains('open')&&!sd.contains(e.target)&&e.target.id!=='menuBtn')sd.classList.remove('open')});
$('#reset').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}const u=S.user,r=S.role;S=seed();S.user=u;S.role=r;save();render();toast(T('Demo reset','Демо сброшено'))};
$('#logout').onclick=()=>{S.user=null;save();render()};
PT.onLang(()=>render());
render();
})();
</script>
