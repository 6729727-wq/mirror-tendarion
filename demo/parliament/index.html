<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legisla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1306;font-size:16px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.nav .live{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.grow{flex:1}
.who{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:12.5px;display:flex;gap:10px;align-items:center}
.who .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold2);font-weight:800;flex:none}
.who div{min-width:0}.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.how>div>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold2);flex:none;font-size:13px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:14px;align-items:start}
.grid2b{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f .err{font-size:11.5px;color:var(--red);margin-top:3px}
.input.bad{border-color:var(--red)}
textarea.input{min-height:90px;resize:vertical;font-family:inherit;line-height:1.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:color-mix(in srgb,var(--gold) 16%,transparent);border-color:var(--gold);color:var(--text)}
.bill{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;background:var(--bg2);cursor:pointer;width:100%;text-align:left;color:inherit;display:block}
.bill.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 7%,var(--bg2))}
.bill b{display:block;font-size:14px;margin:3px 0}
.bill .m{font-size:12px;color:var(--muted)}
.mini{display:flex;gap:3px;margin-top:8px}.mini i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.mini i.d{background:var(--mal)}.mini i.c{background:var(--gold)}
.stages{display:flex;gap:0;margin:14px 0;overflow-x:auto;padding-bottom:4px}
.stg{flex:1;min-width:84px;text-align:center;position:relative;font-size:11.5px;color:var(--muted);padding-top:34px}
.stg:before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--line)}
.stg:first-child:before{display:none}
.stg .dot{position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line2);font-weight:800;font-size:12px;z-index:1}
.stg.ok:before,.stg.cur:before{background:var(--mal)}
.stg.ok .dot{background:var(--mal);border-color:var(--mal);color:#fff}
.stg.cur .dot{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 22%,transparent)}
.stg.cur{color:var(--text);font-weight:700}
.stg.fail .dot{background:var(--red);border-color:var(--red);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 12px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--gold)}
.art{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--bg2);font-size:14px;line-height:1.6}
.art .an{font-family:var(--mono);font-size:11.5px;color:var(--gold2);font-weight:600;margin-bottom:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
del{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red);text-decoration:line-through;border-radius:3px;padding:0 2px}
ins{background:color-mix(in srgb,var(--mal) 20%,transparent);color:var(--mal3);text-decoration:none;border-radius:3px;padding:0 2px}
.amd{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--bg2)}
.amd .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:8px}
.amd .diff{font-size:13.5px;line-height:1.6;border-left:3px solid var(--line2);padding-left:10px}
.hemi svg{width:100%;height:auto;display:block;max-width:620px;margin:0 auto}
.tally{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
.tally div{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:var(--bg2)}
.tally b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.tally span{font-size:11.5px;color:var(--muted)}
.vbar{display:flex;height:12px;border-radius:9px;overflow:hidden;background:var(--line);margin:12px 0 4px}
.vbar i{display:block;height:100%;transition:width .3s}
.mybtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.mybtns .btn{justify-content:center;padding:14px 8px;font-size:15px;font-weight:700}
.mybtns .btn.y{border-color:var(--mal);color:var(--mal3)}.mybtns .btn.n{border-color:var(--red);color:var(--red)}.mybtns .btn.a{border-color:var(--amber);color:var(--amber)}
.mybtns .btn.picked{background:var(--panel2);box-shadow:inset 0 0 0 2px currentColor}
.clock{font-family:var(--mono);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.result{border-radius:14px;padding:14px;text-align:center;font-size:18px;font-weight:800;margin-top:12px}
.result.ok{background:color-mix(in srgb,var(--mal) 16%,transparent);color:var(--mal3)}
.result.bad{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);padding:9px 10px;background:var(--bg2);border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line)}
table.t tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:560px;overflow:auto}
.mp{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg2);cursor:pointer;text-align:left;color:inherit;display:flex;gap:9px;align-items:center;min-width:0}
.mp.on{border-color:var(--gold)}
.mp .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;flex:none}
.mp div{min-width:0}.mp b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mp span{font-size:11px;color:var(--muted)}
.prof{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.prof .av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;flex:none}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.stat3 div{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg2)}
.stat3 span{display:block;font-size:11.5px;color:var(--muted)}.stat3 b{font-size:18px}
.vote-y{color:var(--mal3);font-weight:700}.vote-n{color:var(--red);font-weight:700}.vote-a{color:var(--amber);font-weight:700}.vote-x{color:var(--dim)}
.pub{background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 10%,transparent),transparent 240px);border-radius:var(--r2);padding:2px}
.pubhero{padding:22px 20px 10px;text-align:center}
.pubhero h2{margin:6px 0;font-size:24px}
.pubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.party{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.party i{width:11px;height:11px;border-radius:3px;flex:none}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.login{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 500px at 70% 10%,color-mix(in srgb,var(--gold) 12%,transparent),transparent)}
.lbox{width:100%;max-width:440px}.lbox .card{padding:26px}
.lbox h2{margin:12px 0 4px;font-size:22px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.role{border:1px solid var(--line2);border-radius:12px;padding:10px;cursor:pointer;background:var(--bg2);text-align:left;font-size:12.5px;color:inherit}
.role b{display:block;font-size:13.5px}.role.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.hint{font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--gold) 10%,transparent);border:1px dashed color-mix(in srgb,var(--gold) 45%,transparent);border-radius:10px;padding:8px 10px;margin-top:12px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13.5px}
.vline{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;flex-wrap:wrap}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid2b,.intro{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
}
@media (max-width:560px){.how{grid-template-columns:1fr}.kpi .v{font-size:20px}.kpis{gap:10px}.tally{grid-template-columns:repeat(2,minmax(0,1fr))}.roles{grid-template-columns:1fr}.stat3 b{font-size:15px}.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru), L=o=>o?(o[PT.lang]||o.en):'';

   {bill:'B-2026/029',t:{en:'Final vote — Procurement Transparency',ru:'Итоговое голосование — прозрачность закупок'},d:iso(NOW-21*DAY)},

  const votes=past.map((v,i)=>{const rec={};members.forEach(m=>{const pr=PARTIES.find(p=>p.k===m.p);const x=r();
    let want=v.fail?(pr.gov?(pr.k==='LIB'?'N':'Y'):'N'):(pr.gov?'Y':i===0?'Y':'N');

}

/* ---------- diff ---------- */
function wdiff(a,b){const A=a.split(/(\s+)/),B=b.split(/(\s+)/),n=A.length,m=B.length,D=[...Array(n+1)].map(()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)D[i][j]=A[i]===B[j]?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
  let i=0,j=0,o='';while(i<n&&j<m){if(A[i]===B[j]){o+=esc(A[i]);i++;j++}else if(D[i+1][j]>=D[i][j+1]){o+=`<del>${esc(A[i++])}</del>`}else o+=`<ins>${esc(B[j++])}</ins>`}
  while(i<n)o+=`<del>${esc(A[i++])}</del>`;while(j<m)o+=`<ins>${esc(B[j++])}</ins>`;return o.replace(/<\/del><del>/g,'').replace(/<\/ins><ins>/g,'')}
function diffCount(a,b){const t=wdiff(a,b);return{ins:(t.match(/<ins>/g)||[]).length,del:(t.match(/<del>/g)||[]).length}}

/* ---------- plenary vote ---------- */
function seats(){ // hemicycle layout for 151 seats
  const N=S.members.length,rows=8,R0=70,R1=230,pos=[];let tot=0;const rr=[];for(let r=0;r<rows;r++){rr.push(R0+(R1-R0)*r/(rows-1));tot+=rr[r]}
  let left=N;const per=rr.map((r,i)=>{const k=i===rows-1?left:Math.round(N*r/tot);left-=k;return k});
  per.forEach((k,i)=>{for(let j=0;j<k;j++){const a=Math.PI*(j/(k-1||1));pos.push({a,r:rr[i]})}});
  pos.sort((p,q)=>q.a-p.a||p.r-q.r);return pos.map(p=>({x:260-p.r*Math.cos(p.a)*-1*-1,y:250-p.r*Math.sin(p.a),a:p.a,r:p.r})).map(p=>({x:260+p.r*Math.cos(Math.PI-p.a),y:p.y}));
}
let SEATS=null;
function hemi(rec,showParty){SEATS=SEATS||seats();const col={Y:cssv('--mal'),N:cssv('--red'),A:cssv('--amber'),X:cssv('--line2')};
  let s=`<svg viewBox="0 0 520 268" role="img">`;S.members.forEach((m,i)=>{const p=SEATS[i],v=rec[m.id];const f=v?col[v]:showParty?party(m.p).c:cssv('--panel2');
    s+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="7.2" fill="${f}" ${!v&&!showParty?`stroke="${cssv('--line2')}"`:''} opacity="${!v&&showParty?.55:1}"${i===0?` stroke="${cssv('--gold')}" stroke-width="2.5"`:''}><title>${esc(m.n)} · ${m.p}</title></circle>`});
  return s+`<text x="260" y="262" text-anchor="middle" font-size="12" fill="${cssv('--muted')}">${T('Speaker','Спикер')}</text></svg>`}
function rVote(){

    el.innerHTML=`<div class="grid2b"><div class="card"><h3>${T('Chamber','Зал')}<span class="sp"></span><span class="pill">${S.members.length} ${T('seats','мест')}</span></h3><div class="hemi">${hemi({},1)}</div>
     <div class="row" style="justify-content:center;margin-top:6px">${PARTIES.map(p=>`<span class="party"><i style="background:${p.c}"></i>${p.k} ${p.seats}</span>`).join('')}</div></div>
     <div class="card"><h3>${T('Order of business','Повестка')}</h3>${ready.length?ready.map(b=>`<div class="vline"><span class="mono muted">${b.id}</span><b style="flex:1;min-width:150px">${esc(L(b.t))}</b><button class="btn pri sm" data-sch="${b.id}">🗳 ${T('Prepare vote','Подготовить')}</button></div>`).join(''):`<div class="empty">${T('No items ready. Advance a bill to «Final vote».','Нет пунктов. Переведите законопроект на «Итоговое голосование».')}</div>`}
     <h3 style="margin-top:16px">${T('Recent votes','Последние голосования')}</h3>${S.votes.slice().reverse().map(v=>{const c=count(v.rec);return `<div class="vline"><span class="mono muted">${v.id}</span><span style="flex:1;min-width:140px">${esc(L(v.t))}</span><span class="vote-y">${c.Y}</span>·<span class="vote-n">${c.N}</span>·<span class="vote-a">${c.A}</span><span class="pill ${v.res==='adopted'?'ok':'bad'}">${v.res==='adopted'?T('Adopted','Принято'):T('Rejected','Отклонено')}</span></div>`}).join('')}</div></div>`;

  const b=bill(lv.bill),c=count(lv.rec),voted=c.Y+c.N+c.A,N=S.members.length,am=b.stage<4?b.am.find(a=>a.st==='pending'):null;
  const subj=am?T('Amendment ','Поправка ')+am.id+' — '+L(b.t):T('Final vote — ','Итоговое голосование — ')+L(b.t);lv.subj=lv.subj||{en:am?'Amendment '+am.id+' — '+b.t.en:'Final vote — '+b.t.en,ru:am?'Поправка '+am.id+' — '+b.t.ru:'Итоговое голосование — '+b.t.ru};lv.am=am?am.id:null;

   <div style="font-weight:700;margin-bottom:6px">${esc(subj)}</div>

    <div class="mybtns">${[['Y','y','Yes','За'],['N','n','No','Против'],['A','a','Abstain','Возд.']].map(x=>`<button class="btn ${x[1]} ${mine===x[0]?'picked':''}" data-my="${x[0]}" ${lv.state!=='open'?'disabled':''}>${T(x[2],x[3])}</button>`).join('')}</div>
    <div class="row" style="margin-top:14px">${lv.state==='ready'?`<button class="btn pri" id="vOpen">▶ ${T('Open voting','Открыть голосование')}</button>`:lv.state==='open'?`<button class="btn gold" id="vClose">■ ${T('Close voting now','Закрыть сейчас')}</button>`:`<button class="btn pri" id="vDone">✓ ${T('Record result & return','Зафиксировать и вернуться')}</button>`}<button class="btn sm" id="vCancel">${T('Cancel','Отмена')}</button></div>
    <h3 style="margin-top:16px">${T('By group','По фракциям')}</h3><div id="grp"></div></div></div>`;
  paintLive();
  $$('[data-my]',el).forEach(x=>x.onclick=()=>{lv.rec[ME().id]=x.dataset.my;save();$$('[data-my]').forEach(y=>y.classList.toggle('picked',y===x));paintLive();toast(T('Vote recorded: ','Голос учтён: ')+x.textContent)});
  if($('#vOpen'))$('#vOpen').onclick=()=>{lv.state='open';lv.t=0;save();rVote();nav()};
  if($('#vClose'))$('#vClose').onclick=()=>closeVote();
  if($('#vDone'))$('#vDone').onclick=()=>{S.live=null;save();rVote();nav()};
  $('#vCancel').onclick=()=>{S.live=null;save();rVote();nav();toast(T('Vote cancelled','Голосование отменено'),'bad')};
  if(lv.state==='open')timer=setInterval(tick,400);

function tick(){const lv=S.live;if(!lv||lv.state!=='open'||S.view!=='vote'){stopTimer();return}
  lv.t+=1;const b=bill(lv.bill),rem=S.members.filter(m=>!lv.rec[m.id]&&m.id!==ME().id);
  const k=Math.min(rem.length,6+Math.floor(Math.random()*9));
  for(let i=0;i<k;i++){const m=rem.splice(Math.floor(Math.random()*rem.length),1)[0];const p=party(m.p);if(Math.random()>m.att/100+.04)continue;
    const fav=lv.am?(p.k===bill(lv.bill).am.find(a=>a.id===lv.am).by||p.gov===0):p.gov;const x=Math.random();
    lv.rec[m.id]=x<.06?'A':(fav?(x<.92?'Y':'N'):(x<.85?'N':'Y'))}
  if(lv.t>=60||!rem.length){closeVote();return}save();paintLive(true)}
function closeVote(){stopTimer();const lv=S.live;lv.state='closed';S.members.forEach(m=>{if(!lv.rec[m.id])lv.rec[m.id]='X'});
  const c=count(lv.rec),ok=c.Y+c.N+c.A>=76&&c.Y>c.N,b=bill(lv.bill);
  S.votes.push({id:'V-'+(301+S.votes.length),bill:b.id,t:lv.subj,d:iso(NOW),rec:Object.assign({},lv.rec),res:ok?'adopted':'rejected'});
  if(lv.am){const a=b.am.find(x=>x.id===lv.am);if(ok){const cur=b.v[b.v.length-1],na=JSON.parse(JSON.stringify(cur.a));na[a.art]=a.to;b.v.push({lab:{en:`v${b.v.length+1} · with ${a.id}`,ru:`в${b.v.length+1} · с ${a.id}`},a:na});a.st='adopted'}else a.st='rejected'}
  else{if(ok)b.stage=5;else b.failed=1}
  save();if(S.view==='vote')rVote();nav();toast((ok?T('Adopted','Принято'):T('Rejected','Отклонено'))+` · ${c.Y}–${c.N}–${c.A}`,ok?'gold':'bad')}

    <h3 style="margin-top:14px">${T('Bills sponsored by group','Законопроекты фракции')}</h3>${S.bills.filter(b=>b.sp===m.p).map(b=>`<div class="vline"><span class="mono muted">${b.id}</span><span style="flex:1;min-width:140px">${esc(L(b.t))}</span>${stLabel(b)}</div>`).join('')||`<div class="muted" style="font-size:13px">—</div>`}
   </div></div>`;
  $$('[data-m]',el).forEach(x=>x.onclick=()=>{S.msel=x.dataset.m;save();rMembers()});
  $$('[data-mp]',el).forEach(x=>x.onclick=()=>{S.mp=x.dataset.mp;save();rMembers()});
  $('#mQ').oninput=e=>{S.mq=e.target.value;const pp=e.target.selectionStart;rMembers();const i=$('#mQ');i.focus();i.setSelectionRange(pp,pp)};
}

/* ---------- public view ---------- */
function rPublic(){
  const el=$('#v-public');const last=S.votes[S.votes.length-1],c=count(last.rec);
  const enacted=S.bills.filter(b=>b.stage>=5&&!b.failed).length,active=S.bills.filter(b=>!b.failed&&b.stage<5).length;
  el.innerHTML=`<div class="pub"><div class="card"><div class="pubhero"><span class="pill gold">parliament.vd · ${T('public portal','публичный портал')}</span><h2>${T('What your parliament is doing','Чем занят ваш парламент')}</h2><p class="muted" style="margin:0 auto;max-width:520px;font-size:14px">${T('Every bill, every amendment and every vote — published in real time, open data under CC-BY.','Каждый законопроект, поправка и голосование — публикуются в реальном времени, открытые данные CC-BY.')}</p></div>
   <div class="kpis" style="margin-top:12px"><div class="card kpi"><div class="l">${T('Bills in progress','В работе')}</div><div class="v">${active}</div></div><div class="card kpi"><div class="l">${T('Passed this year','Принято за год')}</div><div class="v" style="color:var(--mal3)">${enacted}</div></div><div class="card kpi"><div class="l">${T('Recorded votes','Голосований')}</div><div class="v">${S.votes.length}</div></div><div class="card kpi"><div class="l">${T('Avg. attendance','Посещаемость')}</div><div class="v" style="color:var(--gold2)">${Math.round(S.members.reduce((a,m)=>a+m.att,0)/S.members.length)}%</div></div></div>
   <div class="grid2b"><div class="card"><h3>${T('Latest vote','Последнее голосование')}<span class="sp"></span><span class="pill ${last.res==='adopted'?'ok':'bad'}">${last.res==='adopted'?T('Adopted','Принято'):T('Rejected','Отклонено')}</span></h3><div style="font-weight:700">${esc(L(last.t))}</div><div class="muted" style="font-size:12.5px">${fmtD(last.d)} · ${c.Y} ${T('yes','за')} · ${c.N} ${T('no','против')} · ${c.A} ${T('abstain','возд.')}</div><div class="hemi" style="margin-top:8px">${hemi(last.rec,false)}</div>
    <div class="legend row" style="justify-content:center;font-size:12px"><span class="party"><i style="background:var(--mal)"></i>${T('Yes','За')}</span><span class="party"><i style="background:var(--red)"></i>${T('No','Против')}</span><span class="party"><i style="background:var(--amber)"></i>${T('Abstain','Возд.')}</span><span class="party"><i style="background:var(--line2)"></i>${T('Absent','Отсутств.')}</span></div></div>
   <div class="card"><h3>${T('Seats by party','Места по партиям')}</h3>${PARTIES.map(p=>`<div class="vline"><span class="party" style="flex:1;min-width:0"><i style="background:${p.c}"></i>${L(p.n)}</span><b>${p.seats}</b><span class="pill ${p.gov?'gold':''}">${p.gov?T('Govt','Прав.'):T('Opp.','Опп.')}</span></div>`).join('')}
    <div class="muted" style="font-size:12px;margin-top:8px">${T('Governing coalition: ','Правящая коалиция: ')}<b>${PARTIES.filter(p=>p.gov).reduce((a,p)=>a+p.seats,0)}</b> / 151</div></div></div>
   <h3 style="margin:16px 4px 10px">${T('Bills','Законопроекты')}</h3><div class="pubgrid">${S.bills.map(b=>`<div class="card"><div class="row" style="justify-content:space-between"><span class="mono muted" style="font-size:12px">${b.id}</span>${stLabel(b)}</div><div style="font-weight:700;margin:6px 0">${esc(L(b.t))}</div><div class="mini">${STAGES.map((_,i)=>`<i class="${i<b.stage?'d':i===b.stage&&!b.failed?'c':''}"></i>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn sm" data-pb="${b.id}">${T('Read text & versions','Текст и версии')}</button></div></div>`).join('')}</div>
  </div></div>`;
  $$('[data-pb]',el).forEach(x=>x.onclick=()=>{S.sel=x.dataset.pb;const bb=bill(S.sel);S.va=0;S.vb=bb.v.length-1;S.tab='diff';go('bills')});
}

/* ---------- wiring ---------- */
$('#menuBtn').onclick=e=>{e.stopPropagation();$('#side').classList.toggle('open')};
document.addEventListener('click',e=>{const sd=$('#side');if(sd.classList.contains('open')&&!sd.contains(e.target)&&e.target.id!=='menuBtn')sd.classList.remove('open')});
$('#reset').onclick=()=>{stopTimer();try{localStorage.removeItem(KEY)}catch(e){}const u=S.user,r=S.role;S=seed();S.user=u;S.role=r;save();render();toast(T('Demo reset','Демо сброшено'))};
$('#logout').onclick=()=>{stopTimer();S.user=null;save();render()};
PT.onLang(()=>render());
render();
})();
</script>
