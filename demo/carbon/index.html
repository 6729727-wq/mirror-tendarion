<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarbonLedger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:calc(100vh - 45px)}
.app[hidden],#login[hidden]{display:none}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;font-size:15px;flex:none}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left;min-height:42px}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.grow{flex:1}
.who{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.who b{font-size:13px;overflow-wrap:anywhere}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.how>div>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold2);flex:none;font-size:13px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.card+.card{margin-top:14px}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;overflow-wrap:anywhere}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi .bar{height:4px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}.kpi .bar i{display:block;height:100%}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.grid2>.card+.card,.kpis>.card+.card,.intro>.card+.card{margin-top:0}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.mt{margin-top:14px}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f .input{min-height:42px}
select.input{appearance:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{min-height:38px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px;min-height:32px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td,tbody tr.sel td{background:color-mix(in srgb,var(--mal) 7%,transparent)}
.chart svg,.map svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:none}
.donut .legend{flex-direction:column;gap:6px;flex:1;min-width:150px}
.feed{display:flex;flex-direction:column}
.feed div{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;min-width:0}
.feed div:last-child{border-bottom:none}
.feed .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.feed .q{font-family:var(--mono);font-size:12px;flex:none}
.feed .new{animation:flash 1.6s}
@keyframes flash{from{background:color-mix(in srgb,var(--gold) 25%,transparent)}}
.dotlive{width:8px;height:8px;border-radius:50%;background:var(--mal3);display:inline-block;box-shadow:0 0 0 0 var(--mal3);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.steps{display:flex;margin:6px 0 14px}
.step{flex:1;text-align:center;position:relative;font-size:11.5px;color:var(--muted);min-width:0}
.step:before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line2)}
.step:first-child:before{display:none}
.step i{width:24px;height:24px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line2);position:relative;z-index:1;font-style:normal;font-weight:800;font-size:11px}
.step.ok i{background:var(--mal);border-color:var(--mal);color:#fff}
.step.ok:before,.step.cur:before{background:var(--mal)}
.step.cur i{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 18%,transparent)}
.step span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px;margin:0 0 12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.ser{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere;word-break:break-all}
.res{border:1px solid var(--line2);border-radius:12px;padding:12px;background:var(--bg2);font-size:13px;margin-top:12px}
.res b.big{font-size:24px;display:block;letter-spacing:-.01em}
.dist{display:flex;height:12px;border-radius:8px;overflow:hidden;margin:10px 0 6px;background:var(--line)}
.cert{border:2px solid color-mix(in srgb,var(--gold) 60%,transparent);border-radius:16px;padding:20px;background:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--gold) 14%,transparent),transparent 55%),var(--panel);position:relative;overflow:hidden}
.cert .seal{position:absolute;right:16px;top:16px;width:64px;height:64px;border-radius:50%;border:2px dashed var(--gold);display:grid;place-items:center;color:var(--gold2);font-weight:800;font-size:11px;text-align:center;line-height:1.1;transform:rotate(-12deg)}
.cert h4{margin:0 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);padding-right:76px}
.cert .q{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:8px 0}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13.5px}
.search{display:flex;gap:8px;flex-wrap:wrap}.search .input{flex:1;min-width:0;min-height:44px}
.ex{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.ex button{border:1px dashed var(--line2);background:none;border-radius:8px;padding:4px 8px;cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--muted);max-width:100%;overflow-wrap:anywhere}
.chain{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.chain i{width:14px;height:14px;border-radius:4px;background:var(--mal)}
.chain i.bad{background:var(--red)}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:340px;animation:fade .2s;overflow-wrap:anywhere}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;justify-content:space-between;background:none;border:0;padding:0;text-align:left;width:100%;font-size:12.5px;min-height:28px}
.sw i{width:36px;height:20px;border-radius:20px;background:var(--line2);position:relative;flex:none;transition:.2s}
.sw i:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.sw.on i{background:var(--mal)} .sw.on i:after{left:18px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters .input{width:auto;min-width:0;flex:1 1 150px;min-height:40px}
/* login */
#login{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:28px 16px;background:radial-gradient(900px 500px at 15% 0,color-mix(in srgb,var(--mal) 14%,transparent),transparent 60%),radial-gradient(700px 400px at 100% 100%,color-mix(in srgb,var(--gold) 10%,transparent),transparent 60%)}
.lbox{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);max-width:960px;width:100%;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.lhero{padding:34px;background:linear-gradient(160deg,color-mix(in srgb,var(--mal) 16%,var(--panel)),var(--panel2));border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px;min-width:0}
.lhero h2{margin:0;font-size:28px;letter-spacing:-.02em;line-height:1.15}
.lhero p{margin:0;color:var(--muted);font-size:14px}
.lstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lstats div{border:1px solid var(--line2);border-radius:12px;padding:10px;background:color-mix(in srgb,var(--panel) 70%,transparent)}
.lstats b{display:block;font-size:18px;overflow-wrap:anywhere} .lstats span{font-size:11.5px;color:var(--muted)}
.lform{padding:34px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lform h3{margin:0;font-size:20px}
.roles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.role{border:1px solid var(--line2);border-radius:14px;padding:12px;cursor:pointer;background:var(--bg2);text-align:left;min-width:0}
.role.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 12%,transparent)}
.role b{display:block;font-size:14px} .role span{font-size:12px;color:var(--muted)}
.lnote{font-size:12px;color:var(--dim)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.intro{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
.app{grid-template-columns:minmax(0,1fr)}
.side{position:fixed;left:0;top:45px;z-index:1500;width:270px;max-width:86vw;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
.side.open{transform:none}
.menu-btn{display:inline-flex}
main{padding:14px 14px 50px}
.head h1{font-size:20px}
.lbox{grid-template-columns:minmax(0,1fr)}
.lhero{border-right:0;border-bottom:1px solid var(--line);padding:22px}
.lform{padding:22px}
}
@media (max-width:560px){.how{grid-template-columns:1fr}.fgrid{grid-template-columns:minmax(0,1fr)}.kpi .v{font-size:20px}.kpis{gap:10px}.lhero h2{font-size:22px}.lstats b{font-size:15px}.step span{font-size:10px}.card{padding:14px}.cert .q{font-size:24px}}
@media (max-width:380px){.roles{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
</style>
</head>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const KEY='pt_carbon_state';
const loc=()=>PT.lang==='ru'?'ru-RU':'en-US';
const n0=n=>Math.round(n).toLocaleString(loc());
const tco=n=>n0(n)+' tCO₂e';
const short=n=>{const a=Math.abs(n);if(a>=1e6)return (n/1e6).toFixed(2)+T('M',' млн');if(a>=1e3)return (n/1e3).toFixed(a>=1e5?0:1)+T('k',' тыс.');return n0(n)};
const fmtD=d=>new Date(d).toLocaleDateString(loc(),{day:'numeric',month:'short',year:'numeric'});
const fmtDT=d=>new Date(d).toLocaleString(loc(),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const pad=(n,l=8)=>String(n).padStart(l,'0');
function toast(m,c){const t=document.createElement('div');t.className='toast '+(c||'');t.innerHTML=m;$('#toasts').append(t);setTimeout(()=>t.remove(),3800)}
function hh(s){let a=0x811c9dc5,b=0x1b873593;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,16777619);b=Math.imul(b^c,2246822507)^(b>>>13)}return (a>>>0).toString(16).padStart(8,'0')+(b>>>0).toString(16).padStart(8,'0')}

/* ---------- reference data ---------- */
const REG={nm:['Northmark','Нортмарк',185,78],kh:['Kestrel Highlands','Кестрельское нагорье',292,92],sv:['Serra Valley','Долина Серра',150,148],ac:['Aldencoast','Алденкост',70,170],ld:['Lowmere Delta','Дельта Лоумир',132,232],br:['Brannock','Браннок',236,170],ew:['Eastwold','Иствольд',330,168],pc:['Port Calder','Порт-Колдер',300,238]};
const SEC={energy:['Renewable energy','Возобновляемая энергетика','--mal'],forestry:['Forestry & land use','Леса и землепользование','--gold'],cook:['Clean cookstoves','Чистые печи','--amber'],methane:['Methane capture','Улавливание метана','--violet'],eff:['Energy efficiency','Энергоэффективность','--blue'],transport:['Low-carbon transport','Низкоуглеродный транспорт','--red']};
const PST=[['Draft','Черновик',''],['Under validation','На валидации','warn'],['Registered','Зарегистрирован','ok'],['Suspended','Приостановлен','bad']];
const ATYPE={gov:['Government','Государство'],dev:['Project developer','Разработчик проекта'],buy:['Corporate buyer','Корпоративный покупатель'],intl:['Foreign registry','Зарубежный реестр'],sop:['Adaptation share','Доля на адаптацию'],omge:['OMGE cancellation','Аннулирование OMGE']};
const PUR={ndc:['NDC achievement','Выполнение ОНУВ'],corsia:['CORSIA compliance','Соответствие CORSIA'],vol:['Voluntary claim','Добровольное заявление'],omp:['Other mitigation purpose','Иные цели смягчения']};

<div class="card mt"><h3>${T('Public project register','Публичный реестр проектов')}<span class="sp"></span><button class="btn sm" id="xCsv">${T('Export CSV','Экспорт CSV')}</button></h3><div class="tw"><table><thead><tr><th>ID</th><th>${T('Project','Проект')}</th><th>${T('Sector','Сектор')}</th><th>${T('Status','Статус')}</th><th class="num">${T('Issued','Выпущено')}</th><th class="num">${T('Retired','Погашено')}</th><th class="num">${T('Outstanding','В обращении')}</th></tr></thead><tbody>
${S.projects.map(p=>{const pt=ptot(p.id);return `<tr class="clk" data-xp="${p.id}"><td class="mono">${p.id}</td><td><b>${esc(PN(p))}</b></td><td>${secDot(p.sec)}${T(SEC[p.sec][0],SEC[p.sec][1])}</td><td>${stPill(p.st)}</td><td class="num mono">${n0(pt.iss)}</td><td class="num mono">${n0(pt.ret)}</td><td class="num mono">${n0(pt.act)}</td></tr>`}).join('')}</tbody></table></div></div>`;
const run=v=>{S.q=v;save();RENDER.explorer()};
$('#xGo').onclick=()=>{const v=$('#xQ').value.trim();if(!v){toast(T('Enter a serial number or project','Введите серийный номер или проект'),'bad');return}run(v)};
$('#xQ').onkeydown=e=>{if(e.key==='Enter')$('#xGo').click()};
$$('[data-x]',el).forEach(b=>b.onclick=()=>run(b.dataset.x));
$$('tr[data-xp]',el).forEach(r=>r.onclick=()=>{run(r.dataset.xp);window.scrollTo({top:0,behavior:'smooth'})});
$('#xCsv').onclick=()=>{const rows=[['id','project','sector','status','issued','retired','outstanding']].concat(S.projects.map(p=>{const pt=ptot(p.id);return [p.id,p.n[0],p.sec,PST[p.st][0],pt.iss,pt.ret,pt.act]}));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='carbonledger-projects.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(T('CSV exported','CSV выгружен'))};
};

/* ---------- live market simulation ---------- */
const BEN=[['Aerovel Airways — route offsets','Aerovel Airways — компенсация рейсов'],['Kestrel Cement Works — kiln line 2','Кестрельский цементный завод — печь 2'],['Veloria State Power Utility — green tariff','Госэнергокомпания Велории — зелёный тариф']];
setInterval(()=>{
if(!S.logged||!S.live)return;
const r=Math.random();
if(r<0.55){const pool=S.blocks.filter(b=>b.st==='active'&&A(b.a).t==='dev'&&size(b)>3000);if(!pool.length)return;const b=pool[Math.floor(Math.random()*pool.length)];
const buy=['A-BUY-01','A-BUY-02','A-BUY-03'][Math.floor(Math.random()*3)];const tx=doTransfer(b.id,100*(5+Math.floor(Math.random()*40)),buy);tx.live=true}
else{const pool=S.blocks.filter(b=>b.st==='active'&&A(b.a).t==='buy'&&size(b)>200);if(!pool.length)return;const b=pool[Math.floor(Math.random()*pool.length)];
const i=['A-BUY-01','A-BUY-02','A-BUY-03'].indexOf(b.a);doRetire(b.id,50*(2+Math.floor(Math.random()*Math.min(30,size(b)/50-1))),i===0?'corsia':'vol',BEN[Math.max(0,i)][0]);S.tx[S.tx.length-1].live=true}
save();if(S.view==='dash')RENDER.dash();else if(S.view==='ledger'&&!$('#lRes').innerHTML)RENDER.ledger();
},6500);

/* ---------- shell ---------- */
$$('.role').forEach(b=>b.onclick=()=>{S.role=b.dataset.role;save();render()});
$('#loginBtn').onclick=()=>{if(!$('#lUser').value.trim()||!$('#lPass').value.trim()){toast(T('Enter username and password','Введите имя пользователя и пароль'),'bad');return}
S.logged=true;S.view='dash';save();render();toast(T('Welcome to CarbonLedger','Добро пожаловать в CarbonLedger'),'gold')};
$('#logout').onclick=()=>{S.logged=false;save();render();window.scrollTo({top:0})};
$('#liveSw').onclick=()=>{S.live=!S.live;save();render()};
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#reset').onclick=()=>{try{Object.keys(localStorage).filter(k=>k.startsWith('pt_carbon_')).forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()};
document.addEventListener('click',e=>{const sd=$('#side');if(sd.classList.contains('open')&&!sd.contains(e.target)&&e.target!==$('#menuBtn'))sd.classList.remove('open')});
PT.onLang(()=>render());
document.addEventListener('DOMContentLoaded',()=>render());
})();
</script>
