APP.loginArt=`<svg class="bg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">${[60,140,220,300,380].map(x=>`<line x1="${x}" y1="0" x2="${x}" y2="300" style="stroke:var(--text)" opacity=".07" stroke-width="6"/>`).join('')}${[60,150,240].map(y=>`<line x1="0" y1="${y}" x2="400" y2="${y}" style="stroke:var(--text)" opacity=".07" stroke-width="6"/>`).join('')}<circle cx="220" cy="150" r="46" fill="none" style="stroke:var(--red)" stroke-width="2" opacity=".5"/><circle cx="220" cy="150" r="9" style="fill:var(--red)"/>${[[140,60],[300,240],[60,150]].map(([x,y])=>`<rect x="${x-7}" y="${y-7}" width="14" height="14" rx="3" style="fill:var(--gold)"/>`).join('')}</svg>`;

APP.slug=ROW.slug;APP.name=APP.name||ROW.name;
APP.facts=Object.assign({tender:ROW.title,yb:ROW.year+' · '+ROW.budget,client:[ROW.client[0]+', '+(APP.country||['Republic of Nordania','Республика Нордания'])[0]+' (fictional)',ROW.client[1]+', '+(APP.country||['Republic of Nordania','Республика Нордания'])[1]+' (вымышл.)'],stack:ROW.stack},APP.facts||{});
K.start(APP);
})();
</script>
