<script>
(function(){

(o.buttons||[{t:['Close','Закрыть']}]).forEach(b=>{const e=document.createElement('button');e.className='btn '+(b.cls||'');e.innerHTML=L(b.t);e.onclick=()=>{if(b.fn&&b.fn(ov,close)===false)return;close()};foot.append(e)});

const val=(id,r=document)=>{const e=r.querySelector('#'+id);return e?e.value.trim():''};

function tbl(heads,rows,o={}){

const C=['--mal','--gold','--blue','--violet','--amber','--red','--mal3','--dim'];
const cv=c=>c&&c.startsWith('--')?`var(${c})`:c;
function barChart(items,o={}){
const W=o.w||600,H=o.h||200,P=28,n=items.length,max=o.max||Math.max(1,...items.map(i=>i.v))*1.12,bw=(W-P-6)/n;

for(let g=0;g<=4;g++){const y=6+(H-6)*g/4;s+=`<line x1="${P}" x2="${W}" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-dasharray="3 4"/><text x="${P-4}" y="${y+4}" text-anchor="end" font-size="10" style="fill:var(--dim)">${o.fmt?o.fmt(max*(1-g/4)):fmtN(max*(1-g/4))}</text>`}

s+=`<rect x="${x}" y="${H-h}" width="${w}" height="${Math.max(0,h)}" rx="4" style="fill:${cv(it.c||o.c||'--mal')}"><title>${esc(it.l)}: ${o.fmt?o.fmt(it.v):fmtN(it.v)}</title></rect>`;
if(n<=16||i%Math.ceil(n/12)===0)s+=`<text x="${x+w/2}" y="${H+16}" text-anchor="middle" font-size="10.5" style="fill:var(--muted)">${esc(it.l)}</text>`});
return s+'</svg>';
}
function lineChart(series,labels,o={}){
const W=o.w||600,H=o.h||200,P=34,max=o.max||Math.max(1,...series.flatMap(s=>s.pts))*1.1,min=o.min||0,n=labels.length;
const X=i=>P+(W-P-8)*i/Math.max(1,n-1),Y=v=>6+(H-6)*(1-(v-min)/(max-min));
let s=`<svg viewBox="0 0 ${W} ${H+22}" role="img">`;
for(let g=0;g<=4;g++){const y=6+(H-6)*g/4;s+=`<line x1="${P}" x2="${W}" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-dasharray="3 4"/><text x="${P-4}" y="${y+4}" text-anchor="end" font-size="10" style="fill:var(--dim)">${o.fmt?o.fmt(max-(max-min)*g/4):fmtN(max-(max-min)*g/4)}</text>`}
const step=Math.ceil(n/8);labels.forEach((l,i)=>{if(i%step===0)s+=`<text x="${X(i)}" y="${H+16}" text-anchor="middle" font-size="10.5" style="fill:var(--muted)">${esc(l)}</text>`});

function donut(parts,o={}){

parts.forEach((p,k)=>{const l=c*p.v/tot;s+=`<circle cx="${S/2}" cy="${S/2}" r="${R}" fill="none" style="stroke:${cv(p.c||C[k])}" stroke-width="16" stroke-dasharray="${l} ${c-l}" stroke-dashoffset="${-off}" transform="rotate(-90 ${S/2} ${S/2})"/>`;off+=l});

}
const legend=parts=>`<div class="legend">${parts.map((p,k)=>`<span><i style="background:${cv(p.c||C[k])}"></i>${esc(p.l)}${p.v!=null&&p.show!==false?' · '+(p.fv||fmtN(p.v)):''}</span>`).join('')}</div>`;
function spark(pts,c='--mal',w=120,h=32){const max=Math.max(...pts),min=Math.min(...pts),r=max-min||1;const d=pts.map((v,i)=>(i?'L':'M')+(w*i/(pts.length-1)).toFixed(1)+' '+(h-3-(h-6)*(v-min)/r).toFixed(1)).join(' ');return `<svg viewBox="0 0 ${w} ${h}" style="width:${w}px;height:${h}px"><path d="${d}" fill="none" style="stroke:${cv(c)}" stroke-width="2"/></svg>`}
const hbar=(l,v,max,txt,c)=>`<div class="bar"><span>${l}</span><div class="prog"><i style="width:${clamp(100*v/(max||1),0,100)}%;${c?`background:${cv(c)}`:''}"></i></div><b>${txt!=null?txt:fmtN(v)}</b></div>`;

/* ---------- app shell ---------- */
const K={S:null,app:null,timers:[],arg:null,
key(k){return 'pt_'+K.app.slug+'_'+k},

${a.groups.map(g=>`<div class="sec">${L(g.t)}</div>`+g.views.map(id=>{const w=a.views[id];const n=w.badge?w.badge(K.S):0;return `<button class="nav ${K.cur===id?'on':''}" data-v="${id}"><span class="ic">${w.ic}</span>${L(w.t)}${n?`<span class="cnt">${n}</span>`:''}</button>`}).join('')).join('')}

<div class="who"><span class="av">${esc(u.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</span><div style="min-width:0"><b>${esc(u.name)}</b><span>${L(u.role)}</span></div></div>

const GEO=(()=>{const R=rng(77),g=[];let k=0;for(let c=0;c<8;c++)for(let r=0;r<5;r++){const x=128+c*100,y=26+r*105,w=86,h=90;if(R()<.1){g.push({park:1,x,y,w,h});continue}
const d=x<330?'MAR':y<240?'OLD':x<640?'NOO':'IND';const sp=R()<.35?1:R()<.6?2:4;const parts=sp===1?[[0,0,w,h]]:sp===2?[[0,0,w/2-2,h],[w/2+2,0,w/2-2,h]]:[[0,0,w/2-2,h/2-2],[w/2+2,0,w/2-2,h/2-2],[0,h/2+2,w/2-2,h/2-2],[w/2+2,h/2+2,w/2-2,h/2-2]];
const uses={MAR:sp===1?['apt']:['villa','apt'],OLD:['villa','comm','villa'],NOO:sp===1?['comm','apt']:['comm','apt','land'],IND:['ind','ind','land']}[d];
parts.forEach(p=>{k++;g.push({id:d.slice(0,2)+'-'+String(100+k*7).padStart(4,'0'),d,x:x+p[0],y:y+p[1],w:p[2],h:p[3],use:pick(R,uses),area:Math.round(p[2]*p[3]*(d==='IND'?2.4:.9))})})}return g})();

function chain(S){let prev='0'.repeat(32);S.L.forEach((b,i)=>{b.n=i+1;b.prev=prev;b.h=H(prev+b.n+b.t+b.ty+b.pid+b.p.join('>')+b.amt);prev=b.h})}
function addB(S,b){const last=S.L[S.L.length-1];b.n=S.L.length+1;b.prev=last?last.h:'0'.repeat(32);b.h=H(b.prev+b.n+b.t+b.ty+b.pid+b.p.join('>')+b.amt);S.L.push(b);return b}
const deedNo=(S,t)=>'DLD-'+new Date(t).getFullYear()+'-'+String(S.dseq++).padStart(6,'0');
const APP={ver:1,icon:'🗺️',country:['Emirate of Al Sahil','Эмират Аль-Сахиль'],
org:['Al Sahil Land Department · Real Estate Registry','Земельный департамент Аль-Сахиля · реестр недвижимости'],
tagline:['Find a plot on the map, transfer it in one sitting, and prove its history forever','Найдите участок на карте, оформите сделку за один визит и докажите его историю навсегда'],
lead:['Every plot in the emirate sits on one GIS map backed by a tamper-evident ledger. Conveyancers open the title deed, run a sale through escrow with fees calculated automatically, register mortgages, and both parties e-sign — the new deed is issued the moment the ledger block is written.','Все участки эмирата — на одной ГИС-карте, за которой стоит защищённый от подделки реестр. Нотариус открывает свидетельство о праве, проводит сделку через эскроу с автоматическим расчётом сборов, регистрирует ипотеку, стороны подписывают электронно — новое свидетельство выпускается в момент записи блока.'],
feats:[['GIS property search','Поиск на ГИС-карте'],['Sale wizard with escrow & e-sign','Мастер сделки с эскроу и э-подписью'],['Ledger-anchored title history','История титула в реестре-цепочке']],
users:[{u:'conv.odeh',p:'parcel-2026',name:'Samir Odeh',role:['Licensed conveyancer','Лицензированный нотариус'],home:'map'},{u:'reg.amiri',p:'parcel-2026',name:'Rashid Al Amiri',role:['Registrar, Land Department','Регистратор, земельный департамент'],home:'ledger'}],
home:'map',sso:['Sign in with Sahil Pass','Войти через Sahil Pass'],
how:[['On the <b>Property map</b> click any plot (or search “Khoury”) — see owner, value and encumbrances, then open the <b>Title deed</b> and verify it against the ledger.','На <b>Карте</b> нажмите любой участок (или найдите «Khoury») — владелец, стоимость, обременения; откройте <b>Свидетельство</b> и сверьте его с реестром.'],['Press <b>Start sale</b>: buyer and price, fees, escrow deposit and checks, both parties e-sign — a new deed is issued.','Нажмите <b>Начать сделку</b>: покупатель и цена, сборы, эскроу и проверки, подписи сторон — выдаётся новое свидетельство.'],['Register or release a <b>Mortgage</b>, then follow the plot in the <b>Ledger</b> and run “Verify chain”.','Зарегистрируйте или снимите <b>Ипотеку</b>, затем найдите участок в <b>Реестре</b> и нажмите «Проверить цепочку».']],
groups:[{t:['Property','Недвижимость'],views:['map','deed']},{t:['Transactions','Сделки'],views:['sale','mort']},{t:['Registry','Реестр'],views:['ledger']}],
seed(){const R=rng(9),S={P:{},L:[],dseq:41200,mp:null,sel:null},now=Date.now(),ev=[];
PAR.forEach(g=>{const p={id:g.id,own:pick(R,OWN),val:Math.round(g.area*PPM[g.d]*(.8+R()*.5)/1000)*1000,st:'clear',mort:null,cav:null};S.P[g.id]=p;
let t=now-(9+R()*10)*YR;let o=pick(R,OWN);ev.push({t,ty:'GRANT',pid:g.id,p:[GOV,o],amt:0,by:OFF[1]});
const ns=Math.floor(R()*3);for(let k=0;k<ns;k++){t+=(1+R()*4)*YR;const n=pick(R,OWN.filter(x=>x!==o));const gf=R()<.15;ev.push({t,ty:gf?'GIFT':'SALE',pid:g.id,p:[o,n],amt:gf?0:Math.round(p.val*(.45+.15*k+R()*.2)/1000)*1000,by:pick(R,OFF)});o=n}
if(R()<.32){t=now-(.03+R()*.9)*YR;const n=pick(R,OWN.filter(x=>x!==o));ev.push({t,ty:'SALE',pid:g.id,p:[o,n],amt:Math.round(p.val*(.92+R()*.16)/1000)*1000,by:pick(R,OFF)});o=n}
p.own=o;
if(R()<.38){const tm=t+(.2+R()*2)*YR;if(tm<now){const b=pick(R,BANKS),a=Math.round(p.val*(.4+R()*.35)/1000)*1000;ev.push({t:tm,ty:'MORT',pid:g.id,p:[o,b],amt:a,by:pick(R,OFF)});p.mort={bank:b,amt:a,bal:Math.round(a*(.4+R()*.5)/1000)*1000,t:tm,term:15+Math.floor(R()*3)*5,rate:4.2+Math.round(R()*20)/10};p.st='mort'}}
else if(R()<.06){const tc=now-R()*YR;ev.push({t:tc,ty:'CAV',pid:g.id,p:[CRT,o],amt:0,by:OFF[1]});p.cav={by:CRT,t:tc,why:['Pending civil claim No. 412/'+new Date(tc).getFullYear(),'Гражданский иск № 412/'+new Date(tc).getFullYear()]};p.st='cav'}});
ev.sort((a,b)=>a.t-b.t);S.L=ev;chain(S);
PAR.forEach(g=>{const p=S.P[g.id];const last=S.L.filter(b=>b.pid===g.id&&['GRANT','SALE','GIFT'].includes(b.ty)).pop();p.deed='DLD-'+new Date(last.t).getFullYear()+'-'+String(10000+last.n*13).padStart(6,'0');p.di=last.t;p.anc=last.n});
S.sel=PAR.find(g=>S.P[g.id].own==='Mariam Khoury'&&S.P[g.id].st!=='cav')?.id||PAR[3].id;S.mp=S.sel;S.dp=S.sel;S.lp=S.sel;return S},
tick:{ms:3000,fn(S){const w=S.sw;if(w&&w.step===2&&w.dep&&w.ck<escList(S,w).length){w.ck++;if(w.ck===escList(S,w).length&&K.cur!=='sale')toast(T('Escrow checks complete','Проверки эскроу завершены'))}
S.tk=(S.tk||0)+1;if(S.tk%9===0){const c=PAR.filter(g=>S.P[g.id].st==='clear'&&g.id!==S.sel&&g.id!==S.dp);const g=c[Math.floor(Math.random()*c.length)];if(!g)return;const p=S.P[g.id],n=OWN.filter(x=>x!==p.own)[Math.floor(Math.random()*15)];const pr=Math.round(p.val*(.95+Math.random()*.15)/1000)*1000;const b=addB(S,{t:Date.now(),ty:'SALE',pid:g.id,p:[p.own,n],amt:pr,by:pick(Math.random,OFF)});p.own=n;p.val=pr;p.deed=deedNo(S,b.t);p.di=b.t;p.anc=b.n;S.fresh=b.n}}},
