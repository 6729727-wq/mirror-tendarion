<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Region.Online Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:3px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,var(--mal3),var(--mal2));color:#fff;font-size:15px;box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 40%,transparent)}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.side .grow{flex:1}
.who{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;font-size:12.5px;background:var(--panel)}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--mal));display:grid;place-items:center;font-weight:800;color:#10261d;flex:none}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:23px;margin:0}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;margin-bottom:16px}
.howto{display:flex;gap:10px;flex-wrap:wrap;padding-right:30px !important;background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 14%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--blue) 35%,var(--line));border-radius:var(--r);padding:14px;position:relative}
.howto .st{flex:1;min-width:150px;display:flex;gap:10px;font-size:13px}
.howto .st>b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#1a1306;display:grid;place-items:center;font-size:12px}
.howto .x{position:absolute;top:6px;right:8px;border:0;background:none;cursor:pointer;color:var(--dim);font-size:16px}
.facts{font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;padding:12px 14px;margin:0}
.facts dt{color:var(--dim);font-weight:600}.facts dd{margin:0;font-weight:600}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.btn.sm{padding:6px 12px;font-size:12.5px}.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--panel);cursor:pointer;text-align:left;color:var(--text);font:inherit;transition:.15s;position:relative}
.tile:hover{border-color:var(--mal);transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .i{font-size:26px;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--mal) 14%,transparent);margin-bottom:10px}
.tile b{display:block;font-size:14.5px}.tile small{color:var(--muted);font-size:12.5px}
.tile .off{position:absolute;top:12px;right:12px}
.tile.dis{opacity:.45;cursor:not-allowed}
.f{margin-bottom:10px}.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f .err{color:var(--red);font-size:12px;margin-top:4px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fgrid .full{grid-column:1/-1}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;background:none;font-weight:600;color:var(--muted)}
.chip.on{border-color:var(--mal);color:var(--text);background:color-mix(in srgb,var(--mal) 14%,transparent)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
.sso{max-width:460px;margin:30px auto;text-align:center}
.sso .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 12px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff}
.consent{text-align:left;border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin:14px 0}
.consent label{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center;cursor:pointer}
.consent label:last-child{border:0}
.consent small{margin-left:auto;color:var(--dim);font-size:11.5px}
.map svg{width:100%;height:auto;display:block}
.map .d{cursor:pointer;transition:.15s;stroke:var(--bg);stroke-width:3}
.map .d:hover{filter:brightness(1.15)}
.map text{pointer-events:none;font-weight:700}
.tl{position:relative;padding-left:22px;margin-top:8px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line2)}
.tl .e{position:relative;padding:4px 0 10px;font-size:13px}
.tl .e:before{content:"";position:absolute;left:-19px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--panel2);border:2px solid var(--line2)}
.tl .e.ok:before{background:var(--mal);border-color:var(--mal)}
.tl .e.cur:before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 25%,transparent)}
.tl .e small{display:block;color:var(--dim);font-family:var(--mono);font-size:11px}
.req{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel);margin-bottom:10px}
.req .top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.req .top b{flex:1;min-width:160px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 0;font:inherit;font-size:13px;color:var(--text);cursor:pointer}
.cal button small{display:block;font-size:10px;color:var(--dim)}
.cal button:disabled{opacity:.3;cursor:default}
.cal button.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.slots button{border:1px solid var(--line2);background:none;border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:12.5px;color:var(--text);cursor:pointer}
.slots button.on{background:var(--mal);border-color:var(--mal);color:#fff}
.slots button:disabled{text-decoration:line-through;opacity:.35;cursor:default}
.qpos{font-size:52px;font-weight:800;color:var(--gold2);line-height:1;font-variant-numeric:tabular-nums}
.big-ok{text-align:center;padding:20px 10px}
.big-ok .c{width:68px;height:68px;border-radius:50%;background:var(--mal);color:#fff;font-size:34px;display:grid;place-items:center;margin:0 auto 10px;animation:pop .3s}
.mini{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2)}
.ent{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ent:last-child{border:0}
.ent .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--bg2);flex:none}
.ent .grow{flex:1;min-width:0}
.ent small{display:block;color:var(--dim);font-size:12px}
.sw{position:relative;width:38px;height:22px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line2);transition:.2s;cursor:pointer}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--mal)}
.sw input:checked+i:after{transform:translateX(16px)}
.fb{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--panel);font-size:13px}
.fb .grow{flex:1;min-width:0}
.fb select,.fb input{padding:5px 8px;font-size:12.5px}
.stars{color:var(--gold);letter-spacing:2px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--mal3)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;font:inherit;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--gold)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.on{display:flex}
.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r2);padding:22px;box-shadow:var(--shadow);animation:pop .18s}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.modal h2{margin:0 0 14px;font-size:19px;display:flex;gap:10px;align-items:center}
.modal h2 .x{margin-left:auto;border:0;background:none;color:var(--dim);font-size:20px;cursor:pointer}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:pop .2s}
.toast.bad{border-left-color:var(--red)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--gold);border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px}
@keyframes rot{to{transform:rotate(360deg)}}
.empty{padding:24px;text-align:center;color:var(--muted)}
.warnbox{border:1px solid color-mix(in srgb,var(--amber) 50%,transparent);background:color-mix(in srgb,var(--amber) 9%,transparent);border-radius:10px;padding:9px 12px;font-size:13px;margin-top:8px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.intro{grid-template-columns:minmax(0,1fr)}.grid3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 16px 50px}.head h1{font-size:19px}
}
@media (max-width:560px){.fgrid,.grid3{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.tile{padding:12px}.tile .i{width:38px;height:38px;font-size:20px}.kpi .v{font-size:20px}.qpos{font-size:40px}.cal button{font-size:12px;padding:6px 0}}
</style>
</head>
<body data-demo-en="Region.Online — regional public services portal" data-demo-ru="Регион.Онлайн — региональный портал госуслуг">
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><b>R</b><div><span data-en="Region.Online" data-ru="Регион.Онлайн"></span><small data-en="Northern Province" data-ru="Северная губерния"></small></div></div>
    <div class="sec" data-en="Resident" data-ru="Житель"></div>
    <button class="nav" data-v="home"><span class="ic">⌂</span><span data-en="Services" data-ru="Услуги"></span></button>
    <button class="nav" data-v="cabinet"><span class="ic">◉</span><span data-en="My cabinet" data-ru="Личный кабинет"></span></button>
    <button class="nav" data-v="reqs"><span class="ic">⏱</span><span data-en="My requests" data-ru="Мои заявления"></span><span class="cnt" id="cReq"></span></button>
    <button class="nav" data-v="pays"><span class="ic">₽</span><span data-en="Payments" data-ru="Платежи"></span></button>

    <button class="nav" data-v="catalog"><span class="ic">⚙</span><span data-en="Service catalog" data-ru="Каталог услуг"></span></button>
    <button class="nav" data-v="stats"><span class="ic">▤</span><span data-en="District statistics" data-ru="Статистика районов"></span></button>
    <div class="grow"></div>
    <div class="who" id="who"></div>

  </aside>
  <main>
    <div class="intro" id="intro">
      <div class="howto"><button class="x" id="hideIntro">×</button>
        <div class="st"><b>1</b><span data-en="Sign in with the national SSO — review the consent screen and choose which data to share." data-ru="Войдите через госавторизацию — посмотрите экран согласия и выберите, какими данными поделиться."></span></div>
        <div class="st"><b>2</b><span data-en="Pick a district on the map, then try a service: meter readings (enter 9999 to trigger validation), kindergarten queue, booking, payments." data-ru="Выберите район на карте и попробуйте услугу: показания счётчиков (введите 9999 — сработает проверка), очередь в сад, запись, оплата."></span></div>
        <div class="st"><b>3</b><span data-en="Open <b>Service catalog</b> as admin: switch a service off or add a form field — the resident side changes instantly." data-ru="Откройте <b>Каталог услуг</b>: выключите услугу или добавьте поле в форму — у жителя всё изменится сразу."></span></div>
      </div>
      <dl class="card facts">
        <dt data-en="Tender" data-ru="Тендер"></dt><dd data-en="Regional public services portal" data-ru="Региональный портал госуслуг"></dd>
        <dt data-en="Year" data-ru="Год"></dt><dd>2024</dd>
        <dt data-en="Budget" data-ru="Бюджет"></dt><dd class="mono" style="color:var(--gold2)" data-en="₽ 180 M" data-ru="180 млн ₽"></dd>
        <dt data-en="Client" data-ru="Заказчик"></dt><dd data-en="Ministry of Digital Development, Northern Province (fictional)" data-ru="Министерство цифрового развития Северной губернии (вымышл.)"></dd>
        <dt data-en="Stack" data-ru="Стек"></dt><dd class="mono" style="font-size:12px" data-en="React · Postgres · national SSO · inter-agency bus" data-ru="React · Postgres · госавторизация · СМЭВ-шина"></dd>
      </dl>
    </div>
    <div class="head">
      <button class="btn sm menu-btn" id="menuBtn">☰</button>
      <div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <div class="sp"></div>
      <span id="headRight"></span>
    </div>
    <section class="view" id="v-login"></section>
    <section class="view" id="v-home"></section>
    <section class="view" id="v-cabinet"></section>
    <section class="view" id="v-reqs"></section>
    <section class="view" id="v-pays"></section>
    <section class="view" id="v-catalog"></section>
    <section class="view" id="v-stats"></section>
  </main>
</div>
<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>
<script>
(function(){
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru),L=o=>o?(PT.lang==='ru'?o.ru:o.en):'';
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const KEY='regiononline-v1',DAY=864e5;
const store={load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},save(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}},clear(){try{localStorage.removeItem(KEY)}catch(e){}}};
const money=n=>(PT.lang==='ru'?n.toLocaleString('ru-RU')+' ₽':'₽'+n.toLocaleString('en-US'));
const fmtD=t=>new Date(t).toLocaleDateString(PT.lang==='ru'?'ru-RU':'en-GB',{day:'2-digit',month:'short',year:'numeric'});
const fmtT=t=>new Date(t).toLocaleString(PT.lang==='ru'?'ru-RU':'en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

// districts: abstract polygons
const DIST=[
 {id:'nv',en:'Novoozersk',ru:'Новоозёрск',pts:'20,30 150,12 175,95 95,130 30,110',pop:142},
 {id:'kr',en:'Krasnobor',ru:'Краснобор',pts:'150,12 290,22 300,90 175,95',pop:88},
 {id:'ld',en:'Ledyanoy',ru:'Ледяной',pts:'290,22 400,40 390,130 300,90',pop:41},
 {id:'sv',en:'Severomorsk-2',ru:'Североморск-2',pts:'30,110 95,130 120,210 40,220',pop:63},
 {id:'cn',en:'Central',ru:'Центральный',pts:'95,130 175,95 300,90 280,180 170,205 120,210',pop:310},
 {id:'zr',en:'Zarechny',ru:'Заречный',pts:'300,90 390,130 380,230 280,180',pop:74},
 {id:'pr',en:'Pribrezhny',ru:'Прибрежный',pts:'40,220 120,210 170,205 280,180 380,230 300,268 60,262',pop:96}];
const DB=Object.fromEntries(DIST.map(d=>[d.id,d]));
const SVC={
 meter:{i:'⚡',en:'Utility meter readings',ru:'Показания счётчиков',d:{en:'Water, heat & power — monthly',ru:'Вода, тепло и свет — ежемесячно'}},
 kinder:{i:'🧸',en:'Kindergarten & school enrolment',ru:'Запись в детсад и школу',d:{en:'Live queue position',ru:'Место в очереди онлайн'}},
 book:{i:'📅',en:'Book a local office visit',ru:'Запись на приём',d:{en:'Multifunctional centres',ru:'МФЦ и ведомства района'}},
 pay:{i:'🅿',en:'Parking & regional fees',ru:'Парковка и сборы',d:{en:'Paid zones, fishing permits',ru:'Платные зоны, путёвки на рыбалку'}},
 issue:{i:'🛠',en:'Report a local issue',ru:'Сообщить о проблеме',d:{en:'Potholes, lighting, snow',ru:'Ямы, освещение, снег'}},
 waste:{i:'♻',en:'Bulky waste pickup',ru:'Вывоз крупного мусора',d:{en:'Schedule a free collection',ru:'Бесплатный вывоз по записи'}}};
const STATES=[{en:'Submitted',ru:'Подано'},{en:'Received by agency',ru:'Принято ведомством'},{en:'In progress',ru:'В работе'},{en:'Completed',ru:'Исполнено'}];
function seed(){
  const now=Date.now(),hist=[];const r=rng(9);
  for(let i=11;i>=0;i--){const m=new Date();m.setMonth(m.getMonth()-i-1);hist.push({m:m.getTime(),cold:+(4+r()*2.2).toFixed(1),hot:+(2.4+r()*1.5).toFixed(1),kwh:Math.round(190+r()*90+(i>6?60:0))})}

  S.reqs.forEach(q=>data[S.district].req++);
  const vals=Object.fromEntries(DIST.map(d=>[d.id,data[d.id][metric]]));
  const svcR=Object.keys(SVC).map(k=>{const own=S.ratings.filter(x=>x.svc===k);const base=3.8+r()*1.1,n=Math.round(200+r()*900);const avg=(base*n+own.reduce((a,x)=>a+x.n,0))/(n+own.length);return{k,avg,n:n+own.length}});
  const total=Object.values(data).reduce((a,x)=>a+x.req,0);
  $('#v-stats').innerHTML=`<div class="kpis">${[[T('Requests this month','Заявлений за месяц'),total.toLocaleString(PT.lang==='ru'?'ru-RU':'en-US'),'+9%'],[T('Digital share','Доля онлайн'),'73%',T('+11 pp y/y','+11 п.п. за год')],[T('Avg. satisfaction','Удовлетворённость'),(svcR.reduce((a,x)=>a+x.avg,0)/svcR.length).toFixed(2)+' ★',S.ratings.length+T(' new from you',' новых от вас')],[T('Inter-agency calls','Запросов СМЭВ'),'412k',T('99.97% success','99,97% успешно')]].map(k=>`<div class="card kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="d">${k[2]}</div></div>`).join('')}</div>
  <div class="grid2"><div class="card"><h3>${T('Map','Карта')}<span class="sp"></span><span class="chips">${Object.keys(M).map(k=>`<button class="chip ${metric===k?'on':''}" data-met="${k}">${L(M[k])}</button>`).join('')}</span></h3>${mapSvg(null,vals)}</div>
  <div class="card"><h3>${T('Satisfaction by service','Оценки по услугам')}</h3>${svcR.map(x=>`<div class="ent"><span class="ico">${SVC[x.k].i}</span><div class="grow"><b style="font-size:13px">${L(SVC[x.k])}</b><small>${x.n} ${T('ratings','оценок')}</small></div><span class="stars">${'★'.repeat(Math.round(x.avg))}${'☆'.repeat(5-Math.round(x.avg))}</span><b class="mono">${x.avg.toFixed(2)}</b></div>`).join('')}</div></div>
  <div class="tw" style="margin-top:14px"><table><tr><th>${T('District','Район')}</th><th>${T('Population','Население')}</th><th>${L(M.req)}</th><th>${L(M.sat)}</th><th>${L(M.days)}</th><th>${T('Per 1k residents','На 1 тыс. жителей')}</th></tr>${DIST.map(d=>`<tr><td><b>${L(d)}</b></td><td class="mono">${d.pop}k</td><td class="mono">${data[d.id].req}</td><td><span class="pill ${data[d.id].sat>88?'ok':data[d.id].sat>82?'gold':'warn'}">${data[d.id].sat}%</span></td><td class="mono">${data[d.id].days}</td><td class="mono">${(data[d.id].req/d.pop).toFixed(1)}</td></tr>`).join('')}</table></div>`;
  $$('[data-met]').forEach(b=>b.onclick=()=>{metric=b.dataset.met;rStats()});
  $$('#v-stats [data-dist]').forEach(p=>p.onclick=()=>toast(L(DB[p.dataset.dist])+': '+data[p.dataset.dist][metric]+' · '+L(M[metric])));
}
PT.onLang(()=>{closeModal();render()});
go(view);
})();
