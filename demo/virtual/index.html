<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;font-size:17px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.grow{flex:1}
.who{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:12.5px;display:flex;gap:10px;align-items:center}
.who i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--mal) 22%,transparent);color:var(--mal3);font-style:normal;font-weight:800;flex:none}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.btn.redf{background:var(--red);border-color:var(--red);color:#fff}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f .err{color:var(--red);font-size:11.5px;margin-top:3px;min-height:0}
.input.bad{border-color:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.chip.red.on{background:color-mix(in srgb,var(--red) 16%,transparent);border-color:var(--red);color:var(--red)}
.tri{border-radius:14px;padding:14px;border:1px solid var(--line2);background:var(--bg2)}
.tri.em{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.tri.ur{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 10%,transparent)}
.tri.ro{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 10%,transparent)}
.tri b.l{font-size:20px;display:block}
.meter{height:10px;border-radius:9px;background:linear-gradient(90deg,var(--mal),var(--amber),var(--red));position:relative;margin:10px 0 4px}
.meter i{position:absolute;top:-4px;width:4px;height:18px;border-radius:3px;background:var(--text);transition:left .3s}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.slot{padding:8px 0;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-family:var(--mono);font-size:13px}
.slot.on{background:var(--mal);color:#fff;border-color:var(--mal)}
.slot:disabled{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:12px}
.doc{border:1px solid var(--line2);border-radius:12px;padding:10px;cursor:pointer;background:var(--bg2);text-align:left;display:flex;gap:10px;align-items:center}
.doc.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 10%,transparent)}
.doc i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-style:normal;font-weight:800;flex:none;font-size:12px}
.doc b{display:block;font-size:13px}.doc span{font-size:11.5px;color:var(--muted)}
.ap{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--bg2);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ap .dt{text-align:center;min-width:54px;border-right:1px solid var(--line);padding-right:12px}
.ap .dt b{display:block;font-size:20px;line-height:1}.ap .dt span{font-size:11px;color:var(--muted);text-transform:uppercase}
.ap .mid{flex:1;min-width:160px}
.ap .mid b{display:block}.ap .mid span{font-size:12.5px;color:var(--muted)}
.call{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.stage{position:relative;border-radius:18px;overflow:hidden;background:#0b1a24;aspect-ratio:16/10;border:1px solid var(--line2)}
.stage svg.remote{width:100%;height:100%;display:block}
.pip{position:absolute;right:12px;bottom:70px;width:26%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.5);background:#1d2b36;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.pip svg{width:100%;height:100%}
.ovl{position:absolute;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;right:12px}
.ovl span{background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:4px 10px;border-radius:999px;font-weight:600}
.ctrl{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:10px}
.ctrl button{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(6px)}
.ctrl button.off{background:#fff;color:#111}
.ctrl button.end{background:var(--red);width:58px;border-radius:24px}
.mouth{transform-origin:center;transform-box:fill-box}
.talk .mouth{animation:talk .28s infinite alternate}
@keyframes talk{to{transform:scaleY(2.6)}}
.chat{height:220px;overflow:auto;display:flex;flex-direction:column;gap:6px;font-size:13px;padding:2px}
.msg{max-width:85%;padding:7px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:color-mix(in srgb,var(--mal) 40%,transparent)}
.msg small{display:block;color:var(--dim);font-size:10.5px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td,tbody tr.sel td{background:color-mix(in srgb,var(--mal) 7%,transparent)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%}
.rx{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--bg2);display:flex;gap:12px;align-items:flex-start}
.rx .body{flex:1;min-width:0}
.rx .body b{display:block}.rx .body span{font-size:12.5px;color:var(--muted)}
.qr{display:grid;grid-template-columns:repeat(17,1fr);width:84px;height:84px;background:#fff;padding:4px;border-radius:8px;flex:none}
.qr i{background:#0b1512}.qr s{background:#fff}
.alert{border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px;border:1px solid}
.alert.hi{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.alert.mo{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 10%,transparent)}
.map svg{width:100%;height:auto;display:block}
.map .node{cursor:pointer}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sp-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.sp-row span{flex:1;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.chart svg{width:100%;height:auto;display:block}
.log{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-height:180px;overflow:auto}
.log div{padding:2px 0}.log .t{color:var(--dim)}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.gate{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 500px at 20% 0%,color-mix(in srgb,var(--mal) 14%,transparent),transparent),var(--bg)}
.gate .box{width:100%;max-width:420px}
.gate .logo{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.gate .logo b{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;font-size:24px}
.gate h2{margin:0;font-size:22px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13.5px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.call{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}.kpi .v{font-size:20px}.kpis{gap:10px}.pip{width:34%;bottom:66px}.ctrl button{width:40px;height:40px;font-size:16px}.ctrl button.end{width:52px}.ap .dt{border:0;padding:0}.rx{flex-wrap:wrap}}

</head>

function triage(){
  const t=S.tri;const sel=SYM.filter(s=>t.sym.includes(s[0]));
  let score=sel.reduce((a,s)=>a+s[3],0)+(t.sev-1)*2+(DUR.find(d=>d[0]===t.dur)||[0,0,0,0])[3];
  if(t.age>=70||t.age<2)score+=2;
  const red=[];
  if(t.sym.includes('weak'))red.push(['Possible stroke signs (FAST)','Возможные признаки инсульта (FAST)']);
  if(t.sym.includes('chest')&&(t.sym.includes('sob')||t.sev>=4))red.push(['Chest pain with breathlessness or high severity','Боль в груди с одышкой или высокой интенсивностью']);
  const level=red.length||score>=16?'em':score>=8?'ur':'ro';
  const cnt={};sel.forEach(s=>cnt[s[4]]=(cnt[s[4]]||0)+s[3]);
  const spec=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||'gp';
  return{score,level,spec,red};
}

function slotsFor(spec,level){
  const r=rng(spec.length*97+(level==='ur'?7:3));const now=Date.now();const days=level==='ur'?[0,1]:[1,2,3];const out=[];
  days.forEach(d=>{const ts=[];for(let h=8;h<18;h++)for(const m of [0,30]){const t=addDays(d,h,m);if(t<now+30*60000)continue;ts.push({t,busy:r()<.35||S.appts.some(a=>a.when===t&&a.status!=='cancel')})}if(ts.length)out.push({d,ts})});
  return out;
}

  <rect class="mouth" x="308" y="222" width="24" height="5" rx="2.5" fill="#7b3b30"/></svg>`}
function rCall(){
  const el=$('#v-call');stopTimer();
  const c=S.call;
  if(!c){const nx=S.appts.filter(a=>a.status==='booked');el.innerHTML=`<div class="card"><div class="empty"><div style="font-size:42px">🎥</div>${T('No active consultation.','Нет активной консультации.')}<div class="row" style="justify-content:center;margin-top:12px">${nx.map(a=>`<button class="btn pri sm" data-join="${a.id}">${T('Start','Начать')} ${a.id} · ${fmtT(a.when)}</button>`).join('')||`<button class="btn sm" id="gb">${T('Book a consult','Записаться')}</button>`}</div></div></div>`;
    $$('[data-join]',el).forEach(b=>b.onclick=()=>startCall(b.dataset.join));const gb=$('#gb',el);if(gb)gb.onclick=()=>go('book');return}
  const a=S.appts.find(x=>x.id===c.id);const d=DOCS[a.spec][a.doc]||DOCS[a.spec][0];
  el.innerHTML=`<div class="call"><div class="stack"><div class="stage" id="stage">${docSVG()}
   <div class="ovl"><span>● REC · <b id="ctime">00:00</b></span><span>${T(d[0],d[1])}</span><span id="qual">${'▮'.repeat(c.q)}${'▯'.repeat(5-c.q)} ${c.q>=4?'HD 720p':'SD 360p'}</span>${c.share?`<span style="background:var(--mal)">🖥 ${T('Sharing lab results','Показ анализов')}</span>`:''}${!c.mic?`<span style="background:var(--red)">🔇 ${T('You are muted','Микрофон выключен')}</span>`:''}</div>
   <div class="pip">${c.cam?`<svg viewBox="0 0 160 120"><rect width="160" height="120" fill="#33424e"/><circle cx="80" cy="52" r="22" fill="#d9a77d"/><path d="M58 40 q22-30 44 0 q-4-14-22-16 q-18 2-22 16z" fill="#3a2a22"/><path d="M40 120 q4-38 40-38 q36 0 40 38z" fill="#5b8fb0"/></svg>`:'MS'}</div>
   <div class="ctrl"><button id="cMic" class="${c.mic?'':'off'}" title="Mic">${c.mic?'🎙':'🔇'}</button><button id="cCam" class="${c.cam?'':'off'}" title="Camera">${c.cam?'📷':'🚫'}</button><button id="cShare" class="${c.share?'off':''}" title="Share">🖥</button><button id="cEnd" class="end" title="End">✆</button></div></div>
   <div class="card"><h3>${T('Clinical notes (clinician view)','Клинические заметки (вид врача)')}<span class="sp"></span><span class="pill">FHIR Encounter · ${a.id}</span></h3>
    <div class="fgrid"><div class="f"><label>${T('Diagnosis (ICD-10)','Диагноз (МКБ-10)')}</label><select class="input" id="dx"><option value="">${T('— select —','— выберите —')}</option>${DX.map(x=>`<option value="${x[0]}" ${c.dx===x[0]?'selected':''}>${x[0]} · ${T(x[1],x[2])}</option>`).join('')}</select></div>
    <div class="f"><label>${T('Reason for visit','Причина обращения')}</label><div style="font-size:13px;padding-top:6px">${a.reason?esc(T(a.reason[0],a.reason[1])):'—'}</div></div>
    <div class="f full"><label>${T('Notes','Заметки')}</label><textarea class="input" id="cnotes" rows="3">${esc(c.notes)}</textarea></div></div>
    <div class="row" style="margin-top:10px"><button class="btn sm" id="saveN">${T('Save notes','Сохранить')}</button><button class="btn gold sm" id="toRx">💊 ${T('Write e-prescription','Выписать эл. рецепт')}</button></div></div></div>
   <div class="card"><h3>💬 ${T('Chat','Чат')}<span class="sp"></span><span class="pill ok">${T('End-to-end encrypted','Сквозное шифрование')}</span></h3>
    <div class="chat" id="chat">${c.chat.map(m=>`<div class="msg ${m.me?'me':''}"><small>${m.me?T('You','Вы'):T(d[0],d[1])} · ${fmtT(m.t)}</small>${esc(m.me?m.txt:T(m.en,m.ru))}</div>`).join('')}</div>
    <div class="row" style="margin-top:10px;flex-wrap:nowrap"><input class="input" id="chIn" placeholder="${T('Type a message…','Сообщение…')}"><button class="btn pri sm" id="chSend">➤</button></div>
    <div style="margin-top:14px;font-size:12.5px" class="muted">${T('Vitals shared from home kit','Показатели с домашнего набора')}</div>
    <div class="row" style="margin-top:6px;font-size:13px"><span class="pill">🌡 37.9°C</span><span class="pill">❤ 88 bpm</span><span class="pill">SpO₂ 97%</span><span class="pill">🩸 128/82</span></div></div></div>`;
  const tick=()=>{const e=$('#ctime');if(!e||!S.call){stopTimer();return}const s=Math.floor((Date.now()-S.call.start)/1000);e.textContent=pad(Math.floor(s/60))+':'+pad(s%60)};tick();timer=setInterval(tick,1000);
  const ch=$('#chat',el);ch.scrollTop=ch.scrollHeight;
  $('#cMic',el).onclick=()=>{c.mic=!c.mic;save();rCall()};$('#cCam',el).onclick=()=>{c.cam=!c.cam;save();rCall()};
  $('#cShare',el).onclick=()=>{c.share=!c.share;save();rCall()};
  $('#cEnd',el).onclick=()=>{a.status='done';a.dx=c.dx||a.dx;a.notes=c.notes;S.call=null;save();toast(T('Consultation ended · summary saved to record','Консультация завершена · итог в медкарте'));go('visits')};
  $('#dx',el).onchange=e=>{c.dx=e.target.value;save()};$('#cnotes',el).oninput=e=>{c.notes=e.target.value;save()};
  $('#saveN',el).onclick=()=>{save();toast(T('Notes saved to encounter','Заметки сохранены'))};
  $('#toRx',el).onclick=()=>{const dx=DX.find(x=>x[0]===c.dx);S.draft={drug:dx?dx[3]:'parac',str:'',dose:1,freq:'BD',days:7,ref:0,ph:0,note:'',ovr:false,reason:''};S.draft.str=DRUGS[S.draft.drug][2][0];save();go('rx')};
  const send=()=>{const i=$('#chIn',el);const v=i.value.trim();if(!v)return;c.chat.push({me:1,txt:v,t:Date.now()});save();rCall();
    const st=$('#stage');if(st)st.classList.add('talk');
    setTimeout(()=>{if(!S.call||S.call.id!==c.id)return;const k=c.chat.filter(m=>!m.me).length-1;const rp=REPL[Math.min(k,REPL.length-1)];c.chat.push({me:0,en:rp[0],ru:rp[1],t:Date.now()});c.q=3+Math.floor(Math.random()*3);save();if(S.view==='call'){rCall();const s2=$('#stage');if(s2){s2.classList.add('talk');setTimeout(()=>s2.classList.remove('talk'),1800)}}},1100)};
  $('#chSend',el).onclick=send;$('#chIn',el).onkeydown=e=>{if(e.key==='Enter')send()};
}

/* ---------- E-PRESCRIPTIONS ---------- */
const RST={iss:['Issued','Выписан','gold'],disp:['Dispensed','Выдан','ok'],canc:['Cancelled','Отменён','bad']};
function qr(seedS){const r=rng([...seedS].reduce((a,c)=>a+c.charCodeAt(0)*31,7));let h='';for(let y=0;y<17;y++)for(let x=0;x<17;x++){const f=(x<5&&y<5)||(x>11&&y<5)||(x<5&&y>11);const v=f?((x%4===0||y%4===0||(x>11&&(x-12)%4===0)||(y>11&&(y-12)%4===0))||(x%4===2&&y%4===2)):r()<.5;h+=v?'<i></i>':'<s></s>'}return `<div class="qr">${h}</div>`}
function rRx(){
  const el=$('#v-rx');if(!S.draft)S.draft={drug:'parac',str:'500 mg',dose:1,freq:'BD',days:5,ref:0,ph:0,note:'',ovr:false,reason:''};
  const D=S.draft;const dg=DRUGS[D.drug];const it=dg[5].filter(k=>CUR_MEDS.some(m=>m[0]===k)).map(k=>INTER[k]);
  const fq=FREQ.find(f=>f[0]===D.freq);const qty=D.dose*fq[3]*D.days;const flt=S.rxF||'all';
  const list=S.rx.filter(r=>flt==='all'||r.status===flt);
  el.innerHTML=`<div class="grid2"><div class="card"><h3>${T('New e-prescription','Новый эл. рецепт')}<span class="sp"></span><span class="pill">${T('Patient','Пациент')}: Mona Saleh · 34</span></h3>
   <div class="fgrid">
    <div class="f"><label>${T('Medicine','Препарат')}</label><select class="input" id="rDrug">${Object.entries(DRUGS).map(([k,v])=>`<option value="${k}" ${D.drug===k?'selected':''}>${T(v[0],v[1])}</option>`).join('')}</select></div>
    <div class="f"><label>${T('Strength','Дозировка')}</label><select class="input" id="rStr">${dg[2].map(s=>`<option ${D.str===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="f"><label>${T('Dose (units)','Доза (ед.)')}</label><input class="input" id="rDose" type="number" min="1" max="4" value="${D.dose}"><div class="err" id="eDose"></div></div>
    <div class="f"><label>${T('Frequency','Частота')}</label><select class="input" id="rFreq">${FREQ.map(f=>`<option value="${f[0]}" ${D.freq===f[0]?'selected':''}>${f[0]} · ${T(f[1],f[2])}</option>`).join('')}</select></div>
    <div class="f"><label>${T('Duration (days)','Курс (дней)')}</label><input class="input" id="rDays" type="number" min="1" max="90" value="${D.days}"><div class="err" id="eDays"></div></div>
    <div class="f"><label>${T('Repeats','Повторы')}</label><select class="input" id="rRef">${[0,1,2,3].map(n=>`<option ${D.ref===n?'selected':''}>${n}</option>`).join('')}</select></div>
    <div class="f full"><label>${T('Pharmacy','Аптека')}</label><select class="input" id="rPh">${PHARM.map((p,i)=>`<option value="${i}" ${D.ph===i?'selected':''}>${T(p[0],p[1])}</option>`).join('')}</select></div>
    <div class="f full"><label>${T('Instructions for patient','Указания пациенту')}</label><input class="input" id="rNote" value="${esc(D.note)}" placeholder="${T('e.g. take after food','напр. после еды')}"></div>
   </div>
   <div style="margin-top:10px;font-size:13px">${T('Total quantity','Всего')}: <b class="mono">${qty} ${T(dg[3],dg[4])}</b> · ${T('Checked against current medicines','Проверено с текущими лекарствами')}: ${CUR_MEDS.map(m=>T(m[1],m[2])).join(', ')}</div>
   ${it.length?it.map(x=>`<div class="alert ${x[2]}">⚠ ${T(x[0],x[1])}</div>`).join('')+(it.some(x=>x[2]==='hi')?`<label class="row" style="margin-top:8px;font-size:13px"><input type="checkbox" id="rOvr" ${D.ovr?'checked':''}> ${T('Override with clinical reason','Переопределить с обоснованием')}</label><input class="input" id="rReason" style="margin-top:6px" value="${esc(D.reason)}" placeholder="${T('Clinical reason (min 10 chars)','Обоснование (мин. 10 символов)')}">`:''):`<div class="alert" style="border-color:var(--mal)">✓ ${T('No interactions with current medicines','Взаимодействий с текущими лекарствами нет')}</div>`}
   <div class="row" style="margin-top:12px"><button class="btn pri" id="rSign">✍ ${T('Sign & issue','Подписать и выписать')}</button><span class="muted" style="font-size:12px" id="rErr"></span></div></div>
  <div class="card"><h3>${T('Prescriptions','Рецепты')}<span class="sp"></span><div class="chips">${[['all','All','Все'],['iss','Issued','Выписаны'],['disp','Dispensed','Выданы'],['canc','Cancelled','Отменены']].map(f=>`<button class="chip ${flt===f[0]?'on':''}" data-rf="${f[0]}">${T(f[1],f[2])}</button>`).join('')}</div></h3>
   ${list.map(r=>{const g=DRUGS[r.drug];const f=FREQ.find(x=>x[0]===r.freq);return `<div class="rx">${qr(r.id)}<div class="body"><div class="row"><b style="flex:1">${T(g[0],g[1])} ${r.str}</b><span class="pill ${RST[r.status][2]}">${T(RST[r.status][0],RST[r.status][1])}</span></div><span>${r.dose} ${T(g[3],g[4])} · ${T(f[1],f[2])} · ${r.days} ${T('days','дн.')} · ${T('repeats','повт.')} ${r.ref}</span><br><span class="mono">${r.id}</span> <span>· ${T(r.doc[0],r.doc[1])} · ${T(PHARM[r.ph][0],PHARM[r.ph][1])}</span>
   ${r.status==='iss'?`<div class="row" style="margin-top:8px"><button class="btn sm" data-disp="${r.id}">✓ ${T('Pharmacy: dispense','Аптека: выдать')}</button><button class="btn sm danger" data-canc="${r.id}">${T('Cancel','Отменить')}</button></div>`:''}</div></div>`}).join('')||`<div class="empty">${T('No prescriptions','Нет рецептов')}</div>`}</div></div>`;
  const upd=(k,v)=>{D[k]=v;save();rRx()};
  $('#rDrug',el).onchange=e=>{D.drug=e.target.value;D.str=DRUGS[D.drug][2][0];D.ovr=false;save();rRx()};
  $('#rStr',el).onchange=e=>upd('str',e.target.value);$('#rFreq',el).onchange=e=>upd('freq',e.target.value);
  $('#rRef',el).onchange=e=>upd('ref',+e.target.value);$('#rPh',el).onchange=e=>upd('ph',+e.target.value);
  $('#rDose',el).onchange=e=>upd('dose',Math.max(0,+e.target.value||0));$('#rDays',el).onchange=e=>upd('days',Math.max(0,+e.target.value||0));
  $('#rNote',el).oninput=e=>{D.note=e.target.value;save()};
  const ov=$('#rOvr',el);if(ov)ov.onchange=()=>{D.ovr=ov.checked;save()};const rs=$('#rReason',el);if(rs)rs.oninput=e=>{D.reason=e.target.value;save()};
  $$('[data-rf]',el).forEach(b=>b.onclick=()=>{S.rxF=b.dataset.rf;save();rRx()});
  $('#rSign',el).onclick=()=>{let ok=true;
    if(D.dose<1||D.dose>4){$('#eDose',el).textContent=T('1–4 units','1–4 ед.');$('#rDose',el).classList.add('bad');ok=false}
    if(D.days<1||D.days>90){$('#eDays',el).textContent=T('1–90 days','1–90 дней');$('#rDays',el).classList.add('bad');ok=false}
    if(it.some(x=>x[2]==='hi')&&(!D.ovr||D.reason.trim().length<10)){$('#rErr',el).textContent=T('High-risk interaction: tick override and give a reason','Опасное взаимодействие: отметьте переопределение и укажите причину');ok=false}
    if(!ok)return;
    const doc=S.appts.find(a=>a.status==='live'||a.status==='done');const dn=doc?(DOCS[doc.spec][doc.doc]||DOCS[doc.spec][0]):DOCS.gp[0];
    const r={id:'RX-'+(S.nextRx++),drug:D.drug,str:D.str,dose:D.dose,freq:D.freq,days:D.days,ref:D.ref,ph:D.ph,status:'iss',date:Date.now(),doc:dn};
    S.rx.unshift(r);S.draft=null;S.rxF='all';save();render();toast(T('E-prescription ','Эл. рецепт ')+r.id+T(' signed and sent to pharmacy',' подписан и отправлен в аптеку'))};
  $$('[data-disp]',el).forEach(b=>b.onclick=()=>{S.rx.find(r=>r.id===b.dataset.disp).status='disp';save();render();toast(T('Dispensed at pharmacy','Выдан в аптеке'))});
  $$('[data-canc]',el).forEach(b=>b.onclick=()=>{S.rx.find(r=>r.id===b.dataset.canc).status='canc';save();render();toast(T('Prescription cancelled','Рецепт отменён'),'bad')});
}

/* ---------- SPECIALIST NETWORK MAP ---------- */
function rNet(){

  const f=S.mapSpec;const cnt=id=>Object.entries(S.online[id]).filter(([s])=>f==='all'||s===f).reduce((a,[,n])=>a+n,0);
  const hub=HOSP[0];
  const nodes=HOSP.map(h=>{const n=cnt(h[0]);const has=f==='all'||h[6].includes(f);const r=h[5]==='hub'?20:h[5]==='clinic'?9:13;const col=h[5]==='hub'?g:has?m:ln;

  <div class="grid2"><div class="card map"><h3>${T('Hub-and-spoke network','Сеть «хаб — филиалы»')}<span class="sp"></span><span class="legend"><span><i style="background:${g}"></i>${T('Virtual hub','Вирт. хаб')}</span><span><i style="background:${m}"></i>${T('Hospital / clinic','Больница / клиника')}</span><span><i style="background:${bl}"></i>${T('Tele-link','Телесвязь')}</span></span></h3>
   <svg viewBox="0 0 620 420"><path d="M60 120 L140 40 L260 30 L360 50 L450 90 L560 120 L590 210 L560 300 L560 360 L470 395 L340 400 L230 380 L150 330 L80 280 L40 200Z" fill="${pn}" stroke="${ln}" stroke-width="2"/><path d="M60 120 L40 200 L80 280" stroke="${bl}" stroke-width="5" fill="none" opacity=".25"/>${links}${nodes}</svg>
   <div class="muted" style="font-size:12px">${T('Numbers = specialists online now','Числа — специалисты онлайн сейчас')} · ${T('total','всего')} <b>${total}</b></div></div>
  <div class="card"><h3>${T(sel[1],sel[2])}<span class="sp"></span><span class="pill ${sel[5]==='hub'?'gold':''}">${sel[5]==='hub'?T('Virtual hub','Вирт. хаб'):sel[5]==='clinic'?T('Rural clinic','Сельская клиника'):T('Hospital','Больница')}</span></h3>
   <div class="row" style="font-size:12.5px;margin-bottom:8px"><span class="pill">${T('Beds','Койки')} ${hs.occ}/${hs.beds}</span><span class="pill">${T('ER wait','Ожидание')} ${hs.er} ${T('min','мин')}</span><span class="pill">${T('Virtual ward','Вирт. палата')} ${hs.vw}</span></div>
   ${sel[6].map(s=>{const n=S.online[sel[0]][s];return `<div class="sp-row"><span>${SPECS[s][2]} ${T(SPECS[s][0],SPECS[s][1])}</span><span class="dot" style="background:${n?m:cssv('--red')};flex:none"></span><b class="mono" style="width:24px;text-align:right">${n}</b><button class="btn sm" data-bk="${s}" ${n?'':'disabled'}>${T('Book','Записаться')}</button><button class="btn sm" data-tg="${s}" title="toggle">${n?'−':'+'}</button></div>`}).join('')}
   <div class="muted" style="font-size:12px;margin-top:10px">${T('“−/+” simulates a specialist going off / on shift.','«−/+» — специалист уходит со смены / выходит на смену.')}</div></div></div>`;
  $$('[data-sf]',el).forEach(b=>b.onclick=()=>{S.mapSpec=b.dataset.sf;save();rNet()});
  $$('.node',el).forEach(n=>n.onclick=()=>{S.mapSel=n.dataset.h;save();rNet()});
  $$('[data-bk]',el).forEach(b=>b.onclick=()=>{const s=b.dataset.bk;const sym=SYM.find(x=>x[4]===s);S.tri={sym:sym?[sym[0]]:[],sev:2,dur:'d3',age:34,notes:''};S.res=triage();S.res.spec=s;if(S.res.level==='em')S.res.level='ur';S.doc=0;S.slot=null;save();go('book')});
  $$('[data-tg]',el).forEach(b=>b.onclick=()=>{const s=b.dataset.tg;const o=S.online[sel[0]];o[s]=o[s]?o[s]-1:2;save();render()});
}

/* ---------- CAPACITY ---------- */
function rCap(){
  const el=$('#v-cap');const H=S.hosp;const m=cssv('--mal'),g=cssv('--gold'),rd=cssv('--red'),am=cssv('--amber'),ln=cssv('--line'),mu=cssv('--dim');
  const tb=H.reduce((a,h)=>a+h.beds,0),to=H.reduce((a,h)=>a+h.occ,0),ti=H.reduce((a,h)=>a+h.icu,0),tio=H.reduce((a,h)=>a+h.icuOcc,0),vw=H.reduce((a,h)=>a+h.vw,0);
  const pc=(a,b)=>b?Math.round(a/b*100):0;const col=p=>p>=90?rd:p>=80?am:m;
  const tr=S.trend.slice();tr[tr.length-1]=+(to/tb*100).toFixed(1);
  const W=600,Hh=200,P=30,xs=i=>P+i*(W-P-10)/(tr.length-1),ys=v=>Hh-24-(v-60)/(100-60)*(Hh-40);
  const path=tr.map((v,i)=>(i?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1)).join(' ');
  const grid=[60,70,80,90,100].map(v=>`<line x1="${P}" x2="${W-10}" y1="${ys(v)}" y2="${ys(v)}" stroke="${ln}"/><text x="${P-6}" y="${ys(v)+4}" font-size="10" text-anchor="end" fill="${mu}">${v}%</text>`).join('');
  const surge=`<rect x="${P}" y="${ys(100)}" width="${W-P-10}" height="${ys(90)-ys(100)}" fill="${rd}" opacity=".08"/><text x="${W-14}" y="${ys(95)+4}" font-size="10" text-anchor="end" fill="${rd}">${T('surge zone','зона перегрузки')}</text>`;
  el.innerHTML=`<div class="kpis"><div class="card kpi"><div class="l">${T('Bed occupancy','Занятость коек')}</div><div class="v" style="color:${col(pc(to,tb))}">${pc(to,tb)}%</div><div class="d">${to.toLocaleString()} / ${tb.toLocaleString()}</div></div><div class="card kpi"><div class="l">${T('ICU occupancy','Занятость ОРИТ')}</div><div class="v" style="color:${col(pc(tio,ti))}">${pc(tio,ti)}%</div><div class="d">${tio} / ${ti}</div></div><div class="card kpi"><div class="l">${T('Virtual ward patients','Пациенты вирт. палат')}</div><div class="v">${vw}</div><div class="d">${T('remote monitoring','удалённый мониторинг')}</div></div><div class="card kpi"><div class="l">${T('Sites in surge','Площадок в перегрузке')}</div><div class="v" style="color:${rd}">${H.filter(h=>pc(h.occ,h.beds)>=90).length}</div><div class="d">≥ 90%</div></div></div>
  <div class="grid2"><div class="stack"><div class="card"><h3>${T('Capacity by site','Загрузка по площадкам')}<span class="sp"></span><span class="muted" style="font-size:12px;font-weight:500">${T('Click a row to adjust','Нажмите строку для правки')}</span></h3>
   <div class="tw"><table><thead><tr><th>${T('Site','Площадка')}</th><th>${T('Beds','Койки')}</th><th></th><th>${T('ICU','ОРИТ')}</th><th>${T('ER wait','Ожидание')}</th><th>${T('Status','Статус')}</th></tr></thead><tbody>
   ${H.map(h=>{const hh=HOSP.find(x=>x[0]===h.id);const p=pc(h.occ,h.beds),pi=pc(h.icuOcc,h.icu);return `<tr class="clk ${S.capSel===h.id?'sel':''}" data-cs="${h.id}"><td><b>${esc(T(hh[1],hh[2]))}</b></td><td class="mono">${h.occ}/${h.beds}</td><td><div class="bar"><i style="width:${p}%;background:${col(p)}"></i></div></td><td class="mono">${h.icu?h.icuOcc+'/'+h.icu:'—'}</td><td class="mono">${h.er}′</td><td><span class="pill ${p>=90?'bad':p>=80?'warn':'ok'}">${p>=90?T('Surge','Перегрузка'):p>=80?T('High','Высокая'):T('Normal','Норма')}</span></td></tr>`+(S.capSel===h.id?`<tr><td colspan="6" style="white-space:normal;background:var(--bg2)"><div class="row"><span style="font-size:12.5px">${T('Occupied beds','Занято коек')}</span><button class="btn sm" data-adj="-5">−5</button><button class="btn sm" data-adj="5">+5</button><span style="font-size:12.5px;margin-left:10px">${T('ICU','ОРИТ')}</span><button class="btn sm" data-ai="-1" ${h.icu?'':'disabled'}>−1</button><button class="btn sm" data-ai="1" ${h.icu?'':'disabled'}>+1</button><button class="btn sm" data-vw="1">+${T('virtual ward','вирт. палата')}</button></div></td></tr>`:'')}).join('')}</tbody></table></div></div>
   <div class="card chart"><h3>${T('National occupancy · 21 days','Занятость по стране · 21 день')}</h3><svg viewBox="0 0 ${W} ${Hh}">${surge}${grid}<path d="${path} L${xs(tr.length-1)} ${Hh-24} L${P} ${Hh-24}Z" fill="${m}" opacity=".12"/><path d="${path}" fill="none" stroke="${m}" stroke-width="2.5"/>${tr.map((v,i)=>i===tr.length-1?`<circle cx="${xs(i)}" cy="${ys(v)}" r="5" fill="${g}"/><text x="${xs(i)-6}" y="${ys(v)-10}" font-size="11" font-weight="700" text-anchor="end" fill="${g}">${v}%</text>`:'').join('')}</svg></div></div>
  <div class="stack"><div class="card"><h3>🚑 ${T('Transfer a patient','Перевод пациента')}</h3>
   <div class="fgrid"><div class="f full"><label>${T('From','Откуда')}</label><select class="input" id="xFrom">${HOSP.map(h=>`<option value="${h[0]}">${esc(T(h[1],h[2]))}</option>`).join('')}</select></div>
   <div class="f full"><label>${T('To','Куда')}</label><select class="input" id="xTo">${HOSP.map((h,i)=>`<option value="${h[0]}" ${i===1?'selected':''}>${esc(T(h[1],h[2]))}</option>`).join('')}</select></div>
   <div class="f full"><label class="row" style="cursor:pointer;color:var(--text)"><input type="checkbox" id="xIcu"> ${T('Needs ICU bed','Нужна койка ОРИТ')}</label></div></div>
   <div class="row" style="margin-top:8px"><button class="btn pri" id="xGo">${T('Request transfer','Запросить перевод')}</button></div><div class="err" id="xErr" style="color:var(--red);font-size:12.5px;margin-top:6px"></div></div>
   <div class="card"><h3>${T('Transfer log','Журнал переводов')}</h3><div class="log">${S.xlog.map(x=>`<div><span class="t">${fmtT(x.t)}</span> ${esc(T(x.en,x.ru))}</div>`).join('')||`<div class="t">${T('No transfers yet','Переводов пока нет')}</div>`}</div></div></div></div>`;
  $$('[data-cs]',el).forEach(r=>r.onclick=()=>{S.capSel=S.capSel===r.dataset.cs?null:r.dataset.cs;save();rCap()});
  const h=H.find(x=>x.id===S.capSel);
  $$('[data-adj]',el).forEach(b=>b.onclick=()=>{h.occ=Math.max(0,Math.min(h.beds,h.occ+ +b.dataset.adj));save();rCap()});
  $$('[data-ai]',el).forEach(b=>b.onclick=()=>{h.icuOcc=Math.max(0,Math.min(h.icu,h.icuOcc+ +b.dataset.ai));save();rCap()});
  $$('[data-vw]',el).forEach(b=>b.onclick=()=>{if(h.occ>0){h.occ--;h.vw++;save();rCap();toast(T('Patient moved to virtual ward — bed released','Пациент переведён в вирт. палату — койка освобождена'))}});
  $('#xGo',el).onclick=()=>{const f=$('#xFrom',el).value,t=$('#xTo',el).value,icu=$('#xIcu',el).checked;const A=H.find(x=>x.id===f),B=H.find(x=>x.id===t);const e=$('#xErr',el);
    if(f===t){e.textContent=T('Choose two different sites','Выберите разные площадки');return}
    if(icu&&B.icuOcc>=B.icu){e.textContent=T('No free ICU bed at destination','В пункте назначения нет свободной койки ОРИТ');return}
    if(!icu&&B.occ>=B.beds){e.textContent=T('Destination is full','Пункт назначения заполнен');return}
    if(icu){if(A.icuOcc>0)A.icuOcc--;B.icuOcc++}else{if(A.occ>0)A.occ--;B.occ++}
    const a=HOSP.find(x=>x[0]===f),b=HOSP.find(x=>x[0]===t);
    S.xlog.unshift({t:Date.now(),en:`${icu?'ICU ':''}transfer ${a[1]} → ${b[1]}`,ru:`Перевод${icu?' (ОРИТ)':''} ${a[2]} → ${b[2]}`});save();rCap();toast(T('Transfer accepted · ambulance dispatched','Перевод принят · скорая выехала'))};
}

$$('#gate [data-role]').forEach(b=>b.onclick=()=>{S.role=b.dataset.role;$('#lgU').value=S.role==='pat'?'patient.demo@virtuacare.gov':'ops.demo@moh.gov';save();render()});
$('#login').onclick=()=>{if(!$('#lgU').value.trim()||!$('#lgP').value){toast(T('Enter login and password','Введите логин и пароль'),'bad');return}S.auth=true;S.view=S.role==='min'?'cap':'book';save();render();toast(T('Signed in · welcome to VirtuaCare','Вход выполнен · добро пожаловать в VirtuaCare'))};
$('#logout').onclick=()=>{S.auth=false;stopTimer();save();render()};
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#reset').onclick=()=>{stopTimer();store.clear();S=seed();S.auth=true;save();render();toast(T('Demo reset','Демо сброшено'))};
PT.onLang(()=>render());
document.addEventListener('DOMContentLoaded',()=>render());
})();
</script>
