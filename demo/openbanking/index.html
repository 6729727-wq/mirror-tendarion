<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenRail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--mal));color:#06140f;font-size:16px;flex:none}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.grow{flex:1}
.who{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:13px;display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--mal) 22%,transparent);color:var(--mal3);font-weight:800;font-size:13px;flex:none}
.who small{display:block;color:var(--muted);font-size:11.5px}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.how>div>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold2);flex:none;font-size:13px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.card{min-width:0}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.btn.blk{width:100%;justify-content:center}
.err{color:var(--red);font-size:12.5px;min-height:18px;margin-top:6px}
.ok-t{color:var(--mal3)} .bad-t{color:var(--red)} .warn-t{color:var(--amber)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.search{max-width:280px}
/* login */
.loginv{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 500px at 75% 0%,color-mix(in srgb,var(--gold) 12%,transparent),transparent),radial-gradient(700px 400px at 0% 100%,color-mix(in srgb,var(--mal) 14%,transparent),transparent)}
.login{width:100%;max-width:440px;padding:26px}
.login h2{margin:6px 0 4px;font-size:21px}
.login .f{margin-top:12px}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.role{border:1px solid var(--line2);border-radius:12px;background:var(--bg2);padding:10px 6px;cursor:pointer;font-size:12px;font-weight:600;text-align:center}
.role b{display:block;font-size:18px}
.role.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 12%,transparent)}
.secure{display:flex;gap:8px;font-size:12px;color:var(--muted);margin-top:14px;align-items:center;justify-content:center;flex-wrap:wrap}
/* catalogue */
.apis{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.api{display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:.15s}
.api:hover{border-color:var(--mal)}
.api .top{display:flex;gap:10px;align-items:center}
.api .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--mal) 14%,transparent);flex:none}
.api h4{margin:0;font-size:15px}
.api p{margin:0;font-size:13px;color:var(--muted);line-height:1.45;flex:1}
.api .meta{display:flex;gap:6px;flex-wrap:wrap}
.ep{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;flex-wrap:wrap}
.ep:last-child{border-bottom:0}
.ep code{font-family:var(--mono);font-size:12.5px;word-break:break-all;flex:1;min-width:140px}
.m{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;min-width:52px;text-align:center;flex:none}
.m.GET{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue)}
.m.POST{background:color-mix(in srgb,var(--mal) 18%,transparent);color:var(--mal3)}
.m.DELETE{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
/* console */
.con{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
pre.code{font-family:var(--mono);font-size:12px;line-height:1.55;background:#08110e;color:#cfe6dc;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0;overflow:auto;max-height:440px;white-space:pre}
[data-theme=light] pre.code{background:#0d1a16}
pre.code .k{color:#7fd6ff} pre.code .s{color:#f3d79a} pre.code .n{color:#a5f3c8} pre.code .c{color:#6f8a80}
.resh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:13px}
textarea.input{font-family:var(--mono);font-size:12px;min-height:110px;resize:vertical}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 12px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--mal)}
.tok{font-family:var(--mono);font-size:11.5px;word-break:break-all;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
/* consent journey */
.steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.st{flex:1;min-width:110px;display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600;color:var(--dim);padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.st b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:11.5px;flex:none;color:var(--text)}
.st.on{color:var(--text);border-color:var(--mal)}
.st.on b{background:var(--mal);color:#fff}
.st.done b{background:var(--mal2);color:#fff}
.phone{max-width:380px;margin:0 auto;border:8px solid #1c2a25;border-radius:34px;background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
.phone .bar{height:26px;background:#1c2a25;display:flex;justify-content:center;align-items:center}
.phone .bar i{width:70px;height:6px;border-radius:6px;background:#2f413a}
.scr{padding:18px 16px;min-height:430px;display:flex;flex-direction:column;gap:10px}
.scr h4{margin:0;font-size:17px}
.tpp{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px}
.logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.perm{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;cursor:pointer}
.perm:last-child{border-bottom:0}
.perm input{margin-top:3px;accent-color:var(--mal);width:17px;height:17px;flex:none}
.perm small{display:block;color:var(--muted)}
.acc{display:flex;gap:10px;align-items:center;border:1px solid var(--line2);border-radius:12px;padding:10px;cursor:pointer;font-size:13px}
.acc.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 10%,transparent)}
.acc span{flex:1;min-width:0}
.otp{display:flex;gap:8px;justify-content:center}
.otp input{width:42px;height:50px;text-align:center;font-size:22px;font-weight:700;padding:0}
.bankh{display:flex;align-items:center;gap:8px;font-weight:800;padding-bottom:8px;border-bottom:1px solid var(--line)}
.cons{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.cons:last-child{border-bottom:0}
.cons .b{flex:1;min-width:180px}
.cons .b small{display:block;color:var(--muted);font-size:12px}
.log{font-family:var(--mono);font-size:11.5px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-height:190px;overflow:auto}
.log div{padding:2px 0;white-space:nowrap}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mal3);box-shadow:0 0 10px var(--mal3);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
.bars{display:flex;flex-direction:column;gap:9px}
.bars div{display:grid;grid-template-columns:120px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:12.5px}
.bars i{display:block;height:9px;border-radius:9px;background:linear-gradient(90deg,var(--mal2),var(--mal3))}
.bars em{font-style:normal;font-family:var(--mono);text-align:right}
.drawer{position:fixed;inset:0;z-index:2500;background:rgba(0,0,0,.45);display:flex;justify-content:flex-end}
.drawer .in{width:min(460px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line2);padding:20px;overflow:auto;animation:slide .2s}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.split,.intro,.con{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
}
@media (max-width:560px){.how{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}.kpis{gap:10px}.kpi .v{font-size:19px}.card{padding:14px}.login{padding:20px}.phone{border-width:5px;border-radius:26px}.bars div{grid-template-columns:86px minmax(0,1fr) 54px}.search{max-width:none;width:100%}.st{min-width:0;flex:1 1 40%}}
</style>
</head>
<body data-demo-en="OpenRail — open banking API platform &amp; consent" data-demo-ru="OpenRail — платформа open banking и согласий">
<div class="loginv" id="loginV">
  <div class="card login">
    <div class="brand" style="padding:0 0 6px"><b>⇄</b><div>OpenRail<small data-en="National open banking hub · Central Bank" data-ru="Национальный хаб open banking · Центральный банк"></small></div></div>
    <h2 data-en="Sign in to OpenRail" data-ru="Вход в OpenRail"></h2>
    <div class="muted" style="font-size:13px" data-en="Demo credentials are prefilled. Pick a starting role — all roles are available inside." data-ru="Демо-данные уже заполнены. Выберите стартовую роль — внутри доступны все роли."></div>
    <div class="f"><label data-en="Email" data-ru="Почта"></label><input class="input" id="lgU" value="dev@fintrack.demo" autocomplete="username"></div>
    <div class="f"><label data-en="Password" data-ru="Пароль"></label><input class="input" id="lgP" type="password" value="openrail-demo" autocomplete="current-password"></div>
    <div class="f"><label data-en="Start as" data-ru="Начать как"></label>
      <div class="roles" id="roles">
        <button class="role on" data-role="cat"><b>🧑‍💻</b><span data-en="Developer" data-ru="Разработчик"></span></button>
        <button class="role" data-role="journey"><b>🙋</b><span data-en="Customer" data-ru="Клиент"></span></button>
        <button class="role" data-role="traffic"><b>🏦</b><span data-en="Regulator" data-ru="Регулятор"></span></button>
      </div></div>
    <div class="err" id="lgErr"></div>
    <button class="btn pri blk" id="login" data-en="Sign in with demo account" data-ru="Войти в демо-аккаунт"></button>
    <div class="secure"><span>🔐 FAPI 2.0 · mTLS · PKCE</span></div>
  </div>
</div>
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><b>⇄</b><div>OpenRail<small data-en="Open banking hub" data-ru="Хаб open banking"></small></div></div>
    <div class="sec" data-en="Developer portal" data-ru="Портал разработчика"></div><div id="navD"></div>
    <div class="sec" data-en="Customer" data-ru="Клиент"></div><div id="navC"></div>
    <div class="sec" data-en="Bank &amp; regulator" data-ru="Банк и регулятор"></div><div id="navB"></div>
    <div class="grow"></div>
    <div class="who"><div class="av">FT</div><div style="min-width:0">FinTrack Ltd<small data-en="TPP · AISP + PISP" data-ru="TPP · AISP + PISP"></small></div></div>
    <button class="btn sm blk" id="logout" style="margin-top:8px" data-en="Sign out" data-ru="Выйти"></button>
    <button class="btn sm blk" id="reset" style="margin-top:6px" data-en="Reset demo" data-ru="Сбросить демо"></button>
  </aside>
  <main>
    <div class="head">
      <button class="btn sm menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <div class="sp"></div>
      <span class="pill ok"><span class="live"></span>&nbsp;<span data-en="Sandbox · all systems normal" data-ru="Песочница · всё работает"></span></span>
    </div>
    <div class="intro">
      <div class="card"><h3 data-en="How to try it" data-ru="Как попробовать"></h3>
        <div class="how">
          <div><b>1</b><span data-en="Browse the <b>API catalogue</b>, open an endpoint and run it in the <b>Try-it console</b> — get a token, send, read the JSON." data-ru="Откройте <b>каталог API</b>, выберите метод и выполните его в <b>консоли</b> — получите токен, отправьте запрос, посмотрите JSON."></span></div>
          <div><b>2</b><span data-en="As a customer, walk the <b>Consent journey</b>: app asks, bank authenticates you, you pick accounts and approve. Revoke it in <b>My consents</b>." data-ru="Как клиент пройдите <b>путь согласия</b>: приложение просит, банк проверяет вас, вы выбираете счета и одобряете. Отзовите в <b>Моих согласиях</b>."></span></div>
          <div><b>3</b><span data-en="As the regulator, watch <b>API traffic</b> live and manage the <b>TPP registry</b>: approve applicants, suspend misbehaving apps." data-ru="Как регулятор смотрите <b>трафик API</b> в реальном времени и ведите <b>реестр TPP</b>: одобряйте заявки, приостанавливайте нарушителей."></span></div>
        </div></div>
      <div class="card"><dl class="facts">
        <dt data-en="Tender" data-ru="Тендер"></dt><dd data-en="Open banking API platform &amp; consent" data-ru="Платформа open banking и согласий"></dd>
        <dt data-en="Year · budget" data-ru="Год · бюджет"></dt><dd>2025 · $75M</dd>
        <dt data-en="Client" data-ru="Заказчик"></dt><dd data-en="Central bank (fictional)" data-ru="Центральный банк (вымышл.)"></dd>
        <dt data-en="Stack" data-ru="Стек"></dt><dd>FAPI · OAuth 2 · API gateway</dd>
      </dl></div>
    </div>
    <section class="view" id="v-cat"></section>
    <section class="view" id="v-try"></section>
    <section class="view" id="v-journey"></section>
    <section class="view" id="v-mine"></section>
    <section class="view" id="v-traffic"></section>
    <section class="view" id="v-tpp"></section>
  </main>
</div>
<div class="toasts" id="toasts"></div>
<div id="drawerRoot"></div>
<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const P='pt_openbanking_';
const store={load(){try{return JSON.parse(localStorage.getItem(P+'state'))}catch(e){return null}},save(){try{localStorage.setItem(P+'state',JSON.stringify(S))}catch(e){}},clear(){try{Object.keys(localStorage).filter(k=>k.indexOf(P)===0).forEach(k=>localStorage.removeItem(k))}catch(e){}}};
const loc=()=>PT.lang==='ru'?'ru-RU':'en-GB';
const num=(n,d=0)=>Number(n).toLocaleString(loc(),{minimumFractionDigits:d,maximumFractionDigits:d});
const NOW0=Date.parse('2026-11-17T10:30:00');
const now=()=>Date.now();
const fmtD=t=>new Date(t).toLocaleDateString(loc(),{day:'numeric',month:'short',year:'numeric'});
const fmtT=t=>new Date(t).toLocaleString(loc(),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

function lineChart(o){const W=o.w||640,H=o.h||220,pl=46,pr=14,pt=12,pb=26;const all=o.series.flatMap(s=>s.v);let mn=o.min!=null?o.min:Math.min(...all),mx=Math.max(...all);if(mx===mn)mx=mn+1;const pad=(mx-mn)*.12;if(o.min==null)mn-=pad;mx+=pad;
  const n=o.series[0].v.length,X=i=>pl+(W-pl-pr)*i/(n-1),Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));let g='';
  for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4,y=Y(v).toFixed(1);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="${cssv('--line')}"/><text x="${pl-6}" y="${+y+4}" text-anchor="end" font-size="10.5" fill="${cssv('--dim')}">${o.fmt(v)}</text>`}
  o.labels.forEach((l,i)=>{if(l)g+=`<text x="${X(i)}" y="${H-7}" text-anchor="middle" font-size="10.5" fill="${cssv('--dim')}">${l}</text>`});
  if(o.th!=null){const y=Y(o.th);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="${cssv('--red')}" stroke-dasharray="5 4"/><text x="${W-pr}" y="${y-5}" text-anchor="end" font-size="10.5" fill="${cssv('--red')}" font-weight="700">${o.thL}</text>`}
  o.series.forEach(s=>{const pts=s.v.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1));if(s.fill)g+=`<path d="M${X(0)},${H-pb} L${pts.join(' L')} L${X(n-1)},${H-pb} Z" fill="${s.c}" opacity=".13"/>`;
    g+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${s.c}" stroke-width="2.4" stroke-linejoin="round"/>`;s.v.forEach((v,i)=>{g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i===n-1?4.5:2.5}" fill="${s.c}"><title>${o.labels[i]||''} ${o.fmt(v)}</title></circle>`})});
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`}
function barChart(o){const W=o.w||640,H=o.h||200,pl=44,pr=10,pt=10,pb=26;const mx=Math.max(1,...o.series.flatMap(s=>s.v))*1.1;const n=o.labels.length,gw=(W-pl-pr)/n,bw=Math.max(2,gw*.7/o.series.length);let g='';
  for(let k=0;k<=3;k++){const v=mx*k/3,y=pt+(H-pt-pb)*(1-k/3);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="${cssv('--line')}"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10.5" fill="${cssv('--dim')}">${o.fmt(v)}</text>`}
  o.labels.forEach((l,i)=>{o.series.forEach((s,j)=>{const v=s.v[i],h=(H-pt-pb)*v/mx,x=pl+gw*i+gw*.15+bw*j;g+=`<rect x="${x.toFixed(1)}" y="${(H-pb-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${s.c}"><title>${l}: ${o.fmt(v)}</title></rect>`});
    if(l)g+=`<text x="${pl+gw*i+gw/2}" y="${H-7}" text-anchor="middle" font-size="10.5" fill="${cssv('--dim')}">${l}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`}
function donut(parts){const R=54,C=2*Math.PI*R;let off=0,g='';const tot=parts.reduce((a,p)=>a+p.v,0)||1;
  parts.forEach(p=>{const L=C*p.v/tot;g+=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${p.c}" stroke-width="20" stroke-dasharray="${L.toFixed(2)} ${(C-L).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`;off+=L});
  return `<svg viewBox="0 0 140 140" width="140" height="140" style="flex:none">${g}<text x="70" y="68" text-anchor="middle" font-size="18" font-weight="800" fill="${cssv('--text')}">${num(tot/1e6,1)}M</text><text x="70" y="86" text-anchor="middle" font-size="10" fill="${cssv('--muted')}">${T('calls/day','вызовов/день')}</text></svg>`}

  el.innerHTML=`<div class="kpis"><div class="card kpi"><div class="l">${T('API calls today','Вызовов API сегодня')}</div><div class="v" id="tToday">${num(tr.today)}</div><div class="d"><span class="live"></span> ${T('live','онлайн')}</div></div>
   <div class="card kpi"><div class="l">${T('p95 latency','Задержка p95')}</div><div class="v">${tr.lat[n-1]} ms</div><div class="d">${T('SLA 500 ms','SLA 500 мс')}</div></div>
   <div class="card kpi"><div class="l">${T('Error rate (5xx+4xx)','Доля ошибок (5xx+4xx)')}</div><div class="v ${tr.err[n-1]>1?'bad-t':''}">${num(tr.err[n-1],2)}%</div><div class="d">${T('availability','доступность')} ${num(ok,2)}%</div></div>
   <div class="card kpi"><div class="l">${T('Active consents','Активных согласий')}</div><div class="v">${num(1840000+S.consents.filter(c=>c.st==='active').length)}</div><div class="d">${act.length} ${T('active TPPs','активных TPP')}</div></div></div>
  <div class="grid2"><div class="card chart"><h3>${T('API calls per day, millions','Вызовов API в день, млн')}<span class="sp"></span><span class="chips">${[7,14].map(d=>`<button class="chip ${days===d?'on':''}" data-rd="${d}">${d} ${T('days','дн.')}</button>`).join('')}</span></h3>
    ${barChart({labels:lb,series:[{v:sl(tr.traffic),c:cssv('--mal')}],fmt:v=>num(v,1),h:210})}</div>
   <div class="card"><h3>${T('Traffic by API','Трафик по API')}</h3><div class="row" style="flex-wrap:nowrap;gap:16px">${donut([{v:1.62e6,c:cssv('--mal')},{v:.71e6,c:cssv('--gold')},{v:.29e6,c:cssv('--blue')},{v:.14e6,c:cssv('--violet')},{v:.08e6,c:cssv('--dim')}])}
    <div class="legend" style="flex-direction:column;gap:6px">${[['AIS',57,'--mal'],['PIS',25,'--gold'],['CoF',10,'--blue'],['VRP',5,'--violet'],[T('Open data','Откр. данные'),3,'--dim']].map(x=>`<span><i style="background:${cssv(x[2])}"></i>${x[0]} · ${x[1]}%</span>`).join('')}</div></div></div></div>
  <div class="grid2"><div class="card chart"><h3>${T('p95 latency, ms','Задержка p95, мс')}<span class="sp"></span><span class="legend"><span><i style="background:${cssv('--blue')}"></i>p95</span><span><i style="background:${cssv('--red')}"></i>${T('error rate %','ошибки %')}</span></span></h3>
    ${lineChart({series:[{v:sl(tr.lat),c:cssv('--blue'),fill:1}],labels:lb,fmt:v=>Math.round(v),min:0,th:500,thL:'SLA 500 ms'})}
    ${lineChart({series:[{v:sl(tr.err),c:cssv('--red')}],labels:lb,fmt:v=>num(v,1)+'%',min:0,h:150})}
    <div class="muted" style="font-size:12px">${T('Spike on day 10: NorthCrest gateway certificate rotation (incident INC-2291, resolved).','Всплеск на 10-й день: смена сертификата шлюза NorthCrest (инцидент INC-2291, закрыт).')}</div></div>
   <div class="card"><h3>${T('Top TPPs by calls today','Топ TPP по вызовам сегодня')}</h3><div class="bars">${top.slice(0,6).map(t=>`<div><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.n)}</span><i style="width:${(t.calls/mx*100).toFixed(1)}%;${t.err>3?'background:linear-gradient(90deg,var(--amber),var(--red))':''}"></i><em>${num(t.calls/1000,0)}k</em></div>`).join('')}</div>
    <h3 style="margin-top:18px">${T('Live gateway log','Журнал шлюза')}<span class="sp"></span><span class="live"></span></h3><div class="log" id="tfeed" style="max-height:220px">${feedHtml()}</div></div></div>`;
  $$('[data-rd]',el).forEach(b=>b.onclick=()=>{rng7=+b.dataset.rd;rTraffic()});
}

/* ---------- TPP REGISTRY ---------- */
function rTpp(){const el=$('#v-tpp');const f=S.tppF;const stL={active:['Active','Активен','ok'],pending:['Application','Заявка','gold'],watch:['Under watch','Под наблюдением','warn'],suspended:['Suspended','Приостановлен','bad'],rejected:['Rejected','Отклонён','bad']};
  const list=S.tpps.filter(t=>f==='all'||t.st===f);
  el.innerHTML=`<div class="split"><div class="card"><h3>🏢 ${T('Register a new third-party provider','Регистрация нового стороннего провайдера')}</h3>
   <div class="fgrid"><div class="f full"><label>${T('Legal name','Юридическое название')}</label><input class="input" id="nName" placeholder="Acme Payments Pty Ltd"></div>
    <div class="f"><label>${T('Role','Роль')}</label><select class="input" id="nRole"><option>AISP</option><option>PISP</option><option>AISP+PISP</option><option>CBPII</option></select></div>
    <div class="f"><label>${T('Country','Страна')}</label><select class="input" id="nCty"><option>AU</option><option>PH</option><option>LT</option><option>SG</option></select></div>
    <div class="f full"><label>${T('Redirect URI (https)','Redirect URI (https)')}</label><input class="input" id="nUri" placeholder="https://app.acme.io/callback"></div>
    <div class="f full"><label>${T('Software statement (SSA) JWKS URL','URL JWKS программного заявления (SSA)')}</label><input class="input" id="nJwks" placeholder="https://keystore.openrail.cb/acme/jwks.json"></div></div>
   <div class="err" id="nErr"></div><button class="btn pri" id="nGo">${T('Submit application','Подать заявку')}</button></div>
  <div class="card"><h3>📋 ${T('Registry overview','Обзор реестра')}</h3>
   <div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:0">${Object.keys(stL).map(k=>`<div class="card kpi" style="padding:12px"><div class="l">${T(stL[k][0],stL[k][1])}</div><div class="v">${S.tpps.filter(t=>t.st===k).length}</div></div>`).join('')}</div>
   <div class="muted" style="font-size:12.5px;margin-top:10px">${T('Every action is written to the public register and pushed to all banks within 60 seconds (directory sync).','Каждое действие записывается в публичный реестр и рассылается всем банкам за 60 секунд (синхронизация каталога).')}</div></div></div>
  <div class="card"><h3>${T('Third-party providers','Сторонние провайдеры')}<span class="sp"></span><span class="chips">${[['all','All','Все'],['pending','Applications','Заявки'],['active','Active','Активные'],['watch','Watch','Наблюдение'],['suspended','Suspended','Приостановлены']].map(c=>`<button class="chip ${f===c[0]?'on':''}" data-tf="${c[0]}">${T(c[1],c[2])}</button>`).join('')}</span></h3>
   <div class="tw"><table><thead><tr><th>${T('Provider','Провайдер')}</th><th>${T('Role','Роль')}</th><th>${T('Licence','Лицензия')}</th><th>${T('Country','Страна')}</th><th style="text-align:right">${T('Calls today','Вызовов сегодня')}</th><th style="text-align:right">${T('Errors','Ошибки')}</th><th>${T('Status','Статус')}</th><th>${T('Actions','Действия')}</th></tr></thead><tbody>
   ${list.map(t=>{const s=stL[t.st];return `<tr><td><div class="row" style="flex-wrap:nowrap"><div class="logo" style="background:${t.c};width:28px;height:28px;font-size:11px">${t.n.split(' ').map(w=>w[0]).join('').slice(0,2)}</div><b>${esc(t.n)}</b></div></td><td>${t.role}</td><td class="mono">${t.lic}</td><td>${t.country}</td><td class="mono" style="text-align:right">${num(t.calls)}</td><td class="mono ${t.err>3?'bad-t':''}" style="text-align:right">${num(t.err,1)}%</td><td><span class="pill ${s[2]}">${T(s[0],s[1])}</span></td>
    <td><div class="row" style="flex-wrap:nowrap">${t.st==='pending'?`<button class="btn sm pri" data-ta="approve" data-id="${t.id}">${T('Approve','Одобрить')}</button><button class="btn sm danger" data-ta="reject" data-id="${t.id}">${T('Reject','Отклонить')}</button>`:t.st==='active'||t.st==='watch'?`<button class="btn sm danger" data-ta="suspend" data-id="${t.id}">${T('Suspend','Приостановить')}</button>`:t.st==='suspended'?`<button class="btn sm" data-ta="reinstate" data-id="${t.id}">${T('Reinstate','Восстановить')}</button>`:''}<button class="btn sm" data-tv="${t.id}">${T('Details','Детали')}</button></div></td></tr>`}).join('')||`<tr><td colspan="8" class="muted">${T('No providers','Нет провайдеров')}</td></tr>`}</tbody></table></div></div>`;
  $$('[data-tf]',el).forEach(b=>b.onclick=()=>{S.tppF=b.dataset.tf;save();rTpp()});
  $$('[data-ta]',el).forEach(b=>b.onclick=()=>{const t=S.tpps.find(x=>x.id===b.dataset.id);const a=b.dataset.ta;
    if(a==='approve'){t.st='active';t.lic='PSD-0'+(100+S.tpps.length);t.calls=Math.round(Math.random()*900);t.err=.3;toast(T(t.n+' approved — licence '+t.lic+' published',t.n+' одобрен — лицензия '+t.lic+' опубликована'))}
    if(a==='reject'){t.st='rejected';toast(T(t.n+' application rejected','Заявка '+t.n+' отклонена'),'bad')}
    if(a==='suspend'){t.st='suspended';const n=S.consents.filter(c=>c.tpp===t.n&&c.st==='active').length;S.consents.forEach(c=>{if(c.tpp===t.n&&c.st==='active')c.st='revoked'});toast(T(t.n+' suspended. Tokens revoked at all banks'+(n?', '+n+' consent(s) closed':'')+'.',t.n+' приостановлен. Токены отозваны во всех банках'+(n?', закрыто согласий: '+n:'')+'.'),'gold')}
    if(a==='reinstate'){t.st='active';toast(T(t.n+' reinstated',t.n+' восстановлен'))}
    save();render()});
  $$('[data-tv]',el).forEach(b=>b.onclick=()=>openTpp(b.dataset.tv));
  $('#nGo').onclick=()=>{const n=$('#nName').value.trim(),u=$('#nUri').value.trim(),j=$('#nJwks').value.trim();let er='';
    if(n.length<3)er=T('Enter the legal name','Введите юридическое название');else if(S.tpps.some(t=>t.n.toLowerCase()===n.toLowerCase()))er=T('This provider is already registered','Этот провайдер уже зарегистрирован');
    else if(!/^https:\/\/[^\s/]+\.[^\s]+$/.test(u))er=T('Redirect URI must be an https:// URL','Redirect URI должен начинаться с https://');
    else if(!/^https:\/\/[^\s]+\.json$/.test(j))er=T('JWKS URL must be https:// and end with .json','URL JWKS должен быть https:// и оканчиваться на .json');
    if(er){$('#nErr').textContent=er;return}
    const cols=['#c4733a','#3a8fd8','#8a5bd0','#3fa060','#c45a8c'];S.tpps.unshift({id:'TPP-'+(1200+S.tpps.length),n,role:$('#nRole').value,lic:'—',c:cols[S.tpps.length%5],st:'pending',calls:0,err:0,since:now(),cert:'eIDAS QWAC',country:$('#nCty').value,uri:u});
    S.tppF='pending';save();render();toast(T('Application from '+n+' received — review it below','Заявка '+n+' получена — проверьте ниже'),'gold')};
}
function openTpp(id){const t=S.tpps.find(x=>x.id===id);if(!t)return;const cons=S.consents.filter(c=>c.tpp===t.n);
  $('#drawerRoot').innerHTML=`<div class="drawer" id="drw"><div class="in"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div class="row" style="flex-wrap:nowrap"><div class="logo" style="background:${t.c}">${t.n.split(' ').map(w=>w[0]).join('').slice(0,2)}</div><h3 style="margin:0">${esc(t.n)}</h3></div><button class="btn sm" id="drwX">✕</button></div>
   <div class="tpp" style="flex-direction:column;align-items:stretch;margin-top:14px;font-size:13px">${[[T('ID','ID'),t.id],[T('Role','Роль'),t.role],[T('Licence','Лицензия'),t.lic],[T('Certificate','Сертификат'),t.cert+' · '+T('valid','действует')],[T('Registered','Зарегистрирован'),fmtD(t.since)],[T('Country','Страна'),t.country],[T('Calls today','Вызовов сегодня'),num(t.calls)],[T('Error rate','Ошибки'),num(t.err,1)+'%']].map(r=>`<div class="row" style="justify-content:space-between"><span class="muted">${r[0]}</span><b class="mono">${esc(r[1])}</b></div>`).join('')}</div>
   ${t.err>3?`<div class="pill warn" style="margin-top:12px;white-space:normal">⚠ ${T('High error rate: 4.1% of calls hit 429 rate limits — possible screen-scraping fallback.','Высокая доля ошибок: 4,1% вызовов упираются в лимит 429 — возможен возврат к скрейпингу.')}</div>`:''}
   <h3 style="margin-top:18px">${T('Consents in this demo','Согласия в этом демо')}</h3>${cons.map(c=>`<div class="ep"><code>${c.id}</code><span class="pill">${c.st}</span></div>`).join('')||`<div class="muted">${T('None','Нет')}</div>`}</div></div>`;
  const close=()=>{$('#drawerRoot').innerHTML=''};$('#drwX').onclick=close;$('#drw').onclick=e=>{if(e.target.id==='drw')close()}}

/* ---------- login & wiring ---------- */
let startView='cat';
$$('#roles .role').forEach(b=>b.onclick=()=>{startView=b.dataset.role;$$('#roles .role').forEach(x=>x.classList.toggle('on',x===b))});
$('#login').onclick=()=>{const u=$('#lgU').value.trim(),p=$('#lgP').value;if(!/^\S+@\S+\.\S+$/.test(u)){$('#lgErr').textContent=T('Enter a valid email','Введите корректную почту');return}
  if(p.length<6){$('#lgErr').textContent=T('Password must be at least 6 characters','Пароль — минимум 6 символов');return}
  $('#lgErr').textContent='';S.auth=true;S.view=startView;save();render();toast(T('Signed in to OpenRail sandbox','Вход в песочницу OpenRail выполнен'))};
$('#logout').onclick=()=>{S.auth=false;save();render()};
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#reset').onclick=()=>{store.clear();S=seed();S.auth=true;lastRes=null;mineF='all';$('#drawerRoot').innerHTML='';save();render();toast(T('Demo reset','Демо сброшено'))};
PT.onLang(()=>{render();$('#drawerRoot').innerHTML=''});
document.addEventListener('DOMContentLoaded',()=>render());
})();
</script>
