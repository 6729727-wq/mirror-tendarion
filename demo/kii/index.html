<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KII-Shield OT Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1306;font-size:14px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)} .nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-weight:700}
.side .grow{flex:1}
.modebox{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:12.5px}
.modebox .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:700}
main{padding:20px 24px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:23px;margin:0} .head .sp{flex:1} .crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;margin-bottom:14px}
.hint{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;padding:12px 14px;border:1px dashed color-mix(in srgb,var(--gold) 55%,transparent);border-radius:var(--r);background:color-mix(in srgb,var(--gold) 6%,var(--panel))}
.hint .s{flex:1 1 170px;display:flex;gap:9px;font-size:13px;line-height:1.4}
.hint .n{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--gold);color:#1a1306;font-weight:800;font-size:12px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:12.5px;padding:12px 14px}
.facts span{color:var(--dim)} .facts b{font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{padding:14px} .kpi .l{font-size:12px;color:var(--muted);font-weight:600} .kpi .v{font-size:23px;font-weight:800;margin:3px 0 0;letter-spacing:-.02em} .kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:14px;align-items:start}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap} .card h3 .sp{flex:1}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap} tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td{background:color-mix(in srgb,var(--mal) 6%,transparent)}
tr.alrt td{background:color-mix(in srgb,var(--red) 10%,transparent)} tr.flash td{animation:fl 1.4s}
@keyframes fl{from{background:color-mix(in srgb,var(--gold) 30%,transparent)}}
.btn:disabled{opacity:.42;cursor:not-allowed} .btn.sm{padding:6px 12px;font-size:12.5px} .btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.view{display:none}.view.on{display:block;animation:fade .2s} @keyframes fade{from{opacity:0;transform:translateY(4px)}}
.sldwrap{overflow-x:auto;margin:0 -6px} .sldsvg{display:block;width:100%;min-width:620px;height:auto}
.sldsvg text{font-family:var(--mono);font-size:12px;fill:var(--muted)} .sldsvg text.v{fill:var(--text);font-weight:600} .sldsvg text.big{font-size:13px;fill:var(--text);font-family:var(--font);font-weight:700}
.ln{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke .4s} .ln.bus{stroke-width:7}
.ln.hv.on{stroke:var(--mal3)} .ln.mv.on{stroke:var(--blue)} .ln.off{stroke:var(--dim);stroke-dasharray:3 7}
.flow{fill:none;stroke:#fff;stroke-opacity:.6;stroke-width:2;stroke-dasharray:3 14;animation:flow 1.1s linear infinite;pointer-events:none}
@keyframes flow{to{stroke-dashoffset:-17}}
.ln.hit{stroke:var(--red)!important;animation:hp 1s infinite} @keyframes hp{50%{stroke-opacity:.35}}
.eq{fill:var(--panel);stroke:var(--mal3);stroke-width:2.5} .eq.mv{stroke:var(--blue)}
.brk{cursor:pointer} .brk rect{stroke-width:2.5;transition:.3s} .brk.cl rect{fill:var(--mal);stroke:var(--mal3)} .brk.op rect{fill:var(--bg);stroke:var(--amber)}
.brk .sl{stroke:var(--amber);stroke-width:2.5;transition:.3s;transform-box:fill-box;transform-origin:center} .brk.cl .sl{opacity:0;transform:rotate(-45deg)}
.brk.hit rect{stroke:var(--red);animation:hp 1s infinite} .brk:hover rect{stroke-width:4}
.brk.just rect{animation:pulse .7s 3} @keyframes pulse{50%{stroke:var(--gold);stroke-width:6}}
.tag{cursor:pointer} .tag rect{fill:var(--panel2);stroke:var(--line2)} .tag text{font-size:10.5px!important;fill:var(--muted)!important}
.tag.hit rect{fill:color-mix(in srgb,var(--red) 22%,var(--panel));stroke:var(--red);animation:hp 1s infinite} .tag.hit text{fill:var(--red)!important}
.tag.iso rect{stroke:var(--amber);stroke-dasharray:3 3}
.load{fill:var(--blue)} .load.off{fill:var(--dim)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap} .legend i{display:inline-block;width:14px;height:4px;border-radius:3px;margin-right:5px;vertical-align:2px}
.scn{display:grid;gap:8px}
.scn button{justify-content:flex-start;text-align:left;border-radius:12px}
.scn button small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.alertbox{border:1px solid color-mix(in srgb,var(--red) 55%,transparent);background:color-mix(in srgb,var(--red) 9%,var(--panel));border-radius:12px;padding:12px;margin-bottom:12px;font-size:13px}
.alertbox.ok{border-color:color-mix(in srgb,var(--mal) 55%,transparent);background:color-mix(in srgb,var(--mal) 8%,var(--panel))}
.alertbox b.t{display:block;font-size:14px;margin-bottom:3px}
.pb{display:grid;gap:7px}
.pbs{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:11px;font-size:13px;background:var(--panel2)}
.pbs .i{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:12px;border:2px solid var(--line2);color:var(--muted)}
.pbs.done{opacity:.8} .pbs.done .i{background:var(--mal);border-color:var(--mal);color:#fff}
.pbs.cur{border-color:var(--gold)} .pbs.cur .i{border-color:var(--gold);color:var(--gold2)}
.pbs .tx{flex:1;min-width:0;white-space:normal} .pbs .btn{flex:none}
.prog{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px} .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mal2),var(--mal3));transition:width .2s}
.purdue{display:grid;gap:6px}
.lvl{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);cursor:pointer;font-size:13px}
.lvl:hover,.lvl.on{border-color:var(--mal)} .lvl .L{font-family:var(--mono);font-weight:700;color:var(--gold2)}
.lvl .chips{display:flex;gap:4px;flex-wrap:wrap;min-width:0} .lvl .chips i{font-style:normal;font-size:10.5px;font-family:var(--mono);border:1px solid var(--line2);border-radius:6px;padding:0 5px;color:var(--muted)}
.lvl .chips i.bad{border-color:var(--red);color:var(--red)} .lvl .chips i.iso{border-color:var(--amber);color:var(--amber)}
.fw{height:2px;margin:0 0 0 72px;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,transparent 8px 14px);opacity:.6}
.objs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.obj{padding:12px} .obj .c{font-size:28px;font-weight:800;color:var(--gold2);line-height:1} .obj .c small{font-size:11px;color:var(--muted);font-weight:600;margin-left:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center} .tools .input{width:auto;min-width:140px;flex:1;max-width:280px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;align-items:start}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px} .fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
textarea.input{min-height:84px;resize:vertical}
.ack{border:1px solid var(--mal);border-radius:12px;padding:14px;background:color-mix(in srgb,var(--mal) 8%,var(--panel));margin-top:12px}
.stages{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px} .stages span{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--dim)} .stages span.ok{border-color:var(--mal);color:var(--mal3)} .stages span.cur{border-color:var(--gold);color:var(--gold2)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px dashed var(--line);cursor:pointer;font-size:13.5px}
.chk .bx{width:20px;height:20px;border-radius:6px;border:2px solid var(--line2);flex:none;display:grid;place-items:center;font-size:12px;color:#fff;margin-top:1px}
.chk.on .bx{background:var(--mal);border-color:var(--mal)} .chk .ev{font-size:11.5px;color:var(--dim)}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold2);font-weight:700;margin:14px 0 2px}
.led{width:8px;height:8px;border-radius:50%;background:var(--mal3);box-shadow:0 0 8px var(--mal3);display:inline-block;animation:bl 1.6s infinite} .led.bad{background:var(--red);box-shadow:0 0 8px var(--red)} @keyframes bl{50%{opacity:.4}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px} .modal-bg.on{display:flex}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r2);padding:22px;box-shadow:var(--shadow);animation:pop .18s}
@keyframes pop{from{transform:scale(.96);opacity:0}} .modal h2{margin:0 0 12px;font-size:19px} .modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:pop .2s} .toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2,.split{grid-template-columns:minmax(0,1fr)}.objs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:0;top:45px;z-index:1500;width:250px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}.side.open{transform:none}.menu-btn{display:inline-flex}main{padding:14px 14px 50px}.intro{grid-template-columns:minmax(0,1fr)}.head h1{font-size:19px}}
@media (max-width:520px){.kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.kpi .v{font-size:19px}.kpi:last-child{grid-column:1/-1}.fgrid{grid-template-columns:1fr}.objs{grid-template-columns:minmax(0,1fr)}.tools .input{max-width:none}}
</style>
</head>
<body data-demo-en="KII-Shield — OT/ICS critical infrastructure monitoring" data-demo-ru="КИИ-Щит — мониторинг объектов КИИ">
<div class="app">

    <div id="navs"></div>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru), L=o=>o?(PT.lang==='ru'?o.ru:o.en):'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(4242);
const KEY='kii-shield-v1';
const store={load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},save(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}},clear(){try{localStorage.removeItem(KEY)}catch(e){}}};
const hhmm=t=>new Date(t).toTimeString().slice(0,8);
const dt=t=>{const d=new Date(t);return d.toISOString().slice(0,10)+' '+d.toTimeString().slice(0,5)};

const OBJ=[

 setTimeout(()=>{clearInterval(iv);busy=false;

 <div class="fgrid" style="margin-top:12px;font-size:13px"><div><span class="muted">IP</span><br><b class="mono">${a.ip}</b></div><div><span class="muted">${T('Firmware','Прошивка')}</span><br><b class="mono">${a.fw}</b></div><div><span class="muted">${T('Object','Объект')}</span><br><b>${L(o)}</b></div><div><span class="muted">${T('Category','Категория')}</span><br><b>${catTxt(o.cat)}</b></div></div>
 <h3 style="margin:16px 0 8px;font-size:14px">${T('Known vulnerabilities (national vuln DB)','Известные уязвимости (БДУ)')}</h3>
 ${a.v.length?a.v.map(i=>`<div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px"><span class="pill ${VUL[i][1]>=8?'bad':'warn'} mono">${VUL[i][1]}</span><div><b class="mono" style="font-size:12px">${VUL[i][0]}</b><br>${PT.lang==='ru'?VUL[i][3]:VUL[i][2]}<div class="muted" style="font-size:11.5px">${T('Compensating control: DPI write-allowlist + segment firewall','Компенсирующая мера: allowlist записи в DPI + МЭ сегмента')}</div></div></div>`).join(''):`<div class="muted">${T('None known','Не выявлено')}</div>`}
 <div class="acts"><button class="btn" data-close>${T('Close','Закрыть')}</button></div>`)}

/* ---------- compliance ---------- */
function renderComp(){
 $('#checks').innerHTML=COMP.map(c=>(c[1]?`<div class="grp">${L(c[1])}</div>`:'')+`<div class="chk ${S.comp[c[0]]?'on':''}" data-c="${c[0]}"><span class="bx">${S.comp[c[0]]?'✓':''}</span><div>${L(c[2])}<div class="ev">${S.comp[c[0]]?T('Evidence attached · verified ','Доказательства приложены · проверено ')+new Date().toISOString().slice(0,10):T('Gap — click to mark implemented','Пробел — нажмите, чтобы отметить выполненным')}</div></div></div>`).join('');
 $$('#checks .chk').forEach(d=>d.onclick=()=>{S.comp[d.dataset.c]=!S.comp[d.dataset.c];save();renderComp();renderKpi()});
 const n=COMP.filter(c=>S.comp[c[0]]).length,p=Math.round(n/COMP.length*100),r=54,C=2*Math.PI*r;
 $('#ring').innerHTML=`<svg viewBox="0 0 140 140" width="160" height="160"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="${p>=85?'var(--mal3)':p>=60?'var(--gold)':'var(--red)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 70 70)" style="transition:.4s"/><text x="70" y="78" text-anchor="middle" font-size="28" font-weight="800" fill="var(--text)">${p}%</text></svg>`;
 $('#ringTxt').innerHTML=`${n} / ${COMP.length} ${T('controls implemented','мер выполнено')}<br>${p>=85?T('Ready for regulator inspection','Готов к проверке регулятора'):T('Close gaps before inspection','Закройте пробелы до проверки')}`;}
$('#expComp').onclick=()=>{const rows=[['control','status']].concat(COMP.map(c=>[L(c[2]),S.comp[c[0]]?'implemented':'gap']));const b=new Blob([rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kii-compliance.csv';a.click();toast(T('Audit pack exported','Пакет выгружен'))};

/* ---------- shell ---------- */
const VIEWS=[['ov','Overview','Обзор','<path d="M3 12h4l3-8 4 16 3-8h4"/>'],['assets','Assets & zones','Активы и зоны','<rect x="3" y="3" width="18" height="5" rx="1"/><rect x="3" y="10" width="18" height="5" rx="1"/><rect x="3" y="17" width="18" height="4" rx="1"/>'],['traffic','Traffic monitor','Монитор трафика','<path d="M4 6h16M4 12h10M4 18h6"/><circle cx="18" cy="16" r="3"/>'],['inc','Incidents & CERT','Инциденты и НКЦИ','<path d="M12 3 2 20h20zM12 10v4M12 17v.5"/>'],['comp','Compliance','Соответствие','<path d="M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>']];
function renderNav(){const open=S.inc.filter(i=>i.status==='open'||i.status==='contained').length;
 $('#navs').innerHTML=VIEWS.map(v=>`<button class="nav ${v[0]===view?'on':''}" data-v="${v[0]}"><svg viewBox="0 0 24 24">${v[3]}</svg>${T(v[1],v[2])}${v[0]==='inc'&&open?`<span class="cnt">${open}</span>`:''}</button>`).join('');
 $$('#navs .nav').forEach(b=>b.onclick=()=>go(b.dataset.v));const vv=VIEWS.find(v=>v[0]===view);$('#title').textContent=T(vv[1],vv[2]);$('#crumb').textContent=T('Severnaya Energy · OT SOC','Северэнерго · SOC АСУ ТП');
 const m=S.mode==='manual';$('#modePill').className='pill '+(m?'warn':'ok');$('#modePill').textContent=m?T('MANUAL control','РУЧНОЕ управление'):T('AUTO (SCADA)','АВТО (SCADA)');$('#sideMode').innerHTML=m?`<span style="color:var(--amber)">● ${T('Manual / local','Ручной / местный')}</span>`:`<span style="color:var(--mal3)">● ${T('Automatic (SCADA)','Автомат (SCADA)')}</span>`;}
function renderKpi(){const act=S.inc.filter(i=>i.status!=='closed').length,n=COMP.filter(c=>S.comp[c[0]]).length,f=flows();
 const k=[[T('Monitored assets','Активов под контролем'),ASSETS.length,T('6 Purdue levels','6 уровней Purdue')],[T('Active incidents','Активные инциденты'),act,act?`<span style="color:var(--red)">${T('response running','идёт реагирование')}</span>`:T('none','нет')],[T('Generation','Генерация'),(f.g1+f.g2).toFixed(1)+' MW',T('2 units online','2 блока в работе').replace('2',(S.br.Q1?1:0)+(S.br.Q2?1:0))],[T('Compliance','Соответствие'),Math.round(n/COMP.length*100)+'%',n+'/'+COMP.length],[T('CERT reports','Уведомления НКЦИ'),S.inc.filter(i=>i.ack).length,T('this year','в этом году')]];
 $('#kpis').innerHTML=k.map(x=>`<div class="card kpi"><div class="l">${x[0]}</div><div class="v">${x[1]}</div><div class="d">${x[2]}</div></div>`).join('')}
function go(v){view=v;$$('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));$('#side').classList.remove('open');render();scrollTo(0,0)}
function render(){renderNav();renderKpi();if(view==='ov'){drawSLD();renderPB()}renderTraffic();if(view==='assets')renderAssets();if(view==='inc')renderInc();if(view==='comp')renderComp();
 $('#pause').innerHTML=paused?'▶ '+T('Resume','Продолжить'):'❚❚ '+T('Pause','Пауза');
 const pf=$('#pf').value||'all';$('#pf').innerHTML=[['all',T('All protocols','Все протоколы')],['Modbus','Modbus/TCP'],['IEC','IEC 60870-5-104']].map(o=>`<option value="${o[0]}" ${o[0]===pf?'selected':''}>${o[1]}</option>`).join('');
 $('#baseline').innerHTML=`<div class="muted" style="margin-bottom:8px">${T('Learned over 14 days of normal operation. Anything outside → anomaly.','Обучено за 14 дней нормальной работы. Всё вне профиля → аномалия.')}</div>`+[[T('Flows in baseline','Потоков в профиле'),'214'],[T('Allowed writers (FC05/06/16)','Разрешена запись (FC05/06/16)'),'SCADA-1, SCADA-2, EWS-1'],[T('Firmware changes','Смена прошивок'),T('only in change window, signed','только в окно изменений, с подписью')],[T('New MAC in L1','Новый MAC в L1'),T('alert + port shutdown','алерт + отключение порта')],[T('IEC 104 commands','Команды IEC 104'),'SCADA-1/2, HMI-2']].map(r=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)"><span class="muted">${r[0]}</span><b class="mono" style="text-align:right;font-size:12px">${r[1]}</b></div>`).join('');}
$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#reset').onclick=()=>{store.clear();S=seed();save();selInc=S.inc[0].id;render();toast(T('Demo reset','Демо сброшено'))};
$('#pause').onclick=()=>{paused=!paused;render()};$('#pf').onchange=renderTraffic;$('#aonly').onchange=renderTraffic;$('#aq').oninput=()=>{hlAsset=null;renderAssets()};$('#vonly').onchange=renderAssets;
$('#allLv').onclick=()=>{lvFilter=null;renderAssets()};
for(let i=0;i<14;i++)genTraffic();
setInterval(tickEl,1000);setInterval(()=>{if(!paused){genTraffic();renderTraffic()}},900);setInterval(()=>{$('#pps').textContent=T('DPI sensor IDS-OT · ','Датчик DPI IDS-OT · ')+(pps*67+R()*40|0)+' pkt/s';pps=0},1500);
setInterval(()=>{if(view==='inc'&&!document.activeElement.matches('input,select,textarea'))renderInc()},30000);
PT.onLang(()=>render());
document.addEventListener('DOMContentLoaded',()=>{go('ov');tickEl()});
})();
</script>
