<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;font-size:16px;flex:none}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.grow{flex:1}
.who{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:12.5px;display:flex;gap:10px;align-items:center}
.who .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 25%,transparent);color:var(--gold2);font-weight:800;flex:none}
.who b{display:block;font-size:13px}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.how>div>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold2);flex:none;font-size:13px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f .er{font-size:11.5px;color:var(--red);min-height:0;margin-top:4px}
.f.bad .input{border-color:var(--red)}
.ok-t{color:var(--mal3)} .bad-t{color:var(--red)} .warn-t{color:var(--amber)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.split{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:14px;align-items:start}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mal2),var(--mal3));transition:width .4s}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td,tbody tr.sel td{background:color-mix(in srgb,var(--mal) 7%,transparent)}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
/* login */
.login{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 500px at 20% 10%,color-mix(in srgb,var(--mal) 14%,transparent),transparent),radial-gradient(700px 400px at 90% 90%,color-mix(in srgb,var(--gold) 10%,transparent),transparent)}
.lbox{width:100%;max-width:440px}
.lbox .card{padding:26px}
.lbox h2{margin:6px 0 4px;font-size:22px}
.gate{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--muted);margin:14px 0}
.gate b{color:var(--text)}
/* pensions */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pc{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--panel);display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:.15s;text-align:left;width:100%}
.pc:hover{border-color:var(--mal)}
.pc .t{display:flex;gap:10px;align-items:flex-start}
.pc .lg{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.pc .t b{display:block;font-size:14px;line-height:1.3}
.pc .t span{font-size:12px;color:var(--muted)}
.pc .val{font-size:22px;font-weight:800;letter-spacing:-.02em}
.pc .val small{font-size:12px;color:var(--muted);font-weight:600}
.pc.poss{border-style:dashed;border-color:var(--amber)}
.pc.pend{opacity:.85;border-style:dashed}
.prov{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.pv{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--bg2);font-size:13px;min-width:0}
.pv b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pv .st{font-size:11.5px;font-weight:700;flex:none}
.spin{width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--mal3);border-radius:50%;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin-bottom:8px;cursor:pointer;font-size:13.5px}
.ck input{margin-top:3px;accent-color:var(--mal);width:16px;height:16px;flex:none}
.ck small{display:block;color:var(--muted);font-size:12px}
.rng{width:100%;accent-color:var(--mal)}
.ctl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.ctl .l{font-size:12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:6px}
.ctl .l b{color:var(--text);font-family:var(--mono)}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.bar2{display:flex;height:12px;border-radius:9px;overflow:hidden;background:var(--line)}
.bar2 i{display:block;height:100%}
.dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.dl div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.dl span{display:block;font-size:11.5px;color:var(--muted)} .dl b{font-size:14px;overflow-wrap:anywhere}
.lst{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);cursor:pointer;text-align:left;width:100%}
.li.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 10%,transparent)}
.li b{display:block;font-size:13px} .li span{font-size:11.5px;color:var(--muted)}
.li .lg{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:11px;color:#fff;flex:none}
.log{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-height:260px;overflow:auto}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)} .log .t{color:var(--dim)}
.doc{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.doc span{flex:1;min-width:0}
.tip{font-family:var(--font)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .e{font-size:40px}
.sel{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:4px 6px;font-size:12.5px}
@media (max-width:1100px){.kpis,.ctl{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.intro,.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
}
@media (max-width:560px){.how,.fgrid{grid-template-columns:1fr}.kpi .v{font-size:20px}.kpis,.ctl{gap:10px}.big{font-size:24px}.dl{grid-template-columns:1fr}.pcards{grid-template-columns:minmax(0,1fr)}.lbox .card{padding:18px}}
</style>
</head>

/* ---------- PROJECTION ---------- */
const G={low:.02,mid:.04,high:.06};
const TARGETS={min:[14400,'Minimum','Минимальный'],mod:[31300,'Moderate','Средний'],com:[43100,'Comfortable','Комфортный']};
function project(){
  const P=S.proj,g=G[P.growth],R=P.age,yrs=Math.max(0,R-AGE);
  const dcs=okIds().filter(i=>PENS[i].kind==='dc');
  const potSeries=[];for(let y=0;y<=yrs;y++){let v=0;dcs.forEach(i=>{const p=PENS[i];v+=p.value*Math.pow(1+g,y);if(p.active)v+=P.contrib*12*(g?(Math.pow(1+g,y)-1)/g:y)});potSeries.push(v)}
  const pot=potSeries[potSeries.length-1]||0,lump=pot*P.lump/100,rate=Math.min(.075,.045+(R-60)*.002),dcInc=(pot-lump)*rate;
  const dbInc=S.found.p3==='ok'?PENS.p3.accrued*Math.max(.6,1+.05*(R-PENS.p3.nra)):0;
  const spInc=S.found.p1==='ok'?PENS.p1.weekly*52:0;
  const ages=[];for(let a=AGE;a<=90;a++)ages.push({a,dc:a>=R?dcInc:0,db:a>=R?dbInc:0,sp:a>=SPA?spInc:0});
  return{pot,lump,dcInc,dbInc,spInc,ages,potSeries,R,target:TARGETS[P.target][0]};
}

const W=720,H=280,pl=54,pr=12,pt=14,pb=30;
function incomeSvg(R){
  const A=R.ages,max=Math.max(R.target,...A.map(x=>x.dc+x.db+x.sp))*1.12;
  const x=a=>pl+(a-AGE)/(90-AGE)*(W-pl-pr),y=v=>H-pb-v/max*(H-pt-pb);
  const layer=(f0,f1,col)=>{let top='',bot='';A.forEach((d,i)=>{top+=(i?'L':'M')+x(d.a).toFixed(1)+','+y(f1(d)).toFixed(1)});A.slice().reverse().forEach(d=>{bot+='L'+x(d.a).toFixed(1)+','+y(f0(d)).toFixed(1)});return `<path d="${top+bot}Z" style="fill:${col};opacity:.78"/>`};
  let g='';for(let i=0;i<=4;i++){const v=max/4*i;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" style="fill:var(--dim);font-size:11px">£${Math.round(v/1000)}k</text>`}
  for(let a=50;a<=90;a+=5)g+=`<text x="${x(a)}" y="${H-10}" text-anchor="middle" style="fill:var(--dim);font-size:11px">${a}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" id="incSvg">${g}
   ${layer(d=>0,d=>d.sp,'var(--blue)')}${layer(d=>d.sp,d=>d.sp+d.db,'var(--violet)')}${layer(d=>d.sp+d.db,d=>d.sp+d.db+d.dc,'var(--mal)')}
   <line x1="${pl}" x2="${W-pr}" y1="${y(R.target)}" y2="${y(R.target)}" style="stroke:var(--gold);stroke-width:2;stroke-dasharray:6 5"/>
   <text x="${W-pr-4}" y="${y(R.target)-6}" text-anchor="end" style="fill:var(--gold2);font-size:11px;font-weight:700">${T('target','цель')} ${gbp(R.target)}</text>
   <line x1="${x(R.R)}" x2="${x(R.R)}" y1="${pt}" y2="${H-pb}" style="stroke:var(--text);opacity:.35;stroke-dasharray:3 4"/>
   <text x="${x(R.R)+4}" y="${pt+10}" style="fill:var(--muted);font-size:11px">${T('retire','пенсия')} ${R.R}</text>
   <g id="tipG" style="display:none"><line id="tipL" y1="${pt}" y2="${H-pb}" style="stroke:var(--text);opacity:.5"/><rect id="tipR" width="150" height="74" rx="8" style="fill:var(--panel2);stroke:var(--line2)"/><text id="tipT" class="tip" style="fill:var(--text);font-size:11.5px"></text></g>
   <rect x="${pl}" y="${pt}" width="${W-pl-pr}" height="${H-pt-pb}" fill="transparent" id="hit"/></svg>`;
}
function bindTip(R){
  const svg=$('#incSvg');if(!svg)return;const hit=$('#hit');
  const mv=e=>{const b=svg.getBoundingClientRect();const px=(e.clientX-b.left)/b.width*W;const a=Math.round(AGE+(px-pl)/(W-pl-pr)*(90-AGE));const d=R.ages.find(z=>z.a===a);if(!d)return;
    const X=pl+(a-AGE)/(90-AGE)*(W-pl-pr);$('#tipG').style.display='';$('#tipL').setAttribute('x1',X);$('#tipL').setAttribute('x2',X);
    const bx=X>W-170?X-158:X+8;$('#tipR').setAttribute('x',bx);$('#tipR').setAttribute('y',pt+4);
    const lines=[T('Age ','Возраст ')+a,'DC '+gbp(d.dc),'DB '+gbp(d.db),T('State ','Гос. ')+gbp(d.sp)];
    $('#tipT').innerHTML=lines.map((l,i)=>`<tspan x="${bx+10}" y="${pt+22+i*15}" style="${i?'':'font-weight:700'}">${l}</tspan>`).join('')};
  hit.addEventListener('pointermove',mv);hit.addEventListener('pointerdown',mv);hit.addEventListener('pointerleave',()=>$('#tipG').style.display='none');

function potSvg(R){
  const s=R.potSeries,n=s.length,w=420,h=260,l=52,b=28,max=Math.max(...s)*1.1||1;
  const x=i=>l+(n>1?i/(n-1):0)*(w-l-10),y=v=>h-b-v/max*(h-14-b);
  let path='',area='';s.forEach((v,i)=>{path+=(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)});area=path+`L${x(n-1)},${h-b}L${x(0)},${h-b}Z`;
  let g='';for(let i=0;i<=4;i++){const v=max/4*i;g+=`<line x1="${l}" x2="${w-10}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end" style="fill:var(--dim);font-size:11px">£${Math.round(v/1000)}k</text>`}
  const step=Math.max(1,Math.ceil(n/6));for(let i=0;i<n;i+=step)g+=`<text x="${x(i)}" y="${h-9}" text-anchor="middle" style="fill:var(--dim);font-size:11px">${AGE+i}</text>`;
  return `<svg viewBox="0 0 ${w} ${h}"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--mal);stop-opacity:.45"/><stop offset="1" style="stop-color:var(--mal);stop-opacity:0"/></linearGradient></defs>${g}<path d="${area}" fill="url(#pg)"/><path d="${path}" style="fill:none;stroke:var(--mal3);stroke-width:2.5"/><circle cx="${x(n-1)}" cy="${y(s[n-1])}" r="5" style="fill:var(--gold)"/><text x="${x(n-1)-8}" y="${y(s[n-1])-10}" text-anchor="end" style="fill:var(--text);font-size:12px;font-weight:700">${gbp(s[n-1])}</text></svg>`;
}

   <div class="card kpi"><div class="l">${T('Providers live','Подключено')}</div><div class="v">${live.length}<span style="font-size:15px;color:var(--muted)"> / ${P.length}</span></div><div class="d">${P.filter(p=>p.st==='down').length} ${T('offline','недоступно')} · ${P.filter(p=>p.st==='onb').length} ${T('onboarding','подключаются')}</div></div>
   <div class="card kpi"><div class="l">${T('Find requests · 24 h','Запросы поиска · 24 ч')}</div><div class="v">${req.toLocaleString(loc())}</div><div class="d">${T('peak 14:00–15:00','пик 14:00–15:00')}</div></div>
   <div class="card kpi"><div class="l">${T('Average match rate','Средняя доля совпадений')}</div><div class="v ok-t">${mr.toFixed(1)}%</div><div class="d">${T('target ≥ 70%','цель ≥ 70%')}</div></div>
   <div class="card kpi"><div class="l">${T('Worst-hour p95 latency','p95 в худший час')}</div><div class="v ${p95>800?'warn-t':''}">${p95} ms</div><div class="d">SLA 2 000 ms</div></div></div>
   <div class="grid2"><div class="tw"><table><thead><tr><th>${T('Provider','Провайдер')}</th><th>${T('Status','Статус')}</th><th>${T('Cohort','Волна')}</th><th>${T('Requests','Запросы')}</th><th>${T('Match','Совпад.')}</th><th>${T('Uptime 30d','Аптайм 30д')}</th><th>${T('Set status','Статус')}</th></tr></thead><tbody>
    ${P.map(p=>`<tr class="clk ${p.id===sel.id?'sel':''}" data-p="${p.id}"><td><div class="row" style="flex-wrap:nowrap">${logo(p.id,'lg" style="width:24px;height:24px;border-radius:7px;font-size:10px;display:grid;place-items:center;color:#fff;background:'+PROV[p.id][3])}<b style="font-size:13px">${pname(p.id)}</b></div></td>
     <td><span class="pill ${ST[p.st][2]}">${T(ST[p.st][0],ST[p.st][1])}</span></td><td class="mono">${p.cohort}</td><td class="mono">${p.req.toLocaleString(loc())}</td><td class="mono">${p.st==='onb'?'—':p.match+'%'}</td><td class="mono ${p.up<99?'warn-t':''}">${p.st==='onb'?'—':p.up+'%'}</td>
     <td><select class="sel" data-ps="${p.id}">${Object.keys(ST).map(k=>`<option value="${k}" ${p.st===k?'selected':''}>${T(ST[k][0],ST[k][1])}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>
   <div><div class="card chart" style="margin-bottom:14px"><h3>${logo(sel.id,'lg" style="width:24px;height:24px;border-radius:7px;font-size:10px;display:grid;place-items:center;color:#fff;background:'+PROV[sel.id][3])}${pname(sel.id)}<span class="sp"></span><button class="btn sm" id="pPing" ${sel.st==='onb'?'disabled':''}>${T('Ping endpoint','Пинг')}</button></h3>
    <div class="muted" style="font-size:12px;font-weight:600;margin-bottom:4px">${T('Find API latency, last 24 checks (ms)','Задержка Find API, последние 24 проверки (мс)')}</div>${latSvg(sel)}
    <div class="dl" style="margin-top:12px"><div><span>${T('Endpoint','Адрес')}</span><b class="mono" style="font-size:12px">https://find.${sel.id}.pensions.al/v1</b></div><div><span>${T('Security profile','Профиль безопасности')}</span><b>FAPI · mTLS · UMA 2.0</b></div><div><span>${T('Last check','Последняя проверка')}</span><b>${sel.last||nowT()}</b></div><div><span>${T('Connection deadline','Срок подключения')}</span><b>${fmtD(['2026-04-30','2026-09-30','2027-01-31','2027-04-30'][sel.cohort-1])}</b></div></div></div>
   <div class="card"><h3>${T('Staged connection by cohort','Подключение по волнам')}</h3>${[1,2,3,4].map(c=>{const g=P.filter(p=>p.cohort===c),l=g.filter(p=>p.st!=='onb').length;return `<div style="display:flex;gap:10px;align-items:center;font-size:12.5px;margin-bottom:8px"><span style="width:84px">${T('Cohort','Волна')} ${c}</span><div class="prog" style="flex:1"><i style="width:${l/g.length*100}%"></i></div><span class="mono" style="width:40px;text-align:right">${l}/${g.length}</span></div>`}).join('')}</div></div></div>`;
  $$('[data-p]',el).forEach(r=>r.onclick=e=>{if(e.target.closest('select'))return;S.provSel=r.dataset.p;save();rProv()});
  $$('[data-ps]',el).forEach(s=>s.onchange=()=>{const p=P.find(x=>x.id===s.dataset.ps);const old=p.st;p.st=s.value;
    if(p.st==='onb'){p.req=0;p.match=0}else if(old==='onb'){p.req=800;p.match=64.0;p.lat=p.lat.map(()=>300)}
    if(p.st==='down')p.up=+(p.up-0.3).toFixed(2);
    logA(`Provider ${PROV[p.id][1]}: ${ST[old][0]} → ${ST[p.st][0]}`,`Провайдер ${PROV[p.id][2]}: ${ST[old][1]} → ${ST[p.st][1]}`);
    toast(pname(p.id)+': '+T(ST[p.st][0],ST[p.st][1])+(BY_PROV[p.id]&&S.searched?'<br>'+T('Run “Search again” to see the effect on the dashboard','Запустите «Искать снова», чтобы увидеть эффект'):''),p.st==='down'?'bad':'');save();render()});
  if($('#pPing'))$('#pPing').onclick=async()=>{const b=$('#pPing');b.disabled=true;b.innerHTML='<span class="spin"></span>';await wait(500);
    const base=sel.st==='down'?0:sel.st==='degr'?1100:250;const v=sel.st==='down'?0:Math.round(base*(.7+Math.random()*.7));sel.lat.push(v);sel.lat=sel.lat.slice(-24);sel.last=nowT();save();
    toast(sel.st==='down'?T('Timeout after 5 000 ms — endpoint unreachable','Тайм-аут 5 000 мс — адрес недоступен'):T(`200 OK in ${v} ms`,`200 OK за ${v} мс`),sel.st==='down'?'bad':'');if(S.view==='prov')rProv()};
}
function latSvg(p){
  const a=p.lat,w=460,h=150,l=40,b=20,max=Math.max(1200,...a)*1.1,bw=(w-l-8)/a.length;
  let g='';[0,500,1000].forEach(v=>{const y=h-b-v/max*(h-10-b);g+=`<line x1="${l}" x2="${w-4}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${l-5}" y="${y+4}" text-anchor="end" style="fill:var(--dim);font-size:10px">${v}</text>`});
  const sla=h-b-2000/max*(h-10-b);
  return `<svg viewBox="0 0 ${w} ${h}">${g}${a.map((v,i)=>{const bh=v/max*(h-10-b);const col=v===0?'var(--red)':v>800?'var(--amber)':'var(--mal)';return v===0?`<rect x="${l+i*bw+2}" y="${h-b-6}" width="${bw-4}" height="6" rx="2" style="fill:${col}"/>`:`<rect x="${l+i*bw+2}" y="${h-b-bh}" width="${bw-4}" height="${bh}" rx="2" style="fill:${col};opacity:.85"/>`}).join('')}${sla>8?`<line x1="${l}" x2="${w-4}" y1="${sla}" y2="${sla}" style="stroke:var(--red);stroke-dasharray:4 4"/>`:''}</svg>`;
}

$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#login').onclick=async()=>{const b=$('#login');if(!/@/.test($('#lMail').value)||$('#lPw').value.length<6){toast(T('Enter email and password','Введите почту и пароль'),'bad');return}
  b.disabled=true;b.textContent=T('Verifying identity…','Проверяем личность…');await wait(120);S.auth=true;logA('Signed in with Albion Verify (GPG45 medium)','Вход через Albion Verify (GPG45 medium)');b.disabled=false;PT.apply($('#loginWrap'));render()};
$('#logout').onclick=()=>{S.auth=false;save();render()};
$('#reset').onclick=()=>{store.clear();S=seed();S.auth=true;save();render();toast(T('Demo reset','Демо сброшено'))};
PT.onLang(()=>render());
document.addEventListener('DOMContentLoaded',()=>render());
})();
</script>
