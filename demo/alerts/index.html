eft-color:var(--red)}.toast.gold{border-left-color:var(--gold)}.modal{position:fixed;inset:0;z-index:2500;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}.modal .card{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow)}.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13.5px}/* login */.login{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:24px 16px}.lg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);max-width:960px;width:100%;padding:0;overflow:hidden;box-shadow:var(--shadow)}.lg-hero{padding:26px;background:linear-gradient(160deg,color-mix(in srgb,var(--red) 12%,var(--panel2)),var(--panel2));border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px;min-width:0}.lg-hero h2{margin:0;font-size:24px;letter-spacing:-.01em}.lg-hero p{margin:0;color:var(--muted);font-size:13.5px}.lg-st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.lg-st div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11.5px;color:var(--muted)}.lg-st b{display:block;font-size:17px;color:var(--text)}.lg-f{padding:26px;display:flex;flex-direction:column;gap:14px;min-width:0}.lg-f h2{margin:0;font-size:20px}.lg-f .btn.pri{justify-content:center;padding:12px 16px;font-size:15px}.small{font-size:12px}@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.split,.intro,.cmp{grid-template-columns:minmax(0,1fr)}}@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:0;top:45px;z-index:1500;width:270px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}.side.open{transform:none}.menu-btn{display:inline-flex}main{padding:14px 14px 50px}.head h1{font-size:20px}.lg{grid-template-columns:minmax(0,1fr)}.lg-hero{border-right:0;border-bottom:1px solid var( <body data-demo-en="AlertNet — Early warning &amp; cell broadcast alerts" data-demo-ru="AlertNet — Раннее оповещение и cell broadcast">
<section class="login" id="login">
  <div class="card lg">
    <div class="lg-hero">
      <div class="brand" style="padding:0"><b>⚠</b><div>AlertNet<small data-en="Civil Emergency Management Agency · Republic of Calvera" data-ru="Агентство по чрезвычайным ситуациям · Республика Кальвера"></small></div></div>
      <h2 data-en="National early warning console" data-ru="Национальная консоль раннего оповещения"></h2>
      <p data-en="Draw the affected area, set CAP severity, preview what phones will show and broadcast through cell broadcast, SMS, apps, TV/radio and sirens — in one step." data-ru="Нарисуйте зону бедствия, задайте уровень по CAP, посмотрите, что покажут телефоны, и разошлите через cell broadcast, SMS, приложения, ТВ/радио и сирены — за один шаг."></p>
      <div class="map" id="lgMap"></div>
      <div class="lg-st">
        <div><b>6.84M</b><span data-en="population covered" data-ru="жителей в охвате"></span></div>
        <div><b>3</b><span data-en="mobile operators" data-ru="мобильных оператора"></span></div>
        <div><b>&lt; 60 s</b><span data-en="to every phone" data-ru="до каждого телефона"></span></div>
      </div>
    </div>
    <div class="lg-f">
      <h2 data-en="Sign in" data-ru="Вход"></h2>
      <div class="f"><label data-en="Officer ID" data-ru="Табельный номер"></label><input class="input mono" id="lgId" value="DO-4471" autocomplete="off"></div>
      <div class="f"><label data-en="Password" data-ru="Пароль"></label><input class="input" id="lgPw" type="password" value="calvera-demo"></div>
      <div class="f"><label data-en="Role" data-ru="Роль"></label>
        <div class="opts">
          <button class="opt on" data-role="officer"><b data-en="Duty officer" data-ru="Дежурный"></b><span data-en="Compose and submit alerts" data-ru="Готовит и подаёт оповещения"></span></button>
          <button class="opt" data-role="super"><b data-en="Supervisor" data-ru="Руководитель смены"></b><span data-en="Approve and broadcast" data-ru="Утверждает и рассылает"></span></button>
        </div></div>
      <button class="btn pri" id="loginBtn" data-en="Sign in to console" data-ru="Войти в консоль"></button>
      <p class="muted small" style="margin:0" data-en="Demo credentials are prefilled. Smart-card MFA is skipped in this prototype." data-ru="Демо-данные уже заполнены. Вход по смарт-карте в прототипе пропущен."></p>
    </div>
  </div>
</section>
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><b>⚠</b><div>AlertNet<small data-en="CEMA · Republic of Calvera" data-ru="АЧС · Республика Кальвера"></small></div></div>
    <div class="sec" data-en="Warning centre" data-ru="Центр оповещения"></div>
    <div id="navBox"></div>
    <div class="grow"></div>
    <div class="who" id="who"></div>

  </aside>
  <main>
    <div class="head">
      <button class="btn sm menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <div class="sp"></div>
      <span class="clock" id="clock"></span>
      <span class="pill ok"><span class="dot"></span><span data-en="Live" data-ru="В эфире"></span></span>
    </div>
    <section class="view" id="v-ops"></section>
    <section class="view" id="v-compose"></section>
    <section class="view" id="v-log"></section>
    <section class="view" id="v-channels"></section>
  </main>
</div>

<div id="modalBox"></div>
<script>
(function(){

function pip(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}
const CS=12,CELLS=[];
for(let gx=CS/2;gx<600;gx+=CS)for(let gy=CS/2;gy<420;gy+=CS){if(pip(gx,gy,LAND)||pip(gx,gy,ISLE)){let w=.03;CITIES.forEach(c=>{const s=14+c.p*11;w+=c.p*Math.exp(-((gx-c.x)**2+(gy-c.y)**2)/(2*s*s))});CELLS.push({x:gx,y:gy,w})}}
(function(){const tot=CELLS.reduce((a,c)=>a+c.w,0);CELLS.forEach(c=>c.p=c.w/tot*6840000)})();
const MAXP=Math.max(...CELLS.map(c=>c.p));
const TOWERS=[];(function(){const r=rng(5);let n=0;while(TOWERS.length<170&&n<5000){n++;let x,y;if(r()<.62){const c=CITIES[Math.floor(r()*CITIES.length)];x=c.x+(r()-.5)*60;y=c.y+(r()-.5)*50}else{x=40+r()*520;y=36+r()*360}if(pip(x,y,LAND)||pip(x,y,ISLE))TOWERS.push([Math.round(x),Math.round(y)])}})();

function est(poly,chans){const o={pop:0,tw:0,area:0,ch:{},uniq:0};if(!poly||poly.length<3)return o;
CELLS.forEach(c=>{if(pip(c.x,c.y,poly))o.pop+=c.p});TOWERS.forEach(t=>{if(pip(t[0],t[1],poly))o.tw++});
let a=0;poly.forEach((p,i)=>{const q=poly[(i+1)%poly.length];a+=p[0]*q[1]-q[0]*p[1]});o.area=Math.abs(a/2)*.81;
let miss=1;(chans||[]).forEach(k=>{const r=CH[k].rate;o.ch[k]=Math.round(o.pop*r);miss*=1-r});o.uniq=Math.round(o.pop*(1-miss));return o}

function rThr(){const c=$('#thr');if(!c)return;const W=620,Hh=220,p=36,mx=Math.max(...THR)*1.15,step=(W-p-6)/(THR.length-1);
const pts=THR.map((v,i)=>[p+i*step,10+(Hh-36)*(1-v/mx)]);
let s=`<svg viewBox="0 0 ${W} ${Hh}">`;for(let i=0;i<=3;i++){const y=10+i*(Hh-36)/3;s+=`<line class="c-ax" x1="${p}" x2="${W-6}" y1="${y}" y2="${y}"/><text class="c-tx" x="${p-6}" y="${y+4}" text-anchor="end">${Math.round(mx*(1-i/3))}</text>`}
s+=`<path class="c-ar" d="M${pts[0][0]},${Hh-26} L${pts.map(q=>q.map(n=>n.toFixed(1)).join(',')).join(' L')} L${pts[pts.length-1][0]},${Hh-26}Z"/><polyline class="c-ln" points="${pts.map(q=>q.map(n=>n.toFixed(1)).join(',')).join(' ')}"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="4" fill="var(--gold)"/>`;
s+=`<text class="c-tx" x="${p}" y="${Hh-8}">−60 ${T('s','с')}</text><text class="c-tx" x="${W-6}" y="${Hh-8}" text-anchor="end">${T('now','сейчас')}</text></svg>`;c.innerHTML=s}

/* ---------- live simulation ---------- */
let tk=0;const fr=rng(Date.now()%100000);
function tick(){tk++;clock();if(!SESS.on)return;const now=Date.now();let changed=false,stChange=false;
S.alerts.forEach(a=>{if(a.status==='delivering'){a.chans.forEach(k=>{const t=a.target[k]||0;if(a.dlv[k]<t){const inc=Math.max(1,Math.round(t*CH[k].spd*(.6+Math.random()*.8)));a.dlv[k]=Math.min(t,a.dlv[k]+inc);changed=true}});
if(a.chans.every(k=>a.dlv[k]>=(a.target[k]||0))){a.status='active';a.hist.push({t:now,en:'Delivery complete · '+num(a.uniq)+' people reached',ru:'Доставка завершена · охват '+num(a.uniq)+' чел.'});stChange=true;toast(T(a.id+': delivery complete',a.id+': доставка завершена'))}}
if(a.status==='active'&&now>a.t+a.exp*H){a.status='expired';a.hist.push({t:now,en:'Expired',ru:'Истекло'});stChange=true}});
const busy=S.alerts.filter(a=>a.status==='delivering').length;
THR.push(Math.max(20,85+Math.sin(tk/6)*14+Math.random()*16+busy*260*(0.7+Math.random()*.5)));THR.shift();
if(tk%3===0)S.ops.forEach(o=>{o.lat=Math.max(380,Math.round(o.lat+(Math.random()-.5)*40))});
let newFeed=false;if(tk%9===0){S.feed.unshift(feedItem(fr));S.feed=S.feed.slice(0,8);newFeed=true}
if(changed||stChange||newFeed||tk%5===0)save();
const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
if(stChange){nav();if(!typing&&(S.view==='log'||S.view==='ops'))render();return}
if(S.view==='log'){S.alerts.forEach(a=>{const c=$(`[data-reach="${a.id}"]`);if(c&&a.status!=='pending'&&a.status!=='rejected')c.textContent=kfmt(reachA(a));a.chans.forEach(k=>{const b=$(`[data-bar="${a.id}:${k}"]`);if(b){b.style.width=((a.dlv[k]||0)/(a.target[k]||1)*100).toFixed(1)+'%';$(`[data-bv="${a.id}:${k}"]`).textContent=kfmt(a.dlv[k]||0)}})});
const tt=$('[data-k="tot"]');if(tt)tt.textContent=kfmt(S.alerts.filter(a=>!['pending','rejected'].includes(a.status)).reduce((s,a)=>s+reachA(a),0))}
if(S.view==='ops'){const r=$('[data-k="r24"]');if(r)r.textContent=kfmt(reached24());if(newFeed)rFeed();if(changed)rDays()}
if(S.view==='channels'){rThr();const t=$('[data-k="thr"]');if(t)t.textContent=Math.round(THR[THR.length-1]);S.ops.forEach(o=>{const c=$(`[data-lat="${o.id}"]`);if(c)c.textContent=o.lat+' '+T('ms','мс')});const l=$('[data-k="lat"]');if(l)l.textContent=Math.round(S.ops.reduce((s,o)=>s+o.lat*o.share,0))+' '+T('ms','мс')}
if(S.view==='compose'&&tk%30===0)rPhone()}
setInterval(tick,1000);

$('#menuBtn').onclick=e=>{e.stopPropagation();$('#side').classList.toggle('open')};
document.addEventListener('click',e=>{const sd=$('#side');if(sd.classList.contains('open')&&!sd.contains(e.target)&&e.target.id!=='menuBtn')sd.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('#reset').onclick=()=>{try{Object.keys(localStorage).filter(k=>k.startsWith('pt_alerts_')).forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()};
PT.onLang(()=>{if(SESS.on)render();else showLogin()});
document.addEventListener('DOMContentLoaded',()=>{if(SESS.on)showApp();else showLogin()});
})();
</script>
