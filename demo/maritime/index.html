<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SeaWatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.app[hidden]{display:none}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal),var(--mal2));color:#fff;flex:none}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left;min-height:42px}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-weight:700}
.nav .cnt.g{background:var(--gold);color:#1a1306}
.grow{flex:1}
.user{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:13px;display:flex;gap:10px;align-items:center}
.user .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold2);font-weight:800;flex:none}
.user b{display:block;font-size:13px} .user span{font-size:11.5px;color:var(--muted)}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mal3);box-shadow:0 0 0 0 var(--mal3);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--mal3) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:14px}
.grid2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:12.5px;min-height:34px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 11px;cursor:pointer;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.mapw{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg2)}
.mapw canvas{display:block;width:100%;height:auto;cursor:crosshair;touch-action:manipulation}
.maptag{position:absolute;left:10px;bottom:10px;font-family:var(--mono);font-size:11px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.feed{display:flex;flex-direction:column;gap:8px;max-height:330px;overflow:auto}
.fi{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);cursor:pointer;text-align:left;width:100%}
.fi:hover{border-color:var(--mal)}
.fi .dt{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.fi b{display:block;font-size:13px} .fi span{font-size:12px;color:var(--muted)}
.fi .tm{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);flex:none}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td,tbody tr.sel td{background:color-mix(in srgb,var(--mal) 8%,transparent)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .input{max-width:280px;flex:1;min-width:160px}
select.input{min-height:40px}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mal2),var(--mal3));transition:width .4s}
.prog.gold i{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.prog.red i{background:var(--red)}
.al{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--bg2)}
.al.sel{border-color:var(--mal);box-shadow:0 0 0 3px color-mix(in srgb,var(--mal) 15%,transparent)}
.al .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.al .top b{flex:1;min-width:150px}
.al .meta{font-size:12.5px;color:var(--muted);margin:6px 0 8px;overflow-wrap:anywhere}
.ok-t{color:var(--mal3)} .bad-t{color:var(--red)} .warn-t{color:var(--amber)} .gold-t{color:var(--gold2)}
.hist{font-size:12px;border-left:2px solid var(--line2);padding-left:10px;margin:8px 0 0;display:flex;flex-direction:column;gap:3px}
.hist .t{font-family:var(--mono);color:var(--dim);margin-right:6px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.fgrid .full{grid-column:1/-1}
.err{color:var(--red);font-size:12px;margin-top:4px;min-height:0}
.input.bad{border-color:var(--red)}
.sp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.spc{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg2);cursor:pointer;text-align:left;padding:0;width:100%}
.spc.sel{border-color:var(--mal);box-shadow:0 0 0 3px color-mix(in srgb,var(--mal) 15%,transparent)}
.spc svg{display:block;width:100%;height:auto}
.spc .b{padding:10px 12px;font-size:12.5px}
.spc .b b{display:block;font-size:13.5px;margin-bottom:2px}
.sbig svg{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}
.stages{display:flex;flex-direction:column;gap:6px;font-size:12.5px;margin-top:10px}
.stages div{display:flex;gap:8px;align-items:center;color:var(--dim)}
.stages div.ok{color:var(--text)} .stages div.cur{color:var(--gold2)}
.stages i{width:16px;text-align:center;font-style:normal}
.asset{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin-bottom:8px}
.asset .ai{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 18%,transparent);font-size:17px;flex:none}
.asset b{display:block;font-size:13.5px} .asset span{font-size:12px;color:var(--muted)}
.asset .sp{flex:1;min-width:0}
.task{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--bg2)}
.task .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.task .top b{flex:1;min-width:140px}
.chart svg{width:100%;height:auto;display:block}
.hbar{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-bottom:8px}
.hbar span{width:130px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .prog{flex:1}
.hbar b{width:34px;text-align:right;font-family:var(--mono);font-size:12px}
.gauge{display:flex;align-items:center;gap:12px}
.gauge .n{font-size:30px;font-weight:800;letter-spacing:-.02em}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13.5px}
.toasts{position:fixed;right:16px;bottom:16px;pointer-events:none;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:330px;animation:fade .2s;overflow-wrap:anywhere}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.scrim{display:none}
/* login */
.login{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 600px at 80% -10%,color-mix(in srgb,var(--mal) 16%,transparent),transparent 60%),var(--bg)}
.login[hidden]{display:none}
.lbox{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);max-width:960px;width:100%;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.lart{position:relative;padding:28px;background:linear-gradient(160deg,color-mix(in srgb,var(--mal) 22%,var(--bg2)),var(--bg2));display:flex;flex-direction:column;gap:14px;min-height:420px;overflow:hidden}
.lart svg.radar{position:absolute;right:-90px;bottom:-90px;width:380px;height:380px;opacity:.9}
.lart h2{margin:0;font-size:28px;letter-spacing:-.02em;position:relative}
.lart p{margin:0;color:var(--muted);max-width:380px;position:relative;font-size:14px}
.lart ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;position:relative;font-size:13.5px}
.lart li:before{content:"◆";color:var(--gold);margin-right:8px;font-size:10px}
.lform{padding:28px;display:flex;flex-direction:column;gap:14px}
.lform h3{margin:0;font-size:20px}
.roles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.role{border:1px solid var(--line2);border-radius:12px;padding:10px;cursor:pointer;background:var(--bg2);text-align:left}
.role.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 12%,transparent)}
.role b{display:block;font-size:13px} .role span{font-size:11.5px;color:var(--muted)}
.demo-note{font-size:12px;color:var(--muted);border:1px dashed var(--line2);border-radius:10px;padding:8px 10px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid2e{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:270px;max-width:85vw;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:45px 0 0 0;background:rgba(0,0,0,.4);z-index:1400}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
  .lbox{grid-template-columns:minmax(0,1fr)}
  .lart{min-height:0;padding:22px}
  .lart svg.radar{width:240px;height:240px;right:-70px;bottom:-70px;opacity:.5}
}
@media (max-width:560px){.fgrid,.roles{grid-template-columns:minmax(0,1fr)}.kpi .v{font-size:20px}.kpis{gap:10px}.kpi{padding:12px}.hbar span{width:96px}.toolbar .input{max-width:none}.lform{padding:20px}.lart h2{font-size:22px}.card{padding:14px}}
</style>
</head>
<body data-demo-en="SeaWatch — Maritime surveillance &amp; vessel tracking" data-demo-ru="SeaWatch — Морской мониторинг и отслеживание судов">

<section class="login" id="login">
  <div class="lbox">
    <div class="lart">
      <svg class="radar" viewBox="0 0 200 200" aria-hidden="true">
        <g fill="none" style="stroke:var(--mal3)" stroke-opacity=".35"><circle cx="100" cy="100" r="96"/><circle cx="100" cy="100" r="70"/><circle cx="100" cy="100" r="44"/><circle cx="100" cy="100" r="18"/><path d="M100 4V196M4 100H196"/></g>
        <path d="M100 100L100 4A96 96 0 0 1 183 52Z" style="fill:var(--mal3)" fill-opacity=".18"><animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="6s" repeatCount="indefinite"/></path>
        <circle cx="140" cy="62" r="4" style="fill:var(--gold)"/><circle cx="64" cy="132" r="4" style="fill:var(--red)"/><circle cx="120" cy="150" r="3" style="fill:var(--blue)"/>
      </svg>
      <div class="brand" style="padding:0;position:relative"><b>⚓</b><div>SeaWatch<small data-en="Maritime Safety Agency · Republic of Valmora" data-ru="Агентство морской безопасности · Республика Вальмора"></small></div></div>
      <h2 data-en="One maritime picture for the whole coast" data-ru="Единая морская обстановка по всему побережью"></h2>
      <p data-en="AIS, satellite SAR imagery and machine learning fused into a live operations picture for watch officers and patrol commanders." data-ru="AIS, спутниковые радарные снимки и машинное обучение в одной живой картине обстановки для дежурных и командиров патрулей."></p>
      <ul>
        <li data-en="Live map of moving vessels and patrol assets" data-ru="Живая карта движущихся судов и патрульных средств"></li>
        <li data-en="Dark vessel alerts: AIS gaps, SAR targets without AIS" data-ru="Тревоги по «тёмным» судам: пропуски AIS, цели SAR без AIS"></li>
        <li data-en="Oil spill detection on SAR scenes" data-ru="Обнаружение нефтяных разливов на снимках SAR"></li>
        <li data-en="Patrol tasking with live progress" data-ru="Постановка задач патрулям с живым ходом выполнения"></li>
      </ul>
    </div>
    <div class="lform">
      <h3 data-en="Sign in to the operations centre" data-ru="Вход в оперативный центр"></h3>
      <div class="f"><label data-en="Service ID" data-ru="Служебный ID"></label><input class="input" id="lUser" value="watch.officer@msa.vlm" autocomplete="username"><div class="err" id="lUserErr"></div></div>
      <div class="f"><label data-en="Password" data-ru="Пароль"></label><input class="input" id="lPass" type="password" value="demo-2026" autocomplete="current-password"><div class="err" id="lPassErr"></div></div>
      <div class="f"><label data-en="Role" data-ru="Роль"></label>
        <div class="roles">
          <button class="role on" data-role="watch"><b data-en="Watch officer" data-ru="Дежурный офицер"></b><span data-en="Monitors, triages alerts" data-ru="Мониторинг, разбор тревог"></span></button>
          <button class="role" data-role="cmd"><b data-en="Patrol commander" data-ru="Командир патрулей"></b><span data-en="Tasks ships, aircraft, drones" data-ru="Задачи судам, самолётам, дронам"></span></button>
        </div></div>
      <button class="btn pri" id="loginBtn" style="justify-content:center;min-height:44px" data-en="Sign in" data-ru="Войти"></button>
      <div class="demo-note" data-en="Demo credentials are prefilled. Fictional agency and data — no real vessels." data-ru="Демо-данные для входа уже заполнены. Вымышленное агентство и данные — реальных судов нет."></div>
    </div>
  </div>
</section>

<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><b>⚓</b><div>SeaWatch<small data-en="Maritime Safety Agency" data-ru="Агентство морской безопасности"></small></div></div>
    <div class="sec" data-en="Operations" data-ru="Операции"></div>
    <button class="nav" data-view="ops"><span class="ic">🗺</span><span data-en="Live map" data-ru="Живая карта"></span></button>
    <button class="nav" data-view="alerts"><span class="ic">⚠</span><span data-en="Dark vessel alerts" data-ru="Тёмные суда"></span><span class="cnt" id="cAl"></span></button>
    <button class="nav" data-view="vessels"><span class="ic">⛴</span><span data-en="Vessel profiles" data-ru="Профили судов"></span></button>
    <button class="nav" data-view="spills"><span class="ic">🛢</span><span data-en="Oil spill detection" data-ru="Нефтяные разливы"></span><span class="cnt" id="cSp"></span></button>
    <button class="nav" data-view="patrol"><span class="ic">🚁</span><span data-en="Patrol tasking" data-ru="Задачи патрулям"></span><span class="cnt g" id="cTk"></span></button>
    <div class="sec" data-en="Insight" data-ru="Аналитика"></div>
    <button class="nav" data-view="stats"><span class="ic">📊</span><span data-en="Analytics" data-ru="Аналитика"></span></button>
    <div class="grow"></div>
    <div class="user"><div class="av" id="uAv">WO</div><div style="min-width:0"><b id="uName"></b><span id="uRole"></span></div></div>
    <div class="row" style="margin-top:8px">
      <button class="btn sm" id="reset" style="flex:1;justify-content:center" data-en="Reset demo" data-ru="Сбросить демо"></button>
      <button class="btn sm" id="logout" style="flex:1;justify-content:center" data-en="Log out" data-ru="Выйти"></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main>
    <div class="head">
      <button class="btn sm menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div style="min-width:0"><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <div class="sp"></div>
      <span class="pill ok"><span class="live-dot"></span><span class="mono" id="clock"></span></span>
    </div>
    <section class="view" id="v-ops"></section>
    <section class="view" id="v-alerts"></section>
    <section class="view" id="v-vessels"></section>
    <section class="view" id="v-spills"></section>
    <section class="view" id="v-patrol"></section>
    <section class="view" id="v-stats"></section>
  </main>
</div>
<div class="toasts" id="toasts"></div>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const P='pt_maritime_';
const ls={get(k){try{return JSON.parse(localStorage.getItem(P+k))}catch(e){return null}},set(k,v){try{localStorage.setItem(P+k,JSON.stringify(v))}catch(e){}},
  clear(){try{Object.keys(localStorage).filter(k=>k.startsWith(P)).forEach(k=>localStorage.removeItem(k))}catch(e){}}};
const hm=t=>new Date(t).toISOString().slice(11,16);
const ago=t=>{const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?T('now','сейчас'):m<60?m+T(' min',' мин'):Math.floor(m/60)+T(' h',' ч')};
function toast(m,c){const t=document.createElement('div');t.className='toast '+(c||'');t.innerHTML=m;$('#toasts').append(t);setTimeout(()=>t.remove(),4000)}

  if($('#kT'))$('#kT').textContent=S.tasks.filter(t=>t.st==='enroute'||t.st==='onscene').length;
}
function draw(){
  if(!cv||!ctx||S.view!=='ops'||!document.body.contains(cv))return;
  const W=cv.width,H=cv.height,k=W/1000,ky=H/600,t=Date.now();
  const X=x=>x*k,Y=y=>y*ky;
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,rgba(C['--blue'],.10));g.addColorStop(1,rgba(C['--mal'],.06));ctx.fillStyle=C['--bg2'];ctx.fillRect(0,0,W,H);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // graticule
  ctx.strokeStyle=rgba(C['--line2'],.55);ctx.lineWidth=1;ctx.font=`${Math.max(9,10*k)}px ${cssv('--mono')||'monospace'}`;ctx.fillStyle=C['--dim'];
  for(let i=1;i<10;i++){ctx.beginPath();ctx.moveTo(X(i*100),0);ctx.lineTo(X(i*100),H);ctx.stroke()}
  for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(0,Y(i*100));ctx.lineTo(W,Y(i*100));ctx.stroke()}
  if(k>.5){for(let i=2;i<10;i+=2)ctx.fillText(lon(i*100).toFixed(1)+'°E',X(i*100)+3,H-5);for(let i=1;i<6;i+=2)ctx.fillText(lat(i*100).toFixed(1)+'°N',4,Y(i*100)-3)}
  // land
  LAND.forEach(p=>{ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(X(q[0]),Y(q[1])):ctx.moveTo(X(q[0]),Y(q[1])));ctx.closePath();ctx.fillStyle=C['--panel2'];ctx.fill();ctx.strokeStyle=C['--line2'];ctx.lineWidth=1.5;ctx.stroke()});
  if(S.layers.zones){
    ctx.setLineDash([6*k+2,5*k+2]);ctx.strokeStyle=rgba(C['--gold'],.8);ctx.lineWidth=1.4;ctx.beginPath();TERR.forEach((q,i)=>i?ctx.lineTo(X(q[0]),Y(q[1])):ctx.moveTo(X(q[0]),Y(q[1])));ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.ellipse(X(MPA.x),Y(MPA.y),MPA.r*k,MPA.r*ky,0,0,Math.PI*2);ctx.fillStyle=rgba(C['--mal'],.12);ctx.fill();ctx.strokeStyle=rgba(C['--mal'],.7);ctx.stroke();
    if(k>.5){ctx.fillStyle=C['--mal3'];ctx.fillText(T('Seal Bank MPA','Зона «Тюленья банка»'),X(MPA.x-50),Y(MPA.y+MPA.r+14));ctx.fillStyle=C['--gold'];ctx.fillText(T('12 nm limit','граница 12 миль'),X(520),Y(40))}
  }
  // ports
  PORTS.forEach(p=>{ctx.fillStyle=C['--text'];ctx.beginPath();ctx.arc(X(p.x),Y(p.y),3*k+1.5,0,Math.PI*2);ctx.fill();if(k>.45){ctx.fillStyle=C['--muted'];ctx.font=`600 ${Math.max(9,11*k)}px ${cssv('--font')||'sans-serif'}`;ctx.fillText(p.n,X(p.x)+6,Y(p.y)-6)}});
  // spills
  if(S.layers.spills)S.spills.filter(s=>s.st!=='fp'&&s.st!=='closed').forEach(s=>{ctx.beginPath();s.poly.forEach((q,i)=>{const px=X(s.x+q[0]),py=Y(s.y+q[1]);i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.closePath();ctx.fillStyle=rgba(C['--amber'],.28);ctx.fill();ctx.strokeStyle=C['--amber'];ctx.lineWidth=1.2;ctx.stroke();if(k>.45){ctx.fillStyle=C['--amber'];ctx.font=`700 ${Math.max(9,10*k)}px ${cssv('--mono')||'monospace'}`;ctx.fillText(s.id,X(s.x)+16*k,Y(s.y)-10*k)}});
  // tracks
  if(S.layers.tracks)S.vessels.forEach(v=>{if(!S.layers.ais&&v.ais)return;ctx.beginPath();v.track.forEach((q,i)=>i?ctx.lineTo(X(q[0]),Y(q[1])):ctx.moveTo(X(q[0]),Y(q[1])));ctx.strokeStyle=rgba(C[TYPES[v.type][2]],.35);ctx.lineWidth=1;ctx.stroke()});
  // task lines
  S.tasks.filter(t=>t.st==='enroute'||t.st==='onscene').forEach(tk=>{const a=A(tk.aid),p=targetPos(tk);if(!a||!p||!S.layers.patrol)return;ctx.setLineDash([4,4]);ctx.strokeStyle=rgba(C['--gold'],.8);ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(X(a.x),Y(a.y));ctx.lineTo(X(p.x),Y(p.y));ctx.stroke();ctx.setLineDash([])});
  // vessels
  const sz=Math.max(4.5,7*k);
  S.vessels.forEach(v=>{
    if(v.ais&&!S.layers.ais)return;if(!v.ais&&!S.layers.dark)return;
    const px=X(v.x),py=Y(v.y);
    if(!v.ais){const ph=(t%1600)/1600;ctx.beginPath();ctx.arc(px,py,sz+ph*sz*2.2,0,Math.PI*2);ctx.strokeStyle=rgba(C['--red'],1-ph);ctx.lineWidth=1.5;ctx.stroke();
      ctx.save();ctx.translate(px,py);ctx.rotate(Math.PI/4);ctx.fillStyle=C['--red'];ctx.fillRect(-sz*.6,-sz*.6,sz*1.2,sz*1.2);ctx.restore();
      if(k>.45){ctx.fillStyle=C['--red'];ctx.font=`700 ${Math.max(9,10*k)}px ${cssv('--mono')||'monospace'}`;ctx.fillText(T('DARK','ТЁМН.'),px+sz+3,py+3)}}
    else{ctx.save();ctx.translate(px,py);ctx.rotate(v.hdg);ctx.beginPath();ctx.moveTo(sz*1.4,0);ctx.lineTo(-sz*.8,sz*.7);ctx.lineTo(-sz*.4,0);ctx.lineTo(-sz*.8,-sz*.7);ctx.closePath();ctx.fillStyle=C[TYPES[v.type][2]];ctx.fill();ctx.restore()}
    if(S.sel===v.id){ctx.beginPath();ctx.arc(px,py,sz*2.3,0,Math.PI*2);ctx.strokeStyle=C['--text'];ctx.lineWidth=1.6;ctx.stroke();if(k>.3){ctx.fillStyle=C['--text'];ctx.font=`700 ${Math.max(10,11*k)}px ${cssv('--font')||'sans-serif'}`;const tx=px+sz*2.6,lw=ctx.measureText(v.name).width;ctx.fillText(v.name,tx+lw>W?px-sz*2.6-lw:tx,py-sz*1.6)}}
  });
  // patrol assets
  if(S.layers.patrol)S.assets.forEach(a=>{const px=X(a.x),py=Y(a.y),r=Math.max(6,9*k);ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fillStyle=a.st==='maint'?rgba(C['--gold'],.35):C['--gold'];ctx.fill();ctx.strokeStyle=C['--bg'];ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#1a1306';ctx.font=`800 ${Math.max(8,10*k)}px ${cssv('--font')||'sans-serif'}`;ctx.textAlign='center';ctx.fillText(a.kind==='air'?'A':a.kind==='drone'?'D':'P',px,py+3.5*Math.max(.8,k));ctx.textAlign='start';
    if(S.selA===a.id){ctx.beginPath();ctx.arc(px,py,r*2,0,Math.PI*2);ctx.strokeStyle=C['--gold2'];ctx.lineWidth=1.6;ctx.stroke()}});
  const tg=$('#mtag');if(tg){const v=V(S.sel);tg.textContent=v?v.name+' · '+pos(v.x,v.y):S.selA?A(S.selA).name:T('Tap a vessel','Нажмите на судно')}
}

/* ---------- simulation ---------- */
function newAlert(v,type,sev,en,ru,silent){const a={id:'DV-'+(S.an++),vid:v.id,type,sev,st:'new',t:Date.now(),x:v.x,y:v.y,note:'',hist:[{t:Date.now(),en,ru}]};S.alerts.unshift(a);if(S.alerts.length>60)S.alerts.length=60;
  if(!silent)toast(`<b>${a.id}</b> · ${T(AT[type][0],AT[type][1])} — ${esc(v.name)}`,sev==='high'?'bad':'gold');return a}
function targetPos(tk){if(tk.tk==='spill'){const s=SP(tk.ref);return s?{x:s.x,y:s.y}:null}const a=AL(tk.ref);if(!a)return null;const v=V(a.vid);return v?{x:v.x,y:v.y}:{x:a.x,y:a.y}}
function targetName(tk){if(tk.tk==='spill')return tk.ref+' '+T('oil spill','разлив');const a=AL(tk.ref);const v=a&&V(a.vid);return tk.ref+(v?' · '+v.name:'')}
let lastSlow=0,lastSave=0,lastEvt=Date.now();
function step(dt){
  S.vessels.forEach(v=>{
    const d=v.spd*dt*6;let nx=v.x+Math.cos(v.hdg)*d,ny=v.y+Math.sin(v.hdg)*d;
    if(blocked(nx,ny)){v.hdg+=Math.PI*(0.6+Math.random()*0.5);return}
    v.x=nx;v.y=ny;if(Math.random()<0.004)v.hdg+=(Math.random()-.5)*0.9;
  });
  S.assets.forEach(a=>{
    const tk=S.tasks.find(t=>t.aid===a.id&&t.st==='enroute');let tx,ty;
    if(tk){const p=targetPos(tk);if(!p)return;tx=p.x;ty=p.y}else if(a.st==='rtb'){tx=a.hx;ty=a.hy}else if(tk===undefined&&S.tasks.find(t=>t.aid===a.id&&t.st==='onscene')){const p=targetPos(S.tasks.find(t=>t.aid===a.id&&t.st==='onscene'));if(p){a.x=p.x+8;a.y=p.y-8}return}else return;
    const dx=tx-a.x,dy=ty-a.y,dd=Math.hypot(dx,dy),sp=KIND[a.kind][3]*dt*6;
    if(dd<=sp+4){a.x=tx;a.y=ty;if(tk){tk.st='onscene';tk.arr=Date.now();a.st='onscene';toast(`<b>${esc(a.name)}</b> ${T('is on scene','на месте')} · ${tk.id}`,'gold');save();refreshLight()}else{a.st='ready';save();refreshLight()}}
    else{const nx=a.x+dx/dd*sp,ny=a.y+dy/dd*sp;if(a.kind==='ship'&&inLand(nx,ny)){a.x+=dy/dd*sp;a.y-=dx/dd*sp}else{a.x=nx;a.y=ny}}
  });
  S.msgs+=Math.round(dt*(30+Math.random()*25));
}
function slow(){
  S.vessels.forEach(v=>{v.track.push([Math.round(v.x),Math.round(v.y)]);if(v.track.length>40)v.track.shift();
    if(v.type==='fish'&&v.ais&&Math.hypot(v.x-MPA.x,v.y-MPA.y)<MPA.r&&!S.alerts.some(a=>a.vid===v.id&&a.type==='mpa'&&a.st!=='res')){newAlert(v,'mpa','med','Fishing vessel entered Seal Bank MPA at '+(v.spd*10).toFixed(1)+' kn','Рыболовное судно вошло в охраняемую зону на '+(v.spd*10).toFixed(1).replace('.',',')+' уз');refreshLight()}});
  if(Date.now()-lastEvt>14000){lastEvt=Date.now();
    const lit=S.vessels.filter(v=>v.ais),drk=S.vessels.filter(v=>!v.ais);
    if(drk.length>=6||(drk.length>2&&Math.random()<.4)){const v=drk[Math.floor(Math.random()*drk.length)];v.ais=true;v.darkSince=null;
      const a=S.alerts.find(x=>x.vid===v.id&&x.st!=='res');if(a)a.hist.push({t:Date.now(),en:'AIS signal re-acquired',ru:'Сигнал AIS восстановлен'});
      toast(`${esc(v.name)} — ${T('AIS signal re-acquired','сигнал AIS восстановлен')}`)}
    else{const v=lit[Math.floor(Math.random()*lit.length)];v.ais=false;v.gaps++;v.darkSince=Date.now();
      const sar=Math.random()<.4;newAlert(v,sar?'sar':'gap',v.type==='tanker'||v.type==='fish'?'high':'med',sar?'SAR detection with no matching AIS track':'AIS transmissions stopped while under way at '+(v.spd*10).toFixed(1)+' kn',sar?'Обнаружение SAR без совпадающего трека AIS':'Передачи AIS прекратились на ходу, '+(v.spd*10).toFixed(1).replace('.',',')+' уз')}
    refreshLight();save()}
}
function refreshLight(){shell();if(S.view==='ops')updOps();else if(S.view==='alerts')rAlerts();else if(S.view==='patrol')rTaskList()}
let prev=performance.now();
function loop(){const now=performance.now();const dt=Math.min(.5,(now-prev)/1000);prev=now;
  if(AUTH){step(dt);
    if(Date.now()-lastSlow>2000){lastSlow=Date.now();slow();if(S.view==='ops'){const v=V(S.sel);if(v&&$('#sPos')){$('#sPos').textContent=pos(v.x,v.y);$('#sSpd').textContent=(v.spd*10).toFixed(1)+' '+T('kn','уз')+' · '+Math.round((v.hdg*180/Math.PI+450)%360)+'°'}if($('#kM'))$('#kM').textContent=S.msgs.toLocaleString()}
      if(S.view==='patrol')updTaskProg();$('#clock').textContent=hm(Date.now())+' UTC'}
    if(Date.now()-lastSave>5000){lastSave=Date.now();save()}
    draw()}
  requestAnimationFrame(loop)}

/* ---------- alerts ---------- */
function rAlerts(){
  const el=$('#v-alerts');const F=[['open','Open','Открытые'],['new','New','Новые'],['inv','Investigating','Проверяются'],['task','Patrol tasked','Патруль'],['res','Resolved','Закрытые'],['all','All','Все']];
  const list=S.alerts.filter(a=>S.af==='all'||(S.af==='open'?a.st!=='res':a.st===S.af)).sort((a,b)=>(a.st==='res')-(b.st==='res')||({high:0,med:1,low:2}[a.sev]-{high:0,med:1,low:2}[b.sev])||b.t-a.t);
  const cnt=k=>S.alerts.filter(a=>k==='all'||(k==='open'?a.st!=='res':a.st===k)).length;
  const sev=s=>`<span class="pill ${s==='high'?'bad':s==='med'?'warn':''}">${s==='high'?T('High','Высокая'):s==='med'?T('Medium','Средняя'):T('Low','Низкая')}</span>`;
  el.innerHTML=`<div class="card" style="margin-bottom:14px"><div class="row"><div style="flex:1;min-width:220px;font-size:13.5px" class="muted">${T('Dark vessel logic fuses AIS with SAR satellite passes and coastal radar. A vessel that stops transmitting, or a SAR target with no AIS match, raises an alert. Triage it, task a patrol, or resolve.','Логика «тёмных» судов сводит AIS со спутниковыми пролётами SAR и береговыми радарами. Судно, переставшее передавать сигнал, или цель SAR без AIS поднимают тревогу. Разберите её, направьте патруль или закройте.')}</div></div>
    <div class="chips" style="margin-top:12px">${F.map(f=>`<button class="chip ${S.af===f[0]?'on':''}" data-af="${f[0]}">${T(f[1],f[2])} · ${cnt(f[0])}</button>`).join('')}</div></div>
  <div id="alList">${list.length?list.map(a=>{const v=V(a.vid);return `<div class="al ${S.alSel===a.id?'sel':''}" id="al-${a.id}"><div class="top"><span class="mono" style="font-weight:700">${a.id}</span><b>${T(AT[a.type][0],AT[a.type][1])} — ${esc(v?v.name:'?')}</b>${sev(a.sev)}${stPill(AST,a.st)}</div>
    <div class="meta">${tname(v.type)} · ${flagName(v.flag)} · MMSI <span class="mono">${v.mmsi}</span> · <span class="mono">${pos(a.x,a.y)}</span> · ${ago(a.t)} ${T('ago','назад')} · ${T('risk','риск')} ${risk(v)}</div>
    <div class="row">${a.st==='new'?`<button class="btn sm" data-aa="inv" data-id="${a.id}">${T('Start investigation','Начать проверку')}</button>`:''}
    ${a.st!=='res'&&a.st!=='task'?`<button class="btn sm gold" data-aa="task" data-id="${a.id}">${T('Task patrol','Направить патруль')}</button>`:''}
    ${a.st!=='res'&&a.st!=='esc'?`<button class="btn sm danger" data-aa="esc" data-id="${a.id}">${T('Escalate to Navy','Передать ВМС')}</button>`:''}
    ${a.st!=='res'?`<button class="btn sm pri" data-aa="res" data-id="${a.id}">${T('Resolve','Закрыть')}</button>`:`<button class="btn sm" data-aa="reopen" data-id="${a.id}">${T('Reopen','Открыть снова')}</button>`}
    <button class="btn sm" data-aa="map" data-id="${a.id}">${T('Show on map','На карте')}</button><button class="btn sm" data-aa="prof" data-id="${a.id}">${T('Profile','Профиль')}</button></div>
    <div class="hist">${a.hist.slice(-4).map(h=>`<div><span class="t">${hm(h.t)}</span>${esc(T(h.en,h.ru))}</div>`).join('')}</div></div>`}).join(''):`<div class="card empty">${T('No alerts in this filter.','Нет тревог в этом фильтре.')}</div>`}</div>
  <div class="card" id="resBox" style="display:none;margin-top:12px"></div>`;
  $$('[data-af]',el).forEach(b=>b.onclick=()=>{S.af=b.dataset.af;save();rAlerts()});
  $$('[data-aa]',el).forEach(b=>b.onclick=()=>alertAct(b.dataset.aa,AL(b.dataset.id)));
}
function alertAct(act,a){
  const v=V(a.vid),now=Date.now();S.alSel=a.id;
  if(act==='inv'){a.st='inv';a.hist.push({t:now,en:'Investigation opened by '+AUTH.user.split('@')[0],ru:'Проверку открыл '+AUTH.user.split('@')[0]});toast(a.id+' · '+T('investigating','проверяется'))}
  else if(act==='esc'){a.st='esc';a.sev='high';a.hist.push({t:now,en:'Escalated to Navy maritime operations centre',ru:'Передано в морской оперативный центр ВМС'});v.watch=true;toast(a.id+' · '+T('escalated, vessel added to watchlist','передано выше, судно в списке наблюдения'),'bad')}
  else if(act==='res'){
    const box=$('#resBox');box.style.display='block';box.scrollIntoView({behavior:'smooth',block:'center'});
    const R=[['Coverage gap / technical','Тень покрытия / техника'],['Vessel contacted, AIS restored','Связались с судном, AIS восстановлен'],['Violation confirmed, fine issued','Нарушение подтверждено, штраф'],['False alarm','Ложная тревога']];
    box.innerHTML=`<h3>${T('Resolve','Закрыть')} ${a.id}</h3><div class="fgrid"><div class="f"><label>${T('Outcome','Итог')}</label><select class="input" id="rOut">${R.map((r,i)=>`<option value="${i}">${T(r[0],r[1])}</option>`).join('')}</select></div>
      <div class="f"><label>${T('Note (min 5 chars)','Заметка (не меньше 5 символов)')}</label><input class="input" id="rNote" placeholder="${T('What was found','Что установлено')}"><div class="err" id="rErr"></div></div></div>
      <div class="row" style="margin-top:12px"><button class="btn pri sm" id="rGo">${T('Confirm resolution','Подтвердить закрытие')}</button><button class="btn sm" id="rCancel">${T('Cancel','Отмена')}</button></div>`;
    $('#rCancel').onclick=()=>{box.style.display='none'};
    $('#rGo').onclick=()=>{const n=$('#rNote').value.trim();if(n.length<5){$('#rNote').classList.add('bad');$('#rErr').textContent=T('Please describe the outcome.','Опишите итог.');return}
      const r=R[+$('#rOut').value];a.st='res';a.hist.push({t:Date.now(),en:'Resolved: '+r[0]+' — '+n,ru:'Закрыто: '+r[1]+' — '+n});if(+$('#rOut').value===1&&!v.ais){v.ais=true;v.darkSince=null}
      if(+$('#rOut').value===2)v.insp.push({t:Date.now(),en:'Violation: AIS switched off — fine issued',ru:'Нарушение: AIS отключён — штраф'});
      save();shell();rAlerts();toast(a.id+' · '+T('resolved','закрыта'))};
    return}
  else if(act==='reopen'){a.st='inv';a.hist.push({t:now,en:'Reopened',ru:'Открыто снова'})}
  else if(act==='task'){pre={tk:'alert',ref:a.id};go('patrol');return}
  else if(act==='map'){S.sel=a.vid;S.selA=null;go('ops');return}
  else if(act==='prof'){S.vSel=a.vid;go('vessels');return}
  save();shell();rAlerts();
}

function vTable(){
  const q=S.vq.trim().toLowerCase();

  const src=s.src&&V(s.src);

   ${src&&big?`<path d="M ${W/2+40} ${H/2-10} q 60 -30 140 -60" style="stroke:var(--red)" stroke-dasharray="5 4" fill="none" stroke-width="1.6"/><circle cx="${W/2+40}" cy="${H/2-10}" r="4" style="fill:var(--red)"/><text x="${W/2+60}" y="${H/2-44}" style="fill:var(--red);font:600 11px var(--mono)">${esc(src.name)}</text>`:''}
   <text x="8" y="${H-8}" style="fill:var(--muted);font:600 ${big?11:9}px var(--mono)">${s.sat} · ${s.scene}</text>${big?`<g transform="translate(${W-40} 30)"><path d="M0 -14 L5 4 L0 0 L-5 4Z" style="fill:var(--text)"/><text x="-4" y="18" style="fill:var(--muted);font:700 10px var(--mono)">N</text></g>`:''}</svg>`;

function rTaskList(){
  const tl=$('#taskList'),al=$('#assetList');if(!tl)return;
  const ms={id:['Identify & photograph','Опознать и сфотографировать'],board:['Hail and board','Вызов и досмотр'],shadow:['Shadow vessel','Сопровождение судна'],sample:['Sample slick, deploy booms','Пробы, боновые заграждения']};
  tl.innerHTML=S.tasks.length?S.tasks.slice(0,12).map(tk=>{const a=A(tk.aid);const p=targetPos(tk);const rem=p?distNm(a,p):0;const pr=tk.st==='enroute'?Math.max(2,Math.min(98,100-rem/Math.max(1,tk.d0||rem)*100)):tk.st==='abort'?0:100;
    return `<div class="task"><div class="top"><span class="mono" style="font-weight:700">${tk.id}</span><b>${KIND[a.kind][2]} ${esc(a.name)} → ${esc(targetName(tk))}</b>${stPill(TST,tk.st)}</div>
    <div class="meta muted" style="font-size:12.5px;margin:6px 0 8px">${tk.ms?T(ms[tk.ms][0],ms[tk.ms][1])+' · ':''}${T('priority','приоритет')} ${tk.pri==='high'?T('high','высокий'):tk.pri==='med'?T('medium','средний'):T('low','низкий')} · ${T('issued','выдана')} ${hm(tk.t)} UTC${tk.note?' · '+esc(tk.note):''}</div>
    <div class="prog ${tk.st==='onscene'?'gold':''}"><i data-tp="${tk.id}" style="width:${pr}%"></i></div><div class="muted mono" style="font-size:11.5px;margin-top:4px" data-tr="${tk.id}">${tk.st==='enroute'?rem+' nm '+T('to go','осталось'):tk.st==='onscene'?T('on scene since ','на месте с ')+hm(tk.arr||Date.now()):''}</div>
    ${tk.st==='enroute'||tk.st==='onscene'?`<div class="row" style="margin-top:8px">${tk.st==='onscene'?`<button class="btn sm pri" data-tc="${tk.id}">${T('Complete & report','Завершить и доложить')}</button>`:''}<button class="btn sm danger" data-tx="${tk.id}">${T('Abort','Отменить')}</button></div>`:''}</div>`}).join(''):`<div class="empty">${T('No taskings yet.','Задач пока нет.')}</div>`;
  $$('[data-tc]',tl).forEach(b=>b.onclick=()=>finishTask(b.dataset.tc,true));
  $$('[data-tx]',tl).forEach(b=>b.onclick=()=>finishTask(b.dataset.tx,false));
  al.innerHTML=S.assets.map(a=>`<div class="asset"><div class="ai">${KIND[a.kind][2]}</div><div class="sp"><b>${esc(a.name)}</b><span>${T(KIND[a.kind][0],KIND[a.kind][1])} · <span class="mono">${pos(a.x,a.y)}</span></span></div>${assetPill(a)}</div>`).join('')+
   `<div class="muted" style="font-size:12px;margin-top:8px">${T('Assets move on the Live map in real time. Arrival switches the tasking to On scene.','Средства движутся по живой карте в реальном времени. По прибытии задача переходит в «На месте».')}</div>`;
}
function updTaskProg(){S.tasks.filter(t=>t.st==='enroute').forEach(tk=>{const a=A(tk.aid),p=targetPos(tk);if(!p)return;const rem=distNm(a,p);const e=$(`[data-tp="${tk.id}"]`),r=$(`[data-tr="${tk.id}"]`);if(e)e.style.width=Math.max(2,Math.min(98,100-rem/Math.max(1,tk.d0||rem)*100))+'%';if(r)r.textContent=rem+' nm '+T('to go','осталось')});
  $$('#assetList .asset .mono').forEach((m,i)=>{const a=S.assets[i];if(a)m.textContent=pos(a.x,a.y)})}
function finishTask(id,ok){const tk=S.tasks.find(t=>t.id===id),a=A(tk.aid);tk.st=ok?'done':'abort';tk.done=Date.now();a.st='rtb';
  if(tk.tk==='alert'){const al=AL(tk.ref);if(al){if(ok){al.st='res';al.hist.push({t:Date.now(),en:'Resolved on scene by '+a.name+': vessel identified, report filed',ru:'Закрыто на месте ('+a.name+'): судно опознано, рапорт подан'});const v=V(al.vid);if(v){v.insp.unshift({t:Date.now(),en:'At-sea check by '+a.name,ru:'Проверка в море: '+a.name});if(!v.ais){v.ais=true;v.darkSince=null}}}else{al.st='inv';al.hist.push({t:Date.now(),en:'Tasking aborted',ru:'Задача отменена'})}}}
  else{const s=SP(tk.ref);if(s)s.st=ok?'closed':'ver'}
  save();shell();rPatrol();toast(tk.id+' · '+(ok?T('completed, asset returning to base','выполнена, средство возвращается'):T('aborted','отменена')),ok?'':'bad')}

/* ---------- analytics ---------- */
function rStats(){
  const el=$('#v-stats');
  const h=S.hourly,mx=Math.max(...h)*1.1,W=600,H=200,pl=40,pb=24;
  const px=i=>pl+i*(W-pl-10)/23,py=v=>H-pb-(v/mx)*(H-pb-10);
  const line=h.map((v,i)=>(i?'L':'M')+px(i).toFixed(1)+' '+py(v).toFixed(1)).join(' ');
  let grid='';for(let i=0;i<=4;i++){const v=mx/4*i;grid+=`<line x1="${pl}" x2="${W-10}" y1="${py(v)}" y2="${py(v)}" style="stroke:var(--line)"/><text x="${pl-6}" y="${py(v)+4}" text-anchor="end" style="fill:var(--dim);font:10px var(--mono)">${(v/1000).toFixed(1)}k</text>`}
  for(let i=0;i<24;i+=4)grid+=`<text x="${px(i)}" y="${H-6}" text-anchor="middle" style="fill:var(--dim);font:10px var(--mono)">${String(i).padStart(2,'0')}:00</text>`;
  const ac=Object.keys(AT).map(k=>[k,S.alerts.filter(a=>a.type===k).length]);const amx=Math.max(1,...ac.map(x=>x[1]));
  const bw=(W-pl-10)/ac.length;
  const bars=ac.map((x,i)=>{const hh=(x[1]/amx)*(H-pb-20);return `<rect x="${pl+i*bw+bw*.2}" y="${H-pb-hh}" width="${bw*.6}" height="${hh}" rx="4" style="fill:var(${['--red','--amber','--mal','--violet','--blue'][i]})"/><text x="${pl+i*bw+bw/2}" y="${H-pb-hh-6}" text-anchor="middle" style="fill:var(--text);font:700 11px var(--mono)">${x[1]}</text><text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle" style="fill:var(--muted);font:10px var(--font)">${T(['Gap','SAR','MPA','Spoof','STS'][i],['Пропуск','SAR','Зона','Подмена','Встреча'][i])}</text>`}).join('');
  const fleet=Object.keys(TYPES).map(k=>[k,S.vessels.filter(v=>v.type===k).length]);
  const done=S.tasks.filter(t=>t.st==='done'&&t.arr);const avg=done.length?Math.round(done.reduce((a,t)=>a+(t.arr-t.t),0)/done.length/1000):null;
  const res=S.alerts.filter(a=>a.st==='res').length;
  el.innerHTML=`<div class="kpis"><div class="card kpi"><div class="l">${T('Alerts raised (session)','Тревог за сеанс')}</div><div class="v">${S.alerts.length}</div><div class="d">${res} ${T('resolved','закрыто')}</div></div>
   <div class="card kpi"><div class="l">${T('Resolution rate','Доля закрытых')}</div><div class="v ok-t">${Math.round(res/Math.max(1,S.alerts.length)*100)}%</div><div class="d">${T('target 80%','цель 80%')}</div></div>
   <div class="card kpi"><div class="l">${T('Avg. time to scene','Ср. время до места')}</div><div class="v gold-t">${avg!=null?avg+T(' s',' с'):'—'}</div><div class="d">${T('demo time, completed taskings','демо-время, выполненные задачи')}</div></div>
   <div class="card kpi"><div class="l">${T('Sensor uptime','Доступность датчиков')}</div><div class="v">99.2%</div><div class="d">${T('AIS shore + Sat-AIS + SAR','береговой AIS + спутниковый + SAR')}</div></div></div>
  <div class="grid2e"><div class="card chart"><h3>${T('AIS messages per hour, last 24 h','Сообщения AIS по часам, 24 ч')}</h3><svg viewBox="0 0 ${W} ${H}">${grid}<path d="${line} L ${px(23)} ${H-pb} L ${pl} ${H-pb}Z" style="fill:var(--mal)" fill-opacity=".14"/><path d="${line}" fill="none" style="stroke:var(--mal3)" stroke-width="2.2"/></svg></div>
   <div class="card chart"><h3>${T('Alerts by type','Тревоги по типам')}</h3><svg viewBox="0 0 ${W} ${H}"><line x1="${pl}" x2="${W-10}" y1="${H-pb}" y2="${H-pb}" style="stroke:var(--line2)"/>${bars}</svg></div>
   <div class="card"><h3>${T('Traffic by vessel type','Трафик по типам судов')}</h3>${fleet.map(f=>`<div class="hbar"><span>${tname(f[0])}</span><div class="prog"><i style="width:${f[1]/S.vessels.length*100}%;background:var(${TYPES[f[0]][2]})"></i></div><b>${f[1]}</b></div>`).join('')}</div>
   <div class="card"><h3>${T('Sensor network','Сеть датчиков')}</h3><div class="tw"><table><thead><tr><th>${T('Sensor','Датчик')}</th><th>${T('Coverage','Покрытие')}</th><th>${T('Status','Статус')}</th></tr></thead><tbody>
    <tr><td>${T('AIS shore stations (14)','Береговые станции AIS (14)')}</td><td>40 nm</td><td><span class="pill ok">${T('Online','В сети')}</span></td></tr>
    <tr><td>Sat-AIS · Lyra constellation</td><td>${T('whole EEZ','вся ИЭЗ')}</td><td><span class="pill ok">${T('Online','В сети')}</span></td></tr>
    <tr><td>Orbis-1A SAR</td><td>${T('next pass','след. пролёт')} ${hm(Date.now()+47*60000)}</td><td><span class="pill ok">${T('Scheduled','По плану')}</span></td></tr>
    <tr><td>Orbis-1B SAR</td><td>${T('next pass','след. пролёт')} ${hm(Date.now()+212*60000)}</td><td><span class="pill ok">${T('Scheduled','По плану')}</span></td></tr>
    <tr><td>${T('Coastal radar Kessby','Береговой радар Кессбю')}</td><td>32 nm</td><td><span class="pill warn">${T('Degraded','Частично')}</span></td></tr></tbody></table></div></div></div>`;
}

/* ---------- login / wiring ---------- */
$$('.role').forEach(b=>b.onclick=()=>{role=b.dataset.role;$$('.role').forEach(x=>x.classList.toggle('on',x===b));$('#lUser').value=role==='cmd'?'patrol.cmdr@msa.vlm':'watch.officer@msa.vlm'});
$('#loginBtn').onclick=()=>{const u=$('#lUser').value.trim(),p=$('#lPass').value;
  $('#lUserErr').textContent=u?'':T('Enter your service ID','Введите служебный ID');$('#lUser').classList.toggle('bad',!u);
  $('#lPassErr').textContent=p?'':T('Enter your password','Введите пароль');$('#lPass').classList.toggle('bad',!p);
  if(!u||!p)return;AUTH={user:u,role};ls.set('auth',AUTH);render();toast(T('Signed in · ','Вход выполнен · ')+esc(u))};
$('#logout').onclick=()=>{AUTH=null;try{localStorage.removeItem(P+'auth')}catch(e){}save();render()};
$('#reset').onclick=()=>{ls.clear();location.reload()};
$$('.nav').forEach(b=>b.onclick=()=>go(b.dataset.view));
$('#menuBtn').onclick=()=>{$('#side').classList.toggle('open');$('#scrim').classList.toggle('on')};
$('#scrim').onclick=()=>{$('#side').classList.remove('open');$('#scrim').classList.remove('on')};
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.view==='ops'){sizeMap();draw()}},120)});
PT.onLang(()=>{readColors();render()});
document.addEventListener('DOMContentLoaded',()=>{if(AUTH)role=AUTH.role;render();requestAnimationFrame(loop)});
})();
