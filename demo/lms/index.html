<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClassGrid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.app[hidden],.auth[hidden]{display:none}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:3px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;font-size:16px;flex:none}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:10px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.nav .lv{margin-left:auto;font-size:10px;background:var(--red);color:#fff;border-radius:999px;padding:1px 7px;font-weight:800;letter-spacing:.05em}
.grow{flex:1}
.who{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:12.5px;margin-top:8px}
.who i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 25%,transparent);color:var(--gold2);font-style:normal;font-weight:800;flex:none}
.who b{display:block;font-size:13px}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.how>div>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold2);flex:none;font-size:13px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f .er{font-size:12px;color:var(--red);min-height:0;margin-top:4px}
.input.bad{border-color:var(--red)}
textarea.input{min-height:96px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.btn.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 18%,transparent);color:var(--mal3)}
.btn.off{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.ok-t{color:var(--mal3)} .bad-t{color:var(--red)} .warn-t{color:var(--amber)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
th.srt{cursor:pointer} th.srt:hover{color:var(--text)}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td,tbody tr.sel td{background:color-mix(in srgb,var(--mal) 7%,transparent)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--mal2),var(--mal3));transition:width .4s}
/* auth */
.auth{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:28px 16px;background:radial-gradient(900px 500px at 15% 10%,color-mix(in srgb,var(--mal) 16%,transparent),transparent),radial-gradient(700px 400px at 90% 90%,color-mix(in srgb,var(--gold) 12%,transparent),transparent)}
.acard{width:100%;max-width:440px;padding:28px;box-shadow:var(--shadow)}
.acard h2{margin:6px 0 4px;font-size:22px}
.acard .f{margin-top:12px}
.roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
.roles div{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:11.5px;color:var(--muted);background:var(--bg2)}
.roles div span{display:block;font-size:18px}
.aerr{color:var(--red);font-size:12.5px;min-height:18px;margin:8px 0}
/* timetable */
table.tt{min-width:700px;table-layout:fixed}
table.tt td{padding:5px;white-space:normal;vertical-align:top}
table.tt th.today{color:var(--mal3)}
table.tt td.pt{width:62px;color:var(--dim);font-size:12px;padding-top:12px}
table.tt th:first-child{width:62px}
.les{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--panel));border-radius:9px;padding:6px 8px;cursor:pointer;min-height:48px}
.les b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.les span{font-size:11px;color:var(--muted)}
.les.on{outline:2px solid var(--c);outline-offset:1px}
.les.live{box-shadow:0 0 0 2px color-mix(in srgb,var(--red) 60%,transparent)}
.dotlive{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin:0 4px 0 2px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.ag{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ag:last-child{border-bottom:0}
.ag .tm{font-family:var(--mono);font-size:12px;color:var(--dim);width:44px;flex:none}
.ag .bar{width:4px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.ag .tx{flex:1;min-width:0}
.ag .tx small{display:block;color:var(--muted);font-size:11.5px}
/* assignments */
.as{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--bg2);cursor:pointer;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.as.on{border-color:var(--mal);border-left-color:var(--c);background:color-mix(in srgb,var(--mal) 8%,var(--bg2))}
.as .m{flex:1;min-width:170px}
.as .m b{display:block;font-size:14px}
.as .m span{font-size:12px;color:var(--muted)}
.drop{border:2px dashed var(--line2);border-radius:12px;padding:14px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;display:block}
.drop:hover{border-color:var(--mal)}
.drop input{display:none}
.fb{background:color-mix(in srgb,var(--mal) 8%,transparent);border:1px solid color-mix(in srgb,var(--mal) 40%,transparent);border-radius:12px;padding:12px;font-size:13.5px}
.score{font-size:34px;font-weight:800;letter-spacing:-.02em}
/* gradebook */
.gi{width:58px;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:5px 6px;text-align:center;font-family:var(--mono);font-size:13px}
.gi:focus{outline:none;border-color:var(--mal)}
.gi.bad{border-color:var(--red);color:var(--red)}
.gi.low{color:var(--red)}
.avg{font-family:var(--mono);font-weight:700}
.sub{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--bg2)}
.sub p{margin:6px 0 10px;font-size:13px;color:var(--muted);max-height:72px;overflow:auto}
.reg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.reg div{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--bg2);font-size:13px}
.reg div span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:none;padding:4px 9px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.p{background:var(--mal);color:#fff}.seg button.l{background:var(--amber);color:#1a1306}.seg button.a{background:var(--red);color:#fff}
/* live */
.lvg{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.stage{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#07120f;border:1px solid var(--line2)}
.stage>svg,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage canvas{touch-action:none;cursor:crosshair;background:#fbfdfb}
.stage .tag{position:absolute;left:12px;top:12px;display:flex;gap:6px;z-index:2;flex-wrap:wrap}
.stage .tag span{background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px}
.stage .tag .rec{background:#d63c3c}
.stage .self{position:absolute;right:10px;bottom:10px;width:22%;aspect-ratio:4/3;border-radius:10px;border:2px solid rgba(255,255,255,.6);overflow:hidden;z-index:2;background:#1b2f29;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.stage .idle{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#d9ece4;padding:20px}
.stage .idle div{max-width:360px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.wbt{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.wbt i{width:22px;height:22px;border-radius:50%;display:inline-block;cursor:pointer;border:2px solid var(--line2)}
.wbt i.on{border-color:var(--text)}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;max-height:230px;overflow:auto}
.ppl div{text-align:center;font-size:11px;color:var(--muted);position:relative}
.ppl div i{width:40px;height:40px;border-radius:50%;margin:0 auto 3px;display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff;font-size:13px}
.ppl div.out{opacity:.35}
.ppl div em{position:absolute;top:-2px;right:8px;font-style:normal;font-size:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 12px}
.tabs button{border:0;background:none;padding:8px 10px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--mal)}
.chat{height:220px;overflow:auto;display:flex;flex-direction:column;gap:6px;font-size:13px;padding-right:4px}
.chat div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 9px}
.chat div b{font-size:12px;color:var(--mal3);margin-right:4px}
.chat div.me{background:color-mix(in srgb,var(--mal) 12%,transparent);align-self:flex-end}
.chat div.sys{background:none;border:0;color:var(--dim);font-size:12px;text-align:center;padding:0}
.pbar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}
.pbar .prog{flex:1;height:12px}
.pbar.ok .prog i{background:linear-gradient(90deg,var(--gold),var(--gold2))}
/* parent */
.kid{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.kid .av{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:20px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1306;flex:none}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;max-width:320px}
.cal i{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font-size:10.5px;font-style:normal;font-weight:700;color:#fff}
.msg{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto;margin-bottom:10px}
.msg div{max-width:85%;padding:8px 11px;border-radius:12px;font-size:13.5px;background:var(--bg2);border:1px solid var(--line)}
.msg div.me{align-self:flex-end;background:color-mix(in srgb,var(--mal) 13%,transparent);border-color:color-mix(in srgb,var(--mal) 40%,transparent)}
.msg div small{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.slip{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap;font-size:13.5px}
.slip span{flex:1;min-width:160px}
/* ministry */
.map svg{width:100%;height:auto;display:block}
.map path{cursor:pointer;stroke:var(--bg);stroke-width:2;transition:opacity .15s}
.map path:hover{opacity:.85}
.map path.on{stroke:var(--gold2);stroke-width:3}
.feed div{display:flex;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
.feed div:last-child{border:0}
.feed .t{font-family:var(--mono);font-size:11.5px;color:var(--dim);flex:none;width:44px}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.split,.intro,.lvg{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
}
@media (max-width:560px){.how{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}.kpi .v{font-size:20px}.kpis{gap:10px}.acard{padding:20px}.roles{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:14px}.stage .self{width:30%}}
</style>
</head>
<body data-demo-en="ClassGrid — national K-12 learning platform" data-demo-ru="ClassGrid — национальная школьная платформа обучения">
<section class="auth" id="auth">
  <div class="card acard">
    <div class="brand"><b>◧</b><div>ClassGrid<small data-en="Ministry of Education · Kingdom of Almara" data-ru="Министерство образования · Королевство Алмара"></small></div></div>
    <h2 data-en="Sign in" data-ru="Вход"></h2>
    <div class="muted" style="font-size:13.5px" data-en="One national education ID for students, teachers, parents and ministry staff." data-ru="Единый образовательный ID для учеников, учителей, родителей и сотрудников министерства."></div>
    <div class="f"><label data-en="Education ID or e-mail" data-ru="Образовательный ID или e-mail"></label><input class="input mono" id="uid" value="demo.school@moe.almara.gov" autocomplete="username"></div>
    <div class="f"><label data-en="Password" data-ru="Пароль"></label><input class="input" id="pwd" type="password" value="ClassGrid2025" autocomplete="current-password"></div>
    <div class="aerr" id="aerr"></div>
    <button class="btn pri" id="login" style="width:100%;justify-content:center" data-en="Sign in with the demo account" data-ru="Войти в демо-аккаунт"></button>
    <div class="muted" style="font-size:12px;margin-top:10px;text-align:center" data-en="Demo credentials are prefilled. The account opens all four roles." data-ru="Демо-данные уже заполнены. Аккаунт открывает все четыре роли."></div>
    <div class="roles"><div><span>🎒</span><b data-en="Student" data-ru="Ученик"></b></div><div><span>🧑‍🏫</span><b data-en="Teacher" data-ru="Учитель"></b></div><div><span>👪</span><b data-en="Parent" data-ru="Родитель"></b></div><div><span>🏛</span><b data-en="Ministry" data-ru="Министерство"></b></div></div>
  </div>
</section>
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><b>◧</b><div>ClassGrid<small data-en="Al-Noor Intermediate · 8B" data-ru="Средняя школа «Аль-Нур» · 8Б"></small></div></div>
    <div id="navs"></div>
    <div class="grow"></div>
    <div class="who"><i id="whoI">LH</i><div><b id="whoN"></b><span class="muted" id="whoR"></span></div></div>
    <button class="btn sm" id="reset" style="margin-top:8px;justify-content:center" data-en="Reset demo" data-ru="Сбросить демо"></button>
    <button class="btn sm" id="logout" style="margin-top:6px;justify-content:center" data-en="Sign out" data-ru="Выйти"></button>
  </aside>
  <main>
    <div class="head">
      <button class="btn sm menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <div class="sp"></div>
      <span class="pill" id="livePill"></span>
    </div>
    <div class="intro">
      <div class="card"><h3><span data-en="How to try it" data-ru="Как попробовать"></span></h3>
        <div class="how">
          <div><b>1</b><span data-en="As a <b>student</b>, open the timetable, then submit an assignment with an answer and a file." data-ru="Как <b>ученик</b> откройте расписание и сдайте задание с ответом и файлом."></span></div>
          <div><b>2</b><span data-en="As a <b>teacher</b>, grade it, edit the gradebook, publish homework and run a <b>live class</b> with a poll and whiteboard." data-ru="Как <b>учитель</b> оцените работу, правьте журнал, выдайте задание и проведите <b>онлайн-урок</b> с опросом и доской."></span></div>
          <div><b>3</b><span data-en="See the grade in the <b>parent view</b>; check attendance on the <b>ministry dashboard</b>." data-ru="Увидьте оценку в <b>кабинете родителя</b>; посещаемость — на <b>панели министерства</b>."></span></div>
        </div></div>
      <div class="card"><dl class="facts">

function pct(i){let s=0,m=0;S.cols.forEach(c=>{const v=S.scores[i][c.id];if(v!=null){s+=v;m+=c.max}});return m?s/m*100:null}
function gbTable(){
  const avgC=c=>{const v=S.scores.map(s=>s[c.id]).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length/c.max*100:null};
  $('#gbt').innerHTML=`<table><thead><tr><th>${T('Student','Ученик')}</th>${S.cols.map(c=>`<th title="${T('max','макс.')} ${c.max}">${esc(T(c.en,c.ru))}<br><span style="font-weight:500;text-transform:none">/${c.max}</span></th>`).join('')}<th>${T('Average','Средний')}</th><th>${T('Today','Сегодня')}</th></tr></thead><tbody>
  ${STUD.map((s,i)=>{const p=pct(i);return `<tr><td><b>${stn(i)}</b></td>${S.cols.map(c=>{const v=S.scores[i][c.id];return `<td><input class="gi ${v!=null&&v/c.max<.6?'low':''}" data-s="${i}" data-c="${c.id}" value="${v==null?'':v}" inputmode="decimal" aria-label="${stn(i)} ${esc(c.en)}"></td>`}).join('')}<td class="avg ${p==null?'':p<60?'bad-t':p>=85?'ok-t':''}">${p==null?'—':p.toFixed(1)+'%'}</td><td>${{p:'<span class="pill ok">'+T('present','был')+'</span>',l:'<span class="pill warn">'+T('late','опоздал')+'</span>',a:'<span class="pill bad">'+T('absent','нет')+'</span>'}[S.att[i]]}</td></tr>`}).join('')}
  <tr><td><b>${T('Class average','Средний по классу')}</b></td>${S.cols.map(c=>{const a=avgC(c);return `<td class="avg">${a==null?'—':a.toFixed(0)+'%'}</td>`}).join('')}<td class="avg">${(STUD.map((_,i)=>pct(i)).filter(x=>x!=null).reduce((a,b)=>a+b,0)/STUD.length).toFixed(1)}%</td><td></td></tr></tbody></table>`;
  $$('.gi').forEach(inp=>inp.onchange=()=>{const c=S.cols.find(x=>x.id===inp.dataset.c),i=+inp.dataset.s,t=inp.value.trim().replace(',','.');
    if(t===''){S.scores[i][c.id]=null}else{const v=Number(t);if(!isFinite(v)||v<0||v>c.max){inp.classList.add('bad');toast(T('Score must be 0–'+c.max,'Балл должен быть 0–'+c.max),'bad');return}S.scores[i][c.id]=v;
      const asg=S.assign.find(a=>a.id===c.id);if(i===0&&asg&&asg.st!=='graded'){asg.st='graded';asg.score=v;asg.fb=['Graded in the gradebook.','Оценено в журнале.']}}
    save();gbTable();nav()});
}

let liveGen=0,pollTimer=null;
function startLive(){
  const g=++liveGen;
  Object.assign(S.live,{on:true,start:Date.now(),joined:[],hands:[],poll:null,chat:[{sys:1,en:'Class started · recording on',ru:'Урок начат · идёт запись'}]});save();render();
  const order=[0,3,1,8,4,12,2,9,5,13,10,7];
  order.forEach((idx,k)=>setTimeout(()=>{if(g!==liveGen||!S.live.on)return;if(!S.live.joined.includes(idx))S.live.joined.push(idx);save();if(S.view==='live')rSide()},500+k*380));
  setTimeout(()=>{if(g!==liveGen||!S.live.on)return;S.live.hands.push(3);S.live.chat.push({who:3,en:'Is it the same method as yesterday?',ru:'Это тот же метод, что вчера?'});save();if(S.view==='live')rSide()},6000);
}
function endLive(){

}

function drawWB(){

  x.strokeStyle='#e3ebe6';x.lineWidth=1;for(let i=1;i<16;i++){x.beginPath();x.moveTo(i*cv.width/16,0);x.lineTo(i*cv.width/16,cv.height);x.stroke()}for(let i=1;i<9;i++){x.beginPath();x.moveTo(0,i*cv.height/9);x.lineTo(cv.width,i*cv.height/9);x.stroke()}

    ${[0,Math.floor((per-1)/2),per-1].map(i=>`<text x="${x(i)}" y="${H-8}" font-size="10" text-anchor="${i?i===per-1?'end':'middle':'start'}" fill="${mu}">${fmtD(Date.now()-(per-1-i)*DAY)}</text>`).join('')}</svg>`;
  const map=`<svg viewBox="0 0 380 300">${REGP.map((d,i)=>`<path d="${d}" fill="${col(regAtt[i])}" class="${S.mreg===i?'on':''}" data-rg="${i}"><title>${T(REG[i][0],REG[i][1])}: ${regAtt[i].toFixed(1)}%</title></path>`).join('')}${REGC.map((c,i)=>`<text x="${c[0]}" y="${c[1]}" text-anchor="middle" font-size="11" font-weight="700" fill="#06140f" pointer-events="none">${regAtt[i].toFixed(1)}%</text><text x="${c[0]}" y="${c[1]+13}" text-anchor="middle" font-size="9" fill="#06140f" pointer-events="none">${esc(T(REG[i][0],REG[i][1]).split(' ')[0])}</text>`).join('')}</svg>`;
  let list=sch.filter(s=>(S.mreg<0||s.rg===S.mreg)&&(!S.mq||(T(SCHN[s.n][0],SCHN[s.n][1])+' '+s.id).toLowerCase().includes(S.mq.toLowerCase())));
  const [sk,sd]=S.msort;list.sort((a,b)=>(a[sk]-b[sk])*sd);
  const totStu=1243870+sch.reduce((a,s)=>a+s.stu,0)-sch.reduce((a,s)=>a+s.stu,0);
  const todayAtt=regAtt.reduce((a,v)=>a+v,0)/8;
  const live=S.live.on?1:0;
  const schoolName=s=>PT.lang==='ru'?`${SCHT[s.t][1]} «${SCHN[s.n][1]}»`:`${SCHN[s.n][0]} ${SCHT[s.t][0]}`;
  const feed=[];if(S.attSub)feed.push([fmtT(S.attTs),T(`Al-Noor Intermediate · 8B register received · ${S.att.filter(x=>x!=='a').length}/14 present`,`«Аль-Нур» · журнал 8Б получен · присутствуют ${S.att.filter(x=>x!=='a').length}/14`)]);
  if(S.live.on)feed.push([fmtT(S.live.start),T('Live class started · Mathematics 8B, Al-Noor','Начат онлайн-урок · Математика 8Б, «Аль-Нур»')]);
  if(S.live.last)feed.push([fmtT(S.live.last.ts),T(`Live class ended · ${S.live.last.att}/14 attended`,`Онлайн-урок завершён · были ${S.live.last.att}/14`)]);
  feed.push(['08:12',T('Ibn Sina Secondary · 31 registers received','«Ибн Сина» · получено 31 журнал')],['08:05',T('Gulf Coast · attendance below 90% in 3 schools','Побережье залива · посещаемость ниже 90% в 3 школах')],['07:58',T('Nightly sync: 3,412 schools, 0 errors','Ночная синхронизация: 3 412 школ, 0 ошибок')]);
  el.innerHTML=`<div class="kpis"><div class="card kpi"><div class="l">${T('Students enrolled','Учеников')}</div><div class="v">${num(totStu)}</div><div class="d">${T('3,412 schools · 8 regions','3 412 школ · 8 регионов')}</div></div>
   <div class="card kpi"><div class="l">${T('Attendance today','Посещаемость сегодня')}</div><div class="v ${todayAtt>=95?'ok-t':'warn-t'}">${todayAtt.toFixed(1)}%</div><div class="d">${T('target 95%','цель 95%')}</div></div>
   <div class="card kpi"><div class="l">${T('Live classes now','Онлайн-уроков сейчас')}</div><div class="v">${num(1874+live)}</div><div class="d">${T('peak today 2,306','пик сегодня 2 306')}</div></div>
   <div class="card kpi"><div class="l">${T('Schools at risk','Школ в зоне риска')}</div><div class="v bad-t">${sch.filter(s=>s.att<90).length}</div><div class="d">${T('attendance < 90% (sample)','посещаемость < 90% (выборка)')}</div></div></div>
  <div class="grid2" style="margin-bottom:14px"><div class="card chart"><h3>${T('National attendance trend','Посещаемость по стране')}<span class="sp"></span><span class="chips">${[7,14,30].map(p=>`<button class="chip ${S.mper===p?'on':''}" data-per="${p}">${p} ${T('days','дн.')}</button>`).join('')}</span></h3>${chart}<div class="legend"><span><i style="background:${m1}"></i>${T('attendance %','посещаемость %')}</span><span><i style="background:${cssv('--blue')}"></i>${T('live-class participation %','участие в онлайн-уроках %')}</span></div></div>
   <div class="card map"><h3>${T('Attendance by region','Посещаемость по регионам')}<span class="sp"></span>${S.mreg>=0?`<button class="btn sm" id="clrReg">✕ ${T(REG[S.mreg][0],REG[S.mreg][1])}</button>`:''}</h3>${map}<div class="legend" style="margin-top:6px"><span><i style="background:#17b58a"></i>≥95</span><span><i style="background:#7bc96f"></i>92–95</span><span><i style="background:#f0a83a"></i>89–92</span><span><i style="background:#ef5a5a"></i>&lt;89</span></div></div></div>
  <div class="grid2"><div class="card"><h3>${T('Schools','Школы')}${S.mreg>=0?' · '+T(REG[S.mreg][0],REG[S.mreg][1]):''}<span class="sp"></span><input class="input" id="mq" style="max-width:220px" value="${esc(S.mq)}" data-en-ph="Search school…" data-ru-ph="Поиск школы…"></h3>
   <div class="tw"><table><thead><tr><th>${T('School','Школа')}</th><th>${T('Region','Регион')}</th>${[['stu','Students','Учеников'],['att','Attendance','Посещ.'],['live','Live / wk','Онлайн/нед'],['avg','Avg grade','Ср. балл']].map(c=>`<th class="srt" data-sort="${c[0]}">${T(c[1],c[2])}${sk===c[0]?(sd>0?' ▲':' ▼'):''}</th>`).join('')}<th></th></tr></thead><tbody>
   ${list.map(s=>`<tr><td><b>${esc(schoolName(s))}</b>${s.fresh?' <span class="pill ok">'+T('new data','новые данные')+'</span>':''}<br><span class="muted mono" style="font-size:11px">${s.id}</span></td><td>${T(REG[s.rg][0],REG[s.rg][1])}</td><td class="mono">${num(s.stu)}</td><td><b class="mono ${s.att<90?'bad-t':s.att<93?'warn-t':'ok-t'}">${s.att}%</b></td><td class="mono">${s.live}</td><td class="mono">${s.avg}%</td><td>${s.att<92?(S.alerts[s.id]?`<span class="pill ok">${T('Advisory sent','Уведомлено')}</span>`:`<button class="btn sm" data-al="${s.id}">${T('Send advisory','Уведомить')}</button>`):''}</td></tr>`).join('')||`<tr><td colspan="7" class="muted">${T('No schools match','Школы не найдены')}</td></tr>`}</tbody></table></div></div>
   <div class="card feed"><h3>${T('Live data feed','Поток данных')}<span class="sp"></span><span class="pill ok">● ${T('streaming','онлайн')}</span></h3>${feed.map(f=>`<div><span class="t">${f[0]}</span><span>${esc(f[1])}</span></div>`).join('')}</div></div>`;
  PT.apply(el);
  $$('[data-per]',el).forEach(b=>b.onclick=()=>{S.mper=+b.dataset.per;save();rMin()});
  $$('[data-rg]',el).forEach(p=>p.onclick=()=>{const i=+p.dataset.rg;S.mreg=S.mreg===i?-1:i;save();rMin()});
  const cr=$('#clrReg',el);if(cr)cr.onclick=()=>{S.mreg=-1;save();rMin()};
  $$('[data-sort]',el).forEach(h=>h.onclick=()=>{const k=h.dataset.sort;S.msort=[k,S.msort[0]===k?-S.msort[1]:-1];save();rMin()});
  $$('[data-al]',el).forEach(b=>b.onclick=()=>{S.alerts[b.dataset.al]=1;save();toast('✓ '+T('Advisory sent to the school principal and regional office','Уведомление отправлено директору и в региональный отдел'));rMin()});
  const q=$('#mq',el);q.oninput=()=>{S.mq=q.value;save();clearTimeout(q._t);q._t=setTimeout(()=>{rMin();const n=$('#mq');n.focus();n.setSelectionRange(n.value.length,n.value.length)},250)};
}

/* ---------- AUTH & BOOT ---------- */
$('#login').onclick=()=>{
  const u=$('#uid').value.trim(),p=$('#pwd').value;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u)&&!/^\d{10}$/.test(u)){$('#aerr').textContent=T('Enter a valid e-mail or 10-digit education ID','Введите e-mail или 10-значный образовательный ID');$('#uid').classList.add('bad');return}
  if(p.length<6){$('#aerr').textContent=T('Password must be at least 6 characters','Пароль не короче 6 символов');$('#pwd').classList.add('bad');return}
  $('#aerr').textContent='';S.auth=true;save();render();toast('👋 '+T('Signed in — all four roles unlocked','Вход выполнен — открыты все четыре роли'));
};
['uid','pwd'].forEach(k=>$('#'+k).addEventListener('input',e=>e.target.classList.remove('bad')));
$('#pwd').onkeydown=e=>{if(e.key==='Enter')$('#login').click()};
$('#logout').onclick=()=>{S.auth=false;save();render()};
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#reset').onclick=()=>{liveGen++;clearInterval(pollTimer);store.clear();S=seed();S.auth=true;draft={ans:'',file:''};save();render();toast(T('Demo reset','Демо сброшено'))};
PT.onLang(()=>render());
document.addEventListener('DOMContentLoaded',()=>{if(S.live.on){S.live.on=false;S.live.last={att:S.live.joined.length,dur:(Date.now()-S.live.start)/1000,ts:Date.now()};save()}render()});
})();
</script>
