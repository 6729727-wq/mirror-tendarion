<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeoSphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.app[hidden],.login[hidden]{display:none}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal2),var(--mal3));color:#fff;font-size:16px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left;min-height:40px}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.grow{flex:1}
.who{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:12.5px;display:flex;gap:10px;align-items:center}
.who .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--mal) 22%,transparent);color:var(--mal3);font-weight:800;flex:none}
.who b{display:block;font-size:13px}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.mt{margin-top:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f .err{font-size:11.5px;color:var(--red);margin-top:4px}
.input.bad{border-color:var(--red)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea.input{min-height:72px;resize:vertical;font-family:inherit}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
td.num{text-align:right;font-family:var(--mono)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;min-height:34px;color:var(--text)}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.log{font-size:13px}
.log div{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.log div:last-child{border:0}
.log .t{font-family:var(--mono);font-size:11.5px;color:var(--dim);flex:none;width:44px;padding-top:2px}
.log span{flex:1;min-width:0;overflow-wrap:anywhere}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)}.toast.gold{border-left-color:var(--gold)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mal2),var(--mal3));transition:width .6s}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .big{font-size:36px}
/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
.map{position:relative;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;height:600px;background:#cfe3f0;touch-action:none;user-select:none}
.map svg{width:100%;height:100%;display:block;cursor:grab}
.map svg.drag{cursor:grabbing}
.map.meas svg{cursor:crosshair}
.mtools{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.mtools button{width:38px;height:38px;border-radius:10px;border:1px solid rgba(0,0,0,.15);background:rgba(255,255,255,.94);color:#15202b;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.mtools button.on{background:#0f7a5c;color:#fff;border-color:#0f7a5c}
.mtools hr{border:0;height:4px;margin:0}
.coord{position:absolute;left:12px;bottom:12px;background:rgba(15,23,32,.78);color:#e8eef3;font-family:var(--mono);font-size:11.5px;padding:5px 9px;border-radius:8px;z-index:2}
.scalebar{position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.9);color:#15202b;font-size:11px;font-weight:700;padding:4px 8px 6px;border-radius:8px;z-index:2}
.scalebar i{display:block;height:5px;border:2px solid #15202b;border-top:0;margin-top:2px}
.mread{position:absolute;right:12px;top:12px;background:rgba(15,23,32,.86);color:#fff;padding:10px 12px;border-radius:12px;z-index:2;font-size:13px;max-width:calc(100% - 80px)}
.mread b{font-size:19px;font-family:var(--mono);display:block}
.mread .row button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;font-weight:600}
.lyr{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;cursor:pointer;border-bottom:1px dashed var(--line)}
.lyr:last-child{border:0}
.lyr input{width:17px;height:17px;accent-color:var(--mal);flex:none}
.lyr .sw{width:22px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.15)}
.lyr span{flex:1;min-width:0}
.lyr small{color:var(--dim);font-family:var(--mono);font-size:11px}
.bases{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.base{border:2px solid var(--line2);border-radius:10px;padding:0;overflow:hidden;cursor:pointer;background:var(--panel2);text-align:left;color:var(--text)}
.base i{display:block;height:34px}
.base span{display:block;font-size:12px;font-weight:600;padding:5px 8px}
.base.on{border-color:var(--mal)}
.attr{width:100%;font-size:13px}
.attr td{padding:6px 4px;white-space:normal;border-bottom:1px dashed var(--line)}
.attr td:first-child{color:var(--muted);width:42%}
/* catalogue */
.ds{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--panel);margin-bottom:10px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px}
.ds .thumb{width:64px;height:64px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.ds .thumb svg{width:100%;height:100%;display:block}
.ds .ttl{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.ds .ab{font-size:13px;color:var(--muted);margin:4px 0 8px}
.ds .meta{display:flex;flex-wrap:wrap;gap:6px}
.kv{display:grid;grid-template-columns:180px minmax(0,1fr);font-size:13.5px}
.kv div{padding:8px 4px;border-bottom:1px solid var(--line);overflow-wrap:anywhere;min-width:0}
.kv div:nth-child(odd){color:var(--muted);font-weight:600}
.url{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.url code{flex:1;min-width:0;font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere;word-break:break-all}
.url .tag{font-size:11px;font-weight:800;width:62px;flex:none;color:var(--mal3)}
pre.json{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;margin:0;max-height:420px;white-space:pre}
pre.json .k{color:var(--blue)}pre.json .s{color:var(--mal3)}pre.json .n{color:var(--gold2)}
.req{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg2);margin-bottom:10px}
.req .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.req .top b{flex:1;min-width:160px;overflow-wrap:anywhere}
.req .sub{font-size:12.5px;color:var(--muted);margin:6px 0 8px;overflow-wrap:anywhere}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--mal);flex:none}
/* login */
.login{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 500px at 70% -10%,color-mix(in srgb,var(--blue) 16%,transparent),transparent),radial-gradient(900px 400px at 0% 110%,color-mix(in srgb,var(--mal) 14%,transparent),transparent)}
.lbox{width:100%;max-width:960px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:center}
.lhero h2{font-size:34px;line-height:1.15;margin:12px 0;letter-spacing:-.02em}
.lhero p{color:var(--muted);margin:0 0 16px}
.lhero ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:14px}
.lhero li{display:flex;gap:10px}
.lhero li b{color:var(--mal3)}
.lcard{padding:24px;border-radius:var(--r2);box-shadow:var(--shadow)}
.lcard h3{margin:0 0 4px;font-size:19px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.mapwrap{grid-template-columns:minmax(0,1fr)}.map{height:520px}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
  .lbox{grid-template-columns:minmax(0,1fr)}
  .lhero h2{font-size:26px}
}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}.kpi .v{font-size:20px}.kpis{gap:10px}.map{height:440px}.kv{grid-template-columns:minmax(0,1fr)}.kv div:nth-child(odd){border-bottom:0;padding-bottom:0}.ds{grid-template-columns:minmax(0,1fr)}.ds .thumb{display:none}.lhero ul{display:none}.mread b{font-size:16px}}
</style>
</head>
<body data-demo-en="GeoSphere — National spatial data infrastructure" data-demo-ru="GeoSphere — Национальная инфраструктура пространственных данных">
<section class="login" id="login">
  <div class="lbox">
    <div class="lhero">
      <span class="pill gold" data-en="National Geospatial Agency · Republic of Veloria" data-ru="Национальное геопространственное агентство · Республика Велория"></span>

      <ul>
        <li><b>✓</b><span data-en="Authoritative layers from 14 agencies in one viewer" data-ru="Эталонные слои 14 ведомств в одном просмотрщике"></span></li>
        <li><b>✓</b><span data-en="OGC API, WMS/WFS, vector tiles and STAC for every dataset" data-ru="OGC API, WMS/WFS, векторные тайлы и STAC для каждого набора"></span></li>
        <li><b>✓</b><span data-en="ISO 19115 metadata, INSPIRE-aligned" data-ru="Метаданные ISO 19115, совместимо с INSPIRE"></span></li>
      </ul>
    </div>
    <div class="card lcard">
      <h3 data-en="Sign in to GeoSphere" data-ru="Вход в GeoSphere"></h3>
      <div class="muted" style="font-size:13px;margin-bottom:14px" data-en="Demo account is prefilled — one click to continue." data-ru="Демо-аккаунт уже заполнен — войдите одним нажатием."></div>
      <div class="f" style="margin-bottom:10px"><label data-en="Email" data-ru="Эл. почта"></label><input class="input" id="lEmail" value="analyst@geo.gov.vl" autocomplete="username"><div class="err" id="lEmailE"></div></div>
      <div class="f" style="margin-bottom:14px"><label data-en="Password" data-ru="Пароль"></label><input class="input" id="lPass" type="password" value="geosphere-demo" autocomplete="current-password"><div class="err" id="lPassE"></div></div>
      <button class="btn pri" id="loginBtn" style="width:100%;justify-content:center;padding:12px" data-en="Sign in with demo account" data-ru="Войти в демо-аккаунт"></button>
      <div class="muted" style="font-size:11.5px;margin-top:10px;text-align:center" data-en="Public viewer works without sign-in · downloads need an account" data-ru="Просмотр открыт без входа · для выгрузки нужен аккаунт"></div>
    </div>
  </div>
</section>
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><b>◍</b><div>GeoSphere<small data-en="National SDI · Veloria" data-ru="Национальная ИПД · Велория"></small></div></div>
    <div class="sec" data-en="Explore" data-ru="Обзор"></div>
    <button class="nav" data-view="dash"><span class="ic">◧</span><span data-en="Overview" data-ru="Сводка"></span></button>
    <button class="nav" data-view="map"><span class="ic">🗺</span><span data-en="Map viewer" data-ru="Карта"></span></button>
    <button class="nav" data-view="catalogue"><span class="ic">▤</span><span data-en="Data catalogue" data-ru="Каталог данных"></span><span class="cnt" id="cntD"></span></button>
    <div class="sec" data-en="Data" data-ru="Данные"></div>
    <button class="nav" data-view="downloads"><span class="ic">⬇</span><span data-en="Download requests" data-ru="Запросы на выгрузку"></span><span class="cnt" id="cntR"></span></button>
    <button class="nav" data-view="metadata"><span class="ic">ⓘ</span><span data-en="Metadata &amp; services" data-ru="Метаданные и сервисы"></span></button>
    <div class="grow"></div>
    <div class="who"><div class="av">LM</div><div><b data-en="Lena Marovic" data-ru="Лена Марович"></b><span data-en="GIS analyst · Ministry of Environment" data-ru="ГИС-аналитик · Минприроды"></span></div></div>
    <div class="row" style="margin-top:8px">
      <button class="btn sm" id="logout" style="flex:1;justify-content:center" data-en="Log out" data-ru="Выйти"></button>
      <button class="btn sm" id="reset" style="flex:1;justify-content:center" data-en="Reset demo" data-ru="Сбросить демо"></button>
    </div>
  </aside>
  <main>
    <div class="head">
      <button class="btn sm menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <span class="sp"></span>
      <span class="pill ok" id="svc"></span>
    </div>
    <section class="view" id="v-dash"></section>
    <section class="view" id="v-map"></section>
    <section class="view" id="v-catalogue"></section>
    <section class="view" id="v-downloads"></section>
    <section class="view" id="v-metadata"></section>
  </main>
</div>
<div class="toasts" id="toasts"></div>
<script>
(function(){
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru), L=o=>o?(o[PT.lang]||o.en):'';
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P='pt_geo_',KEY=P+'state',D=86400000;
const nf=(n,d=0)=>Number(n).toLocaleString(PT.lang==='ru'?'ru-RU':'en-US',{maximumFractionDigits:d,minimumFractionDigits:d});
const fmtD=t=>new Date(t).toLocaleDateString(PT.lang==='ru'?'ru-RU':'en-GB',{day:'numeric',month:'short',year:'numeric'});
const hm=t=>new Date(t).toLocaleTimeString(PT.lang==='ru'?'ru-RU':'en-GB',{hour:'2-digit',minute:'2-digit'});
function toast(m,c){const t=document.createElement('div');t.className='toast '+(c||'');t.innerHTML=m;$('#toasts').append(t);setTimeout(()=>t.remove(),3600)}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const KM=0.5; // km per map unit
const lon=x=>20+x*0.006, lat=y=>47-y*0.00457;
const pts=s=>s.trim().split(/\s+/).map(p=>p.split(',').map(Number));
const shoe=a=>{let s=0;for(let i=0;i<a.length;i++){const [x1,y1]=a[i],[x2,y2]=a[(i+1)%a.length];s+=x1*y2-x2*y1}return Math.abs(s)/2};
const plen=a=>{let s=0;for(let i=1;i<a.length;i++)s+=Math.hypot(a[i][0]-a[i-1][0],a[i][1]-a[i-1][1]);return s};

/* ---------- geography ---------- */
const COUNTRY='120,180 260,90 430,70 560,110 700,80 860,150 920,280 880,420 900,540 760,630 560,610 420,650 270,590 150,500 90,360';
const C='500,350';
const REG=[
 {id:'r1',n:{en:'Northern Highlands',ru:'Северное нагорье'},code:'VL-NH',pop:812400,cap:{en:'Tessa',ru:'Тесса'},g:C+' 90,360 120,180 260,90 430,70 560,110'},
 {id:'r2',n:{en:'Eastern Plains',ru:'Восточные равнины'},code:'VL-EP',pop:1264900,cap:{en:'Dravin',ru:'Дравин'},g:C+' 560,110 700,80 860,150 920,280 880,420'},
 {id:'r3',n:{en:'Southern Coast',ru:'Южное побережье'},code:'VL-SC',pop:1530200,cap:{en:'Port Salen',ru:'Порт-Сален'},g:C+' 880,420 900,540 760,630 560,610 420,650'},
 {id:'r4',n:{en:'Western Valley',ru:'Западная долина'},code:'VL-WV',pop:948300,cap:{en:'Mirel',ru:'Мирел'},g:C+' 420,650 270,590 150,500 90,360'}];
const CITY=[
 {id:'c1',n:{en:'Aurenna',ru:'Ауренна'},x:500,y:350,pop:1184000,cap:1},
 {id:'c2',n:{en:'Tessa',ru:'Тесса'},x:420,y:170,pop:214000},
 {id:'c3',n:{en:'Kelmar',ru:'Келмар'},x:255,y:215,pop:96000},

function mapSVG(){
  const B=BASES[S.base],ly=S.layers,sel=S.sel,dark=S.base==='sat'||S.base==='dark';
  const lab=dark?'#e8eef3':'#1d2733',halo=dark?'#0b1220':'#ffffff';
  const r=rng(3);let sat='';for(let i=0;i<70;i++){const c=['#2f4a2a','#3d5a32','#4b5f3a','#5a5a3e','#36502f','#6b6a4a'][Math.floor(r()*6)];sat+=`<rect x="${r()*120}" y="${r()*120}" width="${8+r()*30}" height="${6+r()*24}" fill="${c}" opacity=".85"/>`}
  let topo='';if(S.base==='topo'){[[255,215],[740,180]].forEach(([cx,cy])=>{for(let i=1;i<8;i++)topo+=`<ellipse cx="${cx}" cy="${cy}" rx="${i*24}" ry="${i*17}" fill="none" stroke="#b49a6a" stroke-width="${i%4?0.6:1.3}" opacity=".7" vector-effect="non-scaling-stroke"/>`})}
  const hs=f=>f===sel?' stroke="#f5b301" stroke-width="4"':'';
  let g=`<defs><pattern id="satp" width="120" height="120" patternUnits="userSpaceOnUse"><rect width="120" height="120" fill="#3a5233"/>${sat}</pattern><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#3b82f6" opacity=".18"/><line x1="0" y1="0" x2="0" y2="10" stroke="#3b82f6" stroke-width="3" opacity=".55"/></pattern><clipPath id="cc"><polygon points="${COUNTRY}"/></clipPath></defs>
  <rect x="-3000" y="-3000" width="7000" height="7000" fill="${B.sea}"/>
  <polygon points="${COUNTRY}" fill="${B.land}" stroke="${B.edge}" stroke-width="2" vector-effect="non-scaling-stroke"/><g clip-path="url(#cc)">${topo}</g>`;
  if(ly.land)g+=`<g>${LAND.map(l=>`<polygon data-f="${l.id}" points="${l.g}" fill="${['#3f9b5b','#5fb36b','#4d8f4f','#d9c36a','#7fb8b0'][LAND.indexOf(l)]}" fill-opacity=".72"${hs(l.id)||' stroke="none"'} vector-effect="non-scaling-stroke"/>`).join('')}</g>`;
  if(ly.flood)g+=`<g>${FLOOD.map(z=>`<polygon data-f="${z.id}" points="${z.g}" fill="url(#hatch)" stroke="#2563eb" stroke-width="${z.id===sel?4:1.5}" ${z.id===sel?'stroke="#f5b301"':''} stroke-dasharray="${z.rp===100?'':'5 4'}" vector-effect="non-scaling-stroke"/>`).join('')}</g>`;
  if(ly.admin)g+=`<g>${REG.map(rg=>`<polygon data-f="${rg.id}" points="${rg.g}" fill="${rg.id===sel?'#f5b301':'#8b5cf6'}" fill-opacity="${rg.id===sel?.18:.04}" stroke="${rg.id===sel?'#f5b301':'#8b5cf6'}" stroke-width="${rg.id===sel?3.5:1.6}" stroke-dasharray="7 4" vector-effect="non-scaling-stroke"/>`).join('')}</g>`;
  if(ly.rivers)g+=`<g fill="none">${RIV.map(w=>`<path d="${w.d}" stroke="transparent" stroke-width="14" data-f="${w.id}"/><path d="${w.d}" stroke="${w.id===sel?'#f5b301':'#1d78c1'}" stroke-width="${w.id===sel?5:3}" stroke-linecap="round" vector-effect="non-scaling-stroke" pointer-events="none"/>`).join('')}</g>`;
  if(ly.roads)g+=`<g fill="none" stroke-linecap="round" stroke-linejoin="round">${ROAD.map(rd=>`<polyline points="${rd.p}" stroke="transparent" stroke-width="14" data-f="${rd.id}"/><polyline points="${rd.p}" stroke="${dark?'#000':'#9a6b00'}" stroke-width="${rd.cls==='motorway'?6:4.5}" vector-effect="non-scaling-stroke" opacity=".45" pointer-events="none"/><polyline points="${rd.p}" stroke="${rd.id===sel?'#ff5a1f':'#f2b01e'}" stroke-width="${rd.cls==='motorway'?4:2.5}" vector-effect="non-scaling-stroke" pointer-events="none"/>`).join('')}</g>`;
  if(ly.cities)g+=`<g id="cities">${CITY.map(c=>`<circle data-f="${c.id}" class="cdot" cx="${c.x}" cy="${c.y}" r="6" fill="${c.cap?'#dc2626':'#fff'}" stroke="${c.id===sel?'#f5b301':'#dc2626'}" stroke-width="${c.id===sel?4:2.5}" vector-effect="non-scaling-stroke"/><text class="clab" x="${c.x+10}" y="${c.y+4}" font-size="13" font-weight="${c.cap?800:600}" fill="${lab}" stroke="${halo}" stroke-width="3" paint-order="stroke" pointer-events="none">${esc(L(c.n))}</text>`).join('')}</g>`;
  g+=`<g id="meas"></g>`;
  return g;
}

let VB=S.vb.slice();
function bindMap(){
  const svg=$('#msvg'),map=$('#map');
  $$('[data-ly]').forEach(i=>i.onchange=()=>{S.layers[i.dataset.ly]=i.checked;save();redraw()});
  $$('[data-base]').forEach(b=>b.onclick=()=>{S.base=b.dataset.base;save();$$('[data-base]').forEach(x=>x.classList.toggle('on',x===b));redraw()});
  bindInfo();
  const apply=()=>{svg.setAttribute('viewBox',VB.join(' '));const k=VB[2]/1000;$$('.clab',svg).forEach(t=>{t.setAttribute('font-size',13*k);t.setAttribute('stroke-width',3*k);const c=CITY.find(c=>c.n.en===t.textContent||c.n.ru===t.textContent);if(c)t.setAttribute('x',c.x+10*k),t.setAttribute('y',c.y+4*k)});$$('.cdot',svg).forEach(c=>c.setAttribute('r',6*k));scale();drawMeas()};
  window.__applyVB=apply;
  const zoom=(f,cx,cy)=>{const nw=Math.min(2000,Math.max(80,VB[2]*f)),r=nw/VB[2];if(cx==null){cx=VB[0]+VB[2]/2;cy=VB[1]+VB[3]/2}VB=[cx-(cx-VB[0])*r,cy-(cy-VB[1])*r,nw,VB[3]*r];S.vb=VB;save();apply()};
  const toSvg=(x,y)=>{const p=svg.createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(svg.getScreenCTM().inverse())};
  $('#zIn').onclick=()=>zoom(1/1.5);$('#zOut').onclick=()=>zoom(1.5);$('#zHome').onclick=()=>{VB=[0,0,1000,700];S.vb=VB;save();apply()};
  const setMode=md=>{S.meas.mode=S.meas.mode===md?null:md;S.meas.p=[];save();map.classList.toggle('meas',!!S.meas.mode);$('#mLine').classList.toggle('on',S.meas.mode==='line');$('#mArea').classList.toggle('on',S.meas.mode==='area');drawMeas()};
  $('#mLine').onclick=()=>setMode('line');$('#mArea').onclick=()=>setMode('area');
  svg.addEventListener('wheel',e=>{e.preventDefault();const p=toSvg(e.clientX,e.clientY);zoom(e.deltaY>0?1.2:1/1.2,p.x,p.y)},{passive:false});
  const ptr=new Map();let down=null,pinch=null,hover=null;
  svg.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===1){down={x:e.clientX,y:e.clientY,vb:VB.slice(),moved:false,target:e.target}}else if(ptr.size===2){const [a,b]=[...ptr.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),vb:VB.slice()};down=null}});
  const mv=e=>{if(!ptr.has(e.pointerId)){if(e.target.closest&&e.target.closest('#msvg')){const p=toSvg(e.clientX,e.clientY);$('#coord').textContent=lat(p.y).toFixed(4)+'°N  '+lon(p.x).toFixed(4)+'°E';if(S.meas.mode&&S.meas.p.length){hover=[p.x,p.y];drawMeas(hover)}}return}
    ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&ptr.size===2){const [a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y);const c=toSvg((a.x+b.x)/2,(a.y+b.y)/2);const f=pinch.d/d,nw=Math.min(2000,Math.max(80,pinch.vb[2]*f)),r=nw/VB[2];VB=[c.x-(c.x-VB[0])*r,c.y-(c.y-VB[1])*r,nw,VB[3]*r];apply();return}
    if(down){const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>5)down.moved=true;if(down.moved){svg.classList.add('drag');const rect=svg.getBoundingClientRect(),s=Math.max(down.vb[2]/rect.width,down.vb[3]/rect.height);VB=[down.vb[0]-dx*s,down.vb[1]-dy*s,down.vb[2],down.vb[3]];apply()}}};
  const up=e=>{if(!ptr.has(e.pointerId))return;ptr.delete(e.pointerId);svg.classList.remove('drag');
    if(down&&!down.moved&&ptr.size===0){if(S.meas.mode){const p=toSvg(e.clientX,e.clientY);S.meas.p.push([p.x,p.y]);save();drawMeas()}else{const f=down.target.closest&&down.target.closest('[data-f]');S.sel=f?f.dataset.f:null;save();redraw()}}
    if(ptr.size<2)pinch=null;if(ptr.size===0){down=null;S.vb=VB;save()}};
  window.onpointermove=mv;window.onpointerup=up;window.onpointercancel=up;
  apply();
}
function bindInfo(){const i=$('#info');if(!i)return;bind(i);if($('#selX'))$('#selX').onclick=()=>{S.sel=null;save();redraw()}}

    const r={id:'DR-'+(S.nextReq++),ds:d.id,fmt:$('#dFmt').value,crs:$('#dCrs').value,ext:ex.value==='all'?{en:'Whole country',ru:'Вся страна'}:ex.value==='view'?{en:'Map view '+VB.map(v=>Math.round(v)).join(','),ru:'Вид карты '+VB.map(v=>Math.round(v)).join(',')}:REG.find(x=>x.id===ex.value).n,created:Date.now(),dur:7000+Math.random()*6000,status:d.lic==='res'?'review':'run',size:estimate()};
    S.reqs.unshift(r);S.log.unshift({t:Date.now(),en:'Download request '+r.id+' for '+d.t.en,ru:'Запрос '+r.id+': '+d.t.ru});save();render();
    toast(d.lic==='res'?T('Sent to the data steward for approval','Отправлено хранителю данных на согласование'):T('Request '+r.id+' queued','Запрос '+r.id+' поставлен в очередь'),'gold')};
  drawReqs();
}
function drawReqs(){
  const box=$('#reqs');if(!box)return;
  box.innerHTML=S.reqs.length?S.reqs.map(r=>{const d=dsById(r.ds),s=reqStatus(r);return`<div class="req"><div class="top"><b>${esc(L(d.t))}</b><span class="pill ${RST[s.st][2]}">${T(RST[s.st][0],RST[s.st][1])}</span></div>
  <div class="sub"><span class="mono">${r.id}</span> · ${esc(r.fmt)} · ${esc(r.crs.split(' — ')[0])} · ${esc(L(r.ext))} · ${esc(r.size)} · ${fmtD(r.created)}</div>
  ${s.st==='processing'?`<div class="bar"><i style="width:${s.pc}%"></i></div><div class="muted" style="font-size:11.5px;margin-top:4px">${T('Clipping, reprojecting and packaging…','Вырезка, перепроецирование и упаковка…')} ${s.pc}%</div>`:''}
  ${s.st==='review'?`<div class="row"><span class="muted" style="font-size:12px;flex:1;min-width:150px">${T('Restricted dataset — waiting for the data steward.','Набор с ограничением — ждёт хранителя данных.')}</span><button class="btn sm" data-ap="${r.id}">✔ ${T('Approve as steward (demo)','Одобрить как хранитель (демо)')}</button><button class="btn sm" data-rj="${r.id}">✕ ${T('Reject','Отклонить')}</button></div>`:''}
  ${s.st==='rejected'&&r.note?`<div class="muted" style="font-size:12.5px;color:var(--red)">${esc(L(r.note))}</div>`:''}
  ${s.st==='ready'?`<div class="row"><button class="btn sm pri" data-get="${r.id}">⬇ ${T('Download','Скачать')}</button><span class="muted" style="font-size:12px">${T('Link valid 7 days','Ссылка действует 7 дней')}</span></div>`:''}</div>`}).join(''):`<div class="empty">${T('No requests yet','Запросов пока нет')}</div>`;
  $$('[data-ap]',box).forEach(b=>b.onclick=()=>{const r=S.reqs.find(x=>x.id===b.dataset.ap);r.status='run';r.created=Date.now();save();drawReqs();toast(T('Approved — processing started','Одобрено — обработка начата'))});
  $$('[data-rj]',box).forEach(b=>b.onclick=()=>{const r=S.reqs.find(x=>x.id===b.dataset.rj);r.status='rejected';r.note={en:'Rejected by the data steward.',ru:'Отклонено хранителем данных.'};save();drawReqs();toast(T('Request rejected','Запрос отклонён'),'bad')});
  $$('[data-get]',box).forEach(b=>b.onclick=()=>{const r=S.reqs.find(x=>x.id===b.dataset.get),d=dsById(r.ds);
    const fc={type:'FeatureCollection',name:d.id,crs:r.crs,metadata:{title:d.t.en,licence:LIC[d.lic][0],request:r.id,format_requested:r.fmt,extent:r.ext.en},features:(d.type==='vector'?CITY:[]).map(c=>({type:'Feature',properties:{name:c.n.en,population:c.pop},geometry:{type:'Point',coordinates:[+lon(c.x).toFixed(5),+lat(c.y).toFixed(5)]}}))};
    const u=URL.createObjectURL(new Blob([JSON.stringify(fc,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=r.id+'_'+d.id+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast(T('Download started','Скачивание началось'))});
}
setInterval(()=>{if(S.user&&S.view==='downloads'&&S.reqs.some(r=>r.status==='run'))drawReqs();const p=S.reqs.filter(r=>{const s=reqStatus(r).st;return s!=='ready'&&s!=='rejected'}).length;const c=$('#cntR');if(c){c.textContent=p;c.style.display=p?'':'none'}},1000);

/* ---------- metadata ---------- */
function hl(j){return esc(j).replace(/(&quot;[^&]*?&quot;)(\s*:)?|(-?\d+(?:\.\d+)?)/g,(m,s,c,n)=>s?(c?`<span class="k">${s}</span>${c}`:`<span class="s">${s}</span>`):`<span class="n">${n}</span>`)}
function rMeta(){
  const el=$('#v-metadata');const d=dsById(S.meta)||DS[0];const uuid='5f0c'+d.id.slice(2)+'-9b1e-4c7a-a2d1-0e7f3b'+d.id.slice(2)+'c91a';
  const bbox=[20.54,44.0,25.52,46.68];const host='https://geo.veloria.gov.vl';
  const urls=d.type==='vector'?[['WMS',`${host}/ows?service=WMS&request=GetCapabilities&layers=${d.id}`],['WFS',`${host}/ows?service=WFS&version=2.0.0&request=GetCapabilities&typeNames=${d.id}`],['OGC API',`${host}/ogcapi/collections/${d.id}/items?f=json`],['MVT',`${host}/tiles/${d.id}/{z}/{x}/{y}.pbf`]]:[['WMS',`${host}/ows?service=WMS&request=GetCapabilities&layers=${d.id}`],['WCS',`${host}/ows?service=WCS&version=2.0.1&request=GetCapabilities`],['STAC',`${host}/stac/collections/${d.id}`],['COG',`https://data.geo.veloria.gov.vl/cog/${d.id}/mosaic.tif`]];
  const rec={type:'Collection',stac_version:'1.0.0',id:d.id,title:d.t.en,description:d.a.en,license:d.lic==='cc'?'CC-BY-4.0':d.lic==='ogl'?'OGL-VL-1.0':'proprietary',keywords:d.kw.split(', '),providers:[{name:d.org.en,roles:['producer','licensor']},{name:'National Geospatial Agency',roles:['host']}],extent:{spatial:{bbox:[bbox]},temporal:{interval:[[d.upd+'T00:00:00Z',null]]}},summaries:{'proj:epsg':[4326,9821],gsd:d.res},links:urls.slice(0,3).map(u=>({rel:'alternate',title:u[0],href:u[1]}))};
  const kv=[[T('Title','Название'),L(d.t)],[T('Abstract','Аннотация'),L(d.a)],[T('File identifier','Идентификатор'),uuid],[T('Topic category (ISO)','Тематическая категория (ISO)'),{boundaries:'boundaries',transport:'transportation',water:'inlandWaters',land:'imageryBaseMapsEarthCover',elev:'elevation',imagery:'imageryBaseMapsEarthCover',people:'society',hazard:'environment'}[d.th]],[T('Keywords','Ключевые слова'),d.kw],[T('Spatial representation','Пространственное представление'),d.type==='vector'?T('vector','вектор'):T('grid','растр')],[T('Scale / resolution','Масштаб / разрешение'),d.res],[T('Reference system','Система координат'),'EPSG:9821 (VLREF2020 / TM), EPSG:4326'],[T('Bounding box','Охват'),`W ${bbox[0]} · S ${bbox[1]} · E ${bbox[2]} · N ${bbox[3]}`],[T('Last revision','Последняя редакция'),fmtD(d.upd)],[T('Update frequency','Периодичность'),d.th==='transport'||d.th==='people'?T('monthly','ежемесячно'):T('annually','ежегодно')],[T('Lineage','Происхождение'),T('Compiled from agency source data, topology-validated and harmonised to the national data model v3.2.','Собрано из данных ведомства, проверена топология, приведено к национальной модели данных v3.2.')],[T('Licence','Лицензия'),T(LIC[d.lic][0],LIC[d.lic][1])],[T('Point of contact','Контакт'),L(d.org)+' · data@geo.gov.vl'],[T('Metadata standard','Стандарт метаданных'),'ISO 19115-1:2014 / ISO 19139']];
  el.innerHTML=`<div class="card" style="margin-bottom:14px"><div class="row"><select class="input" id="mDs" style="flex:1;min-width:200px">${DS.map(x=>`<option value="${x.id}" ${x.id===d.id?'selected':''}>${esc(L(x.t))}</option>`).join('')}</select><span class="pill ${LIC[d.lic][2]}">${T(LIC[d.lic][0],LIC[d.lic][1])}</span><button class="btn sm pri" data-req="${d.id}">⬇ ${T('Request download','Запросить выгрузку')}</button>${d.layer?`<button class="btn sm" data-show="${d.layer}">🗺 ${T('Map','Карта')}</button>`:''}</div></div>
  <div class="grid2"><div class="card"><h3>${T('ISO 19115 record','Запись ISO 19115')}<span class="sp"></span><button class="btn sm" id="mXml">⬇ XML</button></h3><div class="kv">${kv.map(([k,v])=>`<div>${k}</div><div>${esc(v)}</div>`).join('')}</div></div>
  <div><div class="card"><h3>${T('Service endpoints','Адреса сервисов')}</h3>${urls.map((u,i)=>`<div class="url"><span class="tag">${u[0]}</span><code>${esc(u[1])}</code><button class="btn sm" data-copy="${i}" aria-label="Copy">⧉</button></div>`).join('')}</div>
  <div class="card mt"><h3>${d.type==='raster'?'STAC Collection':'STAC / OGC API record'}</h3><pre class="json">${hl(JSON.stringify(rec,null,2))}</pre></div></div></div>`;
  $('#mDs').onchange=e=>{S.meta=e.target.value;save();rMeta()};
  $$('[data-copy]',el).forEach(b=>b.onclick=()=>{const t=urls[+b.dataset.copy][1];try{navigator.clipboard.writeText(t).then(()=>toast(T('URL copied','Адрес скопирован')),()=>toast(T('Copy not allowed here — select the text','Копирование недоступно — выделите текст'),'bad'))}catch(e){toast(T('Copy not allowed here','Копирование недоступно'),'bad')}});
  $('#mXml').onclick=()=>{const x=`<?xml version="1.0" encoding="UTF-8"?>\n<gmd:MD_Metadata xmlns:gmd="http://www.isotc211.org/2005/gmd" xmlns:gco="http://www.isotc211.org/2005/gco">\n  <gmd:fileIdentifier><gco:CharacterString>${uuid}</gco:CharacterString></gmd:fileIdentifier>\n  <gmd:identificationInfo><gmd:MD_DataIdentification><gmd:citation><gmd:CI_Citation><gmd:title><gco:CharacterString>${d.t.en}</gco:CharacterString></gmd:title></gmd:CI_Citation></gmd:citation><gmd:abstract><gco:CharacterString>${d.a.en}</gco:CharacterString></gmd:abstract></gmd:MD_DataIdentification></gmd:identificationInfo>\n</gmd:MD_Metadata>\n`;const u=URL.createObjectURL(new Blob([x],{type:'application/xml'}));const a=document.createElement('a');a.href=u;a.download=d.id+'_iso19139.xml';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast(T('ISO 19139 XML downloaded','XML ISO 19139 скачан'))};
  bind(el);
}

/* ---------- shell ---------- */
$$('.nav').forEach(b=>b.onclick=()=>go(b.dataset.view));
$('#loginBtn').onclick=()=>{const e=$('#lEmail').value.trim(),p=$('#lPass').value;let ok=true;
  $('#lEmailE').textContent=/^\S+@\S+\.\S+$/.test(e)?'':(ok=false,T('Enter a valid email','Введите корректный адрес'));
  $('#lPassE').textContent=p.length>=4?'':(ok=false,T('Enter the password','Введите пароль'));
  if(!ok)return;S.user=e;S.view='map';save();render();toast(T('Signed in as ','Вход выполнен: ')+esc(e))};
$('#logout').onclick=()=>{S.user=null;save();render()};
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#reset').onclick=()=>{Object.keys(localStorage).filter(k=>k.startsWith(P)).forEach(k=>localStorage.removeItem(k));location.reload()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.meas.mode){S.meas.p=[];save();drawMeas()}});
PT.onLang(()=>render());
window.addEventListener('resize',()=>scale());
render();
})();
