<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AquaTwin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.app[hidden],.login[hidden]{display:none}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;flex:none}
.brand b svg{width:20px;height:20px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left;min-height:42px}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-weight:700}
.nav .cnt.g{background:var(--gold);color:#1a1306}
.grow{flex:1}
.box{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:13px;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.box b.h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.box .who{display:flex;gap:10px;align-items:center;min-width:0}
.box .who i{width:32px;height:32px;border-radius:50%;background:color-mix(in srgb,var(--gold) 25%,transparent);color:var(--gold2);display:grid;place-items:center;font-style:normal;font-weight:800;flex:none}
.box .who div{min-width:0;overflow-wrap:anywhere}
.box .who small{display:block;color:var(--muted);font-size:11.5px}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.clock{font-family:var(--mono);font-size:12.5px}
.dotl{width:8px;height:8px;border-radius:50%;background:var(--mal3);display:inline-block;box-shadow:0 0 0 0 var(--mal3);animation:pulse 1.6s infinite}
.dotl.off{background:var(--dim);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--mal3) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.how>div>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold2);flex:none;font-size:13px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.card{min-width:0}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:600;margin-left:4px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{min-height:38px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px;min-height:34px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600;min-height:36px}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.opt{border:1px solid var(--line2);border-radius:14px;padding:12px;cursor:pointer;background:var(--bg2);text-align:left;width:100%}
.opt.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 10%,transparent)}
.opt b{display:block} .opt span{font-size:12.5px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f .er{color:var(--red);font-size:12px;min-height:0;margin-top:3px}
.input.bad{border-color:var(--red)}
textarea.input{resize:vertical;min-height:70px}
select.input{min-height:42px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.ok-t{color:var(--mal3)} .bad-t{color:var(--red);font-weight:700} .warn-t{color:var(--amber);font-weight:700}
.log{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;height:250px;overflow:auto}
.log div{padding:3px 0;display:flex;gap:8px;border-bottom:1px dashed var(--line)}
.log .t{color:var(--dim);flex:none}
.log .bad{color:var(--red)} .log .warn{color:var(--amber)} .log .ok{color:var(--mal3)}
.chart canvas{width:100%;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:340px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
/* login */
.login{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:28px 16px;background:radial-gradient(900px 420px at 15% -10%,color-mix(in srgb,var(--mal) 16%,transparent),transparent),radial-gradient(700px 380px at 100% 110%,color-mix(in srgb,var(--blue) 12%,transparent),transparent),var(--bg)}
.lwrap{width:100%;max-width:960px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:stretch}
.lhero{padding:26px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--mal) 16%,var(--panel)),var(--panel))}
.lhero h2{margin:0;font-size:28px;letter-spacing:-.02em;line-height:1.15}
.lhero p{margin:0;color:var(--muted);font-size:14px}
.lhero svg{width:100%;height:auto;display:block}
.lstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lstats div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:11.5px;color:var(--muted)}
.lstats b{display:block;font-size:17px;color:var(--text)}
.lform{padding:24px;display:flex;flex-direction:column;gap:12px}
.lform h3{margin:0;font-size:19px}
.hint{font-size:12px;color:var(--muted);background:var(--bg2);border:1px dashed var(--line2);border-radius:10px;padding:8px 10px}
#loginBtn{justify-content:center;width:100%;min-height:46px;font-size:15px}
/* network */
.net{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
.net svg{display:block;width:100%;min-width:540px;height:auto}
.pipe-bg{fill:none;stroke:var(--line2);stroke-linecap:round;stroke-linejoin:round}
.pipe{fill:none;stroke:var(--mal2);stroke-linecap:round;stroke-linejoin:round;transition:stroke-width .5s}
.pipe.hi{stroke:var(--blue)} .pipe.leak{stroke:var(--red)} .pipe.idle{stroke:var(--line2)}
.flowd{fill:none;stroke:var(--mal3);stroke-width:2.2;stroke-dasharray:5 15;stroke-linecap:round;animation:flow 1.2s linear infinite;pointer-events:none}
.flowd.idle{opacity:0}
@keyframes flow{to{stroke-dashoffset:-20}}
.hit{fill:none;stroke:transparent;stroke-width:22;cursor:pointer}
.ng{cursor:pointer}
.ng.sel .halo{stroke:var(--gold);stroke-width:3}
.pg.sel .pipe-bg{stroke:var(--gold)}
.halo{fill:none;stroke:transparent}
.nd{fill:var(--panel);stroke:var(--mal);stroke-width:3}
.nd.warn{stroke:var(--amber);fill:color-mix(in srgb,var(--amber) 22%,var(--panel))}
.nd.bad{stroke:var(--red);fill:color-mix(in srgb,var(--red) 25%,var(--panel))}
.nd.off{stroke:var(--dim)}
.tk{fill:var(--panel);stroke:var(--blue);stroke-width:2.5}
.tkf{fill:color-mix(in srgb,var(--blue) 55%,transparent)}
.lbl{fill:var(--text);font:600 12.5px var(--font);paint-order:stroke;stroke:var(--bg2);stroke-width:4px;stroke-linejoin:round}
.val{fill:var(--mal3);font:700 12px var(--mono);paint-order:stroke;stroke:var(--bg2);stroke-width:4px}
.val.warn{fill:var(--amber)} .val.bad{fill:var(--red)}
.fl{fill:var(--muted);font:600 11px var(--mono);paint-order:stroke;stroke:var(--bg2);stroke-width:4px}
.vlv{fill:var(--panel);stroke:var(--muted);stroke-width:2}
.vlv.open{fill:var(--mal);stroke:var(--mal)}
.vline{stroke:var(--line2);stroke-width:3;stroke-dasharray:4 6;fill:none}
.vline.open{stroke:var(--mal);stroke-dasharray:none}
.icon{fill:none;stroke:var(--text);stroke-width:1.8}
.facts2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:13px;margin:0 0 12px}
.facts2 dt{color:var(--muted)} .facts2 dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
/* tanks */
.tank{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.tank svg{width:96px;height:auto;display:block}
.tank .st{font-size:13px}
.tank .st div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line)}
.tank .st span{color:var(--muted)}
.mini{display:flex;flex-direction:column;gap:10px}
.mini .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13px}
.bar{grid-column:1/-1;height:9px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--mal3));transition:width .5s}
.bar i.warn{background:var(--amber)} .bar i.bad{background:var(--red)}
.ctl{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sp2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) auto;gap:8px;align-items:end}
/* alerts */
.alert{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--bg2)}
.alert.new{border-color:color-mix(in srgb,var(--red) 55%,transparent)}
.alert .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alert .top b{flex:1;min-width:150px}
.alert .meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted);margin-top:6px}
.alert .meta strong{color:var(--text)}
.tl{display:flex;margin:12px 0 10px}
.tl div{flex:1;position:relative;text-align:center;font-size:11px;color:var(--dim);min-width:0}
.tl div:before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line2)}
.tl div:first-child:before{display:none}
.tl i{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 4px;background:var(--panel2);border:2px solid var(--line2);position:relative;z-index:1}
.tl .ok i{background:var(--mal);border-color:var(--mal)} .tl .ok:before,.tl .cur:before{background:var(--mal)}
.tl .cur i{border-color:var(--gold);background:var(--gold)} .tl .ok,.tl .cur{color:var(--text)}
.tl span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:13.5px}
.svgc svg{width:100%;height:auto;display:block}
/* quality */
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.qc{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel);cursor:pointer;text-align:left;width:100%;display:block}
.qc.on{border-color:var(--mal);box-shadow:0 0 0 3px color-mix(in srgb,var(--mal) 18%,transparent)}
.qc.badq{border-color:color-mix(in srgb,var(--red) 60%,transparent)}
.qc .nm{display:flex;gap:8px;align-items:center;justify-content:space-between;font-weight:700;font-size:13.5px}
.qc .nm span{min-width:0;overflow-wrap:anywhere}
.qc .zn{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.qv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.qv div{background:var(--bg2);border-radius:9px;padding:6px 7px;font-size:10.5px;color:var(--muted);min-width:0}
.qv b{display:block;font-family:var(--mono);font-size:14px;color:var(--text)}
.qv b.bad-t{color:var(--red)} .qv b.warn-t{color:var(--amber)}
.scrim{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.split,.intro,.lwrap{grid-template-columns:minmax(0,1fr)}.qgrid,.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:270px;max-width:86vw;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:45px 0 0 0;background:rgba(0,0,0,.35);z-index:1400}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
  .lhero{display:none}
}
@media (max-width:560px){.how{grid-template-columns:1fr}.fgrid,.opts,.qgrid,.grid3,.sp2{grid-template-columns:minmax(0,1fr)}.kpi .v{font-size:20px}.kpis{gap:10px}.tl span{font-size:9.5px}.card{padding:14px}.tank{grid-template-columns:72px minmax(0,1fr)}.tank svg{width:72px}.lform{padding:18px}}
</style>
</head>
<body data-demo-en="AquaTwin — Water utility digital twin &amp; SCADA" data-demo-ru="AquaTwin — Цифровой двойник водоканала и SCADA">

<div class="login" id="login">
  <div class="lwrap">
    <div class="card lhero">
      <div class="brand" style="padding:0"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.5c3.5 4.4 6.5 8 6.5 11.5a6.5 6.5 0 0 1-13 0c0-3.5 3-7.1 6.5-11.5z"/><path d="M8.5 14.5a3.5 3.5 0 0 0 3.5 3.5"/></svg></b><div>AquaTwin<small data-en="Port Meridal Water Board" data-ru="Водоканал Порт-Меридаля"></small></div></div>
      <h2 data-en="One live twin of the whole water network" data-ru="Живой цифровой двойник всей водопроводной сети"></h2>
      <p data-en="SCADA telemetry and a calibrated hydraulic model in one control room: pressures and flows, leak alerts, reservoir levels, field work orders and water quality." data-ru="Телеметрия SCADA и откалиброванная гидравлическая модель в одной диспетчерской: давление и расходы, сигналы утечек, уровни резервуаров, наряды бригадам и качество воды."></p>
      <svg viewBox="0 0 400 120" aria-hidden="true"><path d="M10 90 C60 40 110 100 160 60 S260 20 300 60 S370 90 390 40" fill="none" style="stroke:var(--mal3)" stroke-width="3"/><path d="M10 100 C70 80 120 110 180 85 S280 70 330 90 S380 100 390 80" fill="none" style="stroke:var(--gold)" stroke-width="2" stroke-dasharray="6 6"/><g style="fill:var(--panel);stroke:var(--mal)" stroke-width="3"><circle cx="160" cy="60" r="7"/><circle cx="300" cy="60" r="7"/><circle cx="60" cy="62" r="7"/></g></svg>
      <div class="lstats"><div><b>1,840 km</b><span data-en="mains modelled" data-ru="сетей в модели"></span></div><div><b>6</b><span data-en="DMAs metered" data-ru="зон учёта"></span></div><div><b>2 s</b><span data-en="telemetry scan" data-ru="опрос телеметрии"></span></div></div>
    </div>
    <div class="card lform">
      <h3 data-en="Sign in to the control room" data-ru="Вход в диспетчерскую"></h3>
      <div class="f"><label for="lu" data-en="Username" data-ru="Имя пользователя"></label><input class="input" id="lu" value="k.varela" autocomplete="username"></div>
      <div class="f"><label for="lp" data-en="Password" data-ru="Пароль"></label><input class="input" id="lp" type="password" value="demo-2025" autocomplete="current-password"></div>
      <div class="f"><label data-en="Role" data-ru="Роль"></label>
        <div class="opts" id="roles">
          <button class="opt on" data-role="ops" type="button"><b data-en="Control room" data-ru="Диспетчер"></b><span data-en="Full SCADA control" data-ru="Полное управление SCADA"></span></button>
          <button class="opt" data-role="field" type="button"><b data-en="Field engineer" data-ru="Инженер бригады"></b><span data-en="Work orders, view-only SCADA" data-ru="Наряды, SCADA только просмотр"></span></button>
        </div></div>
      <div class="er bad-t" id="lerr" style="font-size:13px"></div>
      <button class="btn pri" id="loginBtn" type="button" data-en="Sign in" data-ru="Войти"></button>
      <div class="hint" data-en="Demo credentials are prefilled. Single sign-on and hardware tokens are enabled in production." data-ru="Демо-данные уже заполнены. В рабочей версии — единый вход и аппаратные токены."></div>
    </div>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.5c3.5 4.4 6.5 8 6.5 11.5a6.5 6.5 0 0 1-13 0c0-3.5 3-7.1 6.5-11.5z"/><path d="M8.5 14.5a3.5 3.5 0 0 0 3.5 3.5"/></svg></b><div>AquaTwin<small data-en="Port Meridal Water Board" data-ru="Водоканал Порт-Меридаля"></small></div></div>
    <div class="sec" data-en="Operations" data-ru="Эксплуатация"></div>
    <div id="navA"></div>
    <div class="sec" data-en="Field &amp; compliance" data-ru="Бригады и контроль"></div>
    <div id="navB"></div>
    <div class="grow"></div>
    <div class="box">
      <b class="h" data-en="Simulation" data-ru="Симуляция"></b>
      <div class="row"><span class="dotl" id="simDot"></span><span class="clock" id="simClock"></span></div>
      <button class="btn sm" id="pauseBtn" style="justify-content:center"></button>

(function(){

 ['QP4',['Harbour hydrant H-41','Гидрант H-41, Гавань'],'J3',.56,.3,7.6,446],['QP5',['Mill Quarter school tap','Кран школы, Мельничный кв.'],'J5',.47,.28,7.55,440],['QP6',['Airport Rd end-of-line','Конец линии, Аэропортовая'],'J6',.27,.34,7.7,455]];
const PARAMS=[['cl',['Free chlorine','Свободный хлор'],'mgl',.2,2,2],['tu',['Turbidity','Мутность'],'ntu',0,1,2],['ph',['pH','pH'],'',6.5,8.5,2],['ec',['Conductivity','Электропроводность'],'us',0,1000,0]];

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const diurnal=h=>.42+.4*Math.exp(-((h-7.5)**2)/3)+.44*Math.exp(-((h-19.5)**2)/4.5)+.14*Math.exp(-((h-13)**2)/6);

function calc(){
  const h=(S.t%1440)/60, f=diurnal(h), d={}, q={}, p={}, out={}, lk={};
  for(const j in BASE) d[j]=BASE[j]*f*S.noise[j];
  S.leaks.forEach(l=>lk[l.pipe]=(lk[l.pipe]||0)+l.rate);
  for(const t in LINES){const Ln=LINES[t],[pa,pb]=Ln.seg,[ja,jb]=Ln.j,tank=S.tanks[t];
    q[pb]=d[jb]+(lk[pb]||0); q[pa]=d[ja]+q[pb]+(lk[pa]||0);
    const head=NODES[t].el+tank.lvl;
    p[ja]=(head-NODES[ja].el)/10.2-PI[pa][6]*q[pa]**2-(lk[pa]||0)*.04;
    p[jb]=p[ja]+(NODES[ja].el-NODES[jb].el)/10.2-PI[pb][6]*q[pb]**2-((lk[pb]||0)+(lk[pa]||0)*.4)*.045;
    out[t]=q[pa]; q[Ln.pipe]=S.pumps[Ln.pump].on?S.pumps[Ln.pump].rate*(0.97+0.03*S.noise.J1):0;}
  q.P1=q.PA+q.PB+q.PC; q.P0=Math.max(q.P1,.6*(q.P1+(out.T1+out.T2+out.T3)));
  for(const v in VALVES){const V=VALVES[v];if(S.valves[v]){const dd=p[V.a]-p[V.b];q[v]=Math.abs(dd)*14;const m=(p[V.a]+p[V.b])/2;p[V.a]=m+dd*.15;p[V.b]=m-dd*.15}else q[v]=0}
  const demand=Object.values(d).reduce((a,b)=>a+b,0), leakSum=Object.values(lk).reduce((a,b)=>a+b,0);
  const ps=Object.values(p);
  return{f,d,q,p,out,lk,demand,leakSum,avgP:ps.reduce((a,b)=>a+b,0)/ps.length,minJ:Object.keys(p).sort((a,b)=>p[a]-p[b])[0],nrw:(leakSum+.07*demand)/(demand+leakSum)*100};
}

let S=store.load(), H;
const save=()=>store.save();
function addEv(en,ru,c){S.ev.unshift({t:S.t,en,ru,c:c||''});S.ev.length=Math.min(S.ev.length,60)}

function step(silent){
  S.t+=5;
  for(const j in S.noise) S.noise[j]=clamp(S.noise[j]+(R()-.5)*.05+(1-S.noise[j])*.1,.88,1.12);
  H=calc();
  for(const t in LINES){const tk=S.tanks[t],pm=S.pumps[LINES[t].pump];
    const net=(H.q[LINES[t].pipe]-H.out[t]); const was=tk.lvl;
    tk.lvl=clamp(tk.lvl+net*300/(tk.area*1000),0.1,tk.max);
    if(pm.auto){if(tk.lvl<=tk.lo&&!pm.on){pm.on=true;if(!silent)addEv(PUMPN[LINES[t].pump][0]+' started (low setpoint)',PUMPN[LINES[t].pump][1]+' включён (нижняя уставка)','ok')}
      if(tk.lvl>=tk.hi&&pm.on){pm.on=false;if(!silent)addEv(PUMPN[LINES[t].pump][0]+' stopped (high setpoint)',PUMPN[LINES[t].pump][1]+' остановлен (верхняя уставка)','')}}
    if(tk.lvl<tk.lo-0.6&&was>=tk.lo-0.6&&!silent){addEv(NODES[t].n[0]+' level critically low',NODES[t].n[1]+': критически низкий уровень','bad');toast('⚠ '+T(NODES[t].n[0]+' level critically low',NODES[t].n[1]+': критически низкий уровень'),'bad')}
    tk.h.push(+tk.lvl.toFixed(3)); if(tk.h.length>72) tk.h.shift();}
  H=calc();
  S.dh.push([S.t,+(H.demand+H.leakSum).toFixed(1),+H.q.P0.toFixed(1)]); if(S.dh.length>72) S.dh.shift();
  // leaks
  if(!silent&&R()<.03&&S.leaks.filter(l=>l.rate>0).length<3){const free=DIST.filter(p=>!S.leaks.some(l=>l.pipe===p));
    if(free.length){const p=free[Math.floor(R()*free.length)];S.leaks.push({id:'L'+(S.nextLeak++),pipe:p,rate:+(5+R()*13).toFixed(1),age:0,delay:2+Math.floor(R()*4),alerted:false})}}
  S.leaks.forEach(l=>{l.age++;if(!l.alerted&&l.age>=l.delay&&!silent)raise(l,null)});
  // quality
  S.qp.forEach((q,i)=>{const b=QP[i],z=NODES[b[2]]?b[2]:'J1';const lz=S.leaks.some(l=>{const zz=zoneOf(l.pipe);return zz&&(LINES[zz].j.includes(b[2])||zz===b[2])});
    q.cl=clamp(q.cl+(b[3]-q.cl)*.12+(R()-.5)*.05,0,3); q.tu=clamp(q.tu+(b[4]+(lz?.38:0)-q.tu)*.15+(R()-.5)*.05,.02,5);
    q.ph=clamp(q.ph+(b[5]-q.ph)*.15+(R()-.5)*.04,6,9); q.ec=clamp(q.ec+(b[6]-q.ec)*.15+(R()-.5)*8,200,1200);
    PARAMS.forEach(p=>{const k=p[0];q.h[k].push(+q[k].toFixed(3));if(q.h[k].length>48)q.h[k].shift();
      const bad=qBad(k,q[k]);if(bad&&!q.bad[k]&&!silent){addEv(b[1][0]+': '+p[1][0]+' out of limit ('+q[k].toFixed(p[5])+')',b[1][1]+': '+p[1][1]+' вне нормы ('+q[k].toFixed(p[5])+')','warn');toast('💧 '+T(b[1][0]+': '+p[1][0].toLowerCase()+' out of limit',b[1][1]+': '+p[1][1].toLowerCase()+' вне нормы'),'gold')}
      q.bad[k]=bad})});
  // low pressure
  for(const j in H.p){if(H.p[j]<1.5&&!S.lowP?.[j]&&!silent){addEv(NODES[j].n[0]+' pressure below 1.5 bar',NODES[j].n[1]+': давление ниже 1,5 бар','bad')}S.lowP=S.lowP||{};S.lowP[j]=H.p[j]<1.5}
}
function raise(l,kind){
  l.alerted=true;const k=kind!=null?kind:(l.rate>10?0:(S.t%1440<300?1:Math.floor(R()*3)));
  const a={id:'LA-'+(S.nextA++),pipe:l.pipe,leak:l.id,kind:k,loss:+(l.rate*(0.85+R()*.3)).toFixed(1),conf:Math.round(70+R()*27),st:'new',t:S.t,det:l.age*5,wo:null};
  S.alerts.unshift(a);
  const dn=NODES[PI[l.pipe][2]].n;
  addEv('Leak alert '+a.id+' on '+l.pipe+' ('+dn[0]+'), ~'+a.loss+' L/s','Сигнал утечки '+a.id+' на '+l.pipe+' ('+dn[1]+'), ~'+a.loss+' л/с','bad');
  toast('🚨 '+T('Leak alert ','Сигнал утечки ')+a.id+' · '+esc(L(dn))+' · ~'+nf(a.loss,1)+' '+U.ls(),'bad');

function lineCanvas(cv,series,o){
  if(!cv)return;const w=cv.clientWidth||600,h=o.h||220,dpr=window.devicePixelRatio||1;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.height=h+'px';
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
  const pl=42,pr=10,pt=10,pb=24,W=w-pl-pr,Hh=h-pt-pb;
  let all=series.flatMap(s=>s.v);let mn=o.min!=null?o.min:Math.min(...all),mx=o.max!=null?o.max:Math.max(...all);
  if(o.min==null){const pd=(mx-mn)*.12||1;mn=Math.max(0,mn-pd);mx+=pd}
  const n=Math.max(2,series[0].v.length),X=i=>pl+i*W/(n-1),Y=v=>pt+Hh-(v-mn)/(mx-mn)*Hh;
  c.font='11px '+(cssv('--mono')||'monospace');c.lineWidth=1;
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);c.strokeStyle=cssv('--line');c.beginPath();c.moveTo(pl,y);c.lineTo(w-pr,y);c.stroke();c.fillStyle=cssv('--dim');c.textAlign='right';c.fillText(v.toFixed(o.dec||0),pl-6,y+4)}
  if(o.xl){c.textAlign='center';c.fillStyle=cssv('--dim');const k=Math.max(1,Math.floor(n/(w<420?3:6)));for(let i=0;i<n;i+=k){if(o.xl[i]!=null)c.fillText(o.xl[i],clamp(X(i),pl+14,w-pr-16),h-6)}}
  (o.bands||[]).forEach(b=>{c.strokeStyle=cssv(b.c);c.setLineDash([5,5]);c.beginPath();c.moveTo(pl,Y(b.v));c.lineTo(w-pr,Y(b.v));c.stroke();c.setLineDash([])});
  series.forEach(s=>{const col=cssv(s.c);if(s.fill){c.globalAlpha=.13;c.fillStyle=col;c.beginPath();c.moveTo(X(0),Y(mn));s.v.forEach((v,i)=>c.lineTo(X(i),Y(v)));c.lineTo(X(s.v.length-1),Y(mn));c.fill();c.globalAlpha=1}
    c.strokeStyle=col;c.lineWidth=s.w||2;c.setLineDash(s.dash||[]);c.beginPath();s.v.forEach((v,i)=>i?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v)));c.stroke();c.setLineDash([]);
    const lv=s.v[s.v.length-1];c.fillStyle=col;c.beginPath();c.arc(X(s.v.length-1),Y(lv),3.5,0,7);c.fill()});
}

function pPts(p){const a=NODES[p[1]],b=NODES[p[2]];if(p[0]==='PA'||p[0]==='PC')return [[a.x,a.y],[430,a.y],[430,b.y],[b.x,b.y]];return [[a.x,a.y],[b.x,b.y]]}

function midOf(pts){if(pts.length===4)return [pts[1][0],(pts[1][1]+pts[2][1])/2];return [(pts[0][0]+pts[1][0])/2,(pts[0][1]+pts[1][1])/2]}
function netSvg(){
  let s='<svg viewBox="0 0 1000 560" id="netSvg" role="img">';

  PIPES.forEach(p=>{const pts=ptsStr(pPts(p));s+=`<g class="pg" data-sel="${p[0]}"><polyline class="pipe-bg" points="${pts}" stroke-width="${p[3]/40}"/><polyline id="pp-${p[0]}" class="pipe" points="${pts}"/><polyline id="pf-${p[0]}" class="flowd" points="${pts}"/><polyline class="hit" points="${pts}"/></g>`});

    else if(n.t==='wtp')g=`<rect class="halo" x="${x-34}" y="${y-28}" width="68" height="56" rx="14"/><rect x="${x-28}" y="${y-22}" width="56" height="44" rx="10" class="nd"/><text x="${x}" y="${y+5}" text-anchor="middle" class="val">WTP</text>`;
    else if(n.t==='ps')g=`<circle class="halo" cx="${x}" cy="${y}" r="30"/><circle cx="${x}" cy="${y}" r="24" class="nd"/><path class="icon" d="M${x-9} ${y-11} L${x+12} ${y} L${x-9} ${y+11} Z"/>`;
    else if(n.t==='tank')g=`<rect class="halo" x="${x-30}" y="${y-36}" width="60" height="72" rx="10"/><rect class="tk" x="${x-24}" y="${y-30}" width="48" height="60" rx="6"/><clipPath id="cp-${id}"><rect x="${x-22}" y="${y-28}" width="44" height="56" rx="5"/></clipPath><rect id="tf-${id}" class="tkf" clip-path="url(#cp-${id})" x="${x-22}" y="${y}" width="44" height="28"/>`;
    else g=`<circle class="halo" cx="${x}" cy="${y}" r="20"/><circle id="nc-${id}" cx="${x}" cy="${y}" r="13" class="nd"/>`;
    const ly=n.t==='tank'?y+52:n.t==='j'?y+32:y+46;
    s+=`<g class="ng" data-sel="${id}">${g}<text class="lbl" x="${x}" y="${ly}" text-anchor="middle">${L(n.n.slice(2))}</text>${n.t==='j'||n.t==='tank'||n.t==='ps'?`<text class="val" id="nv-${id}" x="${x}" y="${ly+16}" text-anchor="middle"></text>`:''}</g>`}

   <div>① ${T('The twin compares measured pressure and flow with the calibrated model every scan.','Двойник каждый опрос сравнивает измеренные давление и расход с моделью.')}</div>
   <div>② ${T('Residuals above 3σ for several scans raise an alert with an estimated loss.','Отклонения выше 3σ несколько опросов подряд дают сигнал с оценкой потерь.')}</div>

  lkSig='';lkLive();

function lkLive(){

     <div class="meta"><span>${T('Pipe','Труба')} <strong>${a.pipe}</strong> · ${L(dn)}</span><span>${T('Loss','Потери')} <strong>~${nf(a.loss,1)} ${U.ls()}</strong></span><span>${T('Confidence','Достоверность')} <strong>${a.conf}%</strong></span><span>${T('Detected','Обнаружено')} <strong>${fmtT(a.t)}</strong></span></div>
     ${a.st==='dism'?'':`<div class="tl">${order.map((o,i)=>`<div class="${i<si?'ok':i===si?(o==='fixed'?'ok':'cur'):''}"><i></i><span>${L(AST[o])}</span></div>`).join('')}</div>`}<div class="row">${btn}</div></div>`}).join(''):`<div class="card empty">${T('No alerts in this filter. The network is tight.','Нет сигналов по фильтру. Сеть герметична.')}</div>`;

  $$('[data-dism]').forEach(b=>b.onclick=()=>{const a=S.alerts.find(x=>x.id===b.dataset.dism);a.st='dism';addEv(a.id+' marked as false alarm',a.id+' отмечен как ложный','');save();toast(T('Marked as false alarm — the model will be retrained','Отмечено как ложное — модель дообучится'),'gold');lkLive();nav()});
  $$('[data-disp]').forEach(b=>b.onclick=()=>{const a=S.alerts.find(x=>x.id===b.dataset.disp);const z=zoneOf(a.pipe),crew=z?LINES[z].crew:2,id='WO-'+(S.nextW++);
    S.wos.unshift({id,type:'leak',asset:a.pipe,pri:'high',crew,st:'assigned',t:S.t,note:L(KINDS[a.kind])+', ~'+a.loss+' L/s, '+a.id,alert:a.id});a.st='disp';a.wo=id;
    addEv(id+' dispatched to '+CREWS[crew][0]+' for '+a.id,id+' выдан: '+CREWS[crew][1]+' по '+a.id,'ok');save();toast(T('Work order ','Наряд ')+id+T(' sent to ',' отправлен: ')+L(CREWS[crew]));lkLive();nav()});
  $$('[data-wo]').forEach(b=>b.onclick=()=>{S.wf='all';go('wo')});
  const by={};act.forEach(a=>{const j=PI[a.pipe][2];by[j]=(by[j]||0)+a.loss});const keys=Object.keys(BASE),mx=Math.max(5,...Object.values(by));
  $('#lkB').innerHTML=`<svg viewBox="0 0 320 ${keys.length*30+6}">`+keys.map((j,i)=>{const v=by[j]||0,w=v/mx*170;return `<text x="0" y="${i*30+19}" style="fill:var(--muted);font:12px var(--font)">${esc(L(NODES[j].n.slice(2)))}</text><rect x="110" y="${i*30+6}" width="180" height="18" rx="5" style="fill:var(--bg2)"/><rect x="110" y="${i*30+6}" width="${Math.max(v?4:0,w)}" height="18" rx="5" style="fill:${v>10?'var(--red)':'var(--amber)'}"/><text x="${116+Math.max(w,0)}" y="${i*30+19}" style="fill:var(--text);font:600 11px var(--mono)">${v?nf(v,1):''}</text>`}).join('')+'</svg>';
}

  <line x1="6" x2="94" y1="${yhi}" y2="${yhi}" style="stroke:var(--gold)" stroke-dasharray="4 3"/><line x1="6" x2="94" y1="${ylo}" y2="${ylo}" style="stroke:var(--red)" stroke-dasharray="4 3"/><text x="50" y="12" text-anchor="middle" style="fill:var(--text);font:700 12px var(--mono)">${nf(tk.lvl/tk.max*100)}%</text></svg>`}

  woDraft=null;
  $$('[data-wf]').forEach(b=>b.onclick=()=>{S.wf=b.dataset.wf;save();rWo()});
  $('#wSave').onclick=()=>{const a=$('#wAsset').value,n=$('#wNote').value.trim();$('#eAsset').textContent=a?'':T('Choose an asset','Выберите объект');$('#eNote').textContent=n.length>=5?'':T('At least 5 characters','Не меньше 5 символов');
    $('#wAsset').classList.toggle('bad',!a);$('#wNote').classList.toggle('bad',n.length<5);if(!a||n.length<5)return;
    const cr=$('#wCrew').value,id='WO-'+(S.nextW++);S.wos.unshift({id,type:$('#wType').value,asset:a,pri:$('#wPri').value,crew:cr===''?null:+cr,st:cr===''?'open':'assigned',t:S.t,note:n,alert:null});
    addEv(id+' created: '+WTYPES[$('#wType').value][0]+' at '+a,id+' создан: '+WTYPES[$('#wType').value][1]+', '+a,'ok');save();toast(T('Work order ','Наряд ')+id+T(' created',' создан'));S.wf='all';rWo()};
  woTable();woKpis();
}
function woTable(){
  const list=S.wos.filter(w=>S.wf==='all'||w.st===S.wf);
  const next={open:['assigned',T('Assign','Назначить')],assigned:['progress',T('Start work','Начать')],progress:['done',T('Complete','Завершить')]};
  $('#woT').innerHTML=`<table><thead><tr><th>ID</th><th>${T('Type','Тип')}</th><th>${T('Asset','Объект')}</th><th>${T('Priority','Приоритет')}</th><th>${T('Crew','Бригада')}</th><th>${T('Status','Статус')}</th><th>${T('Created','Создан')}</th><th>${T('Action','Действие')}</th></tr></thead><tbody>`+
   (list.length?list.map(w=>{const n=next[w.st];const sc=w.st==='done'?'ok':w.st==='progress'?'gold':w.st==='open'?'warn':w.st==='cancelled'?'':'';
    return `<tr title="${esc(w.note)}"><td class="mono">${w.id}</td><td>${L(WTYPES[w.type])}</td><td>${esc(assetName(w.asset))}</td><td><span class="pill ${w.pri==='high'?'bad':w.pri==='med'?'warn':''}">${L(PRI[w.pri])}</span></td><td>${w.crew==null?'<span class="muted">—</span>':L(CREWS[w.crew])}</td><td><span class="pill ${sc}">${L(WST[w.st])}</span></td><td class="mono">${fmtT(w.t)}</td><td><div class="row" style="flex-wrap:nowrap">${n?`<button class="btn sm ${n[0]==='done'?'pri':''}" data-adv="${w.id}">${n[1]}</button><button class="btn sm danger" data-can="${w.id}">✕</button>`:'<span class="muted">—</span>'}</div></td></tr>`}).join(''):`<tr><td colspan="8" class="empty">${T('No work orders','Нарядов нет')}</td></tr>`)+'</tbody></table>';
  $$('[data-adv]').forEach(b=>b.onclick=()=>{const w=S.wos.find(x=>x.id===b.dataset.adv),n=next[w.st][0];
    if(n==='assigned'&&w.crew==null){const z=zoneOf(w.asset);w.crew=z?LINES[z].crew:(w.type==='sample'||w.type==='meter'||w.type==='flush'?3:2)}
    w.st=n;addEv(w.id+' → '+WST[n][0],w.id+' → '+WST[n][1],n==='done'?'ok':'');
    if(n==='done'&&w.type==='leak'){const before=S.leaks.length;S.leaks=S.leaks.filter(l=>l.pipe!==w.asset);const a=S.alerts.find(x=>x.id===w.alert)||S.alerts.find(x=>x.pipe===w.asset&&['new','ack','disp'].includes(x.st));
      if(a){a.st='fixed';a.wo=w.id}if(before!==S.leaks.length){H=calc();addEv('Leak on '+w.asset+' repaired, pressure restored','Утечка на '+w.asset+' устранена, давление восстановлено','ok');toast(T('Leak repaired — losses removed from the model','Утечка устранена — потери убраны из модели'))}}
    else if(n==='done'&&w.type==='flush'){const q=S.qp.find(q=>QP.find(x=>x[0]===q.id)[2]===w.asset);if(q){q.cl+=.35;q.tu=Math.max(.1,q.tu-.3)}toast(T('Flushing complete — chlorine residual recovering','Промывка завершена — остаточный хлор восстанавливается'))}
    else toast(w.id+' → '+L(WST[n]));
    save();woTable();woKpis();nav()});
  $$('[data-can]').forEach(b=>b.onclick=()=>{const w=S.wos.find(x=>x.id===b.dataset.can);w.st='cancelled';const a=S.alerts.find(x=>x.wo===w.id&&x.st==='disp');if(a){a.st='ack';a.wo=null}addEv(w.id+' cancelled',w.id+' отменён','');save();toast(T('Work order cancelled','Наряд отменён'),'gold');woTable();woKpis();nav()});
}

/* ---------- quality ---------- */
function qCards(){return S.qp.map((q,i)=>{const b=QP[i],bad=PARAMS.some(p=>qBad(p[0],q[p[0]]));
  return `<button class="qc ${S.qsel===q.id?'on':''} ${bad?'badq':''}" data-qp="${q.id}"><div class="nm"><span>${L(b[1])}</span><span class="pill ${bad?'bad':'ok'}">${bad?T('Exceedance','Превышение'):T('Compliant','Норма')}</span></div><div class="zn">${q.id} · ${L(NODES[b[2]].n.slice(2))}</div>
   <div class="qv">${PARAMS.map(p=>{const v=q[p[0]];return `<div>${p[0]==='cl'?'Cl₂':p[0]==='tu'?T('Turb.','Мутн.'):p[0]==='ph'?'pH':T('EC','ЭП')}<b class="${qBad(p[0],v)?'bad-t':qWarn(p[0],v)?'warn-t':''}">${nf(v,p[5])}</b></div>`}).join('')}</div></button>`}).join('')}
function rQuality(){
  $('#v-quality').innerHTML=`<div class="qgrid" id="qG"></div>
  <div class="grid2"><div class="card svgc"><h3><span id="qT"></span><span class="sp"></span><span class="chips">${PARAMS.map(p=>`<button class="chip ${S.qpar===p[0]?'on':''}" data-qpar="${p[0]}">${p[0]==='ph'?'pH':L(p[1])}</button>`).join('')}</span></h3><div id="qC"></div><div class="row" id="qAct" style="margin-top:10px"></div></div>
   <div class="card"><h3>${T('Log lab sample','Внести лабораторную пробу')}</h3><div class="fgrid">
    <div class="f full"><label for="sPt">${T('Sampling point','Точка отбора')}</label><select class="input" id="sPt">${opts(QP.map(q=>[q[0],q[0]+' · '+L(q[1])]),S.qsel)}</select></div>
    <div class="f"><label for="sCl">${T('Free chlorine, mg/L','Своб. хлор, мг/л')}</label><input class="input" id="sCl" inputmode="decimal" placeholder="0.50"></div>
    <div class="f"><label for="sTu">${T('Turbidity, NTU','Мутность, NTU')}</label><input class="input" id="sTu" inputmode="decimal" placeholder="0.25"></div>
    <div class="f"><label for="sPh">pH</label><input class="input" id="sPh" inputmode="decimal" placeholder="7.5"></div>
    <div class="f"><label for="sEc">${T('Conductivity, µS/cm','ЭП, мкСм/см')}</label><input class="input" id="sEc" inputmode="decimal" placeholder="430"></div>
    <div class="f full"><label for="sBy">${T('Sampled by','Отобрал')}</label><input class="input" id="sBy" value="${esc(S.user)}"></div>
    <div class="full er bad-t" id="sErr" style="font-size:12.5px"></div>
    <div class="full"><button class="btn pri" id="sSave">${T('Save sample','Сохранить пробу')}</button></div></div></div></div>
  <div class="card"><h3>${T('Laboratory results','Результаты лаборатории')}<span class="sp"></span><span class="pill">${T('Limits: Cl₂ 0.2–2.0 · turbidity ≤ 1 · pH 6.5–8.5 · EC ≤ 1000','Нормы: Cl₂ 0,2–2,0 · мутность ≤ 1 · pH 6,5–8,5 · ЭП ≤ 1000')}</span></h3><div class="tw" id="labT"></div></div>`;
  $$('[data-qpar]').forEach(b=>b.onclick=()=>{S.qpar=b.dataset.qpar;save();rQuality()});
  $('#sSave').onclick=()=>{const g=id=>parseFloat($(id).value.replace(',','.'));const v={cl:g('#sCl'),tu:g('#sTu'),ph:g('#sPh'),ec:g('#sEc')},by=$('#sBy').value.trim();
    const rng={cl:[0,5],tu:[0,50],ph:[0,14],ec:[0,5000]};let err=[];
    for(const k in v){const ok=!isNaN(v[k])&&v[k]>=rng[k][0]&&v[k]<=rng[k][1];$({cl:'#sCl',tu:'#sTu',ph:'#sPh',ec:'#sEc'}[k]).classList.toggle('bad',!ok);if(!ok)err.push(k==='cl'?'Cl₂':k==='tu'?T('turbidity','мутность'):k==='ph'?'pH':T('conductivity','ЭП'))}
    $('#sBy').classList.toggle('bad',!by);if(!by)err.push(T('sampler','отборщик'));
    if(err.length){$('#sErr').textContent=T('Check: ','Проверьте: ')+err.join(', ');return}
    const id='LS-'+(S.nextL++),pt=$('#sPt').value;S.lab.unshift({id,pt,t:S.t,...v,by});const bad=PARAMS.some(p=>qBad(p[0],v[p[0]]));
    addEv('Lab sample '+id+' at '+pt+(bad?': EXCEEDANCE':': compliant'),'Проба '+id+', '+pt+(bad?': ПРЕВЫШЕНИЕ':': норма'),bad?'warn':'ok');save();
    toast(bad?T('Sample '+id+' exceeds limits — consider a flushing order','Проба '+id+' вне нормы — назначьте промывку'):T('Sample '+id+' saved — compliant','Проба '+id+' сохранена — норма'),bad?'bad':'');rQuality()};
  qLive();labTable();
}
function qLive(){
  $('#qG').innerHTML=qCards();$$('[data-qp]').forEach(b=>b.onclick=()=>{S.qsel=b.dataset.qp;save();qLive()});
  const i=QP.findIndex(x=>x[0]===S.qsel),q=S.qp[i],p=PARAMS.find(x=>x[0]===S.qpar),vals=q.h[p[0]];
  $('#qT').textContent=L(QP[i][1])+' · '+(p[0]==='ph'?'pH':L(p[1]));
  const w=560,h=200,pl=44,pr=10,pt=12,pb=22;let mn=Math.min(...vals,p[3]),mx=Math.max(...vals,p[4]===1000?Math.max(...vals)*1.05:p[4]);
  if(p[0]==='ec'){mn=Math.min(...vals)*.95;mx=Math.max(1000,...vals)*1.02}if(p[0]==='ph'){mn=6.2;mx=8.8}if(p[0]==='cl'){mn=0;mx=Math.max(1.4,...vals)}if(p[0]==='tu'){mn=0;mx=Math.max(1.3,...vals)}
  const X=k=>pl+k*(w-pl-pr)/Math.max(1,vals.length-1),Y=v=>pt+(h-pt-pb)*(1-(v-mn)/(mx-mn));
  let s=`<svg viewBox="0 0 ${w} ${h}">`;for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;s+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" style="fill:var(--dim);font:10.5px var(--mono)">${v.toFixed(p[5]===0?0:2)}</text>`}
  [p[3],p[4]].forEach(l=>{if(l>mn&&l<mx)s+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(l)}" y2="${Y(l)}" style="stroke:var(--red)" stroke-dasharray="5 4"/><text x="${w-pr}" y="${Y(l)-4}" text-anchor="end" style="fill:var(--red);font:600 10.5px var(--font)">${T('limit','норма')} ${l}</text>`});
  const path=vals.map((v,k)=>(k?'L':'M')+X(k).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  s+=`<path d="${path} L${X(vals.length-1)} ${h-pb} L${pl} ${h-pb}Z" style="fill:color-mix(in srgb,var(--mal) 14%,transparent)"/><path d="${path}" fill="none" style="stroke:var(--mal3)" stroke-width="2.2"/>`;
  vals.forEach((v,k)=>{if(qBad(p[0],v))s+=`<circle cx="${X(k)}" cy="${Y(v)}" r="3.5" style="fill:var(--red)"/>`});
  [0,Math.floor(vals.length/2),vals.length-1].forEach(k=>{s+=`<text x="${clamp(X(k),pl+16,w-pr-16)}" y="${h-5}" text-anchor="middle" style="fill:var(--dim);font:10.5px var(--mono)">${hm(S.t-(vals.length-1-k)*5)}</text>`});
  $('#qC').innerHTML=s+'</svg>';
  const bad=PARAMS.some(pp=>qBad(pp[0],q[pp[0]])),z=QP[i][2],has=S.wos.some(w=>w.asset===z&&w.type==='flush'&&!['done','cancelled'].includes(w.st));
  const sig='q'+bad+has+S.qsel+PT.lang;if($('#qAct').dataset.sig!==sig){$('#qAct').dataset.sig=sig;
  $('#qAct').innerHTML=bad?(has?`<span class="pill gold">${T('Flushing order already open','Наряд на промывку уже открыт')}</span>`:`<button class="btn sm gold" id="qFlush">${T('Create flushing order','Создать наряд на промывку')}</button>`):`<span class="pill ok">${T('Within regulatory limits','В пределах нормативов')}</span>`;
  const f=$('#qFlush');if(f)f.onclick=()=>{const id='WO-'+(S.nextW++);S.wos.unshift({id,type:'flush',asset:z,pri:'high',crew:3,st:'assigned',t:S.t,note:'Water quality exceedance at '+QP[i][0],alert:null});addEv(id+' flushing ordered at '+QP[i][0],id+': промывка, '+QP[i][0],'ok');save();toast(T('Flushing order ','Наряд на промывку ')+id+T(' sent to Crew Q4',' отправлен бригаде К4'));qLive();nav()}}
}
function labTable(){
  $('#labT').innerHTML=`<table><thead><tr><th>ID</th><th>${T('Point','Точка')}</th><th>${T('Time','Время')}</th><th>Cl₂</th><th>${T('Turbidity','Мутность')}</th><th>pH</th><th>${T('EC','ЭП')}</th><th>${T('Sampled by','Отобрал')}</th><th>${T('Result','Итог')}</th></tr></thead><tbody>`+
   S.lab.map(x=>{const bad=PARAMS.some(p=>qBad(p[0],x[p[0]]));const c=k=>qBad(k,x[k])?'bad-t':'';const q=QP.find(z=>z[0]===x.pt);
   return `<tr><td class="mono">${x.id}</td><td>${x.pt} · ${esc(L(q[1]))}</td><td class="mono">${fmtT(x.t)}</td><td class="${c('cl')}">${nf(x.cl,2)}</td><td class="${c('tu')}">${nf(x.tu,2)}</td><td class="${c('ph')}">${nf(x.ph,2)}</td><td class="${c('ec')}">${nf(x.ec)}</td><td>${esc(x.by)}</td><td><span class="pill ${bad?'bad':'ok'}">${bad?T('Exceedance','Превышение'):T('Compliant','Норма')}</span></td></tr>`}).join('')+'</tbody></table>';
}

/* ---------- boot ---------- */
let role='ops';
$$('#roles .opt').forEach(b=>b.onclick=()=>{role=b.dataset.role;$$('#roles .opt').forEach(x=>x.classList.toggle('on',x===b))});
function show(){const a=!!S.auth;$('#login').hidden=a;$('#app').hidden=!a;if(a)render()}
$('#loginBtn').onclick=()=>{const u=$('#lu').value.trim(),p=$('#lp').value;let e='';if(!u)e=T('Enter a username','Введите имя пользователя');else if(!p)e=T('Enter a password','Введите пароль');
  $('#lerr').textContent=e;$('#lu').classList.toggle('bad',!u);$('#lp').classList.toggle('bad',!p);if(e)return;
  S.auth=true;S.user=u;S.role=role;S.view=role==='field'?'wo':'overview';addEv(u+' signed in ('+(role==='ops'?'control room':'field engineer')+')',u+' вошёл ('+(role==='ops'?'диспетчер':'инженер бригады')+')','');save();show();toast(T('Welcome, ','Добро пожаловать, ')+esc(u))};
$('#lp').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click()});
$('#logout').onclick=()=>{S.auth=false;save();closeSide();show()};
$('#reset').onclick=()=>{try{Object.keys(localStorage).filter(k=>k.startsWith(PFX)).forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()};
$('#pauseBtn').onclick=()=>{S.paused=!S.paused;save();clock()};
$('#menuBtn').onclick=()=>{$('#side').classList.add('open');$('#scrim').classList.add('on')};
$('#scrim').onclick=closeSide;
PT.onLang(()=>{if(S.auth)render();else $('#lerr').textContent=''});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.auth&&(S.view==='overview'||S.view==='res'))live()},150)});
setInterval(()=>{if(S.paused||!S.auth)return;step(false);H=calc();save();live()},2000);
document.addEventListener('DOMContentLoaded',show);
})();
</script>
