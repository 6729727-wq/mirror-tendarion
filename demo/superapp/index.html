<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warga+ Super-app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.wrap{max-width:1400px;margin:0 auto;padding:18px 20px 60px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font-size:22px;display:flex;align-items:center;gap:10px}
.top h1 b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;font-size:13px;letter-spacing:-.02em}
.top .sp{flex:1}
.stk{font-family:var(--mono);font-size:11.5px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 392px minmax(0,1.12fr);grid-template-areas:"feat phone cons";gap:20px;align-items:start}
.a-feat{grid-area:feat;display:flex;flex-direction:column;gap:14px;min-width:0}
.a-phone{grid-area:phone;min-width:0}
.a-cons{grid-area:cons;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.card h4{margin:16px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* features */
.feat{display:flex;gap:12px;padding:11px 10px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:.15s}
.feat:hover{border-color:var(--line2);background:var(--panel2)}
.feat.on{border-color:color-mix(in srgb,var(--mal) 55%,transparent);background:color-mix(in srgb,var(--mal) 8%,transparent)}
.feat .fi{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);font-size:17px}
.feat b{display:block;font-size:13.5px}
.feat span{font-size:12.5px;color:var(--muted);line-height:1.45;display:block}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:13px}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.tgt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.tgt div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tgt b{display:block;font-family:var(--mono);font-size:18px;color:var(--gold2)}
.tgt span{font-size:11.5px;color:var(--muted)}
/* phone frame */
.phone{border-radius:50px;padding:12px;background:linear-gradient(160deg,#2a3b35,#0b1512);box-shadow:var(--shadow),inset 0 0 0 2px #3a4f47;position:sticky;top:60px}
.scr{border-radius:38px;overflow:hidden;background:var(--bg);height:760px;display:flex;flex-direction:column;position:relative;isolation:isolate}
.sbar{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12.5px;font-weight:700;flex:none}
.sbar .isl{width:96px;height:24px;background:#000;border-radius:14px}
.sbar .sig{display:flex;gap:5px;align-items:center;font-size:11px}
.sbar .sig .off{color:var(--amber)}
.ahd{display:flex;align-items:center;gap:8px;padding:4px 14px 8px;flex:none}
.ahd .lg{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;font-weight:800;font-size:11.5px;flex:none}
.ahd .tt{flex:1;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{position:relative;width:36px;height:36px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);display:grid;place-items:center;cursor:pointer;color:var(--text);flex:none;padding:0}
.ibtn:hover{border-color:var(--mal)}
.ibtn.offl{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 55%,transparent);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.ibtn .bd{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.ban{margin:0 14px 6px;border-radius:12px;padding:8px 11px;font-size:12px;font-weight:600;display:flex;gap:8px;align-items:center;flex:none;line-height:1.35}
.ban.off{background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent)}
.ban.sync{background:color-mix(in srgb,var(--mal) 14%,transparent);color:var(--mal3);border:1px solid color-mix(in srgb,var(--mal) 40%,transparent)}
.pbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 14px 18px;scrollbar-width:thin}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);padding:6px 4px 14px;flex:none}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--dim);cursor:pointer;padding:4px 0;min-width:0}
.tabbar button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabbar button.on{color:var(--mal3)}
.tabbar button.on svg{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--mal) 60%,transparent))}
/* phone content */
.xs{font-size:11.5px}.sm{font-size:12.5px}.b{font-weight:700}
.row{display:flex;align-items:center;gap:10px}.row .sp{flex:1;min-width:0}
.hello{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1306;flex:none}
.hello .sp{flex:1}
.hello .nm{font-weight:800;font-size:16px}
.idc{perspective:1200px;margin-bottom:6px}
.idin{position:relative;aspect-ratio:1.586;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.9,.3,1);cursor:pointer}
.idin.fl{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;padding:12px 14px;display:flex;flex-direction:column}
.face.fr{color:#fff;background:radial-gradient(130% 120% at 0 0,#21c99a 0,#0e7458 48%,#093a2e 100%);box-shadow:0 10px 30px rgba(6,40,30,.35)}
.face.fr:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px);pointer-events:none}
.face.fr:after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(243,215,154,.5),transparent 68%);pointer-events:none}
.face.bk{transform:rotateY(180deg);background:#f6f2e6;color:#14251f;flex-direction:row;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(6,40,30,.3)}
.idtop{display:flex;align-items:center;gap:9px;position:relative;z-index:1}
.emb{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#f3d79a,#c69a3e);color:#1a1306;font-weight:800;font-size:11px;flex:none}
.idtop .t1{font-size:10px;font-weight:800;letter-spacing:.14em}
.idtop .t2{font-size:10.5px;opacity:.75}
.chipz{margin-left:auto;width:32px;height:24px;border-radius:5px;background:linear-gradient(135deg,#f3d79a,#b8893a);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.idmid{display:flex;gap:11px;margin-top:9px;flex:1;position:relative;z-index:1;min-height:0}
.photo{width:23%;aspect-ratio:.83;border-radius:9px;overflow:hidden;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.35);align-self:flex-start}
.photo svg{display:block;width:100%;height:100%}
.fields{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.fields i{display:block;font-style:normal;font-size:9px;opacity:.7;text-transform:uppercase;letter-spacing:.08em}
.fields b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fields .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.idbot{font-size:10px;opacity:.82;position:relative;z-index:1;display:flex;justify-content:space-between;gap:8px;align-items:flex-end}
.idbot .vf{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.16);white-space:nowrap}
.face.bk canvas{width:44%;aspect-ratio:1;display:block;border-radius:8px;flex:none}
.qrside{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.ring{position:relative;width:46px;height:46px}
.ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.2}
.ring .rb{stroke:#dcd5c0}.ring .rf{stroke:#0e9a72;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:13px}
.qrside .code{font-size:17px;font-weight:600;letter-spacing:.06em}
.qrside .op{opacity:.65;font-size:10.5px;line-height:1.35}
.hint{text-align:center;font-size:11.5px;color:var(--dim);margin:2px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tile{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:11px;font-weight:600;color:var(--muted);padding:0;min-width:0}
.tile i{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);color:var(--mal3);transition:.15s;font-style:normal}
.tile:hover i{border-color:var(--gold);color:var(--gold2)}
.tile span{text-align:center;line-height:1.2}
.sect{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px}
.sect button{border:0;background:none;color:var(--mal3);font-weight:700;font-size:12px;cursor:pointer;text-transform:none;letter-spacing:0;padding:0}
.li{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;transition:.15s;width:100%;text-align:left}
.li:hover{border-color:var(--line2)}
.li .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);flex:none;font-size:17px}
.li .sp{flex:1;min-width:0}
.li .sp b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .sp div{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{font-size:12.5px;font-weight:700;text-align:right;white-space:nowrap;flex:none}
.li .chev{color:var(--dim);flex:none}
.li.dis{opacity:.45;cursor:not-allowed}
.load{height:4px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden;width:110px;max-width:100%}
.load i{display:block;height:100%;border-radius:2px}
.back{border:0;background:none;color:var(--muted);cursor:pointer;font-weight:600;padding:2px 0 8px;font-size:13px;display:flex;align-items:center;gap:2px}
.back:hover{color:var(--text)}
.h2{font-size:19px;font-weight:800;margin:2px 0 4px;line-height:1.25}
.sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.steps{display:flex;gap:4px;margin:0 0 12px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line2)}
.steps i.on{background:var(--mal)}
.pbtn{width:100%;justify-content:center;margin-top:8px}
.ticket{border-radius:18px;background:var(--panel);border:1px solid var(--line2);margin-bottom:10px;overflow:hidden}
.ticket .tk{display:flex;align-items:stretch}
.ticket .num{width:104px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 6px;background:linear-gradient(160deg,color-mix(in srgb,var(--mal) 24%,transparent),color-mix(in srgb,var(--mal) 6%,transparent));border-right:2px dashed var(--line2)}
.ticket .num b{font-family:var(--mono);font-size:26px;letter-spacing:-.02em;color:var(--mal3)}
.ticket .num span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.ticket .inf{flex:1;padding:12px;min-width:0;font-size:12.5px}
.ticket .inf b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket .inf .m{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket .ft{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.ticket .ft .sp{flex:1;min-width:60px}
.ticket.called{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.ticket.called .num{background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 35%,transparent),color-mix(in srgb,var(--gold) 8%,transparent))}
.ticket.called .num b{color:var(--gold2)}
.ticket.pend .num b{color:var(--amber)}
.ahead{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--mal),var(--mal3));border-radius:3px;transition:width .6s}
.live{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--mal3);text-transform:uppercase;letter-spacing:.06em}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mal3);animation:pl 1.4s infinite}
.live.off{color:var(--amber)}.live.off:before{background:var(--amber);animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--mal3) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.xs{padding:4px 10px;font-size:12px}
.btn.dng{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.slot{border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:8px 0;cursor:pointer;font-weight:700;font-size:12.5px;font-family:var(--mono);text-align:center}
.slot:hover:not(:disabled){border-color:var(--gold)}
.slot.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1306;border-color:transparent}
.slot:disabled{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.slot.now{grid-column:1/-1;font-family:var(--font);display:flex;justify-content:center;gap:8px;align-items:center}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:4px 0 6px;scrollbar-width:none}
.day{flex:none;border:1px solid var(--line2);background:var(--panel2);border-radius:12px;padding:6px 0;width:54px;text-align:center;cursor:pointer;font-size:11px;color:var(--muted);font-weight:600}
.day b{display:block;font-size:17px;color:var(--text)}
.day.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 16%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:12.5px}
.chip.on,.chip:hover{border-color:var(--gold);color:var(--gold2)}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-size:13px}
.sum .r{display:flex;justify-content:space-between;padding:7px 0;gap:12px;border-bottom:1px solid var(--line)}
.sum .r:last-child{border-bottom:0}
.sum .r span:first-child{color:var(--muted);flex:none}
.sum .r span:last-child{text-align:right;font-weight:600;min-width:0;overflow-wrap:anywhere}
.appt{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:9px}
.appt .dt{display:flex;gap:11px;align-items:center}
.appt .cal{width:46px;flex:none;border-radius:12px;overflow:hidden;text-align:center;border:1px solid var(--line2)}
.appt .cal span{display:block;font-size:9.5px;font-weight:800;text-transform:uppercase;background:var(--red);color:#fff;padding:2px 0}
.appt .cal b{display:block;font-size:19px;padding:2px 0}
.appt .ft{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.appt .ft .sp{flex:1}
.doc{display:flex;align-items:center;gap:11px}
.doc .dp{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.tcard{border-radius:18px;padding:14px 16px;color:#fff;background:linear-gradient(135deg,#1c3f8a,#0f2350 60%,#0a1733);position:relative;overflow:hidden;margin-bottom:10px}
.tcard:after{content:"";position:absolute;right:-30px;bottom:-60px;width:160px;height:160px;border-radius:50%;border:22px solid rgba(78,164,255,.18)}
.tcard .l{font-size:11.5px;opacity:.8}
.tcard .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tcard .n{font-family:var(--mono);font-size:11.5px;opacity:.75;margin-top:6px}
.srch{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.srch .stp{display:flex;flex-direction:column;gap:6px;min-width:0}
.srch select{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:13px;outline:none}
.srch select:focus{border-color:var(--mal)}
.rt{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.rt.best{border-color:color-mix(in srgb,var(--mal) 55%,transparent)}
.rt .top2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ln{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;padding:0 7px;border-radius:7px;font-weight:800;font-size:11.5px;color:#0b1512}
.rt .dur{margin-left:auto;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.rt .meta{font-size:11.5px;color:var(--muted);margin-top:5px}
.rt .ft{display:flex;align-items:center;gap:8px;margin-top:8px}
.rt .ft .sp{flex:1}
.arr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.arr:last-child{border-bottom:0}
.arr .sp{flex:1;min-width:0}
.arr .sp b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arr .eta{font-family:var(--mono);font-weight:700;font-size:15px;text-align:right;min-width:62px;font-variant-numeric:tabular-nums}
.arr .eta.now{color:var(--gold2);animation:blink 1s infinite}
.arr .eta.cached{color:var(--muted)}
@keyframes blink{50%{opacity:.4}}
.crowd{display:inline-flex;gap:2px;vertical-align:middle;margin-left:4px}
.crowd i{width:4px;height:9px;border-radius:1px;background:var(--line2)}
.crowd i.f{background:var(--mal3)}
.board{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px 12px}
.wbal{border-radius:20px;padding:16px;color:#fff;background:radial-gradient(120% 120% at 0 0,#1fc795 0,#0d6e52 55%,#0a3e30 100%);position:relative;overflow:hidden}
.wbal:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(243,215,154,.55),transparent 70%)}
.wbal .l{font-size:12px;opacity:.85}
.wbal .v{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wbal .acts{display:flex;gap:8px;margin-top:12px;position:relative;z-index:1}
.wbal .acts button{flex:1;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:8px 0;font-weight:700;font-size:12.5px;cursor:pointer}
.wbal .acts button:hover{background:rgba(255,255,255,.22)}
.due{font-size:11px;font-weight:700}
.pos{color:var(--mal3)}.red{color:var(--red)}.amb{color:var(--amber)}
.pendtag{display:inline-block;font-size:10px;font-weight:700;color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 50%,transparent);border-radius:6px;padding:0 5px;margin-left:5px;vertical-align:1px}
.nt{display:flex;gap:11px;padding:11px 12px;border-radius:14px;margin-bottom:7px;cursor:pointer;border:1px solid var(--line);background:var(--panel);position:relative}
.nt.un{border-color:color-mix(in srgb,var(--mal) 45%,transparent)}

function drawQR(cv,payload){
  const x=cv.getContext('2d'),N=29,q=2,sz=cv.width/(N+q*2);x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);
  const r=rng(hash(payload)),M=[...Array(N)].map(()=>Array(N).fill(0)),R=[...Array(N)].map(()=>Array(N).fill(0));
  const finder=(ox,oy)=>{for(let i=-1;i<8;i++)for(let j=-1;j<8;j++){const a=ox+i,b=oy+j;if(a<0||b<0||a>=N||b>=N)continue;R[b][a]=1;const d=Math.max(Math.abs(i-3),Math.abs(j-3));M[b][a]=(d===3||d<=1)&&i>=0&&j>=0&&i<7&&j<7?1:0}};
  finder(0,0);finder(N-7,0);finder(0,N-7);
  for(let i=8;i<N-8;i++){M[6][i]=M[i][6]=i%2?0:1;R[6][i]=R[i][6]=1}
  const al=N-7;for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++){const d=Math.max(Math.abs(i),Math.abs(j));M[al+j][al+i]=d===1?0:1;R[al+j][al+i]=1}
  for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++)if(!R[y][xx])M[y][xx]=r()<.5?1:0;
  const c0=11,c1=18;
  x.fillStyle='#0b1512';
  for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++)if(M[y][xx]===1&&!(y>=c0&&y<c1&&xx>=c0&&xx<c1))x.fillRect(Math.round((xx+q)*sz),Math.round((y+q)*sz),Math.ceil(sz),Math.ceil(sz));
  const cx=(c0+q)*sz,cw=(c1-c0)*sz;x.fillStyle='#fff';x.fillRect(cx,cx,cw,cw);
  const g=x.createLinearGradient(cx,cx,cx+cw,cx+cw);g.addColorStop(0,'#36e0ae');g.addColorStop(1,'#0f7a5c');x.fillStyle=g;x.beginPath();
  if(x.roundRect)x.roundRect(cx+3,cx+3,cw-6,cw-6,7);else x.rect(cx+3,cx+3,cw-6,cw-6);x.fill();
  x.fillStyle='#fff';x.font='800 '+Math.round(cw*.4)+'px Inter,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('W+',cx+cw/2,cx+cw/2+1);
}

/* ---------- actions & offline outbox ---------- */
function commit(o){ // o: {kind, api, en, ru, ref}
  if(S.online){log('POST','ok',o.api+' → 201 Created',o.api+' → 201 Created');return true}
  S.outbox.push({id:uid('ob'),ts:Date.now(),...o});save();
  log('QUEUE','wa',o.en+' — saved to outbox',o.ru+' — сохранено в очередь отправки');return false}
function notify(o,banner=true){const n={id:uid('n'),ts:Date.now(),read:0,...o};S.notes.unshift(n);S.notes.length=Math.min(S.notes.length,40);save();if(banner)showPush(n);paintChrome();if(S.tab==='notes')renderPhone();return n}
function findRef(r){if(!r)return null;const arr=S[r.t];return arr?arr.find(x=>x.id===r.id):null}
async function sync(){
  if(ui.syncing||!S.online)return;
  const total=S.outbox.length;
  if(total){ui.syncing=true;paintChrome();log('SYNC','in','Pushing '+total+' queued action(s) with idempotency keys','Отправка '+total+' действий из очереди с ключами идемпотентности')}
  let done=0;
  while(S.outbox.length&&S.online){
    await sleep(850);if(!S.online)break;
    const o=S.outbox.shift();const it=findRef(o.ref);
    if(it){
      if(o.kind==='ticket'){assignTicket(it)}
      else if(o.kind==='appt'){it.st='ok'}
      else{it.pend=0}
      if(o.kind==='bill'){const b=S.bills.find(x=>x.id===o.bill);if(b)b.pend=0}
    }
    done++;S.syncs++;save();log('200','ok',o.en+' — confirmed by server',o.ru+' — подтверждено сервером');renderPhone();
  }
  ui.syncing=false;S.cachedAt=Date.now();save();paintChrome();
  if(done)toast('✓ '+T(done+' offline action(s) synced',done+' офлайн-действий синхронизировано'));
  while(ui.pushQ.length&&S.online){const c=ui.pushQ.shift();await sleep(500);deliverPush(c)}
}
function setOnline(v){
  if(S.online===v)return;S.online=v;
  if(!v){S.cachedAt=Date.now();log('NET','wa','Connection lost — app switched to offline mode (cache from '+hhmm(S.cachedAt)+')','Связь потеряна — приложение в офлайн-режиме (кэш на '+hhmm(S.cachedAt)+')');toast(T('Offline mode — cached data, actions will sync later','Офлайн-режим — данные из кэша, действия отправятся позже'),'warn')}
  else{log('NET','ok','Back online','Связь восстановлена');if(ui.tok<=0){ui.tok=300;log('OIDC','in','Refresh token exchanged → new access token (300 s)','Refresh-токен обменян → новый access-токен (300 с)')}}
  save();renderPhone();renderConsole();if(v)sync();
}

function svcWaiting(o,s){return 3+hash(o+s+new Date().getHours())%9}
function assignTicket(t){const h=hash(t.id);const sv=SVC[t.svc];t.num=sv.p+'-'+String(20+h%70).padStart(3,'0');if(t.slot==='now'){t.st='live';t.ahead=t.ahead0=3+h%5}else{t.st='booked';t.ahead=t.ahead0=0}}
function qSlots(o){const now=new Date();const d=new Date(now);d.setSeconds(0,0);d.setMinutes(d.getMinutes()<30?30:60);const out=[];
  for(let i=0;i<8;i++){const ts=d.getTime()+i*1800e3;const t=hhmm(ts);out.push({t,ts,taken:hash(o+t)%4===0})}return out}
const activeTickets=()=>S.tickets.filter(t=>t.st!=='done');

/* ---------- doctor logic ---------- */
function dDays(){const d0=dayStart(Date.now());return [0,1,2,3,4,5].map(i=>d0+i*DAY)}
function dSlots(doc,day){const out=[];const now=Date.now();for(let h=8;h<16;h++)for(const m of [0,30]){const t=pad(h)+':'+pad(m);const ts=day+h*3600e3+m*60e3;
  const mine=S.appts.some(a=>a.d===doc&&a.day===day&&a.time===t);out.push({t,dis:ts<now+30*60e3||hash(doc+'|'+day+'|'+t)%3===0||mine})}return out}
const upcomingAppts=()=>S.appts.filter(a=>a.day+(+a.time.slice(0,2))*3600e3>Date.now()-3600e3).sort((a,b)=>(a.day-b.day)||a.time.localeCompare(b.time));

/* ---------- transport logic ---------- */
function routes(a,b){if(a===b)return[];const d=Math.abs(a-b),h=hash(a+'>'+b);const out=[];
  out.push({lines:[h%6],dur:d*4+7+h%5,walk:3+h%4,xf:0,via:null});
  let v=(a+b+3)%10;if(v===a||v===b)v=(v+1)%10;
  out.push({lines:[(h>>3)%6,(h>>6)%6===(h>>3)%6?((h>>3)%6+2)%6:(h>>6)%6],dur:d*3+11+(h>>2)%6,walk:5+(h>>9)%3,xf:1,via:v});
  if(h%3)out.push({lines:[5],dur:Math.max(9,d*2+9+(h>>5)%4),walk:8,xf:0,via:null});
  out.sort((x,y)=>x.dur-y.dur);return out}

/* ---------- render ---------- */
function paintChrome(){

  const un=S.notes.filter(n=>!n.read).length;
  $('#bellBtn').innerHTML=ic('bell',19)+(un?'<span class="bd">'+un+'</span>':'');
  $('#bellBtn').classList.toggle('on',S.tab==='notes');
  const nb=$('#netBtn');nb.innerHTML=ic(S.online?'cloud':'cloudoff',19);nb.classList.toggle('offl',!S.online);nb.title=T(S.online?'Go offline (simulate no signal)':'Go back online',S.online?'Отключить связь (симуляция)':'Вернуть связь');
  $('#sig').innerHTML=S.online?'<span>5G</span><span>▂▄▆█</span><span>86%</span>':'<span class="off">'+T('No signal','Нет сети')+'</span><span>86%</span>';
  const ob=S.outbox.length;
  $('#banner').innerHTML=!S.online?'<div class="ban off">'+ic('cloudoff',16)+'<span>'+T('Offline — showing data cached at ','Офлайн — данные из кэша на ')+hhmm(S.cachedAt)+(ob?' · '+T(ob+' action(s) waiting to sync','ждут отправки: '+ob):'')+'</span></div>':
    ui.syncing?'<div class="ban sync"><span class="bio" style="width:14px;height:14px;margin:0;border-width:2px"></span><span>'+T('Back online — syncing ','Связь есть — отправляем ')+ob+T(' queued action(s)…',' действий из очереди…')+'</span></div>':'';
}
function renderPhone(reset){
  const b=$('#pbody');const st=b.scrollTop;
  paintChrome();
  b.innerHTML=SCR[S.tab]();
  b.scrollTop=reset?0:st;

  renderSheet();
  $$('#feats .feat').forEach(f=>f.classList.toggle('on',f.dataset.go===S.tab||(f.dataset.go==='offline'&&!S.online)));
}
function go(tab){if(S.tab!==tab){S.tab=tab;save()}if(tab==='queue')ui.q=null;if(tab==='doctor')ui.d=null;ui.sheet=null;renderPhone(true)}

/* ---------- sheet ---------- */
function openSheet(fn){ui.sheet=fn;renderSheet()}
function closeSheet(){ui.sheet=null;renderSheet()}
function renderSheet(){const h=$('#sheetHost');if(!ui.sheet){h.innerHTML='';return}
  const keep=h.querySelector('.sheet');h.innerHTML='<div class="shbg" data-a="sheetClose"'+(keep?' style="animation:none"':'')+'></div><div class="sheet"'+(keep?' style="animation:none"':'')+'>'+ui.sheet()+'</div>'}
const okView=(title,sub,wait)=>'<div class="ctr"><div class="okm'+(wait?' wait':'')+'">'+(wait?'<span style="font-size:34px">⏳</span>':CHECK)+'</div><h4>'+title+'</h4><div class="sm muted" style="margin-bottom:6px">'+sub+'</div><button class="btn pbtn" data-a="sheetClose">'+T('Done','Готово')+'</button></div>';
const bioView=()=>'<div class="ctr"><div class="bio"></div><h4>'+T('Confirming with biometrics…','Подтверждение биометрией…')+'</h4><div class="sm muted">'+T('Signed with the device key','Подпись ключом устройства')+'</div></div>';

/* ---------- push ---------- */
function showPush(n){const scr=$('#scr');$$('.push',scr).forEach(p=>p.remove());

  el.innerHTML='<span class="ic">'+n.ic+'</span><div class="sp"><div class="hd"><span>Warga+'+(n.crit?' · '+T('critical alert','экстренно'):'')+'</span><span>'+T('now','сейчас')+'</span></div><b>'+esc(T(n.ten,n.tru))+'</b><p>'+esc(T(n.ben,n.bru))+'</p></div>';

function deliverPush(c){notify({ic:c.ic,ten:c.t,tru:c.t,ben:c.b,bru:c.b,link:c.link,crit:c.p===2,camp:c.id});log('PUSH','go','Received '+c.id+' via FCM → opens “'+c.link+'”','Получен '+c.id+' через FCM → открывает «'+c.link+'»')}

const FEATS=[
 {go:'home',ic:'🪪',en:['Digital ID','Flip the card to show a signed QR that rotates every 30 s — officers verify it even offline.'],ru:['Цифровое удостоверение','Переверните карту — QR с подписью меняется каждые 30 с и проверяется даже без связи.']},
 {go:'queue',ic:'🎫',en:['E-queue','Office → service → time slot → ticket number, live “people ahead” countdown and push when it is your turn.'],ru:['Электронная очередь','Учреждение → услуга → время → талон, живой счётчик «перед вами» и push, когда подошла очередь.']},
 {go:'doctor',ic:'🩺',en:['Doctor booking','Clinic, specialty, doctor and a free slot in four taps; reminders and one-tap cancel.'],ru:['Запись к врачу','Поликлиника, специальность, врач и свободное время за четыре нажатия; напоминания и отмена.']},
 {go:'transport',ic:'🚌',en:['Transport','Trip planner between stops, live GPS departures ticking down, transit-card top-up and tap-in.'],ru:['Транспорт','Маршрут между остановками, живые отправления по GPS, пополнение и оплата проездного.']},
 {go:'wallet',ic:'👛',en:['Wallet','Bills, fines and taxes in one list, biometric confirmation, receipts and history.'],ru:['Кошелёк','Счета, штрафы и налоги одним списком, подтверждение биометрией, чеки и история.']},
 {go:'notes',ic:'🔔',en:['Notifications','Segmented push campaigns from the console on the right; critical alerts bypass quiet hours.'],ru:['Уведомления','Push-рассылки по сегментам из консоли справа; экстренные приходят и в тихие часы.']},
 {go:'offline',ic:'📴',en:['Offline-first','Toggle the cloud icon: cached data stays usable, actions queue in an outbox and sync on reconnect.'],ru:['Офлайн-режим','Нажмите значок облака: данные из кэша работают, действия копятся и уходят при появлении связи.']}
];
function renderFeats(){$('#feats').innerHTML=FEATS.map(f=>'<div class="feat'+(f.go===S.tab||(f.go==='offline'&&!S.online)?' on':'')+'" data-go="'+f.go+'"><span class="fi">'+f.ic+'</span><div><b>'+f[L()][0]+'</b><span>'+f[L()][1]+'</span></div></div>').join('')}
$('#feats').addEventListener('click',e=>{const f=e.target.closest('.feat');if(!f)return;const g=f.dataset.go;if(g==='offline'){setOnline(!S.online)}else{if(g==='home'){ui.flip=false}go(g)}
  if(innerWidth<=860)$('#scr').scrollIntoView({behavior:'smooth',block:'start'})});

/* ---------- console ---------- */
const SEG=[{id:'all',en:'All citizens',ru:'Все жители',n:12.4e6},{id:'reg',en:'Jakarta Selatan residents',ru:'Жители ЦАО',n:1.18e6},{id:'appt',en:'Upcoming doctor visit',ru:'Есть запись к врачу',n:86400},{id:'transit',en:'Transit card holders',ru:'Владельцы проездного',n:3.2e6},{id:'test',en:'Test devices only',ru:'Только тестовые устройства',n:12}];
const TPL=[
 {id:'flood',ic:'🌊',p:2,link:'notes',en:['Flood alert','Flood warning: Ciliwung river','Water at the Katulampa gate is rising. Avoid riverside roads in Kampung Melayu until 22:00.'],ru:['Шторм','Штормовое предупреждение','Ожидается ветер до 25 м/с. Не оставляйте машины под деревьями и держитесь дальше от рекламных щитов до 22:00.']},
 {id:'vax',ic:'💉',p:1,link:'doctor',en:['Vaccination','Free flu vaccination this week','Book a slot at your nearest Puskesmas — it takes two minutes in Warga+.'],ru:['Вакцинация','Бесплатная прививка от гриппа','Запишитесь в ближайшую поликлинику — две минуты в приложении.']},
 {id:'tax',ic:'🧾',p:1,link:'wallet',en:['Tax deadline','Property tax due 30 November','Pay in the Wallet and avoid the 2% monthly late penalty.'],ru:['Налоги','Налог на имущество — до 1 декабря','Оплатите в Кошельке и избегите пеней.']},
 {id:'bus',ic:'🚌',p:1,link:'transport',en:['Transit','Route 6B diverted','Roadworks on Jl. Sudirman: route 6B skips Dukuh Atas until Sunday. Plan your trip in Warga+.'],ru:['Транспорт','Маршрут т17 изменён','Ремонт на Тверской: т17 не заходит на «Театральную» до воскресенья. Постройте маршрут в приложении.']},
 {id:'queue',ic:'🎫',p:1,link:'queue',en:['E-queue','Skip the queue at Samsat','Take an e-ticket before you leave home — average wait today is 12 minutes.'],ru:['Очередь','Без очереди в МФЦ','Возьмите электронный талон заранее — сегодня среднее ожидание 12 минут.']}
];
const LINKS=['home','queue','doctor','transport','wallet','notes'];
function renderConsole(){
  const seg=$('#cSeg').value||'reg',lk=$('#cLink').value||'notes',pr=$('#cPri').value||'1',wh=$('#cWhen').value||'now';
  $('#cSeg').innerHTML=SEG.map(s=>'<option value="'+s.id+'">'+T(s.en,s.ru)+' · '+compact(s.n)+'</option>').join('');$('#cSeg').value=seg;
  $('#cLink').innerHTML=LINKS.map(l=>'<option value="'+l+'">'+TITLE[l]().replace('Warga+',T('Home','Главная'))+'</option>').join('');$('#cLink').value=lk;
  $('#cPri').innerHTML='<option value="0">'+T('Low · silent','Низкий · без звука')+'</option><option value="1">'+T('Normal','Обычный')+'</option><option value="2">'+T('Critical alert','Экстренное оповещение')+'</option>';$('#cPri').value=pr;
  $('#cWhen').innerHTML='<option value="now">'+T('Send now','Сразу')+'</option><option value="local">'+T('Now, respect quiet hours','Сразу, с учётом тихих часов')+'</option>';$('#cWhen').value=wh;
  $('#tpl').innerHTML=TPL.map(t=>'<button class="chip'+(ui.tpl===t.id?' on':'')+'" data-t="'+t.id+'">'+t.ic+' '+t[L()][0]+'</button>').join('');
  $('#cSend').textContent='📣 '+T('Send push campaign','Отправить рассылку');
  $('#netLbl').textContent=S.online?T('Online','В сети'):T('Offline','Офлайн');$('#netSw').checked=S.online;
  renderReach();renderCamps();renderKpis();renderLog();
}
function renderReach(){const s=SEG.find(x=>x.id===$('#cSeg').value)||SEG[0];const pr=+$('#cPri').value;
  $('#cReach').innerHTML='<span>👥 <b>'+compact(s.n)+'</b> '+T('devices','устройств')+'</span><span>FCM · APNs · HMS</span><span>'+T('≈ ','≈ ')+'<b>'+Math.max(2,Math.round(s.n/400000))+T(' s',' с')+'</b> '+T('to deliver','на доставку')+'</span>'+(pr===2?'<span class="pill bad" style="font-size:11px">'+T('bypasses quiet hours','игнорирует тихие часы')+'</span>':'')+'<span>+ '+T('this test phone','этот тестовый телефон')+'</span>';
  const n=$('#cBody').value.length;$('#cCnt').textContent=n+'/180'}
function renderCamps(){
  $('#cHist').innerHTML=S.camps.slice().reverse().map(c=>{const sg=SEG.find(s=>s.id===c.seg)||SEG[0];const p=c.prog==null?1:c.prog;const e=1-Math.pow(1-p,2);
    const dv=c.dr*e,op=c.or*e*e;
    return '<tr><td class="mono" style="font-size:11.5px">'+c.ic+' '+c.id+'</td><td class="tt" title="'+esc(c.t)+'">'+esc(PT.lang==='ru'&&c.tr?c.tr:c.t)+'</td><td class="muted">'+compact(c.n)+'</td><td class="num"><span class="bar"><i style="width:'+dv*100+'%"></i></span>'+(dv*100).toFixed(1)+'%</td><td class="num"><span class="bar g"><i style="width:'+op*100+'%"></i></span>'+(op*100).toFixed(1)+'%</td></tr>'}).join('')}
function renderKpis(){const today=dayStart(Date.now());
  $('#kDev').textContent=compact(ui.dev);
  $('#kCamp').textContent=S.camps.filter(c=>c.ts>=today).length;
  const fin=S.camps.filter(c=>c.prog==null||c.prog>=1);$('#kOpen').textContent=(fin.length?fin.reduce((s,c)=>s+c.or,0)/fin.length*100:0).toFixed(1)+'%';
  $('#kSync').textContent=compact(41200+S.syncs*3+Math.floor((Date.now()/1000)%600));
  $('#tokT').textContent=ui.tok>0?Math.floor(ui.tok/60)+':'+pad(ui.tok%60):T('expired','истёк');
  $('#obN').textContent=S.outbox.length;$('#cacheT').textContent=S.online?T('live','актуален'):hhmm(S.cachedAt)}
$('#tpl').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;const t=TPL.find(x=>x.id===b.dataset.t);ui.tpl=t.id;
  $('#cTitle').value=t[L()][1];$('#cBody').value=t[L()][2];$('#cLink').value=t.link;$('#cPri').value=t.p;if(t.id==='flood')$('#cSeg').value='reg';if(t.id==='vax')$('#cSeg').value='all';if(t.id==='bus')$('#cSeg').value='transit';if(t.id==='tax')$('#cSeg').value='all';if(t.id==='queue')$('#cSeg').value='reg';
  $$('#tpl .chip').forEach(c=>c.classList.toggle('on',c===b));renderReach()});
['cSeg','cPri','cBody'].forEach(id=>$('#'+id).addEventListener('input',renderReach));
$('#cSend').onclick=()=>{const t=$('#cTitle').value.trim(),b=$('#cBody').value.trim();
  if(!t)return toast(T('Add a title first','Сначала заполните заголовок'),'bad');if(!b)return toast(T('Write the message text','Напишите текст сообщения'),'bad');
  const sg=SEG.find(s=>s.id===$('#cSeg').value)||SEG[0],p=+$('#cPri').value,tp=TPL.find(x=>x.id===ui.tpl);
  const c={id:'C-'+(S.seq++),ic:tp?tp.ic:'📣',t,tr:t,b,seg:sg.id,n:sg.n,link:$('#cLink').value,p,dr:.95+Math.random()*.035,or:p===2?.55+Math.random()*.12:.24+Math.random()*.16,ts:Date.now(),prog:0};
  S.camps.push(c);save();renderCamps();renderKpis();
  log('PUSH','go',c.id+' queued for '+compact(c.n)+' devices ('+(p===2?'critical':'normal')+')',c.id+' поставлен в отправку на '+compact(c.n)+' устройств ('+(p===2?'экстренно':'обычно')+')');
  toast('📣 '+T('Campaign '+c.id+' is going out','Рассылка '+c.id+' отправляется'),'gold');
  setTimeout(()=>{if(S.online)deliverPush(c);else{ui.pushQ.push(c);log('PUSH','wa',c.id+': test device offline — FCM holds the message (TTL 24 h)',c.id+': тестовое устройство офлайн — FCM хранит сообщение (TTL 24 ч)')}},1400);
  if(innerWidth<=860)$('#scr').scrollIntoView({behavior:'smooth',block:'start'});
  $('#cTitle').value='';$('#cBody').value='';ui.tpl=null;$$('#tpl .chip').forEach(x=>x.classList.remove('on'));renderReach()};
$('#netSw').addEventListener('change',e=>setOnline(e.target.checked));
$('#tokBtn').onclick=async()=>{ui.tok=0;renderKpis();log('OIDC','er','Access & refresh tokens revoked by admin','Access и refresh-токены отозваны администратором');
  if(!S.online)return toast(T('Re-login will happen when the phone is online; the ID card keeps working offline','Повторный вход — при появлении связи; удостоверение работает офлайн'),'warn');
  await sleep(700);log('OIDC','in','Authorization code + PKCE → national IdP','Код авторизации + PKCE → госпровайдер входа');await sleep(800);log('OIDC','ok','Biometric unlock ✓ · new tokens issued (300 s)','Биометрия ✓ · выданы новые токены (300 с)');ui.tok=300;renderKpis();toast(T('Session restored with biometrics — no password typed','Сессия восстановлена биометрией — без ввода пароля'))};
$('#resetBtn').onclick=()=>{S=fresh();save();ui.q=null;ui.d=null;ui.sheet=null;ui.flip=false;ui.pushQ=[];ui.tr.res=null;newToken();renderAll();toast(T('Demo data reset','Данные демо сброшены'))};

/* ---------- live loop ---------- */
function tick(){
  const now=new Date();$('#clock').textContent=now.getHours()+':'+pad(now.getMinutes());
  // QR rotation
  ui.qrT--;if(ui.qrT<=0){newToken();const cv=$('#idqr');if(cv)drawQR(cv,ui.token);const c=$('#qrC');if(c)c.textContent=fmtCode(ui.code);if(ui.flip&&S.tab==='home')log('ID','in','QR token rotated · code '+fmtCode(ui.code),'QR-токен обновлён · код '+fmtCode(ui.code))}
  const qt=$('#qrT');if(qt){qt.textContent=ui.qrT;const rg=$('#qrRing');if(rg)rg.setAttribute('stroke-dashoffset',100-ui.qrT/30*100)}
  // queue
  let big=false;
  if(S.online)S.tickets.forEach(t=>{if(t.st==='live'&&t.ahead>0&&Math.random()<.2){t.ahead--;save();
    $$('.ah-'+t.id).forEach(e=>e.textContent=t.ahead);$$('.wt-'+t.id).forEach(e=>e.textContent=t.ahead*SVC[t.svc].m);$$('.pg-'+t.id).forEach(e=>e.style.width=Math.round((1-t.ahead/t.ahead0)*100)+'%');
    if(t.ahead===1)notify({ic:'⏱',ten:'You are next',tru:'Вы следующий',ben:'Ticket '+t.num+': one person ahead. Please head to the waiting area.',bru:'Талон '+t.num+': перед вами один человек. Подойдите к залу ожидания.',link:'queue'});
    if(t.ahead===0){t.st='called';t.win=1+hash(t.id)%8;save();big=true;notify({ic:'🔔',crit:true,ten:'Your turn! Window '+t.win,tru:'Ваша очередь! Окно '+t.win,ben:'Ticket '+t.num+' — '+SVC[t.svc].en+'. Please proceed now.',bru:'Талон '+t.num+' — '+SVC[t.svc].ru+'. Пройдите сейчас.',link:'queue'});log('WS','go','queue.called '+t.num+' → window '+t.win,'queue.called '+t.num+' → окно '+t.win)}}});
  if(big&&(S.tab==='queue'||S.tab==='home'))renderPhone();
  // ETAs
  ui.arr.forEach((a,i)=>{if(S.online){a.eta--;if(a.eta<-15){a.eta=280+Math.floor(Math.random()*620);a.cr=Math.floor(Math.random()*3);a.dest=(a.dest+3)%10===NEAR?(a.dest+4)%10:(a.dest+3)%10}}
    const e=$('#eta'+i);if(e&&S.online){e.textContent=etaTxt(Math.max(0,a.eta));e.classList.toggle('now',a.eta<=20)}});
  const e0=$('.eta0');if(e0&&S.online)e0.textContent=etaTxt(Math.max(0,ui.arr[0].eta));
  if(S.online&&ui.arr.some(a=>a.eta===-15)&&S.tab==='transport')renderPhone();
  // OIDC token
  if(ui.tok>0){ui.tok--;if(ui.tok===0&&S.online){ui.tok=300;log('OIDC','in','Silent refresh → new access token (300 s)','Тихое обновление → новый access-токен (300 с)')}}
  // campaigns
  let anim=false;S.camps.forEach(c=>{if(c.prog!=null&&c.prog<1){c.prog=Math.min(1,c.prog+.07);anim=true;if(c.prog>=1){save();log('PUSH','ok',c.id+' done: delivered '+(c.dr*100).toFixed(1)+'%, opened '+(c.or*100).toFixed(1)+'%',c.id+' завершена: доставлено '+(c.dr*100).toFixed(1)+'%, открыто '+(c.or*100).toFixed(1)+'%')}}});
  if(anim)renderCamps();
  ui.dev=Math.max(3.5e6,ui.dev+(Math.random()-.48)*9000);
  renderKpis();
  if(S.online&&now.getSeconds()===0)S.cachedAt=Date.now();
}
setInterval(tick,1000);

function renderAll(){renderFeats();renderConsole();renderPhone()}
newToken();
log('BOOT','in','Warga+ 3.8.2 · Flutter 3.29 · encrypted cache opened','Warga+ 3.8.2 · Flutter 3.29 · зашифрованный кэш открыт');
log('OIDC','ok','Signed in with national ID (OIDC + PKCE) · token 300 s','Вход через госID (OIDC + PKCE) · токен 300 с');
PT.onLang(renderAll);
renderAll();
if(S.online&&S.outbox.length)sync();
})();
</script>
