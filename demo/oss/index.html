<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Satu Pintu OSS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:3px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:conic-gradient(from 140deg,var(--gold),var(--mal),var(--gold));color:#10261d;font-size:16px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.side .grow{flex:1}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:23px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;margin-bottom:16px}
.howto{display:flex;gap:10px;flex-wrap:wrap;padding-right:30px !important;align-items:stretch;background:linear-gradient(135deg,color-mix(in srgb,var(--mal) 14%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--mal) 35%,var(--line));border-radius:var(--r);padding:14px;position:relative}
.howto .st{flex:1;min-width:150px;display:flex;gap:10px;font-size:13px;align-items:flex-start}
.howto .st>b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#1a1306;display:grid;place-items:center;font-size:12px}
.howto .x{position:absolute;top:6px;right:8px;border:0;background:none;cursor:pointer;color:var(--dim);font-size:16px}
.facts{font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;padding:12px 14px}
.facts dt{color:var(--dim);font-weight:600}.facts dd{margin:0;font-weight:600}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.wiz{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.wiz .w{flex:1;min-width:112px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--muted);background:var(--panel);cursor:default}
.wiz .w b{display:block;font-size:11px;color:var(--dim)}
.wiz .w.cur{border-color:var(--gold);color:var(--text);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 15%,transparent)}
.wiz .w.ok{border-color:color-mix(in srgb,var(--mal) 50%,var(--line));color:var(--text);cursor:pointer}
.wiz .w.ok b{color:var(--mal3)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f .err{color:var(--red);font-size:12px;margin-top:4px}
.f.bad .input{border-color:var(--red)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
.klist{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:10px}
.krow{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px}
.krow:hover{background:color-mix(in srgb,var(--mal) 6%,transparent)}
.krow.sel{background:color-mix(in srgb,var(--gold) 10%,transparent)}
.krow .c{font-family:var(--mono);font-size:12px;color:var(--gold2);flex:none;width:46px}
.krow .n{flex:1;min-width:0}
.krow .n small{display:block;color:var(--dim);font-size:11.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line2);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;background:none;font-weight:600;color:var(--muted)}
.chip.on{border-color:var(--mal);color:var(--text);background:color-mix(in srgb,var(--mal) 14%,transparent)}
.risk{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.risk.L{background:color-mix(in srgb,var(--mal) 18%,transparent);color:var(--mal3)}
.risk.MH{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.risk.H{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.engine{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.engine .lv{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;opacity:.45;transition:.3s}
.engine .lv.on{opacity:1;border-color:var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--panel));box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 12%,transparent)}
.engine .lv h4{margin:0 0 6px;font-size:14px}
.engine ul{margin:0;padding-left:18px;color:var(--muted)}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:16px;text-align:center;transition:.15s;font-size:13px;color:var(--muted)}
.drop.over{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 8%,transparent)}
.doc{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--panel)}
.doc .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.doc .top b{flex:1;min-width:150px}
.checks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ck{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.ck.ok{color:var(--mal3);border-color:color-mix(in srgb,var(--mal) 50%,transparent)}
.ck.bad{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,transparent)}
.ck.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,transparent)}
.ck.run{animation:bl 0.8s infinite}
@keyframes bl{50%{opacity:.4}}
.otp{display:flex;gap:8px;margin-top:10px}
.otp input{width:44px;height:52px;text-align:center;font-size:22px;font-family:var(--mono);padding:0}
.cert{background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 12%,var(--panel)),var(--panel) 60%);border:1px solid color-mix(in srgb,var(--gold) 50%,var(--line));border-radius:var(--r2);padding:22px;position:relative;overflow:hidden}
.cert:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:24px solid color-mix(in srgb,var(--gold) 10%,transparent)}
.cert .row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.cert canvas{background:#fff;border-radius:10px;padding:6px;width:132px;height:132px;flex:none}
.cert .nib{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--gold2);letter-spacing:.06em;word-break:break-all}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin-top:10px}
.kv span{color:var(--dim)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td{background:color-mix(in srgb,var(--mal) 6%,transparent)}
tr.sel td{background:color-mix(in srgb,var(--gold) 9%,transparent)}
.app-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel);margin-bottom:12px}
.app-card .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.app-card .top b{font-size:15px}
.sla{font-family:var(--mono);font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2)}
.sla.late{color:var(--red);border-color:var(--red)}
.sla.near{color:var(--amber);border-color:var(--amber)}
.steps{display:flex;margin:14px 0 4px}
.step{flex:1;text-align:center;position:relative;font-size:11.5px;color:var(--muted);min-width:0}
.step:before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line2)}
.step:first-child:before{display:none}
.step .dot{width:28px;height:28px;border-radius:50%;margin:0 auto 5px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line2);position:relative;z-index:1;font-weight:800;font-size:12px}
.step.ok .dot{background:var(--mal);border-color:var(--mal);color:#fff}
.step.ok:before,.step.cur:before{background:var(--mal)}
.step.cur .dot{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 18%,transparent)}
.step.bad .dot{background:var(--red);border-color:var(--red);color:#fff}
.note{border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);background:color-mix(in srgb,var(--amber) 8%,transparent);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.inbox .msg{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.inbox .msg:hover{background:color-mix(in srgb,var(--mal) 5%,transparent)}
.inbox .msg .d{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:transparent}
.inbox .msg.unread .d{background:var(--gold)}
.inbox .msg.unread b{color:var(--text)}
.inbox .msg .t{font-size:11.5px;color:var(--dim);font-family:var(--mono);margin-left:auto;flex:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--mal3)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.hbar .tr{height:14px;border-radius:6px;background:var(--bg2);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--mal2),var(--mal3));transition:width .5s}
.hbar .num{text-align:right;font-family:var(--mono);font-size:12px}
svg text{font-family:var(--font)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.on{display:flex}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r2);padding:22px;box-shadow:var(--shadow);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.modal h2{margin:0 0 14px;font-size:19px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:pop .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--gold);border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px}
@keyframes rot{to{transform:rotate(360deg)}}
#printArea{display:none}
.paper-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2500;display:none;overflow:auto;padding:20px 12px}
.paper-bg.on{display:block}
.paper{background:#fff;color:#14231d;width:min(794px,100%);margin:0 auto;padding:44px 48px;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.4);font-family:var(--font)}
.paper h1{font-size:22px;margin:0;color:#0b5c44}.paper .mut{color:#5b6d65;font-size:12px}
.paper .bar{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px double #b08a35;padding-bottom:14px;margin-bottom:18px;gap:14px}
.paper table td,.paper table th{color:#14231d;border-color:#d5ddd8;background:none;white-space:normal}
.paper .nibp{font-family:var(--mono);font-size:26px;letter-spacing:.08em;color:#0b5c44;font-weight:700}
.paper .sig{margin-top:26px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:11px;color:#5b6d65}
.paper-tools{display:flex;gap:8px;justify-content:center;margin:0 auto 12px;width:min(794px,100%)}
@media print{
  body>*{display:none!important}
  #printArea{display:block!important}
  .paper{box-shadow:none;width:100%;padding:0}
}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.split,.intro{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 16px 50px}
  .head h1{font-size:19px}
}
@media (max-width:560px){.fgrid,.engine{grid-template-columns:1fr}.kpi .v{font-size:20px}.hbar{grid-template-columns:84px minmax(0,1fr) 40px}.paper{padding:22px 18px}.otp input{width:38px;height:46px}.cert canvas{width:110px;height:110px}.cert .nib{font-size:19px}}
</style>
</head>
<body data-demo-en="Satu Pintu — one-stop business licensing (OSS)" data-demo-ru="Satu Pintu — «одно окно» для лицензирования бизнеса">
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><b>SP</b><div>Satu Pintu<small data-en="Investment Coordination Agency · Nordania" data-ru="Агентство инвестиций · Нордания"></small></div></div>
    <div class="sec" data-en="Applicant" data-ru="Заявитель"></div>
    <button class="nav" data-v="apply"><span class="ic">✚</span><span data-en="New licence" data-ru="Новая лицензия"></span></button>
    <button class="nav" data-v="track"><span class="ic">⏱</span><span data-en="My applications" data-ru="Мои заявки"></span><span class="cnt" id="cMine"></span></button>
    <button class="nav" data-v="inbox"><span class="ic">✉</span><span data-en="Notifications" data-ru="Уведомления"></span><span class="cnt" id="cInbox"></span></button>
    <div class="sec" data-en="Back office" data-ru="Бэк-офис"></div>
    <button class="nav" data-v="queue"><span class="ic">☰</span><span data-en="Officer queue" data-ru="Очередь сотрудника"></span><span class="cnt" id="cQueue"></span></button>
    <button class="nav" data-v="dash"><span class="ic">▤</span><span data-en="Dashboard" data-ru="Аналитика"></span></button>
    <div class="grow"></div>
    <div class="card" style="padding:12px;font-size:12px"><div class="muted" data-en="Applicant: Lumen Harbour Ltd · Officer: Ingrid Solberg" data-ru="Заявитель: ООО «Люмен Харбор» · Сотрудник: Ингрид Сольберг"></div></div>
    <button class="btn sm" id="reset" style="margin-top:8px;justify-content:center" data-en="Reset demo data" data-ru="Сбросить данные"></button>
  </aside>
  <main>
    <div class="intro" id="intro">
      <div class="howto"><button class="x" id="hideIntro" title="×">×</button>
        <div class="st"><b>1</b><span data-en="Fill in the company (prefilled), then search the classifier — try <i>«solar»</i> for a high-risk path or <i>«café»</i> for an instant licence." data-ru="Заполните компанию (уже заполнено), найдите вид деятельности — <i>«солнечная»</i> для высокого риска или <i>«кафе»</i> для мгновенной лицензии."></span></div>
        <div class="st"><b>2</b><span data-en="Use “sample file” to upload documents, then sign with the OTP shown in the toast." data-ru="Нажмите «образец файла» для загрузки документов, затем подпишите кодом из всплывающего SMS."></span></div>
        <div class="st"><b>3</b><span data-en="Open <b>Officer queue</b> to verify, request a correction or approve — watch the tracker and inbox update." data-ru="Откройте <b>Очередь сотрудника</b>: проверьте, запросите исправление или одобрите — трекер и уведомления обновятся."></span></div>
      </div>
      <dl class="card facts">
        <dt data-en="Tender" data-ru="Тендер"></dt><dd data-en="Business licensing portal" data-ru="Портал лицензирования бизнеса"></dd>
        <dt data-en="Year" data-ru="Год"></dt><dd>2025</dd>
        <dt data-en="Budget" data-ru="Бюджет"></dt><dd class="mono" style="color:var(--gold2)" data-en="Rp 38 bn" data-ru="Rp 38 млрд"></dd>
        <dt data-en="Client" data-ru="Заказчик"></dt><dd data-en="Investment Coordination Agency, Republic of Nordania (fictional)" data-ru="Агентство по координации инвестиций Республики Нордания (вымышл.)"></dd>
        <dt data-en="Stack" data-ru="Стек"></dt><dd class="mono" style="font-size:12px">React · Go · Postgres · e-sign</dd>
      </dl>
    </div>
    <div class="head">
      <button class="btn sm menu-btn" id="menuBtn">☰</button>
      <div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <div class="sp"></div>
      <span class="pill ok" id="slaPill">● <span data-en="All systems operational" data-ru="Все системы работают"></span></span>
    </div>

    <section class="view" id="v-apply"><div class="wiz" id="wiz"></div><div id="wbody"></div></section>
    <section class="view" id="v-track"><div id="track"></div></section>
    <section class="view" id="v-inbox"><div class="card" style="padding:0"><div style="display:flex;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center;gap:8px"><b data-en="Inbox" data-ru="Входящие"></b><span class="sp" style="flex:1"></span><button class="btn sm" id="readAll" data-en="Mark all read" data-ru="Прочитать все"></button></div><div class="inbox" id="inbox"></div></div></section>
    <section class="view" id="v-queue">
      <div class="chips" id="qf" style="margin:0 0 12px"></div>
      <div class="split"><div class="tw"><table id="qt"></table></div><div class="card" id="qd"></div></div>
    </section>
    <section class="view" id="v-dash">
      <div class="kpis" id="kpis"></div>
      <div class="grid2">
        <div class="card"><h3><span data-en="Average processing time, days" data-ru="Среднее время обработки, дней"></span><span class="sp"></span><span class="pill gold" data-en="SLA target 5 d" data-ru="Цель SLA 5 дн"></span></h3><div id="lineChart"></div></div>
        <div class="card"><h3 data-en="Applications by risk level" data-ru="Заявки по уровню риска"></h3><div id="donut"></div></div>
        <div class="card"><h3 data-en="By sector" data-ru="По отраслям"></h3><div id="bySector"></div></div>
        <div class="card"><h3 data-en="By region" data-ru="По регионам"></h3><div id="byRegion"></div></div>
      </div>
    </section>
  </main>
</div>
<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>

function nib(seed){const r=rng(hash(seed));let s='9120';for(let i=0;i<9;i++)s+=Math.floor(r()*10);return s}

  ];
  apps.forEach(a=>{a.nib=nib(a.id);a.due=a.created+(SLA[a.risk]||1)*DAY;a.log=[{t:a.created,en:'Application submitted',ru:'Заявка подана'}];if(a.status==='issued')a.log.push({t:a.issued,en:'Business ID issued automatically',ru:'NIB выдан автоматически'})});

function slaTxt(a){if(a.status==='issued'||a.status==='rejected')return '';const ms=a.due-Date.now(),late=ms<0,m=Math.abs(ms);const d=Math.floor(m/DAY),h=Math.floor(m%DAY/HOUR),mi=Math.floor(m%HOUR/6e4),s=Math.floor(m%6e4/1e3);const v=(d?d+T('d ','д '):'')+String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')+':'+String(s).padStart(2,'0');return (late?T('Overdue ','Просрочено '):T('SLA ','SLA '))+v}

function wCompany(){
  const c=D().company,e=errs;
  const fld=(k,lab,inp,full)=>`<div class="f ${full?'full':''} ${e[k]?'bad':''}"><label>${lab}</label>${inp}${e[k]?`<div class="err">${e[k]}</div>`:''}</div>`;
  $('#wbody').innerHTML=`<div class="card"><h3>${T('Company registration','Регистрация компании')}</h3><div class="fgrid">
  ${fld('name',T('Legal name','Наименование'),`<input class="input" data-c="name" value="${esc(c.name)}">`,true)}

  ${fld('emp',T('Employees','Сотрудников'),`<input class="input" data-c="emp" inputmode="numeric" value="${esc(c.emp)}">`)}
  ${fld('email',T('Contact e-mail','Контактный e-mail'),`<input class="input" data-c="email" value="${esc(c.email)}">`)}
  </div><div class="acts"><button class="btn pri" id="next">${T('Continue','Далее')} →</button></div></div>`;
  $$('[data-c]').forEach(i=>i.oninput=i.onchange=()=>{c[i.dataset.c]=i.value;save()});

function wActivity(){
  const d=D();

   <input class="input" id="kq" value="${esc(d.q)}" placeholder="${T('Search by code or name — e.g. 56303, solar, bakery','Поиск по коду или названию — напр. 56303, солнечная, хлеб')}">

}

   <div class="acts" style="justify-content:flex-start;margin-top:10px"><button class="btn sm" data-cert="${a.id}">▣ ${T('Certificate','Сертификат')}</button><button class="btn sm" data-print="${a.id}">⎙ PDF</button></div></div>`).join(''):`<div class="empty card">${T('No applications yet','Заявок пока нет')}</div>`;
  bindPrint();
  $$('[data-cert]').forEach(b=>b.onclick=()=>{const a=S.apps.find(x=>x.id===b.dataset.cert);modal(certHtml(a)+`<div class="acts"><button class="btn" onclick="document.getElementById('mbg').classList.remove('on')">${T('Close','Закрыть')}</button></div>`);drawQR($('#qr-'+a.id),a)});
  $$('[data-fix]').forEach(b=>b.onclick=()=>{const a=S.apps.find(x=>x.id===b.dataset.fix);b.disabled=true;b.innerHTML='<span class="spin"></span> '+T('Uploading…','Загрузка…');setTimeout(()=>{a.status='review';a.docs.forEach(d=>{if(d.ver===false){d.ver=null;d.name=d.k+'_v2_signed.pdf'}});a.log.push({t:Date.now(),en:'Corrected documents resubmitted',ru:'Исправленные документы отправлены'});a.due=Math.max(a.due,Date.now()+DAY*2);a.note='';notify(`Corrections for ${a.id} received and returned to verification.`,`Исправления по ${a.id} получены, заявка снова на проверке.`,a.id);save();rTrack();toast(T('Resubmitted to officer','Отправлено сотруднику'))},900)});
}
function rInbox(){
  $('#inbox').innerHTML=S.notes.map(n=>`<div class="msg ${n.read?'':'unread'}" data-n="${n.id}"><span class="d"></span><div><b style="font-size:13.5px;font-weight:600">${esc(L(n))}</b><div class="muted mono" style="font-size:11.5px">${n.app||''}</div></div><span class="t">${fmtT(n.t)}</span></div>`).join('')||`<div class="empty">${T('No notifications','Нет уведомлений')}</div>`;
  $$('[data-n]').forEach(m=>m.onclick=()=>{const n=S.notes.find(x=>x.id==m.dataset.n);n.read=true;save();go('track')});
}
$('#readAll').onclick=()=>{S.notes.forEach(n=>n.read=true);save();rInbox();counts()};

// ---------- back office ----------
let qFilter='open',qSel=null;
function rQueue(){
  const F={open:{en:'Open',ru:'Открытые',f:a=>['review','inspection','decision','correction'].includes(a.status)},review:{en:'Verification',ru:'Проверка',f:a=>a.status==='review'},inspection:{en:'Inspection',ru:'Инспекция',f:a=>a.status==='inspection'},decision:{en:'Decision',ru:'Решение',f:a=>a.status==='decision'},correction:{en:'With applicant',ru:'У заявителя',f:a=>a.status==='correction'},closed:{en:'Closed',ru:'Закрытые',f:a=>['issued','rejected'].includes(a.status)}};
  $('#qf').innerHTML=Object.keys(F).map(k=>`<button class="chip ${qFilter===k?'on':''}" data-qf="${k}">${L(F[k])} · ${S.apps.filter(F[k].f).length}</button>`).join('');
  $$('[data-qf]').forEach(b=>b.onclick=()=>{qFilter=b.dataset.qf;rQueue()});
  const list=S.apps.filter(F[qFilter].f).sort((a,b)=>a.due-b.due);
  if(!qSel||!S.apps.find(a=>a.id===qSel))qSel=(list[0]||{}).id;
  $('#qt').innerHTML=`<tr><th>ID</th><th>${T('Company','Компания')}</th><th>${T('Risk','Риск')}</th><th>${T('Status','Статус')}</th><th>SLA</th></tr>`+list.map(a=>`<tr class="clk ${a.id===qSel?'sel':''}" data-q="${a.id}"><td class="mono">${a.id}</td><td>${esc(a.company)}<div class="muted" style="font-size:11.5px">${reg(a.region)} · ${L(SECT[KB[a.acts[0]].sec])}</div></td><td>${riskTag(a.risk)}</td><td>${stat(a.status)}</td><td>${slaEl(a)}</td></tr>`).join('')+(list.length?'':`<tr><td colspan="5" class="empty">${T('Queue is empty','Очередь пуста')}</td></tr>`);
  $$('[data-q]').forEach(r=>r.onclick=()=>{qSel=r.dataset.q;rQueue();if(innerWidth<1100)$('#qd').scrollIntoView({behavior:'smooth'})});
  qDetail();
}
function qDetail(){
  const a=S.apps.find(x=>x.id===qSel);if(!a){$('#qd').innerHTML=`<div class="empty">${T('Select an application','Выберите заявку')}</div>`;return}
  const allVer=a.docs.every(d=>d.ver===true),anyBad=a.docs.some(d=>d.ver===false),open=['review','inspection','decision'].includes(a.status);
  $('#qd').innerHTML=`<h3>${esc(a.company)}<span class="sp"></span>${stat(a.status)}</h3>
  <div class="kv"><span>ID</span><span class="mono" style="color:var(--text)">${a.id}</span><span>NIB</span><span class="mono" style="color:var(--text)">${a.nib}</span><span>${T('Activities','Виды')}</span><span style="color:var(--text)">${a.acts.map(c=>c+' '+L(KB[c])).join('<br>')}</span><span>${T('Risk','Риск')}</span><span>${riskTag(a.risk)}</span><span>SLA</span><span>${slaEl(a)||'—'}</span></div>
  ${steps(a)}
  <div style="font-weight:700;font-size:13px;margin:12px 0 6px">${T('Documents','Документы')} (${a.docs.filter(d=>d.ver).length}/${a.docs.length} ${T('verified','проверено')})</div>
  ${a.docs.map((d,i)=>`<div class="doc" style="padding:9px 10px;margin-bottom:6px"><div class="top"><b style="font-size:13px">${L(DOCS[d.k])}<div class="mono muted" style="font-size:11px;font-weight:400">${esc(d.name)} · ${d.size}</div></b>${d.ver===true?'<span class="ck ok">✓ '+T('verified','проверен')+'</span>':d.ver===false?'<span class="ck bad">✗ '+T('flagged','замечание')+'</span>':''}${a.status==='review'?`<button class="btn sm" data-ver="${i}" title="OK">✓</button><button class="btn sm danger" data-flag="${i}" title="Flag">✗</button>`:''}</div></div>`).join('')}
  ${a.status==='inspection'?`<div class="note">${T('On-site inspection scheduled','Выездная проверка назначена')}: <b>${fmtT(a.insp)}</b> · ${T('Inspector','Инспектор')}: Erik Dahl</div>`:''}
  ${a.note&&a.status==='correction'?`<div class="note">${T('Waiting for applicant:','Ожидаем заявителя:')} ${esc(a.note)}</div>`:''}
  <div class="acts" style="justify-content:flex-start">
   ${a.status==='review'?`<button class="btn sm gold" id="corr" ${anyBad?'':'disabled'}>↩ ${T('Request correction','Запросить исправление')}</button>`:''}
   ${a.status==='review'&&a.risk==='H'?`<button class="btn sm pri" id="insp" ${allVer?'':'disabled'}>📅 ${T('Schedule inspection','Назначить проверку')}</button>`:''}
   ${a.status==='review'&&a.risk!=='H'?`<button class="btn sm pri" id="appr" ${allVer?'':'disabled'}>✓ ${T('Approve','Одобрить')}</button>`:''}
   ${a.status==='inspection'?`<button class="btn sm pri" id="inspDone">✓ ${T('Record inspection: passed','Записать: проверка пройдена')}</button>`:''}
   ${a.status==='decision'?`<button class="btn sm pri" id="appr">✓ ${T('Approve & issue permit','Одобрить и выдать разрешение')}</button>`:''}
   ${open?`<button class="btn sm danger" id="rej">✗ ${T('Reject','Отказать')}</button>`:''}
  </div>${a.status==='review'&&!allVer?`<div class="muted" style="font-size:12px;margin-top:6px">${T('Verify each document (✓) or flag it (✗) to request a correction.','Проверьте каждый документ (✓) или отметьте замечание (✗), чтобы запросить исправление.')}</div>`:''}`;
  const upd=(en,ru,nen,nru)=>{a.log.push({t:Date.now(),en,ru});if(nen)notify(nen,nru,a.id);save();rQueue();counts()};
  $$('[data-ver]').forEach(b=>b.onclick=()=>{a.docs[+b.dataset.ver].ver=true;save();qDetail()});
  $$('[data-flag]').forEach(b=>b.onclick=()=>{a.docs[+b.dataset.flag].ver=false;save();qDetail()});
  if($('#corr'))$('#corr').onclick=()=>{const bad=a.docs.filter(d=>d.ver===false).map(d=>L(DOCS[d.k])).join(', ');modal(`<h2>${T('Request correction','Запрос исправления')}</h2><div class="f"><label>${T('Message to applicant','Сообщение заявителю')}</label><textarea class="input" id="cm" rows="4">${T('Please re-upload: ','Перезагрузите, пожалуйста: ')}${bad}. ${T('The signature is not readable.','Подпись не читается.')}</textarea></div><div class="acts" style="margin-top:14px"><button class="btn" id="mc">${T('Cancel','Отмена')}</button><button class="btn gold" id="ms">${T('Send to applicant','Отправить заявителю')}</button></div>`);$('#mc').onclick=closeModal;$('#ms').onclick=()=>{a.status='correction';a.note=$('#cm').value;closeModal();upd('Correction requested by officer','Сотрудник запросил исправление',`Correction requested for ${a.id}: ${a.note}`,`Нужно исправление по ${a.id}: ${a.note}`);toast(T('Applicant notified','Заявитель уведомлён'))}};
  if($('#insp'))$('#insp').onclick=()=>{a.status='inspection';a.insp=Date.now()+DAY*2+HOUR*3;upd('Inspection scheduled','Назначена выездная проверка',`On-site inspection for ${a.id} scheduled on ${fmtT(a.insp)}.`,`Выездная проверка по ${a.id} назначена на ${fmtT(a.insp)}.`);toast(T('Inspection scheduled','Проверка назначена'))};
  if($('#inspDone'))$('#inspDone').onclick=()=>{a.status='decision';upd('Inspection passed — 12/12 checklist items','Проверка пройдена — 12/12 пунктов');toast(T('Inspection report saved','Акт проверки сохранён'))};
  if($('#appr'))$('#appr').onclick=()=>{a.status='issued';a.issued=Date.now();a.permit='OP-'+a.nib.slice(-5)+'/'+new Date().getFullYear();upd('Approved; permit issued','Одобрено; разрешение выдано',`Approved: ${a.id} — operational permit ${a.permit} issued. Download your certificate.`,`Одобрено: ${a.id} — выдано разрешение ${a.permit}. Скачайте сертификат.`);toast(T('✓ Permit issued — applicant notified','✓ Разрешение выдано — заявитель уведомлён'))};
  if($('#rej'))$('#rej').onclick=()=>{modal(`<h2>${T('Reject application','Отказать в заявке')}</h2><div class="f"><label>${T('Legal reason','Основание')}</label><select class="input" id="rr"><option>${T('Zoning plan does not permit this activity','План зонирования не допускает деятельность')}</option><option>${T('Environmental assessment insufficient','Недостаточная экологическая оценка')}</option><option>${T('Inspection revealed safety violations','Проверка выявила нарушения безопасности')}</option></select></div><div class="acts" style="margin-top:14px"><button class="btn" id="mc">${T('Cancel','Отмена')}</button><button class="btn danger" id="ms">${T('Reject','Отказать')}</button></div>`);$('#mc').onclick=closeModal;$('#ms').onclick=()=>{a.status='rejected';a.note=$('#rr').value;closeModal();upd('Rejected: '+a.note,'Отказано: '+a.note,`Application ${a.id} rejected: ${a.note}`,`Заявка ${a.id} отклонена: ${a.note}`)}};
}

// ---------- dashboard ----------
function rDash(){
  const r=rng(2025),sec={},regc={};Object.keys(SECT).forEach(s=>sec[s]=Math.round(120+r()*900));REGIONS.forEach(x=>regc[x]=Math.round(300+r()*1600));
  S.apps.forEach(a=>{sec[KB[a.acts[0]].sec]++;regc[a.region]=(regc[a.region]||0)+1});
  const total=Object.values(sec).reduce((x,y)=>x+y,0),inst=Math.round(total*.71),open=S.apps.filter(a=>!['issued','rejected'].includes(a.status)).length;
  $('#kpis').innerHTML=[[T('Licences issued YTD','Выдано с начала года'),total.toLocaleString(PT.lang==='ru'?'ru-RU':'en-US'),'+18% y/y'],[T('Issued instantly','Выдано мгновенно'),Math.round(inst/total*100)+'%',T('low risk, no human touch','низкий риск, без участия человека')],[T('Avg. processing','Среднее время'),'3.2 '+T('d','дн'),T('−61% since launch','−61% с запуска')],[T('Open in queue','В очереди'),open,T('SLA compliance 96.4%','Соблюдение SLA 96,4%')]].map(k=>`<div class="card kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="d">${k[2]}</div></div>`).join('');
  const bars=(o,lab)=>{const mx=Math.max(...Object.values(o));return Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="hbar"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${lab(k)}</span><span class="tr"><i style="width:${v/mx*100}%"></i></span><span class="num">${v}</span></div>`).join('')};
  $('#bySector').innerHTML=bars(sec,k=>L(SECT[k]));$('#byRegion').innerHTML=bars(regc,reg);
  // line chart
  const W=560,H=220,p=[34,14,26,10],months=PT.lang==='ru'?['дек','янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя']:['Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov'];
  const v=[8.2,7.9,7.1,6.6,5.8,5.1,4.9,4.2,3.9,3.6,3.4,3.2],vh=[19,18.5,17,15.2,14,12.6,11.9,11,10.4,9.8,9.1,8.7],mx=20;
  const x=i=>p[0]+i*(W-p[0]-p[3])/11,y=val=>p[1]+(H-p[1]-p[2])*(1-val/mx);
  const mal=cssv('--mal3'),gold=cssv('--gold'),red=cssv('--red'),line=cssv('--line'),dim=cssv('--dim');
  const path=a=>a.map((val,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(val).toFixed(1)).join(' ');
  $('#lineChart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${[0,5,10,15,20].map(g=>`<line x1="${p[0]}" x2="${W-p[3]}" y1="${y(g)}" y2="${y(g)}" stroke="${line}"/><text x="${p[0]-6}" y="${y(g)+4}" font-size="10" fill="${dim}" text-anchor="end">${g}</text>`).join('')}
   <line x1="${p[0]}" x2="${W-p[3]}" y1="${y(5)}" y2="${y(5)}" stroke="${red}" stroke-dasharray="5 4"/>
   <path d="${path(v)} L${x(11)} ${y(0)} L${x(0)} ${y(0)}Z" fill="${mal}" opacity=".12"/><path d="${path(vh)}" fill="none" stroke="${gold}" stroke-width="2"/><path d="${path(v)}" fill="none" stroke="${mal}" stroke-width="2.5"/>
   ${v.map((val,i)=>`<circle cx="${x(i)}" cy="${y(val)}" r="3.5" fill="${mal}"><title>${months[i]}: ${val} ${T('days','дн')}</title></circle><text x="${x(i)}" y="${H-8}" font-size="10" fill="${dim}" text-anchor="middle">${months[i]}</text>`).join('')}</svg>
   <div style="display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap"><span><i style="display:inline-block;width:10px;height:3px;background:${mal};vertical-align:middle"></i> ${T('All applications','Все заявки')}</span><span><i style="display:inline-block;width:10px;height:3px;background:${gold};vertical-align:middle"></i> ${T('High-risk permits','Высокий риск')}</span><span><i style="display:inline-block;width:10px;height:3px;background:${red};vertical-align:middle"></i> SLA</span></div>`;
  const rc={L:0,MH:0,H:0};K.forEach(k=>rc[k.risk]+=Math.round(total/K.length*(k.risk==='L'?1.6:k.risk==='MH'?.9:.4)));S.apps.forEach(a=>rc[a.risk]++);
  const tot=rc.L+rc.MH+rc.H,cols={L:mal,MH:cssv('--amber'),H:red};let ang=-Math.PI/2,arcs='';
  for(const k of ['L','MH','H']){const a2=ang+rc[k]/tot*Math.PI*2,R=70,cx=90,cy=90,lg=a2-ang>Math.PI?1:0;arcs+=`<path d="M${cx+R*Math.cos(ang)} ${cy+R*Math.sin(ang)} A${R} ${R} 0 ${lg} 1 ${cx+R*Math.cos(a2)} ${cy+R*Math.sin(a2)}" stroke="${cols[k]}" stroke-width="26" fill="none"><title>${L(RISK[k])}: ${rc[k]}</title></path>`;ang=a2}
  $('#donut').innerHTML=`<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 180 180" width="170" height="170">${arcs}<text x="90" y="88" text-anchor="middle" font-size="22" font-weight="800" fill="${cssv('--text')}">${tot}</text><text x="90" y="106" text-anchor="middle" font-size="10" fill="${dim}">${T('applications','заявок')}</text></svg><div style="font-size:13px;flex:1;min-width:150px">${['L','MH','H'].map(k=>`<div style="display:flex;gap:8px;align-items:center;margin:8px 0"><i style="width:12px;height:12px;border-radius:3px;background:${cols[k]}"></i>${L(RISK[k])}<span style="flex:1"></span><b class="mono">${Math.round(rc[k]/tot*100)}%</b></div>`).join('')}<div class="muted" style="font-size:12px">${T('Low-risk licences are issued with zero manual steps.','Лицензии низкого риска выдаются без ручных шагов.')}</div></div></div>`;
}
PT.onLang(()=>{render();if($('#paperBg').classList.contains('on'))$('#paperBg').classList.remove('on')});
go(view);
})();
</script>
