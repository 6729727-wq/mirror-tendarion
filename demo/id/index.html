<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IDentra Digital Identity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.wrap{max-width:1320px;margin:0 auto;padding:18px 20px 60px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top h1{margin:0;font-size:22px;display:flex;align-items:center;gap:10px}
.lg{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;font-size:13px;font-weight:800;letter-spacing:.02em;flex:none;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--gold) 55%,transparent)}
.lg.sm{width:24px;height:24px;font-size:9.5px;border-radius:7px}
.top .sp{flex:1}
.stk{display:flex;gap:6px;flex-wrap:wrap}
.stk .pill{font-family:var(--mono);font-size:11px}
.who{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;font-weight:600;min-width:0}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1306;font-weight:800;font-size:12px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}.dot.on{background:var(--mal3);box-shadow:0 0 0 3px color-mix(in srgb,var(--mal) 25%,transparent)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.nav{display:flex;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none;margin-bottom:16px}
.nav::-webkit-scrollbar{display:none}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.lead{color:var(--muted);font-size:13.5px;margin:-4px 0 14px}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dng{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.wbtn{width:100%;justify-content:center;margin-top:10px}
.lnk{border:0;background:none;color:var(--mal3);cursor:pointer;font-weight:600;font-size:13px;padding:0}
.lnk:disabled{color:var(--dim);cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on,.chip:hover{border-color:var(--gold);color:var(--gold2)}
.f{margin-bottom:12px}.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--gold);animation:sp .8s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.okmark{width:84px;height:84px;margin:10px auto 12px;border-radius:50%;background:var(--mal);display:grid;place-items:center;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.okmark svg{width:44px;stroke:#fff;stroke-width:4;fill:none;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .5s .25s forwards}
.okmark.warn{background:var(--amber)}.okmark.bad{background:var(--red)}
@keyframes dr{to{stroke-dashoffset:0}}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:340px;animation:pop .2s}
.toast.bad{border-left-color:var(--red)}.toast.gold{border-left-color:var(--gold)}
.toast.otp{cursor:pointer}.toast .code{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.18em;color:var(--gold2);display:block;margin:4px 0 2px}
.sw{position:relative;width:40px;height:22px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line2);transition:.2s;cursor:pointer}
.sw i:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--mal)}.sw input:checked+i:after{transform:translateX(18px)}
.sw input:disabled+i{opacity:.55;cursor:not-allowed}
pre.code{font-family:var(--mono);font-size:11.5px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:420px;margin:0;line-height:1.55;white-space:pre}
.jk{color:var(--mal3)}.js{color:var(--gold2)}.jn{color:var(--blue)}.jb{color:var(--violet)}
.tw{overflow:auto;max-height:460px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;background:var(--panel2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);padding:8px 10px;white-space:nowrap;z-index:1}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
tr:last-child td{border-bottom:0}
.kv{width:100%;font-size:13px}.kv td{white-space:normal;padding:7px 0;border-bottom:1px solid var(--line)}.kv td:first-child{color:var(--muted);padding-right:12px;width:42%}
.kv td:last-child{font-weight:600;word-break:break-word}
/* sign-in */
.sgrid{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:18px;align-items:start}
.rpk{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.rpk .chip i,.rph i,.aic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:11px;font-weight:800;flex:none}
.idp{position:relative;overflow:hidden;padding:24px;min-height:520px;display:flex;flex-direction:column}
.idph{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.idph .t1{font-weight:800;font-size:17px}.idph .t2{font-size:13px;color:var(--muted)}
.mseg{display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin-bottom:18px}
.mseg button{padding:8px 6px}
.pkhero{display:flex;gap:16px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px}
.pkhero b{display:block;margin-bottom:3px}.pkhero .muted{font-size:13px}
.fpi{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--mal) 14%,transparent);color:var(--mal3);flex:none}
.fpi svg{width:34px}
.hint{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.osd{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:18px;text-align:center;margin:12px 0}
.osd .h{font-size:13px;color:var(--muted)}.osd .h b{color:var(--text)}
.fpb{position:relative;width:118px;height:118px;margin:14px auto 8px;border:0;background:none;cursor:pointer;color:var(--mal3);touch-action:none;-webkit-user-select:none;user-select:none;border-radius:50%}
.fpb .ring{position:absolute;inset:0;transform:rotate(-90deg)}
.fpb .ring circle{fill:none;stroke-width:5}
.fpb .ring .bg{stroke:var(--line2)}.fpb .ring .fg{stroke:var(--gold);stroke-linecap:round}
.fpb .ico{position:absolute;inset:22px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--mal) 12%,transparent);transition:.2s}
.fpb .ico svg{width:46px}
.fpb.hold .ico{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold2);transform:scale(.95)}
.fpb.ok .ico{background:var(--mal);color:#fff}
.cst{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:7px 0;color:var(--dim)}
.cst .i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);flex:none;margin-top:1px;display:grid;place-items:center;font-size:10px;color:#fff}
.cst.done{color:var(--text)}.cst.done .i{background:var(--mal);border-color:var(--mal)}
.cst.act{color:var(--text)}.cst.act .i{border-color:var(--gold);border-top-color:transparent;animation:sp .8s linear infinite}
.cst code{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all;display:block}
.otpb{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:12px 0 8px}
.otpb input{width:100%;height:54px;text-align:center;font-family:var(--mono);font-size:22px;font-weight:700;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;outline:none;padding:0}
.otpb input:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 20%,transparent)}
.otpb.shake{animation:sh .35s}.otpb.bad input{border-color:var(--red)}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.orow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.qrb{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qrw{position:relative;background:#fff;border-radius:16px;padding:10px;box-shadow:0 0 0 1px var(--line2);overflow:hidden}
.qrw canvas{display:block;width:210px;height:210px;transition:opacity .25s}
.qrw .scan{position:absolute;left:10px;right:10px;height:40px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--mal3) 35%,transparent),transparent);animation:qs 2.4s ease-in-out infinite;pointer-events:none}
@keyframes qs{0%,100%{top:0}50%{top:calc(100% - 40px)}}
.qrw .num{position:absolute;inset:0;display:none;place-items:center;background:rgba(255,255,255,.94);color:#0d1f19;font-weight:800;font-size:13px}
.qrw .num b{display:block;font-size:64px;line-height:1;margin-top:4px;color:#0b7a5a;font-family:var(--mono)}
.qrw.matched .num{display:grid;animation:pop .25s}.qrw.matched .scan{display:none}
.qrbar{width:230px;height:4px;border-radius:99px;background:var(--line);overflow:hidden}.qrbar i{display:block;height:100%;background:var(--gold);width:0}
.psheet{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.25s;z-index:5}
.psheet.on{opacity:1;pointer-events:auto}
.ph{width:min(300px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:28px 28px 0 0;padding:14px 18px 22px;transform:translateY(100%);transition:.3s cubic-bezier(.2,.9,.3,1);box-shadow:var(--shadow);text-align:center}
.psheet.on .ph{transform:none}
.ph .grab{width:40px;height:4px;border-radius:9px;background:var(--line2);margin:0 auto 12px}
.ph .phh{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:12px}
.ph .meta{font-size:11.5px;color:var(--muted);margin:6px 0 12px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.nums button{border:1px solid var(--line2);background:var(--panel2);border-radius:14px;padding:14px 0;font-size:22px;font-weight:800;font-family:var(--mono);cursor:pointer}
.nums button:hover{border-color:var(--gold)}
.faceid{width:70px;height:70px;margin:8px auto;color:var(--mal3)}
.faceid rect{stroke-dasharray:14 6;animation:fd 1s linear infinite}
@keyframes fd{to{stroke-dashoffset:-40}}
.rph{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.rph i{width:42px;height:42px;border-radius:12px;font-size:18px}
.sl .r{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sl .r:last-child{border-bottom:0}.sl .r .sp{flex:1;min-width:0}
.note{font-size:12.5px;color:var(--muted);background:var(--bg2);border:1px dashed var(--line2);border-radius:10px;padding:9px 12px;margin-top:12px}
.brow{display:flex;gap:8px;margin-top:14px}.brow .btn{flex:1;justify-content:center}
.foot{margin-top:auto;padding-top:16px;font-size:11.5px;color:var(--dim);text-align:center}
.trace{display:flex;flex-direction:column}
.ts{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}
.ts:before{content:"";position:absolute;left:12px;top:26px;bottom:2px;width:2px;background:var(--line)}
.ts:last-child:before{display:none}
.ts .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;border:2px solid var(--line2);color:var(--dim);background:var(--panel)}
.ts.done .n{background:var(--mal);border-color:var(--mal);color:#fff}
.ts.act .n{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 15%,transparent)}
.ts.warn .n{border-color:var(--amber);color:var(--amber)}
.ts .tt{font-weight:700;font-size:13.5px;margin-top:3px}.ts .td{font-size:12.5px;color:var(--muted)}
.ts.wait .tt{color:var(--dim)}
.req{font-family:var(--mono);font-size:11.5px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:6px;word-break:break-all;color:var(--muted);line-height:1.6}
.req b{color:var(--mal3);font-weight:600}.req em{font-style:normal;color:var(--gold2)}
.jwt{font-family:var(--mono);font-size:11.5px;word-break:break-all;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:6px;line-height:1.55}
.jwt .h{color:var(--red)}.jwt .p{color:var(--violet)}.jwt .s{color:var(--blue)}
/* proofing */
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
.stp{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--dim);min-width:0}
.stp .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);font-size:11.5px;flex:none}
.stp span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stp.on{color:var(--text);border-color:var(--gold)}.stp.on .n{border-color:var(--gold);color:var(--gold2)}
.stp.done{color:var(--text)}.stp.done .n{background:var(--mal);border-color:var(--mal);color:#fff}
.pgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.drop{border:2px dashed var(--line2);border-radius:16px;padding:28px 18px;text-align:center;cursor:pointer;transition:.15s;background:var(--bg2)}
.drop.over,.drop:hover{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 6%,var(--bg2))}
.drop .big{font-size:34px;line-height:1;margin-bottom:8px}
.docprev{border-radius:14px;overflow:hidden;border:1px solid var(--line2);background:#000;position:relative}
.docprev img{display:block;width:100%;max-height:420px;object-fit:contain;background:#0b1512}
.docprev .ln{position:absolute;left:0;right:0;height:3px;background:var(--mal3);box-shadow:0 0 16px 3px var(--mal3);animation:scan2 1.3s ease-in-out infinite alternate;top:0}
@keyframes scan2{to{top:calc(100% - 3px)}}
.docprev .tag{position:absolute;right:10px;bottom:10px;background:rgba(10,20,17,.82);font-size:11px}
.ocr .r{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:8px;align-items:center;padding:5px 0;animation:fade .25s}
.ocr label{font-size:11.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:2px}
.ocr .input{padding:7px 10px;font-family:var(--mono);font-size:13px}
.conf{font-family:var(--mono);font-size:11.5px;text-align:right;color:var(--mal3);padding-top:16px}
.mrz{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;letter-spacing:.06em;word-break:break-all;margin:10px 0;line-height:1.5}
.chk{display:flex;align-items:center;gap:9px;font-size:13px;padding:6px 0;animation:fade .25s}
.chk .c{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;color:#fff;background:var(--mal)}
.chk .c.bad{background:var(--red)}.chk .c.wait{background:none;border:2px solid var(--gold);border-top-color:transparent;animation:sp .8s linear infinite}
.chk .sp{flex:1;min-width:0}.chk .v{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.ovw{position:relative;width:256px;height:316px;margin:4px auto 12px}
.ovw svg.rg{position:absolute;inset:0;width:100%;height:100%}
.ovw .rg ellipse{fill:none;stroke-width:6}.ovw .rg .bg{stroke:var(--line2)}.ovw .rg .fg{stroke:var(--mal3);stroke-linecap:round;transition:stroke-dashoffset .5s}
.oval{position:absolute;inset:12px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 35%,#1d3a31,#081210)}
.oval video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.oval .face{position:absolute;inset:0;width:100%;height:100%}
.face .head{transition:transform .6s cubic-bezier(.3,.8,.3,1);transform-origin:116px 160px}
.oval.tl .face .head{transform:translateX(-16px) rotate(-4deg) scaleX(.93)}
.oval.tr .face .head{transform:translateX(16px) rotate(4deg) scaleX(.93)}
.face .eye{transform-box:fill-box;transform-origin:center}
.oval.bl .face .eye{animation:blink .32s 2}
@keyframes blink{50%{transform:scaleY(.1)}}
.oval .mesh{position:absolute;inset:0;opacity:0;transition:.4s}
.oval.run .mesh{opacity:1}
.mesh i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--mal3);box-shadow:0 0 6px var(--mal3);animation:mp 1.4s infinite}
@keyframes mp{50%{opacity:.25}}
.lp{text-align:center;font-weight:700;font-size:16px;min-height:24px}
.ial{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--mal) 25%,transparent),color-mix(in srgb,var(--gold) 18%,transparent));border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);font-weight:800;font-size:18px}
.ial small{font-weight:600;font-size:12px;color:var(--muted);display:block}
/* wallet */
.wgrid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:18px;align-items:start}
.vcs{display:flex;flex-direction:column;gap:12px}
.vc{position:relative;aspect-ratio:1.586;border-radius:18px;padding:16px 18px;color:#fff;overflow:hidden;cursor:pointer;border:0;text-align:left;width:100%;display:flex;flex-direction:column;box-shadow:0 10px 28px rgba(0,0,0,.28);transition:transform .15s,box-shadow .15s;font:inherit}
.vc:hover{transform:translateY(-2px)}
.vc.on{box-shadow:0 0 0 3px var(--gold),0 14px 34px rgba(0,0,0,.35)}
.vc:before{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 68%)}
.vc:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px);pointer-events:none}
.vc .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;opacity:.85;font-weight:700}
.vc .t{font-size:17px;font-weight:800;margin-top:2px}
.vc .hn{margin-top:auto;font-size:15px;font-weight:700}
.vc .fs{display:flex;gap:16px;font-size:11px;opacity:.9;margin-top:4px;font-family:var(--mono)}
.vc .chipx{position:absolute;right:18px;top:18px;width:36px;height:27px;border-radius:6px;background:linear-gradient(135deg,#f3d79a,#b98a35);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.vc .lock{position:absolute;inset:0;background:rgba(6,13,11,.62);backdrop-filter:blur(2px);display:grid;place-items:center;text-align:center;font-weight:700;font-size:13px;padding:20px;z-index:2}
.dl .r{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}

.sc.on{color:var(--mal3);border-color:color-mix(in srgb,var(--mal) 45%,transparent)}
.sc.rq{cursor:default;color:var(--text)}
.sc.off{text-decoration:line-through;opacity:.7}
.conf2{background:color-mix(in srgb,var(--red) 8%,var(--bg2));border:1px solid color-mix(in srgb,var(--red) 40%,transparent);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.sumrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}.kpi .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;font-family:var(--mono)}

.secg{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}

  $('#logB').innerHTML=rows.map(l=>`<tr class="${l.fresh?'fresh':''}"><td class="mono" style="font-size:11.5px">${fmtT(l.ts)}</td><td style="white-space:normal;min-width:240px"><span class="ev"><i style="background:${LT[l.type][0]}"></i>${esc(PT.lang==='ru'?l.ru:l.en)}</span></td><td>${esc(l.dev)}</td><td><div>${esc(l.loc)}</div><div class="mono muted" style="font-size:11px">${l.ip}</div></td><td><span class="pill ${l.res==='ok'?'ok':l.res==='warn'?'warn':'bad'}">${l.res==='ok'?T('OK','Успех'):l.res==='warn'?T('Warning','Внимание'):T('Blocked','Заблокировано')}</span></td></tr>`).join('')||`<tr><td colspan="5" class="muted" style="text-align:center;padding:24px">${T('No events match','Нет подходящих событий')}</td></tr>`;
  S.log.forEach(l=>delete l.fresh)}
$('#logQ').oninput=renderLog;
$('#logExport').onclick=()=>{const blob=new Blob([JSON.stringify(S.log.map(l=>({time:new Date(l.ts).toISOString(),type:l.type,event:l.en,result:l.res,device:l.dev,location:l.loc,ip:l.ip})),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='identra-security-log.json';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast(T('Security log exported','Журнал экспортирован'))};
function renderSec(){renderLog();
  $('#pkList').innerHTML=S.passkeys.map(k=>`<div class="r"><span class="ic">${k.ic}</span><div class="sp"><div><b>${esc(k.name)}</b></div><div class="muted" style="font-size:12px">${esc(L(k.kind))} · ${T('used','использован')} ${ago(k.used)}</div></div><button class="btn sm" data-pk="${k.id}">${T('Remove','Удалить')}</button></div>`).join('');
  $$('#pkList [data-pk]').forEach(b=>b.onclick=()=>{if(S.passkeys.length<2){toast(T('Keep at least one passkey — add another first','Оставьте хотя бы один ключ — сначала добавьте другой'),'bad');return}const k=S.passkeys.find(x=>x.id===b.dataset.pk);S.passkeys=S.passkeys.filter(x=>x!==k);save();log('security','Passkey removed: '+k.name,'Ключ удалён: '+k.name,'warn');renderSec();toast(T('Passkey removed','Ключ удалён'),'gold')});
  $('#sessList').innerHTML=S.sessions.map(s=>`<div class="r"><span class="ic">${/iPhone|app/.test(s.dev)?'📱':'💻'}</span><div class="sp"><div><b>${esc(s.dev)}</b> ${s.cur?`<span class="pill ok" style="font-size:10.5px;padding:0 7px">${T('this device','это устройство')}</span>`:''}</div><div class="muted" style="font-size:12px">${esc(s.loc)} · ${s.ip} · ${ago(s.t)}</div></div>${s.cur?'':`<button class="btn sm dng" data-ss="${s.id}">${T('Sign out','Выйти')}</button>`}</div>`).join('');
  $$('#sessList [data-ss]').forEach(b=>b.onclick=()=>{const s=S.sessions.find(x=>x.id===b.dataset.ss);S.sessions=S.sessions.filter(x=>x!==s);save();log('security','Session ended remotely: '+s.dev,'Сеанс завершён удалённо: '+s.dev);renderSec();toast(T('Session ended','Сеанс завершён'))});
  $('#sessAll').disabled=S.sessions.length<2}
$('#sessAll').onclick=()=>{const n=S.sessions.filter(s=>!s.cur).length;if(!n)return;S.sessions=S.sessions.filter(s=>s.cur);save();log('security','Signed out of '+n+' other sessions','Завершено других сеансов: '+n,'warn');renderSec();toast(T('Other sessions signed out','Другие сеансы завершены'),'gold')};
$('#pkAdd').onclick=async()=>{const b=$('#pkAdd');b.disabled=true;const t=toast('<span class="spin"></span> '+T('navigator.credentials.create() — confirm on your device…','navigator.credentials.create() — подтвердите на устройстве…'),'gold',2000);await sleep(1600);
  const n=S.passkeys.filter(k=>/Chrome/.test(k.name)).length;const k={id:'pk'+now(),name:'Chrome · macOS'+(n?' #'+(n+1):''),kind:{en:'Device-bound passkey',ru:'Ключ на этом устройстве'},ic:'🔐',t:now(),used:now()};S.passkeys.push(k);save();log('security','Passkey added: '+k.name,'Добавлен ключ: '+k.name);renderSec();b.disabled=false;toast('✓ '+T('Passkey registered (ES256, attestation: none)','Ключ зарегистрирован (ES256, attestation: none)'))};
$('#reset').onclick=()=>{if(!$('#reset').dataset.c){$('#reset').dataset.c=1;$('#reset').textContent=T('Click again to confirm','Нажмите ещё раз для подтверждения');setTimeout(()=>{const r=$('#reset');delete r.dataset.c;r.textContent=T('Reset demo','Сбросить демо')},3000);return}
  try{localStorage.removeItem(KEY)}catch(e){}S=fresh();P={step:0,doc:'id',img:null,src:null,fields:null,checks:[],live:null,run:0,busy:0};newFlow();A.screen='login';A.otp=null;A.pendingStep=null;W={cred:'mdl',ver:'drive',sel:new Set(VERS[0].w),vp:null,res:null};delete $('#reset').dataset.c;renderAll();toast(T('Demo data reset','Демо-данные сброшены'))};

/* =================== ADMIN =================== */
const SCOPES_ALL=['openid','profile','email','phone','birthdate','address','nid','health','diploma','mdl','age_over_21'];
let cfgTab='disc',lastReg=null,kpi={sign:1268450};
function discovery(){return{issuer:ISS,authorization_endpoint:ISS+'/authorize',token_endpoint:ISS+'/token',userinfo_endpoint:ISS+'/userinfo',jwks_uri:ISS+'/.well-known/jwks.json',registration_endpoint:ISS+'/register',end_session_endpoint:ISS+'/logout',pushed_authorization_request_endpoint:ISS+'/par',revocation_endpoint:ISS+'/revoke',introspection_endpoint:ISS+'/introspect',
  scopes_supported:SCOPES_ALL,response_types_supported:['code'],response_modes_supported:['query','form_post','jwt'],grant_types_supported:['authorization_code','refresh_token','urn:openid:params:grant-type:ciba'],
  subject_types_supported:['pairwise','public'],id_token_signing_alg_values_supported:['ES256','PS256'],token_endpoint_auth_methods_supported:['private_key_jwt','client_secret_basic','none'],code_challenge_methods_supported:['S256'],
  acr_values_supported:['urn:nd:ial:1','urn:nd:ial:2','urn:nd:aal:2','urn:nd:aal:3'],claims_supported:['sub','name','given_name','family_name','email','email_verified','phone_number','birthdate','address','nd:personal_number','nd:health_insured','acr','amr','auth_time'],
  dpop_signing_alg_values_supported:['ES256'],require_pushed_authorization_requests:false,authorization_response_iss_parameter_supported:true,backchannel_logout_supported:true,frontchannel_logout_supported:false}}
let JWKS=null;function jwks(){if(!JWKS)JWKS={keys:[{kty:'EC',crv:'P-256',use:'sig',alg:'ES256',kid:KID,x:rnd(32),y:rnd(32)},{kty:'EC',crv:'P-256',use:'sig',alg:'ES256',kid:'nd-sig-es256-06',x:rnd(32),y:rnd(32),status:'retiring'},{kty:'RSA',use:'sig',alg:'PS256',kid:'nd-sig-ps256-03',n:rnd(256),e:'AQAB'}]};return JWKS}
function regResp(c){const o={client_id:c.cid,client_id_issued_at:Math.floor(c.t/1000),client_name:c.name,application_type:c.type==='native'?'native':'web',redirect_uris:c.uris,grant_types:['authorization_code','refresh_token'],response_types:['code'],token_endpoint_auth_method:c.auth,scope:c.scopes.join(' '),subject_type:c.pair?'pairwise':'public',default_acr_values:['urn:nd:ial:'+(c.acr==='1'?1:2),'urn:nd:aal:'+(c.acr==='1'?1:c.acr==='3'?3:2)],id_token_signed_response_alg:'ES256',require_pkce:true,dpop_bound_access_tokens:true};
  if(c.secret){o.client_secret=c.secret;o.client_secret_expires_at=0}if(c.auth==='private_key_jwt')o.jwks_uri='https://'+(c.uris[0].split('/')[2]||'client.nd')+'/.well-known/jwks.json';o.registration_access_token=c.rat||rnd(32);o.registration_client_uri=ISS+'/register/'+c.cid;return o}
function renderAdmin(){
  const ial2=61.4,pk=38.2;
  $('#kpis').innerHTML=[[T('Identities','Учётные записи'),'4 821 307',T('+3 912 today','+3 912 сегодня')],[T('Sign-ins, 24 h','Входов за 24 ч'),'<span id="kSign">'+kpi.sign.toLocaleString('ru-RU')+'</span>',T('p95 latency 182 ms','p95 задержка 182 мс')],[T('IAL2 share','Доля IAL2'),ial2+'%',T('remote proofing pass rate 93.1%','успешных удалённых проверок 93,1%')],[T('Passkey sign-ins','Входы по passkey'),pk+'%',T('phishing-resistant','устойчивые к фишингу')]].map(k=>`<div class="card kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="d">${k[2]}</div></div>`).join('');
  const sc=$('#rScopes');if(!sc.children.length)sc.innerHTML=SCOPES_ALL.map(s=>`<label title=""><input type="checkbox" value="${s}" ${['openid','profile','email'].includes(s)?'checked':''} ${s==='openid'?'disabled':''}><span class="mono">${s}</span></label>`).join('');
  $$('#rScopes label').forEach(l=>l.title=L(SC[l.querySelector('input').value]));
  $('#cfgT').innerHTML=[['disc','Discovery'],['jwks','JWKS'],['reg',T('Registration','Регистрация')]].map(t=>`<button class="chip ${cfgTab===t[0]?'on':''}" data-t="${t[0]}" ${t[0]==='reg'&&!lastReg?'disabled style="opacity:.5;cursor:not-allowed"':''}>${t[1]}</button>`).join('');
  $$('#cfgT [data-t]').forEach(b=>b.onclick=()=>{if(b.disabled)return;cfgTab=b.dataset.t;renderAdmin()});
  const obj=cfgTab==='disc'?discovery():cfgTab==='jwks'?jwks():regResp(lastReg);
  $('#cfgUrl').textContent=cfgTab==='disc'?'GET '+ISS+'/.well-known/openid-configuration':cfgTab==='jwks'?'GET '+ISS+'/.well-known/jwks.json':'POST '+ISS+'/register → 201 Created';
  $('#cfgPre').innerHTML=hl(obj);$('#cfgCopy').onclick=()=>copy(JSON.stringify(obj,null,2));
  $('#secretBox').innerHTML=lastReg&&lastReg.fresh?`<div class="secret"><div style="font-weight:700;margin-bottom:6px">🔑 ${T('Client registered — save these now','Клиент зарегистрирован — сохраните сейчас')}</div><div class="row"><span class="muted" style="font-size:12px">client_id</span><button class="lnk" data-cp="${lastReg.cid}">${T('copy','копировать')}</button></div><div class="mono">${lastReg.cid}</div>
    ${lastReg.secret?`<div class="row" style="margin-top:6px"><span class="muted" style="font-size:12px">client_secret</span><button class="lnk" data-cp="${lastReg.secret}">${T('copy','копировать')}</button></div><div class="mono">${lastReg.secret}</div><div style="font-size:12px;color:var(--gold2);margin-top:6px">${T('The secret is shown only once. Only its hash is stored.','Секрет показывается один раз. Хранится только его хеш.')}</div>`:`<div style="font-size:12px;color:var(--muted);margin-top:6px">${lastReg.auth==='private_key_jwt'?T('No shared secret: the client authenticates with its own key pair (private_key_jwt).','Общего секрета нет: клиент подписывает запросы своим ключом (private_key_jwt).'):T('Public client: no secret, PKCE is mandatory.','Публичный клиент: без секрета, PKCE обязателен.')}</div>`}</div>`:'';
  $$('#secretBox [data-cp]').forEach(b=>b.onclick=()=>copy(b.dataset.cp));
  $('#cCount').textContent=S.clients.length;
  const TY={web:T('Web','Веб'),spa:'SPA',native:T('Mobile','Мобильное')};
  $('#cBody').innerHTML=S.clients.map((c,i)=>`<tr class="${c.fresh?'fresh':''}"><td><b>${esc(c.name)}</b><div class="muted" style="font-size:11.5px">${esc(c.org)}</div></td><td class="mono" style="font-size:11.5px">${c.cid}</td><td>${TY[c.type]}</td><td class="mono" style="font-size:11.5px">${c.auth}</td><td><span class="pill ${c.acr==='1'?'':'gold'}" style="font-size:11px">${c.acr==='1'?'IAL1 · AAL1':c.acr==='3'?'IAL2 · AAL3':'IAL2 · AAL2'}</span></td><td class="muted" style="font-size:12px">${ago(c.t)}</td><td><button class="btn sm" data-cv="${i}">JSON</button> <button class="btn sm dng" data-cd="${i}">✕</button></td></tr>`).join('');
  S.clients.forEach(c=>delete c.fresh);
  $$('#cBody [data-cv]').forEach(b=>b.onclick=()=>{lastReg=Object.assign({},S.clients[+b.dataset.cv],{fresh:0});cfgTab='reg';renderAdmin();$('#cfgPre').scrollIntoView({behavior:'smooth',block:'nearest'})});
  $$('#cBody [data-cd]').forEach(b=>b.onclick=()=>{const c=S.clients[+b.dataset.cd];if(RPS.some(r=>r.cid===c.cid)){toast(T('This client is used by the sign-in demo and cannot be deleted','Этот клиент используется в демо входа и не может быть удалён'),'gold');return}S.clients.splice(+b.dataset.cd,1);if(lastReg&&lastReg.cid===c.cid){lastReg=null;cfgTab='disc'}save();log('admin','OIDC client deleted: '+c.name,'OIDC-клиент удалён: '+c.name,'warn',{dev:'Admin console'});renderAdmin();toast(T('Client deleted, its tokens revoked','Клиент удалён, токены отозваны'),'gold')})}
$('#rType').onchange=()=>{const t=$('#rType').value,a=$('#rAuth');a.value=t==='web'?'private_key_jwt':'none';const u=$('#rUris');if(t==='native'&&/^https:/.test(u.value))u.value='nd.velmar.parking:/oauth2redirect';if(t!=='native'&&!/^https:/.test(u.value))u.value='https://parking.velmar.nd/auth/callback'};
$('#regF').onsubmit=e=>{e.preventDefault();const err=$('#rErr');err.textContent='';
  const name=$('#rName').value.trim(),type=$('#rType').value,auth=$('#rAuth').value,uris=$('#rUris').value.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  if(name.length<3){err.textContent=T('Enter an application name (3+ characters)','Введите название (от 3 символов)');$('#rName').focus();return}
  if(!uris.length){err.textContent=T('Add at least one redirect URI','Добавьте хотя бы один redirect URI');return}
  for(const u of uris){if(/[*#]/.test(u)){err.textContent=T('Wildcards and fragments are not allowed: ','Шаблоны и фрагменты запрещены: ')+u;return}
    if(type==='native'){if(!/^([a-z][a-z0-9.+-]*\.[a-z0-9.+-]+:\/[^\s]*|https:\/\/[^\s]+)$/i.test(u)){err.textContent=T('Native apps need a reverse-domain scheme (e.g. nd.app:/cb) or https: ','Мобильным нужна схема reverse-domain (напр. nd.app:/cb) или https: ')+u;return}}
    else if(!/^https:\/\/[a-z0-9.-]+\.[a-z]{2,}(:\d+)?(\/[^\s]*)?$/i.test(u)){err.textContent=T('Redirect URIs must use https:// and a public host: ','Redirect URI должен быть https:// с публичным хостом: ')+u;return}}
  if(type!=='web'&&auth!=='none'){err.textContent=T('Public clients cannot keep a secret — use “none (PKCE)”','Публичный клиент не может хранить секрет — выберите «none (PKCE)»');return}
  if(type==='web'&&auth==='none'){err.textContent=T('Confidential web clients must authenticate at the token endpoint','Конфиденциальный веб-клиент должен аутентифицироваться на /token');return}
  const scopes=$$('#rScopes input').filter(i=>i.checked).map(i=>i.value);
  const c={name,org:$('#rOrg').value,cid:'nd-'+rhex(8),type,auth,acr:$('#rAcr').value,uris,scopes,pair:$('#rPair').checked,t:now(),fresh:1,rat:rnd(32)};
  if(auth==='client_secret_basic')c.secret=rnd(32);
  const stored=Object.assign({},c);delete stored.secret;delete stored.rat;S.clients.unshift(stored);save();
  lastReg=c;cfgTab='reg';log('admin','OIDC client registered: '+name+' ('+c.cid+')','Зарегистрирован OIDC-клиент: '+name+' ('+c.cid+')','ok',{dev:'Admin console'});renderAdmin();toast('✓ '+T('Client registered','Клиент зарегистрирован')+' · <span class="mono">'+c.cid+'</span>');
  $('#rName').value='';if(innerWidth<1100)$('#secretBox').scrollIntoView({behavior:'smooth',block:'center'})};
setInterval(()=>{kpi.sign+=3+Math.floor(Math.random()*14);const k=$('#kSign');if(k&&view==='admin')k.textContent=kpi.sign.toLocaleString('ru-RU')},1400);

newFlow();A.screen=S.idp?'sso':'login';
PT.onLang(()=>{const typed=A.otp?A.otp.typed.slice():null;stopQr();renderAll();if(typed&&A.otp)A.otp.typed=typed});
renderAll();
})();
