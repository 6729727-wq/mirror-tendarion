<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExamSecure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.app[hidden],.auth[hidden]{display:none}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:3px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1306;font-size:16px;flex:none}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:10px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-weight:700}
.grow{flex:1}
.who{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:12.5px;margin-top:8px}
.who i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--mal) 25%,transparent);color:var(--mal3);font-style:normal;font-weight:800;flex:none}
.who b{display:block;font-size:13px}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.how>div>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold2);flex:none;font-size:13px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f .er{font-size:12px;color:var(--red);margin-top:4px}
.input.bad{border-color:var(--red)}
textarea.input{min-height:80px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.btn.warn{border-color:color-mix(in srgb,var(--amber) 55%,transparent);color:var(--amber)}
.ok-t{color:var(--mal3)} .bad-t{color:var(--red)} .warn-t{color:var(--amber)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
th.srt{cursor:pointer} th.srt:hover{color:var(--text)}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td,tbody tr.sel td{background:color-mix(in srgb,var(--mal) 7%,transparent)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
/* auth */
.auth{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:28px 16px;background:radial-gradient(900px 500px at 85% 10%,color-mix(in srgb,var(--gold) 14%,transparent),transparent),radial-gradient(700px 400px at 10% 90%,color-mix(in srgb,var(--mal) 14%,transparent),transparent)}
.acard{width:100%;max-width:440px;padding:28px;box-shadow:var(--shadow)}
.acard h2{margin:6px 0 4px;font-size:22px}
.acard .f{margin-top:12px}
.aerr{color:var(--red);font-size:12.5px;min-height:18px;margin:8px 0}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:14px;font-size:12px}
.checks div{border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--bg2);color:var(--muted)}
.checks div b{color:var(--mal3)}
/* exam */
.ex{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;align-items:start}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.timer{font-family:var(--mono);font-size:22px;font-weight:700;padding:4px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2)}
.timer.low{color:var(--red);border-color:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
.qtext{font-size:17px;font-weight:600;line-height:1.5;margin:6px 0 16px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line2);background:var(--bg2);border-radius:12px;padding:12px 14px;margin-bottom:9px;cursor:pointer;font-size:15px;min-height:48px}
.opt:hover{border-color:var(--mal)}
.opt b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);flex:none;font-size:13px}
.opt.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 12%,var(--bg2))}
.opt.on b{background:var(--mal);color:#fff;border-color:var(--mal)}
.qnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.qnav button{aspect-ratio:1;border-radius:9px;border:1px solid var(--line2);background:var(--bg2);font-weight:700;font-size:13px;cursor:pointer;position:relative;min-height:36px}
.qnav button.ans{background:color-mix(in srgb,var(--mal) 22%,transparent);border-color:var(--mal)}
.qnav button.cur{outline:2px solid var(--gold);outline-offset:1px}
.qnav button.flg::after{content:'';position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--mal2),var(--mal3));transition:width .3s}
.cam{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#0b1512;border:1px solid var(--line2)}
.cam svg{width:100%;height:100%;display:block}
.cam .rec{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px}
.banner{border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:12px;border:1px solid}
.banner.warn{border-color:color-mix(in srgb,var(--amber) 55%,transparent);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.banner.bad{border-color:color-mix(in srgb,var(--red) 55%,transparent);background:color-mix(in srgb,var(--red) 12%,transparent)}
.overlay{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 88%,transparent);display:grid;place-items:center;z-index:5;border-radius:var(--r);text-align:center;padding:20px}
.rel{position:relative}
.modal{position:fixed;inset:0;z-index:2500;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.modal .card{max-width:440px;width:100%;box-shadow:var(--shadow)}
.res{text-align:center;padding:10px 0}
.res .big{font-size:52px;font-weight:800;letter-spacing:-.03em}
/* proctor */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;cursor:pointer;transition:.15s}
.tile:hover{border-color:var(--line2)}
.tile.sel{border-color:var(--gold)}
.tile.r-high{border-color:color-mix(in srgb,var(--red) 70%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--red) 40%,transparent)}
.tile.r-med{border-color:color-mix(in srgb,var(--amber) 60%,transparent)}
.tile .vid{position:relative;aspect-ratio:16/10;background:#0b1512}
.tile .vid svg{width:100%;height:100%;display:block}
.tile .vid .st{position:absolute;left:6px;top:6px;display:flex;gap:4px;flex-wrap:wrap}
.tile .vid .st span{background:rgba(0,0,0,.62);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 7px}
.tile .vid .st .r{background:#d63c3c}.tile .vid .st .a{background:#c98a1a}
.tile .meta{padding:8px 10px;font-size:12.5px}
.tile .meta b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.risk{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}
.risk i{display:block;height:100%}
.flag{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.flag:last-child{border:0}
.flag .t{font-family:var(--mono);font-size:11.5px;color:var(--dim);width:44px;flex:none}
.flag .c{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
.side-panel{position:sticky;top:60px}
/* items */
.diff{display:inline-flex;gap:2px}.diff i{width:6px;height:12px;border-radius:2px;background:var(--line2)}.diff i.on{background:var(--gold)}
.optEd{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.optEd input[type=radio]{width:18px;height:18px;accent-color:var(--mal);flex:none}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.split,.intro,.ex{grid-template-columns:minmax(0,1fr)}.side-panel{position:static}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
}
@media (max-width:560px){.how{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}.kpi .v{font-size:20px}.kpis{gap:10px}.acard{padding:20px}.card{padding:14px}.qtext{font-size:15.5px}.wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.qnav{grid-template-columns:repeat(8,minmax(0,1fr))}}
</style>
</head>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const loc=()=>PT.lang==='ru'?'ru-RU':'en-GB';

function toast(m,c){const t=document.createElement('div');t.className='toast '+(c||'');t.innerHTML=m;$('#toasts').append(t);setTimeout(()=>t.remove(),3600)}
const DUR=20*60;

const TOP={alg:['Algebra','Алгебра'],geo:['Geometry','Геометрия'],stat:['Statistics','Статистика'],num:['Number','Числа'],fn:['Functions','Функции']};
const ITEMS0=[
 ['alg',2,'Solve for x: 3x − 7 = 11','Решите: 3x − 7 = 11',['4','6','18/3 + 1','−6'],1],
 ['geo',2,'A triangle has angles 47° and 68°. What is the third angle?','В треугольнике углы 47° и 68°. Чему равен третий угол?',['55°','65°','75°','115°'],1],
 ['stat',1,'What is the median of 3, 9, 4, 12, 7?','Какова медиана чисел 3, 9, 4, 12, 7?',['4','7','7.0 avg','9'],1],
 ['num',1,'Which number is prime?','Какое число простое?',['21','27','29','33'],2],

function left(){const E=S.ex;if(E.state!=='running'&&E.state!=='paused')return DUR;const now=E.state==='paused'?E.pausedAt:Date.now();return DUR-(now-E.start-E.paused)/1000}

  const me=S.cands[0];me.st='active';me.prog=0;me.warn=0;me.flags=[];me.risk=4;save();render();toast(T('Exam started · 20 minutes · good luck!','Экзамен начат · 20 минут · удачи!'))}
function qs(){return(S.ex.qids||[]).map(id=>S.items.find(q=>q.id===id)).filter(Boolean)}
function submitExam(auto){
  const E=S.ex,Q=qs();let sc=0;Q.forEach(q=>{if(E.ans[q.id]===q.ans)sc++});
  const pc=Math.round(sc/Q.length*100);E.state='done';E.res={score:sc,n:Q.length,pc,time:Math.min(DUR,DUR-left()),ts:Date.now(),auto:!!auto,by:{}};
  Q.forEach(q=>{const b=E.res.by[q.topic]||(E.res.by[q.topic]=[0,0]);b[1]++;if(E.ans[q.id]===q.ans)b[0]++});
  const me=S.cands[0];me.st='submitted';me.prog=Q.length;S.results=null;save();

function moodOf(c){if(c.st==='terminated'||c.st==='submitted')return 'ok';const f=c.flags[0];if(!f)return 'ok';return f.k==='voice'||f.k==='tab'?'gaze':f.k}
function tickProc(){
  const act=S.cands.filter(c=>c.st==='active'&&c.i!==0);if(!act.length)return;const c=act[Math.floor(Math.random()*act.length)];
  if(Math.random()<.6){c.prog=Math.min(15,c.prog+1)}else{const ks=['gaze','voice','noface','gaze','light'];const k=ks[Math.floor(Math.random()*ks.length)];c.flags.unshift({k,t:Date.now(),c:+(.7+Math.random()*.28).toFixed(2)});c.risk=Math.min(99,c.risk+8+Math.floor(Math.random()*10))}
  save();rProc();
}
function act(c,a){
  const me=c.i===0,E=S.ex,nm=T(CAND[c.i][0],CAND[c.i][1]);
  S.log.unshift({t:Date.now(),c:c.id,a});
  if(a==='warn'){c.warn++;if(me&&(E.state==='running'||E.state==='paused'))E.warned++;toast('⚠️ '+T('Warning sent to ','Предупреждение отправлено: ')+nm,'gold')}
  if(a==='pause'){c.st='paused';if(me&&E.state==='running'){E.state='paused';E.pausedAt=Date.now()}toast('⏸ '+T('Paused: ','Приостановлен: ')+nm,'gold')}
  if(a==='resume'){c.st='active';if(me&&E.state==='paused'){E.paused+=Date.now()-E.pausedAt;E.state='running'}toast('▶ '+T('Resumed: ','Возобновлён: ')+nm)}
  if(a==='terminate'){c.st='terminated';if(me&&(E.state==='running'||E.state==='paused'))E.state='terminated';toast('⛔ '+T('Exam terminated: ','Экзамен прекращён: ')+nm,'bad')}
  if(a==='clear'){c.flags=[];c.risk=Math.max(3,Math.round(c.risk*.3));toast('✓ '+T('Flags dismissed as false positive','Флаги сняты как ложные'))}
  save();render();
}

  <div class="split"><div class="wall">${ordered.map(c=>{const p=stP(c),f=c.flags[0];return `<div class="tile ${c.i===S.sel?'sel':''} ${c.st==='active'||c.st==='paused'?(c.risk>=60?'r-high':c.risk>=30?'r-med':''):''}" data-c="${c.i}" role="button" tabindex="0"><div class="vid">${c.st==='terminated'?`<svg viewBox="0 0 160 100"><rect width="160" height="100" fill="#1a0d0d"/><text x="80" y="56" text-anchor="middle" fill="#ef5a5a" font-size="13" font-weight="700" font-family="Inter,sans-serif">${T('TERMINATED','СНЯТ')}</text></svg>`:camSvg(c.i,moodOf(c),1)}<div class="st">${c.i===0?`<span>${T('YOU','ВЫ')}</span>`:''}${c.st==='paused'?`<span class="a">⏸ ${T('PAUSED','ПАУЗА')}</span>`:''}${f&&c.st==='active'?`<span class="${FLAGS[f.k][2]==='bad'?'r':'a'}">${esc(T(FLAGS[f.k][0],FLAGS[f.k][1]))}</span>`:''}</div></div>

/* ---------- RESULTS ---------- */
function rRes(){
  const el=$('#v-res'),me=S.ex.state==='done'?S.ex.res.pc:null;
  const all=S.hist.concat(me!=null?[me]:[]),N=all.length,pass=S.pass;
  const bins=new Array(10).fill(0);all.forEach(s=>bins[Math.min(9,Math.floor(s/10))]++);
  const mean=all.reduce((a,b)=>a+b,0)/N,sorted=all.slice().sort((a,b)=>a-b),med=sorted[Math.floor(N/2)],pr=all.filter(s=>s>=pass).length/N*100;
  const sd=Math.sqrt(all.reduce((a,b)=>a+(b-mean)**2,0)/N);
  const W=600,H=240,pl=36,pb=28,pt=14,mx=Math.max(...bins),bw=(W-pl-8)/10,y=v=>H-pb-v/mx*(H-pb-pt);
  const ln=cssv('--line'),mu=cssv('--muted'),g=cssv('--gold');
  const svg=`<svg viewBox="0 0 ${W} ${H}">${[0,.25,.5,.75,1].map(f=>`<line x1="${pl}" x2="${W-8}" y1="${y(mx*f)}" y2="${y(mx*f)}" stroke="${ln}"/><text x="${pl-6}" y="${y(mx*f)+4}" text-anchor="end" font-size="10" fill="${mu}">${Math.round(mx*f)}</text>`).join('')}
   ${bins.map((b,i)=>{const x=pl+i*bw,ok=i*10>=pass,mine=me!=null&&Math.min(9,Math.floor(me/10))===i;return `<rect x="${x+3}" y="${y(b)}" width="${bw-6}" height="${H-pb-y(b)}" rx="4" fill="${ok?cssv('--mal'):cssv('--red')}" opacity="${mine?1:.75}" ${mine?`stroke="${g}" stroke-width="3"`:''}><title>${i*10}–${i*10+9}: ${b}</title></rect><text x="${x+bw/2}" y="${H-10}" text-anchor="middle" font-size="10" fill="${mu}">${i*10}</text>`}).join('')}
   <line x1="${pl+pass/10*bw}" x2="${pl+pass/10*bw}" y1="${pt-4}" y2="${H-pb}" stroke="${g}" stroke-width="2" stroke-dasharray="5 4"/><text x="${pl+pass/10*bw+5}" y="${pt+6}" font-size="11" font-weight="700" fill="${g}">${T('pass','порог')} ${pass}%</text>
   ${me!=null?`<text x="${pl+Math.min(9,Math.floor(me/10))*bw+bw/2}" y="${y(bins[Math.min(9,Math.floor(me/10))])-6}" text-anchor="middle" font-size="11" font-weight="800" fill="${g}">${T('you','вы')}</text>`:''}</svg>`;
  if(!S.results){const r=rng(99);S.results=CAND.map((n,i)=>({i,id:'C-'+(4801+i),score:i===0?null:Math.round(35+r()*60),time:Math.round(9+r()*11),flags:S.cands[i].flags.length,st:S.cands[i].st}));save()}
  const rows=S.results.map(r=>{const c=S.cands[r.i];const o={...r,st:c.st,flags:c.flags.length};if(r.i===0){o.score=me;o.time=S.ex.state==='done'?Math.round(S.ex.res.time/60):null}if(c.st==='terminated')o.score=null;return o});
  const q=S.rq.toLowerCase();let list=rows.filter(r=>!q||(CAND[r.i][0]+' '+CAND[r.i][1]+' '+r.id).toLowerCase().includes(q));
  const [sk,sdir]=S.rsort;list.sort((a,b)=>((a[sk]??-1)-(b[sk]??-1))*sdir);
  el.innerHTML=`<div class="kpis"><div class="card kpi"><div class="l">${T('Candidates scored','Оценено кандидатов')}</div><div class="v">${N.toLocaleString(loc())}</div><div class="d">${T('NSE-2025-06 · Mathematics','NSE-2025-06 · Математика')}</div></div>
   <div class="card kpi"><div class="l">${T('Pass rate','Доля сдавших')}</div><div class="v ${pr>=70?'ok-t':'warn-t'}">${pr.toFixed(1)}%</div><div class="d">${T('at pass mark','при пороге')} ${pass}%</div></div>
   <div class="card kpi"><div class="l">${T('Mean · median','Среднее · медиана')}</div><div class="v">${mean.toFixed(1)} · ${med}</div><div class="d">SD ${sd.toFixed(1)}</div></div>
   <div class="card kpi"><div class="l">${T('Your score','Ваш балл')}</div><div class="v ${me==null?'':me>=pass?'ok-t':'bad-t'}">${me==null?'—':me+'%'}</div><div class="d">${me==null?T('take the exam first','сначала сдайте экзамен'):T('percentile ','перцентиль ')+Math.round(all.filter(s=>s<me).length/N*100)}</div></div></div>
  <div class="grid2" style="margin-bottom:14px"><div class="card chart"><h3>${T('Score distribution','Распределение баллов')}<span class="sp"></span><span class="legend"><span><i style="background:var(--mal)"></i>${T('pass','сдал')}</span><span><i style="background:var(--red)"></i>${T('below pass','ниже порога')}</span></span></h3>${svg}</div>
   <div class="card"><h3>${T('Pass mark','Проходной балл')}</h3><div class="muted" style="font-size:13px;margin-bottom:8px">${T('Move the cut score to see the effect on the pass rate before publishing.','Сдвиньте порог и посмотрите, как изменится доля сдавших, до публикации.')}</div>
    <input type="range" id="pm" min="30" max="90" step="5" value="${pass}" style="width:100%;accent-color:var(--mal)"><div class="row" style="justify-content:space-between;font-size:13px"><span>30%</span><b class="mono" style="font-size:18px">${pass}%</b><span>90%</span></div>
    <dl class="facts" style="margin-top:12px"><dt>${T('Would pass','Сдадут')}</dt><dd>${all.filter(s=>s>=pass).length.toLocaleString(loc())}</dd><dt>${T('Would fail','Не сдадут')}</dt><dd>${all.filter(s=>s<pass).length.toLocaleString(loc())}</dd><dt>${T('Reliability (α)','Надёжность (α)')}</dt><dd>0.87</dd></dl>
    <button class="btn gold" id="pubR" style="margin-top:12px">${T('Publish results','Опубликовать результаты')}</button>${S.pub?`<div class="muted" style="font-size:12px;margin-top:6px">✓ ${T('Published at ','Опубликовано в ')}${fmtT(S.pub)} · ${T('pass mark','порог')} ${S.pubMark}%</div>`:''}</div></div>
  <div class="card"><h3>${T('Candidates · Hall A','Кандидаты · зал A')}<span class="sp"></span><input class="input" id="rq" style="max-width:220px" value="${esc(S.rq)}" data-en-ph="Search candidate…" data-ru-ph="Поиск кандидата…"><button class="btn sm" id="csv">⬇ CSV</button></h3>
   <div class="tw"><table><thead><tr><th>${T('Candidate','Кандидат')}</th>${[['score',T('Score','Балл')],['time',T('Time, min','Время, мин')],['flags',T('Flags','Флаги')]].map(c=>`<th class="srt" data-s="${c[0]}">${c[1]}${sk===c[0]?(sdir>0?' ▲':' ▼'):''}</th>`).join('')}<th>${T('Result','Итог')}</th></tr></thead><tbody>
   ${list.map(r=>`<tr${r.i===0?' class="sel"':''}><td><b>${T(CAND[r.i][0],CAND[r.i][1])}</b>${r.i===0?' <span class="pill gold">'+T('you','вы')+'</span>':''}<br><span class="muted mono" style="font-size:11px">${r.id}</span></td><td class="mono"><b>${r.score==null?'—':r.score+'%'}</b></td><td class="mono">${r.time??'—'}</td><td>${r.flags?`<span class="pill ${r.flags>1?'bad':'warn'}">${r.flags}</span>`:'<span class="muted">0</span>'}</td><td>${r.st==='terminated'?`<span class="pill bad">${T('Void','Аннулирован')}</span>`:r.score==null?`<span class="pill">${T('In progress','Сдаёт')}</span>`:r.score>=pass?`<span class="pill ok">${T('Pass','Сдал')}</span>`:`<span class="pill bad">${T('Fail','Не сдал')}</span>`}</td></tr>`).join('')||`<tr><td colspan="5" class="muted">${T('No candidates match','Не найдено')}</td></tr>`}</tbody></table></div></div>`;
  PT.apply(el);
  $('#pm',el).oninput=e=>{S.pass=+e.target.value;save();rRes()};
  $('#pubR',el).onclick=()=>{S.pub=Date.now();S.pubMark=S.pass;save();toast('✓ '+T('Results published to candidates and schools','Результаты опубликованы для кандидатов и школ'));rRes()};
  $$('[data-s]',el).forEach(h=>h.onclick=()=>{const k=h.dataset.s;S.rsort=[k,S.rsort[0]===k?-S.rsort[1]:-1];save();rRes()});
  const rq=$('#rq',el);rq.oninput=()=>{S.rq=rq.value;save();clearTimeout(rq._t);rq._t=setTimeout(()=>{rRes();const n=$('#rq');n.focus();n.setSelectionRange(n.value.length,n.value.length)},250)};
  $('#csv',el).onclick=()=>{const t=[['Candidate','ID','Score','Time','Flags','Result']].concat(rows.map(r=>[CAND[r.i][0],r.id,r.score??'',r.time??'',r.flags,r.st==='terminated'?'Void':r.score==null?'In progress':r.score>=pass?'Pass':'Fail']));
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));a.download='results_NSE-2025-06.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(T('CSV exported','CSV выгружен'))};
}

/* ---------- AUTH & BOOT ---------- */
$('#login').onclick=()=>{
  const u=$('#uid').value.trim(),p=$('#pwd').value.trim();
  if(!/^NAA-\d{4}-\d{6}$/i.test(u)&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u)){$('#aerr').textContent=T('ID format: NAA-YYYY-NNNNNN','Формат ID: NAA-ГГГГ-NNNNNN');$('#uid').classList.add('bad');return}
  if(p.length<6){$('#aerr').textContent=T('Access code must be at least 6 characters','Код доступа не короче 6 символов');$('#pwd').classList.add('bad');return}
  $('#aerr').textContent='';S.auth=true;save();render();toast('🔐 '+T('Identity verified · all roles unlocked','Личность подтверждена · открыты все роли'));
};
['uid','pwd'].forEach(k=>$('#'+k).addEventListener('input',e=>e.target.classList.remove('bad')));
$('#pwd').onkeydown=e=>{if(e.key==='Enter')$('#login').click()};
$('#logout').onclick=()=>{S.auth=false;save();render()};
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#reset').onclick=()=>{store.clear();S=seed();S.auth=true;closeModal();save();render();toast(T('Demo reset','Демо сброшено'))};
PT.onLang(()=>render());
document.addEventListener('DOMContentLoaded',()=>render());
})();
</script>
