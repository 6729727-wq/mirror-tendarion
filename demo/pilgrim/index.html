<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pilgrim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.app.hide,.loginwrap.hide{display:none}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;font-size:16px;flex:none}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.grow{flex:1}
.who{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:13px;display:flex;gap:10px;align-items:center}
.who .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1306;font-weight:800;flex:none;font-size:13px}
.who small{display:block;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.how>div>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--mal) 22%,transparent);color:var(--mal3);flex:none;font-size:13px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.input.bad{border-color:var(--red)}
select.input{appearance:auto}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.grid2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--text)}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--bg2);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.line{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.loginwrap{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 500px at 80% -10%,color-mix(in srgb,var(--mal) 18%,transparent),transparent),radial-gradient(800px 500px at 0% 110%,color-mix(in srgb,var(--gold) 12%,transparent),transparent)}
.lcard{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:26px;box-shadow:var(--shadow)}
.lcard h2{margin:14px 0 4px;font-size:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;margin:16px 0}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 1px 0 var(--line2)}
.hint{font-size:12px;color:var(--muted);background:var(--bg2);border:1px dashed var(--line2);border-radius:10px;padding:8px 10px;margin-top:12px}
/* booking */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;background:var(--bg2);cursor:pointer;color:var(--text)}
.day small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase}
.day b{font-size:18px;display:block}
.day i{display:block;height:4px;border-radius:4px;margin:4px 6px 0}
.day.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 16%,transparent)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:var(--panel);cursor:pointer;text-align:left;color:var(--text)}
.slot b{font-size:14px;display:block}
.slot small{font-size:11.5px;color:var(--muted)}
.slot .bar{height:5px;border-radius:5px;background:var(--line);margin-top:6px;overflow:hidden}
.slot .bar i{display:block;height:100%}
.slot.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.slot:disabled{opacity:.45;cursor:not-allowed}
.rit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rit button{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg2);text-align:left;cursor:pointer;color:var(--text)}
.rit button.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 14%,transparent)}
.rit button small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.party label{display:flex;gap:9px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;cursor:pointer;background:var(--bg2)}
.permit{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--bg2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.permit .g{flex:1;min-width:150px}
.permit b{display:block;font-size:13.5px}
.permit small{color:var(--muted);font-size:12px}
/* packages */
.pk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
.pcard.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pcard .hd{padding:14px;color:#fff;position:relative}
.pcard .hd small{opacity:.85;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.pcard .hd h4{margin:4px 0 0;font-size:17px}
.pcard .bd{padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px;flex:1}
.pcard .pr{font-size:22px;font-weight:800}
.pcard .ft{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.stars{color:var(--gold);letter-spacing:1px}
/* digital card */
.idc{max-width:380px;margin:0 auto;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line2);background:var(--panel)}
.idc .top{padding:16px 18px;background:linear-gradient(135deg,#0b4c3a,var(--mal2) 60%,#2a6b4f);color:#fff;position:relative;overflow:hidden}
.idc .top:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:18px solid rgba(255,255,255,.08)}
.idc .top small{opacity:.8;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.idc .bd{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;padding:14px 16px}
.idc .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;font-size:12.5px}
.idc .kv span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.idc .qr{display:flex;gap:14px;align-items:center;padding:12px 16px 16px;border-top:2px dashed var(--line2)}
.idc .qr .q{background:#fff;padding:6px;border-radius:10px;flex:none}
.cd{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.cd i{display:block;height:100%;background:var(--gold);transition:width 1s linear}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.chk .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none}
/* crowd */
.map svg{width:100%;height:auto;display:block}
.map .z{cursor:pointer;transition:opacity .15s}
.map .z:hover{opacity:.85}
.map text{pointer-events:none}
.scale{height:10px;border-radius:6px;background:linear-gradient(90deg,#1fae6b,#9fd23c,#f2c230,#f0802e,#e2403a);margin:6px 0 4px}
.alert{border-left:4px solid var(--amber);background:var(--bg2);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:8px}
.alert.bad{border-left-color:var(--red)}
.alert small{color:var(--muted);display:block;font-size:11.5px}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.25}}
input[type=range]{width:100%;accent-color:var(--mal)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid2e,.intro{grid-template-columns:minmax(0,1fr)}.pk{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
  .slots{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){.how,.rit{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}.pk{grid-template-columns:minmax(0,1fr)}.kpi .v{font-size:20px}.kpis{gap:10px}.lcard{padding:20px}.days{gap:4px}.day b{font-size:15px}.idc .bd{grid-template-columns:72px minmax(0,1fr)}}
</style>
</head>
<body data-demo-en="Pilgrim — pilgrimage journey platform" data-demo-ru="Pilgrim — платформа паломничества">
<div class="loginwrap hide" id="login"></div>
<div class="app hide" id="app">
  <aside class="side" id="side">
    <div class="brand"><b>🕋</b><div>Pilgrim<small data-en="Journey platform · Season 1447" data-ru="Платформа паломника · сезон 1447"></small></div></div>
    <div class="sec" data-en="Pilgrim" data-ru="Паломник"></div>
    <div id="navP"></div>
    <div class="sec" data-en="Authority" data-ru="Ведомство"></div>
    <div id="navA"></div>
    <div class="grow"></div>
    <div class="who" id="who"></div>
    <div class="row" style="margin-top:8px">
      <button class="btn sm" id="signout" style="flex:1;justify-content:center" data-en="Sign out" data-ru="Выйти"></button>
      <button class="btn sm" id="reset" style="flex:1;justify-content:center" data-en="Reset demo" data-ru="Сбросить демо"></button>
    </div>
  </aside>
  <main>
    <div class="head">
      <button class="btn sm menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <div class="sp"></div>
      <span class="pill ok" id="rolePill"></span>
    </div>
    <div class="intro">
      <div class="card"><h3><span data-en="How to try it" data-ru="Как попробовать"></span></h3>
        <div class="how">
          <div><b>1</b><span data-en="In <b>Permits</b> pick a day, a ritual and a time slot with free capacity, add companions and book. Then choose a <b>Package</b>." data-ru="В <b>Разрешениях</b> выберите день, обряд и слот со свободными местами, добавьте спутников и забронируйте. Затем выберите <b>Пакет</b>."></span></div>
          <div><b>2</b><span data-en="Open the <b>Digital card</b>: permits, health checks and a QR that refreshes every 15 s. Press SOS or share your location with the group leader." data-ru="Откройте <b>Цифровую карту</b>: разрешения, медпроверки и QR, обновляемый каждые 15 с. Нажмите SOS или поделитесь местом с руководителем группы."></span></div>
          <div><b>3</b><span data-en="Watch the live <b>Crowd map</b>, then in <b>Authority dashboard</b> approve or flag permits, close a slot and broadcast an alert." data-ru="Следите за живой <b>Картой толпы</b>, затем в <b>Панели ведомства</b> одобряйте или помечайте разрешения, закрывайте слот и рассылайте оповещение."></span></div>
        </div></div>
      <div class="card"><dl class="facts">
        <dt data-en="Tender" data-ru="Тендер"></dt><dd data-en="Pilgrimage journey platform" data-ru="Платформа паломничества"></dd>
        <dt data-en="Year · budget" data-ru="Год · бюджет"></dt><dd>2025 · $300M</dd>
        <dt data-en="Client" data-ru="Заказчик"></dt><dd data-en="Ministry of Pilgrimage Affairs (fictional)" data-ru="Министерство по делам паломничества (вымышл.)"></dd>
        <dt data-en="Stack" data-ru="Стек"></dt><dd>permits · crowd management · digital ID</dd>
      </dl></div>
    </div>
    <section class="view" id="v-book"></section>
    <section class="view" id="v-pkg"></section>
    <section class="view" id="v-card"></section>
    <section class="view" id="v-crowd"></section>
    <section class="view" id="v-auth"></section>
  </main>
</div>
<div class="toasts" id="toasts"></div>
<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru);
const L=a=>a?a[PT.lang==='ru'?1:0]:'';
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

let timers=[];const clearT=()=>{timers.forEach(clearInterval);timers=[]};

const BASE=new Date('2026-12-01T00:00:00');

const fmtDay=i=>dayDate(i).toLocaleDateString(loc(),{weekday:'short',day:'numeric',month:'short'});
const RITES={umrah:{n:['Umrah','Умра'],d:['Grand Mosque · Tawaf & Sa’i','Заповедная мечеть · таваф и сай'],cap:1800,dur:3},rawdah:{n:['Rawdah visit','Посещение Рауды'],d:['Prophet’s Mosque · 30 min','Мечеть Пророка · 30 мин'],cap:420,dur:.5},prayer:{n:['Friday prayer area','Пятничный намаз'],d:['Reserved courtyard section','Выделенная часть двора'],cap:2600,dur:2}};

const PKG=[
 {id:'eco',tier:['Economy','Эконом'],n:['Al-Safa Basic','Аль-Сафа Базовый'],price:1450,hotel:3,dist:1900,room:4,meals:['Breakfast','Завтрак'],bus:['Shared shuttle','Общий шаттл'],nights:7,guide:['Group, AR/EN','Групповой, AR/EN'],c:'#2f7d6a'},

 {id:'fam',tier:['Family','Семейный'],n:['Ajyad Family','Аджьяд Семейный'],price:2950,hotel:4,dist:600,room:5,meals:['Half board','Полупансион'],bus:['A/C coach','Автобус с кондиционером'],nights:9,guide:['Family group','Семейная группа'],c:'#c06a3a'},

}

function nav(){
  const mk=g=>VIEWS.filter(v=>v[4]===g).map(v=>{let x='';
    if(v[0]==='book'){const n=S.my.filter(p=>p.st!=='cancelled').length;if(n)x=`<span class="cnt">${n}</span>`}
    if(v[0]==='auth'){const n=S.permits.filter(p=>p.st==='pending').length;if(n)x=`<span class="cnt">${n}</span>`}
    if(v[0]==='crowd'){const n=ZONES.filter(z=>S.dens[z.id]>=4).length;if(n)x=`<span class="cnt" style="background:var(--red);color:#fff">${n}</span>`}

  $('#navP').innerHTML=mk('P');$('#navA').innerHTML=mk('A');

function go(v){S.view=v;save();$('#side').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){
  clearT();

  return `<svg width="${px}" height="${px}" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path fill-rule="evenodd" fill="#0b1512" d="${fin(0,0)}${fin(n-7,0)}${fin(0,n-7)}${d}"/></svg>`}

  const issued=1284300+P.filter(p=>p.st==='approved').length;
  const slotsToday=SLOT_H.map((h,s)=>({s,u:used(0,'umrah',s)}));
  el.innerHTML=`<div class="kpis"><div class="card kpi"><div class="l">${T('Permits issued (season)','Выдано разрешений (сезон)')}</div><div class="v">${num(issued)}</div><div class="d">+${num(18240)} ${T('today','сегодня')}</div></div>
   <div class="card kpi"><div class="l">${T('Pending review','На проверке')}</div><div class="v" style="color:var(--amber)">${P.filter(p=>p.st==='pending').length}</div><div class="d">${T('auto-approve if risk < 30','автоодобрение при риске < 30')}</div></div>
   <div class="card kpi"><div class="l">${T('Flagged','Помечено')}</div><div class="v" style="color:var(--red)">${P.filter(p=>p.st==='flagged').length}</div><div class="d">${T('duplicate ID / visa mismatch','дубликат / несоответствие визы')}</div></div>
   <div class="card kpi"><div class="l">${T('No-show rate','Доля неявок')}</div><div class="v">4.7%</div><div class="d">${T('slots re-released automatically','слоты освобождаются сами')}</div></div></div>
  <div class="grid2"><div class="stack"><div class="card chart"><h3>${T('Pilgrims on site by hour (today)','Паломники на территории по часам (сегодня)')}</h3>${hourChart()}</div>
   <div class="card"><h3>${T('Permit queue','Очередь разрешений')}<span class="sp"></span><div class="chips">${[['all','All','Все'],['pending','Pending','Ожидают'],['flagged','Flagged','Помечены'],['approved','Approved','Одобрены']].map(c=>`<button class="chip ${af===c[0]?'on':''}" data-af="${c[0]}">${T(c[1],c[2])}</button>`).join('')}</div></h3>
    <div class="tw"><table><thead><tr><th>${T('Permit','Разрешение')}</th><th>${T('Pilgrim','Паломник')}</th><th>${T('Ritual · slot','Обряд · слот')}</th><th>${T('Party','Группа')}</th><th>${T('Risk','Риск')}</th><th>${T('Status','Статус')}</th><th></th></tr></thead><tbody>
    ${list.map(p=>`<tr><td class="mono" style="font-size:12px">${p.id}</td><td><b>${esc(L(p.name))}</b><div class="muted" style="font-size:12px">${esc(p.nat)}</div></td><td>${L(RITES[p.rite].n)}<div class="muted" style="font-size:12px">${fmtDay(p.day)} · ${SLOT_H[p.slot]}</div></td><td>${p.party}</td>
     <td><span class="pill ${p.risk>=60?'bad':p.risk>=30?'warn':'ok'}">${p.risk}</span></td><td><span class="pill ${p.st==='approved'?'ok':p.st==='pending'?'warn':'bad'}">${stN(p.st)}</span></td>
     <td style="white-space:nowrap">${p.st==='pending'||p.st==='flagged'?`<button class="btn sm pri" data-ok="${p.id}">✓</button> `:''}${p.st==='pending'?`<button class="btn sm" data-fl="${p.id}">⚑</button> `:''}${p.st==='approved'?`<button class="btn sm danger" data-rv="${p.id}">${T('Revoke','Отозвать')}</button>`:''}</td></tr>`).join('')||`<tr><td colspan="7" class="muted">${T('Nothing here','Пусто')}</td></tr>`}</tbody></table></div>
    <div class="row" style="margin-top:10px"><button class="btn sm" id="bulk">${T('Auto-approve low risk','Одобрить низкий риск')}</button></div></div></div>
  <div class="stack"><div class="card"><h3>${T('Nationalities','Страны')}</h3>${natDonut()}</div>
   <div class="card"><h3>${T('Umrah slots today','Слоты Умры сегодня')}<span class="sp"></span><span class="muted" style="font-size:12px;font-weight:500">${fmtDay(0)}</span></h3>
    ${slotsToday.map(x=>{const cl=isClosed(0,'umrah',x.s),p=x.u/RITES.umrah.cap;return `<div class="line" style="align-items:center"><span class="mono" style="width:46px">${SLOT_H[x.s]}</span><div style="flex:1;height:7px;border-radius:6px;background:var(--line);overflow:hidden"><i style="display:block;height:100%;width:${Math.min(100,p*100)}%;background:${capCol(cl?1:p)}"></i></div><span style="width:40px;text-align:right;font-size:12px">${Math.round(p*100)}%</span><button class="btn sm ${cl?'gold':''}" data-cl="${x.s}" style="padding:3px 9px">${cl?T('Open','Открыть'):T('Close','Закрыть')}</button></div>`}).join('')}</div>
   <div class="card"><h3>📣 ${T('Broadcast alert','Разослать оповещение')}</h3><textarea class="input" id="bc" rows="3" style="resize:vertical">${T('Heat advisory: avoid the open courtyards 12:00–15:00. Water points at Gates 1, 79, 94.','Жара: избегайте открытых дворов 12:00–15:00. Вода у ворот 1, 79, 94.')}</textarea>
    <div class="row" style="margin-top:8px"><select class="input" id="bcA" style="flex:1;min-width:0"><option value="all">${T('All pilgrims on site','Все паломники на месте')}</option><option value="mataf">${T('Within 300 m of Mataf','В 300 м от Матафа')}</option><option value="id">${T('Indonesian groups','Группы из Индонезии')}</option></select><button class="btn pri sm" id="bcGo">${T('Send','Отправить')}</button></div></div></div></div>`;
  $$('[data-af]',el).forEach(x=>x.onclick=()=>{af=x.dataset.af;rAuth()});
  const upd=(id,st,m,c)=>{const p=S.permits.find(x=>x.id===id);p.st=st;const mine=S.my.find(x=>x.id===id);if(mine)mine.st=st==='revoked'?'cancelled':st;save();nav();rAuth();toast(id+' '+m,c)};
  $$('[data-ok]',el).forEach(x=>x.onclick=()=>upd(x.dataset.ok,'approved',T('approved','одобрено'),'gold'));
  $$('[data-fl]',el).forEach(x=>x.onclick=()=>{const p=S.permits.find(y=>y.id===x.dataset.fl);p.risk=Math.max(p.risk,65);upd(p.id,'flagged',T('flagged for manual check','помечено для ручной проверки'),'bad')});
  $$('[data-rv]',el).forEach(x=>x.onclick=()=>upd(x.dataset.rv,'revoked',T('revoked · holder notified','отозвано · владелец уведомлён'),'bad'));
  $('#bulk').onclick=()=>{let n=0;S.permits.forEach(p=>{if(p.st==='pending'&&p.risk<30){p.st='approved';n++}});save();nav();rAuth();toast(n?T(n+' low-risk permits approved',n+' разрешений с низким риском одобрено'):T('No low-risk permits pending','Нет ожидающих с низким риском'),n?'gold':'')};
  $$('[data-cl]',el).forEach(x=>x.onclick=()=>{const k='0|umrah|'+x.dataset.cl;const was=S.closed.includes(k);S.closed=was?S.closed.filter(y=>y!==k):S.closed.concat(k);save();rAuth();toast(was?T('Slot reopened for booking','Слот снова открыт'):T('Slot closed · new bookings blocked','Слот закрыт · новые брони запрещены'),was?'':'bad')});
  $('#bcGo').onclick=()=>{const m=$('#bc').value.trim();if(m.length<10){$('#bc').classList.add('bad');toast(T('Message is too short','Сообщение слишком короткое'),'bad');return}
    const aud=$('#bcA').value;const n=aud==='all'?1284000:aud==='mataf'?18400:236000;
    S.alerts.unshift({z:'mataf',ts:Date.now(),t:new Date().toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit'}),msg:[m,m]});save();toast(T('Alert delivered to '+num(n)+' devices','Оповещение доставлено на '+num(n)+' устройств'),'gold')};
  timers.push(setInterval(()=>{if(S.view!=='auth')return;const h=new Date().getHours();S.hourly[h]+=Math.round(Math.random()*400);save();const c=$('#v-auth .chart');if(c)c.innerHTML=`<h3>${T('Pilgrims on site by hour (today)','Паломники на территории по часам (сегодня)')}</h3>`+hourChart()},3000));
}

/* ---------- wiring ---------- */
$('#menuBtn').onclick=e=>{e.stopPropagation();$('#side').classList.toggle('open')};
document.addEventListener('click',e=>{const s=$('#side');if(s.classList.contains('open')&&!s.contains(e.target)&&e.target.id!=='menuBtn')s.classList.remove('open')});
$('#reset').onclick=()=>{store.clear();const u=S.user;S=seed();S.user=u;S.view=u&&u.role==='auth'?'auth':'book';save();render();toast(T('Demo reset','Демо сброшено'))};
$('#signout').onclick=()=>{S.user=null;save();render();toast(T('Signed out','Вы вышли'))};
PT.onLang(()=>render());
})();
</script>
