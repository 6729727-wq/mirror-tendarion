<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CivicOne — Tendarion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
html{font-size:16px} html.fs1{font-size:18px} html.fs2{font-size:20.5px}
body{font-size:.94rem;overflow-x:hidden}
.btn{font-size:.875rem} .pill{font-size:.75rem}
:root.hc.hc{--bg:#000;--bg2:#000;--panel:#000;--panel2:#111;--line:#fff;--line2:#fff;--text:#fff;--muted:#fff;--dim:#e5e5e5;--mal:#00c896;--mal2:#008f6a;--mal3:#4dffc9;--gold:#ffd84a;--gold2:#ffe680;--red:#ff6b6b;color-scheme:dark}
:root.hc.hc a{text-decoration:underline}
:root.hc.hc .btn.pri{background:#ffd84a;color:#000}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--panel);border-bottom:1px solid var(--line)}
.hdr{display:flex;align-items:center;gap:16px;min-height:66px}
.brand{display:flex;gap:10px;align-items:center;color:var(--text)} .brand:hover{text-decoration:none}
.brand b{font-size:1.1rem;display:block;line-height:1.1;letter-spacing:-.01em} .brand small{color:var(--muted);font-size:.72rem}
.nav{display:flex;gap:4px;flex:1}
.nav a{padding:8px 13px;border-radius:999px;color:var(--muted);font-weight:600;font-size:.88rem;white-space:nowrap}
.nav a:hover{color:var(--text);text-decoration:none} .nav a.on{color:var(--text);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.hact{display:flex;gap:8px;align-items:center;margin-left:auto}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);display:grid;place-items:center;cursor:pointer;position:relative;font-weight:800;font-size:.8rem;flex:none}
.ib:hover{border-color:var(--mal)}
.ib .cnt{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:.65rem;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1306;font-weight:800;display:grid;place-items:center;cursor:pointer;border:0;flex:none}
.av.lg{width:64px;height:64px;font-size:1.3rem}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media(max-width:860px){.hdr{flex-wrap:wrap;gap:10px;padding-top:8px}.nav{order:3;flex-basis:100%;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.signtxt{display:none}}
html,body{overflow-x:clip}
.hero{position:relative;padding:54px 0 36px}
.hero::before{content:"";position:absolute;inset:-40px -200px auto;height:420px;background:radial-gradient(500px 240px at 20% 30%,color-mix(in srgb,var(--mal) 22%,transparent),transparent 70%),radial-gradient(420px 220px at 85% 10%,color-mix(in srgb,var(--gold) 16%,transparent),transparent 70%);z-index:-1;pointer-events:none}
.hero h1{font-size:clamp(1.85rem,4.6vw,3.1rem);line-height:1.07;margin:14px 0 12px;letter-spacing:-.025em;max-width:780px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--mal3),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);font-size:1.05rem;max-width:640px;margin:0}
.sbox{position:relative;max-width:740px;margin-top:26px}
.sfield{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line2);border-radius:18px;padding:6px 6px 6px 16px;box-shadow:var(--shadow)}
.sfield:focus-within{border-color:var(--mal)}
.sfield input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:1.05rem;padding:10px 0}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);z-index:60;overflow:hidden}
.sugg button{display:flex;width:100%;gap:12px;align-items:center;padding:11px 14px;border:0;background:transparent;text-align:left;cursor:pointer}
.sugg button.on,.sugg button:hover{background:var(--panel2)}
.sugg .empty{padding:16px;color:var(--muted)}
mark{background:color-mix(in srgb,var(--gold) 35%,transparent);color:inherit;border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.82rem;color:var(--muted)}
.chip:hover,.chip.on{color:var(--text);border-color:var(--mal);background:color-mix(in srgb,var(--mal) 12%,transparent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:34px}
.stat{padding:14px 16px;border-left:2px solid var(--mal)} .stat b{font-size:1.5rem;display:block;letter-spacing:-.02em} .stat span{color:var(--muted);font-size:.82rem}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
.sec{margin:40px 0}
.sech{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sech h2{font-size:1.35rem;margin:0;letter-spacing:-.01em} .sech p{margin:2px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{display:flex;gap:13px;align-items:flex-start;text-align:left;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:.15s;width:100%}
.tile:hover{border-color:var(--mal);transform:translateY(-2px)}
.tile b{display:block;margin-bottom:2px} .tile small{color:var(--muted);font-size:.8rem;line-height:1.4;display:block}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--mal) 14%,transparent);color:var(--mal3);flex:none}
.ico.g{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold2)}
.ico svg{width:22px;height:22px}
.welcome{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,color-mix(in srgb,var(--mal) 16%,var(--panel)),var(--panel));border:1px solid var(--line2);border-radius:var(--r2);padding:18px}
.welcome .sp{flex:1;min-width:200px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px} @media(max-width:760px){.steps3{grid-template-columns:1fr}}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);font-weight:800;color:var(--gold2);margin-bottom:8px}
.cab{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;margin:28px 0}
@media(max-width:860px){.cab{grid-template-columns:minmax(0,1fr)}}
.side .card{padding:14px} .side nav{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.side nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--muted);font-weight:600}
.side nav a.on,.side nav a:hover{background:var(--panel2);color:var(--text);text-decoration:none}
.side nav a .pill{margin-left:auto}
@media(max-width:860px){.side nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}.side nav a{white-space:nowrap}.side nav a .pill{display:none}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px} @media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer} .kpi b{font-size:1.45rem;display:block} .kpi span{color:var(--muted);font-size:.8rem}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;gap:12px;align-items:center;padding:13px 0;flex-wrap:wrap}
.li .grow{flex:1;min-width:180px}
.li small{color:var(--muted);display:block;font-size:.8rem}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 16px 30px;color:var(--dim)}
.tl li::before{content:"";position:absolute;left:7px;top:6px;width:12px;height:12px;border-radius:50%;border:2px solid var(--line2);background:var(--panel)}
.tl li::after{content:"";position:absolute;left:13px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.done{color:var(--text)} .tl li.done::before{background:var(--mal);border-color:var(--mal)} .tl li.done::after{background:var(--mal)}
.tl li.cur{color:var(--text);font-weight:600} .tl li.cur::before{border-color:var(--gold);background:var(--gold);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 25%,transparent);animation:pulse 1.4s infinite}
.tl small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
@keyframes pulse{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--gold) 0%,transparent)}}
.app{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--panel);margin-bottom:12px}
.app summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;flex-wrap:wrap} .app summary::-webkit-details-marker{display:none}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:10px} .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mal),var(--mal3));transition:width .6s}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.doc{border-radius:18px;padding:18px;color:#fff;min-height:160px;position:relative;overflow:hidden;cursor:pointer;border:0;text-align:left;background:linear-gradient(135deg,#118a66,#063a2c);box-shadow:0 10px 30px rgba(0,0,0,.25);transition:.2s;display:flex;flex-direction:column}
.doc:hover{transform:translateY(-3px) rotate(-.4deg)}
.doc::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.doc.gold{background:linear-gradient(135deg,#b48a3a,#4a3410)} .doc.blue{background:linear-gradient(135deg,#2f6fb8,#0d2848)} .doc.vio{background:linear-gradient(135deg,#6d4fc4,#24124f)} .doc.gray{background:linear-gradient(135deg,#4c5d57,#1b2421)}
.doc small{opacity:.75;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em} .doc b{font-size:1.1rem;margin:4px 0 auto} .doc .mono{font-size:.85rem;opacity:.9;margin-top:14px}
.wz{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;margin:28px 0}
@media(max-width:860px){.wz{grid-template-columns:minmax(0,1fr)}.wsteps{display:none}}
.wsteps ol{list-style:none;margin:0;padding:0;counter-reset:s}
.wsteps li{counter-increment:s;display:flex;gap:10px;align-items:center;padding:9px 0;color:var(--dim);font-weight:600;cursor:default}
.wsteps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);font-size:.8rem;flex:none}
.wsteps li.on{color:var(--text)} .wsteps li.on::before{background:var(--mal);color:#fff;border-color:var(--mal)}
.wsteps li.ok{color:var(--muted);cursor:pointer} .wsteps li.ok::before{content:"✓";background:color-mix(in srgb,var(--mal) 18%,transparent);color:var(--mal3);border-color:var(--mal)}
.mprog{display:none;margin-bottom:14px} @media(max-width:860px){.mprog{display:block}}
.field{margin-bottom:18px} .lbl{display:block;font-weight:600;margin-bottom:6px;font-size:.9rem} .hint{color:var(--muted);font-size:.8rem;margin:-2px 0 6px}
.err{color:var(--red);font-size:.8rem;margin-top:5px;display:flex;gap:6px;align-items:center}
.field.bad .input,.field.bad .drop{border-color:var(--red)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;cursor:pointer;margin-bottom:8px;background:var(--bg2)}
.opt.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 10%,transparent)} .opt input{margin-top:3px;accent-color:var(--mal)}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:18px;text-align:center;cursor:pointer;display:block;background:var(--bg2);transition:.15s}
.drop:hover,.drop.over{border-color:var(--mal)} .drop input{display:none} .drop.has{border-style:solid;border-color:var(--mal);text-align:left}
.rev{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:8px 16px;font-size:.9rem} .rev dt{color:var(--muted)} .rev dd{margin:0;word-break:break-word}
.rvh{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)} .rvh b{font-size:.95rem}
.linkb{background:none;border:0;color:var(--mal3);cursor:pointer;font-weight:600;padding:0}
.errsum{border:1px solid var(--red);background:color-mix(in srgb,var(--red) 10%,transparent);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.88rem}
.success{text-align:center;padding:10px 0 4px} .success .ok{width:68px;height:68px;border-radius:50%;background:var(--mal);display:grid;place-items:center;margin:0 auto 12px;color:#fff;animation:pop .4s}
.bign{font-family:var(--mono);font-size:1.45rem;font-weight:700;color:var(--gold2);letter-spacing:.04em}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:2000;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:20px;max-width:540px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:22px;box-shadow:var(--shadow);animation:pop .22s;position:relative}
.mbox h3{margin:0 0 6px;font-size:1.2rem} .mx{position:absolute;right:12px;top:12px;border:0;background:var(--panel2);width:32px;height:32px;border-radius:50%;cursor:pointer}
@keyframes pop{from{transform:scale(.94);opacity:0}} @keyframes fade{from{opacity:0}}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:inline-block;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
#toasts{position:fixed;right:16px;bottom:16px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:360px}
@media(max-width:500px){#toasts{left:16px;max-width:none}}
.toast{background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--mal);border-radius:12px;padding:11px 14px;box-shadow:var(--shadow);font-size:.88rem;animation:pop .25s;display:flex;gap:10px}
.toast.gold{border-left-color:var(--gold)}
.pop{position:absolute;right:16px;top:70px;z-index:900;width:min(360px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.pop[hidden]{display:none}
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:6px 10px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--mal);color:#fff}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line2);border:0;position:relative;cursor:pointer;flex:none} .sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s} .sw.on{background:var(--mal)} .sw.on::after{left:21px}
.note{display:flex;gap:10px;padding:10px 0} .note .d{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:7px;flex:none} .note.read .d{background:transparent}
.foot{border-top:1px solid var(--line);margin-top:56px;padding:28px 0 40px;color:var(--muted);font-size:.85rem}
.foot .wrap{display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.sla{display:inline-flex;align-items:center;gap:8px;border:1px solid color-mix(in srgb,var(--mal) 50%,transparent);border-radius:999px;padding:6px 12px;cursor:pointer;background:color-mix(in srgb,var(--mal) 8%,transparent);color:var(--text);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mal3);box-shadow:0 0 0 0 var(--mal3);animation:beat 2s infinite}
@keyframes beat{70%{box-shadow:0 0 0 8px transparent}}
.upt{display:flex;gap:2px;height:38px;align-items:stretch;margin:12px 0} .upt i{flex:1;border-radius:2px;background:var(--mal)} .upt i.w{background:var(--amber)} .upt i.b{background:var(--red)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin:28px 0} @media(max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:520px){.g2{grid-template-columns:1fr}}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.news{display:grid;grid-template-columns:repeat(3,1fr);gap:12px} @media(max-width:860px){.news{grid-template-columns:1fr}}
.news .card small{color:var(--gold2);font-weight:700;font-size:.75rem}
h1.pg{font-size:clamp(1.5rem,3.5vw,2.1rem);margin:30px 0 4px;letter-spacing:-.02em}
canvas.qr{background:#fff;border-radius:10px;padding:8px;display:block;margin:12px auto;image-rendering:pixelated}
</style>
</head>
<body data-demo-en="CivicOne — national e-services portal" data-demo-ru="CivicOne — единый портал госуслуг">
<header class="top">

<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=(en,ru)=>PT.t(en,ru), L=a=>Array.isArray(a)?(PT.lang==='ru'?a[1]:a[0]):(a||'');
const sleep=ms=>new Promise(r=>setTimeout(r,ms)), lat=()=>sleep(300+Math.random()*600);
const KEY='civicone-v1', DAY=864e5;
let S=null; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=Object.assign({user:null,apps:[],paid:{},notes:[],appeals:[],fs:0,hc:false},S||{});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const hl=(txt,q)=>{q=q.trim().split(/\s+/)[0];if(!q)return esc(txt);const i=txt.toLowerCase().indexOf(q.toLowerCase());return i<0?esc(txt):esc(txt.slice(0,i))+'<mark>'+esc(txt.slice(i,i+q.length))+'</mark>'+esc(txt.slice(i+q.length))};

function qr(cv,seed){
 const N=25,sz=6,ctx=cv.getContext('2d');cv.width=cv.height=N*sz;let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;
 const r=()=>(h=(h*1664525+1013904223)>>>0)/4294967296;ctx.fillStyle='#fff';ctx.fillRect(0,0,N*sz,N*sz);ctx.fillStyle='#0d1f19';
 const fin=(x,y)=>{ctx.fillRect(x*sz,y*sz,7*sz,7*sz);ctx.fillStyle='#fff';ctx.fillRect((x+1)*sz,(y+1)*sz,5*sz,5*sz);ctx.fillStyle='#0d1f19';ctx.fillRect((x+2)*sz,(y+2)*sz,3*sz,3*sz)};
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){if((x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9))continue;if(r()<.5)ctx.fillRect(x*sz,y*sz,sz,sz)}
 fin(0,0);fin(N-7,0);fin(0,N-7);
}

  <div class="field"><label class="lbl" for="ap_l">${T('Landmark (optional)','Ориентир (необязательно)')}</label><input class="input" id="ap_l" name="land" placeholder="${T('e.g. opposite the pharmacy','Например: напротив аптеки')}"></div>
  <div class="field"><span class="lbl">${T('Photo (optional)','Фото (необязательно)')}</span><label class="drop" id="apdrop"><input type="file" accept="image/*" id="apfile">${ic('upload')}<div><b>${T('Add a photo','Добавить фото')}</b></div></label></div>
  <button class="btn pri" type="submit" id="apsub" style="width:100%;justify-content:center;padding:12px">${T('Send appeal','Отправить обращение')}</button>
  <p class="muted" style="font-size:.78rem;margin:10px 0 0">${S.user?T('Sent as ','Отправляется от имени ')+esc(L(USER.first)+' '+L(USER.last)):T('You can send anonymously or sign in to get notifications.','Можно отправить анонимно или войти, чтобы получать уведомления.')}</p></form>
 <aside><div class="card"><b>${T('Track an appeal','Отследить обращение')}</b><div class="row" style="margin-top:10px;flex-wrap:nowrap"><input class="input mono" id="trk" placeholder="AP-26-104233"><button class="btn" data-act="track">${T('Track','Найти')}</button></div><div id="trkres"></div></div>
  <h3 style="margin:20px 0 10px">${T('My appeals','Мои обращения')}</h3>${S.appeals.map(a=>{const st=astageOf(a);return `<details class="app" ${AP.open===a.id?'open':''}><summary><span class="ico g">${ic(a.cat==='road'?'car':a.cat==='light'?'bolt':'chat')}</span><div style="flex:1;min-width:140px"><b>${esc(a.title)}</b><small class="muted" style="display:block"><span class="mono">${a.num}</span> · ${L(catOf(a.cat)[1])}</small></div><span class="pill ${st>=3?'ok':'warn'}" data-apl="${a.id}">${L(AST[st])}</span></summary><small class="muted" style="display:block;margin:8px 0">📍 ${esc(a.addr)}</small><div data-atl="${a.id}">${tlHtml(a,1)}</div></details>`}).join('')}</aside></div>`;
}
function bindAppeals(){
 const f=$('#apf');if(!f)return;
 $('#ap_d').oninput=()=>$('#apc').textContent=$('#ap_d').value.length;
 $('#apfile').onchange=e=>{const fl=e.target.files[0];if(fl){$('#apdrop').classList.add('has');$('#apdrop').lastElementChild.innerHTML='<b>📎 '+esc(fl.name)+'</b> <small class="muted">'+(fl.size/1024).toFixed(0)+' KB</small>'}};
 f.onsubmit=async ev=>{ev.preventDefault();const v={title:$('#ap_t').value.trim(),desc:$('#ap_d').value.trim(),street:$('#ap_s').value.trim(),city:$('#ap_c').value,land:$('#ap_l').value.trim()};
  const e={};if(!AP.cat)e.cat=['Choose a category','Выберите категорию'];if(v.title.length<5)e.title=['At least 5 characters','Минимум 5 символов'];if(v.desc.length<20)e.desc=['Describe in at least 20 characters','Опишите хотя бы в 20 символах'];if(!v.street)e.street=REQ;
  if(Object.keys(e).length){AP.errs=e;const keep=v;render();$('#ap_t').value=keep.title;$('#ap_d').value=keep.desc;$('#ap_s').value=keep.street;$('#ap_c').value=keep.city;$('#ap_l').value=keep.land;$('#apc').textContent=keep.desc.length;return}
  $('#apsub').disabled=true;$('#apsub').innerHTML='<span class="spin"></span> '+T('Sending…','Отправка…');await lat();await lat();
  const city=CITIES.find(c=>c[0]===v.city);const a={id:'p'+Date.now(),num:newNum('AP'),cat:AP.cat,title:v.title,addr:v.street+', '+city[1]+(v.land?' ('+v.land+')':''),created:Date.now(),iv:9000,seen:0};
  S.appeals.unshift(a);save();AP={cat:'',errs:{},open:a.id};note(`Appeal ${a.num} registered and sent to ${catOf(a.cat)[2][0]}.`,`Обращение ${a.num} зарегистрировано и направлено: ${catOf(a.cat)[2][1]}.`);render()};
}

/* ---------- render & events ---------- */
function render(){
 const [v,a]=route();let html='';
 if(v==='home')html=vHome();else if(v==='catalog')html=vCatalog(a);else if(v==='cabinet')html=vCabinet(a);else if(v==='apply')html=vApply(a);else if(v==='appeals')html=vAppeals();else html=vHome();
 $('#main').innerHTML=html;hdr();
 if($('#q'))$('#q').oninput=()=>{sIdx=0;suggest()};
 if($('#cq'))$('#cq').oninput=e=>{catQ=e.target.value;const sit=route()[1];const list=(catQ.trim()?searchSv(catQ):SV).filter(s=>!sit||s.s===sit);$('#cgrid').innerHTML=list.length?list.map(tile).join(''):`<div class="empty">${T('No services match.','Ничего не найдено.')}</div>`};
 bindAppeals();applyA11y();
}
window.addEventListener('hashchange',()=>{const r=route();if(r[0]==='apply'&&W.svc!==r[1])wReset(r[1]);render();scrollTo(0,0)});
$('#main').addEventListener('keydown',e=>{if(e.target.id!=='q')return;const items=document.querySelectorAll('#sugg button');
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!items.length)return;sIdx=(sIdx+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((b,i)=>b.classList.toggle('on',i===sIdx))}
 else if(e.key==='Enter'){e.preventDefault();if(items[sIdx])svcModal(items[sIdx].dataset.arg);else if(e.target.value.trim()){catQ=e.target.value;location.hash='#/catalog'}}});
document.addEventListener('click',e=>{if(!e.target.closest('.sbox')&&$('#sugg'))$('#sugg').hidden=true;
 if(!e.target.closest('#a11y,[data-act="a11y"]'))$('#a11y').hidden=true;if(!e.target.closest('#notes,[data-act="notes"]'))$('#notes').hidden=true});
$('#main').addEventListener('change',e=>{const t=e.target,id=t.dataset.f;if(!id)return;
 if(t.type==='file'){const fl=t.files[0];if(!fl)return;if(fl.size>10*1024*1024){W.errs[id]=['File is larger than 10 MB','Файл больше 10 МБ'];render();return}W.data[id]={name:fl.name,size:fl.size}}
 else if(t.type==='checkbox')W.data[id]=t.checked;else W.data[id]=t.value;
 delete W.errs[id];if(t.type!=='text'&&t.type!=='email'&&t.type!=='number'&&t.tagName!=='TEXTAREA'){const y=scrollY;render();scrollTo(0,y)}});
$('#main').addEventListener('input',e=>{const t=e.target,id=t.dataset.f;if(!id||t.type==='file'||t.type==='radio'||t.type==='checkbox')return;W.data[id]=t.value;if(W.errs[id]){delete W.errs[id];const fl=$('#fld_'+id);if(fl){fl.classList.remove('bad');const er=fl.querySelector('.err');if(er)er.remove()}}});
['dragover','dragleave','drop'].forEach(ev=>$('#main').addEventListener(ev,e=>{const d=e.target.closest('[data-drop]');if(!d)return;e.preventDefault();d.classList.toggle('over',ev==='dragover');
 if(ev==='drop'&&e.dataTransfer.files[0]){const fl=e.dataTransfer.files[0];W.data[d.dataset.drop]={name:fl.name,size:fl.size};delete W.errs[d.dataset.drop];render()}}));
const ACT={
 go:a=>{location.hash=a},close:closeModal,svc:svcModal,signin:a=>signIn(a==='cab'?()=>{location.hash='#/cabinet';render()}:null),doSign,signout:(a,b,e)=>{e.preventDefault();signOut()},
 apply:a=>{closeModal();wReset(a);if(location.hash==='#/apply/'+a)render();else location.hash='#/apply/'+a},
 newApp:a=>{wReset(a);render()},
 q:a=>{const q=$('#q');q.value=a;q.focus();sIdx=0;suggest()},
 searchGo:()=>{const v=$('#q').value.trim();const r=searchSv(v);if(r.length===1)svcModal(r[0].id);else{catQ=v;location.hash='#/catalog'}},
 wnext:wNext,wback:()=>{W.step--;W.errs={};render()},wgo:a=>{W.step=+a;W.errs={};render()},wsubmit:wSubmit,
 copy:a=>{try{navigator.clipboard.writeText(a).then(()=>toast(T('Copied: ','Скопировано: ')+a),()=>toast(a))}catch(e){toast(a)}},
 doc:docModal,pay:payModal,receipt,dlReceipt,
 notes:()=>{const p=$('#notes');p.hidden=!p.hidden;$('#a11y').hidden=true;if(!p.hidden)renderNotes()},
 readAll:()=>{S.notes.forEach(n=>n.read=true);save();render()},
 a11y:()=>{$('#a11y').hidden=!$('#a11y').hidden;$('#notes').hidden=true},
 apcat:a=>{AP.cat=a;delete AP.errs.cat;const keep=['ap_t','ap_d','ap_s','ap_c','ap_l'].map(id=>$('#'+id).value);render();['ap_t','ap_d','ap_s','ap_c','ap_l'].forEach((id,i)=>$('#'+id).value=keep[i]);$('#apc').textContent=keep[1].length},
 track:()=>{const v=$('#trk').value.trim().toUpperCase(),a=S.appeals.find(x=>x.num===v);$('#trkres').innerHTML=a?`<div style="margin-top:12px"><b>${esc(a.title)}</b><small class="muted" style="display:block;margin-bottom:8px">${L(catOf(a.cat)[2])}</small>${tlHtml(a,1)}</div>`:`<div class="err" style="margin-top:8px">⚠ ${T('No appeal with this number','Обращение с таким номером не найдено')}</div>`},
 sla:()=>{const bars=Array.from({length:90},(_,i)=>i===61?'b':(i===23||i===77)?'w':'');modal(`<h3>${T('Service status','Статус сервиса')}</h3><p class="muted" style="margin:0">${T('Uptime over the last 90 days','Доступность за последние 90 дней')}: <b class="mono" style="color:var(--mal3)">99.97 %</b> · SLA 99.9 %</p><div class="upt">${bars.map((c,i)=>`<i class="${c}" title="${fd(Date.now()-(89-i)*DAY)}"></i>`).join('')}</div><div class="row muted" style="justify-content:space-between;font-size:.75rem"><span>${T('90 days ago','90 дней назад')}</span><span>${T('today','сегодня')}</span></div><div class="list" style="margin-top:14px">${[['CivicID',''],[T('Payments gateway','Платёжный шлюз'),''],[T('State registers API','API госреестров'),''],[T('Notifications','Уведомления'),''],[T('Document storage','Хранилище документов','')]].map(c=>`<div class="li"><span class="dot"></span><div class="grow">${c[0]}</div><span class="pill ok">${T('Operational','Работает')}</span></div>`).join('')}</div><p class="muted" style="font-size:.8rem">${T('Last incident: 18 Sep, payments gateway latency 14 min — resolved.','Последний инцидент: 18 сен, задержки платёжного шлюза 14 мин — устранено.')}</p>`)}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.closest('.ptbar'))return;const f=ACT[b.dataset.act];if(f){if(b.tagName==='A')e.preventDefault();f(b.dataset.arg,b,e)}});

/* ---------- accessibility ---------- */
function applyA11y(){const h=document.documentElement;h.classList.toggle('fs1',S.fs===1);h.classList.toggle('fs2',S.fs===2);h.classList.toggle('hc',!!S.hc);
 document.querySelectorAll('#fsSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.fs===S.fs));$('#hcSw').classList.toggle('on',!!S.hc)}
document.querySelectorAll('#fsSeg button').forEach(b=>b.onclick=()=>{S.fs=+b.dataset.fs;save();applyA11y()});
$('#hcSw').onclick=()=>{S.hc=!S.hc;save();applyA11y()};

/* ---------- live status ticker ---------- */
setInterval(()=>{
 let ch=false;
 S.apps.forEach(a=>{const st=stageOf(a);if(st>a.seen){a.seen=st;ch=true;const x=stagesFor(a.svc)[st];note(`${a.num}: ${x[0]}`,`${a.num}: ${x[1]}`);
  document.querySelectorAll(`[data-tl="${a.id}"]`).forEach(el=>el.innerHTML=tlHtml(a));
  document.querySelectorAll(`[data-pl="${a.id}"]`).forEach(el=>{el.textContent=L(x);el.className='pill '+(st>=4?'ok':'warn')});
  document.querySelectorAll(`[data-bar="${a.id}"]`).forEach(el=>el.style.width=(st+1)/5*100+'%')}});
 S.appeals.forEach(a=>{const st=astageOf(a);if(st>a.seen){a.seen=st;ch=true;if(S.user)note(`${a.num}: ${AST[st][0]}`,`${a.num}: ${AST[st][1]}`);else toast(`${a.num}: ${L(AST[st])}`,'gold');
  document.querySelectorAll(`[data-atl="${a.id}"]`).forEach(el=>el.innerHTML=tlHtml(a,1));
  document.querySelectorAll(`[data-apl="${a.id}"]`).forEach(el=>{el.textContent=L(AST[st]);el.className='pill '+(st>=3?'ok':'warn')})}});
 if(ch)save();
},1000);

PT.onLang(()=>{const y=scrollY;render();scrollTo(0,y)});
render();
})();
</script>
