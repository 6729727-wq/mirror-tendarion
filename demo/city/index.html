<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My City App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.wrap{max-width:1400px;margin:0 auto;padding:18px 20px 60px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top h1{margin:0;font-size:22px;display:flex;align-items:center;gap:10px}
.top h1 b,.lg{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1306;font-size:12px;font-weight:800;flex:none}
.top .sp{flex:1}
.top .pill{white-space:normal;max-width:100%}
.stk{font-family:var(--mono);font-size:11.5px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.how div{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4}
.how b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--mal) 20%,transparent);color:var(--mal3);font-size:12px}
.layout{display:grid;width:100%;grid-template-columns:minmax(0,1fr) 392px minmax(0,1.15fr);grid-template-areas:"feat phone cons";gap:20px;align-items:start}
.a-feat{grid-area:feat;display:flex;flex-direction:column;gap:14px;min-width:0}
.a-phone{grid-area:phone;min-width:0}
.a-cons{grid-area:cons;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.card h4{margin:14px 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.feat{display:flex;gap:12px;padding:10px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:.15s}
.feat:hover{border-color:var(--line2);background:var(--panel2)}
.feat.on{border-color:color-mix(in srgb,var(--mal) 55%,transparent);background:color-mix(in srgb,var(--mal) 8%,transparent)}
.feat .fi{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);font-size:17px}
.feat b{display:block;font-size:13.5px}.feat span{font-size:12.5px;color:var(--muted);line-height:1.45;display:block}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:13px;margin:0}
.facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:600}
/* phone */
.phone{border-radius:50px;padding:12px;background:linear-gradient(160deg,#2a3b35,#0b1512);box-shadow:var(--shadow),inset 0 0 0 2px #3a4f47;position:sticky;top:60px}
.scr{border-radius:38px;overflow:hidden;background:var(--bg);height:760px;display:flex;flex-direction:column;position:relative;isolation:isolate}
.sbar{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12.5px;font-weight:700;flex:none}
.sbar .isl{width:96px;height:24px;background:#000;border-radius:14px}
.ahd{display:flex;align-items:center;gap:8px;padding:4px 14px 8px;flex:none}
.ahd .tt{flex:1;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{position:relative;width:36px;height:36px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);display:grid;place-items:center;cursor:pointer;flex:none;padding:0;font-size:15px}
.ibtn:hover{border-color:var(--mal)}
.ibtn .bd{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.ptr{height:0;overflow:hidden;display:grid;place-items:center;flex:none;transition:height .25s;color:var(--mal3);font-size:12px;font-weight:700}
.ptr i{display:inline-block;width:18px;height:18px;border:2.5px solid var(--mal);border-top-color:transparent;border-radius:50%;margin-right:8px;vertical-align:-4px}
.ptr.spin i{animation:rot .7s linear infinite}
.pbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 14px 18px;scrollbar-width:thin;overscroll-behavior:contain}
.pbody.enter{animation:slide .28s cubic-bezier(.2,.9,.3,1)}
.tabbar{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);padding:6px 2px 14px;flex:none}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--dim);cursor:pointer;padding:4px 0;min-width:0;transition:transform .12s}
.tabbar button:active{transform:scale(.88)}
.tabbar button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabbar button.on{color:var(--mal3)}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on svg{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--mal) 60%,transparent));animation:pop .3s}
.tap{transition:transform .12s}.tap:active{transform:scale(.96)}
.xs{font-size:11.5px}.sm{font-size:12.5px}.b{font-weight:700}
.row{display:flex;align-items:center;gap:10px}.row .sp{flex:1;min-width:0}
.h2{font-size:19px;font-weight:800;margin:2px 0 4px;line-height:1.25}
.sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.sect{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px}
.sect button{border:0;background:none;color:var(--mal3);font-weight:700;font-size:12px;cursor:pointer;text-transform:none;letter-spacing:0;padding:0}
.li{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;transition:.15s;width:100%;text-align:left}
.li:hover{border-color:var(--line2)}
.li .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);flex:none;font-size:17px}
.li .sp{flex:1;min-width:0}
.li .sp b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .sp div{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{font-size:12.5px;font-weight:700;text-align:right;white-space:nowrap;flex:none}
.back{border:0;background:none;color:var(--muted);cursor:pointer;font-weight:600;padding:2px 0 8px;font-size:13px}
.back:hover{color:var(--text)}
.pbtn{width:100%;justify-content:center;margin-top:8px}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wx{border-radius:18px;padding:14px;color:#fff;background:radial-gradient(120% 140% at 100% 0,#3a7bd5 0,#1d4f8f 45%,#0e2c4f 100%);position:relative;overflow:hidden;margin-bottom:10px}
.wx .tmp{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.03em}
.wx .ico{position:absolute;right:14px;top:8px;font-size:52px}
.wx .mt{display:flex;gap:12px;font-size:11.5px;opacity:.9;margin-top:8px;flex-wrap:wrap}
.alert{border-radius:14px;padding:11px 12px;margin-bottom:10px;border:1px solid color-mix(in srgb,var(--red) 55%,transparent);background:color-mix(in srgb,var(--red) 13%,transparent);display:flex;gap:10px;animation:slide .35s}
.alert.warn{border-color:color-mix(in srgb,var(--amber) 55%,transparent);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.alert.info{border-color:color-mix(in srgb,var(--blue) 50%,transparent);background:color-mix(in srgb,var(--blue) 11%,transparent)}
.alert b{display:block;font-size:13.5px}.alert p{margin:2px 0 6px;font-size:12px;line-height:1.4}
.alert .x{border:0;background:none;color:inherit;font-weight:700;font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 6px}
.tile{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:11px;font-weight:600;color:var(--muted);padding:0;min-width:0}
.tile i{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);font-style:normal;font-size:21px;transition:.15s}
.tile:hover i{border-color:var(--gold)}.tile:active i{transform:scale(.9)}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:5px}
.prog i{display:block;height:100%;background:var(--mal);border-radius:2px;transition:width .6s}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.chip.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 18%,transparent);color:var(--mal3)}
.chip:active{transform:scale(.94)}
.map{width:100%;display:block;border-radius:14px;border:1px solid var(--line);background:var(--bg2)}
.mp-blk{fill:var(--panel2)}.mp-rd{stroke:var(--line2);stroke-width:5;fill:none}.mp-rv{stroke:color-mix(in srgb,var(--blue) 40%,transparent);stroke-width:13;fill:none;stroke-linecap:round}.mp-pk{fill:color-mix(in srgb,var(--mal) 22%,transparent)}
.mp-t{fill:var(--dim);font-size:7px;font-family:var(--font);font-weight:600}
.stop{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.stop .hd{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px}
.stop .hd .sp{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{border:0;background:none;cursor:pointer;font-size:16px;color:var(--dim);padding:0}.star.on{color:var(--gold)}
.arr{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:6px}
.rt{min-width:34px;text-align:center;border-radius:7px;padding:1px 6px;font-weight:800;font-size:11.5px;color:#fff}
.arr .cd{margin-left:auto;font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.arr .cd.now{color:var(--mal3);animation:blink 1s infinite}
.tkt{border-radius:18px;padding:14px;background:var(--panel);border:1px solid var(--line2);text-align:center;margin-bottom:10px}
.tkt canvas{width:170px;height:170px;border-radius:10px;display:block;margin:8px auto}
.anti{height:8px;border-radius:4px;margin:6px 0;background:linear-gradient(90deg,var(--mal),var(--gold),var(--blue),var(--mal));background-size:300% 100%;animation:flow 2.5s linear infinite}
.big{font-family:var(--mono);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.ring{position:relative;width:150px;height:150px;margin:6px auto}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}.ring .rb{stroke:var(--line)}.ring .rf{stroke:var(--mal);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.zone{cursor:pointer;transition:.15s;fill-opacity:.35;stroke-width:2}
.zone.on{fill-opacity:.7;stroke-width:3}
.photo{height:150px;border-radius:14px;border:2px dashed var(--line2);display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden;color:var(--muted);font-weight:600;font-size:13px;margin-bottom:10px;background:var(--bg2)}
.photo svg{position:absolute;inset:0;width:100%;height:100%}
.photo .flash{position:absolute;inset:0;background:#fff;animation:flash .45s forwards;pointer-events:none}
.photo .ts{position:absolute;left:8px;bottom:6px;font-family:var(--mono);font-size:10px;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:5px}
.ta{min-height:64px;resize:vertical}
.tl{border-left:2px solid var(--line2);margin:6px 0 0 8px;padding-left:14px}
.tl div{position:relative;padding:0 0 12px;font-size:12.5px}
.tl div:before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--line2);border:2px solid var(--bg)}
.tl div.ok:before{background:var(--mal)}.tl div.cur:before{background:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 30%,transparent)}
.tl small{display:block;color:var(--muted);font-size:11px}
.ev{border-radius:16px;overflow:hidden;background:var(--panel);border:1px solid var(--line);margin-bottom:10px}
.ev .cv{height:84px;position:relative;display:flex;align-items:flex-end;padding:8px 12px;color:#fff;font-weight:800;font-size:12px}
.ev .cv span{background:rgba(0,0,0,.35);padding:2px 8px;border-radius:999px}
.ev .bd{padding:10px 12px}.ev .bd b{display:block;font-size:14px}
.ev .ac{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.stars{display:flex;gap:4px;font-size:24px}.stars button{border:0;background:none;cursor:pointer;color:var(--line2);padding:0;font-size:24px}.stars button.on{color:var(--gold)}
/* push + sheet */
.push{position:absolute;left:10px;right:10px;top:8px;z-index:30;border-radius:18px;padding:11px 12px;display:flex;gap:10px;cursor:pointer;background:color-mix(in srgb,var(--panel2) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);box-shadow:0 14px 34px rgba(0,0,0,.35);animation:pdrop .45s cubic-bezier(.2,1.3,.4,1)}
.push.crit{border-color:var(--red);box-shadow:0 0 0 2px color-mix(in srgb,var(--red) 35%,transparent),0 14px 34px rgba(0,0,0,.35)}
.push.out{animation:pup .3s forwards}
.push .ic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));font-size:15px}
.push.crit .ic{background:var(--red)}
.push .sp{flex:1;min-width:0}
.push .hd{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.push b{display:block;font-size:13px}.push p{margin:1px 0 0;font-size:12px;color:var(--muted);line-height:1.35}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-radius:24px 24px 0 0;border-top:1px solid var(--line2);padding:10px 16px 22px;animation:sup .3s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.fid{width:74px;height:74px;margin:10px auto;border-radius:20px;border:3px solid var(--mal);display:grid;place-items:center;font-size:32px;animation:pulse 1s infinite}
.kv2{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv2 span{color:var(--muted)}
/* console */
.kp4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kp4 div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-width:0}
.kp4 span{display:block;font-size:11px;color:var(--muted);line-height:1.25;min-height:2.5em}
.kp4 b{font-family:var(--mono);font-size:18px}
.a-cons>.card,.a-feat>.card{min-width:0;max-width:100%}
.tw{overflow-x:auto;max-width:100%;width:100%;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel2)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.mono{white-space:nowrap}
tr.sel td{background:color-mix(in srgb,var(--gold) 9%,transparent)}
tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
td select{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:4px 6px;font-size:12px;max-width:150px}
.f{margin-bottom:10px}.f label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.log{font-family:var(--mono);font-size:11.5px;max-height:190px;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.log div{padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .tg{display:inline-block;min-width:44px;font-weight:600}.log .ok{color:var(--mal3)}.log .wa{color:var(--amber)}.log .bad{color:var(--red)}.log .in{color:var(--blue)}
.deliv{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}.deliv i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--amber));transition:width .2s}
.pin{cursor:pointer}.pin.sel circle{stroke:var(--gold2);stroke-width:3}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:pop .2s}
.toast.bad{border-left-color:var(--red)}.toast.gold{border-left-color:var(--gold)}.toast.warn{border-left-color:var(--amber)}
@keyframes pdrop{from{transform:translateY(-120%);opacity:0}}@keyframes pup{to{transform:translateY(-130%);opacity:0}}
@keyframes sup{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}@keyframes rot{to{transform:rotate(360deg)}}
@keyframes slide{from{opacity:0;transform:translateX(14px)}}@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}}
@keyframes flash{to{opacity:0}}@keyframes flow{to{background-position:300% 0}}@keyframes blink{50%{opacity:.4}}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--mal) 0%,transparent);transform:scale(.95)}}
@media (max-width:1180px){
  .layout{grid-template-columns:392px minmax(0,1fr);grid-template-areas:"phone cons" "feat feat"}
  .a-feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
}
@media (max-width:860px){
  .wrap{padding:12px 16px 50px}
  .how{grid-template-columns:minmax(0,1fr)}
  .layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"phone" "cons" "feat"}
  .a-feat{display:flex}
  .a-phone{margin:0 -16px}
  .phone{position:static;padding:0;background:none;box-shadow:none;border-radius:0}
  .scr{border-radius:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);height:calc(100svh - 44px);min-height:560px;max-height:900px}
  .sbar{display:none}
  .toasts{left:16px;right:16px;top:auto;bottom:16px}.toast{max-width:none}
}
@media (max-width:520px){
  .kp4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .f2{grid-template-columns:minmax(0,1fr)}
  .top h1{font-size:19px}
  .pbody{padding:4px 12px 16px}
}
@media (max-width:380px){.tile i{width:46px;height:46px}.tabbar button{font-size:9.5px}}
</style>
</head>
<body data-demo-en="My City — city services app" data-demo-ru="Мой город — приложение городских услуг">
<div class="wrap">
  <div class="top">
    <h1><b>MC</b><span data-en="My City" data-ru="Мой город"></span></h1>
    <span class="pill gold" data-en="Tender · City IT department of Novograd · ₽ 95 M" data-ru="Тендер · Департамент ИТ г. Новоград · ₽ 95 млн"></span>
    <span class="sp"></span>
    <span class="pill ok stk">Flutter</span><span class="pill ok stk">Kotlin</span><span class="pill ok stk">push</span><span class="pill ok stk">SSO</span>
  </div>
  <div class="how">

 log(auto?'AUTO':'OPS',st===4?'ok':'wa',r.id+' → '+ST[st].en+(st===2?' · '+SVC[r.svc].en:''),r.id+' → '+ST[st].ru+(st===2?' · '+SVC[r.svc].ru:''));
 if(r.mine){const m={1:['📥',['Request accepted',r.id+' was checked by the operator'],['Обращение принято',r.id+' проверено оператором']],2:['🛠️',['Passed to '+SVC[r.svc].en,r.id+': the service has the task'],['Передано: '+SVC[r.svc].ru,r.id+': задача у службы']],3:['🚧',['Work started',r.id+': crew is on site'],['Работы начались',r.id+': бригада на месте']],4:['✅',['Problem resolved',r.id+': '+CATS[r.cat].en+' fixed. Rate the result'],['Проблема решена',r.id+': '+CATS[r.cat].ru+' — устранено. Оцените результат']]}[st];
  if(m)push(m[0],m[1],m[2],{go:{tab:'home',sub:'rep:'+r.id}})}
 save();renderCons();if(!$('.sheet'))renderPhone()}

function tick(){const now=Date.now(),ns=now/1000;$('#clock').textContent=hhmm(now);
 $$('[data-arr]').forEach(el=>{const [o,i]=el.dataset.arr.split(',').map(Number);const s=((o-Math.floor(ns))%i+i)%i;el.textContent=s<30?T('arriving','прибывает'):mmss(s);el.classList.toggle('now',s<30)});
 $$('[data-until]').forEach(el=>{el.textContent=mmss((+el.dataset.until-now)/1000)});
 const pr=$('#pring');if(pr&&S.park){const p=S.park;pr.style.strokeDashoffset=402*(1-Math.max(0,(p.end-now)/(p.end-p.start)))}
 if(S.park&&!S.park.warned&&S.park.end-now<600000){S.park.warned=true;push('⏱',['Parking ends in 10 min','Zone '+S.park.zone+' · tap to extend'],['Парковка закончится через 10 мин','Зона '+S.park.zone+' · нажмите, чтобы продлить'],{go:{tab:'park'}})}

 S.reports.forEach(r=>{if(!r.mine||r.st>=4)return;const age=now-r.t;if(r.st===0&&age>5000)setSt(r.id,1,1);else if(r.st===1&&age>16000)setSt(r.id,2,1);else if(r.st===2&&age>30000)setSt(r.id,3,1)});
