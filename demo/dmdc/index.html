<style>
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:3px;overflow:auto}

.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left;font-family:inherit}
.nav:hover{background:var(--panel);color:var(--text)} .nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}

.side .grow{flex:1} .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;margin:10px 10px 4px}
main{padding:20px 24px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px} .head h1{font-size:23px;margin:0} .head .sp{flex:1} .crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;margin-bottom:14px}
.hint{display:flex;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1px dashed color-mix(in srgb,var(--gold) 55%,transparent);border-radius:var(--r);background:color-mix(in srgb,var(--gold) 6%,var(--panel))}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{padding:14px;cursor:default} .kpi.clk{cursor:pointer} .kpi.clk:hover{border-color:var(--mal)} .kpi .l{font-size:12px;color:var(--muted);font-weight:600} .kpi .v{font-size:24px;font-weight:800;margin:3px 0 0;letter-spacing:-.02em} .kpi .d{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--red)} .kpi.warn .v{color:var(--amber)}
.g2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start} .g2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap} .card h3 .sp{flex:1}
.mt{margin-top:14px} .sub{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)} .tw.tall{max-height:560px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2);position:sticky;top:0;z-index:1}
td{padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap} tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td{background:color-mix(in srgb,var(--mal) 6%,transparent)}
tr.new td{animation:fl 1.6s} @keyframes fl{from{background:color-mix(in srgb,var(--gold) 28%,transparent)}}
tr.dim td{opacity:.5}
.btn:disabled{opacity:.42;cursor:not-allowed} .btn.sm{padding:6px 12px;font-size:12.5px} .btn.xs{padding:3px 9px;font-size:12px} .btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.view{display:none}.view.on{display:block;animation:fade .2s} @keyframes fade{from{opacity:0;transform:translateY(4px)}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center} .tools .input{width:auto;min-width:130px;flex:1;max-width:260px} .tools select.input{flex:0 1 auto}
.chartw svg{display:block;width:100%;height:auto}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:10.5px;font-weight:800;color:#fff;margin-right:8px;vertical-align:middle;flex:none}
.ty-mil{background:var(--mal2)} .ty-civ{background:var(--blue)} .ty-ctr{background:var(--violet)}

.seg{display:inline-flex;border:1px solid var(--line2);border-radius:11px;padding:3px;gap:3px;background:var(--bg2);margin-bottom:14px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--muted);font:600 13px/1 inherit;font-family:inherit;padding:8px 14px;border-radius:8px;cursor:pointer} .seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px var(--line2)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px} .fgrid .full{grid-column:1/-1} .f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.prop svg{display:block;width:100%;height:auto} .flow{stroke-dasharray:6 6;animation:dash .5s linear infinite} @keyframes dash{to{stroke-dashoffset:-12}}
.plog{font-family:var(--mono);font-size:11.5px;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg2);padding:8px 10px;margin-top:10px}
.plog div{padding:2px 0;border-bottom:1px dashed var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .plog .ok{color:var(--mal3)} .plog .bad{color:var(--red)} .plog .w{color:var(--amber)}
.chain{display:inline-flex;align-items:center;gap:3px} .chain i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;border:2px solid var(--line2);color:var(--dim)} .chain b{width:10px;height:2px;background:var(--line2)}
.chain i.ok{background:var(--mal);border-color:var(--mal);color:#fff} .chain i.cur{border-color:var(--gold);color:var(--gold2);animation:pulse 1.4s infinite} .chain i.no{background:var(--red);border-color:var(--red);color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 25%,transparent)}}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ci{border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--panel);display:flex;flex-direction:column;gap:6px} .ci .s{font-size:11px;color:var(--dim);font-family:var(--mono)} .ci .t{font-weight:700;font-size:13.5px} .ci .o{font-size:12px;color:var(--muted);flex:1}
.cf{border:1px solid color-mix(in srgb,var(--red) 40%,var(--line));border-radius:12px;padding:12px;background:color-mix(in srgb,var(--red) 4%,var(--panel));margin-bottom:10px} .cf.mit{border-color:var(--line2);background:var(--panel);opacity:.75}
.cf .why{font-size:12.5px;color:var(--muted);margin:6px 0 9px;line-height:1.45} .cf .a{display:flex;gap:6px;flex-wrap:wrap}
.vs{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:800;margin:0 6px}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden} .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--mal2),var(--mal3));transition:width .2s}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 10px;border:1px solid var(--gold);border-radius:11px;margin-bottom:10px;background:color-mix(in srgb,var(--gold) 7%,var(--panel));font-size:13px}
.dec{display:inline-flex;gap:4px} .dec button{width:30px;height:28px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);cursor:pointer;font-weight:800}
.dec button.c.on{background:var(--mal);border-color:var(--mal);color:#fff} .dec button.r.on{background:var(--red);border-color:var(--red);color:#fff}
.pl{display:grid;gap:8px} .pi{border:1px solid var(--line);border-radius:11px;padding:9px 11px;cursor:pointer;background:var(--panel);font-size:13px} .pi.on{border-color:var(--gold)} .pi small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
.cond{display:grid;grid-template-columns:minmax(0,1.3fr) 64px minmax(0,1fr) 34px;gap:6px;margin-bottom:6px;align-items:center} .cond .input{padding:7px 8px;font-size:12.5px}
.andl{font-size:10.5px;font-weight:800;color:var(--dim);letter-spacing:.1em;margin:-2px 0 4px 4px}
.verdict{border-radius:14px;padding:14px 16px;font-weight:800;font-size:20px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.verdict.p{background:color-mix(in srgb,var(--mal) 18%,var(--panel));color:var(--mal3);border:1px solid var(--mal)} .verdict.d{background:color-mix(in srgb,var(--red) 14%,var(--panel));color:var(--red);border:1px solid var(--red)}
.trace{font-size:12.5px} .trace .pol{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px} .trace .pol.hit{border-color:var(--gold)} .trace .c{display:flex;gap:8px;font-family:var(--mono);font-size:11.5px;padding:2px 0} .trace .c .y{color:var(--mal3)} .trace .c .n{color:var(--red)}
.reader{position:relative;height:190px;border-radius:16px;background:linear-gradient(180deg,var(--bg2),var(--panel2));border:1px solid var(--line2);overflow:hidden;margin-bottom:12px}
.slot{position:absolute;left:50%;bottom:26px;width:200px;height:12px;margin-left:-100px;border-radius:6px;background:#05090a;box-shadow:inset 0 2px 4px #000}
.led{position:absolute;right:16px;bottom:22px;width:10px;height:10px;border-radius:50%;background:var(--line2)} .led.g{background:var(--mal3);box-shadow:0 0 10px var(--mal3)} .led.y{background:var(--gold);box-shadow:0 0 10px var(--gold);animation:blink .5s infinite} .led.r{background:var(--red);box-shadow:0 0 10px var(--red)} @keyframes blink{50%{opacity:.3}}
.ccard{position:absolute;left:50%;width:180px;height:112px;margin-left:-90px;top:12px;border-radius:12px;background:linear-gradient(135deg,#1f5c4a,#0e3328 60%,#3b2f12);border:1px solid #c9a24a66;color:#f4ecd2;padding:10px 12px;font-size:10.5px;transition:transform .9s cubic-bezier(.6,0,.3,1),opacity .9s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.ccard.in{transform:translateY(96px) scale(.96)} .ccard .chipc{width:28px;height:21px;border-radius:5px;background:linear-gradient(135deg,#e8c66b,#a07a2a);margin:10px 0 6px} .ccard b{display:block;font-size:12px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:260px;margin:10px auto 0} .pad button{height:44px;border-radius:11px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:700 17px inherit;font-family:inherit;cursor:pointer} .pad button:hover{border-color:var(--mal)}
.pins{display:flex;justify-content:center;gap:10px;margin:6px 0} .pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2)} .pins i.on{background:var(--gold);border-color:var(--gold)}
.steps{display:grid;gap:0} .st{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;position:relative;padding-bottom:14px} .st:before{content:'';position:absolute;left:14px;top:28px;bottom:0;width:2px;background:var(--line)} .st:last-child:before{display:none}
.st .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);font-weight:800;font-size:13px;background:var(--panel)} .st.ok .ic{background:var(--mal);border-color:var(--mal);color:#fff} .st.run .ic{border-color:var(--gold);animation:pulse 1.2s infinite} .st.bad .ic{background:var(--red);border-color:var(--red);color:#fff} .st.wait{opacity:.45}
.st .t{font-weight:700;font-size:13.5px;margin-top:5px} .st .m{font-size:12px;color:var(--muted);font-family:var(--mono);word-break:break-all}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px} .modal-bg.on{display:flex}
.modal{width:min(640px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r2);padding:22px;box-shadow:var(--shadow);animation:pop .18s}
@keyframes pop{from{transform:scale(.96);opacity:0}} .modal h2{margin:0 0 6px;font-size:19px} .modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.attrs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0} .attrs div{border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12.5px} .attrs span{display:block;font-size:11px;color:var(--dim)}
.warnb{border:1px solid var(--amber);background:color-mix(in srgb,var(--amber) 9%,var(--panel));border-radius:11px;padding:9px 11px;font-size:12.5px;margin-top:10px} .okb{border:1px solid var(--mal);background:color-mix(in srgb,var(--mal) 9%,var(--panel));border-radius:11px;padding:9px 11px;font-size:12.5px;margin-top:10px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:pop .2s} .toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.g2,.g2e,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.side{position:fixed;left:0;top:45px;z-index:1500;width:250px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}.side.open{transform:none}.menu-btn{display:inline-flex}main{padding:14px 14px 50px}.intro{grid-template-columns:minmax(0,1fr)}.head h1{font-size:19px}}
@media (max-width:520px){.kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.kpi .v{font-size:19px}.fgrid{grid-template-columns:1fr}.tools .input{max-width:none}.attrs{grid-template-columns:1fr 1fr}.cond{grid-template-columns:minmax(0,1fr) 58px minmax(0,1fr) 30px}.cat{grid-template-columns:1fr}.toasts{left:16px;right:16px}.toast{max-width:none}}
</style>
</head>
<body data-demo-en="Gatekeeper — enterprise identity & access management" data-demo-ru="Gatekeeper — управление идентификацией и доступом">
<div class="app">

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru),L=o=>o?(PT.lang==='ru'?o.ru:o.en):'',LA=a=>a?(PT.lang==='ru'?a[1]:a[0]):'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const KEY='gatekeeper-v1',DAY=864e5,NOW=Date.now();
const store={load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},save(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}},clear(){try{localStorage.removeItem(KEY)}catch(e){}}};
const d10=t=>new Date(t).toISOString().slice(0,10),hm=t=>new Date(t).toTimeString().slice(0,8);
const fmt=n=>Math.round(n).toLocaleString(PT.lang==='ru'?'ru-RU':'en-US');
const ago=d=>d<1?T('today','сегодня'):T(d+' d ago',d+' дн. назад');

/* ---------- reference data ---------- */
const SYS=[
 {id:'DIR',en:'Directory (LDAP)',ru:'Каталог (LDAP)',own:['Identity Office','Служба идентификации']},
 {id:'MAIL',en:'Email & collaboration',ru:'Почта и совместная работа',own:['Comms Directorate','Управление связи']},

function reqM(p,ent){const sod=sodFor(p,ent);

function evaluate(p){const ctx=ctxOf(p),pols=S.pol.filter(x=>x.res===abacT.res).map(x=>{const cs=x.c.map(c=>({c,v:ctx[c[0]],ok:cmp(AT[c[0]],c[1],ctx[c[0]],c[2])}));return{x,cs,hit:cs.every(c=>c.ok)}});
 const deny=pols.find(r=>r.x.eff==='deny'&&r.hit),perm=pols.find(r=>r.x.eff==='permit'&&r.hit);return{pols,dec:deny?'d':perm?'p':'d',why:deny?T('Deny overrides: ','Запрет важнее: ')+deny.x.id:perm?T('Permitted by ','Разрешено: ')+perm.x.id:T('No applicable permit — default deny','Нет разрешающей политики — запрет по умолчанию')}}

 $$('[data-pl]').forEach(d=>d.onclick=()=>{polSel=d.dataset.pl;abacT.res=S.pol.find(x=>x.id===polSel).res;vAbac()});

 $('#pNew').onclick=()=>{const id='POL-'+(Math.max(...S.pol.map(x=>+x.id.split('-')[1]))+1);S.pol.push({id,en:'New policy',ru:'Новая политика',res:abacT.res,eff:'permit',c:[['subj.trained','=','yes']]});polSel=id;save();vAbac()};

function vCard(){if(!card.pid||!P(card.pid))card.pid=S.pp[0].id;const p=P(card.pid),lk=S.lock[p.id]>=3,inn=card.ph!=='idle';
 const led=card.ph==='check'?'y':card.ph==='ok'?'g':card.ph==='fail'||lk?'r':inn?'y':'';
 $('#v-card').innerHTML=`<div class="g2e"><div class="card"><h3>${T('Card reader','Считыватель')}<span class="sp"></span>${S.sess?`<button class="btn xs" id="lo">${T('Sign out','Выйти')}</button>`:''}</h3>
  <div class="f"><label>${T('Cardholder (pick any — try a leaver or an expired card)','Владелец карты (попробуйте уволенного или с истёкшей картой)')}</label><select class="input" id="cP" ${inn&&card.ph!=='ok'&&card.ph!=='fail'?'disabled':''}>${S.pp.map(x=>opt(x.id,full(x)+(x.st==='left'?' · '+T('LEFT','УВОЛЕН'):x.card.exp<NOW?' · '+T('expired card','карта истекла'):S.lock[x.id]>=3?' · '+T('locked','заблок.'):''),x.id===p.id)).join('')}</select></div>
  <div class="reader mt"><div class="slot"></div><div class="led ${led}"></div><div class="ccard ${inn?'in':''}"><div style="display:flex;justify-content:space-between"><span>NORDANIA · MOD</span><span>PIV</span></div><div class="chipc"></div><b>${esc(p.en.toUpperCase())}</b><span class="mono">${p.id} · ${p.card.sn}</span></div></div>
  ${card.ph==='idle'?`<button class="btn gold" id="ins" style="width:100%;justify-content:center" ${lk?'disabled':''}>${lk?'🔒 '+T('Card locked — 3 wrong PINs','Карта заблокирована — 3 неверных PIN'):T('Insert card','Вставить карту')}</button>${lk?`<button class="btn sm mt" id="unl">${T('Unlock with PUK (security officer)','Разблокировать PUK (офицер безопасности)')}</button>`:''}`:
   card.ph==='pin'?`<div style="text-align:center;font-weight:700">${T('Enter PIN','Введите PIN')} <span class="muted" style="font-weight:500;font-size:12px">(${T('demo','демо')}: 1234 · ${T('tries left','осталось попыток')}: ${3-(S.lock[p.id]||0)})</span></div><div class="pins">${[0,1,2,3].map(i=>`<i class="${i<card.pin.length?'on':''}"></i>`).join('')}</div>
   <div class="pad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'OK'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div>`:
   `<button class="btn sm" id="ej" style="width:100%;justify-content:center" ${card.ph==='check'?'disabled':''}>${T('Eject card','Извлечь карту')}</button>`}</div>
  <div class="card"><h3>${T('Certificate chain & session','Цепочка сертификатов и сессия')}</h3><div class="steps">${CSTEPS.map((s,i)=>{const r=card.steps[i];return`<div class="st ${r?r.c:'wait'}"><div class="ic">${r?r.c==='ok'?'✓':r.c==='bad'?'✕':'…':i+1}</div><div><div class="t">${LA(s)}</div><div class="m">${r&&r.m?esc(LA(r.m)):''}</div></div></div>`}).join('')}</div>
  ${card.ph==='ok'?`<div class="okb">✓ <b>${T('Session established','Сессия установлена')}</b> — ${esc(full(p))} · ${L(JOBS[p.job])}<br>${p.ents.map(e=>`<span class="chip ${E[e].priv?'pv':''}">${e}</span>`).join('')}</div>`:card.ph==='fail'?`<div class="warnb" style="border-color:var(--red)">✕ <b>${T('Access denied','Доступ запрещён')}</b> — ${esc(LA(card.err))}</div>`:''}</div></div>`;
 $('#cP').onchange=e=>{card={pid:e.target.value,ph:'idle',pin:'',steps:[]};vCard()};
 const b=id=>$('#'+id);if(b('ins'))b('ins').onclick=()=>{card.ph='in';vCard();setTimeout(()=>{card.ph='pin';vCard()},950)};

 if(b('ej'))b('ej').onclick=()=>{card={pid:p.id,ph:'idle',pin:'',steps:[]};vCard()};if(b('lo'))b('lo').onclick=()=>{log('login','DIR','Signed out '+P(S.sess).en,'Выход '+P(S.sess).ru);S.sess=null;save();card={pid:p.id,ph:'idle',pin:'',steps:[]};render()};

const CSTEPS=[['PIN verified by card applet','PIN проверен апплетом карты'],['Read PIV authentication certificate','Чтение сертификата аутентификации PIV'],['Signature by Nordania MoD Issuing CA-7','Подпись Nordania MoD Issuing CA-7'],['CA-7 chains to trusted Nordania Root CA-3','CA-7 ведёт к доверенному Nordania Root CA-3'],['Validity period','Срок действия'],['OCSP revocation status','Статус отзыва (OCSP)'],['Map to identity & build session','Сопоставление с личностью и сессия']];
function pinOk(p){if(card.ph!=='pin')return;if(card.pin!=='1234'){S.lock[p.id]=(S.lock[p.id]||0)+1;card.pin='';log('login-fail','DIR',`Wrong PIN for card ${p.card.sn} (${S.lock[p.id]}/3)`,`Неверный PIN карты ${p.card.sn} (${S.lock[p.id]}/3)`);save();
  if(S.lock[p.id]>=3){card.ph='idle';toast(T('Card locked after 3 wrong PINs','Карта заблокирована после 3 неверных PIN'),'bad')}else toast(T('Wrong PIN','Неверный PIN'),'bad');vCard();return}
 S.lock[p.id]=0;card.ph='check';card.steps=[];const cn=`CN=${p.en.split(' ').reverse().join('.').toUpperCase()}.${p.id}`;
 const exp=p.card.exp<NOW,rev=p.card.st!=='ok',left=p.st!=='active';
 const seq=[{c:'ok',m:['PIN OK, retry counter reset','PIN верен, счётчик попыток сброшен']},{c:'ok',m:[`${cn} · serial ${p.card.sn}`,`${cn} · серийный ${p.card.sn}`]},{c:'ok',m:['RSA-2048 / SHA-256 signature valid','Подпись RSA-2048 / SHA-256 верна']},{c:'ok',m:['path length 1 · anchor in trust store','длина пути 1 · якорь в хранилище доверия']},
  exp?{c:'bad',m:[`expired ${d10(p.card.exp)}`,`истёк ${d10(p.card.exp)}`],e:['Certificate expired — visit badge office for renewal','Сертификат истёк — обратитесь в бюро пропусков']}:{c:'ok',m:[`valid until ${d10(p.card.exp)}`,`действует до ${d10(p.card.exp)}`]},
  rev?{c:'bad',m:['REVOKED · reason: cessationOfOperation','ОТОЗВАН · причина: cessationOfOperation'],e:['Certificate revoked (leaver)','Сертификат отозван (увольнение)']}:{c:'ok',m:['good · responder ocsp.pki.mod.nd · 84 ms','good · ocsp.pki.mod.nd · 84 мс']},
  left||p.st==='susp'?{c:'bad',m:['identity not active','личность не активна'],e:['Identity is not active','Личность не активна']}:{c:'ok',m:[`${sysOf(p).length} systems · ${p.ents.length} entitlements · ABAC context attached`,`систем: ${sysOf(p).length} · прав: ${p.ents.length} · контекст ABAC добавлен`]}];
 let i=0;const nx=()=>{const s=seq[i];card.steps[i]={c:'run'};vCard();setTimeout(()=>{card.steps[i]=s;if(s.c==='bad'){card.ph='fail';card.err=s.e;log('login-fail','DIR',`Smart-card login denied for ${p.en}: ${s.e[0]}`,`Отказ входа ${p.ru}: ${s.e[1]}`);save();vCard();return}
  i++;if(i<seq.length){vCard();nx()}else{card.ph='ok';S.sess=p.id;p.last=0;log('login','DIR',`Smart-card login ${p.en} (${p.card.sn})`,`Вход по смарт-карте ${p.ru} (${p.card.sn})`);save();render();toast(`✓ ${T('Signed in as','Вход выполнен:')} ${esc(full(p))}`)}},430)};nx();vCard()}

const ATY={join:['Joiner','Приём'],move:['Mover','Перевод'],leave:['Leaver','Увольнение'],request:['Request','Заявка'],approve:['Approval','Согласование'],deny:['Denial','Отказ'],provision:['Provision','Выдача'],revoke:['Revoke','Отзыв'],certify:['Certify','Подтверждение'],sod:['SoD','SoD'],policy:['Policy','Политика'],login:['Login','Вход'],'login-fail':['Login failed','Ошибка входа'],disable:['Disable','Отключение'],enable:['Enable','Включение']};
