<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BenefitFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--mal2));color:#fff;font-size:15px;flex:none}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.grow{flex:1}
.who{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:12.5px;display:flex;gap:10px;align-items:center}
.who .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--mal) 25%,transparent);color:var(--mal3);font-weight:800;flex:none}
.who b{display:block;font-size:13px}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.how>div>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold2);flex:none;font-size:13px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f .er{font-size:11.5px;color:var(--red);margin-top:4px}
.f.bad .input{border-color:var(--red)}
.ok-t{color:var(--mal3)} .bad-t{color:var(--red)} .warn-t{color:var(--amber)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mal2),var(--mal3));transition:width .3s}
.prog i.r{background:var(--red)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td,tbody tr.sel td{background:color-mix(in srgb,var(--mal) 8%,transparent)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.login{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 500px at 80% 10%,color-mix(in srgb,var(--gold) 12%,transparent),transparent),radial-gradient(700px 400px at 10% 90%,color-mix(in srgb,var(--mal) 14%,transparent),transparent)}
.lbox{width:100%;max-width:440px}.lbox .card{padding:26px}.lbox h2{margin:6px 0 4px;font-size:22px}
.gate{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--muted);margin:14px 0}
.gate b{color:var(--text)}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:10px 0 0;font-size:12.5px;color:var(--muted)}
.dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.dl div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.dl span{display:block;font-size:11px;color:var(--muted)} .dl b{font-size:13.5px;overflow-wrap:anywhere}
.mem{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.mem span:first-child{flex:1}
.brk{display:grid;grid-template-columns:110px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:12.5px;margin-bottom:6px}
.wt{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.wt .l{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted)}
.wt .l b{color:var(--text);font-family:var(--mono)}
.rng{width:100%;accent-color:var(--mal)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.step{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--dim)}
.step.done{color:var(--mal3);border-color:color-mix(in srgb,var(--mal) 50%,transparent);background:color-mix(in srgb,var(--mal) 10%,transparent)}
.step.cur{color:var(--gold2);border-color:var(--gold)}
.chn{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:12.5px;margin-bottom:8px}
.chk{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);font-size:13px;margin-bottom:6px}
.chk span:nth-child(2){flex:1;min-width:0}
.tl{border-left:2px solid var(--line2);margin:6px 0 0 6px;padding-left:14px}
.tl div{position:relative;padding:0 0 12px;font-size:13px}
.tl div:before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--mal)}
.tl small{display:block;color:var(--dim);font-size:11.5px}
.map svg{width:100%;height:auto;display:block}
.map path.d{cursor:pointer;transition:opacity .15s}
.map path.d:hover{opacity:.82}
.ramp{height:10px;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--mal) 8%,var(--panel2)),var(--mal))}
.sel{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:4px 6px;font-size:12.5px}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.ck{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.ck input{accent-color:var(--mal);width:16px;height:16px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.intro{grid-template-columns:minmax(0,1fr)}.filters{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
}
@media (max-width:560px){.how,.fgrid,.filters{grid-template-columns:1fr}.kpi .v{font-size:20px}.kpis{gap:10px}.dl{grid-template-columns:1fr}.chn{grid-template-columns:84px minmax(0,1fr) 76px}.brk{grid-template-columns:90px minmax(0,1fr) 34px}.lbox .card{padding:18px}}
.spin{width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--mal3);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const KEY='pt_dbt_state';
const store={load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},clear(){try{localStorage.removeItem(KEY)}catch(e){}}};
const loc=()=>PT.lang==='ru'?'ru-RU':'en-GB';
const num=n=>Math.round(n).toLocaleString(loc());
const kld=n=>num(n)+' KLD';
const NOW=new Date('2026-11-17T10:00:00');
const fmtD=d=>new Date(d).toLocaleDateString(loc(),{day:'numeric',month:'short'});
const isoD=d=>new Date(d).toISOString().slice(0,10);
function toast(m,c){const t=document.createElement('div');t.className='toast '+(c||'');t.innerHTML=m;$('#toasts').append(t);setTimeout(()=>t.remove(),3800)}

const DIST=['Kalara','Tanjung','Selaro','Marunda','Pesisir','Bukit Raya','Lembah','Varo','Nusa Kecil','Teluk Emas','Gunung Api'];
const SEEDS=[[300,205],[120,150],[200,95],[330,90],[455,110],[540,195],[470,280],[350,320],[215,300],[95,255],[225,195]];
const FN=['Amara','Bayu','Citra','Dian','Eka','Farah','Gita','Hana','Indra','Joko','Kirana','Lestari','Malik','Nadia','Omar','Putri','Rafi','Sari','Tomas','Wulan','Yusuf','Zara','Ana','Benny','Lina','Mateo','Rosa','Teo','Rina','Adi'];
const LN=['Santos','Reyes','Wijaya','Kusuma','Halim','Bautista','Lim','Tan','Pratama','Cruz','Navarro','Salim','Ortega','Abad','Ramos','Sutanto'];
const PROGS={cg:['Child grant','Детское пособие',450],sp:['Senior pension','Пенсия пожилым',600],dg:['Disability grant','Пособие по инвалидности',550]};
const CH={bank:['Bank account','Банковский счёт','var(--blue)'],wallet:['Mobile wallet','Мобильный кошелёк','var(--mal)'],cash:['Cash agent','Кассовый агент','var(--gold)']};
const HOUSE={th:['Thatch / bamboo','Солома / бамбук',1],tin:['Tin sheet','Жесть',.5],con:['Concrete','Бетон',0]};
const W0={inc:35,size:10,dep:20,dis:10,house:15,asset:10};
const WL={inc:['Income per person','Доход на человека'],size:['Household size','Размер семьи'],dep:['Dependants share','Доля иждивенцев'],dis:['Disability','Инвалидность'],house:['Housing quality','Качество жилья'],asset:['Land & livestock','Земля и скот']};
const GCAT={pay:['Payment not received','Выплата не получена'],amt:['Wrong amount','Неверная сумма'],exc:['Wrongly excluded','Неправомерно исключён'],kyc:['eKYC failure','Сбой eKYC'],agt:['Agent misconduct','Нарушение агента'],data:['Data correction','Исправление данных']};
const GST={new:['New','Новая','warn'],asg:['Assigned','Назначена','gold'],inv:['Investigating','Расследуется','gold'],res:['Resolved','Решена','ok']};
const BST=['draft','valid','appr','run','done','rec'];
const BSTL={draft:['Draft','Черновик'],valid:['Validated','Проверен'],appr:['Approved','Утверждён'],run:['Running','Выполняется'],done:['Completed','Завершён'],rec:['Reconciled','Сверен']};

function genHH(){
  const r=rng(77),out=[];
  for(let i=0;i<300;i++){
    const d=Math.floor(r()*r()*11.9)%11, size=1+Math.floor(r()*8), kids=Math.min(size-1,Math.floor(r()*4)), eld=r()<.32?1+(r()<.25?1:0):0;
    const fn=FN[Math.floor(r()*FN.length)],ln=LN[Math.floor(r()*LN.length)];
    const inc=Math.round((300+r()*r()*5200)/10)*10, house=r()<.35?'th':r()<.7?'tin':'con', asset=Math.floor(r()*3), dis=r()<.13;
    const k=r(), ekyc=k<.82?'ok':k<.93?'pend':'fail', chv=r(), ch=chv<.45?'wallet':chv<.75?'bank':'cash';
    const acct=ch==='cash'?'AG-'+(1000+Math.floor(r()*900)):ch==='wallet'?'+675 8'+String(Math.floor(r()*1e7)).padStart(7,'0'):'KLB '+String(Math.floor(r()*1e9)).padStart(9,'0');
    const mem=[{n:fn+' '+ln,a:28+Math.floor(r()*30),rel:'head'}];
    for(let j=1;j<size;j++){const rel=j===1&&size-kids-eld>1?'sp':j<=kids+(size-kids-eld>1?1:0)?'ch':'ot';mem.push({n:FN[Math.floor(r()*FN.length)]+' '+ln,a:rel==='ch'?1+Math.floor(r()*16):20+Math.floor(r()*40),rel})}
    for(let j=0;j<eld;j++)mem.push({n:FN[Math.floor(r()*FN.length)]+' '+ln,a:66+Math.floor(r()*20),rel:'el'});
    out.push({id:'HH-'+(10230+i*7),head:fn+' '+ln,d,size:mem.length,kids,eld,dis,inc,house,asset,ekyc,ch,acct:i===41||i===97?out[12]?.acct||acct:acct,mem,reg:isoD(new Date(2024,Math.floor(r()*22),1+Math.floor(r()*27)))});
  }
  out[41].acct=out[12].acct;out[97].acct=out[12].acct;return out;
}
function seed(){
  const r=rng(5),hh=genHH();
  const g=[];const msgs=[['pay','Grant for October not received in wallet','Октябрьская выплата не пришла на кошелёк'],['amt','Received 300 instead of 450','Получено 300 вместо 450'],['exc','Household with 5 children marked not eligible','Семья с 5 детьми признана не имеющей права'],['kyc','Fingerprint not recognised at office','Отпечаток не распознан в офисе'],['agt','Cash agent asked for a fee','Кассовый агент потребовал плату'],['data','Child’s birth year entered wrongly','Неверно указан год рождения ребёнка']];
  for(let i=0;i<14;i++){const m=msgs[i%6],h=hh[Math.floor(r()*300)],age=Math.floor(r()*24),st=age>16?(r()<.7?'res':'inv'):age>6?['asg','inv','res'][Math.floor(r()*3)]:['new','new','asg'][Math.floor(r()*3)];
    const opened=new Date(NOW-age*864e5);const tl=[{t:isoD(opened),en:'Logged via '+['hotline','SMS','office','app'][i%4],ru:'Принята: '+['горячая линия','SMS','офис','приложение'][i%4]}];
    if(st!=='new')tl.push({t:isoD(new Date(+opened+864e5)),en:'Assigned to district officer',ru:'Назначена районному специалисту'});
    if(st==='inv'||st==='res')tl.push({t:isoD(new Date(+opened+2*864e5)),en:'Investigation started',ru:'Начато расследование'});
    if(st==='res')tl.push({t:isoD(new Date(+opened+(3+Math.floor(r()*8))*864e5)),en:'Resolved: payment re-issued',ru:'Решено: выплата переотправлена'});
    g.push({id:'GR-'+(5120+i),hh:h.id,cat:m[0],en:m[1],ru:m[2],st,opened:isoD(opened),closed:st==='res'?tl[tl.length-1].t:null,tl})}
  const months=[];for(let i=11;i>=1;i--){const d=new Date(2026,10-i,1);months.push({m:d.toISOString().slice(0,7),v:Math.round(38+i*-1.1+r()*6)*1e6})}
  return{auth:false,view:'over',hh,w:{...W0},thr:55,f:{q:'',d:'',p:'',s:''},page:0,selHH:hh[0].id,batches:[],bseq:301,
    griev:g.reverse(),gseq:5134,selG:null,gf:'open',metric:'cov',selD:0,months,
    act:[{t:'09:12',en:'Registry sync with civil registry: 1,284 updates',ru:'Синхронизация с ЗАГС: 1 284 обновления'}]};
}
let S=store.load()||seed();
const save=()=>store.save();
function act(en,ru){S.act.unshift({t:new Date().toTimeString().slice(0,5),en,ru});S.act=S.act.slice(0,12);save()}

/* scoring */
function feats(h){return{inc:1-Math.min(1,h.inc/h.size/1500),size:Math.min(1,(h.size-1)/7),dep:(h.kids+h.eld)/h.size,dis:h.dis?1:0,house:HOUSE[h.house][2],asset:1-h.asset/2}}
function score(h,w){w=w||S.w;const f=feats(h);let s=0,t=0;for(const k in w){s+=w[k]*f[k];t+=w[k]}return t?s/t*100:0}
const elig=h=>score(h)>=S.thr;
function progsOf(h){if(!elig(h))return[];const p=[];if(h.kids)p.push('cg');if(h.eld)p.push('sp');if(h.dis)p.push('dg');return p}
const hhById=id=>S.hh.find(h=>h.id===id);
const ekycP=s=>({ok:`<span class="pill ok">${T('Verified','Проверен')}</span>`,pend:`<span class="pill warn">${T('Pending','Ожидает')}</span>`,fail:`<span class="pill bad">${T('Failed','Ошибка')}</span>`})[s];

const VIEWS=[['over','◎','Overview','Обзор'],['reg','👥','Beneficiary registry','Реестр получателей'],['elig','⚖','Eligibility scoring','Оценка права (PMT)'],['pay','💸','Payment batches','Пакеты выплат'],['griev','📮','Grievances','Жалобы'],['map','🗺','Coverage map','Карта охвата']];
function nav(){
  const og=S.griev.filter(g=>g.st!=='res').length,pb=S.batches.filter(b=>b.st==='valid'||b.st==='draft').length;
  $('#navW').innerHTML=`<div class="sec">${T('Workspace','Рабочее место')}</div>`+VIEWS.map((v,i)=>(i===4?`<div class="sec">${T('Accountability','Подотчётность')}</div>`:'')+`<button class="nav ${S.view===v[0]?'on':''}" data-v="${v[0]}"><span class="ic">${v[1]}</span>${T(v[2],v[3])}${v[0]==='griev'&&og?`<span class="cnt">${og}</span>`:v[0]==='pay'&&pb?`<span class="cnt">${pb}</span>`:''}</button>`).join('');
  $$('.nav').forEach(b=>b.onclick=()=>go(b.dataset.v));
}
function go(v){S.view=v;save();$('#side').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){
  $('#loginWrap').style.display=S.auth?'none':'grid';$('#app').style.display=S.auth?'grid':'none';
  if(!S.auth)return;
  nav();const v=VIEWS.find(x=>x[0]===S.view)||VIEWS[0];
  $('#title').textContent=T(v[2],v[3]);$('#crumb').textContent=T('Kalara regional office · sample registry of 300 households','Региональный офис Калара · выборка реестра: 300 семей');
  $$('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v[0]));
  ({over:rOver,reg:rReg,elig:rElig,pay:rPay,griev:rGriev,map:rMap})[v[0]]();
}

/* ---------- OVERVIEW ---------- */

   <div class="card kpi"><div class="l">${T('Disbursed in November','Выплачено в ноябре')}</div><div class="v">${kld(paid)}</div><div class="d">${S.batches.filter(b=>b.st==='done'||b.st==='rec').length} ${T('batches completed','пакетов завершено')}</div></div>
   <div class="card kpi"><div class="l">${T('Open grievances','Открытые жалобы')}</div><div class="v ${od.length?'warn-t':''}">${og.length}</div><div class="d">${od.length} ${T('past 14-day SLA','просрочено (SLA 14 дн.)')}</div></div></div>
   <div class="grid2"><div class="card chart"><h3>${T('Monthly disbursements (regional)','Выплаты по месяцам (регион)')}<span class="sp"></span><span class="legend"><span><i style="background:var(--mal)"></i>${T('previous','прошлые')}</span><span><i style="background:var(--gold)"></i>${T('this month (live)','этот месяц (live)')}</span></span></h3>${chart}</div>

/* ---------- REGISTRY ---------- */
const PER=12;

function rReg(){
  const el=$('#v-reg'),f=S.f;
  el.innerHTML=`<div class="card" style="margin-bottom:14px"><div class="filters">
   <input class="input" id="fQ" value="${esc(f.q)}" placeholder="${T('Search name, household ID or account…','Поиск: имя, ID семьи или счёт…')}">

   <select class="input" id="fP"><option value="">${T('All programmes','Все программы')}</option>${Object.keys(PROGS).map(k=>`<option value="${k}" ${f.p===k?'selected':''}>${T(PROGS[k][0],PROGS[k][1])}</option>`).join('')}</select>
   <select class="input" id="fS"><option value="">${T('Any status','Любой статус')}</option>${[['elig','Eligible','Имеет право'],['inel','Not eligible','Нет права'],['ok','eKYC verified','eKYC пройден'],['pend','eKYC pending','eKYC ожидает'],['fail','eKYC failed','eKYC ошибка']].map(o=>`<option value="${o[0]}" ${f.s===o[0]?'selected':''}>${T(o[1],o[2])}</option>`).join('')}</select></div>
   <div class="row"><span class="muted" style="font-size:12.5px" id="rCnt"></span><span style="flex:1"></span><button class="btn sm" id="rClr">${T('Clear filters','Сбросить фильтры')}</button><button class="btn sm pri" id="rAdd">+ ${T('Register household','Зарегистрировать семью')}</button></div></div>

  const upd=()=>{S.f={q:$('#fQ').value,d:$('#fD').value,p:$('#fP').value,s:$('#fS').value};S.page=0;save();rTable()};
  $('#fQ').oninput=upd;['#fD','#fP','#fS'].forEach(s=>$(s).onchange=upd);
  $('#rClr').onclick=()=>{S.f={q:'',d:'',p:'',s:''};S.page=0;save();rReg()};
  $('#rAdd').onclick=()=>{S.adding=true;rSide()};

function rTable(){
  const list=filtered(),pages=Math.max(1,Math.ceil(list.length/PER));if(S.page>=pages)S.page=pages-1;
  $('#rCnt').textContent=T(`${list.length} households match`,`Найдено семей: ${list.length}`);
  $('#rBody').innerHTML=list.slice(S.page*PER,S.page*PER+PER).map(h=>{const sc=score(h),p=progsOf(h);return `<tr class="clk ${h.id===S.selHH&&!S.adding?'sel':''}" data-h="${h.id}"><td class="mono">${h.id}</td><td>${esc(h.head)}</td><td>${DIST[h.d]}</td><td class="mono">${h.size}</td><td class="mono ${sc>=S.thr?'ok-t':''}">${sc.toFixed(0)}</td><td>${ekycP(h.ekyc)}</td><td>${p.length?p.map(k=>`<span class="pill" style="margin-right:4px">${k.toUpperCase()}</span>`).join(''):'<span class="muted">—</span>'}</td></tr>`}).join('')||`<tr><td colspan="7" class="empty">${T('No households match these filters','Нет семей по этим фильтрам')}</td></tr>`;
  $('#rPg').innerHTML=`<button class="btn sm" id="pPrev" ${S.page?'':'disabled'}>‹</button><span>${S.page+1} / ${pages}</span><button class="btn sm" id="pNext" ${S.page<pages-1?'':'disabled'}>›</button>`;
  $('#pPrev').onclick=()=>{S.page--;rTable()};$('#pNext').onclick=()=>{S.page++;rTable()};
  $$('#rBody [data-h]').forEach(r=>r.onclick=()=>{S.selHH=r.dataset.h;S.adding=false;save();rTable();rSide();if(innerWidth<1100)$('#rSide').scrollIntoView({behavior:'smooth'})});
}
function rSide(){
  const el=$('#rSide');if(!el)return;
  if(S.adding)return addForm(el);
  const h=hhById(S.selHH)||S.hh[0],f=feats(h),sc=score(h),p=progsOf(h);
  const pays=S.batches.filter(b=>b.res&&b.res[h.id]).map(b=>[b,b.res[h.id]]);
  const dup=S.hh.filter(x=>x.acct===h.acct).length>1;
  el.innerHTML=`<div class="card"><h3><span class="mono">${h.id}</span><span class="sp"></span>${ekycP(h.ekyc)}</h3>
   <div style="font-size:18px;font-weight:800;margin-bottom:2px">${esc(h.head)}</div><div class="muted" style="font-size:12.5px;margin-bottom:10px">${DIST[h.d]} · ${T('registered','зарегистр.')} ${fmtD(h.reg)}</div>
   <div class="dl"><div><span>${T('Monthly income','Доход в месяц')}</span><b>${kld(h.inc)}</b></div><div><span>${T('Housing','Жильё')}</span><b>${T(HOUSE[h.house][0],HOUSE[h.house][1])}</b></div>
   <div><span>${T('Payment channel','Канал выплаты')}</span><b>${T(CH[h.ch][0],CH[h.ch][1])}</b></div><div><span>${T('Account','Счёт')}</span><b class="mono ${dup?'warn-t':''}" style="font-size:12px">${h.acct}${dup?' ⚠':''}</b></div></div>
   <h3 style="margin-top:14px">${T('Members','Члены семьи')} · ${h.mem.length}</h3>${h.mem.map(m=>`<div class="mem"><span>${esc(m.n)}</span><span class="muted">${({head:T('head','глава'),sp:T('spouse','супруг(а)'),ch:T('child','ребёнок'),el:T('elder','пожилой'),ot:T('relative','родственник')})[m.rel]}</span><span class="mono" style="width:30px;text-align:right">${m.a}</span></div>`).join('')}
   ${h.dis?`<div class="muted" style="font-size:12.5px;margin-top:6px">♿ ${T('Disability certificate on file','Справка об инвалидности в деле')}</div>`:''}
   <h3 style="margin-top:14px">${T('PMT score','Балл PMT')} <span class="mono ${sc>=S.thr?'ok-t':''}">${sc.toFixed(1)}</span><span class="sp"></span><span class="pill ${sc>=S.thr?'ok':''}">${sc>=S.thr?T('Eligible','Имеет право'):T('Below cut-off','Ниже порога')}</span></h3>
   ${Object.keys(WL).map(k=>`<div class="brk"><span class="muted">${T(WL[k][0],WL[k][1])}</span><div class="prog"><i style="width:${f[k]*100}%"></i></div><span class="mono">${S.w[k]}</span></div>`).join('')}
   <div class="muted" style="font-size:12px">${T('Programmes','Программы')}: ${p.length?p.map(k=>T(PROGS[k][0],PROGS[k][1])).join(', '):'—'}</div>
   <h3 style="margin-top:14px">${T('Payment history','История выплат')}</h3>${pays.length?pays.map(([b,r])=>`<div class="mem"><span class="mono">${b.id}</span><span>${T(PROGS[b.prog][0],PROGS[b.prog][1])}</span><span class="pill ${r==='ok'?'ok':'bad'}">${r==='ok'?T('paid','выплачено'):T('failed','ошибка')}</span></div>`).join(''):`<div class="muted" style="font-size:12.5px">${T('No payments in this session yet.','В этой сессии выплат ещё нет.')}</div>`}
   <div class="row" style="margin-top:12px"><button class="btn sm pri" id="hK" ${h.ekyc==='ok'?'disabled':''}>${T('Run eKYC','Проверить eKYC')}</button><button class="btn sm" id="hG">${T('Log grievance','Подать жалобу')}</button></div></div>`;
  $('#hK').onclick=async()=>{const b=$('#hK');b.disabled=true;b.textContent=T('Matching with national ID…','Сверка с нац. ID…');await wait(900);
    h.ekyc=h.id.charCodeAt(h.id.length-1)%5===0&&h.ekyc==='fail'?'fail':'ok';act(`eKYC ${h.ekyc==='ok'?'verified':'failed'}: ${h.id}`,`eKYC ${h.ekyc==='ok'?'пройден':'не пройден'}: ${h.id}`);
    toast(h.ekyc==='ok'?T('Identity verified — biometric match 98.7%','Личность подтверждена — совпадение биометрии 98,7%'):T('Mismatch with civil registry — refer to office','Расхождение с ЗАГС — направить в офис'),h.ekyc==='ok'?'':'bad');
    if(S.view==='reg'){rTable();rSide()}};
  $('#hG').onclick=()=>{S.gDraft=h.id;S.selG=null;S.gNew=true;go('griev')};

   <div class="dl" style="margin-top:8px"><div><span>${T('Paid','Выплачено')}</span><b class="ok-t">${kld(b.paidAmt||0)}</b></div><div><span>${T('Failed','Ошибки')}</span><b class="${b.failed&&b.failed.length?'bad-t':''}">${b.failed?b.failed.length:0}</b></div></div>`}

function bLog(b,en,ru){b.log.push({t:new Date().toTimeString().slice(0,5),en,ru})}
function bindBatch(b){
  const a=$('#bAct');
  if($('#bRej'))$('#bRej').onclick=()=>{b.st='draft';b.chk=null;bLog(b,'Rejected by checker J. Tan — revalidate','Отклонён контролёром J. Tan — перепроверить');save();rPay()};
  if($('#bRetry'))$('#bRetry').onclick=()=>payout(b,b.failed.slice(),true);
  if(!a)return;
  a.onclick=async()=>{
    if(b.st==='draft'){a.disabled=true;a.textContent=T('Validating…','Проверка…');await wait(700);
      const seen={};let kyc=0,dup=0;b.pay=[];b.ids.forEach(id=>{const h=hhById(id);if(!h)return;if(h.ekyc!=='ok'){kyc++;return}if(seen[h.acct]){dup++;return}seen[h.acct]=1;b.pay.push(id)});
      b.chk={kyc,dup};b.st='valid';bLog(b,`Validated: ${b.pay.length} payable, ${kyc} eKYC, ${dup} duplicates`,`Проверен: к выплате ${b.pay.length}, eKYC ${kyc}, дублей ${dup}`);
      toast(T(`Validation done — ${b.pay.length} payable`,`Проверка завершена — к выплате ${b.pay.length}`),kyc+dup?'gold':'');}
    else if(b.st==='valid'){b.st='appr';bLog(b,'Approved by checker J. Tan (4-eyes)','Утверждён контролёром J. Tan (принцип 4 глаз)');act(`Batch ${b.id} approved`,`Пакет ${b.id} утверждён`);toast(T('Batch approved — ready to send','Пакет утверждён — можно отправлять'))}
    else if(b.st==='appr'){return payout(b,b.pay,false)}
    else if(b.st==='done'){b.st='rec';bLog(b,`Reconciled: ${kld(b.paidAmt)} matches bank statement`,`Сверено: ${kld(b.paidAmt)} совпадает с выпиской`);act(`Batch ${b.id} reconciled`,`Пакет ${b.id} сверен`);toast(T('Reconciled — no discrepancies','Сверено — расхождений нет'))}
    save();if(S.view==='pay'){rPay();nav()}};
}
async function payout(b,ids,retry){
  if(runningB)return;runningB=b.id;const amt=PROGS[b.prog][2];
  if(!retry){b.ch={bank:{t:0,ok:0,f:0},wallet:{t:0,ok:0,f:0},cash:{t:0,ok:0,f:0}};b.res={};b.paidAmt=0;b.failed=[]}
  else{ids.forEach(id=>{const c=b.ch[hhById(id).ch];c.f--;c.t+=0})}
  if(!retry)ids.forEach(id=>b.ch[hhById(id).ch].t++);
  b.st='run';bLog(b,retry?`Retry of ${ids.length} failed payments`:`Sent to payment switch: ${ids.length} instructions`,retry?`Повтор ${ids.length} неудачных выплат`:`Отправлено в шлюз: ${ids.length} поручений`);save();if(S.view==='pay')rPay();
  const r=rng(b.id.length*31+ids.length+(retry?7:0)),newFail=[];
  for(let i=0;i<ids.length;i++){
    const h=hhById(ids[i]),fp={bank:.02,wallet:.06,cash:.04}[h.ch]*(retry?.3:1),ok=r()>fp;
    b.res[h.id]=ok?'ok':'fail';const c=b.ch[h.ch];if(ok){c.ok++;b.paidAmt+=amt}else{c.f++;newFail.push(h.id)}
    if(i%Math.max(1,Math.floor(ids.length/12))===0){await wait(90);if(S.view==='pay'&&S.selB===b.id){const sd=$('#bSide');if(sd){sd.innerHTML=batchCard(b)}}}
  }
  b.failed=retry?newFail:newFail;b.st='done';runningB=null;
  bLog(b,`Completed: ${kld(b.paidAmt)} paid, ${b.failed.length} failed`,`Завершён: выплачено ${kld(b.paidAmt)}, ошибок ${b.failed.length}`);
  act(`Batch ${b.id}: ${kld(b.paidAmt)} disbursed`,`Пакет ${b.id}: выплачено ${kld(b.paidAmt)}`);
  toast(T(`Batch ${b.id} completed — ${b.failed.length} failed`,`Пакет ${b.id} завершён — ошибок: ${b.failed.length}`),b.failed.length?'gold':'');
  save();if(S.view==='pay'){rPay();nav()}
}

const ageD=g=>Math.floor(((g.closed?new Date(g.closed):NOW)-new Date(g.opened))/864e5);
function rGriev(){

   <div class="tw"><table><thead><tr><th>ID</th><th>${T('Category','Категория')}</th><th>${T('Household','Семья')}</th><th>${T('Age','Возраст')}</th><th>${T('Status','Статус')}</th></tr></thead><tbody>
    ${list.map(g=>`<tr class="clk ${sel&&g.id===sel.id?'sel':''}" data-g="${g.id}"><td class="mono">${g.id}</td><td>${T(GCAT[g.cat][0],GCAT[g.cat][1])}</td><td class="mono">${g.hh}</td><td class="mono ${g.st!=='res'&&ageD(g)>14?'bad-t':''}">${ageD(g)} ${T('d','дн.')}</td><td><span class="pill ${GST[g.st][2]}">${T(GST[g.st][0],GST[g.st][1])}</span></td></tr>`).join('')||`<tr><td colspan="5" class="empty">${T('Nothing here','Здесь пусто')}</td></tr>`}</tbody></table></div></div>

  $$('[data-gf]',el).forEach(c=>c.onclick=()=>{S.gf=c.dataset.gf;save();rGriev()});
  $$('[data-g]',el).forEach(r=>r.onclick=()=>{S.selG=r.dataset.g;S.gNew=false;save();rGriev();if(innerWidth<1100)$('#gSide').scrollIntoView({behavior:'smooth'})});
  $('#gNew').onclick=()=>{S.gNew=true;S.selG=null;rGriev()};
  const sd=$('#gSide');
  if(S.gNew){sd.innerHTML=`<div class="card"><h3>${T('Log grievance','Регистрация жалобы')}<span class="sp"></span><button class="btn sm" id="gX">✕</button></h3><form id="gF" novalidate><div class="fgrid">
    <div class="f" id="gfH"><label>${T('Household ID','ID семьи')}</label><input class="input mono" id="gH" value="${esc(S.gDraft||'')}" placeholder="HH-10230"><div class="er"></div></div>
    <div class="f"><label>${T('Channel','Канал')}</label><select class="input" id="gC"><option>${T('Hotline','Горячая линия')}</option><option>SMS</option><option>${T('District office','Районный офис')}</option><option>${T('Mobile app','Приложение')}</option></select></div>
    <div class="f full"><label>${T('Category','Категория')}</label><select class="input" id="gK">${Object.keys(GCAT).map(k=>`<option value="${k}">${T(GCAT[k][0],GCAT[k][1])}</option>`).join('')}</select></div>
    <div class="f full" id="gfD"><label>${T('Description','Описание')}</label><textarea class="input" id="gD" rows="3" data-en-ph="What happened? (min. 15 characters)" data-ru-ph="Что случилось? (мин. 15 символов)" placeholder="${T('What happened? (min. 15 characters)','Что случилось? (мин. 15 символов)')}"></textarea><div class="er"></div></div>
    </div><div class="row" style="margin-top:12px"><button class="btn pri" type="submit">${T('Submit','Зарегистрировать')}</button><button class="btn sm" type="button" id="gFill">${T('Fill sample','Заполнить пример')}</button></div></form></div>`;
    $('#gX').onclick=()=>{S.gNew=false;S.gDraft='';rGriev()};
    $('#gFill').onclick=()=>{$('#gH').value=S.gDraft||S.hh[5].id;$('#gK').value='pay';$('#gD').value=T('November child grant has not arrived in the mobile wallet.','Ноябрьское детское пособие не пришло на мобильный кошелёк.')};
    $('#gF').onsubmit=e=>{e.preventDefault();let ok=true;const set=(id,m)=>{const f=$(id);f.classList.toggle('bad',!!m);f.querySelector('.er').textContent=m||'';if(m)ok=false};
      const hid=$('#gH').value.trim().toUpperCase(),d=$('#gD').value.trim();
      set('#gfH',!hhById(hid)?T('Household not found in registry','Семья не найдена в реестре'):'');set('#gfD',d.length<15?T('Describe the issue (15+ characters)','Опишите проблему (15+ символов)'):'');
      if(!ok)return;const g={id:'GR-'+(S.gseq++),hh:hid,cat:$('#gK').value,en:d,ru:d,st:'new',opened:isoD(NOW),closed:null,tl:[{t:isoD(NOW),en:'Logged via '+$('#gC').value,ru:'Принята: '+$('#gC').value}]};
      S.griev.unshift(g);S.selG=g.id;S.gNew=false;S.gDraft='';S.gf='open';act('Grievance logged: '+g.id,'Жалоба зарегистрирована: '+g.id);toast(T(`${g.id} logged · SMS receipt sent to beneficiary`,`${g.id} зарегистрирована · SMS-квитанция отправлена`));save();rGriev();nav()};
    return}
  if(!sel){sd.innerHTML=`<div class="card empty">📮<br>${T('Select a grievance to see its timeline and act on it.','Выберите жалобу, чтобы увидеть историю и действия.')}</div>`;return}
  const h=hhById(sel.hh),nx={new:['asg','Assign to district officer','Назначить районному специалисту'],asg:['inv','Start investigation','Начать расследование'],inv:['res','Resolve','Решить']}[sel.st];
  sd.innerHTML=`<div class="card"><h3><span class="mono">${sel.id}</span><span class="sp"></span><span class="pill ${GST[sel.st][2]}">${T(GST[sel.st][0],GST[sel.st][1])}</span></h3>
   <div style="font-weight:700">${T(GCAT[sel.cat][0],GCAT[sel.cat][1])}</div><div class="muted" style="font-size:13px;margin:4px 0 10px">“${esc(T(sel.en,sel.ru))}”</div>

/* ---------- MAP ---------- */
let CELLS=null;
function buildMap(){
  const r=rng(11),N=72,isl=[];
  for(let i=0;i<N;i++){const a=i/N*Math.PI*2,k=1+.09*Math.sin(3*a+.4)+.06*Math.sin(7*a+1.3)+(r()-.5)*.07;isl.push([300+Math.cos(a)*262*k,208+Math.sin(a)*168*k])}
  const clip=(poly,a,b)=>{const nx=b[0]-a[0],ny=b[1]-a[1],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,sd=p=>(p[0]-mx)*nx+(p[1]-my)*ny,out=[];
    for(let i=0;i<poly.length;i++){const c=poly[i],p=poly[(i+poly.length-1)%poly.length],sc=sd(c),sp=sd(p);const X=()=>{const t=sp/(sp-sc);return[p[0]+(c[0]-p[0])*t,p[1]+(c[1]-p[1])*t]};
      if(sc<=0){if(sp>0)out.push(X());out.push(c)}else if(sp<=0)out.push(X())}return out};
  CELLS=SEEDS.map((s,i)=>{let p=isl;SEEDS.forEach((o,j)=>{if(i!==j&&p.length)p=clip(p,s,o)});const cx=p.reduce((a,q)=>a+q[0],0)/p.length,cy=p.reduce((a,q)=>a+q[1],0)/p.length;return{p,cx,cy}});
  return isl;
}
function dStats(i){
  const a=S.hh.filter(h=>h.d===i),e=a.filter(elig),enr=e.filter(h=>h.ekyc==='ok');
  let ok=0,t=0;S.batches.forEach(b=>{if(!b.res)return;Object.keys(b.res).forEach(id=>{const h=hhById(id);if(h&&h.d===i){t++;if(b.res[id]==='ok')ok++}})});
  const og=S.griev.filter(g=>{const h=hhById(g.hh);return h&&h.d===i&&g.st!=='res'}).length;
  const base=[96.1,93.4,97.2,91.8,89.5,95.0,94.2,92.7,88.9,96.4,90.3][i];
  return{n:a.length,e:e.length,enr:enr.length,cov:e.length?enr.length/e.length*100:0,pay:t?ok/t*100:base,payLive:t>0,og,gr:a.length?og/a.length*1000:0,pop:[412,186,143,221,167,198,154,131,96,178,119][i]};
}
function rMap(){
  const el=$('#v-map');const isl=CELLS?null:buildMap();const st=DIST.map((_,i)=>dStats(i));
  const M={cov:['eKYC-enrolled coverage','Охват (с eKYC)',s=>s.cov,'%'],pay:['Payment success','Успешные выплаты',s=>s.pay,'%'],gr:['Open grievances per 1,000 HH','Жалоб на 1000 семей',s=>s.gr,'']}[S.metric];
  const vals=st.map(M[2]),mn=Math.min(...vals),mx=Math.max(...vals),norm=v=>mx>mn?(v-mn)/(mx-mn):.5;
  const inv=S.metric==='gr';const sel=S.selD,s=st[sel];
  el.innerHTML=`<div class="grid2"><div class="card map"><h3>${T('Republic of Kalinda — districts','Республика Калинда — районы')}<span class="sp"></span><div class="chips">${[['cov','Coverage','Охват'],['pay','Payment success','Выплаты'],['gr','Grievances','Жалобы']].map(c=>`<button class="chip ${S.metric===c[0]?'on':''}" data-m="${c[0]}">${T(c[1],c[2])}</button>`).join('')}</div></h3>
   <svg viewBox="0 0 600 420"><rect x="0" y="0" width="600" height="420" rx="14" style="fill:color-mix(in srgb,var(--blue) 9%,var(--bg2))"/>
   ${CELLS.map((c,i)=>{const t=norm(vals[i]),pct=Math.round((inv?1-t:t)*82+10);return `<path class="d" data-d="${i}" d="M${c.p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join('L')}Z" style="fill:color-mix(in srgb,${inv?'var(--red)':'var(--mal)'} ${inv?100-pct+10:pct}%,var(--panel2));stroke:${i===sel?'var(--gold)':'var(--bg)'};stroke-width:${i===sel?3:1.5}"/>`}).join('')}
   ${CELLS.map((c,i)=>`<text x="${c.cx.toFixed(0)}" y="${c.cy.toFixed(0)}" text-anchor="middle" style="fill:var(--text);font-size:12px;font-weight:700;pointer-events:none;paint-order:stroke;stroke:var(--panel);stroke-width:3px">${DIST[i]}</text><text x="${c.cx.toFixed(0)}" y="${(c.cy+15).toFixed(0)}" text-anchor="middle" style="fill:var(--text);font-size:11px;pointer-events:none;font-family:var(--mono);paint-order:stroke;stroke:var(--panel);stroke-width:3px">${vals[i].toFixed(M[3]?0:1)}${M[3]}</text>`).join('')}
   <circle cx="300" cy="200" r="5" style="fill:var(--gold);pointer-events:none"/></svg>
   <div class="row" style="margin-top:10px;font-size:12px"><span class="muted">${T(M[0],M[1])}</span><span style="flex:1"></span><span class="mono">${vals.length?mn.toFixed(0):0}${M[3]}</span><div class="ramp" style="width:120px;${inv?'background:linear-gradient(90deg,color-mix(in srgb,var(--red) 8%,var(--panel2)),var(--red))':''}"></div><span class="mono">${mx.toFixed(0)}${M[3]}</span></div></div>
   <div class="card"><h3>${DIST[sel]}${sel===0?` <span class="pill gold">${T('capital','столица')}</span>`:''}</h3>
    <div class="dl"><div><span>${T('Population (thousand)','Население (тыс.)')}</span><b>${s.pop}</b></div><div><span>${T('Households in sample','Семей в выборке')}</span><b>${s.n}</b></div>
    <div><span>${T('Eligible','Имеют право')}</span><b>${s.e}</b></div><div><span>${T('Enrolled (eKYC ok)','Подключено (eKYC)')}</span><b>${s.enr}</b></div>
    <div><span>${T('Coverage','Охват')}</span><b class="${s.cov>=85?'ok-t':'warn-t'}">${s.cov.toFixed(0)}%</b></div><div><span>${T('Payment success','Успешные выплаты')}</span><b>${s.pay.toFixed(1)}% ${s.payLive?'<span class="pill ok" style="font-size:10px">live</span>':''}</b></div>
    <div><span>${T('Open grievances','Открытые жалобы')}</span><b class="${s.og?'warn-t':''}">${s.og}</b></div><div><span>${T('Not enrolled','Не подключено')}</span><b>${s.e-s.enr}</b></div></div>
    <div class="prog" style="margin-top:12px"><i style="width:${s.cov}%"></i></div>
    <div class="row" style="margin-top:12px"><button class="btn sm pri" id="mReg">${T('Open district registry','Реестр района')}</button><button class="btn sm" id="mDrive">${T('Plan enrolment drive','Запланировать выезд')}</button></div>
    <h3 style="margin-top:16px">${T('Ranking','Рейтинг')}</h3>${st.map((x,i)=>[i,vals[i]]).sort((a,b)=>inv?a[1]-b[1]:b[1]-a[1]).map(([i,v],k)=>`<div class="brk" style="grid-template-columns:22px minmax(0,1fr) 58px;cursor:pointer" data-dr="${i}"><span class="muted mono">${k+1}</span><span style="${i===sel?'font-weight:700;color:var(--gold2)':''}">${DIST[i]}</span><span class="mono" style="text-align:right">${v.toFixed(M[3]?0:1)}${M[3]}</span></div>`).join('')}</div></div>`;
  $$('[data-m]',el).forEach(c=>c.onclick=()=>{S.metric=c.dataset.m;save();rMap()});
  $$('[data-d],[data-dr]',el).forEach(p=>p.addEventListener('click',()=>{S.selD=+(p.dataset.d??p.dataset.dr);save();rMap()}));
  $('#mReg').onclick=()=>{S.f={q:'',d:String(sel),p:'',s:''};S.page=0;S.adding=false;go('reg')};
  $('#mDrive').onclick=()=>{act(`Enrolment drive planned: ${DIST[sel]} (${s.e-s.enr} households)`,`Запланирован выезд: ${DIST[sel]} (${s.e-s.enr} семей)`);toast(T(`Mobile eKYC team scheduled for ${DIST[sel]} — ${s.e-s.enr} households to visit`,`Мобильная группа eKYC назначена в ${DIST[sel]} — посетить ${s.e-s.enr} семей`))};
}

  b.disabled=true;b.textContent=T('Signing in…','Вход…');await wait(120);S.auth=true;act('Signed in: MSW-04417 (maker)','Вход: MSW-04417 (исполнитель)');b.disabled=false;PT.apply($('#loginWrap'));render()};
