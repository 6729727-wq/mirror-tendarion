 <div class="prog"><i id="sBar"></i></div><div style="display:flex;justify-content:space-between;font-size:12px;margin-top:6px" class="muted"><span id="sCnt"></span><span id="sRes"></span></div>
 <h3 style="margin-top:16px">${T('Live findings','Находки в реальном времени')}</h3><div class="feed" id="feed">${sc?sc.feed.join(''):`<div class="muted">${T('Start a scan to see findings appear here.','Запустите сканирование — находки появятся здесь.')}</div>`}</div></div>
 <div class="card"><h3>${T('Scan history','История сканирований')}</h3><div class="tw"><table><thead><tr><th>ID</th><th>${T('Date','Дата')}</th><th>${T('Scope','Охват')}</th><th>${T('Hosts','Хосты')}</th><th>${T('New','Новые')}</th><th>${T('Fixed','Закрыто')}</th></tr></thead><tbody>${S.scans.map((s,k)=>`<tr class="${k===0&&s.fresh?'new':''}"><td class="mono">${s.id}</td><td class="mono">${d10(s.t)} ${hm(s.t)}</td><td>${s.scope==='all'?T('all','все'):s.scope}</td><td>${s.n}</td><td>${s.nw?`<span class="pill bad">+${s.nw}</span>`:0}</td><td>${s.fx?`<span class="pill ok">−${s.fx}</span>`:0}</td></tr>`).join('')}</tbody></table></div>
 <div class="muted" style="font-size:12px;margin-top:10px">${T('Continuous monitoring: authenticated scans weekly, internet-facing hosts daily. Results feed RA-5 and CA-7 evidence automatically.','Непрерывный мониторинг: аутентифицированные скан. еженедельно, интернет-хосты ежедневно. Результаты автоматически идут в доказательства RA-5 и CA-7.')}</div></div></div>`;
 if(sc)scanUi();const b=$('#sGo');if(b)b.onclick=()=>{const v=$('#sScope').value;const list=ASSETS.filter(a=>v==='all'||(v==='cloud'&&a.cloud)||(v==='prem'&&!a.cloud)||v==='sys:'+a.sys).map(a=>a.i);runScan(list,v.replace('sys:',''),$('#sProf').value)}}
function runScan(list,scope,prof,cb){if(scanning){toast(T('A scan is already running','Сканирование уже идёт'),'bad');return}
 const id='SC-0'+(319+S.scans.length);scanning={id,list,k:0,nw:0,fx:0,t0:Date.now(),scope,prof,feed:[]};renderNav();if(view==='scan')vScan();
 const per=Math.max(60,Math.min(450,5200/list.length));
 const iv=setInterval(()=>{const sc=scanning,a=A(sc.list[sc.k]);
  S.F.forEach(f=>{if(f.a!==a.i)return;if(f.st==='hidden'&&prof!=='cfg'||f.st==='hidden'&&prof==='cfg'&&Vn(f.v).id.startsWith('BAS')){f.st='open';f.d=Date.now();f.nw=1;sc.nw++;sc.feed.unshift(`<div class="b">+ ${hm(Date.now())} ${a.n} · ${Vn(f.v).id}${Vn(f.v).kev?' [KEV]':''} · CVSS ${Vn(f.v).cvss}</div>`)}
   else if(f.st==='patched'){f.st='fixed';f.x=Date.now();sc.fx++;sc.feed.unshift(`<div class="g">✓ ${hm(Date.now())} ${a.n} · ${Vn(f.v).id} ${T('verified fixed','исправление подтверждено')}</div>`)}});
  if(R()<.25)sc.feed.unshift(`<div class="muted">· ${a.n} ${T('ok','норма')} (${(R()*900+200|0)} ${T('checks','проверок')})</div>`);sc.feed=sc.feed.slice(0,60);
  sc.k++;if(view==='scan')scanUi();
  if(sc.k>=sc.list.length){clearInterval(iv);const closed=closeTickets();S.scans.forEach(s=>s.fresh=0);S.scans.unshift({id,t:Date.now(),scope,prof,n:sc.list.length,nw:sc.nw,fx:sc.fx,dur:Date.now()-sc.t0,fresh:1});pushTrend();scanning=null;save();render();
   toast(`<b>${id}</b> ${T('complete','завершено')}: +${sc.nw} ${T('new','новых')}, −${sc.fx} ${T('fixed','исправлено')}`+(closed.length?`<br>${T('Tickets closed','Тикеты закрыты')}: ${closed.join(', ')}`:''),sc.nw?'bad':'');if(cb)cb()}},per)}
const R=rng(Date.now()%1e6);
function scanUi(){const sc=scanning;if(!sc||!$('#sBar'))return;$('#sBar').style.width=(sc.k/sc.list.length*100)+'%';$('#sCnt').textContent=sc.k+' / '+sc.list.length+T(' hosts',' хостов');$('#sRes').innerHTML=`<span class="up">+${sc.nw}</span> · <span class="dn">−${sc.fx}</span>`;$('#sNow').textContent=sc.id+' · '+(A(sc.list[Math.min(sc.k,sc.list.length-1)]).n);$('#feed').innerHTML=sc.feed.join('')}
function closeTickets(){const c=[];S.tk.forEach(t=>{if(t.st==='pending'&&t.f.every(i=>S.F[i].st==='fixed')){t.st='closed';t.x=Date.now();S.mttr[t.p].push(Math.max(.01,(t.x-t.c)/DAY));c.push(t.id)}});return c}

const vulnHead=()=>`<thead><tr><th>${T('Priority','Приоритет')}</th><th>${T('Vulnerability','Уязвимость')}</th><th>CVSS</th><th>${T('Exploit prob.','Вероятн. эксплуатации')}</th><th>KEV</th><th>${T('Assets','Активы')}</th><th>${T('Risk','Риск')}</th><th>SLA</th><th>${T('Ticket','Тикет')}</th></tr></thead>`;
function vulnRow(g){const v=g.v,left=SLA[g.p]-g.age;return`<tr class="clk ${g.f.some(f=>f.nw)?'new':''}" data-v="${v.i}"><td>${pr(g.p)}</td><td><span class="mono" style="font-size:12px">${v.id}</span><div style="max-width:340px;overflow:hidden;text-overflow:ellipsis">${L(v)}</div></td><td class="mono"><b>${v.cvss.toFixed(1)}</b></td><td>${epss(v.epss)}</td><td>${v.kev?'<span class="kev">KEV</span>':'<span class="muted">—</span>'}</td><td>${g.f.length}</td><td class="mono"><b>${g.r.toFixed(0)}</b></td><td>${left<0?`<span class="pill bad">${T('overdue ','просрочено ')}${Math.ceil(-left)}${T('d','д')}</span>`:`<span class="pill">${Math.ceil(left)}${T('d left',' д')}</span>`}</td><td>${g.tk?`<span class="pill gold mono">${g.tk.id}</span>`:`<button class="btn xs gold" data-mk="${v.i}">+ ${T('Ticket','Тикет')}</button>`}</td></tr>`}
function bindVulnRows(sc){$$(sc+' tr[data-v]').forEach(r=>r.onclick=e=>{const mk=e.target.closest('[data-mk]');if(mk){e.stopPropagation();mkTicket(+mk.dataset.mk);return}vulnModal(+r.dataset.v)})}
function vVuln(){let g=groups().filter(x=>(!vf.kev||x.v.kev)&&(vf.p==='all'||x.p===vf.p)&&(vf.sys==='all'||x.f.some(f=>A(f.a).sys===vf.sys))&&(!vf.q||(x.v.id+x.v.en+x.v.ru).toLowerCase().includes(vf.q)));
 const cnt=p=>groups().filter(x=>x.p===p).length;
 $('#v-vuln').innerHTML=`<div class="tools"><input class="input" id="vq" value="${esc(vf.q)}" placeholder="${T('Search CVE or title…','Поиск CVE или названия…')}"><select class="input" id="vp">${opts([['all',T('All priorities','Все приоритеты')],['P1','P1 · '+cnt('P1')],['P2','P2 · '+cnt('P2')],['P3','P3 · '+cnt('P3')],['P4','P4 · '+cnt('P4')]],vf.p)}</select><select class="input" id="vs">${sysOpts(vf.sys)}</select><label class="pill" style="cursor:pointer"><input type="checkbox" id="vk" ${vf.kev?'checked':''}> KEV ${T('only','только')}</label></div>
 <div class="muted" style="font-size:12px;margin-bottom:10px">${T('Risk = CVSS × exploit probability (KEV = 100%) × asset criticality × internet exposure. Sorted by priority, then risk — not by CVSS alone.','Риск = CVSS × вероятность эксплуатации (KEV = 100%) × критичность актива × доступность из интернета. Сортировка по приоритету и риску, а не только по CVSS.')}</div>
 <div class="tw"><table>${vulnHead()}<tbody>${g.map(vulnRow).join('')||`<tr><td colspan="9" class="muted">${T('Nothing matches','Ничего не найдено')}</td></tr>`}</tbody></table></div>`;
 $('#vq').oninput=e=>{vf.q=e.target.value.toLowerCase();vVuln();const q=$('#vq');q.focus();q.setSelectionRange(q.value.length,q.value.length)};$('#vp').onchange=e=>{vf.p=e.target.value;vVuln()};$('#vs').onchange=e=>{vf.sys=e.target.value;vVuln()};$('#vk').onchange=e=>{vf.kev=e.target.checked;vVuln()};bindVulnRows('#v-vuln')}
function vulnModal(vi){const g=groups().find(x=>x.v.i===vi);if(!g)return;const v=g.v,f0=g.f.slice().sort((a,b)=>risk(b)-risk(a))[0],a0=A(f0.a);
 modal(`<h2><span class="mono">${v.id}</span> ${v.kev?'<span class="kev">KEV</span>':''}</h2><div style="font-weight:600">${L(v)}</div>
 <div class="pkg mt"><b>${T('Why this priority','Почему такой приоритет')}</b><div class="mono" style="font-size:12.5px;margin-top:6px">CVSS ${v.cvss} × ${v.kev?'KEV 1.00':T('exploit ','эксплуат. ')+(.25+.75*v.epss).toFixed(2)} × ${T('criticality','критичность')} ${a0.crit} × ${T('exposure','доступность')} ${a0.net?'1.3':'1.0'} → <b>${risk(f0).toFixed(0)}</b> ${pr(g.p)}</div><div class="muted" style="font-size:12px;margin-top:6px">${T('Fix','Исправление')}: ${v.fix} · SLA ${SLA[g.p]} ${T('days','дней')}</div></div>
 <h3 style="font-size:14px;margin:14px 0 6px">${T('Affected assets','Затронутые активы')} (${g.f.length})</h3><div class="tw"><table><tbody>${g.f.map(f=>`<tr><td class="mono">${A(f.a).n}</td><td>${A(f.a).net?`<span class="pill warn">${T('internet','интернет')}</span>`:''}</td><td class="mono">${risk(f).toFixed(0)}</td><td class="mono">${d10(f.d)}</td><td>${f.st==='patched'?`<span class="pill gold">${T('patched','пропатчен')}</span>`:''}</td></tr>`).join('')}</tbody></table></div>
 <div class="acts"><button class="btn" data-close>${T('Close','Закрыть')}</button>${g.tk?`<button class="btn gold" data-ok>${T('Open ticket ','Открыть тикет ')}${g.tk.id}</button>`:`<button class="btn gold" data-ok>+ ${T('Create remediation ticket','Создать тикет на устранение')}</button>`}</div>`,()=>{if(g.tk)go('rem');else mkTicket(vi)})}
function mkTicket(vi){const g=groups().find(x=>x.v.i===vi);if(!g||g.tk)return;const t={id:'REM-'+S.nextTk++,v:vi,f:g.f.map(f=>f.id),p:g.p,st:'open',c:Date.now(),due:Date.now()+SLA[g.p]*DAY,who:null,nw:1};S.tk.unshift(t);save();toast(`${T('Ticket','Тикет')} <b>${t.id}</b> ${T('created','создан')} · ${g.f.length} ${T('assets','активов')}`,'gold');go('rem')}

function vRem(){const cols=[['open',T('Open','Открыт')],['assigned',T('In progress','В работе')],['pending',T('Patched · verify','Пропатчен · проверка')],['closed',T('Closed','Закрыт')]];
 $('#v-rem').innerHTML=`<div class="muted" style="font-size:12.5px;margin-bottom:12px">${T('Workflow: open → assign → deploy patch → rescan verifies the fix and closes the ticket automatically.','Процесс: открыт → назначен → патч развёрнут → пересканирование подтверждает и само закрывает тикет.')}</div><div class="kan">${cols.map(c=>{const ts=S.tk.filter(t=>t.st===c[0]||(c[0]==='assigned'&&t.st==='patching'));return`<div class="col"><h4>${c[1]}<span class="pill" style="margin-left:auto">${ts.length}</span></h4>${ts.map(tkCard).join('')||`<div class="muted" style="font-size:12px;padding:6px">${c[0]==='open'?T('Create tickets from Vulnerabilities','Создайте тикеты из «Уязвимостей»'):'—'}</div>`}</div>`}).join('')}</div>`;
 $$('#v-rem [data-t]').forEach(b=>b.onclick=()=>tkAct(S.tk.find(t=>t.id===b.dataset.t),b.dataset.a));S.tk.forEach(t=>t.nw=0)}
function tkCard(t){const v=Vn(t.v),od=t.st!=='closed'&&t.due<Date.now();const act={open:`<button class="btn xs gold" data-t="${t.id}" data-a="assign">${T('Assign','Назначить')}</button>`,assigned:`<button class="btn xs pri" data-t="${t.id}" data-a="patch">⇪ ${T('Deploy patch','Развернуть патч')}</button>`,patching:`<div class="prog" style="flex:1"><i style="width:${t.pg||0}%"></i></div>`,pending:`<button class="btn xs pri" data-t="${t.id}" data-a="rescan" ${scanning?'disabled':''}>↻ ${T('Rescan to verify','Пересканировать')}</button>`,closed:`<span class="pill ok">✓ ${T('verified','подтверждено')} · ${((t.x-t.c)/DAY<1?Math.max(1,Math.round((t.x-t.c)/6e4))+T(' min',' мин'):((t.x-t.c)/DAY).toFixed(1)+T(' d',' д'))}</span>`}[t.st];
 return`<div class="tk ${t.nw?'new':''}"><div style="display:flex;gap:6px;align-items:center">${pr(t.p)}<b class="mono">${t.id}</b>${v.kev?'<span class="kev">KEV</span>':''}</div><div class="t">${L(v)}</div><div class="m mono">${v.id} · ${t.f.length} ${T('assets','активов')}</div><div class="m">${t.who?'👤 '+LA(ENG[t.who-1]):T('Unassigned','Не назначен')} · <span class="${od?'up':''}">${T('due ','срок ')}${d10(t.due)}</span></div><div class="a">${act}</div></div>`}
function tkAct(t,a){if(a==='assign'){modal(`<h2>${T('Assign','Назначить')} ${t.id}</h2><div class="muted">${L(Vn(t.v))}</div><div class="f mt"><label>${T('Engineer','Инженер')}</label><select class="input" id="eng">${ENG.map((e,i)=>`<option value="${i+1}">${LA(e)}</option>`).join('')}</select></div><div class="f mt"><label>${T('Change window','Окно изменений')}</label><select class="input"><option>${T('Emergency (KEV) — now','Экстренно (KEV) — сейчас')}</option><option>${T('Next standard window','Ближайшее плановое окно')}</option></select></div><div class="acts"><button class="btn" data-close>${T('Cancel','Отмена')}</button><button class="btn pri" data-ok>${T('Assign','Назначить')}</button></div>`,m=>{t.who=+$('#eng',m).value;t.st='assigned';save();vRem();renderNav();toast(t.id+' → '+LA(ENG[t.who-1]))});return}
 if(a==='patch'){t.st='patching';t.pg=0;vRem();const iv=setInterval(()=>{t.pg+=9;if(view==='rem')vRem();if(t.pg>=100){clearInterval(iv);t.st='pending';t.f.forEach(i=>{if(S.F[i].st==='open')S.F[i].st='patched'});save();vRem();renderNav();toast(`⇪ ${T('Patch deployed to','Патч развёрнут на')} ${t.f.length} ${T('assets. Rescan to verify.','активов. Пересканируйте для проверки.')}`,'gold')}},160);return}
 if(a==='rescan'){const list=[...new Set(t.f.map(i=>S.F[i].a))];toast(T('Targeted rescan of ','Точечное сканирование ')+list.length+T(' hosts…',' хостов…'));runScan(list,t.id,'auth')}}
