function submitApp(){
  const d=S.draft;for(let i=0;i<5;i++){const e=validate(d,i);if(e.length){d.s=i;d.errs=e;save();rBuild();toast(T('Cannot submit — fix the highlighted step','Нельзя отправить — исправьте шаг'),'bad');return}}
  const c=calc(d),id='GD-26-0'+(S.next++);
  S.apps.unshift({id,opp:d.opp,t:{en:d.proj.title,ru:d.proj.title},req:c.req,st:'sub',date:Date.now()});
  S.queue.unshift({id,org:d.org.name,opp:d.opp,t:{en:d.proj.title,ru:d.proj.title},abs:{en:d.proj.sum,ru:d.proj.sum},req:c.req,others:[{n:'R. Okafor',s:70+Math.floor(Math.random()*22)},{n:'L. Chen',s:66+Math.floor(Math.random()*26)}],mine:null,dec:null,own:true});

function barsSvg(labels,series,cols,fmt){
  const W=640,H=220,p={l:52,r:8,t:12,b:26};const max=Math.max(1,...series.flat())*1.12;const n=labels.length,gw=(W-p.l-p.r)/n,bw=Math.min(22,(gw-10)/series.length);
  let g='';for(let i=0;i<=4;i++){const y=p.t+(H-p.t-p.b)*i/4;g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="${cssv('--line')}"/><text x="${p.l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="${cssv('--dim')}">${fmt(max*(1-i/4))}</text>`}
  labels.forEach((l,i)=>{const x0=p.l+gw*i+(gw-bw*series.length)/2;series.forEach((s,k)=>{const h=(H-p.t-p.b)*s[i]/max;g+=`<rect x="${x0+k*bw}" y="${H-p.b-h}" width="${bw-3}" height="${h}" rx="3" fill="${cssv(cols[k])}"><title>${l}: ${fmt(s[i])}</title></rect>`});g+=`<text x="${p.l+gw*i+gw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="${cssv('--muted')}">${l}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function donutSvg(parts){const tot=parts.reduce((a,p)=>a+p.v,0)||1;let a=-Math.PI/2,g='';const R=70,r=44,cx=90,cy=90;

  return `<svg viewBox="0 0 180 180" style="max-width:180px;margin:auto">${g}<text x="90" y="88" text-anchor="middle" font-size="18" font-weight="800" fill="${cssv('--text')}">${ms(tot)}</text><text x="90" y="106" text-anchor="middle" font-size="10" fill="${cssv('--muted')}">${T('portfolio','портфель')}</text></svg>`}

    <div class="card"><h3>${T('Request drawdown','Запрос транша')}</h3>
     <div class="f"><label>${T('Amount, USD','Сумма, USD')}</label><input class="input" id="dAmt" type="number" min="1" step="100" placeholder="25000"></div>
     <div class="f" style="margin-top:10px"><label>${T('Purpose / cost category','Назначение / статья')}</label><input class="input" id="dPur" placeholder="${T('e.g. October payroll & fringe','напр. зарплата за октябрь')}"></div>
     <label class="chk" style="margin:10px 0"><input type="checkbox" id="dCash"><span>${T('Funds needed within 3 business days (cash management, 2 CFR 200.305)','Средства нужны в течение 3 рабочих дней (2 CFR 200.305)')}</span></label>
     <button class="btn pri wide" id="dGo">${T('Submit drawdown','Отправить запрос')}</button>
     <div class="muted" style="font-size:12px;margin-top:8px">${T('Requests above 15% of the award require program officer approval.','Запросы свыше 15% суммы гранта одобряет специалист.')}</div></div></div>
   <div class="card" style="margin-top:14px"><h3>${T('Payment history','История выплат')}</h3><div class="tw"><table class="t"><thead><tr><th>ID</th><th>${T('Date','Дата')}</th><th>${T('Purpose','Назначение')}</th><th class="num">${T('Amount','Сумма')}</th><th>${T('Status','Статус')}</th><th></th></tr></thead><tbody>
     ${w.dd.length?w.dd.slice().sort((a,b)=>b.date-a.date).map(d=>`<tr><td class="mono" style="font-size:12px">${d.id}</td><td>${fmtD(d.date)}</td><td>${esc(L(d.p))}</td><td class="num">${usd(d.amt)}</td><td><span class="pill ${DST[d.st][2]}">${T(DST[d.st][0],DST[d.st][1])}</span></td><td>${d.st==='pend'?`<div class="row" style="flex-wrap:nowrap"><button class="btn sm pri" data-ok="${d.id}">${T('Approve','Одобрить')}</button><button class="btn sm danger" data-no="${d.id}">${T('Reject','Отклонить')}</button></div>`:''}</td></tr>`).join(''):`<tr><td colspan="6" class="muted">${T('No drawdowns yet','Траншей пока нет')}</td></tr>`}
   </tbody></table></div></div>`;
  $$('[data-a]',el).forEach(b=>b.onclick=()=>{S.awSel=b.dataset.a;save();rAwards()});
  $('#dGo').onclick=()=>{const a=+$('#dAmt').value,pu=$('#dPur').value.trim();
    if(!(a>0)){toast(T('Enter an amount','Введите сумму'),'bad');return}if(a>avail){toast(T('Exceeds available balance ','Больше доступного остатка ')+usd(avail),'bad');return}if(pu.length<4){toast(T('Describe the purpose','Укажите назначение'),'bad');return}
    const big=a>w.obl*.15;const id=w.id+'-D'+(w.dd.length+1);w.dd.push({id,date:Date.now(),amt:a,p:{en:pu,ru:pu},st:big?'pend':'paid'});logA('Drawdown '+id+' '+usd(a)+(big?' awaiting approval':' paid'),'Транш '+id+' '+usd(a)+(big?' ждёт одобрения':' выплачен'));save();
    toast(big?T('Sent for approval (above 15% threshold)','Отправлено на одобрение (свыше 15%)'):T('Approved automatically · ACH payment in 1–2 days','Одобрено автоматически · платёж ACH за 1–2 дня'),big?'gold':'');render()};
  $$('[data-ok]',el).forEach(b=>b.onclick=()=>{const d=w.dd.find(x=>x.id===b.dataset.ok);d.st='paid';d.date=Date.now();logA(d.id+' approved and paid',d.id+' одобрен и выплачен');save();toast(T('Payment released','Платёж проведён'));render()});
  $$('[data-no]',el).forEach(b=>b.onclick=()=>{const d=w.dd.find(x=>x.id===b.dataset.no);d.st='rej';logA(d.id+' rejected',d.id+' отклонён');save();toast(T('Drawdown rejected','Транш отклонён'),'bad');render()});
}

/* ---------- REPORTS ---------- */
const RT={ffr:['SF-425 Federal Financial Report','SF-425 Финансовый отчёт'],rppr:['RPPR Performance progress report','RPPR Отчёт о ходе работ'],close:['Closeout report','Итоговый отчёт']};
const RST={due:['Due','К сдаче','warn'],over:['Overdue','Просрочен','bad'],sub:['Submitted','Подан','gold'],acc:['Accepted','Принят','ok']};
function rReports(){
  const el=$('#v-reports');const stOf=r=>r.st==='due'&&daysTo(r.due)<0?'over':r.st;
  const list=S.reports.filter(r=>S.repTab==='all'||stOf(r)===S.repTab).sort((a,b)=>a.due-b.due);
  const W=640,H=96,span=120,x=t=>24+(W-48)*((t-(Date.now()-30*DAY))/((span+30)*DAY));
  const tlR=S.reports.filter(r=>r.due>Date.now()-30*DAY&&r.due<Date.now()+span*DAY);
  const svg=`<svg viewBox="0 0 ${W} ${H}"><line x1="24" x2="${W-24}" y1="50" y2="50" stroke="${cssv('--line2')}" stroke-width="2"/>${[0,30,60,90,120].map(d=>`<line x1="${x(Date.now()+d*DAY)}" x2="${x(Date.now()+d*DAY)}" y1="44" y2="56" stroke="${cssv('--line2')}"/><text x="${x(Date.now()+d*DAY)}" y="84" text-anchor="middle" font-size="11" fill="${cssv('--muted')}">${d?'+'+d+T('d','д'):T('today','сегодня')}</text>`).join('')}<line x1="${x(Date.now())}" x2="${x(Date.now())}" y1="16" y2="64" stroke="${cssv('--gold')}" stroke-dasharray="3 3"/>${tlR.map((r,i)=>{const s=stOf(r);const c={due:'--amber',over:'--red',sub:'--gold',acc:'--mal'}[s];return `<circle cx="${x(r.due)}" cy="${i%2?38:62}" r="7" fill="${cssv(c)}"><title>${r.id} · ${fmtD(r.due)}</title></circle>`}).join('')}</svg>`;
  el.innerHTML=`<div class="card chart" style="margin-bottom:14px"><h3>${T('Due-date timeline (−30 … +120 days)','Сроки отчётов (−30 … +120 дней)')}</h3>${svg}<div class="legend">${Object.keys(RST).map(k=>`<span><i style="background:var(${{due:'--amber',over:'--red',sub:'--gold',acc:'--mal'}[k]})"></i>${T(RST[k][0],RST[k][1])} · ${S.reports.filter(r=>stOf(r)===k).length}</span>`).join('')}</div></div>
   <div class="card"><div class="tabs">${[['all','All','Все'],['over','Overdue','Просрочены'],['due','Due','К сдаче'],['sub','Submitted','Поданы'],['acc','Accepted','Приняты']].map(t=>`<button class="chip ${S.repTab===t[0]?'on':''}" data-tab="${t[0]}">${T(t[1],t[2])}</button>`).join('')}</div>
   <div class="tw"><table class="t"><thead><tr><th>${T('Report','Отчёт')}</th><th>${T('Award','Грант')}</th><th>${T('Period','Период')}</th><th>${T('Due','Срок')}</th><th>${T('Status','Статус')}</th><th></th></tr></thead><tbody>
   ${list.map(r=>{const s=stOf(r),d=daysTo(r.due);return `<tr><td><b>${T(RT[r.type][0],RT[r.type][1])}</b><div class="mono muted" style="font-size:11.5px">${r.id}</div></td><td class="mono" style="font-size:12px">${r.aw}</td><td>${esc(L(r.per))}</td><td style="white-space:nowrap">${fmtD(r.due)}${r.st==='due'?`<div class="${d<0?'bad-t':d<=14?'warn-t':'muted'}" style="font-size:11.5px">${d<0?T(-d+' days late',`просрочен на ${-d} дн.`):T('in '+d+' days',`через ${d} дн.`)}</div>`:''}</td><td><span class="pill ${RST[s][2]}">${T(RST[s][0],RST[s][1])}</span>${r.note?`<div class="bad-t" style="font-size:11.5px">${esc(r.note)}</div>`:''}</td>
     <td>${r.st==='due'?`<button class="btn sm pri" data-open="${r.id}">${S.repOpen===r.id?T('Close','Закрыть'):T('Prepare','Заполнить')}</button>`:r.st==='sub'?`<div class="row" style="flex-wrap:nowrap"><button class="btn sm pri" data-acc="${r.id}">${T('Accept','Принять')}</button><button class="btn sm danger" data-ret="${r.id}">${T('Return','Вернуть')}</button></div>`:''}</td></tr>
     ${S.repOpen===r.id?`<tr><td colspan="6" style="background:var(--bg2)">${repForm(r)}</td></tr>`:''}`}).join('')||`<tr><td colspan="6" class="muted">${T('Nothing here','Пусто')}</td></tr>`}
   </tbody></table></div></div>`;
  $$('[data-tab]',el).forEach(b=>b.onclick=()=>{S.repTab=b.dataset.tab;save();rReports()});
  $$('[data-open]',el).forEach(b=>b.onclick=()=>{S.repOpen=S.repOpen===b.dataset.open?null:b.dataset.open;save();rReports()});
  $$('[data-acc]',el).forEach(b=>b.onclick=()=>{const r=S.reports.find(x=>x.id===b.dataset.acc);r.st='acc';logA(r.id+' accepted',r.id+' принят');save();toast(T('Report accepted','Отчёт принят'));render()});
  $$('[data-ret]',el).forEach(b=>b.onclick=()=>{const r=S.reports.find(x=>x.id===b.dataset.ret);r.st='due';r.note=T('Returned: reconcile line 10e with drawdowns','Возвращён: сверьте строку 10e с траншами');logA(r.id+' returned for correction',r.id+' возвращён на доработку');save();toast(T('Returned to recipient','Возвращён получателю'),'gold');render()});
  const fs=$('#repSub');if(fs)fs.onclick=()=>{const r=S.reports.find(x=>x.id===S.repOpen);
    if(r.type==='ffr'){const e=+$('#fExp').value,c=+$('#fCash').value;const w=S.awards.find(a=>a.id===r.aw);if(!(e>0)){toast(T('Enter federal expenditures','Укажите федеральные расходы'),'bad');return}if(w&&e>w.obl){toast(T('Expenditures exceed obligation','Расходы больше обязательства'),'bad');return}if(c<0){toast(T('Cash on hand cannot be negative','Остаток не может быть отрицательным'),'bad');return}r.data={e,c}}
    else{const t=$('#fAcc').value.trim();if(t.length<40){toast(T('Describe accomplishments (40+ characters)','Опишите результаты (от 40 символов)'),'bad');return}r.data={t,p:+$('#fPct').value}}
    r.st='sub';r.note='';S.repOpen=null;logA(r.id+' submitted',r.id+' подан');save();toast(T('Report submitted · confirmation sent','Отчёт подан · подтверждение отправлено'),'gold');render()};
  const pc=$('#fPct');if(pc)pc.oninput=()=>$('#fPctO').textContent=pc.value+'%';
}
function repForm(r){
  const w=S.awards.find(a=>a.id===r.aw),paid=w?w.dd.filter(d=>d.st==='paid').reduce((a,d)=>a+d.amt,0):0;
  return r.type==='ffr'?`<div class="fgrid" style="padding:6px 0"><div class="f"><label>${T('10e. Federal share of expenditures','10e. Федеральные расходы')}</label><input class="input" id="fExp" type="number" min="0" value="${paid}"><div class="hint">${T('Cash received to date','Получено на дату')}: ${usd(paid)}</div></div>
     <div class="f"><label>${T('10c. Cash on hand','10c. Остаток средств')}</label><input class="input" id="fCash" type="number" min="0" value="0"></div>
     <div class="full row"><button class="btn pri" id="repSub">${T('Certify & submit SF-425','Подписать и подать SF-425')}</button></div></div>`
   :`<div class="fgrid" style="padding:6px 0"><div class="f full"><label>${T('Accomplishments this period','Результаты за период')}</label><textarea class="input" id="fAcc" placeholder="${T('Milestones reached, people served, publications…','Достигнутые этапы, охват, публикации…')}"></textarea></div>
     <div class="f"><label>${T('Milestones complete','Выполнено этапов')} · <output id="fPctO">50%</output></label><input type="range" id="fPct" min="0" max="100" value="50"></div>
     <div class="f" style="align-self:end"><button class="btn pri" id="repSub">${T('Submit RPPR','Подать RPPR')}</button></div></div>`;
}

PT.onLang(()=>render());
render();
})();
</script>
