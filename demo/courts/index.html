<div class="grid2 g-j"><div class="card"><h3>${T('Today in Court 1','Сегодня в зале 1')}</h3>${l.map(c=>{const t=S.today[c.id];return `<div class="clr ${t.st}"><span class="itn">${t.item}</span><div class="grow"><b>${cno(c)}</b><span>${esc(cname(c))}</span></div>${pill(CST[t.st][0],CST[t.st][1])}</div>`}).join('')}<div class="row mt" style="gap:8px;flex-wrap:wrap">${cur?'':`<button class="btn pri" id="call" ${l.some(c=>S.today[c.id].st==='wait')?'':'disabled'}>📣 ${T('Call next matter','Вызвать следующее дело')}</button>`}${cur?`<button class="btn" id="pass">${T('Pass over','Пропустить')}</button>`:''}</div></div>
<div class="card">${cur?`<h3>${T('Now hearing','Слушается')} · ${T('item','№')} ${S.today[cur.id].item}<span class="sp"></span><span class="dot pulse"></span></h3><p class="cname">${cno(cur)} — ${esc(cname(cur))}</p><div class="kv"><span>${T('Stage','Стадия')}</span><b>${esc(L(STG[cur.stage]))}</b><span>${T('Advocates','Адвокаты')}</span><b>${esc(cur.advP)} / ${esc(cur.advR)}</b><span>${T('Pending for','В производстве')}</span><b>${Math.round((d0()-cur.filed)/DAY)} ${T('days','дн.')}</b><span>${T('Last order','Последнее')}</span><b>${cur.orders.length?esc(L(cur.orders[cur.orders.length-1].txt)):'—'}</b></div>
<h3 class="mt">${T('Order','Определение')}</h3><div class="fgrid">${fld('out',['Outcome','Итог'],{opts:[['adj','Adjourn','Отложить'],['notice','Issue notice','Направить уведомление'],['res','Reserve judgment','Отложить решение'],['disp','Dispose — allowed','Рассмотреть — удовлетворить'],['dism','Dispose — dismissed','Рассмотреть — отказать']]})}${fld('ond',['Next date','Следующая дата'],{opts:[5,10,15,20].map(k=>[wd(k),fmtD(wd(k)),fmtD(wd(k))])})}${fld('otx',['Order text (dictation)','Текст (диктовка)'],{type:'area',full:1,val:L(OTX.adj),req:1})}</div>
<div class="row mt" style="gap:8px;flex-wrap:wrap"><button class="btn" id="dict">🎙 ${T('Dictate','Диктовать')}</button><button class="btn pri" id="sign">🔏 ${T('Sign & pronounce','Подписать и огласить')}</button></div>`:`<h3>${T('Pendency by age','Срок нахождения дел')}</h3>${barChart(['< 1 y','1–2 y','2–3 y','> 3 y'].map((x,i)=>({l:T(x,x.replace('y','г')),v:age[i]*12+[22,14,9,5][i],c:i>2?'--red':i>1?'--amber':'--mal'})),{w:420,h:170})}<h3 class="mt">${T('Disposals, last 6 months','Рассмотрено за 6 месяцев')}</h3><div class="lg2"><span><i style="background:var(--mal)"></i>${T('Disposed','Рассмотрено')}</span><span><i style="background:var(--gold)"></i>${T('Instituted','Поступило')}</span></div>${lineChart([{c:'--mal',pts:[31,36,29,40,38,41+(S.jd||0)]},{c:'--gold',pts:[39,35,37,34,40,38],dash:1}],Array.from({length:6},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);return d.toLocaleDateString(loc(),{month:'short'})}),{w:420,h:170})}`}</div></div>`;
const cl=$('#call',el);if(cl)cl.onclick=()=>{const n=l.find(c=>S.today[c.id].st==='wait');S.today[n.id].st='on';lg(n,Date.now(),'Called in Court 1','Вызвано в зале 1');K.save();K.refresh()};
const ps=$('#pass',el);if(ps)ps.onclick=()=>{S.today[cur.id].st='pass';K.save();K.refresh()};
if(cur){const ou=$('#out',el);ou.onchange=()=>{$('#otx',el).value=L(OTX[val('out',el)]);$('#ond',el).disabled=['disp','dism','res'].includes(val('out',el))};
$('#dict',el).onclick=async e=>{const b=e.target;b.disabled=true;b.textContent='🎙 '+T('Listening…','Слушаю…');const txt=L(OTX[val('out',el)]);const ta=$('#otx',el);ta.value='';for(const w of txt.split(' ')){await wait(70);if(!document.body.contains(ta))return;ta.value+=(ta.value?' ':'')+w}b.disabled=false;b.textContent='🎙 '+T('Dictate','Диктовать')};
$('#sign',el).onclick=()=>{if(!validate(['otx'],el))return;const o=val('out',el),tx=val('otx',el),nd=+val('ond',el);const sig=(hash(tx+cur.id)>>>0).toString(16).toUpperCase();cur.orders.push({t:Date.now(),txt:[tx,tx],j:CRT[0].j,sig,final:o==='disp'||o==='dism'});
if(o==='disp'||o==='dism'){cur.status='disp';cur.stage='disp';cur.next=0;S.jd=(S.jd||0)+1;lg(cur,Date.now(),o==='disp'?'Disposed — petition allowed':'Disposed — petition dismissed',o==='disp'?'Рассмотрено — удовлетворено':'Рассмотрено — отказано')}else if(o==='res'){cur.stage='res';cur.next=wd(20);lg(cur,Date.now(),'Arguments heard, judgment reserved','Прения заслушаны, решение отложено')}else{cur.next=nd;if(o==='notice')cur.stage='notice';lg(cur,Date.now(),`Order passed; next date ${fmtD(nd)}`,`Вынесено определение; следующая дата ${fmtD(nd)}`)}
S.today[cur.id].st=o==='adj'?'adj':'heard';K.save();K.refresh();toast(T(`Order signed in ${cno(cur)} — uploaded to case file`,`Определение по ${cno(cur)} подписано и загружено в дело`))}}}};
const OTX={adj:['Adjourned at the joint request of counsel. List on the next date. Interim order to continue.','Отложено по совместной просьбе сторон. Назначить на следующую дату. Промежуточное определение сохраняет силу.'],notice:['Issue notice to the respondents, returnable on the next date. Service through e-mail and speed post is permitted.','Направить уведомление ответчикам к следующей дате. Допускается вручение по э-почте и курьером.'],res:['Arguments heard. Judgment reserved.','Прения заслушаны. Решение отложено.'],disp:['For the reasons recorded, the petition is allowed. The impugned action is set aside. No order as to costs.','По изложенным основаниям петиция удовлетворена. Оспариваемое действие отменено. Без взыскания расходов.'],dism:['No ground for interference is made out. The petition is dismissed. No order as to costs.','Оснований для вмешательства нет. Петиция отклонена. Без взыскания расходов.']};
APP.loginArt=`<svg class="bg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><g style="stroke:var(--gold)" fill="none" stroke-width="2" opacity=".35"><path d="M200 60v170M140 230h120M120 100h160"/><path d="M120 100l-28 60h56zM280 100l-28 60h56z"/><circle cx="200" cy="55" r="8"/></g><g style="fill:var(--text)" opacity=".05">${[0,1,2,3,4,5].map(i=>`<rect x="${40+i*58}" y="250" width="30" height="50"/>`).join('')}</g></svg>`;

APP.slug=ROW.slug;APP.name=APP.name||ROW.name;
APP.facts=Object.assign({tender:ROW.title,yb:ROW.year+' · '+ROW.budget,client:[ROW.client[0]+', '+(APP.country||['Republic of Nordania','Республика Нордания'])[0]+' (fictional)',ROW.client[1]+', '+(APP.country||['Republic of Nordania','Республика Нордания'])[1]+' (вымышл.)'],stack:ROW.stack},APP.facts||{});
K.start(APP);
})();
</script>
