<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareerGate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1306;font-size:16px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.grow{flex:1}
.who{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:13px;display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal),var(--mal2));color:#fff;font-weight:800;font-size:13px;flex:none}
.who small{display:block;color:var(--muted);font-size:11.5px}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.how>div>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold2);flex:none;font-size:13px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f .err{font-size:11.5px;color:var(--red);margin-top:3px;min-height:0}
.input.bad{border-color:var(--red)}
select.input{appearance:auto}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
/* login */
.login{min-height:calc(100vh - 45px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login .hero{padding:48px;background:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--mal) 26%,transparent),transparent 60%),radial-gradient(circle at 80% 90%,color-mix(in srgb,var(--gold) 20%,transparent),transparent 55%),var(--bg2);display:flex;flex-direction:column;justify-content:center;gap:16px;border-right:1px solid var(--line)}
.login .hero h2{font-size:34px;line-height:1.15;margin:0;letter-spacing:-.02em}
.login .hero ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:14px}
.login .hero li{display:flex;gap:10px}.login .hero li b{color:var(--mal3)}
.login .box{display:grid;place-items:center;padding:30px 18px}
.login .card{width:100%;max-width:400px;display:grid;gap:12px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line2);border-radius:14px;padding:12px;cursor:pointer;background:var(--bg2);text-align:left;width:100%}
.opt.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 10%,transparent)}
.opt b{display:block;font-size:14px} .opt span{font-size:12px;color:var(--muted)}
/* jobs */
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.jl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
.job{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--panel);cursor:pointer;transition:.15s}
.job:hover{border-color:var(--line2)} .job.on{border-color:var(--mal);box-shadow:0 0 0 3px color-mix(in srgb,var(--mal) 15%,transparent)}
.job .t{display:flex;gap:8px;align-items:flex-start}
.job .t b{flex:1;font-size:15px;line-height:1.3}
.job .m{font-size:12.5px;color:var(--muted);margin-top:4px}
.job .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.star{background:none;border:0;cursor:pointer;font-size:18px;color:var(--dim);padding:0 2px;line-height:1}
.star.on{color:var(--gold)}
.det{position:sticky;top:60px}
.det h2{margin:0 0 4px;font-size:21px}
.det .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.det .grid div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted)}
.det .grid b{display:block;color:var(--text);font-size:13.5px}
.det h4{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.det ul{margin:0;padding-left:18px;font-size:13.5px}
.empty{padding:30px;text-align:center;color:var(--muted)}
/* wizard */
.steps{display:flex;margin:4px 0 18px}
.step{flex:1;text-align:center;position:relative;font-size:12px;color:var(--muted);min-width:0}
.step:before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--line2)}
.step:first-child:before{display:none}
.step .dot{width:32px;height:32px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line2);position:relative;z-index:1;font-weight:800}
.step.ok .dot{background:var(--mal);border-color:var(--mal);color:#fff}
.step.ok:before,.step.cur:before{background:var(--mal)}
.step.cur .dot{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 18%,transparent)}
.step span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:18px;text-align:center;cursor:pointer;background:var(--bg2);display:block}
.drop:hover{border-color:var(--mal)}
.drop.ok{border-style:solid;border-color:var(--mal);background:color-mix(in srgb,var(--mal) 8%,transparent)}
.exp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--bg2);display:flex;gap:10px;align-items:flex-start}
.exp div{flex:1;min-width:0;font-size:13px} .exp b{display:block;font-size:14px}
.q{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--bg2)}
.q p{margin:0 0 8px;font-weight:600;font-size:14px}
.q.miss{border-color:var(--red)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:8px 4px;cursor:pointer;font-size:11.5px;line-height:1.25;min-height:44px}
.scale button b{display:block;font-size:14px;font-family:var(--mono)}
.scale button.on{background:var(--mal);border-color:var(--mal);color:#fff}
.yn{display:flex;gap:8px}
.yn button{flex:1;border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:10px;cursor:pointer;font-weight:600}
.yn button.on{background:var(--mal);border-color:var(--mal);color:#fff}
.rev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13.5px}
.rev dt{color:var(--muted)} .rev dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.big-score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
/* my apps */
.appc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--bg2)}
.appc .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.appc .top b{flex:1;min-width:160px}
.tl{display:flex;margin-top:12px}
.tl div{flex:1;position:relative;text-align:center;font-size:11px;color:var(--dim);min-width:0}
.tl div:before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line2)}
.tl div:first-child:before{display:none}
.tl i{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 4px;background:var(--panel2);border:2px solid var(--line2);position:relative;z-index:1}
.tl .ok i{background:var(--mal);border-color:var(--mal)} .tl .ok:before,.tl .cur:before{background:var(--mal)}
.tl .cur i{border-color:var(--gold);background:var(--gold)} .tl .ok,.tl .cur{color:var(--text)}
.tl .rej i{background:var(--red);border-color:var(--red)}
.tl span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
/* kanban */
.kb{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:220px;display:flex;flex-direction:column;gap:8px}
.col.over{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 8%,var(--bg2))}
.col h5{margin:0 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
.cd{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:9px 10px;font-size:12.5px;cursor:grab}
.cd.new{border-color:var(--gold)}
.cd b{display:block;font-size:13.5px}
.cd .mv{display:flex;gap:4px;margin-top:8px}
.cd .mv button{flex:1;border:1px solid var(--line2);background:var(--bg2);border-radius:8px;padding:5px 0;cursor:pointer;font-size:13px;min-height:32px}
.cd .mv button:hover{border-color:var(--mal)}
.sc{font-family:var(--mono);font-weight:700;border-radius:6px;padding:1px 6px;font-size:11.5px}
.kbtools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.kbtools .input{width:auto;min-width:220px;max-width:100%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2500;display:grid;place-items:center;padding:16px}
.modal .card{width:100%;max-width:520px;max-height:86vh;overflow:auto}
.note{font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.intro{grid-template-columns:minmax(0,1fr)}.filters{grid-template-columns:1fr 1fr}.filters .q0{grid-column:1/-1}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
  .jl{grid-template-columns:minmax(0,1fr)}
  .det{position:static}
  .login{grid-template-columns:minmax(0,1fr)}
  .login .hero{padding:28px 18px;border-right:0;border-bottom:1px solid var(--line)}
  .login .hero h2{font-size:24px}
}
@media (max-width:560px){.how,.fgrid{grid-template-columns:1fr}.kpi .v{font-size:20px}.kpis{gap:10px}.step span{font-size:10px}.tl span{font-size:9px}.det .grid{grid-template-columns:1fr 1fr}.scale{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.scale button{font-size:0;padding:6px 2px}.scale button b{font-size:15px}.kbtools .input{min-width:0;width:100%}}
</style>
</head>
<body data-demo-en="CareerGate — government jobs & hiring platform" data-demo-ru="CareerGate — платформа вакансий и найма госслужбы">
<div id="loginScr"></div>
<div class="app" id="app" style="display:none">
  <aside class="side" id="side">
    <div class="brand"><b>⌂</b><div>CareerGate<small data-en="Office of Personnel · Valdoria" data-ru="Управление кадров · Вальдория"></small></div></div>
    <div class="sec" data-en="Job seeker" data-ru="Соискатель"></div>
    <div id="navS"></div>
    <div class="sec" data-en="Hiring manager" data-ru="Менеджер по найму"></div>
    <div id="navH"></div>
    <div class="grow"></div>
    <div class="who" id="who"></div>
    <div class="row" style="margin-top:8px">
      <button class="btn sm" id="logout" style="flex:1;justify-content:center" data-en="Sign out" data-ru="Выйти"></button>
      <button class="btn sm" id="reset" style="flex:1;justify-content:center" data-en="Reset demo" data-ru="Сбросить демо"></button>
    </div>
  </aside>
  <main>
    <div class="head">
      <button class="btn sm menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <div class="sp"></div>
      <span class="pill" id="hdrPill"></span>
    </div>
    <div class="intro">
      <div class="card"><h3><span data-en="How to try it" data-ru="Как попробовать"></span></h3>
        <div class="how">
          <div><b>1</b><span data-en="Search <b>Jobs</b> with filters, star favourites and press <b>Apply</b> on a vacancy." data-ru="Найдите вакансию в <b>Вакансиях</b> через фильтры, отметьте избранное и нажмите <b>Откликнуться</b>."></span></div>
          <div><b>2</b><span data-en="Attach a resume, answer the <b>assessment questionnaire</b>, get your category rating and submit." data-ru="Приложите резюме, ответьте на <b>оценочную анкету</b>, получите категорию и отправьте."></span></div>
          <div><b>3</b><span data-en="As hiring manager move candidates on the <b>Pipeline</b> board and watch <b>Time-to-hire</b> update." data-ru="Как менеджер двигайте кандидатов на доске <b>Воронки</b> и смотрите, как меняется <b>Срок найма</b>."></span></div>
        </div></div>
      <div class="card"><dl class="facts">
        <dt data-en="Tender" data-ru="Тендер"></dt><dd data-en="Government jobs & hiring platform" data-ru="Платформа вакансий и найма госслужбы"></dd>
        <dt data-en="Year · budget" data-ru="Год · бюджет"></dt><dd>2025 · $95M</dd>
        <dt data-en="Client" data-ru="Заказчик"></dt><dd data-en="Office of Personnel Management, Republic of Valdoria (fictional)" data-ru="Управление кадров, Республика Вальдория (вымышл.)"></dd>
        <dt data-en="Stack" data-ru="Стек"></dt><dd>Search · assessments · ATS</dd>
      </dl></div>
    </div>
    <section class="view" id="v-search"></section>
    <section class="view" id="v-apply"></section>
    <section class="view" id="v-mine"></section>
    <section class="view" id="v-pipe"></section>
    <section class="view" id="v-tth"></section>
  </main>
</div>
<div class="toasts" id="toasts"></div>
<div id="modal"></div>
<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru);
const L=o=>o?(PT.lang==='ru'?o.ru||o.en:o.en):'';
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='pt_jobs_state';
const loc=()=>PT.lang==='ru'?'ru-RU':'en-GB';
const fmtD=d=>new Date(d).toLocaleDateString(loc(),{day:'numeric',month:'short',year:'numeric'});
const money=n=>'V$ '+Math.round(n).toLocaleString(PT.lang==='ru'?'ru-RU':'en-US');
const store={load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},clear(){try{localStorage.removeItem(KEY)}catch(e){}}};
function toast(m,c){const t=document.createElement('div');t.className='toast '+(c||'');t.innerHTML=m;$('#toasts').append(t);setTimeout(()=>t.remove(),3800)}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const DAY=864e5, NOW=new Date('2026-11-17T10:00:00').getTime();
const iso=t=>new Date(t).toISOString().slice(0,10);

const AG={tre:{en:'Ministry of Finance',ru:'Министерство финансов'},hea:{en:'Ministry of Health',ru:'Министерство здравоохранения'},tra:{en:'Transport Authority',ru:'Транспортное управление'},dig:{en:'Digital Service Agency',ru:'Агентство цифровых услуг'},env:{en:'Environment Protection Agency',ru:'Агентство охраны среды'},jus:{en:'Ministry of Justice',ru:'Министерство юстиции'}};
const LOC={cap:{en:'Valdor (capital)',ru:'Вальдор (столица)'},nor:{en:'Northport',ru:'Нортпорт'},riv:{en:'Riverton',ru:'Ривертон'},rem:{en:'Remote',ru:'Удалённо'}};

function filtered(){
  const f=S.f,q=f.q.trim().toLowerCase();
  let r=JOBS.filter(j=>(!q||(j.t.en+' '+j.t.ru+' '+L(AG[j.ag])+' '+j.id).toLowerCase().includes(q))&&(!f.ag||j.ag===f.ag)&&(!f.lc||j.lc===f.lc)&&(!f.gr||(f.gr==='lo'?j.gr<=9:f.gr==='mid'?j.gr>=10&&j.gr<=12:j.gr>=13))&&(j.smax>=f.sal)&&(!f.rem||j.rem)&&(!f.ft||j.type==='ft')&&(!f.only||S.saved.includes(j.id)));
  r.sort((a,b)=>S.sort==='sal'?b.smax-a.smax:S.sort==='gr'?b.gr-a.gr:a.close.localeCompare(b.close));
  return r;
}

function ring(p){const r=38,c=2*Math.PI*r;return `<svg width="96" height="96" viewBox="0 0 96 96" style="flex:none"><circle cx="48" cy="48" r="${r}" fill="none" stroke="${cssv('--line')}" stroke-width="10"/><circle cx="48" cy="48" r="${r}" fill="none" stroke="${cssv('--gold')}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*Math.min(100,p)/100} ${c}" transform="rotate(-90 48 48)"/><text x="48" y="55" text-anchor="middle" fill="${cssv('--text')}" font-size="22" font-weight="800">${Math.min(100,p)}</text></svg>`}

    <input class="input" id="pQ" placeholder="${T('Filter candidates','Фильтр кандидатов')}" style="min-width:180px;flex:1">
    <span class="pill">${list.length} ${T('active','в работе')}</span><span class="pill bad">${rejN} ${T('rejected','отклонено')}</span></div>
    <p class="muted" style="font-size:12.5px;margin:-4px 0 10px">${T('Drag cards between columns or use ◀ ▶ buttons. Moving to <b>Hired</b> records time-to-hire.','Перетаскивайте карточки или жмите ◀ ▶. Перевод в <b>Принят</b> записывает срок найма.')}</p>
    <div class="kb">${STG.map((s,si)=>{const cs=list.filter(c=>c.stage===s[0]).sort((a,b)=>b.score-a.score);
      return `<div class="col" data-col="${s[0]}"><h5><span>${T(s[1],s[2])}</span><span>${cs.length}</span></h5>${cs.map(c=>{const sc=c.score>=85?'var(--mal)':c.score>=70?'var(--gold)':'var(--amber)';const dd=Math.round((NOW-new Date(c.applied).getTime())/DAY);
        return `<div class="cd ${c.mine?'new':''}" draggable="true" data-c="${c.id}"><div class="row" style="gap:6px"><b style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name)}</b><span class="sc" style="background:color-mix(in srgb,${sc} 20%,transparent);color:${sc}">${c.score}</span></div>
        <div class="muted">${c.id} · ${T(SRC[c.src][0],SRC[c.src][1])}</div><div class="muted">${T(dd+' days in process',dd+' дн. в процессе')}${c.notes.length?' · 💬'+c.notes.length:''}</div>
        <div class="mv"><button data-mv="${c.id}:-1" ${si===0?'disabled':''} aria-label="back">◀</button><button data-open="${c.id}" aria-label="open">⋯</button><button data-mv="${c.id}:1" ${si===STG.length-1?'disabled':''} aria-label="forward">▶</button></div></div>`}).join('')}</div>`}).join('')}</div>`;
  $('#pJob').onchange=e=>{S.hjob=e.target.value;save();rPipe()};
  $('#pQ').oninput=e=>{const q=e.target.value.toLowerCase();$$('.cd').forEach(c=>c.style.display=c.textContent.toLowerCase().includes(q)?'':'none')};
  $$('[data-mv]').forEach(b=>b.onclick=()=>{const[id,d]=b.dataset.mv.split(':');const c=S.pipe.find(x=>x.id===id);const i=STG.findIndex(s=>s[0]===c.stage)+(+d);if(i<0||i>=STG.length)return;moveTo(c,STG[i][0])});
  $$('[data-open]').forEach(b=>b.onclick=()=>openCand(b.dataset.open));
  $$('.cd').forEach(c=>{c.ondragstart=e=>{dragId=c.dataset.c;try{e.dataTransfer.setData('text/plain',dragId)}catch(x){}}});
  $$('.col').forEach(col=>{col.ondragover=e=>{e.preventDefault();col.classList.add('over')};col.ondragleave=()=>col.classList.remove('over');
    col.ondrop=e=>{e.preventDefault();col.classList.remove('over');const c=S.pipe.find(x=>x.id===dragId);if(c&&c.stage!==col.dataset.col)moveTo(c,col.dataset.col)}});
}
function moveTo(c,st){
  c.stage=st;c.moved=iso(NOW);
  if(st==='hired'){const days=Math.max(14,Math.round((NOW-new Date(c.applied).getTime())/DAY)+38);S.hires.push({m:11,days,stg:[5,7,10,days-36,8].map(x=>+(+x).toFixed(1)),name:c.name});toast(T(esc(c.name)+' hired · '+days+' days to hire',esc(c.name)+' принят · '+days+' дн. до найма'),'gold')}
  else toast(esc(c.name)+' → '+T(...STG.find(s=>s[0]===st).slice(1)));
  save();rPipe();nav();
}
function openCand(id){
  const c=S.pipe.find(x=>x.id===id),j=JOBS.find(x=>x.id===c.job);
  $('#modal').innerHTML=`<div class="modal"><div class="card"><h3>${esc(c.name)}<span class="sp"></span><button class="btn sm" id="mx">✕</button></h3>
    <div class="muted" style="font-size:13px">${c.id} · ${L(j.t)}</div>
    <div class="row" style="margin:12px 0"><span class="pill">${T('Score','Балл')} ${c.score}</span><span class="pill ok">${T(catOf(c.score)[0],catOf(c.score)[1])}</span><span class="pill">${T('Applied','Отклик')} ${fmtD(c.applied)}</span><span class="pill">${T(SRC[c.src][0],SRC[c.src][1])}</span></div>
    <div class="f"><label>${T('Stage','Этап')}</label><select class="input" id="mSt">${STG.map(s=>`<option value="${s[0]}" ${c.stage===s[0]?'selected':''}>${T(s[1],s[2])}</option>`).join('')}</select></div>
    <h3 style="margin-top:14px">${T('Interview notes','Заметки')}</h3><div id="mNotes">${c.notes.map(n=>`<div class="note"><span class="muted mono">${n.d}</span> ${esc(n.t)}</div>`).join('')||`<div class="muted" style="font-size:12.5px">${T('No notes yet','Заметок нет')}</div>`}</div>
    <div class="row" style="margin-top:8px"><input class="input" id="mN" style="flex:1;min-width:0" placeholder="${T('Add a note…','Добавить заметку…')}"><button class="btn sm" id="mNA">${T('Add','Добавить')}</button></div>
    <div class="row" style="margin-top:16px;justify-content:space-between"><button class="btn sm danger" id="mRej">${T('Reject candidate','Отклонить')}</button><button class="btn sm pri" id="mSave">${T('Save','Сохранить')}</button></div></div></div>`;
  const close=()=>$('#modal').innerHTML='';
  $('#mx').onclick=close;$('.modal').onclick=e=>{if(e.target.classList.contains('modal'))close()};
  $('#mNA').onclick=()=>{const t=$('#mN').value.trim();if(!t)return;c.notes.push({d:new Date().toLocaleDateString(loc(),{day:'numeric',month:'short'}),t});save();openCand(id)};
  $('#mRej').onclick=()=>{c.rej=true;save();close();rPipe();nav();toast(esc(c.name)+' — '+T('rejected, applicant notified','отклонён, кандидат уведомлён'),'bad')};
  $('#mSave').onclick=()=>{const st=$('#mSt').value;close();if(st!==c.stage)moveTo(c,st);else{save();rPipe()}};
}

/* ---------- TIME TO HIRE ---------- */
function months(){const out=[];for(let m=0;m<12;m++){const d=new Date(2025,11+m,1);out.push(d.toLocaleDateString(loc(),{month:'short'}))}return out}
function rTth(){
  const el=$('#v-tth'),H=S.hires;
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  const byM=[...Array(12)].map((_,m)=>avg(H.filter(h=>h.m===m).map(h=>h.days)));
  const last=H.filter(h=>h.m===11),prev=H.filter(h=>h.m===10);
  const act=S.pipe.filter(c=>!c.rej);
  const offers=S.pipe.filter(c=>c.stage==='offer'||c.stage==='hired').length,hired=S.pipe.filter(c=>c.stage==='hired').length;
  const stg=[0,1,2,3,4].map(i=>avg(H.map(h=>h.stg[i])));
  el.innerHTML=`<div class="kpis">
    <div class="card kpi"><div class="l">${T('Avg time-to-hire (Nov)','Средний срок найма (нояб.)')}</div><div class="v">${Math.round(avg(last.map(h=>h.days)))} ${T('d','дн.')}</div><div class="d ok-t" style="color:var(--mal3)">▼ ${Math.round(avg(prev.map(h=>h.days))-avg(last.map(h=>h.days)))} ${T('vs Oct','к окт.')} · ${T('target 80','цель 80')}</div></div>
    <div class="card kpi"><div class="l">${T('Hires, 12 months','Наймов за 12 мес.')}</div><div class="v">${H.length}</div><div class="d">${last.length} ${T('this month','в этом месяце')}</div></div>
    <div class="card kpi"><div class="l">${T('Active candidates','Кандидатов в работе')}</div><div class="v">${act.filter(c=>c.stage!=='hired').length}</div><div class="d">${S.pipe.filter(c=>c.stage==='applied'&&!c.rej).length} ${T('awaiting screening','ждут отбора')}</div></div>
    <div class="card kpi"><div class="l">${T('Offer acceptance','Принятие офферов')}</div><div class="v">${Math.round((H.length+hired)/(H.length+offers+4)*100)}%</div><div class="d">${T('12-month','за 12 мес.')}</div></div></div>
  <div class="grid2"><div class="card chart"><h3>${T('Time-to-hire trend, days','Динамика срока найма, дни')}<span class="sp"></span><span class="legend"><span><i style="background:var(--mal)"></i>${T('Average','Среднее')}</span><span><i style="background:var(--gold)"></i>${T('Target 80','Цель 80')}</span></span></h3>${lineChart(byM)}</div>
  <div class="card chart"><h3>${T('Days per stage','Дней на этапе')}</h3>${stageBars(stg)}</div></div>
  <div class="grid2" style="margin-top:14px"><div class="card chart"><h3>${T('Pipeline funnel','Воронка кандидатов')}</h3>${funnel()}</div>
  <div class="card"><h3>${T('Recent hires','Последние наймы')}</h3><div class="tw"><table><thead><tr><th>${T('Month','Месяц')}</th><th>${T('Candidate','Кандидат')}</th><th>${T('Days','Дней')}</th><th>SLA</th></tr></thead><tbody>${H.slice(-8).reverse().map(h=>`<tr><td>${months()[h.m]}</td><td>${esc(h.name||T('Anonymised','Обезличено'))}</td><td class="mono">${h.days}</td><td><span class="pill ${h.days<=80?'ok':'warn'}">${h.days<=80?T('Met','В срок'):T('Over','Сверх')}</span></td></tr>`).join('')}</tbody></table></div></div></div>`;
}
function lineChart(v){
  const W=560,Hh=220,p={l:34,r:10,t:12,b:26},mx=110,mn=50;const ms=months();
  const x=i=>p.l+i*(W-p.l-p.r)/11,y=d=>p.t+(mx-d)/(mx-mn)*(Hh-p.t-p.b);
  const pts=v.map((d,i)=>d?[x(i),y(d)]:null).filter(Boolean);
  const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join('');
  const area=line+`L${pts[pts.length-1][0]},${Hh-p.b}L${pts[0][0]},${Hh-p.b}Z`;
  return `<svg viewBox="0 0 ${W} ${Hh}"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${cssv('--mal')}" stop-opacity=".35"/><stop offset="1" stop-color="${cssv('--mal')}" stop-opacity="0"/></linearGradient></defs>
  ${[60,80,100].map(g=>`<line x1="${p.l}" x2="${W-p.r}" y1="${y(g)}" y2="${y(g)}" stroke="${cssv('--line')}"/><text x="${p.l-6}" y="${y(g)+4}" text-anchor="end" font-size="11" fill="${cssv('--dim')}">${g}</text>`).join('')}
  <line x1="${p.l}" x2="${W-p.r}" y1="${y(80)}" y2="${y(80)}" stroke="${cssv('--gold')}" stroke-dasharray="5 4" stroke-width="1.5"/>
  <path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="${cssv('--mal')}" stroke-width="2.5"/>
  ${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="${cssv('--panel')}" stroke="${cssv('--mal')}" stroke-width="2"><title>${Math.round(v[i])}</title></circle>`).join('')}
  ${ms.map((m,i)=>i%2===0||i===11?`<text x="${x(i)}" y="${Hh-8}" text-anchor="middle" font-size="11" fill="${cssv('--dim')}">${m}</text>`:'').join('')}
  <text x="${pts[pts.length-1][0]-4}" y="${pts[pts.length-1][1]-10}" text-anchor="end" font-size="12" font-weight="700" fill="${cssv('--text')}">${Math.round(v[11])}</text></svg>`;
}
function stageBars(st){
  const lab=[['Screening','Отбор'],['Assessment','Оценка'],['Interview','Интервью'],['Selection & checks','Решение и проверки'],['Offer to start','Оффер – выход']];
  const mx=Math.max(...st),W=380,rh=34;
  return `<svg viewBox="0 0 ${W} ${lab.length*rh+6}">${lab.map((l,i)=>{const w=(W-150)*st[i]/mx;const c=st[i]===mx?cssv('--amber'):cssv('--mal');
    return `<text x="0" y="${i*rh+21}" font-size="12" fill="${cssv('--muted')}">${T(l[0],l[1])}</text><rect x="120" y="${i*rh+8}" width="${w}" height="18" rx="5" fill="${c}"/><text x="${124+w}" y="${i*rh+21}" font-size="12" font-weight="700" fill="${cssv('--text')}">${st[i].toFixed(1)}</text>`}).join('')}</svg>
    <p class="muted" style="font-size:12px;margin:6px 0 0">${T('Bottleneck: selection & background checks.','Узкое место: решение и проверки.')}</p>`;
}
function funnel(){
  const all=S.pipe.length;const counts=STG.map((s,i)=>S.pipe.filter(c=>STG.findIndex(x=>x[0]===c.stage)>=i).length);
  const W=480,rh=32;
  return `<svg viewBox="0 0 ${W} ${STG.length*rh+4}">${STG.map((s,i)=>{const w=Math.max(28,(W-170)*counts[i]/all);const x0=110+((W-170)-w)/2;
    return `<text x="0" y="${i*rh+20}" font-size="12" fill="${cssv('--muted')}">${T(s[1],s[2])}</text><rect x="${x0}" y="${i*rh+4}" width="${w}" height="24" rx="6" fill="${cssv('--mal')}" opacity="${1-i*.12}"/><text x="${W-4}" y="${i*rh+20}" text-anchor="end" font-size="12" font-weight="700" fill="${cssv('--text')}">${counts[i]} · ${Math.round(counts[i]/all*100)}%</text>`}).join('')}</svg>`;
}

$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#reset').onclick=()=>{store.clear();const u=S.user,r=S.role;S=seed();S.user=u;S.role=r;S.view=r==='hm'?'pipe':'search';save();render();toast(T('Demo reset','Демо сброшено'))};
$('#logout').onclick=()=>{S.user=null;save();lrole=S.role;render();toast(T('Signed out','Вы вышли'))};
PT.onLang(()=>render());
render();
})();
</script>
