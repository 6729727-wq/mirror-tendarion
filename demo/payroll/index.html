const un=e.union?25:0;return{base:e.base,hous,tr,ov,ot:ot==null?e.ot:ot,gross,pen,hl,tax,un,ded:pen+hl+tax+un,net:gross-pen-hl-tax-un}}

function barsSvg(labels,series,cols,fmt,H){
H=H||210;const W=640,p={l:54,r:8,t:12,b:26};const max=Math.max(1,...series.flat())*1.12;const n=labels.length,gw=(W-p.l-p.r)/n,bw=Math.min(22,(gw-8)/series.length);
let g='';for(let i=0;i<=4;i++){const y=p.t+(H-p.t-p.b)*i/4;g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="${cssv('--line')}"/><text x="${p.l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="${cssv('--dim')}">${fmt(max*(1-i/4))}</text>`}
labels.forEach((l,i)=>{const x0=p.l+gw*i+(gw-bw*series.length)/2;series.forEach((s,k)=>{const h=(H-p.t-p.b)*s[i]/max;g+=`<rect x="${x0+k*bw}" y="${H-p.b-h}" width="${bw-3}" height="${h}" rx="3" fill="${cssv(cols[k])}"><title>${l}: ${fmt(s[i])}</title></rect>`});g+=`<text x="${p.l+gw*i+gw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="${cssv('--muted')}">${l}</text>`});
return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function lineSvg(labels,vals,col){
const W=640,H=210,p={l:44,r:12,t:14,b:26};const mn=Math.min(...vals)*.97,mx=Math.max(...vals)*1.02;const x=i=>p.l+(W-p.l-p.r)*i/(vals.length-1||1),y=v=>p.t+(H-p.t-p.b)*(1-(v-mn)/((mx-mn)||1));
let g='';for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3;g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="${cssv('--line')}"/><text x="${p.l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="${cssv('--dim')}">${Math.round(v)}</text>`}
const pts=vals.map((v,i)=>x(i)+','+y(v)).join(' ');const c=cssv(col);
g+=`<polygon points="${p.l},${H-p.b} ${pts} ${x(vals.length-1)},${H-p.b}" fill="${c}" opacity=".13"/><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/>`;

}

function cal(y,m,mark){const f=new Date(y,m,1),off=(f.getDay()+6)%7,n=new Date(y,m+1,0).getDate(),today=iso(new Date());let h='';
const wk=RU()?['Пн','Вт','Ср','Чт','Пт','Сб','Вс']:['Mo','Tu','We','Th','Fr','Sa','Su'];h+=wk.map(w=>`<div class="wh">${w}</div>`).join('');
for(let i=0;i<off;i++)h+='<div class="x"></div>';
for(let d=1;d<=n;d++){const k=iso(new Date(y,m,d)),dw=new Date(y,m,d).getDay(),mk=mark(k);h+=`<div class="${dw%6?'':'we'} ${HOL[k]?'hol':''} ${mk||''} ${k===today?'td':''}" title="${HOL[k]?esc(T(HOL[k][0],HOL[k][1])):''}">${d}</div>`}
return `<div><div class="calT">${new Date(y,m,1).toLocaleDateString(RU()?'ru-RU':'en-GB',{month:'long',year:'numeric'})}</div><div class="cal">${h}</div></div>`}
function lvMark(emp){return k=>{const l=S.leaves.find(l=>(!emp||l.emp===emp)&&l.st!=='rej'&&k>=l.from&&k<=l.to);return l?(l.st==='appr'?'lv':'pdg'):''}}

<tr><td></td><td><b>${T('Total','Итого')}</b></td><td></td><td class="num mono"><b>${money(tot.g)}</b></td><td class="num mono"><b>${money(tot.t)}</b></td><td class="num mono"><b>${money(tot.p)}</b></td><td class="num mono"><b>${money(tot.n)}</b></td></tr></tbody></table></div>`}
const last=S.runs.slice(-6);
el.innerHTML=`<div class="card" style="margin-bottom:12px"><div class="steps">${RSTEPS.map((s,i)=>`<button class="step ${i<r.st?'ok':i===r.st?'cur':''}" data-st="${i}"><div class="dot">${i<r.st?'✓':i+1}</div><span>${T(s[0],s[1])}</span></button>`).join('')}</div></div>
<div class="card">${body}</div>
<div class="grid2" style="margin-top:12px"><div class="card"><h3>${T('Payroll cost, last 6 runs','Фонд оплаты, 6 последних ведомостей')}</h3><div class="chart">${barsSvg(last.map(x=>mName(x.per,1)),[last.map(x=>x.gross),last.map(x=>x.net)],['--mal','--gold'],km)}</div>${legend([[T('Gross','Начислено'),'--mal'],[T('Net','На руки'),'--gold']])}</div>
<div class="card"><h3>${T('Run history','История ведомостей')}</h3><div class="tw"><table class="t sm"><thead><tr><th>${T('Period','Период')}</th><th>${T('Reference','Номер')}</th><th class="num">${T('Staff','Штат')}</th><th class="num">${T('Gross','Начислено')}</th></tr></thead><tbody>${S.runs.slice(-6).reverse().map(x=>`<tr><td>${mName(x.per)}</td><td class="mono">${x.ref}</td><td class="num">${x.hc}</td><td class="num mono">${km(x.gross)}</td></tr>`).join('')}</tbody></table></div>
<div class="log" style="margin-top:10px">${S.log.slice(0,4).map(l=>`<div><span class="tm">${new Date(l.t).toLocaleString(RU()?'ru-RU':'en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span><span>${esc(T(l.en,l.ru))}</span></div>`).join('')}</div></div></div>`;
$$('[data-st]',el).forEach(b=>b.onclick=()=>{const i=+b.dataset.st;if(i<r.st&&r.st<5&&i>=1){r.st=Math.min(i,2);save();rRun()}else if(i>r.st)toast(T('Finish the current step first','Сначала завершите текущий шаг'),'bad')});
const on=(id,f)=>{const x=$('#'+id);if(x)x.onclick=f};
on('rImp',()=>{const b=$('#rImp');b.disabled=true;let k=0;const iv=setInterval(()=>{k+=20;const bar=$('#impBar');if(bar)bar.style.width=k+'%';if(k>=100){clearInterval(iv);r.st=1;logA('Nov inputs imported: 5 exceptions found','Данные за ноябрь импортированы: 5 замечаний');save();toast(T('Imported 137 records · 5 exceptions','Импортировано 137 записей · 5 замечаний'),'gold');if(S.view==='run')rRun()}},90)});
$$('[data-fx]',el).forEach(b=>b.onclick=()=>{const k=b.dataset.fx,a=b.dataset.a,i=r.iss.find(x=>x.id===k);
if(k==='bank'){const v=($('#ibIn').value||'').replace(/\s/g,'');if(!/^\d{10,}$/.test(v)){toast(T('Enter 10+ digits','Введите от 10 цифр'),'bad');return}r.fix.bank={en:'Account ****'+v.slice(-4)+' saved, pending pre-note',ru:'Счёт ****'+v.slice(-4)+' сохранён'};EMP(i.emp).bank='****'+v.slice(-4)}
if(k==='term'){if(a==='ex'){r.ex.push(i.emp);r.fix.term={en:'Excluded from this run',ru:'Исключён из ведомости'}}else r.fix.term={en:'Final settlement: pay + unused leave',ru:'Окончательный расчёт: зарплата + компенсация отпуска'}}
if(k==='tax'){r.flat.push(i.emp);r.fix.tax={en:'Emergency code (25% flat) until revenue update',ru:'Временный код (25%) до ответа налоговой'}}
if(k==='var'){r.cap=a==='cap';r.fix['var']=a==='cap'?{en:'Overtime capped at 40 h',ru:'Сверхурочные ограничены 40 ч'}:{en:'Overtime confirmed by manager',ru:'Сверхурочные подтверждены'}}
if(k==='dup'){if(a==='hold')r.hold.push(i.emp);r.fix.dup=a==='hold'?{en:'Payment held for verification',ru:'Платёж задержан до проверки'}:{en:'Shared joint account verified',ru:'Совместный счёт подтверждён'}}
logA('Exception '+k+' resolved ('+i.emp+')','Замечание '+k+' устранено ('+i.emp+')');save();rRun()});
on('rCalc',()=>{r.st=2;logA('Nov payroll calculated','Ноябрьская зарплата рассчитана');save();toast(T('Calculated '+runCalc().length+' payslips','Рассчитано листов: '+runCalc().length),'gold');rRun()});
const rq=$('#rQ');if(rq)rq.oninput=()=>{r.q=rq.value;save();const pos=rq.selectionStart;rRun();const n=$('#rQ');n.focus();n.setSelectionRange(pos,pos)};
on('rSend',()=>{r.st=3;logA('Nov payroll sent for approval','Ведомость за ноябрь отправлена на утверждение');save();rRun()});
on('rBack',()=>{r.st=1;save();rRun()});
on('rAppr',()=>{const b=$('#rAppr');b.disabled=true;b.textContent=T('Waiting for R. Adeyemi…','Ждём Р. Адейеми…');setTimeout(()=>{r.st=4;r.apAt=new Date().toLocaleString(RU()?'ru-RU':'en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});logA('Nov payroll approved by R. Adeyemi','Ведомость утверждена Р. Адейеми');save();toast(T('Approved by Director of Finance','Утверждено директором по финансам'),'gold');if(S.view==='run')rRun()},900)});
const file=()=>{const rows=runCalc().filter(x=>!x.hold);const csv='EndToEndId,Name,Account,Amount,Currency\n'+rows.map(x=>[x.e.id+'-2611',x.e.n,x.e.bank,x.p.net.toFixed(2),'USD'].join(',')).join('\n');
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='civilpay-bank-2026-11.csv';document.body.append(a);a.click();a.remove();toast(T('Bank file downloaded','Файл скачан'))};
on('rFile',file);
on('rPost',()=>{const rows=runCalc(),g=rows.reduce((a,x)=>a+x.p.gross,0)*prev.hc/rows.length;r.st=5;r.ref='PAY-202611-'+(4100+11*37);S.runs.push({per:'2026-11',hc:DEPTS.reduce((a,d)=>a+d[4],0),gross:g,net:g*.742,ref:r.ref,st:'posted'});S.slipSel='2026-11';
logA('Nov payroll posted '+r.ref+'; payslips published','Ноябрьская ведомость проведена '+r.ref+'; листы выпущены');save();toast(T('Posted to bank · ','Проведено в банк · ')+r.ref,'gold');render()});
on('rSee',()=>{S.role='emp';S.view='slip';S.slipSel='2026-11';save();render();toast(T('Signed in as Leila Haddad','Вход как Лейла Хаддад'))});
}

/* ---------- ANALYTICS ---------- */
function rAna(){
const el=$('#v-ana'),a=S.ana,ds=a.d?[D(a.d)]:DEPTS,n=a.n,ms=MONTHS.slice(-n);
const series=k=>ms.map((m,i)=>ds.reduce((s,d)=>s+S.hist[d[0]][MONTHS.length-n+i][k],0));
const hc=series('h'),hi=series('hi'),ex=series('ex'),cur=hc[hc.length-1],est=ds.reduce((s,d)=>s+Math.round(d[4]*1.08),0),vac=est-cur,turn=ex.reduce((x,y)=>x+y,0)/(hc.reduce((x,y)=>x+y,0)/hc.length)*100*(12/n);
const grades=[0,0,0,0,0];const r=rng(a.d?a.d.length*11:5);for(let i=0;i<cur;i++){const g=Math.min(4,Math.floor(Math.pow(r(),1.3)*5));grades[g]++}
const cost=S.runs.slice(-1)[0].gross/S.runs.slice(-1)[0].hc;
el.innerHTML=`<div class="card" style="margin-bottom:12px"><div class="row"><div class="f" style="min-width:200px"><label>${T('Department','Подразделение')}</label><select class="input" id="aD"><option value="">${T('Whole commission','Вся комиссия')}</option>${DEPTS.map(d=>`<option value="${d[0]}" ${a.d===d[0]?'selected':''}>${T(d[1],d[2])}</option>`).join('')}</select></div><span class="sp"></span><div class="chips">${[6,12].map(k=>`<button class="chip ${n===k?'on':''}" data-n="${k}">${k} ${T('months','мес.')}</button>`).join('')}</div><button class="btn sm" id="aCsv">⤓ CSV</button></div></div>
${kpis([[T('Headcount','Численность'),cur,'',(cur-hc[0]>=0?'+':'')+(cur-hc[0])+' '+T('in period','за период')],[T('Vacancies','Вакансии'),vac,vac>10?'warn-t':'',T('establishment ','штат ')+est],[T('Turnover (annualised)','Текучесть (год)'),turn.toFixed(1)+'%',turn>12?'bad-t':''],[T('Avg. monthly cost / FTE','Ср. затраты на ставку'),usd(cost)]])}
<div class="grid2"><div class="card"><h3>${T('Headcount trend','Динамика численности')}</h3><div class="chart">${lineSvg(ms.map(m=>mName(m,1)),hc,a.d?D(a.d)[3]:'--mal')}</div></div>
<div class="card"><h3>${T('Hires vs exits','Приём и увольнения')}</h3><div class="chart">${barsSvg(ms.map(m=>mName(m,1)),[hi,ex],['--mal','--red'],v=>Math.round(v))}</div>${legend([[T('Hires','Принято'),'--mal'],[T('Exits','Уволено'),'--red']])}</div></div>
<div class="grid2" style="margin-top:12px"><div class="card"><h3>${T('By department','По подразделениям')}</h3><div class="hb">${DEPTS.map(d=>`<button data-dd="${d[0]}" class="${a.d===d[0]?'on':''}"><span>${T(d[1],d[2])}</span><i><b style="width:${d[4]/171*100}%;background:var(${d[3]})"></b></i><em>${d[4]}</em></button>`).join('')}</div></div>
<div class="card"><h3>${T('Grade distribution','Распределение по грейдам')}</h3><div class="chart">${barsSvg(['G3–4','G5–6','G7–8','G9–10','G11+'],[grades],['--blue'],v=>Math.round(v),190)}</div><div class="muted" style="font-size:12.5px">${T('Median grade G6 · 41% women in G9+ (target 50%)','Медианный грейд G6 · 41% женщин в G9+ (цель 50%)')}</div></div></div>`;
$('#aD').onchange=e=>{a.d=e.target.value;save();rAna()};
$$('[data-n]',el).forEach(b=>b.onclick=()=>{a.n=+b.dataset.n;save();rAna()});
$$('[data-dd]',el).forEach(b=>b.onclick=()=>{a.d=a.d===b.dataset.dd?'':b.dataset.dd;save();rAna()});
$('#aCsv').onclick=()=>{const csv='Month,Headcount,Hires,Exits\n'+ms.map((m,i)=>[m,hc[i],hi[i],ex[i]].join(',')).join('\n');const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));l.download='headcount-'+(a.d||'all')+'.csv';document.body.append(l);l.click();l.remove();toast(T('Exported','Выгружено'))};
}

/* ---------- ORG CHART ---------- */
function rOrg(){
const el=$('#v-org'),o=S.org,sel=D(o.sel)||DEPTS[0],W=980,cw=128,gap=(W-DEPTS.length*cw)/(DEPTS.length+1),tot=DEPTS.reduce((a,d)=>a+d[4],0);
const qq=o.q.trim().toLowerCase(),hits=qq.length>1?S.E.filter(e=>(e.n+' '+e.id).toLowerCase().includes(qq)).slice(0,6):[];
const hitD=hits.map(e=>e.d);
const tx=(x,y,s,sz,w,c,an)=>`<text x="${x}" y="${y}" text-anchor="${an||'middle'}" font-size="${sz}" font-weight="${w||400}" fill="${cssv(c||'--text')}">${esc(s)}</text>`;
let g=`<rect x="${W/2-120}" y="10" width="240" height="58" rx="12" fill="${cssv('--panel2')}" stroke="${cssv('--gold')}" stroke-width="1.5"/>${tx(W/2,34,T('Civil Service Commission','Комиссия по госслужбе'),13,700)}${tx(W/2,54,tot+T(' staff · 7 directorates',' сотр. · 7 дирекций'),11,400,'--muted')}`;
g+=`<line x1="${W/2}" y1="68" x2="${W/2}" y2="92" stroke="${cssv('--line2')}"/><line x1="${gap+cw/2}" y1="92" x2="${W-gap-cw/2}" y2="92" stroke="${cssv('--line2')}"/>`;
DEPTS.forEach((d,i)=>{const x=gap+i*(cw+gap),on=d===sel,hl=hitD.includes(d[0]);const nm=T(d[1],d[2]);const words=nm.split(' ');let l1='',l2='';words.forEach(w=>{if((l1+' '+w).trim().length<=17&&!l2)l1=(l1+' '+w).trim();else l2=(l2+' '+w).trim()});
g+=`<line x1="${x+cw/2}" y1="92" x2="${x+cw/2}" y2="108" stroke="${cssv('--line2')}"/><g class="on" data-od="${d[0]}" style="cursor:pointer"><rect x="${x}" y="108" width="${cw}" height="78" rx="11" fill="${cssv(on?'--panel':'--panel2')}" stroke="${cssv(hl?'--gold':on?d[3]:'--line')}" stroke-width="${on||hl?2.5:1}"/><rect x="${x}" y="108" width="${cw}" height="5" rx="2" fill="${cssv(d[3])}"/>${tx(x+cw/2,132,l1,11.5,700)}${tx(x+cw/2,147,l2.length>18?l2.slice(0,17)+'…':l2,11.5,700)}${tx(x+cw/2,166,d[4]+T(' staff',' сотр.'),11,600,d[3])}${tx(x+cw/2,180,T(d[5],d[6]).replace(/^(Dir\.|Дир\.|Commissioner|Комиссар) /,''),10,400,'--muted')}</g>`});
const i=DEPTS.indexOf(sel),px=gap+i*(cw+gap)+cw/2,us=sel[7],uw=150,ug=16,uw0=us.length*uw+(us.length-1)*ug;let ux=Math.max(10,Math.min(W-10-uw0,px-uw0/2));
g+=`<line x1="${px}" y1="186" x2="${px}" y2="206" stroke="${cssv(sel[3])}"/><line x1="${ux+uw/2}" y1="206" x2="${ux+uw0-uw/2}" y2="206" stroke="${cssv(sel[3])}"/>`;
us.forEach((u,k)=>{const x=ux+k*(uw+ug);g+=`<line x1="${x+uw/2}" y1="206" x2="${x+uw/2}" y2="218" stroke="${cssv(sel[3])}"/><rect x="${x}" y="218" width="${uw}" height="50" rx="10" fill="${cssv('--panel2')}" stroke="${cssv(sel[3])}"/>${tx(x+uw/2,240,T(u[0],u[1]),11.5,600)}${tx(x+uw/2,257,u[2]+T(' staff',' сотр.'),10.5,400,'--muted')}`});
const staff=S.E.filter(e=>e.d===sel[0]).sort((a,b)=>b.g-a.g);
el.innerHTML=`<div class="card" style="margin-bottom:12px"><div class="row"><div class="f" style="flex:1;min-width:200px"><label>${T('Find a person','Найти сотрудника')}</label><input class="input" id="oQ" value="${esc(o.q)}" placeholder="${T('Name or employee ID','Имя или табельный номер')}"></div></div>${hits.length?`<div class="chips" style="margin-top:10px">${hits.map(e=>`<button class="chip" data-oh="${e.d}">${esc(e.n)} · ${T(D(e.d)[1],D(e.d)[2])}</button>`).join('')}</div>`:qq.length>1?`<div class="muted" style="margin-top:8px;font-size:13px">${T('No matches','Ничего не найдено')}</div>`:''}</div>
<div class="card"><h3>${T('Structure','Структура')}<span class="sp"></span><span class="muted" style="font-size:12px">${T('Tap a directorate','Нажмите на дирекцию')}</span></h3><div class="tw orgw"><svg viewBox="0 0 ${W} 280" role="img">${g}</svg></div></div>
<div class="split" style="margin-top:12px"><div class="card"><h3>${T(sel[1],sel[2])}</h3><dl class="sum"><dt>${T('Head','Руководитель')}</dt><dd>${T(sel[5],sel[6])}</dd><dt>${T('Staff','Штат')}</dt><dd>${sel[4]}</dd><dt>${T('Units','Отделы')}</dt><dd>${us.map(u=>T(u[0],u[1])).join(', ')}</dd><dt>${T('Monthly payroll','Фонд в месяц')}</dt><dd class="mono">${km(sel[4]*5480)}</dd></dl></div>
<div class="card"><h3>${T('People in payroll group HQ-01','Сотрудники группы HQ-01')} <span class="muted" style="font-size:12px">(${staff.length})</span></h3><div class="tw" style="max-height:260px"><table class="t sm"><tbody>${staff.map(e=>`<tr class="${hits.includes(e)?'hit':''}"><td class="mono">${e.id}</td><td>${esc(e.n)}</td><td>${T(sel[7][e.u%sel[7].length][0],sel[7][e.u%sel[7].length][1])}</td><td class="num">G${e.g}</td></tr>`).join('')||`<tr><td class="muted">—</td></tr>`}</tbody></table></div></div></div>`;
const ow=$('.orgw',el);if(ow&&ow.scrollWidth>ow.clientWidth){const sw=ow.scrollWidth;ow.scrollLeft=Math.max(0,(gap+i*(cw+gap)+cw/2)/W*sw-ow.clientWidth/2)}
$$('[data-od]',el).forEach(n=>n.onclick=()=>{o.sel=n.dataset.od;save();rOrg()});
$$('[data-oh]',el).forEach(b=>b.onclick=()=>{o.sel=b.dataset.oh;save();rOrg()});
const q=$('#oQ');q.oninput=()=>{o.q=q.value;save();const p=q.selectionStart;rOrg();const n=$('#oQ');n.focus();n.setSelectionRange(p,p)};
}

PT.onLang(()=>render());
render();
})();
</script>
