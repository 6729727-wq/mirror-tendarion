<style>
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;font-size:17px;flex:none}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.nav .cnt.r{background:var(--red);color:#fff}
.grow{flex:1}
.who{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:12.5px}
.who b{display:block;font-size:13.5px}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.how>div>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold2);flex:none;font-size:13px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f{margin-bottom:10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fgrid .full{grid-column:1/-1}
.err{color:var(--red);font-size:12px;min-height:16px}
.input.bad{border-color:var(--red)}
.ok-t{color:var(--mal3)} .bad-t{color:var(--red)} .warn-t{color:var(--amber)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal;min-width:200px}
tr:last-child td{border-bottom:none}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.loginw{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:24px 16px;background:radial-gradient(ellipse at 20% 0%,color-mix(in srgb,var(--mal) 16%,transparent),transparent 60%),radial-gradient(ellipse at 100% 100%,color-mix(in srgb,var(--gold) 10%,transparent),transparent 55%)}
.loginc{width:100%;max-width:430px;padding:26px;box-shadow:var(--shadow)}
.loginc h2{margin:6px 0 4px;font-size:21px}
.demo{font-size:12px;border:1px dashed var(--line2);border-radius:10px;padding:8px 10px;margin:12px 0;color:var(--muted)}
/* catalogue */
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.prod{display:flex;flex-direction:column;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px}

.prod .gt{font-family:var(--mono);font-size:11px;color:var(--dim)}
.prod .pr{font-weight:800;font-size:16px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.qty button{border:0;background:var(--panel2);width:32px;height:32px;cursor:pointer;font-weight:800}
.qty input{width:52px;border:0;background:transparent;text-align:center;height:32px;outline:none}
.bline{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.bline span{flex:1;min-width:0}
.sticky{position:sticky;top:60px}
.steps{display:flex;margin:8px 0 4px}
.steps div{flex:1;position:relative;text-align:center;font-size:11px;color:var(--dim);min-width:0}
.steps div:before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line2)}
.steps div:first-child:before{display:none}
.steps i{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 4px;background:var(--panel2);border:2px solid var(--line2);position:relative;z-index:1}
.steps .ok i{background:var(--mal);border-color:var(--mal)} .steps .ok:before,.steps .cur:before{background:var(--mal)}
.steps .cur i{border-color:var(--gold);background:var(--gold)} .steps .ok,.steps .cur{color:var(--text)}
.steps span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.dl{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--bg2);cursor:pointer}
.dl.on{border-color:var(--mal)}
.dl .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dl .top b{flex:1;min-width:140px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mal2),var(--mal3))}
.sup{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sc{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
.sc.on{border-color:var(--mal);box-shadow:0 0 0 3px color-mix(in srgb,var(--mal) 15%,transparent)}
.grade{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.met{display:grid;grid-template-columns:90px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12px;margin-top:6px}
.iss{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.iss span{flex:1;min-width:0}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.intro{grid-template-columns:minmax(0,1fr)}.sticky{position:static}}
@media (max-width:860px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
 .side.open{transform:none}
 .menu-btn{display:inline-flex}
 main{padding:14px 14px 50px}
 .head h1{font-size:20px}
}
@media (max-width:560px){.how{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}.kpi .v{font-size:20px}.kpis{gap:10px}.cat{grid-template-columns:1fr}.steps span{font-size:9.5px}.card{padding:14px}}
</style>
</head>

 mk('S1',[{sku:'MS-1001',qty:2400},{sku:'MS-1202',qty:300}],2,1,'PO-77120');

  {id:'PO-77120',date:now-3*DAY,lines:[{sku:'MS-1001',qty:2400},{sku:'MS-1202',qty:300}],total:11010,ward:'Central stores',cc:'CC-1001',st:'appr'},
  {id:'PO-77121',date:now-2*DAY,lines:[{sku:'MS-1302',qty:120},{sku:'MS-1101',qty:4000}],total:8188,ward:'Pharmacy',cc:'CC-3300',st:'appr'},
  {id:'PO-77131',date:now-1*DAY,lines:[{sku:'MS-1304',qty:60},{sku:'MS-1401',qty:400}],total:6260,ward:'Pathology',cc:'CC-5100',st:'appr'}];
 const sup={};Object.keys(SUPS).forEach((k,i)=>{const b=[93,88,96,91,94,79][i];sup[k]={otif:b,fill:[97,92,98,95,96,84][i],qual:[99,97,99,98,98,93][i],resp:[90,84,92,88,95,72][i],esg:[78,86,74,88,81,62][i],price:[98,104,101,99,107,91][i],trend:Array.from({length:8},(_,j)=>Math.min(100,Math.round(b-4+j*0.6+r()*5)))}});
 const issues=[{id:1,sup:'S6',type:'late',en:'FFP3 batch 2 weeks late, no ASN sent',ru:'Партия FFP3 опоздала на 2 недели, без уведомления ASN',date:now-12*DAY,open:true},{id:2,sup:'S2',type:'qual',en:'Cannula packs with damaged sterile barrier (lot 22A)',ru:'Упаковки катетеров с повреждённым стерильным барьером (партия 22A)',date:now-20*DAY,open:false}];
 return{auth:false,hosp:0,view:'cat',day:0,cart:{},orders,del,stock,sup,issues,nextPO:77140,nextDel:n,catF:'all',q:'',riskF:'all',fcSku:'MS-1001',fcSc:'base',selDel:null,selSup:'S6'};
}

function risk(k){const s=S.stock[k],c=SKU[k];const cover=s.on/c.daily,eff=(s.on+s.inc)/c.daily;const lvl=eff<c.lead?'high':(cover<c.lead||eff<c.lead+10)?'med':'ok';return{cover,eff,lvl}}

 const minD=new Date(now()+DAY).toISOString().slice(0,10);

  <div class="cat">${list.map(p=>{const rk=risk(p.sku);return`<div class="prod"><div class="ph">${CATS[p.cat][2]}</div><b>${esc(T(p.en,p.ru))}</b><div class="gt">${p.sku} · GTIN ${p.gtin}</div>
   <div class="row" style="justify-content:space-between"><span class="pr">${gbp(p.price)}<span class="muted" style="font-size:12px;font-weight:500"> / ${T(p.unit[0],p.unit[1])}</span></span>${rk.lvl==='ok'?`<span class="pill ok">${T('In stock','В наличии')}</span>`:rk.lvl==='med'?`<span class="pill warn">${T('Limited','Ограничено')}</span>`:`<span class="pill bad">${T('Shortage risk','Риск дефицита')}</span>`}</div>
   <div class="muted" style="font-size:12px">${esc(SUPS[p.sup][0])}${p.cold?' · ❄ 2–8°C':''} · ${T('lead','срок')} ${p.lead} ${T('d','дн.')}</div>
   <div class="row"><span class="qty"><button data-dq="${p.sku}" data-d="-1">−</button><input data-qi="${p.sku}" value="${S.cart[p.sku]||10}" inputmode="numeric"><button data-dq="${p.sku}" data-d="1">+</button></span><button class="btn sm pri" data-add="${p.sku}">${S.cart[p.sku]?T('Update','Обновить'):T('Add','В корзину')}</button></div></div>`}).join('')||`<div class="muted">${T('Nothing found','Ничего не найдено')}</div>`}</div></div>
  <div class="card sticky"><h3>🧺 ${T('Basket','Корзина')}<span class="sp"></span>${lines.length?`<button class="btn sm" id="clr">${T('Clear','Очистить')}</button>`:''}</h3>
   ${lines.length?lines.map(([k,q])=>`<div class="bline"><span><b>${esc(nm(k))}</b><br><span class="muted">${num(q)} × ${gbp(SKU[k].price)}</span></span><b>${gbp(SKU[k].price*q)}</b><button class="btn sm" data-rm="${k}" aria-label="remove">✕</button></div>`).join(''):`<div class="muted" style="padding:16px 0;text-align:center">${T('Basket is empty — add items from the catalogue.','Корзина пуста — добавьте товары из каталога.')}</div>`}
   <div class="row" style="justify-content:space-between;margin:12px 0;font-size:16px"><span>${T('Total (ex VAT)','Итого (без НДС)')}</span><b>${gbp(tot)}</b></div>
   ${tot>5000?`<div class="pill warn" style="margin-bottom:10px">${T('Over £5,000 — budget holder approval required','Больше £5 000 — нужно согласование распорядителя')}</div>`:''}
   <div class="fgrid"><div class="f"><label>${T('Deliver to ward','Отделение доставки')}</label><select class="input" id="ward">${['Central stores','Theatres','Critical care','Pharmacy','Pathology','Emergency dept'].map((w,i)=>`<option value="${w}">${T(w,['Центральный склад','Операционные','Реанимация','Аптека','Лаборатория','Приёмное отделение'][i])}</option>`).join('')}</select></div>
   <div class="f"><label>${T('Cost centre','Центр затрат')}</label><input class="input" id="cc" placeholder="CC-1234" value="CC-1001"></div>
   <div class="f full"><label>${T('Required by','Нужно к дате')}</label><input class="input" type="date" id="rq" min="${minD}" value="${new Date(now()+7*DAY).toISOString().slice(0,10)}"></div></div>
   <div class="err" id="oerr"></div>
   <button class="btn pri" id="submit" style="width:100%;justify-content:center" ${lines.length?'':'disabled'}>${T('Submit order','Оформить заказ')}</button></div></div>`;
 const qi=$('#q',el);qi.oninput=()=>{S.q=qi.value;save();const p=qi.selectionStart;rCat();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
 $$('[data-cf]',el).forEach(b=>b.onclick=()=>{S.catF=b.dataset.cf;save();rCat()});
 $$('[data-dq]',el).forEach(b=>b.onclick=()=>{const i=$(`[data-qi="${b.dataset.dq}"]`,el);i.value=Math.max(1,(parseInt(i.value)||0)+(+b.dataset.d)*(SKU[b.dataset.dq].price<5?50:5))});
 $$('[data-add]',el).forEach(b=>b.onclick=()=>{const k=b.dataset.add,v=parseInt($(`[data-qi="${k}"]`,el).value);if(!(v>0)||v>99999){toast(T('Enter a quantity between 1 and 99,999','Укажите количество от 1 до 99 999'),'bad');return}S.cart[k]=v;save();toast(T('Added to basket: ','В корзине: ')+esc(nm(k))+' × '+v);render()});
 $$('[data-rm]',el).forEach(b=>b.onclick=()=>{delete S.cart[b.dataset.rm];save();render()});
 const c=$('#clr',el);if(c)c.onclick=()=>{S.cart={};save();render()};

function submitOrder(){
 const cc=$('#cc'),rq=$('#rq');let e='';cc.classList.remove('bad');rq.classList.remove('bad');
 if(!/^CC-\d{4}$/.test(cc.value.trim())){e=T('Cost centre must look like CC-1234','Центр затрат в формате CC-1234');cc.classList.add('bad')}
 else if(!rq.value||new Date(rq.value).getTime()<now()){e=T('Required-by date must be in the future','Дата должна быть в будущем');rq.classList.add('bad')}
 $('#oerr').textContent=e;if(e)return;
 const lines=Object.entries(S.cart).map(([sku,qty])=>({sku,qty}));const total=lines.reduce((a,l)=>a+SKU[l.sku].price*l.qty,0);
 const o={id:'PO-'+(S.nextPO++),date:now(),lines,total:Math.round(total*100)/100,ward:$('#ward').value,cc:cc.value.trim(),req:rq.value,st:total>5000?'wait':'appr'};
 S.orders.unshift(o);if(o.st==='appr')dispatch(o);S.cart={};save();
 toast(o.st==='wait'?T(`${o.id} sent for budget approval`,`${o.id} отправлен на согласование`):T(`${o.id} submitted — suppliers notified`,`${o.id} оформлен — поставщики уведомлены`),o.st==='wait'?'gold':'');
 go('orders');
}
function dispatch(o){const by={};o.lines.forEach(l=>{(by[SKU[l.sku].sup]=by[SKU[l.sku].sup]||[]).push(l)});const r=rng(o.id.length+S.nextDel*7);
 Object.entries(by).forEach(([sup,lines])=>{const lead=Math.max(...lines.map(l=>SKU[l.sku].lead));const cold=lines.some(l=>SKU[l.sku].cold);
  S.del.unshift({id:'DLV-'+(S.nextDel++),po:o.id,sup,lines,st:0,eta:now()+Math.ceil(lead/3)*DAY,booked:now(),carrier:cold?CARR[2]:CARR[1],sscc:sscc(r),temp:cold?[]:null});lines.forEach(l=>S.stock[l.sku].inc+=l.qty)})}

function series(k){const c=SKU[k];const r=rng(k.split('').reduce((a,ch)=>a+ch.charCodeAt(0),0));const base=c.daily*30;const amp=(c.cat==='ppe'||c.cat==='iv'||k==='MS-1304')?(k==='MS-1304'?.6:.22):.07;
 const m0=new Date(now()).getMonth();const hist=[];for(let i=-24;i<0;i++){const m=((m0+i)%12+12)%12;hist.push({m,v:base*(1+0.006*(i+24)-0.07)*(1+amp*Math.cos(m/12*2*Math.PI))*(0.92+r()*0.16)})}
 const fc=[];for(let h=0;h<6;h++){const m=(m0+h)%12;let mult=1;if(S.fcSc==='winter'&&[10,11,0,1].includes(m))mult=1.2;if(S.fcSc==='wave')mult=h<3?(c.cat==='ppe'?1.55:1.15):1.05;if(S.fcSc==='elect')mult=(c.cat==='surg'||c.cat==='wound')?1.14:1.03;
  fc.push({m,v:base*(1+0.006*(h+24)-0.07)*(1+amp*Math.cos(m/12*2*Math.PI))*mult,e:0.06+0.025*h})}
 return{hist,fc,base}}

 const W=680,H=280,pl=50,pr=12,pt=14,pb=30;const all=hist.map(x=>x.v).concat(fc.map(x=>x.v*(1+x.e)));const mx=Math.max(...all)*1.08;

 const hp=hist.map((p,i)=>`${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
 const fx=fc.map((p,i)=>[X(hist.length+i),p]);const fp=`${X(hist.length-1)},${Y(hist[hist.length-1].v)} `+fx.map(([x,p])=>`${x.toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
 const band=fx.map(([x,p])=>`${x.toFixed(1)},${Y(p.v*(1+p.e)).toFixed(1)}`).join(' ')+' '+fx.slice().reverse().map(([x,p])=>`${x.toFixed(1)},${Y(p.v*(1-p.e)).toFixed(1)}`).join(' ');
 const grid=[0,.25,.5,.75,1].map(f=>{const v=mx*f;return`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" style="fill:var(--dim);font-size:10px">${v>=1000?Math.round(v/1000)+'k':Math.round(v)}</text>`}).join('');
 const xl=hist.concat(fc).map((p,i)=>i%3===0?`<text x="${X(i)}" y="${H-10}" text-anchor="middle" style="fill:var(--dim);font-size:10px">${T(MON[p.m][0],MON[p.m][1])}</text>`:'').join('');
 const dots=fx.map(([x,p])=>`<circle cx="${x}" cy="${Y(p.v)}" r="4" style="fill:var(--gold)"><title>${T(MON[p.m][0],MON[p.m][1])}: ${num(p.v)}</title></circle>`).join('');
 const err=hist.slice(-12).map((p,i,a)=>{const prev=hist[hist.length-24+i];return Math.abs(p.v-prev.v*1.07)/p.v});const mape=err.reduce((a,b)=>a+b,0)/err.length*100;
 const n3=fc.slice(0,3).reduce((a,p)=>a+p.v,0);const sigma=c.daily*30*0.08;const ss=Math.round(1.65*sigma*Math.sqrt(c.lead/30));
 const need=Math.max(0,Math.ceil((fc[0].v*(c.lead+30)/30+ss-S.stock[k].on-S.stock[k].inc)/10)*10);
 el.innerHTML=`<div class="card" style="margin-bottom:14px"><div class="row"><select class="input" id="fsku" style="max-width:420px">${CAT.map(x=>`<option value="${x[0]}" ${x[0]===k?'selected':''}>${esc(T(x[2],x[3]))}</option>`).join('')}</select>
 <div class="chips">${Object.entries(SCN).map(([s,v])=>`<button class="chip ${S.fcSc===s?'on':''}" data-sc="${s}">${T(v[0],v[1])}</button>`).join('')}</div></div></div>
 <div class="grid2"><div class="card chart"><h3>${T('Monthly demand · 24 months history + 6 months forecast','Спрос по месяцам · 24 мес. истории + прогноз на 6 мес.')}<span class="sp"></span><span class="legend"><span><i style="background:var(--mal)"></i>${T('actual','факт')}</span><span><i style="background:var(--gold)"></i>${T('forecast','прогноз')}</span><span><i style="background:var(--gold);opacity:.25"></i>${T('80% interval','интервал 80%')}</span></span></h3>
 <svg viewBox="0 0 ${W} ${H}" role="img">${grid}<polygon points="${band}" style="fill:var(--gold);opacity:.18"/><line x1="${X(hist.length-1)}" x2="${X(hist.length-1)}" y1="${pt}" y2="${H-pb}" style="stroke:var(--dim);stroke-dasharray:3 3"/><text x="${X(hist.length-1)+4}" y="${pt+10}" style="fill:var(--dim);font-size:10px">${T('today','сегодня')}</text>
 <polyline points="${hp}" style="fill:none;stroke:var(--mal);stroke-width:2.2"/><polyline points="${fp}" style="fill:none;stroke:var(--gold);stroke-width:2.4;stroke-dasharray:6 4"/>${dots}${xl}</svg>
 <div class="muted" style="font-size:12px">${T('Model: seasonal trend (Holt-Winters class) on GS1 consumption feeds from 214 trusts; scenario multipliers set by category managers.','Модель: сезонный тренд (класс Holt-Winters) по данным потребления GS1 из 214 трестов; множители сценариев задают менеджеры категорий.')}</div></div>

 $('#fsku',el).onchange=e=>{S.fcSku=e.target.value;save();rFc()};
 $$('[data-sc]',el).forEach(b=>b.onclick=()=>{S.fcSc=b.dataset.sc;save();rFc()});

 const p=Math.min(d.st,3);const path='M'+pts.map(q=>q.join(',')).join(' L');

 return`<svg viewBox="0 0 640 150" role="img"><path d="${path}" style="fill:none;stroke:var(--line2);stroke-width:4;stroke-dasharray:2 8;stroke-linecap:round"/>${p?`<path d="${done}" style="fill:none;stroke:var(--mal);stroke-width:4;stroke-linecap:round"/>`:''}

 const el=$('#v-del');if(!S.selDel||!S.del.find(d=>d.id===S.selDel))S.selDel=(S.del.find(d=>d.st===3)||S.del[0]||{}).id;const d=S.del.find(x=>x.id===S.selDel);

 <div class="grid2"><div>${S.del.map(x=>{const lt=x.st<4&&x.eta<now()-DAY/2;return`<div class="dl ${x.id===S.selDel?'on':''}" data-sd="${x.id}"><div class="top"><b>${x.id} · ${esc(SUPS[x.sup][0])}</b>${x.temp?'<span class="pill">❄ 2–8°C</span>':''}<span class="pill ${x.st===4?'ok':lt?'bad':x.st===3?'gold':''}">${lt?T('Late','Опаздывает'):T(DST[x.st][0],DST[x.st][1])}</span></div>

 ${d?`<div class="card sticky chart"><h3>${d.id}<span class="sp"></span><span class="mono muted" style="font-size:11px">SSCC ${d.sscc}</span></h3>${routeSvg(d)}

 const pt=(o,i)=>{const ang=-Math.PI/2+i*2*Math.PI/5;const r=Math.max(0,(o[ax[i][2]]-50)/50)*R;return(cx+r*Math.cos(ang)).toFixed(1)+','+(cy+r*Math.sin(ang)).toFixed(1)};

 <polygon points="${ax.map((_,i)=>pt(avg,i)).join(' ')}" style="fill:var(--gold);opacity:.15;stroke:var(--gold);stroke-dasharray:4 3"/><polygon points="${ax.map((_,i)=>pt(s,i)).join(' ')}" style="fill:var(--mal);fill-opacity:.25;stroke:var(--mal);stroke-width:2"/>
 ${ax.map((a,i)=>{const ang=-Math.PI/2+i*2*Math.PI/5;return`<text x="${cx+(R+18)*Math.cos(ang)}" y="${cy+(R+18)*Math.sin(ang)+4}" text-anchor="middle" style="fill:var(--muted);font-size:11px">${T(a[0],a[1])}</text>`}).join('')}</svg>`}
function spark(a){const W=120,H=30,mn=Math.min(...a)-1,mx=Math.max(...a)+1;return`<svg viewBox="0 0 ${W} ${H}" style="width:120px;height:30px"><polyline points="${a.map((v,i)=>(i*W/(a.length-1)).toFixed(1)+','+(H-2-(v-mn)/(mx-mn)*(H-4)).toFixed(1)).join(' ')}" style="fill:none;stroke:var(--mal3);stroke-width:2"/></svg>`}

  ${[['OTIF','OTIF','otif'],['Fill rate','Выполнение','fill'],['Quality','Качество','qual']].map(m=>`<div class="met"><span class="muted">${T(m[0],m[1])}</span><div class="bar"><i style="width:${x[m[2]]}%"></i></div><b>${x[m[2]]}%</b></div>`).join('')}
  <div class="row" style="justify-content:space-between;margin-top:8px">${spark(x.trend)}${oi?`<span class="pill bad">${oi} ${T('open issues','открытых')}</span>`:`<span class="pill ok">${T('no issues','без замечаний')}</span>`}</div></div>`}).join('')}</div>
 <div class="grid2"><div class="card chart"><h3>${esc(SUPS[sel][0])}<span class="sp"></span><span class="legend"><span><i style="background:var(--mal)"></i>${T('supplier','поставщик')}</span><span><i style="background:var(--gold)"></i>${T('framework average','среднее по рамке')}</span></span></h3>
  <div class="row" style="align-items:flex-start"><div style="flex:1;min-width:220px;max-width:340px">${radar(s)}</div>
  <dl class="facts" style="flex:1;min-width:200px;font-size:13px;gap:8px 12px"><dt>${T('Overall score','Итоговый балл')}</dt><dd style="color:${g[1]}">${score(s).toFixed(1)} · ${T('grade','класс')} ${g[0]}</dd><dt>OTIF</dt><dd>${s.otif}%</dd><dt>${T('Fill rate','Выполнение')}</dt><dd>${s.fill}%</dd><dt>${T('Quality acceptance','Приёмка по качеству')}</dt><dd>${s.qual}%</dd><dt>${T('Query response','Ответ на запросы')}</dt><dd>${s.resp}%</dd><dt>${T('Carbon reduction plan','План снижения CO₂')}</dt><dd>${s.esg}/100</dd><dt>${T('Price index vs framework','Индекс цены к рамке')}</dt><dd class="${s.price>100?'warn-t':'ok-t'}">${s.price}</dd>
  <dt>${T('Catalogue lines','Позиций в каталоге')}</dt><dd>${CAT.filter(c=>c[7]===sel).length}</dd></dl></div>
  <div class="muted" style="font-size:12px">${T('Score = 35% OTIF + 25% fill rate + 20% quality + 10% response + 10% ESG. OTIF updates live when you receive deliveries.','Балл = 35% OTIF + 25% выполнение + 20% качество + 10% реакция + 10% ESG. OTIF меняется при приёмке поставок.')}</div></div>
 <div class="card"><h3>${T('Performance issues','Замечания к поставщику')}</h3>
  ${S.issues.filter(i=>i.sup===sel).map(i=>`<div class="iss"><span>${i.open?'🔴':'🟢'}</span><span><b>${T(IT[i.type][0],IT[i.type][1])}</b> · <span class="muted">${fmtD(i.date)}</span><br>${esc(i.text||T(i.en,i.ru))}</span>${i.open?`<button class="btn sm" data-res="${i.id}">${T('Resolve','Закрыть')}</button>`:''}</div>`).join('')||`<div class="muted" style="padding:8px 0">${T('No issues logged.','Замечаний нет.')}</div>`}
  <div style="margin-top:12px"><div class="f"><label>${T('Issue type','Тип замечания')}</label><select class="input" id="itype">${Object.entries(IT).map(([k,v])=>`<option value="${k}">${T(v[0],v[1])}</option>`).join('')}</select></div>
  <div class="f"><label>${T('Description','Описание')}</label><textarea class="input" id="itext" rows="3" placeholder="${T('What happened, PO / lot number…','Что произошло, номер заказа / партии…')}"></textarea></div><div class="err" id="ierr"></div>
  <button class="btn pri" id="iadd">${T('Log issue','Зарегистрировать')}</button></div></div></div>`;
 $$('[data-ss]',el).forEach(b=>b.onclick=()=>{S.selSup=b.dataset.ss;save();rSup()});
 $$('[data-res]',el).forEach(b=>b.onclick=()=>{const i=S.issues.find(x=>x.id==b.dataset.res);i.open=false;S.sup[sel].resp=Math.min(100,S.sup[sel].resp+1);save();toast(T('Issue resolved','Замечание закрыто'));render()});
 $('#iadd',el).onclick=()=>{const t=$('#itext').value.trim();if(t.length<10){$('#ierr').textContent=T('Describe the issue (at least 10 characters)','Опишите замечание (не меньше 10 символов)');$('#itext').classList.add('bad');return}
  const ty=$('#itype').value;S.issues.unshift({id:Date.now(),sup:sel,type:ty,text:t,date:now(),open:true});if(ty==='qual')S.sup[sel].qual=Math.max(50,S.sup[sel].qual-1);if(ty==='late')S.sup[sel].otif=Math.max(50,+(S.sup[sel].otif-1).toFixed(1));save();toast(T('Issue logged and sent to supplier','Замечание отправлено поставщику'),'gold');render()};
}

/* ---------- day simulation ---------- */
function advance(){
 S.day++;const r=rng(S.day*31+7);
 CAT.forEach(c=>{const s=S.stock[c[0]];s.on=Math.max(0,Math.round(s.on-c[9]*(0.8+r()*0.4)))});
 let arr=0;S.del.forEach(d=>{if(d.st<3){const days=Math.max(1,Math.round((d.eta-d.booked)/DAY));if(now()>=d.eta-DAY||r()<1.6/days*1.5){d.st++;if(d.st===3)arr++}}if(d.temp&&d.st<4)for(let i=0;i<6;i++)d.temp.push(+(4.2+r()*2.6).toFixed(1));if(d.temp&&d.temp.length>48)d.temp=d.temp.slice(-48)});
 save();const hi=CAT.filter(c=>risk(c[0]).lvl==='high').length;
 toast(T(`Day +${S.day}: stock consumed, ${arr} deliveries arriving · ${hi} high-risk lines`,`День +${S.day}: расход списан, прибывает поставок: ${arr} · высокий риск: ${hi}`),hi?'gold':'');render();
}

$('#login').onclick=()=>{const u=$('#lu').value.trim(),p=$('#lp').value;if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u)){$('#lerr').textContent=T('Enter a valid work email','Введите корректную рабочую почту');return}if(p.length<4){$('#lerr').textContent=T('Password is too short','Пароль слишком короткий');return}
 $('#lerr').textContent='';S.auth=true;S.hosp=+$('#lh').value;save();render();toast(T('Signed in as R. Okafor','Вход выполнен: R. Okafor'))};
$('#lp').onkeydown=e=>{if(e.key==='Enter')$('#login').click()};
$('#logout').onclick=()=>{S.auth=false;save();render()};
$('#advance').onclick=advance;
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#reset').onclick=()=>{store.clear();S=seed();S.auth=true;save();render();toast(T('Demo reset','Демо сброшено'))};
PT.onLang(()=>render());
document.addEventListener('DOMContentLoaded',()=>render());
})();
</script>
