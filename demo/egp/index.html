<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenBid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.app[hidden],.login[hidden]{display:none}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1306;font-size:15px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left;min-height:40px}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.nav .live{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.grow{flex:1}
.who{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:12.5px;display:flex;gap:10px;align-items:center}
.who .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--mal) 22%,transparent);color:var(--mal3);font-weight:800;flex:none}
.who b{display:block;font-size:13px}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.grid2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.mt{margin-top:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f .err{font-size:11.5px;color:var(--red);margin-top:4px;min-height:0}
.input.bad{border-color:var(--red)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:var(--mono)}
tr.win td{background:color-mix(in srgb,var(--mal) 9%,transparent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;min-height:34px}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.tcard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--panel);margin-bottom:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;cursor:pointer;transition:.15s}
.tcard:hover{border-color:var(--mal)}
.tcard .id{font-family:var(--mono);font-size:12px;color:var(--dim)}
.tcard .ttl{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.tcard .meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}
.tcard .val{text-align:right;font-weight:800;font-size:17px;white-space:nowrap}
.tcard .val small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.log{font-size:13px}
.log div{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.log div:last-child{border:0}
.log .t{font-family:var(--mono);font-size:11.5px;color:var(--dim);flex:none;width:44px;padding-top:2px}
.log span{flex:1;min-width:0;overflow-wrap:anywhere}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.modal{position:fixed;inset:0;z-index:2500;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;padding:60px 16px 20px;overflow:auto}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r2);max-width:760px;width:100%;padding:22px;box-shadow:var(--shadow);position:relative}
.modal .x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-size:16px}
.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.dl div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.dl span{display:block;font-size:11.5px;color:var(--muted)} .dl b{font-size:14px;overflow-wrap:anywhere}
.qa{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--bg2);font-size:13.5px}
.qa .a{margin-top:6px;padding-left:10px;border-left:3px solid var(--mal);color:var(--muted)}
.docs{display:flex;flex-direction:column;gap:8px}
.doc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg2);font-size:13.5px}
.doc .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--panel2);flex:none;font-size:15px}
.doc span{flex:1;min-width:0;overflow-wrap:anywhere}
.doc.ok{border-color:color-mix(in srgb,var(--mal) 50%,transparent)}
.doc.ok .ic{background:color-mix(in srgb,var(--mal) 20%,transparent);color:var(--mal3)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--mal);flex:none}
.env{display:grid;place-items:center;padding:20px 10px}
.env svg{width:220px;max-width:100%;height:auto}
.env .flap{transform-origin:110px 60px;transition:transform .7s cubic-bezier(.5,0,.3,1)}
.env.sealed .flap{transform:scaleY(-1)}
.env .seal{opacity:0;transform:scale(2.2);transform-origin:110px 92px;transition:.45s .65s}
.env.sealed .seal{opacity:1;transform:scale(1)}
.hash{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere;word-break:break-all}
.mybid{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg2);margin-bottom:10px}
.mybid .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mybid .top b{flex:1;min-width:160px;overflow-wrap:anywhere}
.auc{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.clock{font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:.02em;line-height:1}
.clock.hot{color:var(--red)}
.best{font-size:30px;font-weight:800;letter-spacing:-.02em}
.ladder div{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;font-size:13.5px}
.ladder div:nth-child(odd){background:var(--bg2)}
.ladder .rk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--panel2);border:1px solid var(--line2);flex:none}
.ladder .me .rk{background:var(--gold);color:#1a1306;border-color:var(--gold)}
.ladder span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ladder .p{font-family:var(--mono);font-weight:700}
.feed{max-height:220px;overflow:auto;font-size:12.5px}
.feed div{padding:5px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px}
.feed .t{font-family:var(--mono);color:var(--dim);flex:none}
.mx input{width:64px;text-align:right;font-family:var(--mono);background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;outline:none}
.mx input:focus{border-color:var(--mal)}
.mx .tot{font-weight:800;font-family:var(--mono)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mal2),var(--mal3))}
.steps{display:flex;margin:6px 0 4px}
.step{flex:1;text-align:center;position:relative;font-size:11.5px;color:var(--muted);min-width:0}
.step:before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line2)}
.step:first-child:before{display:none}
.step .dot{width:28px;height:28px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line2);position:relative;z-index:1;font-weight:800;font-size:12px}
.step.ok .dot{background:var(--mal);border-color:var(--mal);color:#fff}
.step.ok:before,.step.cur:before{background:var(--mal)}
.step.cur .dot{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 18%,transparent)}
.step span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
pre.json{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;margin:0;max-height:520px;white-space:pre}
pre.json .k{color:var(--blue)} pre.json .s{color:var(--mal3)} pre.json .n{color:var(--gold2)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .big{font-size:36px}
/* login */
.login{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 500px at 70% -10%,color-mix(in srgb,var(--mal) 16%,transparent),transparent),radial-gradient(900px 400px at 0% 110%,color-mix(in srgb,var(--gold) 12%,transparent),transparent)}
.lbox{width:100%;max-width:960px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:center}
.lhero h2{font-size:34px;line-height:1.15;margin:12px 0;letter-spacing:-.02em}
.lhero p{color:var(--muted);margin:0 0 16px}
.lhero ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:14px}
.lhero li{display:flex;gap:10px;align-items:flex-start}
.lhero li b{color:var(--mal3)}
.lcard{padding:24px;border-radius:var(--r2);box-shadow:var(--shadow)}
.lcard h3{margin:0 0 4px;font-size:19px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.role{border:1px solid var(--line2);border-radius:12px;padding:10px;cursor:pointer;background:var(--bg2);text-align:left}
.role b{display:block;font-size:13.5px} .role span{font-size:11.5px;color:var(--muted)}
.role.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 12%,transparent)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.auc{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
  .lbox{grid-template-columns:minmax(0,1fr)}
  .lhero h2{font-size:26px}
  .grid2e{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}.dl{grid-template-columns:1fr 1fr}.kpi .v{font-size:20px}.kpis{gap:10px}.tcard{grid-template-columns:minmax(0,1fr)}.tcard .val{text-align:left}.clock{font-size:34px}.best{font-size:24px}.step span{font-size:9.5px}.modal .box{padding:18px 14px}.lhero ul{display:none}}
</style>
</head>
<body data-demo-en="OpenBid — National e-procurement (e-GP)" data-demo-ru="OpenBid — Национальные электронные закупки (e-GP)">
<section class="login" id="login">
  <div class="lbox">
    <div class="lhero">
      <span class="pill gold" data-en="Public Procurement Authority · Republic of Veloria" data-ru="Агентство госзакупок · Республика Велория"></span>
      <h2 data-en="Every public contract — open, sealed, auditable." data-ru="Каждый госконтракт — открыто, запечатано, проверяемо."></h2>
      <p data-en="OpenBid runs the full tender cycle: notices, sealed electronic bids, live reverse auctions, scored evaluation, award and OCDS open data." data-ru="OpenBid ведёт весь цикл закупки: извещения, запечатанные электронные заявки, онлайн-аукционы на понижение, оценка по баллам, присуждение и открытые данные OCDS."></p>
      <ul>
        <li><b>✓</b><span data-en="Bids sealed with a cryptographic hash until the opening time" data-ru="Заявки запечатаны криптографическим хешем до момента вскрытия"></span></li>
        <li><b>✓</b><span data-en="Reverse auctions with anti-sniping extension" data-ru="Аукционы на понижение с продлением против «последней секунды»"></span></li>
        <li><b>✓</b><span data-en="Every stage published as OCDS 1.1 releases" data-ru="Каждый этап публикуется как релиз OCDS 1.1"></span></li>
      </ul>
    </div>
    <div class="card lcard">
      <h3 data-en="Sign in to OpenBid" data-ru="Вход в OpenBid"></h3>
      <div class="muted" style="font-size:13px" data-en="Demo credentials are prefilled — choose a role and continue." data-ru="Демо-данные уже заполнены — выберите роль и войдите."></div>
      <div class="roles">
        <button class="role on" data-role="supplier"><b data-en="Supplier" data-ru="Поставщик"></b><span data-en="Northgate Systems LLC" data-ru="ООО «Нортгейт Системс»"></span></button>
        <button class="role" data-role="buyer"><b data-en="Procurement officer" data-ru="Закупщик"></b><span data-en="Central Procurement Office" data-ru="Центральное бюро закупок"></span></button>
      </div>
      <div class="f" style="margin-bottom:10px"><label data-en="Email" data-ru="Эл. почта"></label><input class="input" id="lEmail" value="demo@northgate.vl" autocomplete="username"><div class="err" id="lEmailE"></div></div>
      <div class="f" style="margin-bottom:14px"><label data-en="Password" data-ru="Пароль"></label><input class="input" id="lPass" type="password" value="openbid-demo" autocomplete="current-password"><div class="err" id="lPassE"></div></div>
      <button class="btn pri" id="loginBtn" style="width:100%;justify-content:center;padding:12px" data-en="Sign in with demo account" data-ru="Войти в демо-аккаунт"></button>
      <div class="muted" style="font-size:11.5px;margin-top:10px;text-align:center" data-en="Protected by national e-signature (demo mode)" data-ru="Защищено национальной ЭЦП (демо-режим)"></div>
    </div>
  </div>
</section>
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><b>⚖</b><div>OpenBid<small data-en="e-GP · Republic of Veloria" data-ru="e-GP · Республика Велория"></small></div></div>
    <div class="sec" data-en="Overview" data-ru="Обзор"></div>
    <button class="nav" data-view="dash"><span class="ic">◧</span><span data-en="Dashboard" data-ru="Сводка"></span></button>
    <button class="nav" data-view="notices"><span class="ic">▤</span><span data-en="Tender notices" data-ru="Извещения"></span><span class="cnt" id="cntN"></span></button>
    <div class="sec" data-en="Supplier" data-ru="Поставщик"></div>
    <button class="nav" data-view="bid"><span class="ic">✉</span><span data-en="Submit a bid" data-ru="Подать заявку"></span></button>
    <button class="nav" data-view="mybids"><span class="ic">☰</span><span data-en="My bids" data-ru="Мои заявки"></span><span class="cnt" id="cntB"></span></button>
    <button class="nav" data-view="auction"><span class="ic">⇣</span><span data-en="Live auction" data-ru="Онлайн-аукцион"></span><i class="live" id="liveDot"></i></button>
    <div class="sec" data-en="Buyer" data-ru="Заказчик"></div>
    <button class="nav" data-view="eval"><span class="ic">▦</span><span data-en="Evaluation" data-ru="Оценка заявок"></span></button>
    <button class="nav" data-view="award"><span class="ic">✔</span><span data-en="Award &amp; contracts" data-ru="Присуждение и контракты"></span></button>
    <div class="sec" data-en="Public" data-ru="Публично"></div>
    <button class="nav" data-view="ocds"><span class="ic">{ }</span><span data-en="Open data (OCDS)" data-ru="Открытые данные (OCDS)"></span></button>
    <div class="grow"></div>
    <div class="who" id="who"></div>
    <div class="row" style="margin-top:8px">
      <button class="btn sm" id="logout" style="flex:1;justify-content:center" data-en="Log out" data-ru="Выйти"></button>
      <button class="btn sm" id="reset" style="flex:1;justify-content:center" data-en="Reset demo" data-ru="Сбросить демо"></button>
    </div>
  </aside>
  <main>
    <div class="head">
      <button class="btn sm menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <span class="sp"></span>
      <button class="btn sm" id="roleP" title="Switch role"></button>
    </div>
    <section class="view" id="v-dash"></section>
    <section class="view" id="v-notices"></section>
    <section class="view" id="v-bid"></section>
    <section class="view" id="v-mybids"></section>
    <section class="view" id="v-auction"></section>
    <section class="view" id="v-eval"></section>
    <section class="view" id="v-award"></section>
    <section class="view" id="v-ocds"></section>
  </main>
</div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toasts" id="toasts"></div>
<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

function openEnvelopes(x){
  const mine=S.myBids.find(b=>b.tid===x.id&&b.status==='sealed');
  const rnd=()=>55+Math.floor(Math.random()*40);
  const bidders=x.bids.map(b=>({n:b.sup,price:b.price,s:{tech:rnd(),exp:rnd(),del:rnd(),local:rnd()}}));
  if(mine){mine.status='opened';bidders.push({n:'Northgate Systems',price:mine.price,s:{tech:rnd(),exp:rnd(),del:rnd(),local:rnd()},me:true})}
  if(!bidders.length){toast(T('No bids received — tender will be re-advertised','Заявок нет — закупка будет объявлена повторно'),'bad');x.status='cancelled';save();return}
  S.evals[x.id]={done:false,weights:{price:40,tech:30,exp:15,del:10,local:5},bidders};
  x.status='evaluation';x.deadline=Math.min(x.deadline,Date.now());S.evalT=x.id;
  addLog(`Bids opened for ${x.id} — ${bidders.length} envelopes, hashes verified`,`Вскрыты заявки по ${x.id} — конвертов: ${bidders.length}, хеши проверены`);
  save();toast(T(`${bidders.length} envelopes opened · all hashes match`,`Вскрыто конвертов: ${bidders.length} · все хеши совпали`),'gold');
}

  updAuction();
}
function placeBid(who,price){const a=A(),now=Date.now();a.bids.push({who,price,t:now});if(a.endAt-now<30e3){a.endAt=now+30e3;a.ext++}save()}
function maskName(w,i){return w==='me'?T('You · Northgate Systems','Вы · Нортгейт Системс'):T('Bidder ','Участник ')+String.fromCharCode(65+i)}
function updAuction(){
  const a=A();if(S.view!=='auction'||!$('#aClock'))return;
  const now=Date.now(),rem=Math.max(0,a.endAt-now),best=bestBid();
  $('#aClock').textContent=String(Math.floor(rem/60e3)).padStart(2,'0')+':'+String(Math.floor(rem%60e3/1e3)).padStart(2,'0');
  $('#aClock').classList.toggle('hot',rem<30e3&&!a.done);
  $('#aBest').textContent=money(best.price);
  $('#aSave').textContent=T('−','−')+((1-best.price/a.start)*100).toFixed(1)+T('% vs start ','% к старту ')+money(a.start);
  $('#aState').className='pill '+(a.done?'ok':'bad');$('#aState').textContent=a.done?T('Closed','Завершён'):T('● LIVE','● В ЭФИРЕ')+(a.ext?' · +'+a.ext*30+T('s ext','с'):'');
  const names=[...new Set(a.bids.map(b=>b.who))].filter(w=>w!=='me');
  const lastBy={};a.bids.forEach(b=>{if(!lastBy[b.who]||b.price<lastBy[b.who])lastBy[b.who]=b.price});
  const rank=Object.entries(lastBy).sort((p,q)=>p[1]-q[1]);
  $('#aLadder').innerHTML=rank.map(([w,p],i)=>`<div class="${w==='me'?'me':''}"><span class="rk">${i+1}</span><span>${maskName(w,names.indexOf(w))}</span><span class="p">${money(p)}</span></div>`).join('');
  $('#aFeed').innerHTML=a.bids.slice().reverse().slice(0,12).map(b=>`<div><span class="t">${hms(b.t)}</span><span>${maskName(b.who,names.indexOf(b.who))} — <b>${money(b.price)}</b></span></div>`).join('');
  // chart
  const W=560,H=220,pl=60,pr=12,pt=12,pb=24,t0=a.bids[0].t-5e3,t1=Math.max(now,a.bids[a.bids.length-1].t)+3e3;
  const lo=Math.min(...a.bids.map(b=>b.price))*0.99,hi=a.start*1.005;
  const X=t=>pl+(t-t0)/(t1-t0)*(W-pl-pr),Y=p=>pt+(hi-p)/(hi-lo)*(H-pt-pb);
  let path=`M${X(t0)} ${Y(a.start)}`,cur=a.start;const pts=[];a.bids.slice().sort((p,q)=>p.t-q.t).forEach(b=>{if(b.price<cur){path+=`H${X(b.t)}V${Y(b.price)}`;cur=b.price}pts.push(b)});path+=`H${X(t1)}`;
  const g=cssv('--gold'),m=cssv('--mal'),ln=cssv('--line'),mu=cssv('--muted');
  let grid='';for(let i=0;i<4;i++){const p=lo+(hi-lo)*i/3;grid+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(p)}" y2="${Y(p)}" stroke="${ln}"/><text x="${pl-6}" y="${Y(p)+4}" fill="${mu}" font-size="10" text-anchor="end">${(p/1e6).toFixed(2)}M</text>`}
  $('#aChart').innerHTML=`<svg viewBox="0 0 ${W} ${H}">${grid}<path d="${path}" fill="none" stroke="${m}" stroke-width="2.5"/>${pts.map(b=>`<circle cx="${X(b.t)}" cy="${Y(b.price)}" r="${b.who==='me'?5.5:4}" fill="${b.who==='me'?g:m}" stroke="${cssv('--panel')}" stroke-width="1.5"/>`).join('')}</svg>`;
  $('#aIn').disabled=$('#aBid').disabled=a.done;
  if(a.done){const w=rank[0];$('#aDone').innerHTML=`<div class="card mt" style="border-color:var(--${w[0]==='me'?'mal':'line2'})"><b>${w[0]==='me'?T('🏆 You won the auction','🏆 Вы выиграли аукцион'):T('Auction closed','Аукцион завершён')}</b><div class="muted" style="font-size:13px;margin:6px 0 10px">${T('Final price','Итоговая цена')} ${money(w[1])} · ${T('saving','экономия')} ${((1-w[1]/a.start)*100).toFixed(1)}%</div><button class="btn sm" id="aRe">↻ ${T('Restart auction','Перезапустить аукцион')}</button></div>`;$('#aRe').onclick=()=>{S.auction=newAuction();const x=tById(S.auction.tid);x.status='active';x.award=null;save();render()}}else $('#aDone').innerHTML='';
}
function tickAuction(){
  const a=A();if(!S.user||a.done)return;const now=Date.now();
  if(now>=a.endAt){a.done=true;const lastBy={};a.bids.forEach(b=>{if(!lastBy[b.who]||b.price<lastBy[b.who])lastBy[b.who]=b.price});const w=Object.entries(lastBy).sort((p,q)=>p[1]-q[1])[0];const x=tById(a.tid);x.status='awarded';x.auctionStart=a.start;x.award={sup:w[0]==='me'?'Northgate Systems':w[0],price:w[1],date:now,contract:{id:'CT-2025-0'+(S.nextCt++),status:'standstill'}};if(w[0]==='me')S.myBids.unshift({tid:a.tid,price:w[1],validity:90,time:now,hash:hash(a.tid+'|'+w[1]+'|auction'),status:'won'});addLog(`Auction ${a.tid} closed at ${Math.round(w[1]).toLocaleString('en-US')} VLD`,`Аукцион ${a.tid} завершён на ${Math.round(w[1]).toLocaleString('ru-RU')} VLD`);save();toast(T('Auction closed','Аукцион завершён'),'gold');render();return}
  if(now>=a.next){const best=bestBid().price;const cands=Object.entries(a.bots).filter(([n,f])=>best*0.992>f&&bestBid().who!==n);if(cands.length){const [n,f]=cands[Math.floor(Math.random()*cands.length)];const p=Math.max(f,Math.round(best*(1-(0.005+Math.random()*0.009))/100)*100);placeBid(n,p)}a.next=now+3500+Math.random()*5000;save()}
  updAuction();
}
setInterval(tickAuction,1000);

/* ---------- evaluation ---------- */
function score(ev,b){const minP=Math.min(...ev.bidders.map(x=>x.price));const s={price:minP/b.price*100,...b.s};return Object.keys(ev.weights).reduce((a,k)=>a+s[k]*ev.weights[k]/100,0)}

  ${S.role!=='buyer'?`<div class="muted" style="font-size:12.5px;margin-top:8px">🔒 ${T('Read-only: switch to the Procurement officer role to score bids.','Только просмотр: для выставления баллов войдите как закупщик.')}</div>`:''}</div>
  <div class="tw mx"><table><thead><tr><th>${T('Bidder','Участник')}</th><th class="num">${T('Price','Цена')}</th>${Object.keys(ev.weights).map(k=>`<th class="num">${T(...CRIT[k])}<br><input data-w="${k}" type="number" min="0" max="100" value="${ev.weights[k]}" ${ro?'disabled':''} aria-label="weight">%</th>`).join('')}<th class="num">${T('Total','Итог')}</th><th>${T('Rank','Место')}</th></tr></thead><tbody>

  <div class="row mt"><span class="${wsum===100?'ok-t':'bad-t'}" style="font-size:13px;font-weight:700;color:var(--${wsum===100?'mal3':'red'})">${T('Weights total','Сумма весов')}: ${wsum}%</span><span class="sp" style="flex:1"></span>${!ro?`<button class="btn pri" id="eFin" ${wsum!==100?'disabled':''}>${T('Finalise evaluation & recommend','Утвердить оценку и рекомендовать')}</button>`:''}${ev.done?`<button class="btn" data-go="award">${T('Go to award','К присуждению')} →</button>`:''}</div>
  <div class="grid2e mt"><div class="card"><h3>${T('Recommended award','Рекомендуемый победитель')}</h3><div style="font-size:20px;font-weight:800">${esc(ranked[0].b.n)}</div><div class="muted" style="font-size:13px">${T('Score','Балл')} ${ranked[0].t.toFixed(1)} · ${money(ranked[0].b.price)} · ${T('margin over #2','отрыв от #2')}: ${ranked[1]?(ranked[0].t-ranked[1].t).toFixed(1):'—'}</div></div>

/* ---------- OCDS ---------- */
function release(x){
  const tags=['tender'];if(x.status==='awarded')tags.push('award');if(x.award&&x.award.contract.status==='signed')tags.push('contract');
  const r={ocid:'ocds-vl7k2-'+x.id,id:x.id+'-'+tags[tags.length-1]+'-'+new Date(x.published).toISOString().slice(0,10),date:new Date().toISOString().slice(0,19)+'Z',tag:tags,initiationType:'tender',
   buyer:{id:'VL-GOV-'+x.buyer.en.replace(/[^A-Z]/g,''),name:x.buyer.en},
   tender:{id:x.id,title:x.title.en,status:x.status==='active'?'active':x.status==='cancelled'?'cancelled':'complete',value:{amount:x.value,currency:'VLD'},procurementMethod:x.method==='rfq'?'limited':'open',procurementMethodDetails:METH[x.method][0],mainProcurementCategory:x.cat,tenderPeriod:{startDate:new Date(x.published).toISOString().slice(0,10),endDate:new Date(x.deadline).toISOString().slice(0,10)},numberOfTenderers:(S.evals[x.id]?S.evals[x.id].bidders.length:x.bids.length)}};
  if(x.award){r.awards=[{id:x.id+'-AW1',status:'active',date:new Date(x.award.date).toISOString().slice(0,10),value:{amount:x.award.price,currency:'VLD'},suppliers:[{name:x.award.sup}]}];
   if(x.award.contract.status!=='standstill')r.contracts=[{id:x.award.contract.id,awardID:x.id+'-AW1',status:x.award.contract.status==='signed'?'active':'pending',value:{amount:x.award.price,currency:'VLD'},dateSigned:x.award.contract.signed?new Date(x.award.contract.signed).toISOString().slice(0,10):undefined}]}
  return r;
}
function pkg(rs){return{uri:'https://data.openbid.gov.vl/ocds/'+(rs.length===1?rs[0].ocid:'all'),version:'1.1',publishedDate:new Date().toISOString().slice(0,19)+'Z',publisher:{name:'Public Procurement Authority of Veloria'},license:'https://creativecommons.org/licenses/by/4.0/',releases:rs}}
function hl(j){return esc(j).replace(/(&quot;[^&]*?&quot;)(\s*:)?|(-?\d+(?:\.\d+)?)/g,(m,s,c,n)=>s?(c?`<span class="k">${s}</span>${c}`:`<span class="s">${s}</span>`):`<span class="n">${n}</span>`)}

  <div><div class="card"><h3>${T('Published processes by stage','Процедуры по этапам')}</h3>${stages.map(([k,v])=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px"><span style="width:96px;flex:none">${T(...SL[k])}</span><div class="bar" style="flex:1"><i style="width:${v/mx*100}%"></i></div><b class="mono" style="width:22px;text-align:right">${v}</b></div>`).join('')}</div>
  <div class="card mt"><h3>${T('Bulk download','Массовая выгрузка')}</h3><div class="muted" style="font-size:13px;margin-bottom:10px">${T('All '+S.tenders.length+' contracting processes as one OCDS 1.1 release package. Licence CC BY 4.0.','Все '+S.tenders.length+' процедуры одним пакетом OCDS 1.1. Лицензия CC BY 4.0.')}</div><button class="btn" id="oAll">⬇ ${T('Download full dataset','Скачать весь набор')}</button></div>
  <div class="card mt"><h3>${T('API endpoint','API-адрес')}</h3><div class="hash">GET https://data.openbid.gov.vl/ocds/releases?ocid=ocds-vl7k2-${x.id}</div><div class="muted" style="font-size:12px;margin-top:8px">${T('Validated against the OCDS 1.1 schema · updated in real time','Проверено по схеме OCDS 1.1 · обновляется в реальном времени')}</div></div></div></div>`;
  $('#oT').onchange=e=>{S.ocdsT=e.target.value;save();rOcds()};
  const dl=(name,txt)=>{const u=URL.createObjectURL(new Blob([txt],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)};
  $('#oDl').onclick=()=>{dl('ocds-vl7k2-'+x.id+'.json',json);toast(T('Release package downloaded','Пакет релизов скачан'))};
  $('#oAll').onclick=()=>{dl('openbid-ocds-all.json',JSON.stringify(pkg(S.tenders.map(release)),null,2));toast(T('Full dataset downloaded','Весь набор скачан'))};
  $('#oCopy').onclick=()=>{try{navigator.clipboard.writeText(json).then(()=>toast(T('Copied to clipboard','Скопировано')),()=>toast(T('Copy is not allowed here','Копирование недоступно'),'bad'))}catch(e){toast(T('Copy is not allowed here','Копирование недоступно'),'bad')}};
}

/* ---------- shell ---------- */
$$('.nav').forEach(b=>b.onclick=()=>go(b.dataset.view));
$$('.role').forEach(b=>b.onclick=()=>{$$('.role').forEach(r=>r.classList.toggle('on',r===b));S.role=b.dataset.role;$('#lEmail').value=S.role==='buyer'?'officer@cpo.gov.vl':'demo@northgate.vl'});
$('#loginBtn').onclick=()=>{const e=$('#lEmail').value.trim(),p=$('#lPass').value;let ok=true;
  $('#lEmailE').textContent=/^\S+@\S+\.\S+$/.test(e)?'':(ok=false,T('Enter a valid email','Введите корректный адрес'));
  $('#lPassE').textContent=p.length>=4?'':(ok=false,T('Enter the password','Введите пароль'));
  if(!ok)return;S.user=e;S.view=S.role==='buyer'?'eval':'dash';save();render();toast(T('Signed in as ','Вход выполнен: ')+esc(e))};
$('#roleP').onclick=()=>{S.role=S.role==='buyer'?'supplier':'buyer';save();render();toast(T('Role switched: ','Роль: ')+(S.role==='buyer'?T('Procurement officer','Закупщик'):T('Supplier','Поставщик')))};
$('#logout').onclick=()=>{S.user=null;save();render()};
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#reset').onclick=()=>{Object.keys(localStorage).filter(k=>k.startsWith(P)).forEach(k=>localStorage.removeItem(k));location.reload()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
PT.onLang(()=>{render();if($('#modal').classList.contains('on'))closeModal()});
$$('.role').forEach(r=>r.classList.toggle('on',r.dataset.role===S.role));
render();
})();
</script>
