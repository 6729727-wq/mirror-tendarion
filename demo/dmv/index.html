<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DriveDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:calc(100vh - 45px)}
.app[hidden],.login[hidden]{display:none}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:3px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px;line-height:1.2}
.brand b{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;font-size:17px;flex:none}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:2px}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.nav .cnt.r{background:var(--red);color:#fff}
.grow{flex:1}
.who{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:12.5px;display:flex;gap:10px;align-items:center;margin-top:8px}
.who .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 25%,transparent);color:var(--gold2);font-weight:800;flex:none}
.who b{display:block;font-size:13px}
.who span{color:var(--muted)}
.sidebtns{display:flex;gap:6px;margin-top:8px}
.sidebtns .btn{flex:1;justify-content:center}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.intro.hide{display:none}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.how>div>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold2);flex:none;font-size:13px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.card{min-width:0}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.card h3 .x{font-size:12px;color:var(--muted);font-weight:500}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fgrid .full{grid-column:1/-1}
.f{min-width:0}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f .err{font-size:11.5px;color:var(--red);margin-top:4px;display:none}
.f.bad .input{border-color:var(--red)} .f.bad .err{display:block}
select.input{appearance:auto}
textarea.input{resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.xs{padding:3px 9px;font-size:12px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.ok-t{color:var(--mal3)} .bad-t{color:var(--red)} .warn-t{color:var(--amber)} .gold-t{color:var(--gold2)} .blue-t{color:var(--blue)}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mal2),var(--mal3));transition:width .4s}
.prog.gold i{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.prog.red i{background:var(--red)} .prog.amber i{background:var(--amber)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;overflow-wrap:anywhere}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.grid2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
.stack>*+*{margin-top:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.opt{border:1px solid var(--line2);border-radius:14px;padding:12px;cursor:pointer;background:var(--bg2);text-align:left;width:100%}
.opt.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 10%,transparent)}
.opt b{display:block} .opt span{font-size:12.5px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;justify-content:space-between;background:none;border:0;padding:0;text-align:left;width:100%}
.sw i{width:36px;height:20px;border-radius:20px;background:var(--line2);position:relative;flex:none;transition:.2s}
.sw i:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.sw.on i{background:var(--mal)} .sw.on i:after{left:18px}
.steps{display:flex;margin:4px 0 18px}
.step{flex:1;text-align:center;position:relative;font-size:12px;color:var(--muted);min-width:0}
.step:before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--line2)}
.step:first-child:before{display:none}
.step .dot{width:32px;height:32px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line2);position:relative;z-index:1;font-weight:800}
.step.ok .dot{background:var(--mal);border-color:var(--mal);color:#fff}
.step.ok:before,.step.cur:before{background:var(--mal)}
.step.cur .dot{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 18%,transparent)}
.step span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal;min-width:180px}
tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td,tbody tr.sel td{background:color-mix(in srgb,var(--mal) 7%,transparent)}
.risk{display:inline-block;min-width:38px;text-align:center;font-family:var(--mono);font-weight:700;border-radius:8px;padding:2px 6px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;min-width:0}
.li:last-child{border-bottom:0}
.li>.grow{min-width:0}
.li small{display:block;color:var(--muted);font-size:12px}
.log{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:100px;max-height:240px;overflow:auto;overflow-wrap:anywhere}
.log div{padding:2px 0} .log .t{color:var(--dim)}
.alert{display:flex;gap:10px;align-items:flex-start;border:1px solid color-mix(in srgb,var(--red) 50%,transparent);background:color-mix(in srgb,var(--red) 10%,transparent);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.alert.warn{border-color:color-mix(in srgb,var(--amber) 50%,transparent);background:color-mix(in srgb,var(--amber) 10%,transparent)}
.alert.ok{border-color:color-mix(in srgb,var(--mal) 50%,transparent);background:color-mix(in srgb,var(--mal) 10%,transparent)}
.alert b{display:block}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13.5px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:340px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.modal{position:fixed;inset:0;z-index:2500;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);width:100%;max-width:560px;max-height:calc(100vh - 40px);overflow:auto;padding:20px;animation:fade .2s}
.modal .box h3{margin:0 0 14px;font-size:17px;display:flex;gap:8px;align-items:center}
.modal .box h3 .sp{flex:1}
.mclose{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted);padding:0 4px}
/* login */
.login{min-height:calc(100vh - 45px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.lg-hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--mal) 30%,transparent),transparent 60%),radial-gradient(90% 80% at 100% 100%,color-mix(in srgb,var(--gold) 22%,transparent),transparent 60%),var(--bg2);border-right:1px solid var(--line);padding:48px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.lg-hero .bigb{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:800;letter-spacing:-.02em}
.lg-hero .bigb b{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;font-size:26px}
.lg-hero h2{font-size:34px;line-height:1.15;margin:0;letter-spacing:-.02em;max-width:560px}
.lg-hero p{color:var(--muted);margin:0;max-width:520px}
.lg-feats{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px}
.lg-feats div{border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 70%,transparent);border-radius:12px;padding:10px 12px;font-size:13px}
.lg-feats div b{display:block;font-size:13.5px}
.lg-form{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.lg-form .card{width:100%;max-width:420px;padding:26px}
.lg-form h3{font-size:20px;margin:0 0 4px}
.lg-form .f{margin-top:12px}
.lg-demo{border:1px dashed var(--gold);border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:14px;color:var(--muted)}
.lg-demo b{color:var(--gold2)}
.lg-sec{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--dim);margin-top:14px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid2e,.split,.intro,.grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:270px;max-width:86vw;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
  .login{grid-template-columns:minmax(0,1fr)}
  .lg-hero{padding:28px 18px;border-right:0;border-bottom:1px solid var(--line)}
  .lg-hero h2{font-size:24px}
  .lg-form{padding:20px 14px 40px}
}
@media (max-width:560px){.how{grid-template-columns:1fr}.fgrid,.fgrid.c3,.opts,.lg-feats{grid-template-columns:1fr}.kpi .v{font-size:20px}.kpis{gap:10px}.card{padding:14px}.step span{font-size:10px}.lg-form .card{padding:18px}.modal .box{padding:16px}}
.btn.xs{padding:3px 10px;font-size:11.5px;min-height:28px}
#headx{min-width:0}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;border:1px solid var(--line2);color:var(--muted)}
.mt{margin-top:14px}

.ed{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;font-size:13px;margin-bottom:5px;border:1px solid var(--line)}
.ed>span:first-child{width:18px;text-align:center;font-weight:700}
.ed.ok{border-color:color-mix(in srgb,var(--mal) 35%,transparent);background:color-mix(in srgb,var(--mal) 7%,transparent)}
.ed.ok>span:first-child{color:var(--mal)}
.ed.no{border-color:color-mix(in srgb,var(--red) 40%,transparent);background:color-mix(in srgb,var(--red) 8%,transparent)}
.ed.no>span:first-child{color:var(--red)}
.ed .grow{flex:1;min-width:0}.ed small{color:var(--muted);font-size:11.5px}
.dl2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:13px;margin:0}
.dl2 dt{color:var(--muted)}.dl2 dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chk{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;margin:6px 0;cursor:pointer;font-weight:400;line-height:1.35}
.chk input{margin-top:2px;flex:none}
.steps{display:flex;gap:6px}
.steps .st{flex:1;display:flex;align-items:center;gap:7px;padding:8px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;color:var(--muted);min-width:0}
.steps .st b{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11.5px;background:color-mix(in srgb,var(--muted) 15%,transparent)}
.steps .st span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps .st.on{border-color:var(--blue);color:var(--text)}.steps .st.on b{background:var(--blue);color:#fff}
.steps .st.ok b{background:var(--mal);color:#fff}
.up{display:grid;gap:6px}
.upf{display:flex;align-items:center;gap:8px;border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;cursor:pointer;position:relative;overflow:hidden}
.upf:hover{border-color:var(--blue)}
.upf input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upf span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.tot td{border-top:2px solid var(--line)}
.done{text-align:center;padding:10px 0}.done .big{font-size:44px}.done .row{gap:8px;flex-wrap:wrap}
.dlc{border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#1d4e89,#2f7a6b);color:#fff;box-shadow:var(--shadow);max-width:380px}
.dlh{display:flex;gap:10px;align-items:center;padding:9px 14px;font-size:11px;letter-spacing:.12em;font-weight:700;background:rgba(0,0,0,.18)}
.dlh .star{margin-left:auto;color:#ffd166;font-size:16px}
.dlb{display:flex;gap:14px;padding:14px}
.dlb .ph{width:64px;height:78px;flex:none;border-radius:8px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:22px;font-weight:800}
.dlb .grow{min-width:0}.dlb b{display:block;font-size:15px;margin-bottom:3px}
.dlb small{display:block;font-size:11.5px;opacity:.9;font-family:var(--mono)}
.dlb small.don{color:#ffb4b4}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.veh .row{flex-wrap:wrap;gap:6px}
.plate{font-family:var(--mono);font-weight:800;padding:3px 9px;border:2px solid var(--text);border-radius:6px;letter-spacing:.06em;font-size:13px}
.sh{margin:0 0 10px}
.slots{border-collapse:separate;border-spacing:3px;min-width:640px;width:100%}
.slots th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;padding:3px}
.slots th small{font-weight:400}
.slots td{padding:0;text-align:center}
.sl{display:block;width:100%;padding:7px 0;border-radius:7px;font-size:11.5px;border:0;font-family:inherit}
.sl.fr{background:color-mix(in srgb,var(--mal) 16%,transparent);color:var(--mal);cursor:pointer;font-weight:700;transition:.3s}
.sl.fr:hover{background:var(--mal);color:#fff}
.sl.fr.gone{background:var(--red);color:#fff;transform:scale(.8);opacity:.3}
.sl.tk{background:color-mix(in srgb,var(--line) 60%,transparent);color:var(--muted)}
.sl.me{background:var(--blue);color:#fff;font-weight:700}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mal);font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:var(--mal);animation:dmvp 1.4s infinite}
@keyframes dmvp{50%{opacity:.25}}
.mdl{display:flex;justify-content:center}
.phone{width:100%;max-width:330px;border:10px solid #1b1f27;border-radius:34px;padding:16px 12px;background:var(--panel);display:grid;gap:14px}
.dlc.big2{max-width:none}
.qrw{text-align:center;display:grid;gap:6px;justify-items:center}
.qr{width:210px;max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.qrs{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px}
.qrs.ok{color:var(--mal);background:color-mix(in srgb,var(--mal) 12%,transparent)}
.qrs.bad{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.pay{font-family:var(--mono);font-size:12px;background:color-mix(in srgb,var(--muted) 10%,transparent);padding:10px;border-radius:10px;white-space:pre-wrap;word-break:break-all;margin:0}
.rq{border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:10px}
.rq .row{gap:6px;flex-wrap:wrap}
.li .btn.xs{margin-left:4px}
@media(max-width:600px){.steps .st span{display:none}.steps .st{justify-content:center}.dl2{grid-template-columns:1fr;gap:2px}.dl2 dd{margin-bottom:6px}}

</style>
</head>
<body data-demo-en="DriveDesk — Motor vehicles portal: licences, registration, road tests" data-demo-ru="DriveDesk — портал ГИБДД: права, регистрация, экзамены">
<div class="login" id="login" hidden></div>
<div class="app" id="app" hidden>
  <aside class="side" id="side"></aside>
  <main>
    <div class="head">
      <button class="btn sm menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div style="min-width:0"><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <div class="sp"></div>
      <div id="headx" class="row"></div>
      <button class="btn sm" id="showIntro" hidden title="How to try it">?</button>
    </div>
    <div class="intro" id="intro"></div>
    <section class="view on" id="view"></section>
  </main>
</div>
<div class="toasts" id="toasts"></div>
<div class="modal" id="modal"></div>
<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

function lineChart(o){/* o:{series:[{name,data:[...],color,dash,area}], labels:[...], w,h, yfmt, min,max, band:[y0,y1,color]} */

  let mn=o.min!=null?o.min:Math.min(...all),mx=o.max!=null?o.max:Math.max(...all);if(mx===mn)mx=mn+1;const pad=(mx-mn)*.08;if(o.min==null)mn-=pad;if(o.max==null)mx+=pad;
  const n=Math.max(...o.series.map(s=>s.data.length));const X=i=>pl+(n<2?0:i*(W-pl-pr)/(n-1)),Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);const yf=o.yfmt||(v=>fmtN(v));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  if(o.band){s+=`<rect x="${pl}" y="${Y(o.band[1])}" width="${W-pl-pr}" height="${Math.max(0,Y(o.band[0])-Y(o.band[1]))}" style="fill:${o.band[2]||'var(--mal)'};opacity:.1"/>`}
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" style="fill:var(--muted)">${yf(v)}</text>`}
  const step=Math.ceil(n/8);(o.labels||[]).forEach((l,i)=>{if(i%step===0||i===n-1)s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" style="fill:var(--muted)">${esc(l)}</text>`});
  (o.hlines||[]).forEach(h=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(h.v)}" y2="${Y(h.v)}" style="stroke:${h.color||'var(--red)'}" stroke-dasharray="5 4"/><text x="${W-pr}" y="${Y(h.v)-4}" text-anchor="end" font-size="10" font-weight="700" style="fill:${h.color||'var(--red)'}">${esc(h.label||'')}</text>`});
  o.series.forEach((se,k)=>{const col=se.color||C[k%C.length];const pts=se.data.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);if(!pts.length)return;const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
    if(se.area)s+=`<path d="${d}L${pts[pts.length-1][0]} ${H-pb}L${pts[0][0]} ${H-pb}Z" style="fill:${col};opacity:.14"/>`;
    s+=`<path d="${d}" fill="none" style="stroke:${col}" stroke-width="${se.width||2.2}" stroke-linejoin="round" stroke-linecap="round" ${se.dash?'stroke-dasharray="6 5"':''}/>`;
    if(se.dots!==false&&pts.length<=40)pts.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${se.dots===true?3.2:2.4}" style="fill:${col}"><title>${esc((o.labels||[])[i]||'')} · ${yf(se.data[i])}</title></circle>`})});
  return s+'</svg>'}
function barChart(o){/* o:{labels,series:[{name,data,color}],stacked,w,h,yfmt,hl:index} */
  const W=o.w||640,H=o.h||240,pl=46,pr=10,pt=16,pb=30;const n=o.labels.length;const sums=o.labels.map((_,i)=>o.stacked?o.series.reduce((a,s)=>a+(s.data[i]||0),0):Math.max(...o.series.map(s=>s.data[i]||0)));
  const mx=(o.max||Math.max(...sums,1))*1.08;const bw=(W-pl-pr)/n;const Y=v=>pt+(1-v/mx)*(H-pt-pb);const yf=o.yfmt||(v=>fmtN(v));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(let i=0;i<=4;i++){const v=mx*i/4,y=Y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" style="fill:var(--muted)">${yf(v)}</text>`}
  const step=Math.ceil(n/12);

function donut(parts,o){/* parts:[[label,value,color]] */o=o||{};const sz=o.size||140,r=sz/2-12,c=2*Math.PI*r;const tot=parts.reduce((a,p)=>a+p[1],0)||1;let off=0;
  let s=`<svg viewBox="0 0 ${sz} ${sz}" width="${sz}" height="${sz}" style="flex:none"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="16"/>`;

  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${s}${leg}</div>`}

const QR=(()=>{const N=33;
const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11d);z^=((y>>>i)&1)*x}return z&255};
const div=d=>{const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r};
const rem=(data,dv)=>{const r=new Array(dv.length).fill(0);data.forEach(b=>{const f=b^r.shift();r.push(0);dv.forEach((c,i)=>r[i]^=mul(c,f))});return r};

put(4,4);put(bytes.length,8);bytes.forEach(b=>put(b,8));const cap=80*8;put(0,Math.min(4,cap-bits.length));while(bits.length%8)bits.push(0);

const all=cw.concat(rem(cw,div(20)));
const M=[...Array(N)].map(()=>Array(N).fill(false)),F=[...Array(N)].map(()=>Array(N).fill(false));const set=(x,y,v)=>{M[y][x]=v;F[y][x]=true};
for(let i=0;i<N;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
[[3,3],[N-4,3],[3,N-4]].forEach(([cx,cy])=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const x=cx+dx,y=cy+dy;if(x<0||y<0||x>=N||y>=N)continue;const d=Math.max(Math.abs(dx),Math.abs(dy));set(x,y,d!==2&&d!==4)}});

for(let i=0;i<8;i++)set(N-1-i,8,g(i));for(let i=8;i<15;i++)set(8,N-15+i,g(i));set(8,N-8,true)};
fmt();let k=0;for(let right=N-1;right>=1;right-=2){if(right===6)right=5;for(let v=0;v<N;v++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?N-1-v:v;if(!F[y][x]&&k<all.length*8){M[y][x]=((all[k>>>3]>>>(7-(k&7)))&1)===1;k++}}}

    <div class="bigb"><b>${APP.icon}</b><div>${esc(APP.name)}<div style="font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0">${TT(APP.sub)}</div></div></div>
    <h2>${TT(lg.hero)}</h2><p>${TT(lg.heroP)}</p>
    <div class="lg-feats">${lg.feats.map(f=>`<div><b>${f[0]} ${T(f[1],f[2])}</b>${T(f[3],f[4])}</div>`).join('')}</div>
  </div>
  <div class="lg-form"><div class="card">
    <h3>${T('Sign in to','Вход в')} ${esc(APP.name)}</h3><div class="muted" style="font-size:13px">${TT(lg.tag)}</div>
    ${inp('lgU',T('User ID','Логин'),v.u,'','text','autocomplete="username"')}
    ${inp('lgP',T('Password','Пароль'),v.p,'','password','autocomplete="current-password"')}
    ${lg.roles?sel('lgR',T('Sign in as','Войти как'),lg.roles.map(r=>[r[0],r[1],r[2]]),v.r):''}
    <button class="btn pri" id="lgGo" style="width:100%;justify-content:center;margin-top:16px;padding:12px">${T('Sign in','Войти')} →</button>
    <div class="lg-demo">${T('<b>Demo access.</b> Credentials are prefilled — press <b>Sign in</b>. All data is synthetic and stays in this browser.','<b>Демо-доступ.</b> Логин и пароль уже введены — нажмите <b>Войти</b>. Все данные вымышленные и хранятся только в этом браузере.')}</div>
    <div class="lg-sec">🔒 <span>${TT(lg.secure||['Demo environment · MFA simulated · session in local storage','Демо-среда · MFA имитируется · сессия в локальном хранилище'])}</span></div>
  </div></div>`;
  const keep=()=>{lgVals={u:$('#lgU').value,p:$('#lgP').value,r:$('#lgR')?$('#lgR').value:v.r}};
  $$('input,select',L).forEach(i=>i.oninput=keep);
  const go2=()=>{keep();if(!validate([['lgU',x=>x.length>=3,['Enter your user ID','Введите логин']],['lgP',x=>x.length>=4,['Enter the password','Введите пароль']]],L))return;
    const role=lg.roles?lg.roles.find(r=>String(r[0])===String(lgVals.r)):null;
    S.user={id:lgVals.u,name:lg.name,role:role?[role[1],role[2]]:lg.role,rk:role?role[0]:null};
    if(APP.onLogin)APP.onLogin(role?role[0]:null);
    audit('Signed in as '+lgVals.u,'Вход: '+lgVals.u,'auth');save();
    toast(T('Welcome, ','Добро пожаловать, ')+esc(lg.name.split(' ')[0]),'ok');lgVals=null;rerender()};
  $('#lgGo').onclick=go2;$$('input',L).forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go2()});
}
function renderShell(){
  $('#login').hidden=true;$('#app').hidden=false;const u=S.user;
  const groups=APP.groups||[[null]];
  $('#side').innerHTML=`<div class="brand"><b>${APP.icon}</b><div>${esc(APP.name)}<small>${TT(APP.sub)}</small></div></div>
    ${groups.map(g=>`${g[0]!=null&&g[1]?`<div class="sec">${T(g[1],g[2])}</div>`:''}${APP.views.filter(v=>(v[4]||null)===g[0]&&(!APP.visible||APP.visible(v[0]))).map(v=>{const b=APP.badge?APP.badge(v[0]):null;return `<button class="nav ${S.view===v[0]?'on':''}" data-go="${v[0]}"><span class="ic">${v[1]}</span><span>${T(v[2],v[3])}</span>${b&&b[0]?`<span class="cnt ${b[1]?'r':''}">${b[0]}</span>`:''}</button>`}).join('')}`).join('')}
    <div class="grow"></div>
    ${APP.sideExtra?APP.sideExtra():''}
    <div class="who"><div class="av">${esc(u.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><div style="min-width:0"><b>${esc(u.name)}</b><span>${TT(u.role)}</span></div></div>
    <div class="sidebtns"><button class="btn sm" id="sOut">${T('Sign out','Выйти')}</button><button class="btn sm" id="sReset">${T('Reset demo','Сбросить демо')}</button></div>`;
  bind($('#side'),'go',id=>go(id));
  if(APP.bindSide)APP.bindSide($('#side'));
  $('#sOut').onclick=()=>{audit('Signed out','Выход','auth');S.user=null;save();closeModal();rerender()};
  $('#sReset').onclick=()=>{if(!confirmReset())return;try{Object.keys(localStorage).filter(k=>k.indexOf('pt_'+APP.slug+'_')===0).forEach(k=>localStorage.removeItem(k))}catch(e){}const u=S.user;S=fresh();S.user=u;if(APP.onLogin)APP.onLogin(u.rk);save();closeModal();rerender();toast(T('Demo data reset','Демо-данные сброшены'),'ok')};
  const cur=APP.views.find(v=>v[0]===S.view)||APP.views[0];
  const g=groups.find(x=>x[0]===(cur[4]||null));
  $('#crumb').innerHTML=esc(APP.name)+(g&&g[1]?' · '+T(g[1],g[2]):'');
  $('#title').innerHTML=T(cur[2],cur[3]);
  $('#headx').innerHTML=APP.head?APP.head():'';
  if(APP.bindHead)APP.bindHead($('#headx'));
  const I=$('#intro');
  if(S.intro){I.className='intro';I.innerHTML=`<div class="card"><h3><span>${T('How to try it','Как попробовать')}</span><span class="sp"></span><button class="btn xs" id="introX">${T('Hide','Скрыть')}</button></h3><div class="how">${APP.how.map((h,i)=>`<div><b>${i+1}</b><span>${TT(h)}</span></div>`).join('')}</div></div>
    <div class="card"><dl class="facts">${APP.facts.map(f=>`<dt>${T(f[0],f[1])}</dt><dd>${f.length>3?T(f[2],f[3]):f[2]}</dd>`).join('')}</dl></div>`;
    $('#introX').onclick=()=>{S.intro=false;save();renderShell()}}
  else{I.className='intro hide';I.innerHTML=''}
  $('#showIntro').hidden=S.intro;
}
let confirmReset=()=>true;
function renderView(){
  if(!APP.views.find(v=>v[0]===S.view))S.view=APP.views[0][0];
  const el=$('#view');el.className='view on';el.dataset.v=S.view;
  if(APP.leave)APP.leave();
  try{APP.R[S.view](el)}catch(e){console.error(e);el.innerHTML='<div class="card">'+esc(e.message)+'</div>'}
}
$('#menuBtn').onclick=e=>{e.stopPropagation();$('#side').classList.toggle('open')};
$('#showIntro').onclick=()=>{S.intro=true;save();renderShell()};
document.addEventListener('click',e=>{const s=$('#side');if(s&&s.classList.contains('open')&&!s.contains(e.target)&&e.target.id!=='menuBtn')s.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
let booted=false;
PT.onLang(()=>{booted=true;rerender()});
if(document.readyState!=='loading')setTimeout(()=>{if(!booted)rerender()},0);

})();
</script>
