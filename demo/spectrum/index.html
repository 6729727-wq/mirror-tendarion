<style>

.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}

.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}

.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}

.nav .cnt.r{background:var(--red);color:#fff}
.grow{flex:1}
.who{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:13px;display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal),var(--mal2));color:#fff;font-weight:800;font-size:13px;flex:none}

.head h1{font-size:24px;margin:0;letter-spacing:-.01em}

.crumb{font-size:12px;color:var(--dim)}

.view{display:none}.view.on{display:block;animation:fade .2s}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}

const radius=l=>Math.max(8,Math.min(140,(3.57*Math.sqrt(l.h)+11.3)*(0.6+Math.log10(Math.max(1,l.p))/5)));
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const pos=l=>{const c=CITIES[l.site];return[c[1],c[2]]};
const ovl=(a,b)=>Math.abs(a.f-b.f)<(a.bw+b.bw)/2;
function conflicts(){const L=S.lic.filter(l=>l.site&&l.st!=='rejected'),out=[];
  for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const a=L[i],b=L[j];if(!ovl(a,b))continue;const d=dist(pos(a),pos(b)),r=radius(a)+radius(b);if(d<r)out.push({a,b,d,sev:(r-d)/r})}
  return out}
function pathLoss(dkm,f){const d=Math.max(.5,dkm);return 32.44+20*Math.log10(f)+20*Math.log10(d)+(d>1?15*Math.log10(d):0)}
function probeCalc(){const p=S.probe,pr={f:p.f,bw:p.f<200?.2:p.f<1000?.0125:10};
  return S.lic.filter(l=>l.site&&l.st!=='rejected').map(l=>{const off=Math.abs(l.f-pr.f),half=(l.bw+pr.bw)/2;const acl=off<half?0:off<half*3?30:off<half*8?55:null;if(acl===null)return null;
    const d=dist([p.x,p.y],pos(l));const I=10*Math.log10(p.p)+30+6-pathLoss(d,p.f)-acl;const N=-174+10*Math.log10(l.bw*1e6)+5;const IN=I-N;
    return{l,d,I,IN,acl}}).filter(Boolean).sort((a,b)=>b.IN-a.IN)}

function drawMap(cf){
  const W=600,H=420,p=S.probe,vis=l=>l.site&&l.st!=='rejected'&&(S.mapSvc==='all'||l.svc===S.mapSvc);
  let s=`<svg viewBox="0 0 ${W} ${H}" id="mapS">`;
  for(let g=50;g<W;g+=50)s+=`<line x1="${g}" x2="${g}" y1="0" y2="${H}" stroke="${cssv('--line')}" opacity=".5"/>`;
  for(let g=50;g<H;g+=50)s+=`<line x1="0" x2="${W}" y1="${g}" y2="${g}" stroke="${cssv('--line')}" opacity=".5"/>`;
  s+=`<path d="M40,120 L120,50 L260,40 L360,30 L470,60 L560,140 L575,250 L520,340 L420,395 L300,400 L190,370 L90,330 L35,240 Z" fill="${cssv('--panel')}" stroke="${cssv('--line2')}" stroke-width="2"/>`;
  s+=`<path d="M60,250 Q200,230 300,215 T560,200" fill="none" stroke="${cssv('--blue')}" stroke-width="2" opacity=".45"/>`;
  S.lic.filter(vis).forEach(l=>{const[x,y]=pos(l),r=radius(l),c=SV[l.svc][2];s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" fill-opacity=".13" stroke="${c}" stroke-width="1.4" ${l.st==='pending'?'stroke-dasharray="5 4"':''}/>`});
  cf.filter(c=>vis(c.a)&&vis(c.b)).forEach(c=>{const a=pos(c.a),b=pos(c.b);s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${cssv('--red')}" stroke-width="2.5" stroke-dasharray="6 4"/><text x="${(a[0]+b[0])/2}" y="${(a[1]+b[1])/2-6}" text-anchor="middle" font-size="11" font-weight="700" fill="${cssv('--red')}">⚠ ${fq(c.a.f)}</text>`});
  Object.values(CITIES).forEach(c=>{s+=`<circle cx="${c[1]}" cy="${c[2]}" r="4" fill="${cssv('--text')}"/><text x="${c[1]+7}" y="${c[2]+14}" font-size="11.5" font-weight="600" fill="${cssv('--text')}">${c[0]}</text>`});
  if(p.on){const pr={f:p.f,h:p.h,p:p.p},r=radius(pr);s+=`<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${cssv('--gold')}" fill-opacity=".12" stroke="${cssv('--gold')}" stroke-width="2" stroke-dasharray="3 3"/><path d="M${p.x},${p.y-9} L${p.x+8},${p.y} L${p.x},${p.y+9} L${p.x-8},${p.y} Z" fill="${cssv('--gold')}" stroke="${cssv('--bg')}" stroke-width="1.5"/>`}
  s+=`<g transform="translate(18,${H-22})"><line x1="0" x2="100" y1="0" y2="0" stroke="${cssv('--text')}" stroke-width="2"/><text x="50" y="-5" text-anchor="middle" font-size="10" fill="${cssv('--muted')}">100 km</text></g></svg>`;
  $('#mSvg').innerHTML=s;
  $('#mapS').addEventListener('click',e=>{const svg=$('#mapS'),r=svg.getBoundingClientRect();p.x=Math.round((e.clientX-r.left)/r.width*W);p.y=Math.round((e.clientY-r.top)/r.height*H);save();rMap();toast(T('Test transmitter moved','Передатчик перемещён'))});
}

function checks(l){
  const out=[];const bs=bandOf(l.f);const okB=bs.some(b=>b.s===l.svc||(l.svc==='mob'&&b.s==='mar'&&false));
  if(bs.some(b=>b.s==='ast'))out.push(['bad',T('Radio astronomy band — emissions prohibited','Полоса радиоастрономии — излучения запрещены')]);
  else if(okB)out.push(['ok',T('Frequency is in a band allocated to ','Частота в полосе, отведённой для ')+T(SV[l.svc][0],SV[l.svc][1])]);
  else out.push(['bad',T('Not allocated to this service: ','Не отведено этой службе: ')+(bs.map(b=>T(b.en,b.ru)).join(', ')||T('unallocated','не распределено'))]);
  if(l.site){const c=S.lic.filter(o=>o!==l&&o.site&&o.st!=='rejected'&&ovl(o,l)&&dist(pos(o),pos(l))<radius(o)+radius(l));
    out.push(c.length?['bad',T('Co-channel conflict with ','Конфликт в канале с ')+c.map(o=>o.id+' ('+CITIES[o.site][0]+')').join(', ')]:['ok',T('No co-channel overlap · service radius ','Нет пересечений · радиус ')+nf(radius(l))+' km']);}
  else{const c=S.lic.filter(o=>o!==l&&!o.site&&o.st!=='rejected'&&ovl(o,l));out.push(c.length?['bad',T('Block already assigned to ','Блок уже назначен: ')+c.map(o=>OPS[o.op]).join(', ')]:['ok',T('National block is free','Национальный блок свободен')])}
  if(l.svc==='imt'&&l.cov!=='nat')out.push(['warn',T('IMT blocks are normally national','Блоки IMT обычно национальные')]);
  if(l.p>50000)out.push(['warn',T('Power above 50 kW requires a site inspection','Мощность выше 50 кВт — нужна инспекция')]);
  return out;
}

/* ---------- AUCTION ---------- */
const BID=[['NovaTel',14,.32,10],['Volt Mobile',12,.27,8],['Aurora Net',10,.3,6],['Kestrel Wireless',7,.45,0]];
const AUC=(()=>{const R=[];let r=0;while(r<60){const p=2e6*Math.pow(1.06,r);const d=BID.map(b=>Math.max(b[3],Math.floor(b[1]-b[2]*r)));const sum=d.reduce((a,b)=>a+b,0);R.push({r:r+1,p,d,sum});if(sum<=30)break;r++}return R})();
function rAuc(){
  const el=$('#v-auc'),n=AUC.length,ri=Math.min(n,S.aucR)-1,cur=AUC[ri],fin=AUC[n-1];
  let lo=3410;const win=BID.map((b,i)=>{const k=fin.d[i];const rng=k?[lo,lo+k*10]:null;if(k)lo+=k*10;return{n:b[0],k,rng,pay:k*fin.p}});
  const total=win.reduce((a,w)=>a+w.pay,0);const C=[cssv('--mal'),cssv('--gold'),cssv('--blue'),cssv('--violet')];
  el.innerHTML=`<div class="kpis"><div class="card kpi"><div class="l">${T('3.5 GHz auction proceeds','Выручка аукциона 3,5 ГГц')}</div><div class="v">${mM(total)}</div><div class="d">${T('closed 20 Nov 2025','завершён 20 нояб. 2025')}</div></div><div class="card kpi"><div class="l">${T('Clock rounds','Раундов')}</div><div class="v">${n}</div><div class="d">+6% ${T('per round','за раунд')}</div></div><div class="card kpi"><div class="l">${T('Final price per block','Цена блока')}</div><div class="v">${mM(fin.p)}</div><div class="d">10 MHz · ${T('reserve','старт')} V$ 2M</div></div><div class="card kpi"><div class="l">${T('Blocks sold','Продано блоков')}</div><div class="v">${fin.sum}/30</div><div class="d">3410–3710 MHz</div></div></div>
  <div class="grid2"><div class="card chart"><h3>${T('Clock auction replay','Повтор аукциона по раундам')}<span class="sp"></span><button class="btn sm" id="aPlay">▶ ${T('Replay','Повторить')}</button></h3>
    <input type="range" id="aR" min="1" max="${n}" value="${ri+1}"><div class="row muted" style="font-size:12.5px;margin:4px 0 10px;justify-content:space-between"><span>${T('Round','Раунд')} <b class="mono" style="color:var(--text)">${cur.r}</b> / ${n}</span><span>${T('Price','Цена')} <b class="mono" style="color:var(--text)">${mM(cur.p)}</b></span><span>${T('Demand','Спрос')} <b class="mono" style="color:${cur.sum>30?'var(--amber)':'var(--mal3)'}">${cur.sum}</b> / 30</span></div>
    ${aucChart(ri,C)}<div class="legend" style="margin-top:6px">${BID.map((b,i)=>`<span><i style="background:${C[i]}"></i>${b[0]} · ${cur.d[i]}</span>`).join('')}<span><i style="background:${cssv('--red')}"></i>${T('Supply 30','Предложение 30')}</span></div></div>
  <div class="card"><h3>${T('Assignment & payments','Назначение и платежи')}</h3>${spectrumBar(win,C)}<div class="tw" style="margin-top:12px"><table><thead><tr><th>${T('Winner','Победитель')}</th><th>${T('Blocks','Блоков')}</th><th>${T('Range','Полоса')}</th><th>${T('Pays','Оплата')}</th></tr></thead><tbody>${win.map((w,i)=>`<tr><td><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${C[i]};margin-right:6px"></i>${w.n}</td><td class="mono">${w.k}</td><td class="mono">${w.rng?w.rng[0]+'–'+w.rng[1]:T('withdrew','вышел')}</td><td class="mono">${w.k?mM(w.pay):'—'}</td></tr>`).join('')}</tbody></table></div></div></div>
  <div class="card" style="margin-top:14px"><h3>${T('Other awards','Другие распределения')}</h3><div class="tw"><table><thead><tr><th>${T('Auction','Аукцион')}</th><th>${T('Band','Полоса')}</th><th>${T('Lots','Лотов')}</th><th>${T('Reserve','Старт')}</th><th>${T('Result','Итог')}</th><th>${T('Status','Статус')}</th></tr></thead><tbody>
   <tr><td>2026-mmW</td><td class="mono">24.25–27.5 GHz</td><td class="mono">8 × 400 MHz</td><td class="mono">V$ 3.0M</td><td class="mono">V$ 31.6M</td><td><span class="pill ok">${T('Completed','Завершён')}</span></td></tr>
   <tr><td>2024-700</td><td class="mono">703–733 / 758–788 MHz</td><td class="mono">6 × 2×5 MHz</td><td class="mono">V$ 12M</td><td class="mono">V$ 118M</td><td><span class="pill ok">${T('Completed','Завершён')}</span></td></tr>
   <tr><td>2027-L</td><td class="mono">1427–1518 MHz</td><td class="mono">9 × 10 MHz</td><td class="mono">V$ 4.5M</td><td>—</td><td><span class="pill warn">${T('Consultation','Консультации')}</span></td></tr></tbody></table></div></div>`;
  $('#aR').oninput=e=>{S.aucR=+e.target.value;save();rAuc()};
  $('#aPlay').onclick=()=>{let k=1;clearInterval(window.__auc);window.__auc=setInterval(()=>{if(S.view!=='auc'||k>n){clearInterval(window.__auc);return}S.aucR=k++;rAuc()},180)};
}
function aucChart(ri,C){
  const W=520,H=210,p={l:30,r:46,t:10,b:24},n=AUC.length;const bw=(W-p.l-p.r)/n;const ymax=45;const y=v=>p.t+(1-v/ymax)*(H-p.t-p.b);
  const pmax=AUC[n-1].p;const yp=v=>p.t+(1-v/(pmax*1.1))*(H-p.t-p.b);
  let s=`<svg viewBox="0 0 ${W} ${H}">`;[0,15,30,45].forEach(g=>s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(g)}" y2="${y(g)}" stroke="${cssv('--line')}"/><text x="${p.l-5}" y="${y(g)+4}" text-anchor="end" font-size="10" fill="${cssv('--dim')}">${g}</text>`);
  AUC.forEach((a,i)=>{let acc=0;a.d.forEach((d,k)=>{s+=`<rect x="${p.l+i*bw+1}" y="${y(acc+d)}" width="${bw-2}" height="${y(acc)-y(acc+d)}" fill="${C[k]}" opacity="${i<=ri?.9:.2}"/>`;acc+=d})});
  s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(30)}" y2="${y(30)}" stroke="${cssv('--red')}" stroke-width="2" stroke-dasharray="5 4"/>`;
  s+=`<path d="${AUC.map((a,i)=>(i?'L':'M')+(p.l+i*bw+bw/2).toFixed(1)+','+yp(a.p).toFixed(1)).join('')}" fill="none" stroke="${cssv('--text')}" stroke-width="2"/>`;
  s+=`<circle cx="${p.l+ri*bw+bw/2}" cy="${yp(AUC[ri].p)}" r="4.5" fill="${cssv('--gold')}" stroke="${cssv('--bg')}" stroke-width="2"/>`;
  s+=`<text x="${W-p.r+4}" y="${yp(pmax)+4}" font-size="10" fill="${cssv('--muted')}">${mM(pmax)}</text>`;
  [1,Math.ceil(n/2),n].forEach(r=>s+=`<text x="${p.l+(r-1)*bw+bw/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="${cssv('--dim')}">R${r}</text>`);
  return s+'</svg>';
}
function spectrumBar(win,C){const W=420,x=f=>20+(f-3400)/400*(W-40);let s=`<svg viewBox="0 0 ${W} 64" style="width:100%;height:auto"><rect x="${x(3400)}" y="10" width="${x(3800)-x(3400)}" height="26" rx="4" fill="${cssv('--line')}"/>`;
  win.forEach((w,i)=>{if(!w.rng)return;s+=`<rect x="${x(w.rng[0])}" y="10" width="${x(w.rng[1])-x(w.rng[0])}" height="26" fill="${C[i]}"/><text x="${(x(w.rng[0])+x(w.rng[1]))/2}" y="28" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${w.k*10}</text>`});
  [3400,3500,3600,3700,3800].forEach(f=>s+=`<text x="${x(f)}" y="54" text-anchor="middle" font-size="10" fill="${cssv('--dim')}">${f}</text>`);return s+'</svg>'}

/* ---------- FEES ---------- */
const IST={paid:['Paid','Оплачен','ok'],open:['Open','К оплате','warn'],overdue:['Overdue','Просрочен','bad']};
function rFees(){
  const el=$('#v-fees'),c=S.fee,fe=feeOf({...c,p:0,h:0});const f=S.invF;const ls=S.inv.filter(i=>f==='all'||i.st===f);
  const col=S.inv.filter(i=>i.st==='paid').reduce((a,i)=>a+i.amt,0),out=S.inv.filter(i=>i.st!=='paid').reduce((a,i)=>a+i.amt,0);
  el.innerHTML=`<div class="kpis"><div class="card kpi"><div class="l">${T('Collected 2026','Собрано в 2026')}</div><div class="v">${mM(col)}</div><div class="d">${S.inv.filter(i=>i.st==='paid').length} ${T('invoices','счетов')}</div></div><div class="card kpi"><div class="l">${T('Outstanding','К оплате')}</div><div class="v">${mM(out)}</div><div class="d">${S.inv.filter(i=>i.st!=='paid').length} ${T('invoices','счетов')}</div></div><div class="card kpi"><div class="l">${T('Overdue','Просрочено')}</div><div class="v" style="color:var(--red)">${S.inv.filter(i=>i.st==='overdue').length}</div><div class="d">${T('2% monthly penalty','пеня 2% в месяц')}</div></div><div class="card kpi"><div class="l">${T('Auction instalments','Рассрочка аукциона')}</div><div class="v">${mM(41.2e6)}</div><div class="d">${T('next due 20 Nov','след. 20 нояб.')}</div></div></div>
  <div class="grid2"><div class="card"><h3>${T('Invoices','Счета')}<span class="sp"></span><span class="chips">${['all','open','overdue','paid'].map(k=>`<button class="chip ${f===k?'on':''}" data-if="${k}">${k==='all'?T('All','Все'):T(IST[k][0],IST[k][1])}</button>`).join('')}</span></h3>
   <div class="tw"><table><thead><tr><th>${T('Invoice','Счёт')}</th><th>${T('Licence','Лицензия')}</th><th>${T('Type','Тип')}</th><th>${T('Amount','Сумма')}</th><th>${T('Due','Срок')}</th><th>${T('Status','Статус')}</th><th></th></tr></thead><tbody>${ls.map(i=>`<tr><td class="mono">${i.id}</td><td class="mono">${i.lic}</td><td>${i.kind==='app'?T('Application','Заявка'):T('Annual','Ежегодный')}</td><td class="mono">${money(i.amt*(i.st==='overdue'?1.02:1))}</td><td>${fmtD(i.due)}</td><td><span class="pill ${IST[i.st][2]}">${T(IST[i.st][0],IST[i.st][1])}</span></td><td>${i.st!=='paid'?(S.role==='op'?`<button class="btn sm pri" data-pay="${i.id}">${T('Pay','Оплатить')}</button>`:`<button class="btn sm" data-rem="${i.id}">${T('Remind','Напомнить')}</button> <button class="btn sm" data-pay="${i.id}">${T('Mark paid','Отметить')}</button>`):''}</td></tr>`).join('')||`<tr><td colspan="7" class="muted">${T('Nothing here','Пусто')}</td></tr>`}</tbody></table></div>
   <div class="chart" style="margin-top:14px"><h3 style="font-size:14px">${T('Fee revenue by quarter, V$ M','Сборы по кварталам, V$ млн')}</h3>${revChart()}</div></div>
  <div class="card"><h3>${T('Fee calculator','Калькулятор сборов')}</h3><div class="fgrid">
    <div class="f"><label>${T('Service','Служба')}</label><select class="input" id="cS">${['imt','mob','bc','fix'].map(k=>`<option value="${k}" ${c.svc===k?'selected':''}>${T(SV[k][0],SV[k][1])}</option>`).join('')}</select></div>
    <div class="f"><label>${T('Frequency, MHz','Частота, МГц')}</label><input class="input mono" id="cF" type="number" value="${c.f}"></div>
    <div class="f"><label>${T('Bandwidth, MHz','Полоса, МГц')}</label><input class="input mono" id="cB" type="number" value="${c.bw}"></div>
    <div class="f"><label>${T('Coverage','Покрытие')}</label><select class="input" id="cC">${Object.keys(COV).map(k=>`<option value="${k}" ${c.cov===k?'selected':''}>${T(COV[k][1],COV[k][2])}</option>`).join('')}</select></div>
    <div class="f full"><label>${T('Term','Срок')}: <b id="cYv">${c.yrs} ${T('years','лет')}</b></label><input type="range" id="cY" min="1" max="20" value="${c.yrs}"></div>
    <div class="f full"><label class="row" style="cursor:pointer;color:var(--text)"><input type="checkbox" id="cR" ${c.rural?'checked':''}> ${T('Rural coverage discount −25%','Скидка за покрытие села −25%')}</label></div></div>
   <div style="margin-top:12px"><div class="fee"><span>${T('Price per MHz per year','Цена МГц в год')}</span><b class="mono">${c.svc==='fix'?'—':money(PRICE(c.f))}</b></div><div class="fee"><span>${T('Coverage factor','Коэфф. покрытия')}</span><b class="mono">× ${COV[c.cov][0]}</b></div><div class="fee"><span>${T('Annual fee','Сбор в год')}</span><b class="mono">${money(fe.ann)}</b></div><div class="fee tot"><span>${T('Total for term','Итого за срок')}</span><span class="mono">${money(fe.tot)}</span></div></div>
   <p class="muted" style="font-size:11.5px;margin:6px 0 0">${T('Formula: price(band) × MHz × coverage × years; fixed links: V$ 1,200 + 40 × MHz per link.','Формула: цена(полоса) × МГц × покрытие × годы; РРЛ: V$ 1 200 + 40 × МГц за пролёт.')}</p></div></div>`;
  $$('[data-if]').forEach(b=>b.onclick=()=>{S.invF=b.dataset.if;save();rFees()});
  $$('[data-pay]').forEach(b=>b.onclick=()=>{const i=S.inv.find(x=>x.id===b.dataset.pay);i.st='paid';save();rFees();nav();toast(T('Payment received for ','Оплата получена: ')+i.id+' · '+T('receipt emailed','квитанция отправлена'),'gold')});
  $$('[data-rem]').forEach(b=>b.onclick=()=>toast(T('Reminder sent for ','Напоминание по ')+b.dataset.rem));
  const rd=()=>{c.svc=$('#cS').value;c.f=Math.max(30,+$('#cF').value||30);c.bw=Math.max(.0125,+$('#cB').value||1);c.cov=$('#cC').value;c.yrs=+$('#cY').value;c.rural=$('#cR').checked;save();rFees()};
  ['#cS','#cF','#cB','#cC','#cY','#cR'].forEach(s=>$(s).addEventListener('change',rd));
  $('#cY').oninput=e=>{$('#cYv').textContent=e.target.value+' '+T('years','лет')};
}
function revChart(){const q=[['Q1 25',18.2],['Q2 25',19.1],['Q3 25',18.7],['Q4 25',61.4],['Q1 26',21.3],['Q2 26',22.0],['Q3 26',22.6],['Q4 26',24.9]];
  const W=460,H=170,mx=70,bw=(W-40)/q.length;let s=`<svg viewBox="0 0 ${W} ${H}">`;
  q.forEach((d,i)=>{const h=d[1]/mx*(H-40);s+=`<rect x="${30+i*bw+6}" y="${H-22-h}" width="${bw-12}" height="${h}" rx="4" fill="${i===3?cssv('--gold'):cssv('--mal')}" opacity="${i===7?.55:1}"/><text x="${30+i*bw+bw/2}" y="${H-26-h}" text-anchor="middle" font-size="10" font-weight="700" fill="${cssv('--text')}">${d[1]}</text><text x="${30+i*bw+bw/2}" y="${H-7}" text-anchor="middle" font-size="9.5" fill="${cssv('--dim')}">${d[0]}</text>`});
  return s+`</svg><p class="muted" style="font-size:11.5px;margin:4px 0 0">${T('Q4 2025 includes the first 3.5 GHz auction instalment; Q4 2026 is a forecast.','Q4 2025 — первый платёж аукциона 3,5 ГГц; Q4 2026 — прогноз.')}</p>`}

$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#reset').onclick=()=>{store.clear();const u=S.user,r=S.role;S=seed();S.user=u;S.role=r;save();render();toast(T('Demo reset','Демо сброшено'))};
$('#logout').onclick=()=>{S.user=null;save();lrole=S.role;render();toast(T('Signed out','Вы вышли'))};
PT.onLang(()=>render());
render();
})();
</script>
