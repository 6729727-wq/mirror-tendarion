<div class="kpis">${kpi(['Cameras online','Камер в сети'],'312 / 318',['98.1%','98,1%'],'ok-t')}${kpi(['IoT sensors reporting','Датчиков на связи'],'4,806 / 4,920',['97.7%','97,7%'],'ok-t')}${kpi(['Citizen reports today','Обращений сегодня'],148+S.alerts.filter(a=>a.src==='citizen').length,['82% answered < 1 h','82% ответ < 1 ч'])}${kpi(['Alerts → incidents','Тревоги → происшествия'],Math.round(100*S.alerts.filter(a=>a.st==='inc').length/Math.max(1,S.alerts.filter(a=>a.st!=='new').length))+'%',['of handled alerts','от обработанных'])}</div>
<div class="card"><h3>${T('Traffic index by hour','Индекс трафика по часам')}</h3>${lineChart([{pts:typ,c:'--line2',dash:1},{pts:tod,c:'--gold'}],lab,{w:900,h:190,area:1,max:110,fmt:v=>Math.round(v)+'%'})}${legend([{l:T('Today','Сегодня'),c:'--gold'},{l:T('Typical weekday','Обычный будний день'),c:'--line2'}])}</div>
<div class="grid2 mt"><div class="card"><h3>${T('Grid load vs renewables, MW','Нагрузка и ВИЭ, МВт')}</h3>${lineChart([{pts:load,c:'--amber'},{pts:ren,c:'--mal'}],lab,{h:180,area:1,fmt:v=>Math.round(v)})}${legend([{l:T('Demand','Потребление'),c:'--amber'},{l:T('Solar + wind','Солнце + ветер'),c:'--mal'}])}</div>
<div class="card"><h3>${T('Incidents this month','Происшествия за месяц')}</h3><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${donut(Object.entries(hist).map(([k,v],n)=>({l:L(TY[k].n),v,c:['--blue','--gold','--violet','--red','--amber','--mal','--muted','--dim'][n]})),{size:150,center:String(Object.values(hist).reduce((a,b)=>a+b,0)),sub:T('total','всего')}).replace('<svg','<svg width="150" height="150"')}<div style="flex:1;min-width:150px">${legend(Object.entries(hist).map(([k,v],n)=>({l:TY[k].ic+' '+L(TY[k].n),v,c:['--blue','--gold','--violet','--red','--amber','--mal','--muted','--dim'][n]})))}</div></div></div></div>
<div class="grid2 mt"><div class="card"><h3>${T('Air quality by district (AQI)','Качество воздуха по районам (AQI)')}</h3>${barChart(aqs,{h:160,w:440,max:200})}</div>
<div class="card"><h3>${T('Response time by service, min','Время прибытия по службам, мин')}</h3>${Object.entries(S.resp).map(([k,v])=>hbar(L(AG[k].n),v,35,fmtN(v,1),AG[k].c)).join('')}<p class="hint">${T('Median, last 30 days. Target: emergency ≤ 10 min, utilities ≤ 30 min.','Медиана за 30 дней. Цель: экстренные ≤ 10 мин, коммунальные ≤ 30 мин.')}</p><button class="btn mt" id="rpt">⬇ ${T('Export KPI report (CSV)','Выгрузить отчёт (CSV)')}</button></div></div>`;
$('#rpt',el).onclick=()=>{const rows=['hour,traffic_typical,traffic_today,load_mw,renewables_mw'].concat(lab.map((l,x)=>[l,typ[x],tod[x]??'',load[x],ren[x]].join(',')));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download='urban-pulse-kpi.csv';a.click();toast(T('Report exported','Отчёт выгружен'))}}};
APP.loginArt=`<svg class="bg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><rect width="400" height="300" style="fill:var(--gold);opacity:.05"/>${[[40,140,40,160],[90,100,36,200],[135,170,30,130],[175,70,44,230],[230,120,34,180],[275,150,40,150],[325,90,38,210]].map(([x,y,w,h])=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" style="fill:var(--text)" opacity=".12"/>`).join('')}<path d="M0 230 C 100 200, 200 260, 400 210" fill="none" style="stroke:var(--gold)" stroke-width="3"/>${[[60,212],[160,226],[250,232],[340,214]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5" style="fill:var(--mal)"/>`).join('')}</svg>`;

APP.slug=ROW.slug;APP.name=APP.name||ROW.name;
APP.facts=Object.assign({tender:ROW.title,yb:ROW.year+' · '+ROW.budget,client:[ROW.client[0]+', '+(APP.country||['Republic of Nordania','Республика Нордания'])[0]+' (fictional)',ROW.client[1]+', '+(APP.country||['Republic of Nordania','Республика Нордания'])[1]+' (вымышл.)'],stack:ROW.stack},APP.facts||{});
K.start(APP);
})();
</script>
