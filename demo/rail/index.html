const MIN=6e4;

function trains(day){const out=[];Object.entries(LN).forEach(([lk,l],li)=>[0,1].forEach(dir=>{const st=dir?l.st.slice().reverse():l.st.slice();const off=[0];for(let i=1;i<st.length;i++)off.push(off[i-1]+Math.round(km(st[i-1],st[i])/1.7)+2);
for(let k=0;k<l.cnt;k++)out.push({id:`${l.n} ${(li+1)*100+dir*50+k+1}`,lk,dir,st,off,dep:day+(l.first+k*l.every+dir*22)*MIN})}));return out}
const dayOf=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const today=()=>dayOf(Date.now());
const isToday=t=>dayOf(t)===today();
const dly=(S,tr)=>isToday(tr.dep)?(S.dly[tr.id]||0):0;
const cxd=(S,tr)=>isToday(tr.dep)&&S.cx.includes(tr.id);
const atSt=(tr,s)=>tr.dep+tr.off[tr.st.indexOf(s)]*MIN;
const platOf=(S,tr)=>S.plat[tr.id]||PLAT[tr.lk][tr.dir];
const findTr=(id,t)=>trains(dayOf(t)).find(x=>x.id===id);

const direct=(a,b,after)=>all.filter(tr=>{const i=tr.st.indexOf(a),j=tr.st.indexOf(b);return i>=0&&j>i&&atSt(tr,a)>=after&&!cxd(S,tr)}).sort((x,y)=>atSt(x,a)-atSt(y,a));

if(same)direct(f,t,from).slice(0,5).forEach(tr=>res.push([{tr,f,t}]));
else direct(f,'EC',from).slice(0,5).forEach(tr=>{const arr=atSt(tr,'EC')+dly(S,tr)*MIN;const n=direct('EC',t,arr+6*MIN)[0];if(n)res.push([{tr,f,t:'EC'},{tr:n,f:'EC',t}])});
return res}
const legKm=l=>{let s=0;for(let i=l.tr.st.indexOf(l.f);i<l.tr.st.indexOf(l.t);i++)s+=km(l.tr.st[i],l.tr.st[i+1]);return s};

const noteTxt=n=>n.txt?L(n.txt):T(`${n.trs.join(', ')}: ${CAUSE[n.c][0].toLowerCase()} — expect delays.`,`${n.trs.join(', ')}: ${CAUSE[n.c][1].toLowerCase()} — возможны задержки.`);
APP.views.notices={ic:'📣',t:['Service notices','Уведомления'],badge:S=>S.notes.filter(n=>n.on&&n.trs.some(id=>S.tix.some(t=>t.st==='valid'&&t.legs.some(l=>l.id===id&&isToday(l.dep))))).length,render(el,S){const mine=new Set(S.tix.filter(t=>t.st==='valid').flatMap(t=>t.legs.filter(l=>isToday(l.dep)).map(l=>l.id)));const list=S.notes.slice().reverse();
el.innerHTML=`<div class="card"><h3>${T('SIRI situation exchange','Ситуации SIRI-SX')} <span class="dot pulse"></span></h3>${list.length?`<div class="list">${list.map(n=>`<div class="it" style="${n.on?'':'opacity:.55'}"><span class="pill ${n.sev==='bad'?'bad':n.sev==='warn'?'warn':'blue'}">${n.sev==='info'?T('Planned','Плановое'):T('Disruption','Сбой')}</span><div class="grow"><b>${L(CAUSE[n.c])}</b><span>${esc(noteTxt(n))}</span><span class="hint">${fmtDT(n.t)} · ${n.id}${n.on?'':' · '+T('resolved','закрыто')}</span></div>${n.trs.some(id=>mine.has(id))&&n.on?pill(['Affects your trip','Касается вашей поездки'],'gold'):''}</div>`).join('')}</div>`:`<div class="empty">✓ ${T('Good service on all lines','Все линии работают штатно')}</div>`}</div>`},
upd(el){if(!K.modalOpen&&S2(K.S)!==this._k){this._k=S2(K.S);K.renderView(el)}}};
const S2=S=>S.notes.length+':'+S.notes.filter(n=>n.on).length;
/* ---------- live board ---------- */
APP.views.board={ic:'🗺',t:['Live trains','Поезда онлайн'],render(el,S){const now=Date.now();const all=trains(today());const run=all.filter(tr=>pos(S,tr,now));const st=S.bst;
const dep=all.filter(tr=>tr.st.indexOf(st)>=0&&tr.st.indexOf(st)<tr.st.length-1&&atSt(tr,st)+dly(S,tr)*MIN>now-2*MIN).sort((a,b)=>atSt(a,st)-atSt(b,st)).slice(0,9);
const ontime=run.filter(tr=>dly(S,tr)<5).length;
el.innerHTML=`<div class="kpis">${kpi(['Trains running','Поездов в пути'],run.length,['Positions from SIRI-VM every 4 s','Позиции SIRI-VM каждые 4 с'])}${kpi(['Punctuality (< 5 min)','Пунктуальность (< 5 мин)'],run.length?Math.round(100*ontime/run.length)+'%':'—',['Running trains now','Поезда в пути'],ontime/(run.length||1)<.85?'warn-t':'ok-t')}${kpi(['Delayed ≥ 10 min','Задержка ≥ 10 мин'],run.filter(tr=>dly(S,tr)>=10).length,null,'bad-t')}${kpi(['Cancelled today','Отменено сегодня'],S.cx.length)}</div>
<div class="card"><h3>${T('Network — live positions','Сеть — положение поездов')} <span class="dot pulse"></span><span class="sp"></span>${legend([{l:T('On time','По графику'),c:'--mal'},{l:'5–9',c:'--amber'},{l:'≥10 '+T('min','мин'),c:'--red'}])}</h3><div class="mapw" id="nm">${netMap(S)}</div></div>
<div class="card mt dboard"><h3>${T('Departures','Отправления')}<span class="sp"></span><select class="input" id="bst" style="width:auto;min-width:170px">${STO.map(o=>`<option value="${o[0]}" ${o[0]===st?'selected':''}>${o[1]}</option>`).join('')}</select></h3>
${tbl([['Time','Время'],['Train','Поезд'],['To','Куда'],{t:['Pl.','Путь'],c:'num'},['Status','Статус']],dep.map(tr=>{const d=dly(S,tr);return `<tr class="clk" data-t="${tr.id}"><td class="mono"><b>${fmtT(atSt(tr,st))}</b></td><td><b>${tr.id}</b></td><td>${sN(tr.st[tr.st.length-1])}</td><td class="num">${st==='EC'?platOf(S,tr):(tr.dir+1)}</td><td>${cxd(S,tr)?`<span class="bad-t">${T('Cancelled','Отменён')}</span>`:d?`<span class="${d>=10?'bad-t':'warn-t'}">${T('Exp.','Ожид.')} ${fmtT(atSt(tr,st)+d*MIN)}</span>`:`<span class="ok-t">${T('On time','По графику')}</span>`}</td></tr>`}),{empty:['No more departures today','Отправлений больше нет']})}</div>`;
$('#bst').onchange=e=>{S.bst=e.target.value;K.save();K.refresh()};$$('[data-t]',el).forEach(r=>r.onclick=()=>trainModal(S,r.dataset.t));$$('.trn',el).forEach(g=>g.onclick=()=>trainModal(S,g.dataset.t))},
upd(el){if(K.modalOpen||document.activeElement&&document.activeElement.id==='bst')return;K.renderView(el)}};
/* ---------- dispatcher ---------- */
function pconf(S){const now=Date.now(),out=[];const all=trains(today()).filter(tr=>tr.st.includes('EC')&&!cxd(S,tr));all.forEach((a,i)=>all.slice(i+1).forEach(b=>{const ta=atSt(a,'EC')+dly(S,a)*MIN,tb=atSt(b,'EC')+dly(S,b)*MIN;if(ta>now-5*MIN&&ta<now+4*36e5&&platOf(S,a)===platOf(S,b)&&Math.abs(ta-tb)<4*MIN)out.push([a,b])}));return out}
APP.views.dispatch={ic:'🎛',t:['Dispatcher','Диспетчер'],badge:S=>pconf(S).length,render(el,S){const now=Date.now();const all=trains(today());const list=all.filter(tr=>{const end=tr.dep+tr.off[tr.off.length-1]*MIN+dly(S,tr)*MIN;return end>now&&tr.dep<now+2*36e5}).sort((a,b)=>a.dep-b.dep);const pc=pconf(S);
el.innerHTML=`${pc.length?`<div class="card" style="border-color:var(--red)"><h3 class="bad-t">⚠ ${T('Platform conflicts at Esterra Central','Конфликты путей в Эстерра-Центральной')}</h3>${pc.map(([a,b])=>`<div class="it"><div class="grow"><b>${a.id} / ${b.id}</b><span>${T('platform','путь')} ${platOf(S,a)} · ${fmtT(atSt(a,'EC')+dly(S,a)*MIN)} / ${fmtT(atSt(b,'EC')+dly(S,b)*MIN)}</span></div><button class="btn sm pri" data-fix="${b.id}">${T('Move','Перевести')} ${b.id} → ${T('pl.','путь')} ${[1,2,3,4,5].find(p=>p!==platOf(S,a))===platOf(S,b)?5:[5,1,2,3,4].find(p=>p!==platOf(S,a)&&p!==platOf(S,b))}</button></div>`).join('')}</div>`:''}
<div class="card ${pc.length?'mt':''}"><h3>${T('Running & next 2 hours','В пути и ближайшие 2 часа')}<span class="sp"></span><button class="btn sm pri" id="nn">📣 ${T('New notice','Новое уведомление')}</button></h3>
${tbl([['Train','Поезд'],['Route','Маршрут'],['Position','Где сейчас'],['Esterra C.','Эстерра-Ц.'],{t:['Delay','Задержка'],c:'num'},['Actions','Действия']],list.map(tr=>{const p=pos(S,tr,now),d=dly(S,tr),cx=cxd(S,tr),ec=tr.st.includes('EC');return `<tr class="${cx?'':''}" style="${cx?'opacity:.5':''}"><td><b>${tr.id}</b></td><td class="wr">${sN(tr.st[0])} → ${sN(tr.st[tr.st.length-1])}</td><td>${cx?T('cancelled','отменён'):p?`→ ${sN(p[2])}`:`${T('dep.','отпр.')} ${fmtT(tr.dep)}`}</td><td>${ec?`${fmtT(atSt(tr,'EC'))} · ${T('pl.','путь')} ${platOf(S,tr)}`:'—'}</td><td class="num ${d>=10?'bad-t':d>=5?'warn-t':''}">${d?'+'+d:'0'}</td><td><div class="row" style="gap:6px;flex-wrap:nowrap">${cx?`<button class="btn sm" data-re="${tr.id}">${T('Reinstate','Вернуть')}</button>`:`<button class="btn sm" data-d="${tr.id}">+5</button>${d?`<button class="btn sm" data-z="${tr.id}">0</button>`:''}${ec?`<button class="btn sm" data-p="${tr.id}">${T('Pl.','Путь')}</button>`:''}<button class="btn sm danger" data-x="${tr.id}">✕</button>`}</div></td></tr>`}),{maxh:520})}</div>
<div class="card mt"><h3>${T('Active notices','Активные уведомления')}</h3><div class="list">${S.notes.filter(n=>n.on).map(n=>`<div class="it"><div class="grow"><b>${L(CAUSE[n.c])}</b><span>${esc(noteTxt(n))}</span></div><button class="btn sm" data-rs="${n.id}">${T('Resolve','Закрыть')}</button></div>`).join('')||`<div class="empty">—</div>`}</div></div>`;
const tr=id=>all.find(t=>t.id===id);
const note=(ids,c,sev)=>{S.notes.push({id:'N-'+(S.nseq++),t:Date.now(),trs:ids,c,sev,on:1,txt:null})};
$$('[data-d]',el).forEach(b=>b.onclick=()=>{const id=b.dataset.d;S.dly[id]=(S.dly[id]||0)+5;if(S.dly[id]>=10&&!S.notes.some(n=>n.on&&n.trs.includes(id))){note([id],2,'warn');toast(T(`${id} +${S.dly[id]} min · SIRI notice sent to passengers`,`${id} +${S.dly[id]} мин · уведомление SIRI отправлено`))}else toast(T(`${id} delay set to +${S.dly[id]} min`,`${id}: задержка +${S.dly[id]} мин`));K.save();K.refresh()});
$$('[data-z]',el).forEach(b=>b.onclick=()=>{delete S.dly[b.dataset.z];K.save();K.refresh();toast(T('Delay cleared','Задержка снята'))});
$$('[data-x]',el).forEach(b=>b.onclick=()=>{const id=b.dataset.x;modal({title:T(`Cancel ${id}?`,`Отменить ${id}?`),body:fld('xc',['Cause','Причина'],{opts:CAUSE.map((c,i)=>[i,c[0],c[1]])})+`<p class="hint">${T('Ticket holders get a free refund or rebooking.','Пассажиры получат бесплатный возврат или перенос.')}</p>`,buttons:[{t:['Back','Назад']},{t:['Cancel train','Отменить поезд'],cls:'danger',fn(ov){S.cx.push(id);note([id],+val('xc',ov),'bad');K.save();K.refresh();toast(T(`${id} cancelled · passengers notified`,`${id} отменён · пассажиры уведомлены`),'bad')}}]})});
$$('[data-re]',el).forEach(b=>b.onclick=()=>{S.cx=S.cx.filter(x=>x!==b.dataset.re);S.notes.forEach(n=>{if(n.trs.includes(b.dataset.re))n.on=0});K.save();K.refresh()});
$$('[data-p]',el).forEach(b=>b.onclick=()=>{const t=tr(b.dataset.p);modal({title:T(`Platform for ${t.id} at Esterra Central`,`Путь для ${t.id} в Эстерра-Центральной`),body:`<div class="opts">${[1,2,3,4,5].map(p=>`<button class="opt ${platOf(S,t)===p?'on':''}" data-pp="${p}"><b>${T('Platform','Путь')} ${p}</b><span>${p===5?T('bay, short trains','тупиковый'):T('through','сквозной')}</span></button>`).join('')}</div>`,bind(ov,close){$$('[data-pp]',ov).forEach(o=>o.onclick=()=>{S.plat[t.id]=+o.dataset.pp;K.save();close();K.refresh();toast(T(`${t.id} → platform ${o.dataset.pp} · displays updated`,`${t.id} → путь ${o.dataset.pp} · табло обновлены`))})}})});
$$('[data-fix]',el).forEach(b=>b.onclick=()=>{const t=tr(b.dataset.fix);const used=pc.flatMap(x=>x).map(x=>platOf(S,x));S.plat[t.id]=[5,1,2,3,4].find(p=>!used.includes(p))||5;K.save();K.refresh();toast(T('Conflict resolved','Конфликт устранён'))});
$$('[data-rs]',el).forEach(b=>b.onclick=()=>{S.notes.find(n=>n.id===b.dataset.rs).on=0;K.save();K.refresh()});
$('#nn').onclick=()=>modal({title:T('Publish service notice','Опубликовать уведомление'),body:`<div class="fgrid">${fld('nc',['Cause','Причина'],{opts:CAUSE.map((c,i)=>[i,c[0],c[1]])})}${fld('ns',['Severity','Важность'],{opts:[['warn','Delays','Задержки'],['bad','Severe disruption','Серьёзный сбой'],['info','Planned work','Плановые работы']]})}${fld('nt',['Affected trains (comma-separated)','Поезда (через запятую)'],{req:1,val:list.slice(0,2).map(t=>t.id).join(', '),full:1})}</div>`,buttons:[{t:['Cancel','Отмена']},{t:['Publish','Опубликовать'],cls:'pri',fn(ov){const ids=val('nt',ov).split(',').map(x=>x.trim().toUpperCase()).filter(Boolean);if(!validate(['nt'],ov,()=>ids.every(id=>all.some(t=>t.id===id))||{id:'nt',msg:['Unknown train number','Неизвестный номер поезда']}))return false;note(ids,+val('nc',ov),val('ns',ov));K.save();K.refresh();toast(T('Notice published to app, displays and API','Уведомление опубликовано в приложении, на табло и в API'))}}]})},
upd(el){if(K.modalOpen||el.contains(document.activeElement)&&document.activeElement.tagName!=='BODY'&&document.activeElement.tagName!=='BUTTON')return;K.renderView(el)}};
APP.loginArt=`<svg class="bg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><rect width="400" height="300" style="fill:var(--blue);opacity:.08"/>${[0,1,2].map(i=>`<path d="M-10 ${120+i*60} C120 ${80+i*60} 260 ${180+i*40} 410 ${110+i*55}" fill="none" style="stroke:var(${['--blue','--gold','--mal'][i]});opacity:.5" stroke-width="7" stroke-linecap="round"/>`).join('')}${[[90,103],[200,128],[310,150],[150,182],[280,200]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="8" style="fill:var(--panel);stroke:var(--text);opacity:.7" stroke-width="2.5"/>`).join('')}<rect x="226" y="122" width="60" height="18" rx="9" style="fill:var(--mal)"/></svg>`;

APP.slug=ROW.slug;APP.name=APP.name||ROW.name;
APP.facts=Object.assign({tender:ROW.title,yb:ROW.year+' · '+ROW.budget,client:[ROW.client[0]+', '+(APP.country||['Republic of Nordania','Республика Нордания'])[0]+' (fictional)',ROW.client[1]+', '+(APP.country||['Republic of Nordania','Республика Нордания'])[1]+' (вымышл.)'],stack:ROW.stack},APP.facts||{});
K.start(APP);
})();
