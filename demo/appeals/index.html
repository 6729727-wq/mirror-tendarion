<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appeals 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--mal));color:#fff;font-size:15px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-weight:700}
.nav .cnt.g{background:var(--mal)}
.grow{flex:1}
.mini{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:12px;color:var(--muted);line-height:1.6}
.mini b{color:var(--text)}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.how>div>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--mal) 22%,transparent);color:var(--mal3);flex:none;font-size:13px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.xs{padding:3px 9px;font-size:11.5px}
.ok-t{color:var(--mal3)} .bad-t{color:var(--red)} .warn-t{color:var(--amber)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:14px;align-items:start}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text)}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{padding:14px}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:3px 0 1px}
.kpi .d{font-size:11.5px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td{background:color-mix(in srgb,var(--mal) 7%,transparent)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap;font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:330px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
/* inbox */
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 12px 8px}
.tb .input{flex:1;min-width:140px;padding:7px 11px;font-size:13px}
.fl{padding:0 12px 10px;border-bottom:1px solid var(--line)}
.feed{max-height:640px;overflow:auto}
.ap{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.ap:hover{background:color-mix(in srgb,var(--mal) 5%,transparent)}
.ap.sel{background:color-mix(in srgb,var(--mal) 11%,transparent);box-shadow:inset 3px 0 0 var(--mal)}
.ap.nw{animation:slide .6s}
@keyframes slide{from{opacity:0;transform:translateY(-10px);background:color-mix(in srgb,var(--gold) 22%,transparent)}}
.ap .chn{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);font-size:14px}
.ap .tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;line-height:1.38}
.ap .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;font-size:11.5px;color:var(--muted);align-items:center}
.ap .meta .pill{padding:1px 8px;font-size:11px}
.ap.closed .tx{opacity:.55}
.ud{width:8px;height:8px;border-radius:50%;display:inline-block}
.ud.hi{background:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 25%,transparent)} .ud.md{background:var(--amber)} .ud.lo{background:var(--mal)}
.more{width:100%;justify-content:center;border-radius:0;border:0;border-top:1px solid var(--line)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mal3)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--mal3);animation:pulse 1.4s infinite}
.live.off{color:var(--muted)} .live.off i{background:var(--dim);animation:none}
@keyframes pulse{50%{opacity:.3}}
.alert{border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 14%,var(--panel)),var(--panel));margin-bottom:12px;padding:14px 16px}
.alert.new{animation:glow 1.6s 3}
@keyframes glow{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--gold) 25%,transparent)}}
.alert .ttl{font-weight:800;font-size:14.5px}
.inc{border-color:color-mix(in srgb,var(--red) 50%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--red) 10%,var(--panel)),var(--panel))}
.inc.done{border-color:color-mix(in srgb,var(--mal) 55%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--mal) 12%,var(--panel)),var(--panel))}
.stg{display:flex;gap:4px;margin:10px 0}
.stg span{flex:1;height:6px;border-radius:6px;background:var(--line2)}
.stg span.on{background:var(--mal3)}
.stgl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);gap:6px}
.txt{font-size:14.5px;line-height:1.6;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
mark{border-radius:4px;padding:0 2px;color:inherit}
mark.hk{background:color-mix(in srgb,var(--gold) 32%,transparent)}
mark.hu{background:color-mix(in srgb,var(--red) 30%,transparent)}
mark.hn{background:color-mix(in srgb,var(--amber) 26%,transparent);text-decoration:underline dotted}
mark.hp{background:color-mix(in srgb,var(--mal) 28%,transparent)}
mark.hd{background:color-mix(in srgb,var(--blue) 28%,transparent)}
.lg{display:flex;gap:6px;flex-wrap:wrap;font-size:11px}
.lg mark{font-weight:600}
.lbl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.lbl label{display:block;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.lbl select{padding:7px 9px;font-size:13px}
.lbl .w2{grid-column:span 2}
.cb{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.bar{height:7px;border-radius:7px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mal2),var(--mal3));border-radius:7px;transition:width .4s}
.bar.g i{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.bar.r i{background:linear-gradient(90deg,var(--amber),var(--red))}
textarea.input{resize:vertical;min-height:120px;font-family:var(--font);font-size:13.5px;line-height:1.5}
.ent{display:inline-flex;gap:5px;align-items:center;font-size:12px;border:1px solid var(--line2);border-radius:8px;padding:2px 8px;background:var(--panel2)}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;cursor:pointer}
.cl:last-child{border-bottom:0}
.cl small{display:block;color:var(--muted);font-size:11.5px}
.cnum{font-family:var(--mono);font-weight:700;font-size:15px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:13.5px}
.cm{display:grid;grid-template-columns:72px repeat(5,minmax(0,1fr));gap:3px;font-size:11px}
.cm div{padding:6px 2px;text-align:center;border-radius:5px;font-family:var(--mono)}
.cm .h{font-family:var(--font);color:var(--muted);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok{display:flex;flex-wrap:wrap;gap:6px}
.tok span{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line2);border-radius:7px;padding:2px 7px;background:var(--panel2)}
.tok span b{color:var(--gold2)}
.map svg{width:100%;height:auto;display:block}
.map path{cursor:pointer;transition:opacity .2s}
.map path:hover{opacity:.82}
.out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.out div{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg2)}
.out small{display:block;font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.out b{font-size:14px}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.split,.grid2,.intro{grid-template-columns:minmax(0,1fr)}.feed{max-height:460px}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
}
@media (max-width:560px){.how{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi .v{font-size:19px}.lbl,.out{grid-template-columns:repeat(2,minmax(0,1fr))}.lbl .w2{grid-column:1/-1}.cb{grid-template-columns:minmax(0,1fr) 80px 40px}.cm{grid-template-columns:52px repeat(5,minmax(0,1fr));font-size:10px}}
</style>
</head>
<body data-demo-en="Appeals 360 — citizen appeals analytics &amp; incident centre" data-demo-ru="Обращения 360 — аналитика обращений граждан">
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><b>◎</b><div><span data-en="Appeals 360" data-ru="Обращения 360"></span><small data-en="Severnaya Governorate" data-ru="Северная губерния"></small></div></div>
    <div class="sec" data-en="Operations" data-ru="Операции"></div>
    <div id="navA"></div>
    <div class="sec" data-en="Insight & model" data-ru="Аналитика и модель"></div>
    <div id="navB"></div>
    <div class="grow"></div>
    <div class="mini" id="mini"></div>
    <button class="btn sm" id="reset" style="margin-top:8px;justify-content:center" data-en="Reset demo" data-ru="Сбросить демо"></button>
  </aside>
  <main>
    <div class="head">
      <button class="btn sm menu-btn" id="menuBtn">☰</button>
      <div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <div class="sp"></div>
      <span class="live" id="livePill"><i></i><span></span></span>
    </div>
    <div class="intro">
      <div class="card"><h3><span data-en="How to try it" data-ru="Как попробовать"></span></h3>
        <div class="how">
          <div><b>1</b><span data-en="Appeals stream into the <b>Inbox</b>, each auto-tagged. Open a low-confidence one, fix the sub-topic and press <b>Confirm</b> — the model re-weights and accuracy moves." data-ru="Обращения идут во <b>Входящие</b> и сами размечаются. Откройте неуверенное, исправьте подтему и нажмите <b>Подтвердить</b> — модель переобучится, точность изменится."></span></div>
          <div><b>2</b><span data-en="Wait ~15 s (or press <b>⚡ Simulate spike</b>): an emerging-issue alert fires. Open an incident, advance it and notify all residents." data-ru="Подождите ~15 с (или нажмите <b>⚡ Всплеск</b>): сработает сигнал о новой проблеме. Откройте инцидент, проведите его и оповестите всех жителей."></span></div>
          <div><b>3</b><span data-en="Generate and send a reply, check <b>SLA</b> and <b>Analytics</b>, and paste your own text in the <b>Classifier lab</b>." data-ru="Сформируйте и отправьте ответ, загляните в <b>SLA</b> и <b>Аналитику</b>, вставьте свой текст в <b>Лабораторию</b>."></span></div>
        </div></div>
      <div class="card"><dl class="facts">
        <dt data-en="Tender" data-ru="Тендер"></dt><dd data-en="Citizen appeals analytics" data-ru="Аналитика обращений граждан"></dd>
        <dt data-en="Year · budget" data-ru="Год · бюджет"></dt><dd>2025 · ₽ 140 M</dd>
        <dt data-en="Client" data-ru="Заказчик"></dt><dd data-en="Administration of «Severnaya Governorate» (fictional)" data-ru="Администрация «Северной губернии» (вымышл.)"></dd>
        <dt data-en="Stack" data-ru="Стек"></dt><dd>LLM · classification · incident centre</dd>
      </dl></div>
    </div>
    <section class="view" id="v-inbox"></section>
    <section class="view" id="v-sla"></section>
    <section class="view" id="v-an"></section>
    <section class="view" id="v-lab"></section>
  </main>
</div>
<div class="toasts" id="toasts"></div>
<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const KEY='appeals360-v1';
const store={load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},clear(){try{localStorage.removeItem(KEY)}catch(e){}}};
function toast(m,c){const t=document.createElement('div');t.className='toast '+(c||'');t.innerHTML=m;$('#toasts').append(t);setTimeout(()=>t.remove(),4200)}
/*ENGINE*/
const TOP=[{id:'roads',en:'Roads',ru:'Дороги',ic:'🛣',c:'--amber',ag:'road'},{id:'util',en:'Utilities',ru:'ЖКХ',ic:'🚰',c:'--blue',ag:'hcs'},{id:'health',en:'Healthcare',ru:'Здравоохранение',ic:'🏥',c:'--violet',ag:'hlt'},{id:'trans',en:'Transport',ru:'Транспорт',ic:'🚌',c:'--mal',ag:'trn'},{id:'school',en:'Schools',ru:'Образование',ic:'🏫',c:'--gold',ag:'edu'}];
const SUB={pothole:['roads','Potholes & surface','Ямы и покрытие'],snow:['roads','Snow & ice','Снег и гололёд'],light:['roads','Street lighting','Уличное освещение'],
water:['util','Water supply','Водоснабжение'],heat:['util','Heating & hot water','Отопление и ГВС'],waste:['util','Waste collection','Вывоз мусора'],
queue:['health','Appointments & queues','Запись и очереди'],drugs:['health','Subsidised medicines','Льготные лекарства'],ambul:['health','Ambulance response','Скорая помощь'],
late:['trans','Delays & intervals','Задержки и интервалы'],route:['trans','Route network','Маршрутная сеть'],stop:['trans','Stops & shelters','Остановки'],
enrol:['school','Enrolment','Зачисление'],build:['school','School buildings','Здания школ'],food:['school','School meals','Школьное питание']};
const SUBS=Object.keys(SUB);
const topOf=s=>TOP.find(t=>t.id===SUB[s][0]);
const AGN={road:['Road Management Directorate','Управление дорожного хозяйства'],hcs:['Housing & Utilities Committee','Комитет ЖКХ'],hlt:['Regional Health Department','Департамент здравоохранения'],ems:['Emergency Medical Service','Станция скорой помощи'],trn:['Transport Department','Департамент транспорта'],edu:['Education Department','Департамент образования']};
const agOf=s=>s==='ambul'?'ems':topOf(s).ag;
const DIST=[['zar','Заречный','Zarechny',84,[['Речная','Rechnaya'],['Мостовая','Mostovaya']]],['cen','Центральный','Tsentralny',121,[['Соборная','Sobornaya'],['Театральная','Teatralnaya']]],
['sev','Северный','Severny',96,[['Полярная','Polyarnaya'],['Северная','Severnaya']]],['les','Лесной','Lesnoy',52,[['Лесная','Lesnaya'],['Кедровая','Kedrovaya']]],
['ozr','Озёрный','Ozyorny',47,[['Озёрная','Ozyornaya'],['Береговая','Beregovaya']]],['prm','Промышленный','Promyshlenny',73,[['Заводская','Zavodskaya'],['Литейная','Liteynaya']]],
['sos','Сосновка','Sosnovka',38,[['Сосновая','Sosnovaya'],['Хвойная','Khvoynaya']]],['pri','Приморский','Primorsky',66,[['Приморская','Primorskaya'],['Маячная','Mayachnaya']]],
['kam','Каменный','Kamenny',58,[['Каменная','Kamennaya'],['Гранитная','Granitnaya']]]];
const DI=id=>DIST.findIndex(d=>d[0]===id);
const dName=id=>{const d=DIST[DI(id)];return d?T(d[2],d[1]):T('not detected','не определён')};
const norm=w=>w.toLowerCase().replace(/ё/g,'е');
const RU_END=/(иями|ями|ами|ого|его|ому|ему|ыми|ими|ией|ия|ие|ий|ый|ой|ая|яя|ое|ее|ые|ых|их|ую|юю|ам|ям|ах|ях|ом|ем|ов|ев|ей|а|я|ы|и|у|ю|е|о|ь|й)$/;
function stem(w){w=norm(w);if(/[а-я]/.test(w)){if(w.length>=3){const s=w.replace(RU_END,'');if(s.length>=2)w=s}return w.slice(0,6)}if(w.length>4)w=w.replace(/(ing|ed|es|s)$/,'');return w.slice(0,6)}

  const inT=k=>S.anT==='all'||SUB[k.split('|')[0]][0]===S.anT;
  const dv={};DIST.forEach(D=>dv[D[0]]=0);days.forEach(o=>{for(const k in o)if(inT(k))dv[k.split('|')[1]]+=o[k]});
  const per=DIST.map(D=>[D[0],dv[D[0]]/D[3]*10]),mxP=Math.max(...per.map(p=>p[1])),mnP=Math.min(...per.map(p=>p[1]));
  let s2=`<svg viewBox="0 0 320 236">`;per.forEach(([id,v])=>{const pts=POLY[id],t=(v-mnP)/Math.max(mxP-mnP,1e-6),cx=pts.reduce((a,p)=>a+p[0],0)/4,cy=pts.reduce((a,p)=>a+p[1],0)/4;
    s2+=`<path data-d="${id}" d="M${pts.map(p=>p.join(',')).join('L')}Z" fill="${ramp(t)}" stroke="${S.anD===id?tx:bg}" stroke-width="${S.anD===id?3:2}" stroke-linejoin="round"><title>${dName(id)}: ${v.toFixed(1)}</title></path><text x="${cx}" y="${cy-2}" font-size="10.5" font-weight="700" fill="${tx}" text-anchor="middle" pointer-events="none">${dName(id)}</text><text x="${cx}" y="${cy+12}" font-size="10" fill="${tx}" opacity=".8" text-anchor="middle" pointer-events="none">${v.toFixed(0)}</text>`});s2+='</svg>';
  const dSel=S.anD,dSub=SUBS.map(s=>[s,days.reduce((a,o)=>a+(o[s+'|'+dSel]||0),0)]).filter(x=>S.anT==='all'||SUB[x[0]][0]===S.anT).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const sn=HIST.map((d,i)=>{let n=d.neg,p=d.pos,t=d.tot;if(i===13)S.items.forEach(x=>{if(now()-x.t<864e5){const s=lbl(x).sent;t++;if(s==='neg')n++;if(s==='pos')p++}});return[n/t*100,p/t*100]});
  const W3=640,H3=200;const X=i=>40+i*(W3-50)/13,Y=v=>10+(1-v/80)*(H3-40);let s3=`<svg viewBox="0 0 ${W3} ${H3}">`;[0,20,40,60,80].forEach(v=>{s3+=`<line x1="40" x2="${W3}" y1="${Y(v)}" y2="${Y(v)}" stroke="${ln}"/><text x="34" y="${Y(v)+4}" font-size="10" fill="${mu}" text-anchor="end">${v}%</text>`});
  [[0,rd],[1,m3]].forEach(([j,c])=>{s3+=`<path d="${sn.map((v,i)=>(i?'L':'M')+X(i)+','+Y(v[j])).join('')}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/>`+sn.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v[j])}" r="${i===13?4.5:2.5}" fill="${c}"><title>${v[j].toFixed(1)}%</title></circle>`).join('')});
  sn.forEach((_,i)=>{if(i%3===1)s3+=`<text x="${X(i)}" y="${H3-12}" font-size="9.5" fill="${mu}" text-anchor="middle">${lab(i)}</text>`});s3+='</svg>';
  const cur={},prv={};days.forEach((o,d)=>{for(const k in o){if(!inT(k))continue;if(d>=7)cur[k]=(cur[k]||0)+o[k];else prv[k]=(prv[k]||0)+o[k]}});
  const top=Object.keys(cur).sort((a,b)=>cur[b]-cur[a]).slice(0,10),mxC=cur[top[0]]||1;
  $('#v-an').innerHTML=`<div class="chips" style="margin-bottom:14px" id="anT">${[['all','All topics','Все темы','📋']].concat(TOP.map(t=>[t.id,t.en,t.ru,t.ic])).map(t=>`<button class="chip ${S.anT===t[0]?'on':''}" data-t="${t[0]}">${t[3]} ${T(t[1],t[2])}</button>`).join('')}</div>
  <div class="grid2"><div class="card chart"><h3>${T('Appeals by topic · 14 days','Обращения по темам · 14 дней')}</h3>${s1}<div class="legend" style="margin-top:6px">${TOP.map(t=>`<span><i style="background:${cssv(t.c)}"></i>${T(t.en,t.ru)}</span>`).join('')}</div></div>
  <div class="card map"><h3>${T('Districts · appeals per 10k residents','Районы · обращений на 10 тыс. жителей')}</h3>${s2}
   <div class="row" style="margin-top:8px;font-size:12.5px"><b>${dName(dSel)}</b><span class="muted">${T('top problems','главные проблемы')}:</span>${dSub.map(x=>`<span class="pill">${topOf(x[0]).ic} ${T(SUB[x[0]][1],SUB[x[0]][2])} · ${x[1]}</span>`).join('')}</div></div>
  <div class="card chart"><h3>${T('Sentiment trend','Динамика тональности')}<span class="sp"></span><span class="legend"><span><i style="background:${rd}"></i>${T('negative','негатив')}</span><span><i style="background:${m3}"></i>${T('positive','позитив')}</span></span></h3>${s3}</div>
  <div class="card"><h3>${T('Top problems · last 7 days','Топ проблем · 7 дней')}</h3><div class="tw"><table><thead><tr><th>#</th><th>${T('Problem · district','Проблема · район')}</th><th>${T('Appeals','Обращ.')}</th><th>Δ</th></tr></thead><tbody>
  ${top.map((k,i)=>{const d=prv[k]?(cur[k]-prv[k])/prv[k]*100:100;return `<tr><td class="mono">${i+1}</td><td>${topOf(k.split('|')[0]).ic} ${esc(clName(k))}<div class="bar ${i<3?'g':''}" style="margin-top:4px;max-width:220px"><i style="width:${cur[k]/mxC*100}%"></i></div></td><td class="mono">${cur[k]}</td><td class="mono ${d>15?'bad-t':d<-10?'ok-t':''}">${d>0?'▲':'▼'} ${Math.abs(d).toFixed(0)}%</td></tr>`}).join('')}</tbody></table></div></div></div>`;
  $$('#anT .chip').forEach(b=>b.onclick=()=>{S.anT=b.dataset.t;save();rAn()});
  $$('#v-an path[data-d]').forEach(p=>p.onclick=()=>{S.anD=p.dataset.d;save();rAn()});
}
/* LAB */
const EX=[['ru','Третий день нет горячей воды и отопления на ул. Полярная, 12, дети мёрзнут, управляющая компания трубку не берёт!'],['ru','Автобус №27 снова не пришёл, на остановке ул. Литейная нет даже расписания.'],['en','Huge potholes on Granitnaya St again, my car tyre burst. This is dangerous!'],['ru','Огромное спасибо врачам скорой помощи за спасение мамы!'],['en','The canteen at School No. 12 serves cold food and the roof in the gym is leaking.'],['ru','Почему в Сосновке до сих пор не вывозят мусор? Свалка уже у детской площадки.']];
function rLab(){
  const a=acc(),voc=new Set(Object.keys(W).concat(Object.keys(S.dw))).size,mxc=Math.max(...a.cm.flat());
  const spk=S.accH.slice(-20),sMin=Math.min(...spk)-1,sMax=Math.max(...spk)+1;const sp=spk.length>1?`<svg viewBox="0 0 200 40" style="width:100%;height:40px"><path d="${spk.map((v,i)=>(i?'L':'M')+(i/(spk.length-1)*196+2)+','+(36-(v-sMin)/(sMax-sMin)*32)).join('')}" fill="none" stroke="${cssv('--mal3')}" stroke-width="2"/></svg>`:`<div class="muted" style="font-size:12px">${T('Correct a label in the Inbox to see the learning curve.','Исправьте разметку во Входящих — появится кривая обучения.')}</div>`;
  $('#v-lab').innerHTML=`<div class="grid2"><div class="card"><h3>🧪 ${T('Paste any appeal','Вставьте любое обращение')}<span class="sp"></span><span class="muted" style="font-size:12px;font-weight:500">RU / EN</span></h3>
   <textarea class="input" id="lt" data-en-ph="" placeholder="${T('Type or paste a citizen appeal…','Введите или вставьте текст обращения…')}">${esc(S.lab)}</textarea>
   <div class="chips" style="margin-top:8px">${EX.map((e,i)=>`<button class="chip" data-ex="${i}">${e[0].toUpperCase()} · ${esc(e[1].slice(0,26))}…</button>`).join('')}</div><div id="lo"></div></div>
  <div class="card"><h3>📇 ${T('Model card','Карточка модели')}</h3>
   <div class="out"><div><small>${T('Sub-topic acc.','Точн. подтемы')}</small><b class="ok-t">${a.sub.toFixed(1)}%</b></div><div><small>${T('Topic acc.','Точн. темы')}</small><b>${a.top.toFixed(1)}%</b></div><div><small>${T('Vocabulary','Словарь')}</small><b>${voc} ${T('stems','основ')}</b></div><div><small>${T('Corrections','Исправлений')}</small><b>${S.stat.fix}</b></div><div><small>${T('Confirmed','Подтверждено')}</small><b>${S.stat.ok}</b></div><div><small>${T('Latency','Задержка')}</small><b>&lt; 1 ms</b></div></div>
   <div style="font-size:12px;color:var(--muted);margin-bottom:4px">${T('Accuracy after each correction','Точность после каждого исправления')}</div>${sp}
   <div style="font-size:12px;color:var(--muted);margin:12px 0 6px">${T('Confusion matrix (topic), rows = truth','Матрица ошибок (тема), строки — эталон')}</div>
   <div class="cm"><div></div>${TOP.map(t=>`<div class="h">${t.ic}</div>`).join('')}${a.cm.map((r,i)=>`<div class="h" style="text-align:left">${TOP[i].ic} ${T(TOP[i].en,TOP[i].ru)}</div>`+r.map((v,j)=>`<div style="background:${i===j?`color-mix(in srgb,var(--mal) ${Math.round(v/mxc*70)+8}%,transparent)`:v?`color-mix(in srgb,var(--red) ${Math.min(60,v*12)}%,transparent)`:'var(--bg2)'}">${v}</div>`).join('')).join('')}</div>
   <p class="muted" style="font-size:12px;margin:12px 0">${T('Fast pre-tagger: weighted bilingual lexicon with stemming and softmax confidence; learns online from operator corrections (+0.5 to the right class, −0.3 to the wrong one). Reply drafts are template-filled with extracted entities; the full system adds an LLM for free-form drafting.','Быстрый предразметчик: взвешенный двуязычный словарь со стеммингом и softmax-уверенностью; дообучается онлайн на исправлениях оператора (+0,5 верному классу, −0,3 ошибочному). Черновики ответов собираются из шаблонов с извлечёнными сущностями; в полной системе к этому добавляется LLM для свободного текста.')}</p>
   <button class="btn sm" id="rstM">↺ ${T('Reset learned weights','Сбросить обучение')}</button></div></div>`;
  const lt=$('#lt');let db;lt.oninput=()=>{S.lab=lt.value;clearTimeout(db);db=setTimeout(()=>{save();labOut()},120)};
  $$('[data-ex]').forEach(b=>b.onclick=()=>{lt.value=S.lab=EX[+b.dataset.ex][1];save();labOut()});
  $('#rstM').onclick=()=>{S.dw={};S.model++;S.stat.fix=0;S.accH=[acc().sub];pc={};save();toast(T('Model reset to baseline weights','Модель сброшена к базовым весам'));rLab();nav()};
  labOut();
}
function labOut(){
  const el=$('#lo'),x=S.lab.trim();if(!x){el.innerHTML=`<div class="empty">${T('Pick an example or start typing — classification is instant.','Выберите пример или начните печатать — классификация мгновенная.')}</div>`;return}
  const p=classify(x),E=ents(x);
  el.innerHTML=`<div class="out"><div><small>${T('Topic','Тема')}</small><b>${topOf(p.sub).ic} ${T(topOf(p.sub).en,topOf(p.sub).ru)}</b><div class="muted mono" style="font-size:11px">${Math.round(p.tconf*100)}%</div></div><div><small>${T('Sub-topic','Подтема')}</small><b>${p.known?T(SUB[p.sub][1],SUB[p.sub][2]):'—'}</b><div class="muted mono" style="font-size:11px">${Math.round(p.conf*100)}%</div></div>
   <div><small>${T('Sentiment','Тональность')}</small><b class="${p.sent==='neg'?'bad-t':p.sent==='pos'?'ok-t':''}">${T(SE[p.sent][0],SE[p.sent][1])}</b></div><div><small>${T('Urgency','Срочность')}</small><b class="${p.urg==='hi'?'bad-t':p.urg==='md'?'warn-t':''}">${T(UR[p.urg][0],UR[p.urg][1])}</b></div>
   <div><small>${T('District','Район')}</small><b>${dName(p.dist)}</b></div><div><small>${T('Route to','Ведомство')}</small><b style="font-size:12.5px">${T(AGN[p.ag][0],AGN[p.ag][1])}</b></div></div>
   ${!p.known?`<div class="warn-t" style="font-size:13px">${T('Not enough signal for a confident topic — a human should label this one.','Недостаточно сигнала — это обращение лучше разметить человеку.')}</div>`:''}
   <div class="txt">${hl(x,p)}</div>
   ${E.length?`<div class="row">${E.map(e=>`<span class="ent">${e[0]} ${esc(e[1])}</span>`).join('')}</div>`:''}
   ${p.probs.map((q,i)=>`<div class="cb"><span>${topOf(q[0]).ic} ${T(SUB[q[0]][1],SUB[q[0]][2])}</span><div class="bar ${i?'':'g'}"><i style="width:${q[1]*100}%"></i></div><span class="mono">${Math.round(q[1]*100)}%</span></div>`).join('')}
   <div style="font-size:12px;color:var(--muted);margin:10px 0 6px">${T('Why: strongest features for the predicted class','Почему: самые весомые признаки для класса')}</div>
   <div class="tok">${p.contrib.length?p.contrib.slice(0,10).map(c=>`<span>${esc(c[0])} <b>+${c[1].toFixed(1)}</b></span>`).join(''):'<span>—</span>'}</div>
   <div class="row" style="margin-top:12px"><span class="muted" style="font-size:12.5px">${T('Wrong? Teach it:','Ошибка? Научите:')}</span><select class="input" id="lTeach" style="width:auto;max-width:100%;padding:6px 9px;font-size:13px">${SUBS.map(s=>`<option value="${s}" ${s===p.sub?'selected':''}>${T(SUB[s][1],SUB[s][2])}</option>`).join('')}</select><button class="btn sm pri" id="lGo">${T('Learn','Обучить')}</button></div>`;
  $('#lGo').onclick=()=>{const to=$('#lTeach').value;if(to===p.sub&&p.known){toast(T('Already predicted correctly','Модель уже отвечает верно'));return}const a0=acc().sub,n=learn(x,p.known?p.sub:null,to);pc={};const a1=acc().sub;S.stat.fix++;S.accH.push(a1);save();
    toast(`🧠 ${n} ${T('features updated','признаков обновлено')} · ${T('accuracy','точность')} ${a0.toFixed(1)}% → ${a1.toFixed(1)}%`,'gold');rLab();nav()};
}
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#reset').onclick=()=>{store.clear();seed();pc={};accC={};lastNew=null;render();startStream();toast(T('Demo reset','Демо сброшено'))};
PT.onLang(()=>render());
document.addEventListener('DOMContentLoaded',()=>{render();startStream()});
})();
</script>
