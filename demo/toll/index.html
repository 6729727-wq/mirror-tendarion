<div class="grid2"><div>${camSvg({g:v.g,t:v.t,p:v.p,c:v.c,conf:96,tag:false})}</div><div><div class="kv"><span>${T('Gantry','Рамка')}</span><b>${v.g} · ${GI[v.g].n}</b><span>${T('Time','Время')}</span><b>${fmtDT(v.t)}</b><span>${T('Vehicle','Машина')}</span><b>${plate(v.p)}</b><span>${T('Reason','Причина')}</span><b>${L(PR[v.why])}</b><span>${T('Toll','Плата')}</span><b>${mv(v.amt)}</b><span>${T('Admin fee','Сбор')}</span><b>${mv(v.fee)}</b><span>${T('Total','Итого')}</span><b class="big" style="font-size:22px">${mv(v.st==='void'?0:tot)}</b>${v.st==='open'?`<span>${T('Due','Срок')}</span><b class="${v.due-now<3*864e5?'bad-t':''}">${fmtD(v.due)} · ${Math.ceil((v.due-now)/864e5)} ${T('days left','дн. осталось')}</b>`:''}</div>
${ap?`<div class="tl mt"><div class="e g"><b>${T('Appeal filed','Апелляция подана')} · ${ap.id}</b><span>${fmtDT(ap.t)} · ${L(AR[ap.why])}</span></div><div class="e ${ap.st==='pending'?'':'g'}"><b>${ap.st==='pending'?T('With the review officer','У проверяющего'):ap.st==='approved'?T('Approved — notice cancelled','Одобрено — штраф отменён'):T('Rejected — please pay','Отклонено — оплатите')}</b><span>${ap.dt?fmtDT(ap.dt):T('decision within 10 working days','решение за 10 рабочих дней')}${ap.note?' · '+esc(ap.note):''}</span></div></div>`:''}
${v.st==='open'?`<div class="row mt"><button class="btn pri" data-pay="${v.id}">${T('Pay','Оплатить')} ${mv(tot)}</button>${ap?'':`<button class="btn" data-ap="${v.id}">${T('Appeal','Обжаловать')}</button>`}</div>`:''}</div></div></div>`}).join('')||`<div class="empty">${T('No violations','Нарушений нет')}</div>`;
$$('[data-pay]',el).forEach(b=>b.onclick=()=>{const v=S.viol.find(x=>x.id===b.dataset.pay),tot=v.amt+v.fee;modal({title:T('Pay notice','Оплатить штраф')+' '+v.id,body:`<div class="opts" id="pm"><div class="opt on" data-m="bal"><b>${T('From balance','С баланса')}</b><span>${mv(S.bal)}</span></div><div class="opt" data-m="card"><b>Visa •• 6631</b><span>${T('instant','сразу')}</span></div></div>`,bind(ov){$$('.opt',ov).forEach(o=>o.onclick=()=>$$('.opt',ov).forEach(x=>x.classList.toggle('on',x===o)))},buttons:[{t:['Cancel','Отмена']},{t:[`Pay ${mv(tot)}`,`Оплатить ${mv(tot)}`],cls:'pri',fn(ov){const m=$('.opt.on',ov).dataset.m;if(m==='bal'&&S.bal<tot){toast(T('Not enough balance — top up or pay by card','Недостаточно средств — пополните или оплатите картой'),'bad');return false}if(m==='bal')S.bal=Math.round((S.bal-tot)*100)/100;v.st='paid';K.save();K.refresh();toast(T('Paid — receipt sent by e-mail','Оплачено — квитанция на почте'))}}]})});
$$('[data-ap]',el).forEach(b=>b.onclick=()=>{const v=S.viol.find(x=>x.id===b.dataset.ap);modal({title:T('Appeal','Апелляция')+' '+v.id,body:`<div class="fgrid">${fld('ar',['Ground','Основание'],{opts:AR.map((a,i)=>[i,a[0],a[1]]),full:1})}${fld('at',['Explain','Объяснение'],{type:'area',req:1,full:1,ph:['At least 20 characters','Не меньше 20 символов'],em:['At least 20 characters','Не меньше 20 символов']})}${fld('af',['Evidence','Доказательства'],{type:'file',full:1})}</div><p class="hint">${T('Payment is paused while the appeal is reviewed.','Пока идёт рассмотрение, оплата приостановлена.')}</p>`,buttons:[{t:['Cancel','Отмена']},{t:['Submit appeal','Подать'],cls:'pri',fn(ov){if(!validate(['at'],ov,()=>val('at',ov).trim().length>=20||{id:'at'}))return false;const f=$('#af',ov);S.apps.unshift({id:'A-'+(1190+S.seq++),vid:v.id,p:v.p,t:Date.now(),why:+val('ar',ov),txt:[val('at',ov),val('at',ov)],file:f&&f.files&&f.files[0]?f.files[0].name:null,st:'pending',amt:v.amt+v.fee});v.st='appeal';K.save();K.refresh();toast(T('Appeal submitted','Апелляция подана'))}}]})})}};
/* ---------- operator: live feed ---------- */
APP.views.feed={ic:'📡',t:['Live gantry feed','Лента рамок'],badge:S=>S.queue.length,render(el,S){const last=S.reads[S.reads.length-1];const g=S.gsel;const gr=S.reads.filter(r=>r.g===g).slice(-1)[0]||last;
el.innerHTML=`<div class="kpis" id="fk">${fk(S)}</div><div class="grid2"><div class="card"><h3>${T('Gantry network','Сеть рамок')}<span class="sp"></span><span class="hint">${T('tap a gantry','нажмите рамку')}</span></h3><div class="gmap" id="gm">${gmap(S,{sel:g,hot:{[last.g]:1}})}</div></div>
<div class="card"><h3>${g} · ${GI[g].n} <span class="dot pulse"></span></h3><div id="cam">${camSvg(gr)}</div><div class="kv mt" id="ckv">${camKv(gr)}</div></div></div>
<div class="grid2 mt"><div class="card"><h3>${T('Plate reads','Распознавания')}<span class="sp"></span>${pill([`${S.reads.length} in buffer`,`${S.reads.length} в буфере`])}</h3><div class="feed" id="rf">${readsHtml(S)}</div></div>
<div class="card"><h3>${T('Manual review queue','Ручная проверка')}<span class="sp"></span>${pill([`${S.queue.length} waiting`,`${S.queue.length} ждут`],S.queue.length?'warn':'ok')}</h3><div id="rq">${queueHtml(S)}</div></div></div>`;
bindQ(el,S);$$('.gt',el).forEach(x=>x.onclick=()=>{S.gsel=x.dataset.g;K.save();K.refresh()})},
upd(el){if(K.modalOpen)return;const S=K.S;const last=S.reads[S.reads.length-1];const set=(id,h)=>{const e=$('#'+id,el);if(e)e.innerHTML=h};set('fk',fk(S));set('rf',readsHtml(S));set('gm',gmap(S,{sel:S.gsel,hot:{[last.g]:1}}));$$('.gt',el).forEach(x=>x.onclick=()=>{S.gsel=x.dataset.g;K.save();K.refresh()});
const gr=S.reads.filter(r=>r.g===S.gsel).slice(-1)[0];if(gr){set('cam',camSvg(gr));set('ckv',camKv(gr))}
const q=$('#rq',el);const qn=q&&q.firstElementChild;if(q&&(!qn||qn.dataset.n!=String(S.queue.length))&&!q.contains(document.activeElement)){q.innerHTML=queueHtml(S);bindQ(el,S)}}};
const camKv=r=>`<span>${T('Plate','Номер')}</span><b>${plate(r.p,r.mine?'mine':'')}</b><span>${T('Class','Класс')}</span><b>${CLS[r.c].ic} ${L(CLS[r.c].n)}</b><span>${T('Confidence','Уверенность')}</span><b class="${r.conf<85?'warn-t':'ok-t'}">${r.conf}%</b><span>${T('Billing','Оплата')}</span><b>${pill(ST[r.st][0],ST[r.st][1])} ${mv(r.amt)}</b>`;
function fk(S){const now=Date.now(),m=S.reads.filter(r=>r.t>now-6e4);const tag=S.reads.filter(r=>r.tag).length/S.reads.length;const h=new Date(now).getHours();const td=GT.reduce((a,g)=>a+S.rev[g.id].reduce((s,x)=>s+x.td,0),0);return kpi(['Reads / min','Чтений в мин'],fmtN(m.length*14+212))+kpi(['RFID share','Доля RFID'],Math.round(tag*100)+'%')+kpi(['Revenue today','Выручка сегодня'],mv(td))+kpi(['Peak pricing','Тариф пика'],peak(now)?T('ON ×1.5','ВКЛ ×1,5'):T('off','выкл'),null,peak(now)?'warn-t':'')}
const readsHtml=S=>S.reads.slice(-14).reverse().map((r,i)=>`<div class="fe ${i===0?'new':''}"><span class="mono">${fmtTs(r.t)}</span><b>${r.g}</b>${plate(r.p,r.mine?'mine':'')}<span class="conf ${r.conf<85?'warn-t':''}">${r.conf}%</span><span style="margin-left:auto">${pill(ST[r.st][0],ST[r.st][1])}</span></div>`).join('');
const queueHtml=S=>`<div data-n="${S.queue.length}">`+(S.queue.map(q=>`<div class="vrow"><div class="grow"><b>${q.g} · ${fmtT(q.t)} · ${CLS[q.c].ic}</b><span>${T('Read','Считано')}: ${plate(q.p)} · <span class="warn-t">${q.conf}%</span></span></div><div class="row" style="gap:6px;flex-wrap:wrap">${q.cand.map(c=>`<button class="btn sm" data-qa="${q.id}" data-p="${c}">${c}</button>`).join('')}<button class="btn sm" data-qe="${q.id}">✎</button><button class="btn sm danger" data-qx="${q.id}" title="${T('Unreadable','Нечитаемо')}">✕</button></div></div>`).join('')||`<div class="empty">✓ ${T('Queue is empty','Очередь пуста')}</div>`)+'</div>';
function bindQ(el,S){const done=(id,p,how)=>{const q=S.queue.find(x=>x.id===id);S.queue=S.queue.filter(x=>x.id!==id);S.revlog=(S.revlog||0)+1;K.save();K.refresh();toast(how==='x'?T(`${id}: marked unreadable — no charge`,`${id}: нечитаемо — без оплаты`):T(`${id}: ${p} confirmed · billed ${mv(price(q.g,q.c,q.t))}`,`${id}: ${p} подтверждён · ${mv(price(q.g,q.c,q.t))}`))};
$$('[data-qa]',el).forEach(b=>b.onclick=()=>done(b.dataset.qa,b.dataset.p));$$('[data-qx]',el).forEach(b=>b.onclick=()=>done(b.dataset.qx,null,'x'));
$$('[data-qe]',el).forEach(b=>b.onclick=()=>{const q=S.queue.find(x=>x.id===b.dataset.qe);modal({title:T('Correct plate','Исправить номер'),body:`${camSvg({g:q.g,t:q.t,p:q.p,c:q.c,conf:q.conf})}<div class="fgrid mt">${fld('qp',['Plate','Номер'],{req:1,val:q.cand[0],em:['Format AB·123·CD','Формат AB·123·CD'],full:1})}</div>`,buttons:[{t:['Cancel','Отмена']},{t:['Confirm','Подтвердить'],cls:'pri',fn(ov){const p=val('qp',ov).toUpperCase().replace(/[\s.\-·]+/g,'');if(!validate(['qp'],ov,()=>/^[A-Z]{2}\d{3}[A-Z]{2}$/.test(p)||{id:'qp'}))return false;done(q.id,p.slice(0,2)+'·'+p.slice(2,5)+'·'+p.slice(5))}}]})})}

APP.views.appeals={ic:'⚖️',t:['Appeals','Апелляции'],badge:S=>S.apps.filter(a=>a.st==='pending').length,render(el,S){const f=S.af||'pending';const l=S.apps.filter(a=>f==='all'||a.st===f);const cnt=st=>S.apps.filter(a=>a.st===st).length;
el.innerHTML=`<div class="kpis">${kpi(['Pending','Ожидают'],cnt('pending'),null,cnt('pending')?'warn-t':'')}${kpi(['Approved','Одобрено'],cnt('approved'),null,'ok-t')}${kpi(['Rejected','Отклонено'],cnt('rejected'))}${kpi(['Avg. decision','Среднее решение'],'3.4 '+T('days','дн.'))}</div>
<div class="tabs">${[['pending','Pending','Ожидают'],['approved','Approved','Одобрено'],['rejected','Rejected','Отклонено'],['all','All','Все']].map(([k,e,r])=>`<button class="tab ${f===k?'on':''}" data-f="${k}">${T(e,r)}</button>`).join('')}</div>
${l.map(a=>`<div class="card mt"><h3>${a.id} · ${a.vid}<span class="sp"></span>${a.st==='pending'?pill(['Pending','Ожидает'],'warn'):a.st==='approved'?pill(['Approved','Одобрено'],'ok'):pill(['Rejected','Отклонено'],'bad')}</h3><div class="vrow" style="border:0">${plate(a.p,'lg')}<div class="grow"><b>${L(AR[a.why])}</b><span>${esc(L(a.txt))}</span><span>${fmtDT(a.t)} · ${T('at stake','сумма')} ${mv(a.amt)}${a.file?' · 📎 '+esc(a.file):''}</span></div>${a.st==='pending'?`<button class="btn sm pri" data-ok="${a.id}">${T('Approve','Одобрить')}</button><button class="btn sm danger" data-no="${a.id}">${T('Reject','Отклонить')}</button>`:a.note?`<span class="hint">${esc(a.note)}</span>`:''}</div></div>`).join('')||`<div class="empty mt">${T('Nothing here','Пусто')}</div>`}`;
$$('[data-f]',el).forEach(b=>b.onclick=()=>{S.af=b.dataset.f;K.save();K.refresh()});
const decide=(id,ok)=>modal({title:(ok?T('Approve','Одобрить'):T('Reject','Отклонить'))+' '+id,body:`<div class="fgrid">${fld('dn',['Decision note to driver','Пояснение водителю'],{type:'area',req:1,full:1,val:ok?T('Tag read failure confirmed in gantry logs.','Сбой чтения метки подтверждён в журнале рамки.'):'',em:['Required','Обязательно']})}</div>`,buttons:[{t:['Cancel','Отмена']},{t:ok?['Approve','Одобрить']:['Reject','Отклонить'],cls:ok?'pri':'danger',fn(ov){if(!validate(['dn'],ov,()=>val('dn',ov).trim().length>=5||{id:'dn'}))return false;const a=S.apps.find(x=>x.id===id);a.st=ok?'approved':'rejected';a.note=val('dn',ov);a.dt=Date.now();const v=S.viol.find(x=>x.id===a.vid);if(v)v.st=ok?'void':'open';K.save();K.refresh();toast(ok?T('Approved — notice cancelled','Одобрено — штраф отменён'):T('Rejected — driver notified','Отклонено — водитель уведомлён'))}}]});
$$('[data-ok]',el).forEach(b=>b.onclick=()=>decide(b.dataset.ok,1));$$('[data-no]',el).forEach(b=>b.onclick=()=>decide(b.dataset.no,0))}};

APP.views.revenue={ic:'📈',t:['Revenue','Выручка'],render(el,S){const h=new Date().getHours();const td=x=>GT.reduce((a,g)=>a+S.rev[g.id][x].td,0),lw=x=>GT.reduce((a,g)=>a+S.rev[g.id][x].lw,0);const T1=Array.from({length:24},(_,x)=>td(x)),L1=Array.from({length:24},(_,x)=>lw(x));const tot=T1.reduce((a,b)=>a+b,0),lwt=L1.slice(0,h).reduce((a,b)=>a+b,0)+L1[h]*new Date().getMinutes()/60;
const mix=[{l:T('RFID tag','RFID-метка'),v:tot*.71,c:'--mal'},{l:T('Plate → account','Номер → счёт'),v:tot*.19,c:'--blue'},{l:T('Video invoice','Счёт по видео'),v:tot*.08,c:'--amber'},{l:T('Unbilled (leakage)','Не собрано'),v:tot*.02,c:'--red'}];
el.innerHTML=`<div class="kpis">${kpi(['Revenue today','Выручка сегодня'],mv(tot),[`${tot>=lwt?'+':''}${fmtN(100*(tot-lwt)/(lwt||1),1)}% vs last week`,`${tot>=lwt?'+':''}${fmtN(100*(tot-lwt)/(lwt||1),1)}% к прошлой неделе`],tot>=lwt?'ok-t':'bad-t')}${kpi(['Month to date','С начала месяца'],'MRV '+fmtN((tot*16.4+812000)/1e6,2)+T('M',' млн'))}${kpi(['Collection rate','Собираемость'],'97.9%',null,'ok-t')}${kpi(['Open violations value','Сумма нарушений'],mv(48210+S.viol.filter(v=>v.st==='open').reduce((a,v)=>a+v.amt+v.fee,0)))}</div>
<div class="card"><h3>${T('Revenue by hour','Выручка по часам')}</h3>${lineChart([{pts:L1,c:'--line2',dash:1},{pts:T1.slice(0,h+1),c:'--gold'}],Array.from({length:24},(_,i)=>String(i).padStart(2,'0')),{h:180,area:1,fmt:v=>fmtN(v/1000,1)+'k'})}${legend([{l:T('Today','Сегодня'),c:'--gold'},{l:T('Same day last week','Неделю назад'),c:'--line2'}])}</div>
<div class="grid2 mt"><div class="card"><h3>${T('By gantry','По рамкам')}</h3>${barChart(GT.map(g=>({l:g.id,v:S.rev[g.id].reduce((a,x)=>a+x.td,0),c:'--gold'})),{h:170,fmt:v=>fmtN(v/1000,0)+'k'})}${tbl([['Gantry','Рамка'],{t:['Rate','Тариф'],c:'num'},{t:['Today','Сегодня'],c:'num'}],GT.map(g=>`<tr><td>${g.id} · ${g.n}</td><td class="num">${fmtN(g.r,2)}</td><td class="num"><b>${fmtN(S.rev[g.id].reduce((a,x)=>a+x.td,0),0)}</b></td></tr>`))}</div>
<div class="card"><h3>${T('How it was collected','Способ оплаты')}</h3><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${donut(mix,{size:160,center:'98%',sub:T('collected','собрано')}).replace('<svg','<svg width="160" height="160"')}<div>${legend(mix.map(m=>({l:m.l,c:m.c,v:m.v,fv:fmtN(100*m.v/tot,0)+'%'})))}</div></div>
<h3 class="mt">${T('By vehicle class','По классам')}</h3>${[1,2,3,4].map((c,i)=>hbar(CLS[c].ic+' '+L(CLS[c].n),[62,21,13,4][i],100,[62,21,13,4][i]+'%')).join('')}</div></div>`}};
APP.loginArt=`<svg class="bg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><rect width="400" height="300" style="fill:var(--gold);opacity:.06"/><path d="M0 260 L400 170" style="stroke:var(--line2)" stroke-width="60" opacity=".5"/><path d="M0 260 L400 170" style="stroke:var(--panel)" stroke-width="2" stroke-dasharray="14 12"/><rect x="200" y="60" width="10" height="150" style="fill:var(--text)" opacity=".5"/><rect x="330" y="40" width="10" height="140" style="fill:var(--text)" opacity=".5"/><rect x="195" y="52" width="150" height="16" rx="3" style="fill:var(--gold)" opacity=".85"/><circle cx="240" cy="74" r="5" style="fill:var(--mal)"/><circle cx="290" cy="74" r="5" style="fill:var(--mal)"/></svg>`;

APP.slug=ROW.slug;APP.name=APP.name||ROW.name;
APP.facts=Object.assign({tender:ROW.title,yb:ROW.year+' · '+ROW.budget,client:[ROW.client[0]+', '+(APP.country||['Republic of Nordania','Республика Нордания'])[0]+' (fictional)',ROW.client[1]+', '+(APP.country||['Republic of Nordania','Республика Нордания'])[1]+' (вымышл.)'],stack:ROW.stack},APP.facts||{});
K.start(APP);
})();
