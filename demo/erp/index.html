<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledgera ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px;letter-spacing:.01em}
.brand b{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal),var(--mal2));color:#fff;font-size:15px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.side .grow{flex:1}
.rolebox{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel)}
.rolebox label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:700}
.rolebox select{margin-top:6px}
.who{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:13px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:color-mix(in srgb,var(--gold) 25%,var(--panel2));color:var(--gold2);flex:none}
main{padding:22px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim);margin-bottom:2px}
.menu-btn{display:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px}
.up{color:var(--mal3)} .dn{color:var(--red)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td{background:color-mix(in srgb,var(--mal) 6%,transparent)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mal2),var(--mal3));border-radius:9px}
.bar i.over{background:linear-gradient(90deg,var(--amber),var(--red))}
.tree .min td:first-child{font-weight:700}
.tree .prog td:first-child{padding-left:38px;color:var(--muted)}
.caret{display:inline-block;width:16px;transition:.15s;color:var(--dim)}
.open .caret{transform:rotate(90deg)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools .input{width:auto;min-width:160px;flex:1;max-width:320px}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
.steps{display:flex;gap:0;margin:14px 0}
.step{flex:1;text-align:center;position:relative;font-size:12px;color:var(--muted)}
.step:before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--line2);z-index:0}
.step:first-child:before{display:none}
.step .dot{width:32px;height:32px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line2);position:relative;z-index:1;font-weight:800}
.step.ok .dot{background:var(--mal);border-color:var(--mal);color:#fff}
.step.ok:before,.step.cur:before{background:var(--mal)}
.step.cur .dot{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 18%,transparent)}
.step.bad .dot{background:var(--red);border-color:var(--red);color:#fff}
.log{font-size:12.5px;max-height:260px;overflow:auto;border-top:1px solid var(--line);margin-top:10px}
.log div{padding:7px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px}
.log .t{color:var(--dim);font-family:var(--mono);font-size:11.5px;flex:none}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.on{display:flex}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r2);padding:22px;box-shadow:var(--shadow);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.modal h2{margin:0 0 14px;font-size:19px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:pop .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.org{overflow-x:auto;padding:10px 0}
.org ul{padding-top:18px;position:relative;display:flex;justify-content:center;margin:0;padding-left:0}
.org li{list-style:none;text-align:center;position:relative;padding:18px 6px 0}
.org li:before,.org li:after{content:"";position:absolute;top:0;right:50%;border-top:2px solid var(--line2);width:50%;height:18px}
.org li:after{right:auto;left:50%;border-left:2px solid var(--line2)}
.org li:only-child:after,.org li:only-child:before{display:none}
.org li:only-child{padding-top:0}
.org li:first-child:before,.org li:last-child:after{border:0 none}
.org li:last-child:before{border-right:2px solid var(--line2);border-radius:0 8px 0 0}
.org li:first-child:after{border-radius:8px 0 0 0}
.org ul ul:before{content:"";position:absolute;top:0;left:50%;border-left:2px solid var(--line2);height:18px}
.node{display:inline-block;border:1px solid var(--line2);background:var(--panel2);border-radius:12px;padding:8px 12px;font-size:12px;min-width:120px}
.node b{display:block;font-size:13px}
.node.top{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--panel2))}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);background:color-mix(in srgb,var(--amber) 8%,transparent);border-radius:12px;margin-bottom:8px;font-size:13.5px;flex-wrap:wrap}
.alert .sp{flex:1}
.sys{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.sys .card{padding:14px}
.sys .nm{font-weight:700;display:flex;align-items:center;gap:8px}
.led{width:8px;height:8px;border-radius:50%;background:var(--mal3);box-shadow:0 0 8px var(--mal3);animation:bl 1.6s infinite}
.led.warn{background:var(--amber);box-shadow:0 0 8px var(--amber)}
@keyframes bl{50%{opacity:.45}}
.sys .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
.sys .row b{color:var(--text);font-family:var(--mono);font-weight:600}
.busbox{position:relative}
.busbox svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lock{font-size:12px;color:var(--dim)}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:16px 16px 50px}
  .head h1{font-size:20px}
}
@media (max-width:520px){.kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.kpi .v{font-size:20px}.fgrid{grid-template-columns:1fr}.tools .input{max-width:none}}
</style>
</head>
<body data-demo-en="Ledgera — government ERP / SPBE" data-demo-ru="Ledgera — госERP и СПБЭ">
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><b>L</b><div>Ledgera<small data-en="Ministry of Finance · Nordania" data-ru="Минфин · Нордания"></small></div></div>
    <div id="navs"></div>
    <div class="grow"></div>
    <div class="rolebox">
      <label data-en="Signed in as role" data-ru="Роль пользователя"></label>
      <select class="input" id="role"></select>
      <div class="who"><div class="av" id="av"></div><div><div id="uname" style="font-weight:600"></div><div class="muted" style="font-size:12px" id="urole"></div></div></div>
    </div>
    <button class="btn sm" id="reset" style="margin-top:8px;justify-content:center" data-en="Reset demo data" data-ru="Сбросить данные"></button>
  </aside>
  <main>
    <div class="head">
      <button class="btn sm menu-btn" id="menuBtn">☰</button>
      <div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <div class="sp"></div>
      <span class="pill gold mono" id="fy">FY 2026</span>
      <button class="btn sm" id="csv">⇩ <span data-en="Export CSV" data-ru="Экспорт CSV"></span></button>
    </div>

    <section class="view" id="v-dash">
      <div class="kpis" id="kpis"></div>
      <div class="grid2">
        <div class="card"><h3><span data-en="Budget execution by month, NDK M" data-ru="Исполнение бюджета по месяцам, млн NDK"></span><span class="sp"></span>
          <span class="legend"><span><i style="background:var(--line2)"></i><span data-en="Plan" data-ru="План"></span></span><span><i style="background:var(--mal)"></i><span data-en="Actual" data-ru="Факт"></span></span><span><i style="background:var(--gold)"></i><span data-en="Cumulative %" data-ru="Накопл. %"></span></span></span></h3>
          <div id="chart"></div></div>
        <div class="card"><h3 data-en="Execution structure" data-ru="Структура исполнения"></h3><div id="donut"></div></div>
      </div>
      <div class="card" style="margin-top:14px"><h3><span data-en="Ministries" data-ru="Министерства"></span><span class="sp"></span><span class="muted" style="font-size:12px;font-weight:500" data-en="Click a row to drill down" data-ru="Нажмите строку для детализации"></span></h3>
        <div class="tw"><table id="tMin"></table></div></div>
    </section>

    <section class="view" id="v-budget">
      <div class="tools"><input class="input" id="bq" data-en-ph="Search programme…" data-ru-ph="Поиск программы…"><button class="btn sm" id="bExp" data-en="Expand all" data-ru="Развернуть всё"></button><button class="btn sm" id="bCol" data-en="Collapse" data-ru="Свернуть"></button><span class="lock" id="bLock"></span></div>
      <div class="tw"><table class="tree" id="tBud"></table></div>
    </section>

    <section class="view" id="v-proc">
      <div class="tools"><select class="input" id="pf" style="max-width:200px"></select><span class="sp" style="flex:1"></span><button class="btn pri sm" id="newReq">＋ <span data-en="New purchase request" data-ru="Новая заявка"></span></button></div>
      <div class="split">
        <div class="tw"><table id="tReq"></table></div>
        <div class="card" id="reqDetail"></div>
      </div>
    </section>

    <section class="view" id="v-hr">
      <div class="tools"><input class="input" id="hq" data-en-ph="Search name or position…" data-ru-ph="Поиск по имени или должности…"><select class="input" id="hd" style="max-width:220px"></select><button class="btn pri sm" id="addEmp">＋ <span data-en="Add employee" data-ru="Добавить сотрудника"></span></button></div>
      <div class="tw"><table id="tEmp"></table></div>
      <div class="card" style="margin-top:14px"><h3><span data-en="Org chart" data-ru="Оргструктура"></span><span class="sp"></span><select class="input" id="od" style="width:auto"></select></h3><div class="org" id="org"></div></div>
    </section>

    <section class="view" id="v-wh">
      <div id="alerts"></div>
      <div class="split">
        <div class="tw"><table id="tStock"></table></div>
        <div class="card"><h3 data-en="Stock movement" data-ru="Движение товара"></h3>
          <div class="fgrid">
            <div class="f full"><label data-en="Item" data-ru="Позиция"></label><select class="input" id="mvItem"></select></div>
            <div class="f"><label data-en="Operation" data-ru="Операция"></label><select class="input" id="mvType"></select></div>
            <div class="f"><label data-en="Quantity" data-ru="Количество"></label><input class="input" id="mvQty" type="number" min="1" value="10"></div>
          </div>
          <div style="margin-top:12px;display:flex;gap:8px;align-items:center"><button class="btn pri sm" id="mvGo" data-en="Post movement" data-ru="Провести"></button><span class="lock" id="whLock"></span></div>
          <div class="log" id="mvLog"></div>
        </div>
      </div>
    </section>

    <section class="view" id="v-int">
      <div class="kpis" id="ikpis"></div>
      <div class="grid2">
        <div class="card busbox"><h3><span data-en="Inter-agency service bus · NIX" data-ru="Межведомственная шина · NIX"></span><span class="sp"></span><span class="pill ok"><span class="led"></span> <span data-en="live" data-ru="онлайн"></span></span></h3><div id="bus"></div></div>
        <div class="card"><h3 data-en="Send test message" data-ru="Тестовое сообщение"></h3>
          <div class="fgrid"><div class="f"><label data-en="From" data-ru="Откуда"></label><select class="input" id="tFrom"></select></div><div class="f"><label data-en="To" data-ru="Куда"></label><select class="input" id="tTo"></select></div>
          <div class="f full"><label data-en="Message type" data-ru="Тип сообщения"></label><select class="input" id="tType"><option>GetTaxpayerStatus</option><option>PaymentOrder.v3</option><option>CitizenLookup</option><option>CustomsDeclaration</option><option>ContractNotice</option></select></div></div>
          <button class="btn gold sm" id="tSend" style="margin-top:12px">➤ <span data-en="Send through bus" data-ru="Отправить через шину"></span></button>
          <div class="log mono" id="tLog" style="font-size:11.5px"></div></div>
      </div>
      <div class="sys" id="sys" style="margin-top:14px"></div>
    </section>
  </main>
</div>
<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru), L=o=>o?(PT.lang==='ru'?o.ru:o.en):'';
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const KEY='ledgera-v1';
const store={load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},save(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}},clear(){try{localStorage.removeItem(KEY)}catch(e){}}};

const ROLES={
  minister:{en:'Minister',ru:'Министр',user:{en:'Astrid Holm',ru:'Астрид Хольм'},ini:'AH'},
  accountant:{en:'Chief Accountant',ru:'Главный бухгалтер',user:{en:'Petter Lund',ru:'Петтер Лунд'},ini:'PL'},
  procurement:{en:'Procurement officer',ru:'Специалист по закупкам',user:{en:'Karin Ek',ru:'Карин Эк'},ini:'KE'}
};
const PERM={
  editBudget:['minister','accountant'],
  createReq:['procurement'],
  addEmp:['minister','accountant'],
  stock:['procurement','accountant'],
  sendTest:['minister','accountant','procurement']
};
const can=a=>PERM[a].includes(S.role);
const STEPS=['procurement','accountant','minister'];
const STEPNAME={procurement:{en:'Head of Procurement',ru:'Нач. закупок'},accountant:{en:'Chief Accountant',ru:'Главбух'},minister:{en:'Minister',ru:'Министр'}};

const MIN=[
 ['fin','Finance','Финансы',['Treasury modernisation','Модернизация казначейства'],['Debt management','Управление долгом'],['Tax administration','Налоговое администрирование']],
 ['hea','Health','Здравоохранение',['Primary care network','Сеть первичной помощи'],['Hospital equipment','Оборудование больниц'],['e-Health records','Электронные медкарты']],
 ['edu','Education','Образование',['School infrastructure','Школьная инфраструктура'],['Teacher salaries','Зарплаты учителей'],['Digital classroom','Цифровой класс']],
 ['tra','Transport & Infrastructure','Транспорт и инфраструктура',['Northern highway','Северная магистраль'],['Rail renewal','Обновление ж/д'],['Port of Velmar','Порт Вельмар']],
 ['dig','Digital Development','Цифровое развитие',['Gov cloud','Гособлако'],['e-Services portal','Портал госуслуг'],['Cybersecurity centre','Центр кибербезопасности']],
 ['int','Interior','Внутренние дела',['Border systems','Пограничные системы'],['Emergency 112','Экстренная служба 112'],['Police fleet','Автопарк полиции']],
 ['agr','Agriculture','Сельское хозяйство',['Farm subsidies','Субсидии фермерам'],['Irrigation','Ирригация'],['Food safety labs','Лаборатории пищ. безопасности']],
 ['ene','Energy','Энергетика',['Grid upgrade','Модернизация сетей'],['Wind parks','Ветропарки'],['Energy efficiency','Энергоэффективность']]
];
const VENDORS=['Norbyte AS','Velmar Systems','Fjordline Supply','Arktek Group','Polaris Office','Granit Build'];
const DEPTS=[['tre','Treasury','Казначейство'],['bud','Budget Policy','Бюджетная политика'],['pro','Procurement','Закупки'],['it','IT & Digital','ИТ и цифра'],['leg','Legal','Юридический'],['hr','HR','Кадры']];
const POS={dir:{en:'Director',ru:'Директор'},head:{en:'Head of Unit',ru:'Начальник отдела'},sen:{en:'Senior Specialist',ru:'Ведущий специалист'},spe:{en:'Specialist',ru:'Специалист'}};

    {t:['Interactive panels for schools','Интерактивные панели для школ'],min:'edu',p:'edu2',a:11.3,v:4,step:0,st:'pending'}
  ].map((q,i)=>({id:'PR-26-'+String(412+i).padStart(4,'0'),en:q.t[0],ru:q.t[1],min:q.min,prog:q.p,amount:q.a,vendor:VENDORS[q.v],step:q.step,status:q.st,created:'2026-'+String(9+Math.floor(i/3)).padStart(2,'0')+'-'+String(4+i*4).padStart(2,'0'),acts:[]}));
  const audit=[];

}

function drawChart(){
  const el=$('#chart'),w=Math.max(300,el.clientWidth||600),h=260,pl=46,pr=40,pt=12,pb=28;const d=monthly();
  const mx=Math.max(...d.map(x=>Math.max(x.plan,x.act||0)))*1.15;const cw=(w-pl-pr)/12;
  const c={line:cssv('--line'),line2:cssv('--line2'),mal:cssv('--mal'),mal3:cssv('--mal3'),gold:cssv('--gold'),dim:cssv('--dim')};
  const mon=PT.lang==='ru'?['Я','Ф','М','А','М','И','И','А','С','О','Н','Д']:['J','F','M','A','M','J','J','A','S','O','N','D'];
  const tp=d.reduce((a,x)=>a+x.plan,0);let cum=0,pts=[];
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.mal3}"/><stop offset="1" stop-color="${c.mal}"/></linearGradient></defs>`;
  for(let i=0;i<=4;i++){const y=pt+(h-pt-pb)*i/4;s+=`<line x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}" stroke="${c.line}"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="10" fill="${c.dim}">${Math.round(mx*(1-i/4))}</text><text x="${w-pr+6}" y="${y+4}" font-size="10" fill="${c.dim}">${100-i*25}%</text>`}
  d.forEach((x,i)=>{const x0=pl+i*cw,bw=cw*.36,ph=(h-pt-pb)*x.plan/mx;
    s+=`<rect x="${x0+cw*.12}" y="${h-pb-ph}" width="${bw}" height="${ph}" rx="3" fill="${c.line2}"><title>${T('Plan','План')}: ${x.plan.toFixed(1)}</title></rect>`;
    if(x.act!=null){const ah=(h-pt-pb)*x.act/mx;s+=`<rect x="${x0+cw*.12+bw+2}" y="${h-pb-ah}" width="${bw}" height="${ah}" rx="3" fill="url(#ga)"><title>${T('Actual','Факт')}: ${x.act.toFixed(1)}</title></rect>`;cum+=x.act;pts.push([x0+cw/2,pt+(h-pt-pb)*(1-cum/tp)])}
    s+=`<text x="${x0+cw/2}" y="${h-8}" text-anchor="middle" font-size="11" fill="${c.dim}">${mon[i]}</text>`});
  s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${c.gold}" stroke-width="2.5" stroke-linejoin="round"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${c.gold}"/>`).join('');
  el.innerHTML=s+'</svg>';
}
function drawDonut(t){
  const c={mal:cssv('--mal'),gold:cssv('--gold'),line2:cssv('--line2'),text:cssv('--text'),muted:cssv('--muted')};
  const parts=[[T('Spent','Исполнено'),t.spent,c.mal],[T('Committed, unpaid','Обязательства, не оплачено'),t.committed-t.spent,c.gold],[T('Free balance','Свободный остаток'),t.plan-t.committed,c.line2]];
  const R=70,C=2*Math.PI*R;let off=0;let s=`<svg viewBox="0 0 200 200" style="max-width:210px;display:block;margin:0 auto">`;
  parts.forEach(p=>{const l=C*p[1]/t.plan;s+=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${p[2]}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=l});
  s+=`<text x="100" y="98" text-anchor="middle" font-size="26" font-weight="800" fill="${c.text}">${pct(t.spent,t.plan).toFixed(1)}%</text><text x="100" y="118" text-anchor="middle" font-size="11" fill="${c.muted}">${T('executed','исполнено')}</text></svg>`;
  s+='<div style="margin-top:12px">'+parts.map(p=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${p[2]};margin-right:8px"></i>${p[0]}</span><b class="mono">${money(p[1])}</b></div>`).join('')+'</div>';
  $('#donut').innerHTML=s;
}

function busLoop(){

setInterval(()=>{live.forEach(s=>{s.tps=Math.round(s.base*(s.ok?2.4:.8)*(.7+Math.random()*.6));s.msgs+=s.tps;s.lat=Math.max(6,s.base*(s.ok?1:2.6)*(.8+Math.random()*.4))});
  if(view!=='int')return;live.forEach(s=>{const c=$(`[data-c="${s.code}"]`),l=$(`[data-l="${s.code}"]`);if(c)c.textContent=s.msgs.toLocaleString(PT.lang);if(l)l.textContent=Math.round(s.lat)+' ms'});
  const tps=live.reduce((a,s)=>a+s.tps,0);const v=$$('#ikpis .v');if(v[1])v[1].textContent=tps;if(v[2])v[2].textContent=Math.round(live.reduce((a,s)=>a+s.lat,0)/live.length)+' ms';},1000);
$('#tFrom').onchange=e=>tFrom=e.target.value;$('#tTo').onchange=e=>tTo=e.target.value;
$('#tSend').onclick=()=>{if(tFrom===tTo)return toast(T('Choose different systems','Выберите разные системы'),'bad');
  const a=live.findIndex(s=>s.code===tFrom),b=live.findIndex(s=>s.code===tTo),id='MSG-'+Math.random().toString(16).slice(2,10).toUpperCase(),typ=$('#tType').value,t0=performance.now();
  pkts.push({a,b,t0,dur:2200,test:1});
  const lg=$('#tLog');const line=(txt,cls)=>{const d=document.createElement('div');d.innerHTML=`<span class="t">${new Date().toTimeString().slice(0,8)}</span><span class="${cls||''}">${txt}</span>`;lg.prepend(d)};
  line(`→ ${id} ${tFrom} ⇒ NIX : ${typ} ${T('signed (GOST/ECDSA)','подписано (ГОСТ/ECDSA)')}`);
  setTimeout(()=>line(`⇄ NIX ${T('routed','маршрутизировано')} ${id} → ${tTo} · ${T('schema valid','схема валидна')}`),1100);
  setTimeout(()=>{const lat=Math.round(live[b].lat+40+Math.random()*30);live[a].msgs++;live[b].msgs++;sentTotal++;line(`✓ ACK 200 ${id} ${T('from','от')} ${tTo} · ${lat} ms`,'up');toast(T('Delivered ','Доставлено ')+id+' · '+lat+' ms')},2250)};
requestAnimationFrame(busLoop);

/* ---------- CSV ---------- */
$('#csv').onclick=()=>{const tb=$('.view.on table');if(!tb)return;
  const rows=[...tb.querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>'"'+td.textContent.replace(/\s+/g,' ').trim().replace(/"/g,'""')+'"').join(','));
  const blob=new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ledgera-'+view+'-'+new Date().toISOString().slice(0,10)+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast(T('CSV exported: ','CSV выгружен: ')+(rows.length-1)+T(' rows',' строк'))};

/* ---------- Render ---------- */
function render(){
  renderNav();const v=VIEWS.find(x=>x[0]===view);$('#title').textContent=T(v[1],v[2]);$('#crumb').textContent=T('Ledgera · Ministry of Finance of Nordania','Ledgera · Минфин Республики Нордания');
  $('#csv').style.display=view==='int'?'none':'';
  ({dash:renderDash,budget:renderBudget,proc:renderProc,hr:renderHR,wh:renderWH,int:renderInt})[view]();
}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(view==='dash')drawChart()},150)});
PT.onLang(()=>render());
go('dash');
})();
</script>
