<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CardWorks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal));color:#fff;font-size:15px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-weight:700}
.grow{flex:1}
.mini{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:12px;color:var(--muted)}
.mini b{color:var(--text)}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.how>div>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--mal) 22%,transparent);color:var(--mal3);flex:none;font-size:13px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.steps{display:flex;margin:4px 0 18px}
.step{flex:1;text-align:center;position:relative;font-size:12px;color:var(--muted);min-width:0;cursor:pointer;background:none;border:0;padding:0}
.step:before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--line2)}
.step:first-child:before{display:none}
.step .dot{width:32px;height:32px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line2);position:relative;z-index:1;font-weight:800;color:var(--text)}
.step.ok .dot{background:var(--mal);border-color:var(--mal);color:#fff}
.step.ok:before,.step.cur:before{background:var(--mal)}
.step.cur .dot{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 18%,transparent)}
.step span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.ok-t{color:var(--mal3)} .bad-t{color:var(--red)} .warn-t{color:var(--amber)}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mal2),var(--mal3));transition:width .35s}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.chk span{flex:1}
.spin{width:16px;height:16px;border:2px solid var(--line2);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.map svg{width:100%;height:auto;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text)}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.slot{padding:8px 0;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-family:var(--mono);font-size:13px;color:var(--text)}
.slot.on{background:var(--mal);color:#fff;border-color:var(--mal)}
.slot:disabled{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.photo{width:150px;aspect-ratio:3/4;border-radius:12px;border:2px dashed var(--line2);display:grid;place-items:center;position:relative;overflow:hidden;background:var(--bg2);flex:none}
.photo svg{width:100%;height:100%}
.photo .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.photo .flash.go{animation:fl .5s}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.hands{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.fng{border:1px solid var(--line2);border-radius:12px;padding:6px 4px;text-align:center;background:var(--bg2);font-size:10.5px;color:var(--muted);position:relative;overflow:hidden}
.fng svg{width:100%;max-width:56px;height:auto;display:block;margin:0 auto}
.fng.cur{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.fng.ok{border-color:var(--mal)} .fng.bad{border-color:var(--red)}
.fng .q{font-family:var(--mono);font-weight:700;font-size:11px}
.fng.cur:after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--gold2);box-shadow:0 0 10px var(--gold);animation:scan 0.9s linear infinite}
@keyframes scan{from{top:0}to{top:100%}}
.cardwrap{perspective:1000px;display:flex;justify-content:center;padding:10px 0}
.piv{width:100%;max-width:400px;aspect-ratio:1.586;border-radius:18px;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35);background:linear-gradient(135deg,#0e3b31,#0b2a24 60%,#1b4a3d);color:#eaf6f1;transform-style:preserve-3d}
.piv.printing{animation:pr 2.4s ease-out}
@keyframes pr{0%{clip-path:inset(0 0 100% 0);transform:translateY(-30px)}100%{clip-path:inset(0 0 0 0);transform:none}}
.piv .band{position:absolute;left:0;right:0;top:0;height:22%;background:linear-gradient(90deg,#c9a24a,#e8cf86);color:#1a1306;font-weight:800;font-size:clamp(9px,2.6vw,13px);padding:3% 4%;letter-spacing:.04em}
.piv .ph{position:absolute;left:4%;top:28%;width:24%;aspect-ratio:3/4;border-radius:8px;background:#cfe5dc;overflow:hidden}
.piv .ph svg{width:100%;height:100%}
.piv .chip2{position:absolute;left:33%;top:31%;width:13%;aspect-ratio:1.25;border-radius:6px;background:linear-gradient(135deg,#e8cf86,#b58a2c);border:1px solid #8a6a1c}
.piv .chip2:before{content:"";position:absolute;inset:22% 0;border-top:1px solid #8a6a1c;border-bottom:1px solid #8a6a1c}
.piv .chip2:after{content:"";position:absolute;inset:0 38%;border-left:1px solid #8a6a1c;border-right:1px solid #8a6a1c}
.piv .info{position:absolute;left:33%;top:54%;right:4%;font-size:clamp(8px,2.4vw,12px);line-height:1.35}
.piv .info b{font-size:clamp(11px,3.4vw,17px);display:block;letter-spacing:.02em}
.piv .exp{position:absolute;right:4%;top:30%;text-align:right;font-size:clamp(7px,2vw,10px);opacity:.85}
.piv .ser{position:absolute;left:4%;bottom:5%;font-family:var(--mono);font-size:clamp(7px,2vw,10px);opacity:.8}
.piv .stamp{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(20px,7vw,38px);font-weight:900;color:var(--red);transform:rotate(-14deg);text-shadow:0 0 1px #000;letter-spacing:.08em}
.piv .stamp span{border:4px solid var(--red);padding:2px 14px;border-radius:10px;background:rgba(0,0,0,.25)}
.pinpad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}
.pinpad button{height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-size:18px;font-weight:700;cursor:pointer;color:var(--text)}
.dots{display:flex;gap:10px;justify-content:center;margin:10px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2)}
.dots i.f{background:var(--gold);border-color:var(--gold)}
.cert{display:grid;grid-template-columns:minmax(0,1fr) 120px 60px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.cert small{display:block;color:var(--muted);font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.door svg{width:100%;height:auto;display:block;max-height:320px}
.door .leaf{transition:transform .7s cubic-bezier(.5,0,.3,1);transform-origin:120px 40px;transform-box:view-box}
.door.open .leaf{transform:scaleX(.18)}
.log{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:110px;max-height:240px;overflow:auto}
.log div{padding:2px 0} .log .t{color:var(--dim)}
.ws{border:1px solid var(--line2);border-radius:14px;background:var(--bg2);padding:18px;text-align:center;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td,tbody tr.sel td{background:color-mix(in srgb,var(--mal) 7%,transparent)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2500;display:none;place-items:center;padding:16px}
.modal-bg.on{display:grid}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r2);padding:20px;max-width:440px;width:100%;box-shadow:var(--shadow)}
.modal h3{margin:0 0 10px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.split,.grid2,.intro{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
}
@media (max-width:560px){.how{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}.kpi .v{font-size:20px}.kpis{gap:10px}.step span{font-size:9.5px}.step .dot{width:26px;height:26px;font-size:12px}.step:before{top:12px}.cert{grid-template-columns:minmax(0,1fr) 70px 44px}.hands{gap:5px}}
</style>
</head>
<body data-demo-en="CardWorks — federal credential (PIV smart card) lifecycle" data-demo-ru="CardWorks — жизненный цикл служебных смарт-карт">
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><b>▣</b><div>CardWorks<small data-en="General Services Agency · Nordania" data-ru="Агентство общих служб · Нордания"></small></div></div>
    <div class="sec" data-en="Issuance" data-ru="Выпуск"></div>
    <div id="navA"></div>
    <div class="sec" data-en="Use & manage" data-ru="Использование и управление"></div>
    <div id="navB"></div>
    <div class="grow"></div>
    <div class="mini" id="mini"></div>
    <button class="btn sm" id="reset" style="margin-top:8px;justify-content:center" data-en="Reset demo" data-ru="Сбросить демо"></button>
  </aside>
  <main>
    <div class="head">
      <button class="btn sm menu-btn" id="menuBtn">☰</button>
      <div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <div class="sp"></div>
      <span class="pill" id="stPill"></span>
    </div>
    <div class="intro">
      <div class="card"><h3><span data-en="How to try it" data-ru="Как попробовать"></span></h3>
        <div class="how">
          <div><b>1</b><span data-en="In <b>Issuance</b>: sponsor an employee, pass background checks, book a slot, capture photo and 10 fingerprints." data-ru="В <b>Выпуске</b>: заявите сотрудника, пройдите проверки, запишитесь, снимите фото и 10 отпечатков."></span></div>
          <div><b>2</b><span data-en="Watch the card print, set a PIN, write 4 certificates — then tap it on the door and log in to a workstation." data-ru="Карта печатается, задайте PIN, запишите 4 сертификата — затем приложите к двери и войдите в компьютер."></span></div>
          <div><b>3</b><span data-en="In the <b>Lifecycle console</b> revoke the card — CRL/OCSP update and the door now denies access." data-ru="В <b>Консоли</b> отзовите карту — CRL/OCSP обновятся, и дверь больше не откроется."></span></div>
        </div></div>
      <div class="card"><dl class="facts">
        <dt data-en="Tender" data-ru="Тендер"></dt><dd data-en="Federal credentials" data-ru="Служебные удостоверения"></dd>
        <dt data-en="Year · budget" data-ru="Год · бюджет"></dt><dd>2025 · $177M</dd>
        <dt data-en="Client" data-ru="Заказчик"></dt><dd data-en="General Services Agency, Republic of Nordania (fictional)" data-ru="Агентство общих служб, Республика Нордания (вымышл.)"></dd>
        <dt data-en="Stack" data-ru="Стек"></dt><dd>PKI · FIPS 201-class · card management system</dd>
      </dl></div>
    </div>
    <section class="view" id="v-issue"></section>
    <section class="view" id="v-access"></section>
    <section class="view" id="v-console"></section>
    <section class="view" id="v-stats"></section>
  </main>
</div>
<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>
<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const KEY='cardworks-v1';
const store={load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},clear(){try{localStorage.removeItem(KEY)}catch(e){}}};
const fmtD=d=>new Date(d).toLocaleDateString(PT.lang==='ru'?'ru-RU':'en-GB',{day:'numeric',month:'short',year:'numeric'});
const now=()=>new Date().toTimeString().slice(0,8);
function toast(m,c){const t=document.createElement('div');t.className='toast '+(c||'');t.innerHTML=m;$('#toasts').append(t);setTimeout(()=>t.remove(),3800)}
function modal(html,onOk,okTxt){$('#modal').innerHTML=html+`<div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn sm" id="mNo">${T('Cancel','Отмена')}</button><button class="btn sm pri" id="mOk">${okTxt||'OK'}</button></div>`;$('#mbg').classList.add('on');$('#mNo').onclick=()=>$('#mbg').classList.remove('on');$('#mOk').onclick=()=>{if(onOk()!==false)$('#mbg').classList.remove('on')}}

const AG=[['GSA','General Services Agency','Агентство общих служб'],['MOF','Ministry of Finance','Министерство финансов'],['MOH','Ministry of Health','Министерство здравоохранения'],['MOT','Ministry of Transport','Министерство транспорта'],['CUS','Customs Service','Таможенная служба'],['STA','Statistics Office','Статистическое управление']];
const CENTRES=[['Velmar HQ · Bldg A','Вельмар, штаб, корп. A',58,40],['Velmar North Annex','Вельмар, северный корпус',56,26],['Haldby Federal Centre','Федеральный центр Хальдбю',28,58],['Skarvik Port Office','Офис порта Скарвик',80,70],['Ostmark Regional','Остмарк, региональный',46,78],['Norrby Campus','Кампус Норрбю',74,16]];
const FINGERS=[['R thumb','П большой'],['R index','П указат.'],['R middle','П средний'],['R ring','П безым.'],['R little','П мизинец'],['L thumb','Л большой'],['L index','Л указат.'],['L middle','Л средний'],['L ring','Л безым.'],['L little','Л мизинец']];
const STEPS=[['Sponsor','Спонсор'],['Background','Проверка'],['Appointment','Запись'],['Enrolment','Биометрия'],['Print','Печать'],['Activate','Активация']];
const CERTS=[['PIV Authentication','Аутентификация PIV','9A','RSA-2048'],['Digital Signature','Электронная подпись','9C','ECC P-256'],['Key Management (encryption)','Управление ключами (шифрование)','9D','RSA-2048'],['Card Authentication','Аутентификация карты','9E','ECC P-256']];
const STN={active:['Active','Активна','ok'],suspended:['Suspended','Приостановлена','warn'],revoked:['Revoked','Отозвана','bad'],expired:['Expired','Истекла','bad'],pending:['Not issued','Не выпущена','']};

function seed(){
  const r=rng(2025);const fn=['Anna','Erik','Lena','Oskar','Ingrid','Nils','Sara','Johan','Maja','Lars','Elin','Karl','Freja','Axel','Tove','Hugo','Saga','Emil','Vera','Leo'];
  const ln=['Berg','Dahl','Holm','Lund','Strand','Vik','Ek','Sund','Moberg','Aune','Nordin','Eklund','Halvorsen','Lindqvist'];
  const cards=[];const today=Date.now();
  for(let i=0;i<46;i++){const ag=AG[Math.floor(r()*AG.length)][0];const issued=today-Math.floor(r()*5.5*365)*864e5;const exp=issued+6*365*864e5;

      else if(S.pinBuf.length<6)S.pinBuf+=k;rIssue()};
    $$('[data-k]',el).forEach(b=>b.onclick=()=>pinKey(b.dataset.k));
    if($('#pinDemo'))$('#pinDemo').onclick=()=>{S.pin='482916';S.pinBuf='';S.pinStage=null;save();rIssue();toast(T('PIN set','PIN задан'))};
    if($('#cGo'))$('#cGo').onclick=async()=>{S.writing=true;for(let i=0;i<4;i++){for(let p=0;p<=100;p+=20){S.certs[i]=p;rIssue();await wait(110)}}S.writing=false;
      const serial='NP'+(700000+Math.floor(Math.random()*99999));S.cards.unshift({serial,name:S.sp.name,ag:S.sp.ag,issued:Date.now(),exp:Date.now()+6*365*864e5,st:'active',certExp:Date.now()+3*365*864e5,mine:true});S.my=serial;S.door=false;S.ws='locked';
      S.alog.unshift([now(),'ok',`${serial} issued & activated`,`${serial} выпущена и активирована`]);save();render();toast(T('Card '+serial+' is active','Карта '+serial+' активна'),'gold')};}
  $$('[data-st]',el).forEach(b=>b.onclick=()=>{const i=+b.dataset.st;if(i<=S.step&&!myCard()){S.step=i;save();rIssue()}else if(i>S.step)toast(T('Finish the current step first','Сначала завершите текущий шаг'),'bad')});
}

/* ---------- ACCESS ---------- */
function ocsp(c){if(!c)return 'unknown';if(c.st==='revoked'||S.crl.some(x=>x.serial===c.serial))return 'revoked';if(c.st==='suspended')return 'onHold';if(c.exp<Date.now())return 'expired';return 'good'}
function rAccess(){
  const el=$('#v-access');const my=myCard();

  el.innerHTML=`${my?'':`<div class="card" style="margin-bottom:14px;border-color:var(--gold)">⚠ ${T('You have no card yet — finish the issuance pipeline, or tap a random employee card below.','У вас ещё нет карты — завершите выпуск или приложите карту случайного сотрудника.')} <button class="btn sm" id="toIss">${T('Go to issuance','К выпуску')}</button></div>`}
  <div class="grid2"><div class="card"><h3>🚪 ${T('Physical access · Server room B2','Физический доступ · Серверная B2')}<span class="sp"></span><span class="pill">PACS · PKI-CAK</span></h3>
  <div class="door ${S.door==='open'?'open':''}"><svg viewBox="0 0 300 260"><rect x="0" y="0" width="300" height="260" fill="${bg}"/><rect x="40" y="30" width="170" height="226" fill="${pn}" stroke="${ln}" stroke-width="3"/><rect x="48" y="38" width="154" height="218" fill="#111" opacity=".55"/>
  <g class="leaf"><rect x="48" y="38" width="154" height="218" fill="${pn}" stroke="${ln}" stroke-width="2"/><rect x="62" y="56" width="126" height="70" rx="4" fill="none" stroke="${ln}"/><rect x="62" y="140" width="126" height="96" rx="4" fill="none" stroke="${ln}"/><circle cx="180" cy="150" r="6" fill="${ln}"/><text x="125" y="96" text-anchor="middle" font-size="13" fill="${tx}" font-weight="700">B2</text></g>
  <rect x="226" y="110" width="50" height="78" rx="8" fill="${pn}" stroke="${ln}" stroke-width="2"/><circle cx="251" cy="128" r="6" fill="${led}"><animate attributeName="opacity" values="1;.4;1" dur="1.2s" repeatCount="indefinite"/></circle><path d="M240 152a14 14 0 0 1 22 0M243 160a9 9 0 0 1 16 0M247 168a3 3 0 0 1 8 0" stroke="${tx}" fill="none" stroke-width="1.6" opacity=".7"/></svg></div>
  <div style="text-align:center;font-weight:800;margin:4px 0 10px" class="${S.door==='open'?'ok-t':S.door==='deny'?'bad-t':'muted'}">${S.door==='open'?T('ACCESS GRANTED','ДОСТУП РАЗРЕШЁН'):S.door==='deny'?T('ACCESS DENIED','ДОСТУП ЗАПРЕЩЁН'):T('Present card to reader','Приложите карту к считывателю')}</div>
  <div class="row" style="justify-content:center"><button class="btn gold" id="tap" ${my?'':'disabled'}>📇 ${T('Tap my card','Приложить мою карту')}</button><select class="input" id="other" style="width:auto;max-width:200px"><option value="">${T('…or another card','…или другую карту')}</option>${S.cards.filter(c=>!c.mine).slice(0,14).map(c=>`<option value="${c.serial}">${c.serial} · ${esc(c.name)} (${T(STN[c.st][0],STN[c.st][1])})</option>`).join('')}</select></div></div>
  <div class="card"><h3>💻 ${T('Logical access · Workstation','Логический доступ · Рабочая станция')}<span class="sp"></span><span class="pill">PKINIT · ${T('slot 9A','слот 9A')}</span></h3>
  <div class="ws">${S.ws==='in'?`<div style="font-size:40px">🖥</div><b class="ok-t">${T('Signed in as','Вход выполнен:')} ${esc(my?my.name:'')}</b><div class="muted mono" style="font-size:12px">GSA\\${esc(my?my.name.split(' ')[1].toLowerCase():'')} · Kerberos TGT ✓ · ${T('session','сеанс')} 8h</div><div class="row"><button class="btn sm" id="sign">✍ ${T('Sign a document (9C)','Подписать документ (9C)')}</button><button class="btn sm" id="lock">${T('Remove card (lock)','Извлечь карту (блок)')}</button></div>`
  :S.ws==='pin'?`<div style="font-size:32px">🔐</div><div>${T('Card detected · enter PIN','Карта обнаружена · введите PIN')}</div><div class="row"><input class="input mono" id="wsPin" type="password" maxlength="8" style="width:140px" placeholder="••••••"><button class="btn pri sm" id="wsGo">${T('Sign in','Войти')}</button></div><div class="muted" style="font-size:12px">${T('Demo PIN: ','Демо-PIN: ')}<span class="mono">${S.pin||'482916'}</span> · ${T('tries left','попыток')}: ${3-(S.wsTry||0)}</div>`
  :`<div style="font-size:40px">🔒</div><div class="muted">${T('Insert smart card to sign in','Вставьте смарт-карту для входа')}</div><button class="btn pri" id="ins" ${my?'':'disabled'}>${T('Insert my card','Вставить мою карту')}</button>`}</div></div></div>

    const ok=st==='good';S.door=ok?'open':'deny';

    if(ok)setTimeout(()=>{if(S.door==='open'){S.door=false;save();if(S.view==='access')rAccess()}},3200)};
  if($('#tap'))$('#tap').onclick=()=>tapCard(my);
  $('#other').onchange=e=>{const c=S.cards.find(x=>x.serial===e.target.value);if(c)tapCard(c)};
  if($('#ins'))$('#ins').onclick=async()=>{const st=ocsp(my);if(st!=='good'){S.alog.unshift([now(),'bad',`Workstation · ${my.serial} · certificate status ${st} → logon refused`,`Компьютер · ${my.serial} · статус сертификата ${st} → вход отклонён`]);save();rAccess();toast(T('Logon refused: certificate '+st,'Вход отклонён: сертификат '+st),'bad');return}S.ws='pin';S.wsTry=0;save();rAccess()};

    else{S.wsTry=(S.wsTry||0)+1;if(S.wsTry>=3){my.st='suspended';S.ws='locked';S.alog.unshift([now(),'bad',`${my.serial} PIN blocked after 3 tries → suspended`,`${my.serial} PIN заблокирован после 3 попыток → приостановлена`]);toast(T('PIN blocked — card suspended. Resume it in the console.','PIN заблокирован — карта приостановлена. Возобновите в консоли.'),'bad')}else toast(T('Wrong PIN','Неверный PIN'),'bad');save();render()}};
  if($('#sign'))$('#sign').onclick=()=>{const h=Array.from({length:16},()=>Math.floor(Math.random()*16).toString(16)).join('');S.alog.unshift([now(),'ok',`Document signed · ECDSA P-256 · sha256 ${h}…`,`Документ подписан · ECDSA P-256 · sha256 ${h}…`]);save();rAccess();toast(T('Document signed with slot 9C','Документ подписан ключом слота 9C'))};
  if($('#lock'))$('#lock').onclick=()=>{S.ws='locked';save();rAccess()};
  $('#clr').onclick=()=>{S.alog=[];save();rAccess()};
}

/* ---------- CONSOLE ---------- */
function rConsole(){
  const el=$('#v-console');const q=(S.q||'').toLowerCase();
  const list=S.cards.filter(c=>(S.filter==='all'||c.st===S.filter)&&(!q||c.serial.toLowerCase().includes(q)||c.name.toLowerCase().includes(q)));
  if(!S.sel||!S.cards.find(c=>c.serial===S.sel))S.sel=(myCard()||list[0]||{}).serial;
  const c=S.cards.find(x=>x.serial===S.sel);const cnt=k=>S.cards.filter(x=>x.st===k).length;
  el.innerHTML=`<div class="kpis"><div class="card kpi"><div class="l">${T('Active cards','Активные карты')}</div><div class="v">${cnt('active')}</div><div class="d">${T('of','из')} ${S.cards.length}</div></div><div class="card kpi"><div class="l">${T('Suspended','Приостановлены')}</div><div class="v warn-t">${cnt('suspended')}</div></div><div class="card kpi"><div class="l">${T('Revoked','Отозваны')}</div><div class="v bad-t">${cnt('revoked')}</div><div class="d">CRL #${S.crlN}</div></div><div class="card kpi"><div class="l">OCSP</div><div class="v ok-t" style="font-size:20px">${T('online','онлайн')}</div><div class="d">p95 38 ms · ${T('next CRL in 6 h','след. CRL через 6 ч')}</div></div></div>
  <div class="split"><div><div class="row" style="margin-bottom:10px"><input class="input" id="q" style="flex:1;min-width:150px" placeholder="${T('Search serial or name','Поиск по номеру или имени')}" value="${esc(S.q||'')}">${[['all','All','Все'],['active','Active','Активные'],['suspended','Suspended','Приост.'],['revoked','Revoked','Отозв.'],['expired','Expired','Истекли']].map(x=>`<button class="chip ${S.filter===x[0]?'on':''}" data-f="${x[0]}">${T(x[1],x[2])}</button>`).join('')}</div>
  <div class="tw" style="max-height:520px;overflow:auto"><table><thead><tr><th>${T('Serial','Номер')}</th><th>${T('Holder','Владелец')}</th><th>${T('Agency','Ведомство')}</th><th>${T('Expires','Срок')}</th><th>${T('Status','Статус')}</th></tr></thead><tbody>${list.map(x=>`<tr class="clk ${x.serial===S.sel?'sel':''}" data-s="${x.serial}"><td class="mono">${x.serial}${x.mine?' ★':''}</td><td>${esc(x.name)}</td><td>${x.ag}</td><td>${fmtD(x.exp)}</td><td><span class="pill ${STN[x.st][2]}">${T(STN[x.st][0],STN[x.st][1])}</span></td></tr>`).join('')||`<tr><td colspan="5" class="muted">${T('No cards match','Ничего не найдено')}</td></tr>`}</tbody></table></div></div>
  <div class="card">${c?`${face(c,false)}<dl class="facts" style="margin:8px 0 12px"><dt>${T('Issued','Выпущена')}</dt><dd>${fmtD(c.issued)}</dd><dt>${T('Certificates expire','Сертификаты до')}</dt><dd>${fmtD(c.certExp)}</dd><dt>OCSP</dt><dd class="mono ${ocsp(c)==='good'?'ok-t':'bad-t'}">${ocsp(c)}</dd></dl>
  <div class="row"><button class="btn sm pri" data-act="renew" ${c.st==='revoked'?'disabled':''}>↻ ${T('Renew','Продлить')}</button><button class="btn sm" data-act="reissue" ${c.st==='revoked'?'disabled':''}>⎘ ${T('Reissue (lost)','Перевыпуск (утеря)')}</button>${c.st==='suspended'?`<button class="btn sm" data-act="resume">▶ ${T('Resume','Возобновить')}</button>`:`<button class="btn sm" data-act="suspend" ${c.st!=='active'?'disabled':''}>⏸ ${T('Suspend','Приостановить')}</button>`}<button class="btn sm danger" data-act="revoke" ${c.st==='revoked'?'disabled':''}>⛔ ${T('Revoke','Отозвать')}</button></div>`:''}
  <h3 style="margin-top:16px">${T('Certificate Revocation List','Список отозванных сертификатов')}<span class="sp"></span><span class="pill">#${S.crlN}</span></h3><div class="log" style="min-height:60px;max-height:160px">${S.crl.slice().reverse().map(x=>`<div><span class="t">${new Date(x.t).toISOString().slice(0,16).replace('T',' ')}</span> ${x.serial} · ${x.reason}</div>`).join('')}</div></div></div>`;

  $$('tr[data-s]',el).forEach(r=>r.onclick=()=>{S.sel=r.dataset.s;save();rConsole()});

      S.cards.unshift({...c,serial:ns,st:'active',issued:Date.now(),exp:Date.now()+6*365*864e5,certExp:Date.now()+3*365*864e5});c.mine=false;if(S.my===c.serial)S.my=ns;S.sel=ns;save();render();toast(T('New card '+ns+' issued · old revoked','Новая карта '+ns+' · старая отозвана'),'gold')},T('Reissue','Перевыпустить'));
    else if(a==='revoke')modal(`<h3>⛔ ${T('Revoke credential','Отзыв удостоверения')}</h3><p class="muted" style="font-size:13.5px">${T('All 4 certificates on '+c.serial+' will be added to the CRL and OCSP will return “revoked”. This cannot be undone.','Все 4 сертификата карты '+c.serial+' попадут в CRL, OCSP будет отвечать «revoked». Это необратимо.')}</p><div class="f"><label>${T('Reason','Причина')}</label><select class="input" id="rr"><option>cessationOfOperation</option><option>keyCompromise</option><option>affiliationChanged</option><option>superseded</option></select></div>`,()=>{c.st='revoked';crlPush(c.serial,$('#rr').value);S.door=false;S.ws='locked';
      S.alog.unshift([now(),'bad',`${c.serial} REVOKED · CRL #${S.crlN} published · OCSP updated`,`${c.serial} ОТОЗВАНА · опубликован CRL #${S.crlN} · OCSP обновлён`]);save();render();toast(T('Revoked · CRL #'+S.crlN+' published. Try the door now.','Отозвана · опубликован CRL #'+S.crlN+'. Попробуйте дверь.'),'bad')},T('Revoke','Отозвать'));
  });
}

  <div class="grid2"><div class="card chart"><h3>${T('Cards by agency','Карты по ведомствам')}<span class="sp"></span><span class="legend"><span><i style="background:${m}"></i>${T('active','активные')}</span><span><i style="background:${am}"></i>${T('other','прочие')}</span></span></h3>${s1}</div>
  <div class="card chart"><h3>${T('Certificate expiry · next 12 months','Истечение сертификатов · 12 месяцев')}<span class="sp"></span><span class="legend"><span><i style="background:${rd}"></i>&lt;3</span><span><i style="background:${g}"></i>3–6</span><span><i style="background:${m3}"></i>6+</span></span></h3>${s2}
  <div class="row" style="margin-top:8px"><button class="btn sm pri" id="notify">✉ ${T('Notify holders expiring < 90 days','Уведомить истекающих < 90 дней')}</button></div></div></div>`;
  $('#notify').onclick=()=>toast(T(cnt.slice(0,3).reduce((a,b)=>a+b,0)+' renewal notices queued','В очередь поставлено уведомлений: '+cnt.slice(0,3).reduce((a,b)=>a+b,0)),'gold');
}

$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#mbg').onclick=e=>{if(e.target.id==='mbg')$('#mbg').classList.remove('on')};
$('#reset').onclick=()=>{store.clear();S=seed();render();toast(T('Demo reset','Демо сброшено'))};
PT.onLang(()=>render());
document.addEventListener('DOMContentLoaded',()=>render());
})();
