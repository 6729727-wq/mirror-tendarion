<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vitalia Health App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.wrap{max-width:1420px;margin:0 auto;padding:18px 20px 60px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top h1{margin:0;font-size:22px;display:flex;align-items:center;gap:10px}
.top h1 b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#ff7d8e,#c8344f);color:#fff;font-size:15px}
.top .sp{flex:1}.stk{font-family:var(--mono);font-size:11.5px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.how>div{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.4}
.how>div>b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1306;font-size:12px}
.how>div>span{min-width:0;overflow-wrap:anywhere}
.layout{display:grid;grid-template-columns:minmax(0,.9fr) 392px minmax(0,1.2fr);grid-template-areas:"feat phone cons";gap:20px;align-items:start}
.a-feat{grid-area:feat;display:flex;flex-direction:column;gap:14px;min-width:0}
.a-phone{grid-area:phone;min-width:0}
.a-cons{grid-area:cons;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.card h4{margin:14px 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:13px;margin:0}
.facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:600}
.feat{display:flex;gap:11px;padding:9px 8px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:.15s}
.feat:hover{border-color:var(--line2);background:var(--panel2)}
.feat .fi{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);font-size:16px}
.feat b{display:block;font-size:13.5px}.feat span{font-size:12.3px;color:var(--muted);line-height:1.4;display:block}
/* phone */
.phone{border-radius:50px;padding:12px;background:linear-gradient(160deg,#2a3b35,#0b1512);box-shadow:var(--shadow),inset 0 0 0 2px #3a4f47;position:sticky;top:60px}
.scr{border-radius:38px;overflow:hidden;background:var(--bg);height:770px;display:flex;flex-direction:column;position:relative;isolation:isolate}
.sbar{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12.5px;font-weight:700;flex:none}
.sbar .isl{width:96px;height:24px;background:#000;border-radius:14px}
.ahd{display:flex;align-items:center;gap:8px;padding:4px 14px 8px;flex:none}
.ahd .lg{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#ff7d8e,#c8344f);color:#fff;font-size:14px;flex:none}
.ahd .tt{flex:1;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{position:relative;width:36px;height:36px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);display:grid;place-items:center;cursor:pointer;flex:none;padding:0;font-size:15px}
.ibtn.offl{color:var(--amber);border-color:var(--amber)}
.ibtn .bd{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.pava{width:36px;height:36px;border-radius:50%;border:2px solid var(--mal);display:grid;place-items:center;font-weight:800;font-size:12px;cursor:pointer;flex:none;padding:0;color:#1a1306}
.ban{margin:0 14px 6px;border-radius:12px;padding:7px 11px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);flex:none}
.pbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 14px 18px;scrollbar-width:thin;position:relative}
.ptr{height:0;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px;transition:height .25s}
.ptr.drag{transition:none}
.ptr i{width:20px;height:20px;border:2px solid var(--line2);border-top-color:var(--mal3);border-radius:50%;display:inline-block}
.ptr.spin i{animation:sp .7s linear infinite}
.view{animation:vin .28s cubic-bezier(.2,1,.4,1)}
@keyframes vin{from{opacity:0;transform:translateX(14px)}}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);padding:6px 4px 14px;flex:none}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--dim);cursor:pointer;padding:4px 0;min-width:0}
.tabbar button i{font-style:normal;font-size:19px;filter:grayscale(1);opacity:.7;transition:.2s}
.tabbar button.on{color:var(--mal3)}.tabbar button.on i{filter:none;opacity:1;transform:translateY(-2px) scale(1.1)}
.tabbar button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
button:active,.li:active,.tile:active{transform:scale(.96)}
.xs{font-size:11.5px}.sm{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}.row .sp{flex:1;min-width:0}
.fam{display:flex;gap:8px;margin:2px 0 12px;overflow-x:auto;scrollbar-width:none}
.fam button{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;font-size:12.5px;font-weight:600}
.fam button.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 12%,transparent)}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#1a1306;flex:none}
.hid{border-radius:18px;padding:14px;color:#fff;background:radial-gradient(130% 120% at 0 0,#21c99a 0,#0e7458 50%,#093a2e 100%);position:relative;overflow:hidden;cursor:pointer;display:flex;gap:12px;box-shadow:0 10px 30px rgba(6,40,30,.3);margin-bottom:12px}
.hid:after{content:"";position:absolute;right:-50px;top:-60px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,125,142,.45),transparent 68%);pointer-events:none}
.hid .l{flex:1;min-width:0;position:relative;z-index:1}
.hid .t1{font-size:9.5px;font-weight:800;letter-spacing:.14em;opacity:.85}
.hid .nm{font-size:18px;font-weight:800;margin:6px 0 2px}
.hid i{display:block;font-style:normal;font-size:9px;opacity:.7;text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.hid b{font-size:12.5px}
.hid .q{width:92px;flex:none;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;opacity:.95}
.hid .q svg{width:92px;height:92px;border-radius:8px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.tile{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:11px;font-weight:600;color:var(--muted);padding:0;min-width:0}
.tile i{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);transition:.15s;font-style:normal;font-size:22px}
.tile:hover i{border-color:var(--gold)}.tile span{text-align:center;line-height:1.2}
.sect{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px}
.sect button{border:0;background:none;color:var(--mal3);font-weight:700;font-size:12px;cursor:pointer;text-transform:none;letter-spacing:0;padding:0}
.li{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;transition:.15s;width:100%;text-align:left}
.li:hover{border-color:var(--line2)}
.li .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);flex:none;font-size:17px}
.li .sp{flex:1;min-width:0}
.li .sp b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .sp div{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{font-size:12.5px;font-weight:700;text-align:right;white-space:nowrap;flex:none}
.back{border:0;background:none;color:var(--muted);cursor:pointer;font-weight:600;padding:2px 0 8px;font-size:13px}
.h2{font-size:19px;font-weight:800;margin:2px 0 4px;line-height:1.25}
.sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.pbtn{width:100%;justify-content:center;margin-top:8px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:4px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{color:#fff;background:var(--mal2);border-color:var(--mal)}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.tl .mo{font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:10px 0 6px}
.tl .li{position:relative}
.tl .li:before{content:"";position:absolute;left:-20px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--mal));box-shadow:0 0 0 3px var(--bg)}
.tl .li.new{animation:fl 2.2s}
@keyframes fl{0%{background:color-mix(in srgb,var(--gold) 30%,var(--panel))}}
.spark{display:block}
.flag{font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;margin-left:4px}
.flag.H{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}.flag.L{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue)}
.big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:12.5px;margin:10px 0}
.kv span{color:var(--muted)}.kv b{font-weight:600;overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line2);background:var(--panel);border-radius:14px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);transition:.15s}
.opt b{color:var(--text);font-size:13.5px}.opt i{font-style:normal;font-size:22px}
.opt:hover{border-color:var(--mal)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--mono)}
.slot[disabled]{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.slot.on{background:var(--mal);color:#fff;border-color:var(--mal)}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:6px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tri{border-radius:16px;padding:16px;color:#fff;margin:6px 0 12px;animation:pop .35s}
.tri.red{background:linear-gradient(135deg,#e5484d,#9c1f2b)}.tri.amber{background:linear-gradient(135deg,#f0a83a,#b8641a)}.tri.green{background:linear-gradient(135deg,#21c99a,#0e7458)}
.tri b{font-size:18px;display:block;margin:4px 0}
.crumbs{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.ans{width:100%;text-align:left;justify-content:flex-start;margin-bottom:8px;border-radius:14px;padding:12px 14px}
.sw{position:relative;width:40px;height:22px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line2);transition:.2s;cursor:pointer}
.sw i:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--mal)}.sw input:checked+i:after{transform:translateX(18px)}
.push{position:absolute;left:10px;right:10px;top:8px;z-index:40;border-radius:18px;padding:11px 12px;display:flex;gap:10px;cursor:pointer;background:color-mix(in srgb,var(--panel2) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);box-shadow:0 14px 34px rgba(0,0,0,.35);animation:pdrop .45s cubic-bezier(.2,1.3,.4,1)}
.push.out{animation:pup .3s forwards}
.push .ic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#ff7d8e,#c8344f);color:#fff;font-size:15px}
.push .sp{flex:1;min-width:0}.push .hd{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.push b{display:block;font-size:13px}.push p{margin:1px 0 0;font-size:12px;color:var(--muted);line-height:1.35}
@keyframes pdrop{from{transform:translateY(-130%);opacity:0}}@keyframes pup{to{transform:translateY(-130%);opacity:0}}
.shade{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.45);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-radius:24px 24px 0 0;border-top:1px solid var(--line2);padding:10px 16px 22px;max-height:88%;overflow:auto;animation:sup .3s cubic-bezier(.2,1,.4,1)}
.sheet:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 12px}
.sheet h4{margin:0 0 4px;font-size:17px}
.qrbox{background:#fff;border-radius:18px;padding:12px;width:220px;margin:12px auto;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.qrbox svg{display:block;width:100%;height:auto}
@keyframes sup{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.85);opacity:0}}@keyframes sp{to{transform:rotate(360deg)}}
/* call */
.call{position:absolute;inset:0;z-index:30;background:#05100c;color:#fff;display:flex;flex-direction:column;animation:fade .3s}
.call .vid{flex:1;position:relative;background:radial-gradient(80% 60% at 50% 35%,#1d4a3c,#06120e);display:grid;place-items:center;min-height:0}
.call .doc{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:36px;font-weight:800;background:linear-gradient(135deg,#f3d79a,#c69a3e);color:#1a1306;animation:talk 1.6s infinite}
@keyframes talk{0%{box-shadow:0 0 0 0 rgba(54,224,174,.55)}100%{box-shadow:0 0 0 26px rgba(54,224,174,0)}}
.call .me{position:absolute;right:12px;top:44px;width:84px;height:116px;border-radius:14px;background:linear-gradient(160deg,#2c3e38,#122019);border:2px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:12px}
.call .cap{position:absolute;left:14px;top:12px;font-size:12px;line-height:1.35}
.call .cap b{font-size:15px;display:block}
.call .rec{position:absolute;left:14px;bottom:10px;font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.4);padding:3px 8px;border-radius:8px}
.call .rec:before{content:"●";color:#ff5a5a;margin-right:5px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.call .chat{height:200px;background:#0b1a15;border-top:1px solid #1f3a31;display:flex;flex-direction:column}
.call .msgs{flex:1;overflow:auto;padding:8px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.call .m{max-width:82%;padding:6px 10px;border-radius:12px;background:#163128;align-self:flex-start;animation:pop .25s}
.call .m.me2{align-self:flex-end;background:#0e7458}
.call .cin{display:flex;gap:6px;padding:8px}
.call .cin input{flex:1;min-width:0;background:#132620;border:1px solid #2a4d41;border-radius:10px;padding:8px 10px;color:#fff;outline:none}
.call .ctr{display:flex;justify-content:center;gap:14px;padding:12px 0 18px;background:#05100c}
.call .ctr button{width:50px;height:50px;border-radius:50%;border:0;background:#1f3a31;color:#fff;font-size:19px;cursor:pointer}
.call .ctr button.off{background:#fff;color:#111}.call .ctr .end{background:#e5484d}
/* console */
.kp4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kp4 div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.kp4 span{display:block;font-size:11px;line-height:1.25;color:var(--muted);font-weight:600}
.kp4 b{font-family:var(--mono);font-size:17px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:300px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:440px}
th{position:sticky;top:0;background:var(--panel2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:7px 10px}
td{padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--panel2)}tbody tr.sel td{background:color-mix(in srgb,var(--mal) 10%,transparent)}
tr.fresh td{animation:fl 2.4s}
.f{margin-bottom:10px}.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.chart{display:flex;gap:12px;align-items:center;padding:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.lock{text-align:center;padding:18px;border:1px dashed var(--red);border-radius:12px;color:var(--red);font-size:13px}
.json{font-family:var(--mono);font-size:11.8px;line-height:1.55;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-height:380px;overflow:auto}
.json details{margin:0}.json summary{cursor:pointer;list-style:none;white-space:nowrap}
.json summary::-webkit-details-marker{display:none}
.json summary:before{content:"▸";display:inline-block;width:12px;color:var(--dim);transition:.15s}
.json details[open]>summary:before{transform:rotate(90deg)}
.json details[open]>summary .cn{display:none}
.json .jin{padding-left:16px;border-left:1px dashed var(--line2);margin-left:5px}
.json .ln{white-space:nowrap;padding-left:12px}
.jk{color:var(--violet)}.js{color:var(--mal3)}.jn{color:var(--gold2)}.jb{color:var(--blue)}.cn{color:var(--dim);font-size:10.5px;margin-left:6px}
.alog{font-family:var(--mono);font-size:11.5px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-height:150px;overflow:auto;line-height:1.6}
.alog div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:330px;animation:pop .2s}
.toast.bad{border-left-color:var(--red)}.toast.gold{border-left-color:var(--gold)}.toast.warn{border-left-color:var(--amber)}
@media (max-width:1180px){
  .layout{grid-template-columns:392px minmax(0,1fr);grid-template-areas:"phone cons" "feat feat"}
  .a-feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
}
@media (max-width:860px){
  .wrap{padding:14px 16px 50px}
  .how{grid-template-columns:minmax(0,1fr);gap:6px}
  .layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"phone" "cons" "feat"}
  .a-feat{display:flex}
  .a-phone{margin:0 -16px}
  .phone{position:static;padding:0;background:none;box-shadow:none;border-radius:0}

function fhir(r){if(!r)return null;const subj={reference:'Patient/'+r.pid,display:pname(r.pid)},meta={versionId:'1',lastUpdated:r.date+'T09:00:00+01:00',profile:['https://fhir.health.nd/StructureDefinition/nd-'+r.rt]};
 if(r.rt==='Observation'){const v=r.vals[r.vals.length-1],f=flag(r);return{resourceType:'Observation',id:r.id,meta,status:'final',category:[{coding:[{system:'http://terminology.hl7.org/CodeSystem/observation-category',code:'laboratory'}]}],code:{coding:[{system:'http://loinc.org',code:r.code,display:r.name[0]}]},subject:subj,effectiveDateTime:r.date,valueQuantity:{value:v,unit:r.unit,system:'http://unitsofmeasure.org'},interpretation:[{coding:[{system:'http://terminology.hl7.org/CodeSystem/v3-ObservationInterpretation',code:f||'N'}]}],referenceRange:[{low:{value:r.lo,unit:r.unit},high:{value:r.hi,unit:r.unit}}]}}
 if(r.rt==='MedicationRequest')return{resourceType:'MedicationRequest',id:r.id,meta,status:r.status==='dispensed'?'completed':'active',intent:'order',medicationCodeableConcept:{coding:[{system:'http://www.whocc.no/atc',code:r.atc,display:r.med}]},subject:subj,authoredOn:r.date,requester:{display:r.by},dosageInstruction:[{text:r.dose[0]}],dispenseRequest:{validityPeriod:{start:r.date},expectedSupplyDuration:{value:r.days,unit:'d'},performer:r.pharm?{display:r.pharm[0]}:undefined},extension:[{url:'https://fhir.health.nd/ext/erx-status',valueCode:r.status}]};
 if(r.rt==='Immunization')return{resourceType:'Immunization',id:r.id,meta,status:'completed',vaccineCode:{coding:[{system:'http://hl7.org/fhir/sid/cvx',code:r.cvx,display:r.vac[0]}]},patient:subj,occurrenceDateTime:r.date,lotNumber:r.lot,protocolApplied:[{doseNumberPositiveInt:r.dose}]};
 if(r.rt==='Condition')return{resourceType:'Condition',id:r.id,meta,clinicalStatus:{coding:[{system:'http://terminology.hl7.org/CodeSystem/condition-clinical',code:'active'}]},code:{coding:[{system:'http://hl7.org/fhir/sid/icd-10',code:r.icd,display:r.name[0]}]},subject:subj,recordedDate:r.date,recorder:{display:r.by}};
 return{resourceType:'Encounter',id:r.id,meta,status:'finished',class:{system:'http://terminology.hl7.org/CodeSystem/v3-ActCode',code:r.cls||'AMB'},type:[{text:r.title[0]}],subject:subj,participant:[{individual:{display:r.by}}],period:{start:r.date},serviceProvider:{display:r.org},reasonCode:[{text:r.note[0]}]}}
function fhirSel(){const s=S.sel;if(!s){const r=S.res.find(x=>x.pid==='p1'&&x.rt==='Observation');return fhir(r)}
 if(s.startsWith('appt:')){const a=S.appts.find(x=>x.id===s.slice(5));return a&&{resourceType:'Appointment',id:a.id,status:a.st==='pending'?'proposed':a.st==='done'?'fulfilled':'booked',serviceType:[{text:SPECS.find(x=>x[0]===a.spec)[2]}],appointmentType:{coding:[{system:'http://terminology.hl7.org/CodeSystem/v2-0276',code:a.mode==='video'?'VIDEO':'ROUTINE'}]},start:a.date+'T'+a.time+':00+01:00',minutesDuration:20,participant:[{actor:{reference:'Patient/'+a.pid,display:pname(a.pid)},status:'accepted'},{actor:{display:a.doc},status:'accepted'}]}}
 if(s.startsWith('pat:')){const pid=s.slice(4),f=prof(pid),o=OTHERS[pid];return{resourceType:'Patient',id:pid,identifier:[{system:'https://fhir.health.nd/sid/nhi',value:f?f.nhi:'NHI 4402-'+(hash(pid)%9000+1000)+'-'+pad(hash(pid)%97)}],name:[{text:pname(pid)}],birthDate:f?f.born:o[2],generalPractitioner:[{display:'Dr. Anna Lind'}],managingOrganization:{display:'Nordhavn City Clinic'}}}

 const val=typeof v==='string'?`<span class="js">"${esc(v)}"</span>`:typeof v==='number'?`<span class="jn">${v}</span>`:`<span class="jb">${v}</span>`;return `<div class="ln">${key}${val}</div>`}

  $('#glass').onclick=()=>{S.glass=pid;logAccess('Dr. Anna Lind · BREAK-GLASS','glass');push(['Emergency access to your record','Экстренный доступ к вашей карте'],['Dr. Anna Lind used break-glass access. Reviewed by the data protection officer.','Dr. Anna Lind использовала экстренный доступ. Проверит офицер по защите данных.'],'me','🚨');renderChart();renderPhone()};bindDone();return}
 const conds=R.filter(r=>r.rt==='Condition'),labs=R.filter(r=>r.rt==='Observation'),meds=R.filter(r=>r.rt==='MedicationRequest'&&r.status!=='dispensed');

 ${labs.map(r=>{const fl=flag(r);return `<div class="chart" data-sel="${r.id}" style="cursor:pointer">${spark(r,110,34)}<div style="flex:1;min-width:0"><b class="sm">${esc(tx(r.name))}</b><div class="xs muted">${r.vals[r.vals.length-1]} ${r.unit} · ${T('ref','норма')} ${r.lo}–${r.hi}${fl?` <span class="flag ${fl}">${fl}</span>`:''}</div></div></div>`}).join('')}
 <h4>${T('Add diagnosis & e-prescription','Диагноз и e-рецепт')}</h4>
