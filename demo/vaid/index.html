<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valor ID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1306;font-size:16px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.nav .lk{margin-left:auto;font-size:11px;color:var(--dim)}
.grow{flex:1}
.a11y{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:13px;display:flex;flex-direction:column;gap:8px}
.a11y b{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;justify-content:space-between;background:none;border:0;padding:0;text-align:left;width:100%}
.sw i{width:36px;height:20px;border-radius:20px;background:var(--line2);position:relative;flex:none;transition:.2s}
.sw i:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.sw.on i{background:var(--mal)} .sw.on i:after{left:18px}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.how>div>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold2);flex:none;font-size:13px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.steps{display:flex;margin:4px 0 18px}
.step{flex:1;text-align:center;position:relative;font-size:12px;color:var(--muted);min-width:0}
.step:before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--line2)}
.step:first-child:before{display:none}
.step .dot{width:32px;height:32px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line2);position:relative;z-index:1;font-weight:800}
.step.ok .dot{background:var(--mal);border-color:var(--mal);color:#fff}
.step.ok:before,.step.cur:before{background:var(--mal)}
.step.cur .dot{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 18%,transparent)}
.step span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.cap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.shot{border:2px dashed var(--line2);border-radius:16px;aspect-ratio:1.586;display:grid;place-items:center;position:relative;overflow:hidden;background:var(--bg2)}
.shot svg{width:100%;height:100%;display:block}
.shot .scan{position:absolute;left:0;right:0;height:3px;background:var(--mal3);box-shadow:0 0 16px var(--mal3);animation:scan 1.2s linear infinite}
@keyframes scan{from{top:0}to{top:100%}}
.qc{list-style:none;padding:0;margin:10px 0 0;font-size:12.5px}
.qc li{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)}
.ok-t{color:var(--mal3)} .bad-t{color:var(--red)} .warn-t{color:var(--amber)}
.live{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:center}
.oval{position:relative;width:100%;max-width:280px;aspect-ratio:3/4;margin:auto;border-radius:50%/42%;background:radial-gradient(circle at 50% 40%,var(--panel2),var(--bg2));border:3px solid var(--line2);overflow:hidden}
.oval.go{border-color:var(--gold)} .oval.done{border-color:var(--mal)}
.oval svg{position:absolute;inset:0;width:100%;height:100%}
.tgt{position:absolute;width:34px;height:34px;border-radius:50%;border:3px solid var(--gold2);box-shadow:0 0 18px var(--gold);left:calc(50% - 17px);top:calc(45% - 17px);transition:left .8s cubic-bezier(.5,0,.3,1),top .8s cubic-bezier(.5,0,.3,1);display:none}
.tgt.on{display:block}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mal2),var(--mal3));transition:width .4s}
.log{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:120px;max-height:220px;overflow:auto}
.log div{padding:2px 0} .log .t{color:var(--dim)}
.svc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.svc div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.svc span{display:block;font-size:11.5px;color:var(--muted)} .svc b{font-size:14px}
.ial{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.ial div{flex:1;min-width:120px;border:1px solid var(--line2);border-radius:14px;padding:12px;text-align:center;font-size:12.5px;color:var(--muted)}
.ial div b{display:block;font-size:20px;color:var(--text)}
.ial div.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 12%,transparent);color:var(--text)}
pre.tok{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.claim{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--bg2)}
.claim .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.claim .top b{flex:1;min-width:150px}
.tl{display:flex;margin-top:12px}
.tl div{flex:1;position:relative;text-align:center;font-size:11px;color:var(--dim);min-width:0}
.tl div:before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line2)}
.tl div:first-child:before{display:none}
.tl i{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 4px;background:var(--panel2);border:2px solid var(--line2);position:relative;z-index:1}
.tl .ok i{background:var(--mal);border-color:var(--mal)} .tl .ok:before,.tl .cur:before{background:var(--mal)}
.tl .cur i{border-color:var(--gold);background:var(--gold)} .tl .ok,.tl .cur{color:var(--text)}
.tl span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.letter{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.letter span{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.opt{border:1px solid var(--line2);border-radius:14px;padding:12px;cursor:pointer;background:var(--bg2);text-align:left;width:100%}
.opt.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 10%,transparent)}
.opt b{display:block} .opt span{font-size:12.5px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.map svg{width:100%;height:auto;display:block}
.ctr{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--bg2)}
.ctr.on{border-color:var(--mal)} .ctr b{display:block;font-size:13.5px} .ctr span{font-size:12px;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.slot{padding:8px 0;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-family:var(--mono);font-size:13px}
.slot.on{background:var(--mal);color:#fff;border-color:var(--mal)}
.slot:disabled{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td,tbody tr.sel td{background:color-mix(in srgb,var(--mal) 7%,transparent)}
.risk{display:inline-block;min-width:38px;text-align:center;font-family:var(--mono);font-weight:700;border-radius:8px;padding:2px 6px}
.sig{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.sig .w{font-family:var(--mono);font-size:12px;margin-left:auto;flex:none}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ring{display:flex;gap:14px;align-items:center}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.lock{text-align:center;padding:40px 20px}
.lock .big{font-size:44px}
.qr{display:grid;grid-template-columns:repeat(21,1fr);width:126px;height:126px;background:#fff;padding:6px;border-radius:8px;flex:none}
.qr i{background:#0b1512}.qr s{background:#fff}
/* accessibility */
html.a-lg main{zoom:1.18}
html.a-hc{--bg:#000;--bg2:#000;--panel:#050505;--panel2:#111;--line:#bdbdbd;--line2:#ffffff;--text:#fff;--muted:#f2f2f2;--dim:#d0d0d0;--mal:#00b386;--mal2:#008a66;--mal3:#3dffc8;--gold:#ffd24a;--gold2:#ffe27d;color-scheme:dark}
html.a-hc a,html.a-hc .nav{text-decoration:underline}
html.a-hc :focus-visible{outline:3px solid #ffd24a;outline-offset:2px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.split,.intro{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
  .live{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){.how{grid-template-columns:1fr}.cap,.fgrid,.opts{grid-template-columns:1fr}.svc{grid-template-columns:1fr 1fr}.kpi .v{font-size:20px}.kpis{gap:10px}.step span{font-size:10px}.tl span{font-size:9.5px}}
</style>
</head>

const CLAIM_ST=[['Received','Получено'],['Evidence','Доказательства'],['Review','Рассмотрение'],['Decision','Решение'],['Closed','Закрыто']];

  $('#bGo').onclick=()=>{S.booking={c:ip.c,date:days[ip.d].toISOString(),t:ip.t,code:'IP-'+Math.random().toString(36).slice(2,7).toUpperCase()};save();rIn();toast(T('Appointment booked','Запись подтверждена'),'gold')};
}

/* ---------- FRAUD ---------- */
const STEPN={acct:['Account','Аккаунт'],doc:['Document','Документ'],live:['Liveness','Живость'],rec:['Record match','Сверка']};
function rFraud(){
  const el=$('#v-fraud');S.ff=S.ff||'pending';
  const list=S.fraud.filter(f=>S.ff==='all'||f.status===S.ff);
  if(!S.sel||!S.fraud.find(f=>f.id===S.sel))S.sel=(list[0]||{}).id;
  const p=S.fraud.filter(f=>f.status==='pending');const den=S.fraud.filter(f=>f.status==='denied').length,ap=S.fraud.filter(f=>f.status==='approved').length;
  const rc=s=>s>=70?'var(--red)':s>=45?'var(--amber)':'var(--mal3)';
  const f=S.fraud.find(x=>x.id===S.sel);
  el.innerHTML=`<div class="kpis"><div class="card kpi"><div class="l">${T('Pending review','Ждут проверки')}</div><div class="v">${p.length}</div><div class="d">${T('SLA 4 h','SLA 4 ч')}</div></div><div class="card kpi"><div class="l">${T('Avg risk (pending)','Средний риск')}</div><div class="v">${p.length?Math.round(p.reduce((a,x)=>a+x.score,0)/p.length):0}</div><div class="d">${T('0–100 model score','оценка модели 0–100')}</div></div><div class="card kpi"><div class="l">${T('Approved / denied','Одобрено / отклонено')}</div><div class="v">${ap} / ${den}</div><div class="d">${T('this session','за сессию')}</div></div><div class="card kpi"><div class="l">${T('Auto-blocked today','Автоблок сегодня')}</div><div class="v">${312+den}</div><div class="d">${T('score ≥ 90 · no human review','оценка ≥ 90 · без ручной проверки')}</div></div></div>
  <div class="split"><div><div class="row" style="margin-bottom:10px">${[['pending','Pending','Ожидают'],['approved','Approved','Одобрено'],['denied','Denied','Отклонено'],['all','All','Все']].map(x=>`<button class="chip ${S.ff===x[0]?'on':''}" data-ff="${x[0]}">${T(x[1],x[2])}</button>`).join('')}</div>
  <div class="tw"><table><thead><tr><th>${T('Case','Дело')}</th><th>${T('Applicant','Заявитель')}</th><th>${T('Step','Шаг')}</th><th>${T('Risk','Риск')}</th><th>${T('Status','Статус')}</th></tr></thead><tbody>${list.map(x=>`<tr class="clk ${x.id===S.sel?'sel':''}" data-id="${x.id}"><td class="mono">${x.id}</td><td>${x.name}</td><td>${T(STEPN[x.step][0],STEPN[x.step][1])}</td><td><span class="risk" style="color:${rc(x.score)};background:color-mix(in srgb,${rc(x.score)} 14%,transparent)">${x.score}</span></td><td><span class="pill ${x.status==='approved'?'ok':x.status==='denied'?'bad':'warn'}">${x.status==='pending'?T('pending','ожидает'):x.status==='approved'?T('approved','одобрено'):T('denied','отклонено')}</span></td></tr>`).join('')||`<tr><td colspan="5" class="muted">${T('Queue is empty 🎉','Очередь пуста 🎉')}</td></tr>`}</tbody></table></div></div>
  <div class="card">${f?`<h3><span class="mono">${f.id}</span> · ${f.name}<span class="sp"></span><span class="risk" style="font-size:18px;color:${rc(f.score)}">${f.score}</span></h3>
  <div class="muted" style="font-size:12.5px">${T('Stopped at','Остановлен на шаге')}: ${T(STEPN[f.step][0],STEPN[f.step][1])} · IP <span class="mono">${f.ip}</span> · ${f.dev} · ${f.age} ${T('min ago','мин назад')}</div>
  <div style="margin:10px 0 4px;font-weight:700;font-size:13px">${T('Synthetic-identity & fraud signals','Сигналы синтетической личности и мошенничества')}</div>
  ${f.sig.map(s=>`<div class="sig"><span style="color:${rc(s.w*2.5)}">●</span><span>${T(s.en,s.ru)}</span><span class="w">+${s.w}</span></div>`).join('')}
  <div class="row" style="margin-top:14px">${f.status==='pending'?`<button class="btn pri sm" data-dec="approved">✓ ${T('Approve','Одобрить')}</button><button class="btn danger sm" data-dec="denied">✕ ${T('Deny & flag','Отклонить и пометить')}</button><button class="btn sm" data-dec="esc">↗ ${T('Request in-person','Направить очно')}</button>`:`<span class="pill ${f.status==='approved'?'ok':'bad'}">${f.status==='approved'?T('Approved','Одобрено'):T('Denied · added to watch-list','Отклонено · в стоп-листе')}</span><button class="btn sm" data-dec="pending">↺ ${T('Reopen','Вернуть')}</button>`}</div>`:`<div class="muted">${T('Select a case','Выберите дело')}</div>`}</div></div>`;
  $$('[data-ff]',el).forEach(b=>b.onclick=()=>{S.ff=b.dataset.ff;S.sel=null;save();rFraud()});
  $$('tr[data-id]',el).forEach(r=>r.onclick=()=>{S.sel=r.dataset.id;save();rFraud()});
  $$('[data-dec]',el).forEach(b=>b.onclick=()=>{let d=b.dataset.dec;if(d==='esc'){toast(T('Applicant asked to verify in person','Заявителю предложена очная проверка'),'gold');d='denied'}
    f.status=d;if(d!=='pending'){const nx=S.fraud.find(x=>x.status==='pending');S.sel=nx?nx.id:f.id;toast(f.id+' · '+(d==='approved'?T('approved','одобрено'):T('denied','отклонено')),d==='approved'?'':'bad')}save();render()});
}

/* ---------- FUNNEL ---------- */
function rFunnel(){
  const el=$('#v-funnel');S.fp=S.fp||30;S.fc=S.fc||'all';
  const r=rng(S.fp*13+(S.fc==='web'?1:S.fc==='app'?2:0));
  const base=Math.round(S.fp*(S.fc==='all'?1840:S.fc==='web'?760:1080)*(0.95+r()*.1));
  const rates=[1,0.86+r()*.04,0.71+r()*.05,0.62+r()*.05,0.55+r()*.04,0.52+r()*.03];
  const vals=rates.map((x,i)=>Math.round(base*x)+(i===5||i===0?S.completed:0));
  const labels=[['Started','Начали'],['Account created','Аккаунт'],['Document passed','Документ'],['Liveness passed','Живость'],['Record matched','Сверка'],['IAL2 achieved','IAL2']];
  const W=680,H=300,pad=40,bw=(W-pad*2)/6;const m=cssv('--mal'),g=cssv('--gold'),tx=cssv('--text'),mu=cssv('--muted'),ln=cssv('--line'),rd=cssv('--red');
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(let i=0;i<=4;i++){const y=30+i*(H-90)/4;svg+=`<line x1="${pad}" x2="${W-10}" y1="${y}" y2="${y}" stroke="${ln}"/><text x="${pad-6}" y="${y+4}" text-anchor="end" font-size="10" fill="${mu}">${Math.round(100-i*25)}%</text>`}
  vals.forEach((v,i)=>{const h=(v/vals[0])*(H-90);const x=pad+i*bw+8,y=30+(H-90)-h;
    svg+=`<rect x="${x}" y="${y}" width="${bw-16}" height="${h}" rx="6" fill="${i===5?g:m}" opacity="${i===5?1:.55+i*.08}"><title>${v}</title></rect><text x="${x+(bw-16)/2}" y="${y-6}" text-anchor="middle" font-size="11" font-weight="700" fill="${tx}">${v.toLocaleString()}</text><text x="${x+(bw-16)/2}" y="${H-38}" text-anchor="middle" font-size="10.5" fill="${mu}">${T(labels[i][0],labels[i][1])}</text>`;
    if(i>0){const d=(1-v/vals[i-1])*100;svg+=`<text x="${x+(bw-16)/2}" y="${H-20}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${d>12?rd:mu}">−${d.toFixed(1)}%</text>`}});
  svg+='</svg>';
  const reasons=[['Document','Документ',[['Glare / blur on back side','Блик / размытие оборота',41],['Unsupported document','Неподдерживаемый документ',23],['Expired document','Просроченный документ',19],['Abandoned capture','Брошено на съёмке',17]]],['Liveness','Живость',[['Poor lighting','Плохое освещение',38],['Camera permission denied','Нет доступа к камере',27],['Timed out','Время истекло',21],['PAD attack detected','Атака подменой',14]]],['Record match','Сверка',[['Service no. not found','Личный номер не найден',46],['Name mismatch (marriage)','Несовпадение фамилии',31],['Pre-1990 paper records','Бумажные записи до 1990',23]]]];
  el.innerHTML=`<div class="row" style="margin-bottom:12px">${[[7,'7 days','7 дней'],[30,'30 days','30 дней'],[90,'90 days','90 дней']].map(x=>`<button class="chip ${S.fp===x[0]?'on':''}" data-fp="${x[0]}">${T(x[1],x[2])}</button>`).join('')}<span style="width:12px"></span>${[['all','All channels','Все каналы'],['web','Web','Веб'],['app','Mobile app','Приложение']].map(x=>`<button class="chip ${S.fc===x[0]?'on':''}" data-fc="${x[0]}">${T(x[1],x[2])}</button>`).join('')}</div>
  <div class="kpis"><div class="card kpi"><div class="l">${T('Started','Начали')}</div><div class="v">${vals[0].toLocaleString()}</div></div><div class="card kpi"><div class="l">${T('Completion rate','Доля завершивших')}</div><div class="v ok-t">${(vals[5]/vals[0]*100).toFixed(1)}%</div><div class="d">${T('target 55%','цель 55%')}</div></div><div class="card kpi"><div class="l">${T('Biggest drop-off','Наибольший отвал')}</div><div class="v" style="font-size:20px">${(()=>{let mi=1,md=0;vals.forEach((v,i)=>{if(i){const d=1-v/vals[i-1];if(d>md){md=d;mi=i}}});return T(labels[mi][0],labels[mi][1])})()}</div></div><div class="card kpi"><div class="l">${T('Sent to in-person','Направлено очно')}</div><div class="v">${Math.round(vals[0]*0.06).toLocaleString()}</div><div class="d">${T('fallback path','запасной путь')}</div></div></div>
  <div class="grid2"><div class="card chart"><h3>${T('Proofing funnel · drop-off per step','Воронка проверки · отвал на каждом шаге')}<span class="sp"></span><span class="legend"><span><i style="background:${m}"></i>${T('in progress','в процессе')}</span><span><i style="background:${g}"></i>IAL2</span></span></h3>${svg}<div class="muted" style="font-size:12px">${T('Your own completions in this demo are added live: ','Ваши прохождения в демо добавляются сразу: ')}<b>${S.completed}</b></div></div>
  <div class="card"><h3>${T('Top drop-off reasons','Главные причины отвала')}</h3>${reasons.map(g=>`<div style="font-weight:700;font-size:13px;margin:10px 0 6px">${T(g[0],g[1])}</div>${g[2].map(x=>`<div style="display:flex;gap:10px;align-items:center;font-size:12.5px;margin-bottom:5px"><span style="flex:1">${T(x[0],x[1])}</span><div class="prog" style="width:90px"><i style="width:${x[2]}%"></i></div><span class="mono" style="width:32px;text-align:right">${x[2]}%</span></div>`).join('')}`).join('')}</div></div>`;
  $$('[data-fp]',el).forEach(b=>b.onclick=()=>{S.fp=+b.dataset.fp;save();rFunnel()});
  $$('[data-fc]',el).forEach(b=>b.onclick=()=>{S.fc=b.dataset.fc;save();rFunnel()});
}

$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#aLg').onclick=()=>{S.a11y.lg=!S.a11y.lg;save();render()};
$('#aHc').onclick=()=>{S.a11y.hc=!S.a11y.hc;save();render()};
$('#reset').onclick=()=>{store.clear();S=seed();render();toast(T('Demo reset','Демо сброшено'))};
PT.onLang(()=>render());
document.addEventListener('DOMContentLoaded',()=>render());
})();
</script>
