<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GridMeter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1306;font-size:16px;flex:none}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left;min-height:40px}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.grow{flex:1}
.who{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:12.5px;display:flex;gap:10px;align-items:center}
.who .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--mal) 20%,transparent);color:var(--mal3);font-weight:800;flex:none}
.who b{display:block;font-size:13px} .who span{color:var(--muted)}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.how>div>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold2);flex:none;font-size:13px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f .err{font-size:11.5px;color:var(--red);margin-top:4px;min-height:0}
.input.bad{border-color:var(--red)}
select.input{appearance:auto}
textarea.input{resize:vertical;min-height:80px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{min-height:40px;justify-content:center}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px;min-height:34px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.ok-t{color:var(--mal3)} .bad-t{color:var(--red)} .warn-t{color:var(--amber)} .gold-t{color:var(--gold2)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.grid2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.stack>*+*{margin-top:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:13px;font-weight:600;min-height:36px}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.opt{border:1px solid var(--line2);border-radius:14px;padding:12px;cursor:pointer;background:var(--bg2);text-align:left;width:100%}
.opt.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 10%,transparent)}
.opt b{display:block} .opt span{font-size:12.5px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td,tbody tr.sel td{background:color-mix(in srgb,var(--mal) 7%,transparent)}
.chart svg,.map svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:340px;animation:fade .2s;overflow-wrap:anywhere}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mal2),var(--mal3));transition:width .4s}
.prog.warn i{background:var(--amber)} .prog.bad i{background:var(--red)}
/* balance */
.balcard{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:center}
.gauge{position:relative;width:200px;height:200px}
.gauge svg{width:100%;height:100%}
.gauge .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .c b{display:block;font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gauge .c span{font-size:12px;color:var(--muted)}
.meterbox{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;font-family:var(--mono)}
.lcd{font-size:28px;font-weight:600;letter-spacing:.06em;color:var(--mal3);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.mini div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.mini span{display:block;font-size:11.5px;color:var(--muted)} .mini b{font-size:15px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mal3);box-shadow:0 0 0 0 var(--mal3);animation:pulse 1.6s infinite;vertical-align:middle}
.dot.off{background:var(--red);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--mal3) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.li:last-child{border-bottom:0}
.li .g{flex:1;min-width:0} .li .g small{display:block;color:var(--muted);font-size:12px}
.token{font-family:var(--mono);font-size:20px;letter-spacing:.08em;background:var(--bg2);border:1px dashed var(--gold);border-radius:12px;padding:14px;text-align:center;color:var(--gold2);overflow-wrap:anywhere}
.tl{display:flex;margin-top:12px}
.tl div{flex:1;position:relative;text-align:center;font-size:11px;color:var(--dim);min-width:0}
.tl div:before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line2)}
.tl div:first-child:before{display:none}
.tl i{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 4px;background:var(--panel2);border:2px solid var(--line2);position:relative;z-index:1}
.tl .ok i{background:var(--mal);border-color:var(--mal)} .tl .ok:before,.tl .cur:before{background:var(--mal)}
.tl .cur i{border-color:var(--gold);background:var(--gold)} .tl .ok,.tl .cur{color:var(--text)}
.tl span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.tk{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--bg2)}
.tk .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tk .top b{flex:1;min-width:150px}
.feed{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;max-height:300px;overflow:auto}
.feed div{padding:4px 0;border-bottom:1px dashed var(--line);overflow-wrap:anywhere} .feed .t{color:var(--dim)}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;justify-content:space-between;background:none;border:0;padding:6px 0;text-align:left;width:100%}
.sw i{width:40px;height:22px;border-radius:22px;background:var(--line2);position:relative;flex:none;transition:.2s}
.sw i:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.sw.on i{background:var(--mal)} .sw.on i:after{left:20px}
/* login */
.login{min-height:calc(100vh - 45px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:radial-gradient(ellipse at 20% 10%,color-mix(in srgb,var(--mal) 16%,transparent),transparent 60%),var(--bg)}
.lhero{padding:56px 48px;display:flex;flex-direction:column;justify-content:center;gap:18px;min-width:0}
.lhero h2{font-size:38px;line-height:1.1;margin:0;letter-spacing:-.02em}
.lhero p{color:var(--muted);margin:0;max-width:520px}
.lhero .feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:560px}
.lhero .feat div{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;font-size:13px}
.lhero .feat b{display:block;color:var(--gold2);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.lform{display:grid;place-items:center;padding:30px 20px}
.lform .card{width:100%;max-width:420px;padding:26px;box-shadow:var(--shadow)}
.lform h3{margin:0 0 4px;font-size:20px}
.hide{display:none!important}
.backdrop{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.intro,.grid2e{grid-template-columns:minmax(0,1fr)}.opts4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .backdrop.open{display:block;position:fixed;inset:45px 0 0 0;background:rgba(0,0,0,.35);z-index:1400}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
  .login{grid-template-columns:minmax(0,1fr)}
  .lhero{padding:26px 16px 0}
  .lhero h2{font-size:26px}
  .balcard{grid-template-columns:minmax(0,1fr);justify-items:center}
}
@media (max-width:560px){.how{grid-template-columns:1fr}.fgrid,.opts,.lhero .feat{grid-template-columns:minmax(0,1fr)}.mini{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:20px}.kpis{gap:10px}.tl span{font-size:9.5px}.lform{padding:20px 16px}.lform .card{padding:18px}.lcd{font-size:22px}.card{padding:14px}}
</style>
</head>
<body data-demo-en="GridMeter — Smart metering &amp; distribution reform" data-demo-ru="GridMeter — Умные счётчики и реформа распределения">

<section class="login" id="login">
  <div class="lhero">
    <span class="pill gold" style="align-self:flex-start" data-en="Advanced Metering Infrastructure · Kesaria" data-ru="Интеллектуальный учёт · Кесария"></span>
    <h2 data-en="Prepaid smart meters for every home. Live losses for every feeder." data-ru="Предоплатные умные счётчики в каждом доме. Потери по каждому фидеру — в реальном времени."></h2>
    <p data-en="GridMeter connects 2.4 million AMI meters of the Kesaria Power Distribution Company to one meter-data platform: consumers top up and track usage, the utility sees losses, meter health and demand as it happens." data-ru="GridMeter объединяет 2,4 млн счётчиков АСКУЭ Кесарийской распределительной компании в одну платформу данных: потребители пополняют баланс и следят за расходом, сеть видит потери, состояние счётчиков и нагрузку в моменте."></p>
    <div class="feat">
      <div><b data-en="Consumer" data-ru="Потребитель"></b><span data-en="Prepaid balance, usage chart, recharge, outage reporting" data-ru="Баланс, график расхода, пополнение, сообщение об аварии"></span></div>
      <div><b data-en="Utility" data-ru="Сеть"></b><span data-en="Losses by feeder, meter health, demand curve, crews" data-ru="Потери по фидерам, состояние счётчиков, кривая нагрузки, бригады"></span></div>
    </div>
  </div>
  <div class="lform"><div class="card">
    <h3 data-en="Sign in to GridMeter" data-ru="Вход в GridMeter"></h3>
    <div class="muted" style="font-size:13px;margin-bottom:14px" data-en="Demo credentials are prefilled. Choose a side." data-ru="Демо-данные уже заполнены. Выберите роль."></div>
    <div class="opts" style="margin-bottom:14px">
      <button class="opt on" data-role="c"><b data-en="🏠 Consumer" data-ru="🏠 Потребитель"></b><span data-en="Household account" data-ru="Бытовой абонент"></span></button>
      <button class="opt" data-role="u"><b data-en="⚡ Utility" data-ru="⚡ Сеть"></b><span data-en="Control-room operator" data-ru="Диспетчер сети"></span></button>
    </div>
    <div class="f" style="margin-bottom:10px"><label id="lUserL"></label><input class="input mono" id="lUser" autocomplete="off"><div class="err" id="lUserE"></div></div>
    <div class="f" style="margin-bottom:16px"><label data-en="Password" data-ru="Пароль"></label><input class="input" id="lPass" type="password" value="demo-2026"><div class="err" id="lPassE"></div></div>
    <button class="btn pri" id="loginBtn" style="width:100%" data-en="Sign in" data-ru="Войти"></button>
    <div class="muted" style="font-size:12px;margin-top:12px;text-align:center" data-en="Fictional data · Republic of Kesaria" data-ru="Вымышленные данные · Республика Кесария"></div>
  </div></div>
</section>

<div class="app hide" id="app">
  <aside class="side" id="side">
    <div class="brand"><b>⚡</b><div>GridMeter<small data-en="KPDC · Kesaria" data-ru="КРК · Кесария"></small></div></div>
    <div class="sec" data-en="Consumer" data-ru="Потребитель"></div>
    <div id="navC"></div>
    <div class="sec" data-en="Utility" data-ru="Сеть"></div>
    <div id="navU"></div>
    <div class="grow"></div>
    <div class="who" id="who"></div>
    <button class="btn sm" id="reset" style="margin-top:8px" data-en="Reset demo" data-ru="Сбросить демо"></button>
    <button class="btn sm" id="logout" style="margin-top:4px" data-en="Log out" data-ru="Выйти"></button>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main>
    <div class="head">
      <button class="btn sm menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div style="min-width:0"><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <div class="sp"></div>
      <span class="pill ok" id="livePill"></span>
    </div>
    <div class="intro" id="intro">
      <div class="card"><h3><span data-en="How to try it" data-ru="Как попробовать"></span><span class="sp"></span><button class="btn sm" id="introHide" data-en="Hide" data-ru="Скрыть"></button></h3>
        <div class="how">
          <div><b>1</b><span data-en="As a <b>consumer</b>: watch the balance drain live, open <b>Usage</b>, then <b>Recharge</b> and get a 20-digit token." data-ru="Как <b>потребитель</b>: смотрите, как тает баланс, откройте <b>Расход</b>, затем <b>Пополнение</b> — получите 20-значный токен."></span></div>
          <div><b>2</b><span data-en="Report an outage. It appears in the utility's <b>Field crews</b> queue — assign a crew and watch it move." data-ru="Сообщите об аварии. Она появится у сети в <b>Бригадах</b> — назначьте бригаду и следите за статусом."></span></div>
          <div><b>3</b><span data-en="As the <b>utility</b>: rank feeders by AT&amp;C loss, ping silent meters, trigger demand response on the curve." data-ru="Как <b>сеть</b>: сортируйте фидеры по потерям, опрашивайте молчащие счётчики, включайте управление спросом."></span></div>
        </div></div>
      <div class="card"><dl class="facts">

        <dt data-en="Year · budget" data-ru="Год · бюджет"></dt><dd>2025 · ₹3.03 lakh cr</dd>
        <dt data-en="Client" data-ru="Заказчик"></dt><dd data-en="Power distribution companies, Republic of Kesaria (fictional)" data-ru="Электросетевые компании, Республика Кесария (вымышл.)"></dd>
        <dt data-en="Stack" data-ru="Стек"></dt><dd>AMI · MDM · prepaid</dd>
      </dl></div>
    </div>
    <section class="view" id="v-home"></section>
    <section class="view" id="v-usage"></section>
    <section class="view" id="v-recharge"></section>
    <section class="view" id="v-outage"></section>
    <section class="view" id="v-feeders"></section>
    <section class="view" id="v-health"></section>
    <section class="view" id="v-demand"></section>
    <section class="view" id="v-crews"></section>
  </main>
</div>
<div class="toasts" id="toasts"></div>
<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const P='pt_meters_';
const ls={get(k){try{return JSON.parse(localStorage.getItem(P+k))}catch(e){return null}},set(k,v){try{localStorage.setItem(P+k,JSON.stringify(v))}catch(e){}}};
const loc=()=>PT.lang==='ru'?'ru-RU':'en-US';
const num=(n,d=0)=>Number(n).toLocaleString(loc(),{minimumFractionDigits:d,maximumFractionDigits:d});
const money=(n,d=2)=>'KR '+num(n,d);
const fmtT=d=>new Date(d).toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit'});
const fmtD=d=>new Date(d).toLocaleDateString(loc(),{day:'numeric',month:'short'})+', '+fmtT(d);
function toast(m,c){const t=document.createElement('div');t.className='toast '+(c||'');t.innerHTML=m;$('#toasts').append(t);setTimeout(()=>t.remove(),3800)}

function bars(vals,labels,o){
  const W=640,H=o.h||230,pl=40,pr=10,pt=14,pb=26;const mx=o.max||Math.max(...vals.filter(v=>v!=null),1)*1.12;
  const mu=cssv('--muted'),ln=cssv('--line'),n=vals.length,bw=(W-pl-pr)/n;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(let k=0;k<=4;k++){const y=pt+(H-pt-pb)*k/4;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="${ln}"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="${mu}">${num(mx*(1-k/4),mx<10?1:0)}</text>`}
  vals.forEach((v,i)=>{const x=pl+i*bw;if(v!=null){const h=(H-pt-pb)*v/mx;s+=`<rect x="${x+bw*.15}" y="${H-pb-h}" width="${bw*.7}" height="${Math.max(h,1)}" rx="3" fill="${o.col(i,v)}"><title>${labels[i]}: ${num(v,1)} ${o.unit||''}</title></rect>`}
    if(i%(o.every||1)===0)s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="${mu}">${labels[i]}</text>`});
  if(o.avg!=null){const y=H-pb-(H-pt-pb)*o.avg/mx;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="${cssv('--gold')}" stroke-dasharray="5 4" stroke-width="1.5"/>`}
  return s+'</svg>';
}
function donut(parts,size){
  const R=size/2-12,C=2*Math.PI*R;let off=0;let s=`<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="flex:none;max-width:100%"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${cssv('--line')}" stroke-width="18"/>`;
  const tot=parts.reduce((a,p)=>a+p[1],0);
  parts.forEach(p=>{const L=C*p[1]/tot;s+=`<circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${p[2]}" stroke-width="18" stroke-dasharray="${L} ${C-L}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"/>`;off+=L});
  return s+'</svg>';
}
function spark(vals,w,h,col){const mn=Math.min(...vals),mx=Math.max(...vals);const p=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-3-(v-mn)/(mx-mn||1)*(h-6)).toFixed(1)}`).join(' ');return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px"><polyline points="${p}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/></svg>`}

function pay(){

  let k=0;const tick=()=>{if(!$('#rMsg'))return;$('#rMsg').textContent=steps[k];$('#rProg i').style.width=((k+1)/3*100)+'%';k++;

}
function doRecharge(a,m,auto){

  S.dr.forEach(d=>{s+=`<rect x="${x(d.h)}" y="${y(cap)}" width="${x(Math.min(23,d.h+2))-x(d.h)}" height="${Ht-pb-y(cap)}" fill="${g}" fill-opacity=".12"/>`});
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(cap)}" y2="${y(cap)}" stroke="${rd}" stroke-dasharray="6 4" stroke-width="1.5"/>`;
  const fcP=fc.map((v,h)=>`${x(h)},${y(v-drAt(h)*(h>H?1:0))}`).join(' ');
  s+=`<polyline points="${fcP}" fill="none" stroke="${mu}" stroke-dasharray="4 4" stroke-width="2"/>`;
  const ap=act.map((v,h)=>v==null?null:[x(h),y(v)]).filter(Boolean);
  if(ap.length){s+=`<polygon points="${ap[0][0]},${Ht-pb} ${ap.map(p=>p.join(',')).join(' ')} ${ap[ap.length-1][0]},${Ht-pb}" fill="${m}" fill-opacity=".15"/><polyline points="${ap.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${m}" stroke-width="3" stroke-linejoin="round"/>`;
    const l=ap[ap.length-1];s+=`<circle cx="${l[0]}" cy="${l[1]}" r="10" fill="${g}" fill-opacity=".25"/><circle cx="${l[0]}" cy="${l[1]}" r="5" fill="${g}"/><text x="${l[0]-8}" y="${l[1]-12}" text-anchor="end" font-size="11" font-weight="700" fill="${cssv('--text')}">${num(act[H])} MW</text>`}
  return s+'</svg>';
}

/* ---------- utility: crews ---------- */
function rCrews(){
  const el=$('#v-crews');const L=S.tickets.filter(t=>S.tkf==='all'||(S.tkf==='open'?t.st<3:t.st===3));
  const busy=c=>S.tickets.some(t=>t.crew===c&&t.st>0&&t.st<3);
  el.innerHTML=`<div class="kpis">
   <div class="card kpi"><div class="l">${T('New reports','Новые заявки')}</div><div class="v ${S.tickets.some(t=>t.st===0)?'warn-t':''}">${S.tickets.filter(t=>t.st===0).length}</div><div class="d">${T('awaiting dispatch','ждут бригаду')}</div></div>
   <div class="card kpi"><div class="l">${T('In progress','В работе')}</div><div class="v">${S.tickets.filter(t=>t.st===1||t.st===2).length}</div><div class="d">${T('crews on the way or on site','бригады в пути или на месте')}</div></div>
   <div class="card kpi"><div class="l">${T('Resolved','Устранено')}</div><div class="v ok-t">${S.tickets.filter(t=>t.st===3).length}</div><div class="d">${T('median restore 1 h 52 min','медиана 1 ч 52 мин')}</div></div>
   <div class="card kpi"><div class="l">${T('SAIDI, month to date','SAIDI с начала месяца')}</div><div class="v">${num(118.4-S.tickets.filter(t=>t.st===3).length*.6,1)}</div><div class="d">${T('min per customer','мин на абонента')}</div></div></div>
  <div class="grid2"><div class="card"><h3>${T('Outage tickets','Аварийные заявки')}<span class="sp"></span><span class="chips">${[['all','All','Все'],['open','Open','Открытые'],['done','Resolved','Устранённые']].map(x=>`<button class="chip ${S.tkf===x[0]?'on':''}" data-tf="${x[0]}">${T(x[1],x[2])}</button>`).join('')}</span></h3>
   ${L.map(t=>`<div class="tk"><div class="top"><span style="font-size:18px">${OTYPES[t.type][2]}</span><b>${T(OTYPES[t.type][0],OTYPES[t.type][1])} <span class="mono muted" style="font-weight:500;font-size:12px">${t.id} · ${t.f}</span></b>${t.src==='me'?`<span class="pill gold">${T('via app','из приложения')}</span>`:''}<span class="pill ${t.st===3?'ok':t.st===0?'warn':'gold'}">${T(TST[t.st][0],TST[t.st][1])}</span></div>
    <div class="muted" style="font-size:13px;margin-top:4px">${esc(T(t.addr,t.addrRu||t.addr))} — ${esc(T(t.desc,t.descRu||t.desc))} · ${fmtD(t.ts)}</div>${tline(t.st)}
    ${t.st<3?`<div class="row" style="margin-top:10px">${t.st===0?`<select class="input" style="width:auto;flex:1;min-width:150px" data-cs="${t.id}">${CREWS.map(c=>`<option value="${c[0]}" ${busy(c[0])?'disabled':''}>${c[0]} · ${T(c[1],c[2])}${busy(c[0])?' ('+T('busy','занята')+')':''}</option>`).join('')}</select><button class="btn sm pri" data-tk="assign" data-id="${t.id}">${T('Assign crew','Назначить')}</button>`:t.st===1?`<button class="btn sm" data-tk="site" data-id="${t.id}">${T('Mark on site','Бригада на месте')}</button>`:''}<button class="btn sm" data-tk="resolve" data-id="${t.id}" ${t.st===0?'disabled':''}>${T('Resolve','Закрыть')}</button></div>`:''}</div>`).join('')||`<div class="muted">${T('Nothing here.','Здесь пусто.')}</div>`}</div>
   <div class="card"><h3>${T('Crews on shift','Бригады на смене')}</h3>${CREWS.map(c=>{const t=S.tickets.find(x=>x.crew===c[0]&&x.st>0&&x.st<3);return `<div class="li"><div class="g"><b>${c[0]} · ${T(c[1],c[2])}</b><small>${t?t.id+' · '+T(TST[t.st][0],TST[t.st][1]):T('Available at depot','Свободна, на базе')}</small></div><span class="pill ${t?'gold':'ok'}">${t?T('Busy','Занята'):T('Free','Свободна')}</span></div>`}).join('')}
    <div class="muted" style="font-size:12px;margin-top:10px">${T('Crews advance automatically in the demo: on site after ~10 s, resolved after ~20 s.','В демо бригады продвигаются сами: на месте через ~10 с, устранено через ~20 с.')}</div></div></div>`;
  $$('[data-tf]',el).forEach(b=>b.onclick=()=>{S.tkf=b.dataset.tf;save();rCrews()});
  $$('[data-tk]',el).forEach(b=>b.onclick=()=>{const t=S.tickets.find(x=>x.id===b.dataset.id);const a=b.dataset.tk;
    if(a==='assign'){const sel=$(`[data-cs="${t.id}"]`);const c=sel&&sel.value;if(!c||busy(c))return toast(T('Choose a free crew','Выберите свободную бригаду'),'bad');t.crew=c;t.st=1;t.sim=0;toast(T(c+' dispatched to '+t.id,c+' направлена на '+t.id),'gold')}
    if(a==='site'){t.st=2;t.sim=0}
    if(a==='resolve'){t.st=3;toast(T(t.id+' resolved · consumer notified by SMS',t.id+' закрыта · абонент уведомлён SMS'))}
    save();rCrews();nav()});
}

/* ---------- live simulation ---------- */
let tickN=0;
setInterval(()=>{
  if(!sess)return;tickN++;
  const H=new Date().getHours();
  if(S.H!==H){S.H=H;S.today=S.today.map((v,h)=>h<H?(v==null?+(profile(h)).toFixed(2):v):h===H?0:null)}
  const target=profile(H)*(1+.6*Math.sin(tickN/7))+Math.random()*.4;S.load=+Math.max(.15,S.load+(target-S.load)*.3).toFixed(2);
  S.volt=226+Math.round(Math.random()*7);
  if(S.relay){const e=S.load/60;S.kwh+=e;S.today[H]=+((S.today[H]||0)+e).toFixed(3);S.bal=Math.max(0,S.bal-e*PRICE*3)}
  if(S.bal<=0&&S.relay){S.relay=false;toast(T('Balance exhausted — supply disconnected. Recharge to restore.','Баланс исчерпан — питание отключено. Пополните счёт.'),'bad')}
  if(S.auto.on&&S.bal<S.auto.below)doRecharge(S.auto.amt,'qp',true);
  if(!S.lowWarned&&S.bal<S.thr){S.lowWarned=true;toast(T('Low balance: below ','Низкий баланс: ниже ')+money(S.thr,0),'bad');nav()}
  if(S.bal>=S.thr)S.lowWarned=false;
  S.readRate=+(98.4+Math.random()*.5).toFixed(2);
  const Hd=new Date().getHours();S.dAct[Hd]=Math.round(S.dBase[Hd]*(.98+Math.random()*.05));
  if(tickN%3===0){const k=Object.keys(ISSUES);const ev=[['Last-gasp alarm','Сигнал «последнего вздоха»','bad-t'],['Power restored','Питание восстановлено','ok-t'],['Interval read batch 15 min','Пакет 15-мин данных','muted'],['Prepaid token applied','Токен применён','ok-t'],['Low-credit relay warning','Предупреждение о низком балансе','warn-t'],['Firmware 4.2.1 confirmed','Прошивка 4.2.1 подтверждена','muted']][Math.floor(Math.random()*6)];
    addEv('KM'+(4410000+Math.floor(Math.random()*99999)),ev[0],'',ev[1],ev[2])}
  let ch=false;S.tickets.forEach(t=>{if(t.st===1||t.st===2){t.sim=(t.sim||0)+1;if(t.sim>=5){t.st++;t.sim=0;ch=true;if(t.st===3&&t.src==='me')toast(T('Your report '+t.id+' is resolved','Ваша заявка '+t.id+' устранена'),'gold')}}});
  save();
  if(S.view==='home')liveHome();
  if(S.view==='health'){const f=$('#mFeed');if(f)f.innerHTML=feedHtml();const r=$('#mRead');if(r)r.textContent=num(S.readRate,2)+'%'}
  if(S.view==='demand'&&$('#dChart')){const act=S.dAct.map((v,h)=>h<=Hd?v-drAt(h):null);$('#dChart').innerHTML=demandSvg(act,S.dBase,1900,Hd);$('#dNow').innerHTML=num(act[Hd])+' <span style="font-size:14px">MW</span>'}
  if(S.view==='usage'&&S.umode==='day'&&tickN%5===0)rUsage();
  if(ch){if(S.view==='crews')rCrews();if(S.view==='outage')rOutage();nav()}
},2000);

PT.onLang(()=>render());
document.addEventListener('DOMContentLoaded',()=>{if(sess){role=sess.role;enter()}else loginUI()});
})();
</script>
