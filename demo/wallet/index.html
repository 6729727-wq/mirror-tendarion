<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wallet-ID Credentials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.wrap{max-width:1420px;margin:0 auto;padding:18px 20px 60px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.top h1{margin:0;font-size:22px;display:flex;align-items:center;gap:10px}
.top h1 b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;font-size:13px}
.top .sp{flex:1}.stk{font-family:var(--mono);font-size:11.5px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.how div{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.4}
.how b.n{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1306;font-size:12px}
.layout{display:grid;grid-template-columns:minmax(0,.9fr) 392px minmax(0,1.2fr);grid-template-areas:"feat phone cons";gap:20px;align-items:start}
.a-feat{grid-area:feat;display:flex;flex-direction:column;gap:14px;min-width:0}
.a-phone{grid-area:phone;min-width:0}
.a-cons{grid-area:cons;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.card h4{margin:14px 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:13px;margin:0}
.facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:600}
.feat{display:flex;gap:12px;padding:10px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:.15s}
.feat:hover{border-color:var(--line2);background:var(--panel2)}
.feat .fi{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);font-size:16px}
.feat b{display:block;font-size:13.5px}.feat span{font-size:12.5px;color:var(--muted);line-height:1.45;display:block}
/* phone */
.phone{border-radius:50px;padding:12px;background:linear-gradient(160deg,#2a3b35,#0b1512);box-shadow:var(--shadow),inset 0 0 0 2px #3a4f47;position:sticky;top:60px}
.scr{border-radius:38px;overflow:hidden;background:var(--bg);height:760px;display:flex;flex-direction:column;position:relative;isolation:isolate}
.sbar{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12.5px;font-weight:700;flex:none}
.sbar .isl{width:96px;height:24px;background:#000;border-radius:14px}
.ahd{display:flex;align-items:center;gap:8px;padding:4px 14px 8px;flex:none}
.ahd .lg{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;font-weight:800;font-size:11px;flex:none}
.ahd .tt{flex:1;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obadge{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--mal3)}
.obadge i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.obadge.off{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,transparent);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.pbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 14px 18px;position:relative;scrollbar-width:thin}
.ptr{height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:12px;gap:8px;transition:height .2s}
.ptr .spn{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--mal3)}
.ptr.go .spn{animation:sp .7s linear infinite}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);padding:6px 4px 14px;flex:none}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--dim);cursor:pointer;padding:4px 0;min-width:0;transition:transform .12s}
.tabbar button:active{transform:scale(.88)}
.tabbar button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabbar button.on{color:var(--mal3)}.tabbar button.on svg{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--mal) 60%,transparent))}
.view{animation:vin .28s cubic-bezier(.2,1,.4,1)}
@keyframes vin{from{opacity:0;transform:translateX(14px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.h2{font-size:19px;font-weight:800;margin:2px 0 4px;line-height:1.25}
.sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.pbtn{width:100%;justify-content:center;margin-top:8px}
.btn:active,.tap:active{transform:scale(.96)}
.back{border:0;background:none;color:var(--muted);cursor:pointer;font-weight:600;padding:2px 0 8px;font-size:13px}
.sect{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px;display:flex;justify-content:space-between}
/* credential cards */
.stack{position:relative;padding-bottom:8px}
.cc{position:relative;isolation:isolate;aspect-ratio:1.586;border-radius:18px;color:#fff;padding:12px 14px;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.2,1,.4,1),filter .3s}
.stack .cc{margin-top:-46%}.stack .cc:first-child{margin-top:0}
.stack .cc:hover{transform:translateY(-8px)}
.stack .cc{clip-path:inset(0 round 18px);-webkit-mask-image:-webkit-radial-gradient(white,black)}
.stack .cc:not(:last-child) .cm,.stack .cc:not(:last-child) .cb{display:none!important}
.stack .cc:not(:last-child) .stamp{top:31px;font-size:12px;padding:2px 10px;border-width:2px}
.cc:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 9px);pointer-events:none}
.cc:after{content:"";position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 68%);pointer-events:none}
.k-mdl{background:radial-gradient(130% 120% at 0 0,#21c99a 0,#0e7458 48%,#093a2e 100%)}
.k-vreg{background:radial-gradient(130% 120% at 0 0,#4a8de0 0,#1d4f8f 50%,#0c2547 100%)}
.k-ins{background:radial-gradient(130% 120% at 0 0,#e6c27a 0,#a07425 50%,#4b340d 100%)}
.k-age{background:radial-gradient(130% 120% at 0 0,#a58bf5 0,#6346c4 50%,#2a1a66 100%)}
.cc .ct{display:flex;align-items:center;gap:9px;position:relative;z-index:1}
.emb{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#f3d79a,#c69a3e);color:#1a1306;font-weight:800;font-size:10.5px;flex:none}
.cc .t1{font-size:9.5px;font-weight:800;letter-spacing:.14em;opacity:.85}.cc .t2{font-size:13px;font-weight:700}
.cc .fmt{margin-left:auto;font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.16);white-space:nowrap}
.cc .cm{display:flex;gap:11px;margin-top:10px;flex:1;position:relative;z-index:1;min-height:0}
.portrait{width:22%;aspect-ratio:.82;border-radius:9px;overflow:hidden;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.35);align-self:flex-start;background:#e9e2cf}
.portrait svg{display:block;width:100%;height:100%}
.cf{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.cf i{display:block;font-style:normal;font-size:8.5px;opacity:.7;text-transform:uppercase;letter-spacing:.08em}
.cf b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cf .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cc .cb{font-size:10px;opacity:.85;position:relative;z-index:1;display:flex;justify-content:space-between;gap:8px;align-items:flex-end;font-family:var(--mono)}
.cc .big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stamp{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);border:3px solid #fff;color:#fff;font-weight:900;letter-spacing:.18em;padding:4px 14px;border-radius:8px;font-size:18px;background:rgba(200,30,30,.75);animation:stp .5s cubic-bezier(.2,1.6,.4,1)}
.stamp.sus{background:rgba(200,120,10,.8)}
@keyframes stp{from{transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);opacity:0}}
.cc.revoked{filter:grayscale(.75) brightness(.8);box-shadow:0 0 0 2px var(--red),0 10px 26px rgba(0,0,0,.35)}
.cc.suspended{filter:saturate(.5);box-shadow:0 0 0 2px var(--amber),0 10px 26px rgba(0,0,0,.35)}
.cc.nw{animation:cin .7s cubic-bezier(.2,1.2,.4,1)}
@keyframes cin{from{transform:translateY(60px) scale(.9);opacity:0}}
.shake{animation:shk .5s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.flip{perspective:1200px}
.flin{position:relative;aspect-ratio:1.586;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.9,.3,1)}
.flin.fl{transform:rotateY(180deg)}
.flin>.cc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flin>.cc.bk{transform:rotateY(180deg);background:#f6f2e6;color:#14251f;flex-direction:row;gap:12px;align-items:center}
.flin>.cc.bk:after{display:none}
.bk canvas{width:42%;aspect-ratio:1;border-radius:8px;flex:none}
.bk .bf{flex:1;font-size:11px;line-height:1.5;min-width:0}
.bk .bf div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.kv span{color:var(--muted)}.kv b{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li{display:flex;align-items:center;gap:11px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;width:100%;text-align:left;cursor:pointer}
.li .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--panel2);flex:none;font-size:16px}
.li .sp{flex:1;min-width:0}.li .sp b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .sp div{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px}
.seg button{border:1px solid var(--line2);background:var(--panel);border-radius:12px;padding:9px 8px;cursor:pointer;text-align:left;font-size:12px;line-height:1.3;transition:.15s}
.seg button b{display:block;font-size:13px}
.seg button.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 12%,transparent)}
.chk{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.chk:last-child{border-bottom:0}.chk .sp{flex:1;min-width:0}.chk small{color:var(--muted);font-family:var(--mono);font-size:10.5px}
.sw{position:relative;width:38px;height:22px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line2);transition:.2s;cursor:pointer}
.sw i:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--mal)}.sw input:checked+i:after{transform:translateX(16px)}
.sw input:disabled+i{opacity:.5}
.qrbox{background:#fff;border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#14251f;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
.qrbox canvas{width:200px;height:200px}
.qrbox .tm{font-family:var(--mono);font-size:12px;color:#4a5e55}
.qrbar{width:200px;height:4px;border-radius:2px;background:#e3e9e5;overflow:hidden}.qrbar i{display:block;height:100%;background:#0e9a72;transition:width 1s linear}
.note{border-radius:12px;padding:9px 11px;font-size:12px;line-height:1.4;margin:8px 0;display:flex;gap:8px}
.note.warn{background:color-mix(in srgb,var(--amber) 13%,transparent);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent)}
.note.bad{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red);border:1px solid color-mix(in srgb,var(--red) 40%,transparent)}
.note.ok{background:color-mix(in srgb,var(--mal) 12%,transparent);color:var(--mal3);border:1px solid color-mix(in srgb,var(--mal) 40%,transparent)}
/* onboarding */
.onb{display:flex;flex-direction:column;min-height:100%;gap:10px}
.vf{position:relative;aspect-ratio:1;border-radius:22px;background:radial-gradient(circle at 50% 40%,#1c3a31,#050b09);overflow:hidden;display:grid;place-items:center}
.vf .lic{width:74%;aspect-ratio:1.586;border-radius:12px;background:radial-gradient(130% 120% at 0 0,#21c99a,#0e7458 60%,#093a2e);transform:rotate(-4deg);box-shadow:0 10px 30px rgba(0,0,0,.6);opacity:.9}
.vf .crn{position:absolute;inset:16%;border:0}
.vf .crn:before,.vf .crn:after{content:"";position:absolute;width:34px;height:34px;border:3px solid var(--mal3)}
.vf .crn:before{left:0;top:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}.vf .crn:after{right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.vf .ln{position:absolute;left:12%;right:12%;height:2px;background:var(--mal3);box-shadow:0 0 14px var(--mal3);animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{top:22%}to{top:78%}}
.vf.got .crn:before,.vf.got .crn:after{border-color:var(--gold2)}
.ocr{font-family:var(--mono);font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px;line-height:1.7;min-height:80px}
.ocr div{animation:vin .3s}
.face{position:relative;width:220px;height:220px;margin:6px auto}
.face svg{width:100%;height:100%}
.face .ring{fill:none;stroke-width:5;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .12s linear}
.face .dot{fill:var(--mal3);opacity:0;animation:dt .4s forwards}
@keyframes dt{to{opacity:1}}
.prov{display:flex;flex-direction:column;gap:6px}
.pv{display:flex;gap:10px;align-items:center;font-size:12.5px;padding:8px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.pv .st{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;border:2px solid var(--line2)}
.pv.run .st{border-color:var(--line2);border-top-color:var(--mal3);animation:sp .7s linear infinite}
.pv.ok .st{background:var(--mal);border-color:var(--mal);color:#fff}
.pv.bad .st{background:var(--red);border-color:var(--red);color:#fff}
.pv.wn .st{background:var(--amber);border-color:var(--amber);color:#1a1306}
.pv.skip{opacity:.45}
.pv .sp{flex:1;min-width:0}.pv small{display:block;color:var(--muted);font-family:var(--mono);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgb{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.pgb i{display:block;height:100%;background:linear-gradient(90deg,var(--mal),var(--mal3));transition:width .4s}
.bigok{width:84px;height:84px;border-radius:50%;margin:18px auto 6px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;font-size:40px;animation:pop .5s cubic-bezier(.2,1.5,.4,1);box-shadow:0 0 0 10px color-mix(in srgb,var(--mal) 18%,transparent)}
/* push + sheet */
#pushHost{position:absolute;left:10px;right:10px;top:8px;z-index:40;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.push{border-radius:18px;padding:10px 12px;display:flex;gap:10px;background:color-mix(in srgb,var(--panel2) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);box-shadow:0 14px 34px rgba(0,0,0,.35);animation:pdrop .45s cubic-bezier(.2,1.3,.4,1);pointer-events:auto}
.push.bad{border-color:var(--red)}.push.out{animation:pup .3s forwards}
.push .ic{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;font-size:14px}
.push.bad .ic{background:linear-gradient(135deg,#f07a7a,#b52d2d)}
.push .sp{flex:1;min-width:0}.push b{display:block;font-size:13px}.push p{margin:1px 0 0;font-size:12px;color:var(--muted);line-height:1.35}
.push .hd{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
@keyframes pdrop{from{transform:translateY(-130%);opacity:0}}@keyframes pup{to{transform:translateY(-130%);opacity:0}}
.shade{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.45);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-radius:24px 24px 0 0;border-top:1px solid var(--line2);padding:10px 16px 22px;max-height:88%;overflow:auto;animation:sup .32s cubic-bezier(.2,1,.4,1)}
.sheet:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 12px}
.sheet h4{margin:0 0 4px;font-size:17px}
@keyframes sup{from{transform:translateY(100%)}}
.rp{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin:10px 0}
.rp .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);font-size:18px;flex:none}
.fid{width:90px;height:90px;margin:20px auto 8px;border-radius:24px;border:3px solid var(--mal3);display:grid;place-items:center;font-size:40px;animation:fidp 1s ease-in-out infinite}
@keyframes fidp{50%{transform:scale(.92);box-shadow:0 0 0 12px color-mix(in srgb,var(--mal) 18%,transparent)}}
/* consoles */
.vdev{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:20px;padding:14px}
.vscr{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:230px;position:relative;overflow:hidden}
.vscan{display:grid;place-items:center;height:200px;position:relative}
.vscan canvas{width:120px;height:120px;border-radius:10px;opacity:.9}
.vscan .ln{position:absolute;left:25%;right:25%;height:2px;background:var(--mal3);box-shadow:0 0 12px var(--mal3);animation:scan2 .8s ease-in-out infinite alternate}
@keyframes scan2{from{top:18%}to{top:82%}}
.vres{display:flex;gap:12px;align-items:center;border-radius:14px;padding:12px;margin-bottom:10px;animation:pop .35s}
.vres.ok{background:color-mix(in srgb,var(--mal) 16%,transparent);border:1px solid var(--mal)}
.vres.bad{background:color-mix(in srgb,var(--red) 16%,transparent);border:1px solid var(--red)}
.vres.wn{background:color-mix(in srgb,var(--amber) 16%,transparent);border:1px solid var(--amber)}
.vres .big{font-size:26px;font-weight:900;line-height:1}
.vres .portrait{width:56px}
.vflds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}
.vflds div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;min-width:0}
.vflds i{display:block;font-style:normal;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.vflds b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vflds .hid b{filter:blur(4px);opacity:.5}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.ctl select{width:auto;padding:7px 10px;font-size:13px}

function drawQR(cv,seed){
  const n=29,ctx=cv.getContext('2d'),px=cv.width,m=px/(n+4);let h=hash(seed);
  const rnd=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return (h>>>0)/4294967296};
  ctx.fillStyle='#fff';ctx.fillRect(0,0,px,px);ctx.fillStyle='#0b1a15';
  const box=(x,y)=>ctx.fillRect((x+2)*m,(y+2)*m,m+.4,m+.4);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){if((i<8&&j<8)||(i>n-9&&j<8)||(i<8&&j>n-9))continue;if(rnd()<.5)box(i,j)}
  [[0,0],[n-7,0],[0,n-7]].forEach(([x,y])=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++)if(i===0||i===6||j===0||j===6||(i>1&&i<5&&j>1&&j<5))box(x+i,y+j)});
}

  else if(v.phase==='scan')el.innerHTML='<div class="vscan"><canvas id="vq" width="240" height="240"></canvas><div class="ln"></div></div>';
  else if(v.phase==='wait')el.innerHTML='<div class="vscan"><div style="text-align:center"><div class="pv run" style="display:inline-flex;border:0;background:none"><span class="st"></span></div><b style="display:block">'+T('Waiting for holder consent…','Ждём согласия владельца…')+'</b><div class="muted mono" style="font-size:11px">BLE · '+T('session key','ключ сессии')+' ECDH P-256 · '+T('request','запрос')+': '+PRESET[VERIF[S.vmode].want].f.length+' '+T('elements','эл.')+'</div></div></div>';
  else if(v.phase==='declined')el.innerHTML='<div class="vres bad"><div class="big">✕</div><div><b>'+T('Holder declined','Владелец отказал')+'</b><div class="muted" style="font-size:12px">'+T('No data received.','Данные не получены.')+'</div></div></div><button class="btn" data-a="vReset">'+T('New check','Новая проверка')+'</button>';

async function runChecks(){
  const v=ui.v,creds=[...new Set(v.give.map(k=>F[k].c))].map(c=>S.reg.find(r=>r.mine&&r.k===c&&r.wst));
  const tp=S.tamper;
  v.steps=[
    {en:'Secure session (BLE, ECDH)',ru:'Защищённая сессия (BLE, ECDH)',ok:tp!=='replay',d:tp==='replay'?'SessionTranscript nonce reused — replay':'SessionTranscript '+hex(v.nonce).slice(0,8)},
    {en:'Issuer signature (MSO / SD-JWT)',ru:'Подпись ведомства (MSO / SD-JWT)',ok:tp!=='forge',d:tp==='forge'?'ES256 verify failed — signer not NT-DS-0419':'ES256 ✓ · DS cert NT-DS-0419'},
    {en:'Issuer certificate chain',ru:'Цепочка сертификатов ведомства',ok:true,d:'NT-IACA-2026 ∈ VICAL v14 ✓'},
    {en:'Revocation / status list',ru:'Отзыв / список статусов',ok:true},
    {en:'Device binding',ru:'Привязка к устройству',ok:true,d:'deviceSignature over transcript · key se-7f3a ✓'},
    {en:'Data integrity (digests)',ru:'Целостность данных (дайджесты)',ok:tp!=='alter',d:tp==='alter'?'valueDigests[12] mismatch: birth_date':'all '+v.give.length+' element digests match'},
    {en:'Validity period',ru:'Срок действия',ok:true,d:'validFrom ≤ now ≤ validUntil ✓'}
  ].map(s=>({...s,s:''}));
  // revocation
  const rv=v.steps[3];
  const cacheOld=!S.vonline;
  if(!S.vonline){rv.d=T('offline · cached list from ','офлайн · кэш списка от ')+hhmm(S.vcache);}else{S.vcache=Date.now();rv.d='status list v'+S.slv+' · '+T('fetched live','получен онлайн')}
  const badC=creds.find(c=>c&&c.st!=='active');
  if(badC&&!(cacheOld&&badC.chg>S.vcache)){rv.ok=false;rv.sus=badC.st==='suspended';rv.d=badC.id+' → '+badC.st.toUpperCase()}
  else if(cacheOld)rv.warn=true;
  let res='ok',msg=T('All checks passed. Data is authentic and belongs to this phone.','Все проверки пройдены. Данные подлинные и принадлежат этому телефону.');
  for(const s of v.steps){s.s='run';renderVer();await sleep(380);
    if(res==='bad'){s.s='skip';continue}
    if(!s.ok){s.s=s.sus?'wn':'bad';res='bad';msg=T('Rejected: ','Отклонено: ')+T(s.en,s.ru).toLowerCase()+' — '+s.d;buzz()}
    else if(s.warn){s.s='wn';if(res==='ok'){res='wn';msg=T('Valid, but revocation status is from an offline cache — reconnect to confirm.','Подлинно, но статус отзыва из офлайн-кэша — подключитесь для подтверждения.')}}
    else s.s='ok';}
  v.phase='done';v.res=res;v.msg=msg;renderVer();
  S.kVer++;const V=VERIF[S.vmode];
  S.acts.push({t:Date.now(),en:'Shared with '+V.nen,ru:'Передано: '+V.nru,den:v.give.length+' elements · '+(res==='ok'?'accepted':res==='wn'?'accepted (cached status)':'rejected'),dru:v.give.length+' эл. · '+(res==='ok'?'принято':res==='wn'?'принято (кэш)':'отклонено'),ok:res,ic:V.ic});
  audit('VERIFY',(res==='bad'?'FAILED ':'OK ')+'presentation · '+V.nen+' · '+v.give.length+' elements','Проверка '+(res==='bad'?'НЕ пройдена':'пройдена')+' · '+V.nru+' · '+v.give.length+' эл.','');
  save();renderKpis();
  toast(res==='ok'?'✓ '+T('Verifier: valid','Проверяющий: действительно'):res==='wn'?T('Verifier: valid, status cached','Проверяющий: подлинно, статус из кэша'):'✕ '+T('Verifier: rejected','Проверяющий: отклонено'),res==='ok'?'':res==='wn'?'warn':'bad');
  if(S.onb&&ui.tab==='act')renderPhone(false);
}

function renderLog(){const el=$('#log');if(!el)return;el.innerHTML=S.audit.slice().reverse().map(e=>'<div><span class="t">'+hms(e.t)+'</span> <span class="k" style="color:'+({REVOKE:'var(--red)',SUSPEND:'var(--amber)',VERIFY:'var(--blue)',ISSUE:'var(--mal3)',PROVISION:'var(--mal3)'}[e.k]||'var(--gold2)')+'">'+e.k+'</span> '+esc(T(e.en,e.ru))+' <span class="h">#'+e.h.slice(0,6)+'</span></div>').join('')}
function setStatus(id,st){
  const r=S.reg.find(x=>x.id===id);if(!r)return;r.st=st;r.chg=Date.now();S.slv++;
  audit(st==='revoked'?'REVOKE':st==='suspended'?'SUSPEND':'REINSTATE',id+' → '+st+' · status list v'+S.slv+' published',id+' → '+stName(st).toLowerCase()+' · опубликован список v'+S.slv,id);
  toast((st==='revoked'?'⛔ ':st==='suspended'?'⏸ ':'▶ ')+id+' — '+stName(st),st==='active'?'':st==='revoked'?'bad':'warn');
  if(r.mine&&r.wst){if(S.online)setTimeout(()=>syncWallet(),700);else toast(T('Holder phone is offline — wallet updates when it reconnects','Телефон владельца офлайн — кошелёк обновится при подключении'),'warn')}
  save();renderReg(id);renderKpis();
}
function syncWallet(manual){
  if(!S.online){if(manual)toast(T('Offline — cannot refresh status list','Офлайн — нельзя обновить статусы'),'warn');return}
  let ch=0;S.reg.filter(r=>r.mine).forEach(r=>{if(r.wst===r.st)return;const was=r.wst;r.wst=r.st;ch++;
    const K=KIND[r.k],nm=T(K.en,K.ru);
    if(!was){ui.nw=r.id;push(T('New credential added','Добавлено удостоверение'),nm+' · '+r.id,false,K.ic)}
    else if(r.st==='revoked')push(T('Credential revoked','Удостоверение отозвано'),T(nm+' was revoked by the Transport Authority.',nm+': отозвано Транспортным агентством.'),true,'⛔');
    else if(r.st==='suspended')push(T('Credential suspended','Удостоверение приостановлено'),T(nm+' is suspended pending review.',nm+': приостановлено до проверки.'),true,'⏸');
    else push(T('Credential reinstated','Удостоверение восстановлено'),T(nm+' is active again.',nm+' снова действует.'),false,'✓');
  });
  S.statusAt=Date.now();save();
  if(S.onb){renderPhone(false);if(ch&&ui.tab==='wallet'&&!ui.card){const st=$$('.stack .cc');st.forEach(c=>{const r=S.reg.find(x=>x.id===c.dataset.v);if(r&&r.st!=='active')c.classList.add('shake')})}}
  if(manual&&!ch)toast(T('Status list v'+S.slv+' — all up to date','Список статусов v'+S.slv+' — всё актуально'));
}

setInterval(()=>{const d=new Date();$('#clock').textContent=d.getHours()+':'+pad(d.getMinutes());
  if(S.qr){const left=Math.ceil((S.qr.exp-Date.now())/1000);if(left<=0){S.qr=null;if(ui.v.phase==='idle')renderVer();if(ui.tab==='share'&&!ui.sheet)renderPhone(false);toast(T('QR expired — show a new one','QR истёк — покажите новый'),'warn')}else{const t=$('#qrT');if(t)t.textContent=T('expires in ','истекает через ')+left+'s · nonce '+S.qr.nonce;const b=$('#qrBar');if(b)b.style.width=(left/90*100)+'%'}}
  if(Math.random()<.3){S.kVer+=1+Math.floor(Math.random()*3);$('#kVer').textContent=fmtN(S.kVer)}
},1000);

function renderAll(){renderFeats();renderIssueForm();renderPhone();renderSheet();renderVer();renderReg();renderLog();renderKpis()}
PT.onLang(()=>{renderFeats();renderIssueForm();renderPhone(false);renderSheet();renderVer();renderReg();renderLog();renderKpis()});
document.addEventListener('DOMContentLoaded',renderAll);
})();
</script>
