nb.forEach(([v,w])=>{if(Q.has(v)&&dist[u]+w<dist[v]){dist[v]=dist[u]+w;prev[v]=u}})}
let best=null;Object.keys(LNS).forEach(l=>{const n=b+'|'+l;if(dist[n]!=null&&(best===null||dist[n]<dist[best]))best=n});if(!best||dist[best]>=1e9)return null;

function priced(S){const out=[];const byD={},byW={};S.trips.slice().sort((a,b)=>a.tin-b.tin).forEach(t=>{if(!t.tout){out.push(Object.assign({},t,{ch:0,cap:0}));return}const d=d0(t.tin),w=wk0(t.tin);const ud=byD[d]||0,uw=byW[w]||0;const ch=Math.max(0,Math.min(t.fare-(t.adj||0),CAPD-ud,CAPW-uw));byD[d]=ud+ch;byW[w]=uw+ch;out.push(Object.assign({},t,{ch:Math.round(ch*100)/100,cap:ch<t.fare-(t.adj||0)-.001?1:0}))});return out}

$$('[data-rb]',el).forEach(b=>b.onclick=async()=>{const g=b.dataset.rb;b.disabled=true;b.textContent='…';await wait(1400);if(S.gst[g].st==='offline'&&!S.gst[g].tech&&Math.random()<.5){toast(T(`${g}: no response — send a technician`,`${g}: нет ответа — отправьте техника`),'bad');K.refresh();return}S.gst[g]=Object.assign(S.gst[g],{st:'ok',tech:0});log(g,'reboot');K.save();K.refresh();toast(T(`${g} back in service`,`${g} снова в работе`))});
$$('[data-tc]',el).forEach(b=>b.onclick=()=>{S.gst[b.dataset.tc].tech=1;log(b.dataset.tc,'tech');K.save();K.refresh();toast(T('Work order created · technician dispatched','Наряд создан · техник отправлен'))});
$$('[data-op]',el).forEach(b=>b.onclick=()=>modal({title:T(`Free exit on ${b.dataset.op}?`,`Свободный выход на ${b.dataset.op}?`),body:`<p>${T('Flaps stay open for exit, no fares are charged on exit at this gate. Use for crowding or emergencies.','Створки открыты на выход, плата на выходе не списывается. Для давки и ЧС.')}</p>`,buttons:[{t:['Cancel','Отмена']},{t:['Open gate','Открыть'],cls:'danger',fn(){S.gst[b.dataset.op].st='open';S.gst[b.dataset.op].t=Date.now();log(b.dataset.op,'open');K.save();K.refresh()}}]}));
$$('[data-ok]',el).forEach(b=>b.onclick=()=>{S.gst[b.dataset.ok].st='ok';log(b.dataset.ok,'ok');K.save();K.refresh()})},
upd(el){if(K.modalOpen)return;const f=$('#gfeed',el);if(f)f.innerHTML=feedHtml(K.S);const n=Object.values(K.S.gst).filter(g=>g.st!=='ok').length;if(this._n!=null&&n!==this._n&&!el.contains(document.activeElement))K.renderView(el);this._n=n}};
function feedHtml(S){return S.feed.slice(0,14).map((e,i)=>`<div class="fe ${i<3&&Date.now()-e.t<3e3?'new':''}"><span class="mono">${fmtTs(e.t)}</span><b>${e.g}</b><span>${e.card} · ${e.io==='in'?T('in','вход'):T('out','выход')}</span><span class="${e.ok?'':'bad-t'}" style="margin-left:auto">${e.ok?(e.io==='out'?qd(e.fare):'✓'):L(DENY[e.why])}</span></div>`).join('')||`<div class="empty">${T('Waiting for taps…','Ожидание проходов…')}</div>`}
APP.loginArt=`<svg class="bg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><rect width="400" height="300" style="fill:var(--gold);opacity:.07"/>${[['--red',60],['--blue',150],['--mal',240]].map(([c,y],i)=>`<path d="M-10 ${y} Q 200 ${y-60+i*40} 410 ${y+20}" fill="none" style="stroke:var(${c})" stroke-width="8" opacity=".45" stroke-linecap="round"/>`).join('')}<rect x="250" y="120" width="96" height="60" rx="10" style="fill:var(--panel);stroke:var(--gold)" stroke-width="3" opacity=".9"/><path d="M276 150 q8 -12 0 -24 M288 156 q14 -18 0 -36 M300 162 q20 -24 0 -48" fill="none" style="stroke:var(--gold)" stroke-width="3" transform="translate(4 12)"/></svg>`;

APP.slug=ROW.slug;APP.name=APP.name||ROW.name;
APP.facts=Object.assign({tender:ROW.title,yb:ROW.year+' · '+ROW.budget,client:[ROW.client[0]+', '+(APP.country||['Republic of Nordania','Республика Нордания'])[0]+' (fictional)',ROW.client[1]+', '+(APP.country||['Republic of Nordania','Республика Нордания'])[1]+' (вымышл.)'],stack:ROW.stack},APP.facts||{});
K.start(APP);
})();
</script>
