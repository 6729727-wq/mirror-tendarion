<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgriPay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.app[hidden],.login[hidden]{display:none}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;font-size:16px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left;min-height:40px}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.nav .cnt.r{background:var(--red);color:#fff}
.grow{flex:1}
.who{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:12.5px;display:flex;gap:10px;align-items:center}
.who .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--mal) 22%,transparent);color:var(--mal3);font-weight:800;flex:none}
.who b{display:block;font-size:13px}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.grid2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.gside{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:14px}
.mt{margin-top:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f .err{font-size:11.5px;color:var(--red);margin-top:4px}
.input.bad{border-color:var(--red)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea.input{min-height:76px;resize:vertical}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:var(--mono)}
tr.sel td{background:color-mix(in srgb,var(--mal) 10%,transparent)}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--panel2)}
tr.tot td{font-weight:800;background:var(--panel2)}
td.neg{color:var(--red)}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.chart svg,.map svg{width:100%;height:auto;display:block}
.map{border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.map polygon.pc{cursor:pointer;transition:opacity .15s}
.map polygon.pc:hover{opacity:.82}
.legend{display:flex;gap:6px 14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.log{font-size:13px}
.log div{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.log div:last-child{border:0}
.log .t{font-family:var(--mono);font-size:11.5px;color:var(--dim);flex:none;width:44px;padding-top:2px}
.log span{flex:1;min-width:0;overflow-wrap:anywhere}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.modal{position:fixed;inset:0;z-index:2500;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;padding:60px 16px 20px;overflow:auto}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r2);max-width:640px;width:100%;padding:22px;box-shadow:var(--shadow);position:relative}
.modal .x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-size:16px}
.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.dl div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
.dl span{display:block;font-size:11.5px;color:var(--muted)} .dl b{font-size:14px;overflow-wrap:anywhere}
.chk,.f label.chk{display:flex;color:var(--text);font-weight:500;gap:10px;align-items:flex-start;font-size:13.5px;cursor:pointer;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);margin-bottom:6px}
.chk input{width:18px;height:18px;margin-top:1px;accent-color:var(--mal);flex:none}
.chk span{flex:1;min-width:0}
.chk small{display:block;color:var(--muted);font-size:11.5px}
.chk.dis{opacity:.5;padding-block:6px;cursor:not-allowed}
.chk .r{flex:none;margin-left:auto;padding-left:6px;font-family:var(--mono);font-size:12px;color:var(--gold2);white-space:nowrap}
.issues div{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;margin-bottom:6px;font-size:13px;background:var(--bg2);border:1px solid var(--line)}
.issues div.e{border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.issues div.w{border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.issues span{flex:1;min-width:0;overflow-wrap:anywhere}
.issues b.i{flex:none;width:20px;text-align:center}
.steps{display:flex;margin:6px 0 4px}
.step{flex:1;text-align:center;position:relative;font-size:11.5px;color:var(--muted);min-width:0}
.step:before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line2)}
.step:first-child:before{display:none}
.step .dot{width:28px;height:28px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line2);position:relative;z-index:1;font-weight:800;font-size:12px}
.step.ok .dot{background:var(--mal);border-color:var(--mal);color:#fff}
.step.ok:before,.step.cur:before{background:var(--mal)}
.step.cur .dot{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 18%,transparent)}
.step span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.plist{display:flex;flex-direction:column;gap:8px;max-height:760px;overflow:auto}
.pc2{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg2);cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:left;width:100%}
.pc2:hover{border-color:var(--mal)}
.pc2.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 10%,transparent)}
.pc2 b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc2 small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc2 svg{grid-row:span 2;width:70px;height:28px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);background:color-mix(in srgb,var(--gold) 10%,transparent);font-size:13.5px;margin-bottom:14px}
.banner span{flex:1;min-width:180px}
.photo{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg2);margin-top:10px}
.photo img{width:120px;height:90px;object-fit:cover;border-radius:8px;flex:none;background:var(--panel2)}
.photo div{flex:1;min-width:0;font-size:12.5px;overflow-wrap:anywhere}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stack{display:flex;height:14px;border-radius:9px;overflow:hidden;background:var(--line);margin:10px 0}
.stack i{display:block;height:100%}
.bl{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.bl:last-child{border:0}
.bl span{min-width:0}
.bl b{font-family:var(--mono);white-space:nowrap}
.bl.neg b{color:var(--red)}
.bl.tot{font-size:15px;border-top:2px solid var(--line2);border-bottom:0;padding-top:10px;margin-top:4px}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13.5px}
.toggle input{width:40px;height:22px;appearance:none;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;flex:none;transition:.15s}
.toggle input:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.toggle input:checked{background:var(--mal)} .toggle input:checked:after{left:21px}
.qi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg2);cursor:pointer;margin-bottom:8px;text-align:left;width:100%;display:block}
.qi:hover{border-color:var(--mal)} .qi.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 9%,transparent)}
.qi .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qi .top b{flex:1;min-width:0;font-size:13.5px;overflow-wrap:anywhere}
.qi .rs{font-size:12.5px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .bg{font-size:34px}
.hint{font-size:12px;color:var(--muted)}
/* login */
.login{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 500px at 70% -10%,color-mix(in srgb,var(--mal) 16%,transparent),transparent),radial-gradient(900px 400px at 0% 110%,color-mix(in srgb,var(--gold) 12%,transparent),transparent)}
.lbox{width:100%;max-width:960px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:center}
.lhero h2{font-size:34px;line-height:1.15;margin:12px 0;letter-spacing:-.02em}
.lhero p{color:var(--muted);margin:0 0 16px}
.lhero ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:14px}
.lhero li{display:flex;gap:10px;align-items:flex-start}
.lhero li b{color:var(--mal3)}
.lcard{padding:24px;border-radius:var(--r2);box-shadow:var(--shadow)}
.lcard h3{margin:0 0 4px;font-size:19px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.role{border:1px solid var(--line2);border-radius:12px;padding:10px;cursor:pointer;background:var(--bg2);text-align:left}
.role b{display:block;font-size:13.5px} .role span{font-size:11.5px;color:var(--muted)}
.role.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 12%,transparent)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:960px){.gside{grid-template-columns:minmax(0,1fr)}.plist{max-height:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
  .lbox{grid-template-columns:minmax(0,1fr)}
  .lhero h2{font-size:26px}
  .grid2e{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}.dl{grid-template-columns:1fr 1fr}.kpi .v{font-size:20px}.kpis{gap:10px}.step span{font-size:9.5px}.modal .box{padding:18px 14px}.lhero ul{display:none}.big{font-size:28px}.plist{grid-template-columns:minmax(0,1fr)}.photo img{width:90px;height:68px}.card{padding:14px}}
</style>
</head>
<body data-demo-en="AgriPay — Farm subsidies &amp; land parcel system (CAP IACS)" data-demo-ru="AgriPay — Субсидии фермерам и система участков (CAP IACS)">
<section class="login" id="login">
  <div class="lbox">
    <div class="lhero">
      <span class="pill gold" data-en="Agricultural Paying Agency · Republic of Arvenia" data-ru="Сельскохозяйственное платёжное агентство · Республика Арвения"></span>
      <h2 data-en="Declare your fields. Satellites check. Payments follow." data-ru="Заявите поля. Спутник проверит. Выплата придёт."></h2>

      <ul>
        <li><b>✓</b><span data-en="Geospatial application pre-filled from the land parcel register" data-ru="Геопространственная заявка, заполненная из реестра участков"></span></li>
        <li><b>✓</b><span data-en="Area monitoring: NDVI time series matched to every declared crop" data-ru="Мониторинг площадей: ряд NDVI сверяется с каждой заявленной культурой"></span></li>
        <li><b>✓</b><span data-en="Geotagged photos resolve doubts without a field visit" data-ru="Фото с геометкой снимают сомнения без выезда инспектора"></span></li>
      </ul>
    </div>
    <div class="card lcard">
      <h3 data-en="Sign in to AgriPay" data-ru="Вход в AgriPay"></h3>

      <div class="roles">
        <button class="role on" data-role="farmer"><b data-en="Farmer" data-ru="Фермер"></b><span data-en="Dovan Agro · 11 parcels" data-ru="Дован Агро · 11 участков"></span></button>
        <button class="role" data-role="inspector"><b data-en="Inspector" data-ru="Инспектор"></b><span data-en="Selva regional office" data-ru="Региональный офис Сельва"></span></button>
      </div>
      <div class="f" style="margin-bottom:10px"><label data-en="Farmer ID or email" data-ru="ID фермера или эл. почта"></label><input class="input" id="lEmail" value="m.dovan@dovanagro.ar" autocomplete="username"><div class="err" id="lEmailE"></div></div>
      <div class="f" style="margin-bottom:14px"><label data-en="Password" data-ru="Пароль"></label><input class="input" id="lPass" type="password" value="agripay-demo" autocomplete="current-password"><div class="err" id="lPassE"></div></div>
      <button class="btn pri" id="loginBtn" style="width:100%;justify-content:center;padding:12px" data-en="Sign in with demo account" data-ru="Войти в демо-аккаунт"></button>
      <div class="muted" style="font-size:11.5px;margin-top:10px;text-align:center" data-en="Secured by national eID (demo mode)" data-ru="Защищено национальной eID (демо-режим)"></div>
    </div>
  </div>
</section>
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><b>❦</b><div>AgriPay<small data-en="CAP IACS · Campaign 2026" data-ru="CAP IACS · Кампания 2026"></small></div></div>
    <div class="sec" data-en="Overview" data-ru="Обзор"></div>
    <button class="nav" data-view="dash"><span class="ic">◧</span><span data-en="Dashboard" data-ru="Сводка"></span></button>
    <div class="sec" data-en="Farmer" data-ru="Фермер"></div>
    <button class="nav" data-view="app"><span class="ic">▦</span><span data-en="Application &amp; map" data-ru="Заявка и карта"></span><span class="cnt" id="cntA"></span></button>
    <button class="nav" data-view="sat"><span class="ic">◉</span><span data-en="Satellite checks" data-ru="Спутниковый контроль"></span><span class="cnt r" id="cntS"></span></button>
    <button class="nav" data-view="pay"><span class="ic">€</span><span data-en="Payment calculation" data-ru="Расчёт выплаты"></span></button>
    <div class="sec" data-en="Paying agency" data-ru="Платёжное агентство"></div>
    <button class="nav" data-view="insp"><span class="ic">⚑</span><span data-en="Inspector queue" data-ru="Очередь инспектора"></span><span class="cnt" id="cntI"></span></button>
    <div class="grow"></div>
    <div class="who" id="who"></div>
    <div class="row" style="margin-top:8px">
      <button class="btn sm" id="logout" style="flex:1;justify-content:center" data-en="Log out" data-ru="Выйти"></button>
      <button class="btn sm" id="reset" style="flex:1;justify-content:center" data-en="Reset demo" data-ru="Сбросить демо"></button>
    </div>
  </aside>
  <main>
    <div class="head">
      <button class="btn sm menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <span class="sp"></span>
      <button class="btn sm" id="roleP" title="Switch role"></button>
    </div>
    <section class="view" id="v-dash"></section>
    <section class="view" id="v-app"></section>
    <section class="view" id="v-sat"></section>
    <section class="view" id="v-pay"></section>
    <section class="view" id="v-insp"></section>
  </main>
</div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="fileIn" accept="image/*" capture="environment" hidden>
<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru);
const L=o=>o?(o[PT.lang]||o.en):'';
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P='pt_agripay_', KEY=P+'state';
const loc=()=>PT.lang==='ru'?'ru-RU':'en-GB';
const D=86400000;

const fmtDs=t=>new Date(t).toLocaleDateString(loc(),{day:'numeric',month:'short'});

/* ---------- monitoring logic ---------- */
function baseStatus(p){if(!p.decl)return'none';const m=mae(p.series,p.decl.crop);return m<0.085?'ok':m<0.2?'warn':'bad'}
function satStatus(p){
  if(!p.decl)return'none';
  if(p.insp)return p.insp.decision==='approved'?'ok':'bad';
  const b=baseStatus(p);
  if(b==='warn'&&p.photo)return'ok';
  if(b==='bad'&&p.photo)return'review';
  return b;
}
const stPill=s=>`<span class="pill ${SST[s][2]}">${T(SST[s][0],SST[s][1])}</span>`;
function statusNote(p){
  const s=satStatus(p),b=baseStatus(p);
  if(s==='none')return T('Parcel is not part of the application.','Участок не включён в заявку.');
  if(p.insp)return p.insp.decision==='approved'?T('Confirmed by field inspection on ','Подтверждено выездной проверкой ')+fmtD(p.insp.t)+'.':T('Rejected after field inspection: ','Отклонено после выездной проверки: ')+esc(p.insp.notes);
  if(s==='ok'&&b==='warn')return T('Warning resolved by geotagged photo — evidence accepted automatically.','Предупреждение снято фото с геометкой — доказательство принято автоматически.');
  if(s==='ok')return T('Satellite signal matches the declared crop throughout the season.','Спутниковый сигнал соответствует заявленной культуре весь сезон.');
  const g=classify(p.series);

  if(s==='review')return T('Photo received; signal conflict is too strong for automatic clearance — sent to an inspector.','Фото получено; расхождение слишком сильное для автоматического снятия — передано инспектору.');
  return T('No development consistent with ','Нет развития, соответствующего культуре ')+cropName(p.decl.crop)+T('. Closest profile: ','. Ближайший профиль: ')+cropName(g)+T('. Payment for this parcel is withheld.','. Выплата по участку удержана.');

/* ---------- validation ---------- */
function validate(){
  const out=[];const e=(sev,pid,en,ru,fix)=>out.push({sev,pid,en,ru,fix});
  const dec=S.parcels.filter(p=>p.decl);
  if(dec.reduce((a,p)=>a+p.decl.area,0)<1)e('e',null,'Total declared area is below the 1 ha minimum.','Общая заявленная площадь меньше минимума 1 га.');
  dec.forEach(p=>{const d=p.decl;
    if(!(d.area>0))e('e',p.id,`Parcel ${p.n}: declared area must be greater than zero.`,`Участок ${p.n}: заявленная площадь должна быть больше нуля.`);
    else if(d.area<0.3)e('e',p.id,`Parcel ${p.n}: below the 0.30 ha minimum parcel size.`,`Участок ${p.n}: меньше минимального размера 0,30 га.`);
    if(d.area>p.lpis+0.005)e('e',p.id,`Parcel ${p.n}: ${d.area.toFixed(2)} ha exceeds the LPIS maximum eligible area ${p.lpis.toFixed(2)} ha.`,`Участок ${p.n}: ${d.area.toFixed(2)} га больше максимальной допустимой площади LPIS ${p.lpis.toFixed(2)} га.`,'max');
    d.eco.forEach(k=>{if(!ECO[k].ok.includes(d.crop))e('e',p.id,`Parcel ${p.n}: eco-scheme “${ECO[k].en}” is not compatible with ${CROPS[d.crop].en}.`,`Участок ${p.n}: эко-схема «${ECO[k].ru}» несовместима с культурой «${CROPS[d.crop].ru}».`,'eco')});
    const s=satStatus(p);
    if(s==='bad')e('w',p.id,`Parcel ${p.n}: satellite monitoring finds no ${CROPS[d.crop].en.toLowerCase()} — payment withheld unless resolved.`,`Участок ${p.n}: мониторинг не видит культуру «${CROPS[d.crop].ru}» — выплата удержана до решения.`);
    if(s==='warn')e('w',p.id,`Parcel ${p.n}: monitoring warning — eco-scheme payment on hold until evidence is provided.`,`Участок ${p.n}: предупреждение мониторинга — эко-выплата приостановлена до доказательств.`);
  });
  S.parcels.filter(p=>!p.decl).forEach(p=>e('w',p.id,`Parcel ${p.n} (${p.lpis.toFixed(2)} ha) is not declared — no payment for it.`,`Участок ${p.n} (${p.lpis.toFixed(2)} га) не заявлен — выплаты по нему не будет.`));
  const arable=dec.filter(p=>CROPS[p.decl.crop].ar);const arA=arable.reduce((a,p)=>a+p.decl.area,0);
  const by={};arable.forEach(p=>by[p.decl.crop]=(by[p.decl.crop]||0)+p.decl.area);
  const nC=Object.keys(by).length,main=Math.max(0,...Object.values(by));
  if(arA>10&&nC<2)e('e',null,'GAEC 7: arable land over 10 ha needs at least 2 crops.','GAEC 7: на пашне больше 10 га нужно не менее 2 культур.');
  if(arA>30&&nC<3)e('e',null,'GAEC 7: arable land over 30 ha needs at least 3 crops.','GAEC 7: на пашне больше 30 га нужно не менее 3 культур.');
  if(arA>10&&main/arA>0.75)e('e',null,`GAEC 7: main crop covers ${Math.round(main/arA*100)}% of arable land (max 75%).`,`GAEC 7: основная культура занимает ${Math.round(main/arA*100)}% пашни (макс. 75%).`);
  return out;
}

/* ---------- payment ---------- */
function calc(){
  const rows=[];let det=0;
  S.parcels.forEach(p=>{
    const r={p,det:0,biss:0,eco:0,cp:0,red:0,notes:[],st:satStatus(p)};rows.push(r);
    if(!p.decl)return;const d=p.decl;
    const max=p.insp&&p.insp.decision==='approved'?Math.min(p.insp.measured,p.lpis):p.lpis;
    const dA=Math.max(0,Math.min(d.area,max));
    r.det=dA;r.biss=dA*R.biss;
    d.eco.forEach(k=>{if(ECO[k].ok.includes(d.crop))r.eco+=dA*ECO[k].r});
    const cp=CROPS[d.crop].cp;if(cp)r.cp=dA*R[cp];
    if(r.st==='bad'||r.st==='review'){
      r.red+=r.biss+r.eco+r.cp;r.notes.push(r.st==='bad'?T('Ineligible (non-compliant)','Неприемлемо (нарушение)'):T('On hold (inspection)','Удержано (проверка)'));
      if(r.st==='bad'){const pen=1.5*d.area*R.biss*0.5;r.red+=pen;r.pen=pen;r.notes.push(T('Over-declaration penalty','Штраф за завышение'))}
      r.det=0;
    }else{
      if(r.st==='warn'&&r.eco){r.red+=r.eco;r.notes.push(T('Eco-scheme on hold','Эко-выплата приостановлена'))}
      const over=d.area-dA;
      if(over>0.005){r.notes.push(T('Paid on determined area','Оплата по установленной площади'));if(over>Math.min(2,dA*0.03)){const pen=1.5*over*R.biss;r.red+=pen;r.pen=pen;r.notes.push(T('Over-declaration penalty','Штраф за завышение'))}}
    }
    det+=r.det;
  });
  const crissA=Math.min(det,R.crissCap),criss=crissA*R.criss;
  const youngA=S.young?Math.min(det,R.youngCap):0,young=youngA*R.young;
  rows.forEach(r=>{r.criss=det?criss*r.det/det:0;r.young=det?young*r.det/det:0;r.gross=r.biss+r.eco+r.cp+r.criss+r.young;r.net=r.gross-r.red});
  const sum=k=>rows.reduce((a,r)=>a+(r[k]||0),0);
  const gross=sum('gross'),red=sum('red'),sub=gross-red;
  const fd=Math.max(0,sub-R.fdFree)*R.fd;
  return{rows,det,criss,young,biss:sum('biss'),eco:sum('eco'),cp:sum('cp'),gross,red,fd,total:Math.max(0,sub-fd),declared:S.parcels.reduce((a,p)=>a+(p.decl?p.decl.area:0),0)};
}

  const x=i=>pl+(W-pl-pr)*i/(N-1),y=v=>pt+(H-pt-pb)*(1-v);

  const st=satStatus(p);const col=st==='bad'?rd:st==='warn'?am:st==='review'?g:m;
  let s=`<svg viewBox="0 0 ${W} ${H}" ${o.mini?'preserveAspectRatio="none"':''}>`;
  if(!o.mini){
    [0,.25,.5,.75,1].forEach(v=>s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${ln}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="${mu}" font-family="JetBrains Mono,monospace">${v.toFixed(2)}</text>`);
    for(let i=0;i<N;i+=3)s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="${mu}" font-family="Inter,sans-serif">${fmtDs(wkDate(i))}</text>`;
  }
  if(p.decl){
    const up=[],dn=[];for(let i=0;i<N;i++){const v=prof(p.decl.crop,i/(N-1));up.push(x(i)+','+y(Math.min(1,v+.085)));dn.unshift(x(i)+','+y(Math.max(0,v-.085)))}
    s+=`<polygon points="${up.concat(dn).join(' ')}" fill="${g}" fill-opacity=".16"/>`;
    if(!o.mini){let d='';for(let i=0;i<N;i++)d+=(i?'L':'M')+x(i)+' '+y(prof(p.decl.crop,i/(N-1)));s+=`<path d="${d}" fill="none" stroke="${g}" stroke-width="1.5" stroke-dasharray="5 4"/>`}
  }
  let d='',pen=false;p.series.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);pen=true});
  s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${o.mini?2:2.4}" stroke-linejoin="round"/>`;
  if(!o.mini)p.series.forEach((v,i)=>{s+=v==null?`<text x="${x(i)}" y="${y(0)-4}" text-anchor="middle" font-size="11" fill="${mu}">☁</text>`:`<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="${col}"><title>${fmtD(wkDate(i))} · NDVI ${v.toFixed(2)}</title></circle>`});
  return s+'</svg>';
}
function samplePhoto(crop){
  const c=document.createElement('canvas');c.width=240;c.height=180;const x=c.getContext('2d');
  const sky=x.createLinearGradient(0,0,0,80);sky.addColorStop(0,'#7fb3e0');sky.addColorStop(1,'#cfe4f2');x.fillStyle=sky;x.fillRect(0,0,240,80);
  x.fillStyle='#4a6b45';x.fillRect(0,68,240,14);
  x.fillStyle=CROPS[crop].c;x.fillRect(0,78,240,102);
  x.strokeStyle='rgba(0,0,0,.18)';x.lineWidth=2;for(let i=-10;i<20;i++){x.beginPath();x.moveTo(120,78);x.lineTo(i*24,180);x.stroke()}
  x.fillStyle='rgba(0,0,0,.45)';x.fillRect(0,160,240,20);x.fillStyle='#fff';x.font='10px monospace';x.fillText('GNSS ±3m · '+new Date().toISOString().slice(0,16).replace('T',' '),6,173);
  return c.toDataURL('image/jpeg',.7);
}
function shrink(file,cb){
  const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,240/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};im.onerror=()=>toast(T('This file is not a readable image','Файл не является изображением'),'bad');im.src=fr.result};fr.readAsDataURL(file);
}

  const oth=OTHERS.filter(o=>!S.others[o.id]).map(o=>({key:o.id,own:false,o,holder:L(typeof o.holder==='string'?{en:o.holder}:o.holder),crop:o.crop,area:o.area,prio:o.prio,reason:L(o.reason)}));
  return own.concat(oth);
}

  <div class="kpis">
    <div class="card kpi"><div class="l">${T('Open cases','Открытые дела')}</div><div class="v">${q.length}</div><div class="d">${T('Selva region','регион Сельва')}</div></div>
    <div class="card kpi"><div class="l">${T('High priority','Высокий приоритет')}</div><div class="v" style="color:var(--red)">${q.filter(x=>x.prio==='high').length}</div><div class="d">${T('visit within 5 days','выезд за 5 дней')}</div></div>
    <div class="card kpi"><div class="l">${T('Decided','Решено')}</div><div class="v">${decided.length}</div><div class="d">${decided.filter(d=>d.dec==='approved').length} ${T('approved','одобрено')} · ${decided.filter(d=>d.dec==='rejected').length} ${T('rejected','отклонено')}</div></div>
    <div class="card kpi"><div class="l">${T('Check sample','Выборка проверок')}</div><div class="v">1.0%</div><div class="d">${T('risk-based · CAP AMS','по рискам · CAP AMS')}</div></div>
  </div>
  <div class="gside">
    <div><div class="card"><h3>${T('Queue','Очередь')}<span class="sp"></span><span class="hint">${q.length}</span></h3>${q.map(x=>`<button class="qi ${it&&x.key===it.key?'on':''}" data-q="${x.key}"><div class="top"><b class="mono">${x.key}</b><span class="pill ${PRIO[x.prio][2]}">${T(PRIO[x.prio][0],PRIO[x.prio][1])}</span></div><div class="rs">${esc(x.holder)} · ${cropName(x.crop)} · ${ha(x.area)}</div><div class="rs">${esc(x.reason)}</div></button>`).join('')||`<div class="empty"><div class="bg">✓</div>${T('Queue is empty','Очередь пуста')}</div>`}</div></div>
    <div>${it?`
      <div class="card"><h3>${T('Case','Дело')} <span class="mono">${it.key}</span><span class="sp"></span><span class="pill ${PRIO[it.prio][2]}">${T(PRIO[it.prio][0],PRIO[it.prio][1])}</span></h3>
        <div class="dl"><div><span>${T('Holder','Владелец')}</span><b>${esc(it.holder)}</b></div><div><span>${T('Declared','Заявлено')}</span><b>${cropName(it.crop)}</b></div><div><span>${T('Declared area','Площадь')}</span><b>${ha(it.area)}</b></div></div>
        <div class="issues"><div class="e"><b class="i">⚑</b><span>${esc(it.reason)}${it.own?'<br><small class="hint">'+T('Payment at stake: ','Сумма под риском: ')+eur(calcIf(it.p,'approved')-calcIf(it.p,'rejected'))+'</small>':'<br><small class="hint">'+T('Payment at stake: ','Сумма под риском: ')+eur(it.o.impact*it.area/it.area*1)+'</small>'}</span></div></div>
        <div class="grid2e">
          ${it.own?`<div class="map">${mapSvg({sel:it.p.id,pfx:'i',status:false})}</div>`:''}
          <div class="chart" style="${it.own?'':'grid-column:1/-1'}">${ndviSvg(sp,{h:it.own?300:220})}</div>
        </div>
        ${it.own&&it.p.photo?`<div class="photo"><img src="${it.p.photo.img}" alt=""><div><b>${T('Farmer evidence','Доказательство фермера')}</b><br>${esc(it.p.photo.name)}<br>GPS ${it.p.photo.lat}, ${it.p.photo.lon} · ±${it.p.photo.acc} m<br>${fmtD(it.p.photo.t)}</div></div>`:''}
      </div>
      <div class="card mt"><h3>${T('Field-visit report','Акт выездной проверки')}</h3>
        <div class="fgrid">
          <div class="f"><label>${T('Visit date','Дата выезда')}</label><input class="input" type="date" id="iDate" value="${todayISO}" ${ro?'disabled':''}></div>
          <div class="f"><label>${T('Measurement method','Метод измерения')}</label><select class="input" id="iMeth" ${ro?'disabled':''}><option value="gnss">${T('GNSS perimeter walk','Обход по GNSS')}</option><option value="ortho">${T('Ortho-image delineation','По ортофото')}</option><option value="tape">${T('Tape measurement','Рулеткой')}</option></select></div>
          <div class="f"><label>${T('Measured area, ha','Измеренная площадь, га')}</label><input class="input mono" type="number" step="0.01" id="iArea" value="${it.own?it.p.lpis.toFixed(2):(it.area-(it.o.id==='AR-40922-02'?1.8:0)).toFixed(2)}" ${ro?'disabled':''}><div class="err" id="iAreaE"></div></div>
          <div class="f"><label>${T('Crop observed on site','Культура на месте')}</label><select class="input" id="iCrop" ${ro?'disabled':''}>${DECL.concat('bare').map(k=>`<option value="${k}" ${k===(it.own?it.p.act:it.o.act)?'selected':''}>${cropName(k)}</option>`).join('')}</select><div class="hint">${T('Satellite suggests: ','Спутник предполагает: ')}${cropName(classify(sp.series))}</div></div>
          <div class="f full"><label>${T('Findings','Выводы')}</label><textarea class="input" id="iNotes" ${ro?'disabled':''} placeholder="${T('Describe what was observed on the parcel…','Опишите, что обнаружено на участке…')}"></textarea><div class="err" id="iNotesE"></div></div>
        </div>
        <div class="row mt"><button class="btn pri" id="iOk" ${ro?'disabled':''}>✓ ${T('Approve','Одобрить')}</button><button class="btn danger" id="iNo" ${ro?'disabled':''}>✕ ${T('Reject','Отклонить')}</button><span class="hint">${T('Approve with a different observed crop corrects the declaration.','Одобрение с другой культурой исправит заявку.')}</span></div>
      </div>`:`<div class="card empty"><div class="bg">✓</div>${T('All cases decided. New cases arrive after each satellite pass.','Все дела решены. Новые появятся после следующего пролёта спутника.')}</div>`}
    </div>
  </div>
  <div class="card mt"><h3>${T('Decisions','Решения')}</h3><div class="tw"><table><thead><tr><th>${T('Parcel','Участок')}</th><th>${T('Holder','Владелец')}</th><th>${T('Crop','Культура')}</th><th class="num">${T('Measured','Измерено')}</th><th>${T('Decision','Решение')}</th><th>${T('Date','Дата')}</th><th>${T('Findings','Выводы')}</th></tr></thead><tbody>
  ${decided.map(d=>`<tr><td class="mono">${d.id}</td><td>${esc(d.holder)}</td><td>${cropName(d.crop)}</td><td class="num">${(+d.area).toFixed(2)}</td><td>${d.dec==='approved'?`<span class="pill ok">${T('Approved','Одобрено')}</span>`:`<span class="pill bad">${T('Rejected','Отклонено')}</span>`}</td><td>${fmtD(d.t)}</td><td style="white-space:normal;min-width:200px">${esc(d.notes)}</td></tr>`).join('')||`<tr><td colspan="7" class="muted">${T('No decisions yet','Решений пока нет')}</td></tr>`}
  </tbody></table></div></div>`;
  $$('[data-q]',el).forEach(b=>b.onclick=()=>{S.qSel=b.dataset.q;save();rInsp()});
  bindRoleSw(el);
  if(!it||ro)return;
  const decide=dec=>{
    const m=r2(+$('#iArea').value),notes=$('#iNotes').value.trim(),obs=$('#iCrop').value;let ok=true;
    $('#iAreaE').textContent=m>0?'':(ok=false,T('Enter the measured area','Введите измеренную площадь'));
    $('#iNotesE').textContent=dec==='rejected'&&notes.length<10?(ok=false,T('Rejection needs findings (10+ characters)','Для отказа нужны выводы (от 10 символов)')):'';
    if(!ok)return;
    const txt=notes||T('Declared crop confirmed on site.','Заявленная культура подтверждена на месте.');
    if(it.own){const p=it.p;const before=calc().total;
      if(dec==='approved'&&obs!==p.decl.crop&&obs!=='bare'){p.decl.crop=obs;p.decl.eco=p.decl.eco.filter(k=>ECO[k].ok.includes(obs))}
      p.insp={decision:dec,measured:m,observed:obs,notes:txt,t:Date.now(),method:$('#iMeth').value};
      addLog(`Inspector ${dec} parcel ${p.n} (${m.toFixed(2)} ha measured)`,`Инспектор ${dec==='approved'?'одобрил':'отклонил'} участок ${p.n} (измерено ${m.toFixed(2)} га)`);
      save();render();toast(`${dec==='approved'?'✓':'✕'} ${T('Decision recorded','Решение записано')}<br>${T('Farmer payment ','Выплата фермеру ')}${eur(before)} → <b>${eur(calc().total)}</b>`,dec==='approved'?'':'bad');
    }else{S.others[it.key]={decision:dec,measured:m,notes:txt,t:Date.now()};addLog(`Inspector ${dec} case ${it.key}`,`Инспектор ${dec==='approved'?'одобрил':'отклонил'} дело ${it.key}`);save();render();toast((dec==='approved'?'✓ ':'✕ ')+T('Decision recorded for ','Решение записано: ')+it.key,dec==='approved'?'':'bad')}
    S.qSel=null;
  };
  $('#iOk').onclick=()=>decide('approved');$('#iNo').onclick=()=>decide('rejected');
}
function calcIf(p,dec){const bk=p.insp;p.insp={decision:dec,measured:p.lpis,notes:'',t:0};const t=calc().total;p.insp=bk;return t}

/* ---------- shell ---------- */
$$('.nav').forEach(b=>b.onclick=()=>go(b.dataset.view));
$$('.role').forEach(b=>b.onclick=()=>{$$('.role').forEach(r=>r.classList.toggle('on',r===b));S.role=b.dataset.role;$('#lEmail').value=S.role==='inspector'?'i.radek@aapa.gov.ar':'m.dovan@dovanagro.ar'});
$('#loginBtn').onclick=()=>{const e=$('#lEmail').value.trim(),p=$('#lPass').value;let ok=true;
  $('#lEmailE').textContent=/^\S+@\S+\.\S+$/.test(e)||/^AR-\d+/i.test(e)?'':(ok=false,T('Enter a valid email or farmer ID','Введите адрес или ID фермера'));
  $('#lPassE').textContent=p.length>=4?'':(ok=false,T('Enter the password','Введите пароль'));
  if(!ok)return;S.user=e;S.view=S.role==='inspector'?'insp':'dash';save();render();toast(T('Signed in as ','Вход выполнен: ')+esc(e))};
$('#roleP').onclick=()=>setRole(S.role==='inspector'?'farmer':'inspector');
$('#logout').onclick=()=>{S.user=null;save();render()};
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#reset').onclick=()=>{Object.keys(localStorage).filter(k=>k.startsWith(P)).forEach(k=>localStorage.removeItem(k));location.reload()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
PT.onLang(()=>{draft=null;render();if($('#modal').classList.contains('on'))closeModal()});
$$('.role').forEach(r=>r.classList.toggle('on',r.dataset.role===S.role));
render();
})();
</script>
