<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Procura Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.wrap{max-width:1320px;margin:0 auto;padding:16px 20px 90px}
.hdr{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand b{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal),var(--gold));color:#fff;font-size:17px}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:0}
.srch{flex:1;min-width:220px;position:relative}
.srch input{width:100%;padding-left:38px;height:44px;font-size:15px}
.srch:before{content:"⌕";position:absolute;left:13px;top:9px;font-size:20px;color:var(--dim)}
.role{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.role button{border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:13px;padding:8px 13px;border-radius:9px;cursor:pointer}
.role button.on{background:var(--mal);color:#fff}
.hint{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.hint>div{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px dashed color-mix(in srgb,var(--gold) 55%,transparent);border-radius:12px;background:color-mix(in srgb,var(--gold) 6%,transparent);font-size:13.5px}
.hint>div>b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#111;font-size:12px}
.facts{display:flex;flex-wrap:wrap;padding:0;overflow:hidden;margin-bottom:14px}
.facts>div{flex:1 1 150px;padding:10px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:-1px}
.facts small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);font-weight:700}
.facts span{font-weight:700;font-size:13.5px}
.nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;position:sticky;top:45px;background:var(--bg);z-index:20}
.nav button{flex:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:13.5px;padding:11px 13px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.nav button.on{color:var(--text);border-bottom-color:var(--gold)}
.nav button em{font-style:normal;background:var(--mal);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;margin-left:5px}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.cl{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.fac{position:sticky;top:100px;max-height:calc(100vh - 110px);overflow:auto}
.fac h4{margin:14px 0 7px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim)}
.fac h4:first-child{margin-top:0}
.fac label{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0;cursor:pointer}
.fac label span{flex:1}.fac label i{font-style:normal;color:var(--dim);font-size:11.5px;font-family:var(--mono)}
.fac input[type=checkbox]{accent-color:var(--mal);width:15px;height:15px}
.fac input[type=range]{width:100%;accent-color:var(--gold)}
.fbtn{display:none}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:13px}
.bar .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:12px}
.pc{display:flex;flex-direction:column;gap:8px;padding:14px;transition:.15s}
.pc:hover{border-color:var(--line2);transform:translateY(-2px)}
.pc .ic{height:86px;border-radius:10px;display:grid;place-items:center;font-size:36px;position:relative}
.pc .ic .sb{position:absolute;left:8px;top:8px}
.pc .nm{font-weight:700;font-size:14px;line-height:1.3;cursor:pointer}
.pc .nm:hover{color:var(--mal3)}
.pc .meta{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.bdg{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--muted)}
.bdg.taa{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 45%,transparent)}
.bdg.s508{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 45%,transparent)}
.bdg.cld{color:var(--mal3);border-color:color-mix(in srgb,var(--mal2) 45%,transparent)}
.bdg.sbz{color:var(--gold2);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.pc .pr{display:flex;align-items:baseline;gap:6px;margin-top:auto}
.pc .pr b{font-size:18px;font-variant-numeric:tabular-nums}
.pc .pr small{color:var(--muted);font-size:11.5px}
.pc .act{display:flex;gap:6px;align-items:center}
.pc .act label{font-size:12px;display:flex;gap:5px;align-items:center;color:var(--muted);cursor:pointer;margin-right:auto}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:900;background:var(--panel2);border:1px solid var(--gold);border-radius:14px;padding:9px 12px;display:none;gap:10px;align-items:center;box-shadow:var(--shadow);max-width:calc(100vw - 24px);font-size:13px}
.tray.on{display:flex}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cmp td:first-child{color:var(--muted);font-weight:600;white-space:nowrap;position:sticky;left:0;background:var(--panel)}
.cmp td{min-width:170px}
.best{color:var(--mal3);font-weight:800}
.g2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.g3{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:14px;align-items:start}
.card h3{margin:0 0 12px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card h3 .sp{flex:1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.hl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.hl label{display:flex;gap:7px;align-items:center;font-size:12.5px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:var(--bg2)}
.hl label.carry{border-color:color-mix(in srgb,var(--mal2) 50%,transparent)}
.qty{width:70px;text-align:right}
.li{padding:11px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;cursor:pointer;background:var(--bg2)}
.li.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 6%,var(--bg2))}
.li .t{font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center}
.li .m{font-size:12px;color:var(--muted);margin-top:3px}
.qcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:8px;margin-bottom:14px}
.qc{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--bg2);font-size:12.5px}
.qc .n{font-weight:700;font-size:13px}
.qc.wait{opacity:.75}.qc.wait .n:after{content:" ···";animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.qc.in{border-color:color-mix(in srgb,var(--mal2) 55%,transparent);animation:fade .3s}
.wts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.wts label{font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
.wts input{width:100%;accent-color:var(--gold)}
.sbar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;min-width:90px}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mal),var(--gold))}
.trk{display:flex;gap:0;margin:6px 0 14px}
.trk div{flex:1;text-align:center;font-size:11.5px;color:var(--dim);position:relative;padding-top:26px;font-weight:600}
.trk div:before{content:"";position:absolute;top:8px;left:0;right:0;height:3px;background:var(--line)}
.trk div:first-child:before{left:50%}.trk div:last-child:before{right:50%}
.trk div i{position:absolute;top:0;left:50%;transform:translateX(-50%);width:19px;height:19px;border-radius:50%;background:var(--panel2);border:2px solid var(--line2);z-index:1;font-style:normal;font-size:10px;display:grid;place-items:center}
.trk div.d{color:var(--text)}.trk div.d:before{background:var(--mal2)}.trk div.d i{background:var(--mal2);border-color:var(--mal2);color:#fff}
.trk div.c i{border-color:var(--gold);animation:blink 1.2s infinite}
.po{background:#fff;color:#151515;border-radius:14px;padding:26px;font-size:13px;box-shadow:var(--shadow)}
.po h2{margin:0;font-size:20px}.po table{font-size:12.5px}.po th{background:#f2f2f2;color:#555}.po td{border-color:#e5e5e5;color:#151515}
.po .sig{margin-top:16px;border:1px dashed #9a9a9a;border-radius:10px;padding:12px;font-family:var(--mono);font-size:11.5px;word-break:break-all;background:#fafaf5}
.po .sig b{font-family:'Brush Script MT',cursive;font-size:26px;font-weight:400;color:#1d3a8a}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}.kpi .v{font-size:24px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}.kpi .s{font-size:11.5px;color:var(--dim);margin-top:2px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:none;place-items:center;padding:16px}
.modal-bg.on{display:grid}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:18px;max-width:640px;width:100%;padding:22px;box-shadow:var(--shadow);max-height:88vh;overflow:auto}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--gold);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:330px;animation:fade .2s}
.toast.ok{border-left-color:var(--mal2)}.toast.bad{border-left-color:var(--red)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
@media print{body *{visibility:hidden}.po,.po *{visibility:visible}.po{position:absolute;left:0;top:0;width:100%;box-shadow:none}.po .btn{display:none}}
@media (max-width:1000px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.wts{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hint{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.cl{grid-template-columns:minmax(0,1fr)}.fac{display:none;position:static;max-height:none}.fac.open{display:block}.fbtn{display:inline-flex}}
@media (max-width:560px){.wrap{padding:12px 14px 90px}.fg,.hl{grid-template-columns:minmax(0,1fr)}.wts{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:19px}.po{padding:16px}.trk div{font-size:10px}.srch{flex-basis:100%;order:3}}
</style>
</head>
<body data-demo-en="Procura — government-wide IT procurement marketplace" data-demo-ru="Procura — маркетплейс ИТ-закупок для всех ведомств">
<div class="wrap">
  <div class="hdr">
    <div class="brand"><b>P</b><div>Procura<small data-en="Federal IT Acquisition Office" data-ru="Федеральное бюро ИТ-закупок"></small></div></div>
    <div class="srch"><input class="input" id="q" data-en-ph="Search 64 products & services, SKUs, holders…" data-ru-ph="Поиск по 64 товарам и услугам, артикулам, поставщикам…"></div>
    <div class="role" id="role"><button data-r="buyer" class="on" data-en="Agency buyer" data-ru="Заказчик"></button><button data-r="vendor" data-en="Vendor view" data-ru="Поставщик"></button></div>
  </div>
  <div class="hint">
    <div><b>1</b><span data-en="Search or filter the catalog, tick up to 4 items for <b>Compare</b>, add a few to the <b>Cart</b>." data-ru="Найдите или отфильтруйте товары, отметьте до 4 для <b>Сравнения</b>, добавьте несколько в <b>Корзину</b>."></span></div>
    <div><b>2</b><span data-en="In the cart send an <b>RFQ</b> — quotes arrive live. Move the weight sliders, then <b>Award</b> and e-sign the purchase order." data-ru="Из корзины отправьте <b>запрос котировок</b> — ответы приходят вживую. Двигайте веса, затем <b>присудите</b> и подпишите заказ."></span></div>
    <div><b>3</b><span data-en="Track delivery in <b>Orders</b>, see spend on the <b>Dashboard</b>, or switch to <b>Vendor view</b> to answer RFQs." data-ru="Следите за поставкой в <b>Заказах</b>, расходы — на <b>Дашборде</b>, а в <b>режиме поставщика</b> отвечайте на запросы."></span></div>
  </div>
  <div class="card facts">
    <div><small data-en="Tender" data-ru="Тендер"></small><span data-en="IT products & services GWAC" data-ru="Рамочный контракт на ИТ-товары и услуги (GWAC)"></span></div>
    <div><small data-en="Years" data-ru="Годы"></small><span>2025–2036</span></div>
    <div><small data-en="Budget" data-ru="Бюджет"></small><span data-en="$60B ceiling" data-ru="Потолок $60 млрд"></span></div>
    <div><small data-en="Client" data-ru="Заказчик"></small><span data-en="Federal IT Acquisition Office (fictional)" data-ru="Федеральное бюро ИТ-закупок (вымышленное)"></span></div>
    <div><small data-en="Stack" data-ru="Стек"></small><span>Next.js · Postgres · search · e-signature</span></div>
  </div>
  <div class="nav" id="nav"></div>

  <section class="view" id="v-cat"><div class="cl">
    <aside class="card fac" id="fac"></aside>
    <div><div class="bar"><button class="btn sm fbtn" id="fbtn">☰ <span data-en="Filters" data-ru="Фильтры"></span></button><span id="cnt" class="muted"></span><span class="sp"></span><select class="input" id="sort" style="width:auto"></select><button class="btn sm" id="csv">⬇ CSV</button></div><div class="grid" id="grid"></div></div>
  </div></section>
  <section class="view" id="v-cmp"><div id="cmpBox"></div></section>
  <section class="view" id="v-cart"><div class="g2"><div class="card"><h3 data-en="Cart" data-ru="Корзина"></h3><div id="cartT"></div></div><div class="card" id="rfqForm"></div></div></section>
  <section class="view" id="v-rfq"><div class="g3"><div id="rfqL"></div><div id="rfqD"></div></div></section>
  <section class="view" id="v-ord"><div class="g3"><div id="ordL"></div><div id="ordD"></div></div></section>
  <section class="view" id="v-dash"><div class="kpis" id="dK"></div><div class="g2"><div class="card"><h3 data-en="Spend by category, FY26 ($M)" data-ru="Расходы по категориям, 2026 ФГ ($ млн)"></h3><div class="chart" id="cCat"></div></div><div class="card"><h3 data-en="Contract ceiling usage" data-ru="Использование потолка контракта"></h3><div class="chart" id="cGauge" style="max-width:340px;margin:0 auto"></div></div></div><div class="g2" style="margin-top:14px"><div class="card"><h3 data-en="Monthly obligations ($M)" data-ru="Обязательства по месяцам ($ млн)"></h3><div class="chart" id="cMon"></div></div><div class="card"><h3 data-en="Spend by contract holder" data-ru="Расходы по поставщикам"></h3><div class="chart" id="cVen"></div></div></div></section>
  <section class="view" id="v-ven"><div class="card" style="margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="muted" style="font-size:13px" data-en="Signed in as contract holder:" data-ru="Вы вошли как поставщик:"></span><select class="input" id="persona" style="width:auto;max-width:100%"></select><span id="pBadge"></span></div><div class="kpis" id="vK"></div><div class="g2"><div class="card"><h3 data-en="Incoming RFQs" data-ru="Входящие запросы котировок"></h3><div id="vR"></div></div><div class="card"><h3 data-en="My contract price list" data-ru="Мой прайс по контракту"></h3><div class="note" style="margin:-6px 0 10px" data-en="Edit a price — the catalog updates instantly (catalog modification, auditable)." data-ru="Измените цену — каталог обновится сразу (модификация каталога с журналом)."></div><div class="tw" style="max-height:520px;overflow:auto"><table id="vP"></table></div></div></div></section>
</div>
<div class="tray" id="tray"></div>
<div class="modal-bg" id="mod"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>
<script>
(function(){
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const T=(e,r)=>PT.t(e,r),L=o=>typeof o==='string'?o:(PT.lang==='ru'?o.ru:o.en);
const loc=()=>PT.lang==='ru'?'ru-RU':'en-US';
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const usd=(v,d)=>'$'+v.toLocaleString('en-US',{minimumFractionDigits:d??2,maximumFractionDigits:d??2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=(n,l)=>String(n).padStart(l||2,'0');
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=s=>{let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
function toast(m,k){const d=document.createElement('div');d.className='toast '+(k||'');d.innerHTML=m;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),3800)}
function modal(h){$('#modal').innerHTML=h;$('#mod').classList.add('on')}
function closeM(){$('#mod').classList.remove('on')}
$('#mod').onclick=e=>{if(e.target.id==='mod')closeM()};

/* ---------- reference data ---------- */
const CATS={lap:{en:'Laptops & tablets',ru:'Ноутбуки и планшеты',ic:'💻',c:'--blue'},desk:{en:'Desktops & displays',ru:'ПК и мониторы',ic:'🖥',c:'--violet'},srv:{en:'Servers & storage',ru:'Серверы и СХД',ic:'🗄',c:'--mal2'},net:{en:'Networking',ru:'Сетевое оборудование',ic:'📡',c:'--amber'},sec:{en:'Cybersecurity',ru:'Кибербезопасность',ic:'🛡',c:'--red'},cloud:{en:'Cloud & SaaS',ru:'Облако и SaaS',ic:'☁',c:'--mal3'},svc:{en:'Professional services',ru:'Профессиональные услуги',ic:'🧑‍💻',c:'--gold'},per:{en:'Peripherals & AV',ru:'Периферия и AV',ic:'🎧',c:'--gold2'}};
const UNITS={ea:{en:'each',ru:'шт.'},usr:{en:'user / yr',ru:'польз./год'},hr:{en:'hour',ru:'час'},mo:{en:'month',ru:'мес.'},tb:{en:'TB / month',ru:'ТБ/мес.'}};
const RAW={lap:[['Strata 14 Pro laptop',1890],['Strata 16 workstation laptop',2840],['Kestrel 13 rugged tablet',2310],['Arden 12 education laptop',410],['Vela 2-in-1 convertible',1460],['Kestrel 10 field tablet',980],['Strata 14 Secure (TPM, smart-card)',2120],['Orbis 15 developer laptop',2560]],

  const ks=Object.keys(CATS).sort((a,b)=>A.cat[b]-A.cat[a]),mx=Math.max(...ks.map(k=>A.cat[k])),W=560,rh=30;let g='';ks.forEach((k,i)=>{const w=(A.cat[k]/mx)*(W-230);g+=`<text x="0" y="${i*rh+19}" font-size="12" fill="${css('--muted')}">${CATS[k].ic} ${L(CATS[k])}</text><rect x="170" y="${i*rh+7}" width="${Math.max(2,w)}" height="16" rx="4" fill="${css(CATS[k].c)}"/><text x="${176+w}" y="${i*rh+19}" font-size="11.5" font-weight="700" fill="${css('--text')}">${A.cat[k].toFixed(0)}</text>`});$('#cCat').innerHTML=`<svg viewBox="0 0 ${W} ${ks.length*rh}" font-family="Inter,sans-serif">${g}</svg>`;
  const pc=used/60e9,R=80,len=Math.PI*R;$('#cGauge').innerHTML=`<svg viewBox="0 0 200 130" font-family="Inter,sans-serif"><path d="M20,105 A80,80 0 0 1 180,105" fill="none" stroke="${css('--line')}" stroke-width="16" stroke-linecap="round"/><path d="M20,105 A80,80 0 0 1 180,105" fill="none" stroke="${css(pc>.8?'--red':pc>.6?'--amber':'--mal2')}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${len*pc} ${len}"/><text x="100" y="88" text-anchor="middle" font-size="26" font-weight="800" fill="${css('--text')}">${(pc*100).toFixed(2)}%</text><text x="100" y="106" text-anchor="middle" font-size="10" fill="${css('--muted')}">$${(used/1e9).toFixed(3)}B ${T('of','из')} $60B</text><text x="20" y="125" font-size="9" text-anchor="middle" fill="${css('--dim')}">0</text><text x="180" y="125" font-size="9" text-anchor="middle" fill="${css('--dim')}">$60B</text></svg><div class="note" style="text-align:center">${T('Ordering period 2025–2036 · year 2 of 11 · on track','Период заказов 2025–2036 · год 2 из 11 · в графике')}</div>`;
  const MW=560,MH=200,mm=Math.max(...A.mon)*1.1,bw=(MW-40)/12;const mn=PT.lang==='ru'?['Я','Ф','М','А','М','И','И','А','С','О','Н','Д']:['J','F','M','A','M','J','J','A','S','O','N','D'];let m='';[0,.5,1].forEach(f=>m+=`<line x1="34" x2="${MW}" y1="${MH-20-f*(MH-40)}" y2="${MH-20-f*(MH-40)}" stroke="${css('--line')}"/><text x="30" y="${MH-16-f*(MH-40)}" font-size="10" text-anchor="end" fill="${css('--dim')}">${Math.round(mm*f)}</text>`);
  const cm=new Date().getMonth();A.mon.forEach((v,i)=>{const h=v/mm*(MH-40);m+=`<rect x="${40+i*bw+3}" y="${MH-20-h}" width="${bw-6}" height="${h}" rx="3" fill="${css(i===cm?'--gold':'--mal2')}" opacity="${i>cm?.35:1}"/><text x="${40+i*bw+bw/2}" y="${MH-5}" font-size="10" text-anchor="middle" fill="${css('--dim')}">${mn[i]}</text>`});$('#cMon').innerHTML=`<svg viewBox="0 0 ${MW} ${MH}" font-family="Inter,sans-serif">${m}</svg>`;
  const vs=H.slice().sort((a,b)=>A.ven[b.id]-A.ven[a.id]);let off=0;const C=2*Math.PI*60;let d='';vs.forEach((h,i)=>{const f=A.ven[h.id]/tot;d+=`<circle cx="80" cy="80" r="60" fill="none" stroke="${css(HC[i])}" stroke-width="26" stroke-dasharray="${f*C} ${C}" stroke-dashoffset="${-off*C}" transform="rotate(-90 80 80)"/>`;off+=f});
  $('#cVen').innerHTML=`<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 160 160" style="width:160px;flex:none" font-family="Inter,sans-serif">${d}<text x="80" y="78" text-anchor="middle" font-size="18" font-weight="800" fill="${css('--text')}">${H.length}</text><text x="80" y="94" text-anchor="middle" font-size="9.5" fill="${css('--muted')}">${T('holders','поставщиков')}</text></svg><div style="flex:1;min-width:180px">${vs.map((h,i)=>`<div style="display:flex;gap:8px;align-items:center;font-size:12.5px;padding:3px 0"><i style="width:10px;height:10px;border-radius:3px;background:var(${HC[i]});flex:none"></i><span style="flex:1">${h.n}${h.sb?' <span class="bdg sbz">SB</span>':''}</span><b class="mono">${(A.ven[h.id]/tot*100).toFixed(1)}%</b></div>`).join('')}</div></div>`}

/* ---------- vendor view ---------- */
function vRfqs(){const me=D.persona;return D.rfqs.filter(r=>r.inv.includes(me)).map(r=>({r,own:true,id:r.id,ag:AG[r.ag],lines:r.lines,q:r.quotes[me],open:r.st==='open'})).concat(D.ext.map(x=>({x,id:x.id,ag:x.ag,lines:x.lines,q:(x.resp||{})[me],open:x.st==='open'})))}
function renderVen(){const me=hb(D.persona);$('#persona').innerHTML=H.map(h=>`<option value="${h.id}">${h.n} — ${h.c}</option>`).join('');$('#persona').value=me.id;$('#pBadge').innerHTML=me.sb?`<span class="pill gold">${L(me.t)}</span>`:`<span class="pill">${T('Large business','Крупный бизнес')}</span>`;
  const rs=vRfqs(),won=D.orders.filter(o=>o.h===me.id),sub=rs.filter(x=>x.q&&x.q.st==='in').length;
  $('#vK').innerHTML=[[T('Invited RFQs','Приглашений'),rs.length],[T('Quotes submitted','Котировок подано'),sub],[T('Awards won','Побед'),won.length],[T('Revenue via Procura','Выручка через Procura'),usd(won.reduce((a,o)=>a+o.tot,0),0)]].map(k=>`<div class="card kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div></div>`).join('');
  $('#vR').innerHTML=rs.length?rs.map(x=>{const est=x.lines.reduce((a,[pid,qty])=>{const p=pb(pid),o=p.offers.find(o=>o.h===me.id);return a+qty*(o?o.price:p.b)},0);const q=x.q;return `<div class="li" style="cursor:default"><div class="t"><span class="mono">${x.id}</span><span class="muted" style="font-weight:500;font-size:12px">${L(x.ag)}</span><span class="pill ${!x.open?'':q&&q.st==='in'?'ok':'warn'}" style="margin-left:auto">${!x.open?(x.r&&x.r.award===me.id?T('Won','Победа'):T('Closed','Закрыт')):q&&q.st==='in'?T('Submitted','Подано'):T('Response due','Ждёт ответа')}</span></div><div class="m">${x.lines.map(([pid,qty])=>qty+' × '+esc(pb(pid).n)).join(' · ')}</div>${x.open?`<div style="display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;align-items:flex-end"><div class="f" style="flex:1;min-width:110px"><label>${T('Total price','Цена, всего')}</label><input class="input mono" data-vp="${x.id}" value="${q&&q.tot?q.tot:Math.round(est*.95)}"></div><div class="f" style="width:90px"><label>${T('Days','Дней')}</label><input class="input mono" data-vd="${x.id}" value="${q&&q.days?q.days:14}"></div><button class="btn sm pri" data-vs="${x.id}">${q&&q.st==='in'?T('Revise','Обновить'):T('Submit','Подать')}</button></div>`:''}</div>`}).join(''):`<div class="empty">${T('No RFQs for this holder.','Нет запросов для этого поставщика.')}</div>`;
  const mine=P.filter(p=>p.offers.some(o=>o.h===me.id));$('#vP').innerHTML=`<thead><tr><th>${T('Item','Позиция')}</th><th class="num">${T('Lowest rival','Мин. у конкурентов')}</th><th class="num">${T('My price','Моя цена')}</th></tr></thead><tbody>`+mine.map(p=>{const o=p.offers.find(o=>o.h===me.id),riv=p.offers.filter(x=>x.h!==me.id).map(x=>x.price);const rv=riv.length?Math.min(...riv):null;return `<tr><td style="min-width:160px">${esc(p.n)}<div class="muted mono" style="font-size:11px">${p.sku}</div></td><td class="num mono">${rv?usd(rv):'—'}</td><td class="num"><input class="input mono qty" style="width:110px" data-mp="${p.id}" value="${o.price.toFixed(2)}">${rv&&o.price<=rv?' <span class="pill ok">'+T('best','лучшая')+'</span>':''}</td></tr>`}).join('')+'</tbody>'}
$('#persona').onchange=e=>{D.persona=e.target.value;save();renderVen()};
$('#vR').onclick=e=>{const b=e.target.closest('[data-vs]');if(!b)return;const id=b.dataset.vs,tot=parseFloat($(`[data-vp="${id}"]`).value),days=parseInt($(`[data-vd="${id}"]`).value);if(!(tot>0)||!(days>0)){toast(T('Enter price and days','Укажите цену и срок'),'bad');return}
  const me=D.persona,r=D.rfqs.find(x=>x.id===id);if(r){const old=r.quotes[me]||{};r.quotes[me]={st:'in',tot:Math.round(tot),days,tech:old.tech||88,pp:old.pp||90,at:Date.now(),note:T('Submitted via vendor portal','Подано через портал поставщика'),rev:true}}else{const x=D.ext.find(x=>x.id===id);x.resp=x.resp||{};x.resp[me]={st:'in',tot:Math.round(tot),days}}save();renderVen();renderNav();toast('📤 '+T('Quote sent for ','Котировка отправлена: ')+id+(r?T(' — buyer sees it in evaluation',' — заказчик видит её в оценке'):''),'ok')};
$('#vP').addEventListener('change',e=>{const id=e.target.dataset.mp;if(!id)return;const v=parseFloat(e.target.value);if(!(v>0)){toast(T('Invalid price','Неверная цена'),'bad');renderVen();return}const o=pb(id).offers.find(o=>o.h===D.persona);o.price=Math.round(v*100)/100;D.mods[id+'|'+D.persona]=o.price;save();renderVen();toast(T('Catalog modification logged: ','Изменение каталога записано: ')+pb(id).sku+' → '+usd(o.price),'ok')});

/* ---------- navigation ---------- */
const NAV=[['cat',{en:'Catalog',ru:'Каталог'}],['cmp',{en:'Compare',ru:'Сравнение'}],['cart',{en:'Cart',ru:'Корзина'}],['rfq',{en:'RFQs & evaluation',ru:'Запросы и оценка'}],['ord',{en:'Orders',ru:'Заказы'}],['dash',{en:'Dashboard',ru:'Дашборд'}]];
function renderNav(){const b={cmp:D.cmp.length,cart:D.cart.length,rfq:D.rfqs.filter(r=>r.st==='open').length,ord:D.orders.filter(o=>o.stage===3).length};$('#nav').style.display=role==='buyer'?'':'none';$('#nav').innerHTML=NAV.map(n=>`<button class="${view===n[0]?'on':''}" data-go="${n[0]}">${L(n[1])}${b[n[0]]?`<em>${b[n[0]]}</em>`:''}</button>`).join('');renderTray()}
function go(v){view=v;D.view=v;save();$$('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));renderNav();({cat:renderCat,cmp:renderCmp,cart:renderCart,rfq:renderRfq,ord:renderOrd,dash:renderDash,ven:renderVen})[v]();try{history.replaceState(null,'','#'+v)}catch(e){}}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){if(role!=='buyer')setRole('buyer');go(g.dataset.go);window.scrollTo(0,0)}});
function setRole(r){role=r;$$('#role button').forEach(b=>b.classList.toggle('on',b.dataset.r===r));if(r==='vendor')go('ven');else go(view==='ven'?'cat':view)}
$('#role').onclick=e=>{const b=e.target.closest('[data-r]');if(b)setRole(b.dataset.r)};
PT.onLang(()=>go(view));
const h0=location.hash.slice(1);if(h0==='ven'){role='vendor';$$('#role button').forEach(b=>b.classList.toggle('on',b.dataset.r==='vendor'))}
if(h0&&(NAV.find(n=>n[0]===h0)||h0==='ven'))view=h0;else if(view==='ven')view='cat';
go(view);
})();
</script>
