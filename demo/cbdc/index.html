<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Euroledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#6aa8ff,#2f5fd0);color:#fff;font-size:17px;flex:none}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.grow{flex:1}
.who{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:13px;display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--mal) 22%,transparent);color:var(--mal3);font-weight:800;font-size:13px;flex:none}
.who small{display:block;color:var(--muted);font-size:11.5px}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.how>div>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold2);flex:none;font-size:13px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.card{min-width:0}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.btn.blk{width:100%;justify-content:center}
.err{color:var(--red);font-size:12.5px;min-height:18px;margin-top:6px}
.ok-t{color:var(--mal3)} .bad-t{color:var(--red)} .warn-t{color:var(--amber)}
.prog{height:9px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mal2),var(--mal3));transition:width .5s}
.prog.hi i{background:linear-gradient(90deg,var(--amber),var(--red))}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;justify-content:space-between;background:none;border:0;padding:6px 0;text-align:left;width:100%;font-size:13px}
.sw i{width:38px;height:22px;border-radius:22px;background:var(--line2);position:relative;flex:none;transition:.2s}
.sw i:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.sw.on i{background:var(--mal)} .sw.on i:after{left:18px}
/* login */
.loginv{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 500px at 70% 0%,color-mix(in srgb,#4e7fff 14%,transparent),transparent),radial-gradient(700px 400px at 0% 100%,color-mix(in srgb,var(--mal) 12%,transparent),transparent)}
.login{width:100%;max-width:440px;padding:26px}
.login h2{margin:6px 0 4px;font-size:21px}
.login .f{margin-top:12px}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.role{border:1px solid var(--line2);border-radius:12px;background:var(--bg2);padding:10px 6px;cursor:pointer;font-size:12px;font-weight:600;text-align:center}
.role b{display:block;font-size:18px}
.role.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 12%,transparent)}
.secure{display:flex;gap:8px;font-size:12px;color:var(--muted);margin-top:14px;align-items:center;justify-content:center;flex-wrap:wrap}
/* wallet */
.balc{background:linear-gradient(140deg,color-mix(in srgb,#3d6fe0 30%,var(--panel)),var(--panel) 60%);position:relative;overflow:hidden}
.balc:after{content:"€";position:absolute;right:-10px;top:-40px;font-size:190px;font-weight:800;opacity:.06}
.big{font-size:38px;font-weight:800;letter-spacing:-.03em;margin:2px 0 12px}
.linked{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:14px 0;font-size:13px;flex-wrap:wrap}
.linked b{margin-left:auto}
.tx{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.tx:last-child{border-bottom:0}
.tx .ti{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);flex:none;font-size:15px}
.tx .tm{flex:1;min-width:0}
.tx .tm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .tm span{font-size:12px;color:var(--muted)}
.tx .ta{text-align:right;font-weight:700;font-family:var(--mono);font-size:13px}
.tx .ta small{display:block;font-family:var(--font);font-weight:500}
.priv{font-size:13px;line-height:1.45}
.priv li{margin-bottom:6px}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.qa button{border:1px solid var(--line2);background:var(--bg2);border-radius:14px;padding:14px 8px;cursor:pointer;font-weight:700;font-size:13px}
.qa button b{display:block;font-size:22px;margin-bottom:4px}
.qa button:hover{border-color:var(--mal)}
/* pay */
.cam{position:relative;border-radius:16px;background:#0b1512;height:200px;display:grid;place-items:center;overflow:hidden;margin-bottom:12px}
.cam .scan{position:absolute;left:0;right:0;height:3px;background:var(--mal3);box-shadow:0 0 16px var(--mal3);animation:scan 1.6s linear infinite}
.cam .corner{position:absolute;inset:22px;border:2px dashed rgba(255,255,255,.25);border-radius:14px}
.cam .ph{color:#9fb;font-size:13px;text-align:center;opacity:.8}
@keyframes scan{from{top:0}to{top:100%}}
.sum{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13.5px}
.sum div span{color:var(--muted)}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.payload{font-family:var(--mono);font-size:11.5px;word-break:break-all;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;flex:1;min-width:0}
.bio{width:84px;height:84px;border-radius:50%;margin:10px auto;display:grid;place-items:center;font-size:36px;border:3px solid var(--line2)}
.bio.go{border-color:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--gold) 20%,transparent)}}
.banner{border:1px solid color-mix(in srgb,var(--amber) 50%,transparent);background:color-mix(in srgb,var(--amber) 10%,transparent);border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.banner span{flex:1;min-width:180px}
/* offline */
.netsw{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.netsw .st{font-size:20px;font-weight:800}
.phones{display:flex;align-items:center;justify-content:center;gap:24px;padding:16px 0;position:relative}
.phone{width:62px;height:108px;border-radius:14px;border:3px solid var(--line2);background:var(--bg2);display:grid;place-items:center;font-size:24px;transition:transform .5s}
.phones.tap .l{transform:translateX(26px) rotate(8deg)} .phones.tap .r{transform:translateX(-26px) rotate(-8deg)}
.waves{width:40px;height:40px;border-radius:50%;border:2px solid var(--mal3);opacity:0}
.phones.tap .waves{animation:wv .9s ease-out}
@keyframes wv{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(2.2)}}
.q{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.q:last-child{border-bottom:0}.q span{flex:1;min-width:0}
.se{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.se div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.se span{display:block;font-size:11.5px;color:var(--muted)} .se b{font-size:15px}
/* pos */
.disp{font-family:var(--mono);font-size:40px;font-weight:700;text-align:right;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:12px;overflow:hidden;text-overflow:ellipsis}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.keys button{padding:15px 0;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-size:19px;font-weight:700;cursor:pointer;touch-action:manipulation}
.keys button:active{background:var(--line)}
.wait{text-align:center}
.wait .qr{display:inline-block;margin:6px auto 10px}
/* cb */
.feed{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;height:268px;overflow:hidden}
.feed div{padding:3px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;animation:fade .3s}
.feed div span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed .t{color:var(--dim)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mal3);box-shadow:0 0 10px var(--mal3);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2,.split,.intro{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
}
@media (max-width:560px){.how{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi .v{font-size:19px}.big{font-size:30px}.se{grid-template-columns:1fr 1fr}.disp{font-size:32px}.card{padding:14px}.login{padding:20px}}
</style>
</head>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const P='pt_cbdc_';
const store={load(){try{return JSON.parse(localStorage.getItem(P+'state'))}catch(e){return null}},save(){try{localStorage.setItem(P+'state',JSON.stringify(S))}catch(e){}},clear(){try{Object.keys(localStorage).filter(k=>k.indexOf(P)===0).forEach(k=>localStorage.removeItem(k))}catch(e){}}};

/* ---------- money engine ---------- */
function addTx(o){S.tx.unshift(Object.assign({id:nid('T'),t:now(),st:'ok'},o));S.cb.todayTx++;pushFeed(o.k,Math.abs(o.amt))}
function receive(amt,cp,k,note){
  const room=S.limit-S.bal;
  if(amt>room){
    if(!S.wf.in){toast(T('Payment of '+eur(amt)+' rejected: it would exceed your holding limit. Turn on auto-sweep.','Платёж '+eur(amt)+' отклонён: превышен лимит хранения. Включите автосброс.'),'bad');return false}
    S.bal+=amt;addTx({k:k||'in',amt,cp,note});const ex=Math.round((S.bal-S.limit)*100)/100;S.bal=S.limit;S.bank+=ex;addTx({k:'sweep',amt:-ex,cp:'Aurel Bank',note:''});
    toast(T('Above the holding limit — '+eur(ex)+' swept to your bank account automatically.','Сверх лимита хранения — '+eur(ex)+' автоматически переведено на банковский счёт.'),'gold');
  }else{S.bal+=amt;addTx({k:k||'in',amt,cp,note})}
  S.bal=Math.round(S.bal*100)/100;return true;
}
function spend(amt,cp,k,note){
  if(amt>S.bal){const need=Math.round((amt-S.bal)*100)/100;
    if(!S.wf.out||need>S.bank)return T('Insufficient digital euro balance','Недостаточно цифровых евро');
    S.bank-=need;S.bal+=need;addTx({k:'wf',amt:need,cp:'Aurel Bank',note:''});
    toast(T(eur(need)+' pulled from your bank account (waterfall).',eur(need)+' подтянуто с банковского счёта (waterfall).'),'gold')}
  S.bal=Math.round((S.bal-amt)*100)/100;addTx({k,amt:-amt,cp,note});return null;
}

/* ---------- charts & qr ---------- */
function qrSvg(text,px){const n=25,r=rng(hashS(text));let d='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8))continue;if(r()>.52)d+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
  [[0,0],[n-7,0],[0,n-7]].forEach(([x,y])=>{d+=`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`});
  d+=`<rect x="10" y="10" width="5" height="5" fill="#fff"/><text x="12.5" y="14" font-size="4.6" text-anchor="middle" font-weight="800" fill="#2f5fd0">€</text>`;
  return `<svg class="qr" viewBox="-2 -2 ${n+4} ${n+4}" width="${px}" height="${px}" style="background:#fff;border-radius:10px;display:block;flex:none" shape-rendering="crispEdges"><g fill="#0b1512">${d}</g></svg>`}
function lineChart(o){const W=o.w||640,H=o.h||220,pl=48,pr=14,pt=12,pb=26;const all=o.series.flatMap(s=>s.v);let mn=Math.min(...all),mx=Math.max(...all);if(mx===mn)mx=mn+1;const pad=(mx-mn)*.12;mn-=pad;mx+=pad;
  const n=o.series[0].v.length,X=i=>pl+(W-pl-pr)*i/(n-1),Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));let g='';
  for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4,y=Y(v).toFixed(1);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="${cssv('--line')}"/><text x="${pl-6}" y="${+y+4}" text-anchor="end" font-size="10.5" fill="${cssv('--dim')}">${o.fmt(v)}</text>`}
  o.labels.forEach((l,i)=>{if(l)g+=`<text x="${X(i)}" y="${H-7}" text-anchor="middle" font-size="10.5" fill="${cssv('--dim')}">${l}</text>`});
  o.series.forEach(s=>{const pts=s.v.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1));if(s.fill)g+=`<path d="M${X(0)},${H-pb} L${pts.join(' L')} L${X(n-1)},${H-pb} Z" fill="${s.c}" opacity=".13"/>`;
    g+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${s.c}" stroke-width="2.4" stroke-linejoin="round"/>`;const l=n-1;g+=`<circle cx="${X(l)}" cy="${Y(s.v[l])}" r="4.5" fill="${s.c}"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`}
function barChart(o){const W=o.w||640,H=o.h||200,pl=44,pr=10,pt=10,pb=26;const mx=Math.max(1,...o.series.flatMap(s=>s.v))*1.1;const n=o.labels.length,gw=(W-pl-pr)/n,bw=Math.max(2,gw*.72/o.series.length);let g='';
  for(let k=0;k<=3;k++){const v=mx*k/3,y=pt+(H-pt-pb)*(1-k/3);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="${cssv('--line')}"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10.5" fill="${cssv('--dim')}">${o.fmt(v)}</text>`}
  o.labels.forEach((l,i)=>{o.series.forEach((s,j)=>{const v=s.v[i],h=(H-pt-pb)*v/mx,x=pl+gw*i+gw*.14+bw*j;g+=`<rect x="${x.toFixed(1)}" y="${(H-pb-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${s.c}"><title>${l}: ${o.fmt(v)}</title></rect>`});
    if(l)g+=`<text x="${pl+gw*i+gw/2}" y="${H-7}" text-anchor="middle" font-size="10.5" fill="${cssv('--dim')}">${l}</text>`});
  if(o.mark!=null){const x=pl+gw*o.mark;g+=`<line x1="${x}" x2="${x}" y1="${pt}" y2="${H-pb}" stroke="${cssv('--red')}" stroke-dasharray="4 3" stroke-width="2"/><text x="${x-4}" y="${pt+10}" text-anchor="end" font-size="10.5" font-weight="700" fill="${cssv('--red')}">${o.markL}</text>`}
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`}

    <div class="bio" id="bio">👤</div><div class="muted" style="text-align:center;font-size:12.5px;margin-bottom:10px">${T('Strong customer authentication','Строгая аутентификация клиента')}</div>

  else{const l=p.last||{};left=`<div style="text-align:center;padding:10px 0"><div style="font-size:46px">✅</div><h2 style="margin:6px 0">${eur(l.amt||0)}</h2><div class="muted">${T('Paid to','Оплачено')} ${esc(cName(l.to))}</div>
    <div class="sum" style="text-align:left"><div><span>${T('Transaction','Операция')}</span><b class="mono">${esc(l.id)}</b></div><div><span>${T('Time','Время')}</span><b>${l.t?fmtT(l.t):''}</b></div><div><span>${T('New balance','Новый баланс')}</span><b>${eur(S.bal)}</b></div></div>
    <button class="btn pri" id="pNew">${T('New payment','Новый платёж')}</button></div>`}
  const qa=parseAmt(q.amt);const payload=`euroledger://pay?to=${ME}&amt=${isFinite(qa)?qa.toFixed(2):''}&ref=${encodeURIComponent(q.note||'')}`;
  el.innerHTML=`${S.offline?`<div class="banner"><span>✈ ${T('You are offline. Online QR payments are paused — use the offline purse for tap-to-pay.','Вы офлайн. Онлайн-платежи по QR приостановлены — используйте офлайн-кошелёк.')}</span><button class="btn sm" data-go="off">${T('Open offline mode','Открыть офлайн')}</button></div>`:''}
  <div class="split"><div class="card"><h3>▣ ${T('Scan & pay','Сканировать и оплатить')}<span class="sp"></span><span class="pill">${T('Balance','Баланс')} ${eur(S.bal)}</span></h3>${left}</div>
  <div class="card"><h3>⇄ ${T('Request money with a QR','Запросить деньги по QR')}</h3>
    <div class="fgrid"><div class="f"><label>${T('Amount, €','Сумма, €')}</label><input class="input" id="rAmt" inputmode="decimal" value="${esc(q.amt)}"></div><div class="f"><label>${T('Reference','Назначение')}</label><input class="input" id="rNote" value="${esc(q.note)}" maxlength="40"></div></div>
    <div class="qrbox" style="margin:14px 0">${qrSvg(payload,150)}<div class="payload" id="payload">${esc(payload)}</div></div>
    <div class="err" id="rErr"></div>
    <div class="row"><button class="btn pri" id="rSim">${T('Simulate: friend scans & pays','Имитация: друг сканирует и платит')}</button><button class="btn" id="rCopy">${T('Copy link','Копировать ссылку')}</button></div>
    <h3 style="margin-top:20px">${T('Frequent contacts','Частые контакты')}</h3>
    ${CONTACTS.slice(0,3).map(c=>`<div class="tx"><div class="av">${c.i}</div><div class="tm"><b>${esc(c.n)}</b><span class="mono">${c.a}</span></div><button class="btn sm" data-scan="${c.a}">${T('Pay','Оплатить')}</button></div>`).join('')}
  </div></div>`;
  $$('[data-go]',el).forEach(b=>b.onclick=()=>go(b.dataset.go));
  $$('[data-scan]',el).forEach(b=>b.onclick=()=>{S.pay={to:b.dataset.scan,amt:p.amt,note:p.note,step:0,last:p.last};save();rPay();const a=$('#pAmt');if(a)a.focus()});
  if(p.step===0){$('#pTo').oninput=e=>{p.to=e.target.value.trim()};$('#pAmt').oninput=e=>{p.amt=e.target.value};$('#pNote').oninput=e=>{p.note=e.target.value};
    $('#pGo').onclick=()=>{const a=parseAmt(p.amt);let er='';
      if(!/^@[a-z0-9._]{3,30}$/i.test(p.to))er=T('Recipient alias must look like @name','Псевдоним получателя должен быть вида @имя');
      else if(p.to===ME)er=T('You cannot pay yourself','Нельзя платить самому себе');
      else if(!(a>0))er=T('Enter an amount greater than zero','Введите сумму больше нуля');
      else if(a>S.bal+(S.wf.out?S.bank:0))er=T('Insufficient funds','Недостаточно средств');
      else if(a>S.limit)er=T('Single payment cannot exceed '+eur(S.limit,0),'Разовый платёж не может превышать '+eur(S.limit,0));
      if(er){$('#pErr').textContent=er;return}p.step=1;save();rPay()}}
  if(p.step===1){$('#pBack').onclick=()=>{p.step=0;save();rPay()};$('#pConf').onclick=e=>{e.target.disabled=true;$('#bio').classList.add('go');
    setTimeout(()=>{const a=parseAmt(p.amt);const er=spend(a,cName(p.to),CONTACTS.find(c=>c.a===p.to&&c.m)?'pos':'out',p.note);if(er){toast(er,'bad');p.step=0;save();render();return}
      p.last={id:S.tx[0].id,amt:a,to:p.to,t:now()};p.step=2;p.amt='';p.note='';save();render();toast(T('Payment sent','Платёж отправлен'))},900)}}
  if(p.step===2)$('#pNew').onclick=()=>{S.pay={to:'',amt:'',note:'',step:0,last:p.last};save();rPay()};
  const upd=()=>{const a=parseAmt($('#rAmt').value);const pl=`euroledger://pay?to=${ME}&amt=${isFinite(a)?a.toFixed(2):''}&ref=${encodeURIComponent($('#rNote').value||'')}`;$('#payload').textContent=pl;$('.qrbox svg',el).outerHTML=qrSvg(pl,150)};
  $('#rAmt').oninput=e=>{q.amt=e.target.value;save();upd()};$('#rNote').oninput=e=>{q.note=e.target.value;save();upd()};
  $('#rCopy').onclick=()=>{try{navigator.clipboard&&navigator.clipboard.writeText($('#payload').textContent).catch(()=>{})}catch(e){}toast(T('Payment link copied','Ссылка на оплату скопирована'))};
  $('#rSim').onclick=()=>{const a=parseAmt(q.amt);if(!(a>0)||a>S.limit){$('#rErr').textContent=T('Enter an amount between €0.01 and '+eur(S.limit,0),'Введите сумму от €0,01 до '+eur(S.limit,0));return}
    if(S.offline){$('#rErr').textContent=T('Online requests need a network connection','Онлайн-запрос требует подключения к сети');return}
    const c=CONTACTS[Math.floor(Math.random()*3)];if(receive(a,c.n,'in',q.note)){toast(T(c.n+' paid you '+eur(a),c.n+' оплатил(а) вам '+eur(a)))}save();render()};
}

/* ---------- OFFLINE ---------- */
let tapping=false;
function rOff(){const el=$('#v-off');const pend=S.queue.filter(q=>q.st==='pending');const pp=S.purse/S.purseLimit*100;
  el.innerHTML=`<div class="card" style="margin-bottom:14px"><div class="netsw"><div style="font-size:34px">${S.offline?'✈':'📶'}</div><div style="flex:1;min-width:180px"><div class="st">${S.offline?T('Offline — no network','Офлайн — нет сети'):T('Online','Онлайн')}</div><div class="muted" style="font-size:13px">${S.offline?T('Device-to-device payments work from the secure element. They sync when you reconnect.','Платежи между устройствами работают из защищённого элемента и синхронизируются при подключении.'):T('Switch off the network to try cash-like offline payments.','Отключите сеть, чтобы попробовать офлайн-платежи как наличными.')}</div></div>
    <button class="btn ${S.offline?'pri':'gold'}" id="netT">${S.offline?T('Reconnect & sync','Подключиться и синхронизировать'):T('Go offline (airplane mode)','Перейти в офлайн (авиарежим)')}</button></div></div>
  <div class="split"><div class="card"><h3>💳 ${T('Offline purse (secure element)','Офлайн-кошелёк (защищённый элемент)')}</h3>
    <div class="big" style="font-size:32px">${eur(S.purse)}</div><div class="prog"><i style="width:${pp}%"></i></div>
    <div class="muted" style="font-size:12px;margin:5px 0 12px">${T('Offline limit','Офлайн-лимит')} ${eur(S.purseLimit,0)} · ${T('online wallet','онлайн-кошелёк')} ${eur(S.bal)}</div>
    <div class="fgrid"><div class="f"><label>${T('Amount, €','Сумма, €')}</label><input class="input" id="oAmt" inputmode="decimal" placeholder="50.00"></div><div class="f"><label>&nbsp;</label><div class="row"><button class="btn pri sm" id="oLoad">${T('Load','Загрузить')}</button><button class="btn sm" id="oUnl">${T('Unload','Выгрузить')}</button></div></div></div>
    <div class="err" id="oErr"></div>
    <div class="se"><div><span>${T('Attestation','Аттестация')}</span><b class="ok-t">✓ ${T('valid','действует')}</b></div><div><span>${T('Offline txs since sync','Офлайн-операций с синхр.')}</span><b>${S.offCount} / 20</b></div><div><span>${T('Counter','Счётчик')}</span><b class="mono">#${(4180+S.tx.length).toString(16)}</b></div></div>
  </div>
  <div class="card"><h3>📲 ${T('Tap to pay — device to device','Оплата касанием — устройство к устройству')}</h3>
    <div class="phones" id="phones"><div class="phone l">👛</div><div class="waves"></div><div class="phone r" id="phR">🏪</div></div>
    <div class="fgrid"><div class="f"><label>${T('Pay to','Кому')}</label><select class="input" id="tTo">${CONTACTS.map(c=>`<option value="${c.a}">${esc(c.n)}</option>`).join('')}</select></div><div class="f"><label>${T('Amount, €','Сумма, €')}</label><input class="input" id="tAmt" inputmode="decimal" value="6.40"></div></div>
    <div class="err" id="tErr"></div>
    <div class="row"><button class="btn pri" id="tPay">${T('Tap & pay','Коснуться и оплатить')}</button><button class="btn" id="tRecv">${T('Receive €10 by tap','Получить €10 касанием')}</button></div>
  </div></div>
  <div class="card"><h3>⟳ ${T('Sync queue','Очередь синхронизации')}<span class="sp"></span><span class="pill ${pend.length?'warn':'ok'}">${pend.length?pend.length+' '+T('pending','ожидают'):T('all settled','всё проведено')}</span>${pend.length&&!S.offline?`<button class="btn sm pri" id="syncNow">${T('Sync now','Синхронизировать')}</button>`:''}</h3>
    ${S.queue.slice(0,12).map(q=>`<div class="q"><span>${q.amt<0?'↗':'↙'} <b>${esc(q.cp)}</b> · ${fmtT(q.t)}<br><small class="muted mono">${q.id} · ${T('signed token','подписанный токен')} ${q.sig}</small></span><b class="mono">${q.amt>0?'+':''}${eur(q.amt)}</b><span class="pill ${q.st==='pending'?'warn':'ok'}" style="flex:none">${q.st==='pending'?T('pending','ожидает'):T('settled','проведено')}</span></div>`).join('')||`<div class="muted">${T('No offline payments yet. Make one above.','Офлайн-платежей пока нет. Сделайте первый выше.')}</div>`}
  </div>`;
  $('#netT').onclick=()=>{S.offline=!S.offline;save();render();if(!S.offline)sync();else toast(T('Network off. Online services paused.','Сеть отключена. Онлайн-сервисы приостановлены.'),'gold')};
  const sn=$('#syncNow');if(sn)sn.onclick=sync;
  const oa=()=>{const a=parseAmt($('#oAmt').value);if(!(a>0)){$('#oErr').textContent=T('Enter an amount greater than zero','Введите сумму больше нуля');return null}return a};
  $('#oLoad').onclick=()=>{const a=oa();if(a==null)return;if(S.offline){$('#oErr').textContent=T('Loading the purse needs a connection — reconnect first','Загрузка требует сети — сначала подключитесь');return}
    if(a>S.bal){$('#oErr').textContent=T('Not enough in the online wallet','Недостаточно в онлайн-кошельке');return}
    if(S.purse+a>S.purseLimit){$('#oErr').textContent=T('Offline limit is '+eur(S.purseLimit,0)+' — you can load up to '+eur(S.purseLimit-S.purse),'Офлайн-лимит '+eur(S.purseLimit,0)+' — можно загрузить до '+eur(S.purseLimit-S.purse));return}
    S.bal=Math.round((S.bal-a)*100)/100;S.purse=Math.round((S.purse+a)*100)/100;addTx({k:'offl',amt:-a,cp:T('Offline purse','Офлайн-кошелёк'),note:''});save();rOff();toast(T(eur(a)+' loaded to the offline purse',eur(a)+' загружено в офлайн-кошелёк'))};
  $('#oUnl').onclick=()=>{const a=oa();if(a==null)return;if(S.offline){$('#oErr').textContent=T('Unloading needs a connection','Выгрузка требует сети');return}
    if(a>S.purse){$('#oErr').textContent=T('Amount exceeds the purse balance','Сумма больше остатка офлайн-кошелька');return}
    if(!receive(a,T('Offline purse','Офлайн-кошелёк'),'offu','')){return}S.purse=Math.round((S.purse-a)*100)/100;save();rOff()};
  const tap=(cb)=>{if(tapping)return;tapping=true;const ph=$('#phones');ph.classList.add('tap');setTimeout(()=>{tapping=false;cb()},950)};
  $('#tTo').onchange=e=>{$('#phR').textContent=CONTACTS.find(c=>c.a===e.target.value).m?'🏪':'📱'};
  $('#tPay').onclick=()=>{const a=parseAmt($('#tAmt').value),to=$('#tTo').value;let er='';
    if(!(a>0))er=T('Enter an amount greater than zero','Введите сумму больше нуля');else if(a>S.purse)er=T('Not enough in the offline purse — load it while online','Недостаточно в офлайн-кошельке — загрузите его онлайн');else if(S.offCount>=20)er=T('20 offline payments since last sync — reconnect to continue','20 офлайн-платежей с последней синхронизации — подключитесь');
    if(er){$('#tErr').textContent=er;return}
    tap(()=>{S.purse=Math.round((S.purse-a)*100)/100;S.offCount++;const id=nid('OF');const q={id,t:now(),cp:cName(to),amt:-a,st:'pending',sig:(hashS(id)>>>0).toString(16).slice(0,8)};S.queue.unshift(q);
      S.tx.unshift({id,t:q.t,k:'offp',amt:-a,cp:q.cp,note:'',st:'pending',off:1});save();render();toast(T('Paid '+eur(a)+' offline to '+q.cp,'Оплачено '+eur(a)+' офлайн: '+q.cp));if(!S.offline)setTimeout(sync,700)})};
  $('#tRecv').onclick=()=>{if(S.purse+10>S.purseLimit){$('#tErr').textContent=T('Offline purse is full','Офлайн-кошелёк заполнен');return}
    tap(()=>{S.purse=Math.round((S.purse+10)*100)/100;S.offCount++;const id=nid('OF');const q={id,t:now(),cp:'Jonas Meier',amt:10,st:'pending',sig:(hashS(id)>>>0).toString(16).slice(0,8)};S.queue.unshift(q);
      S.tx.unshift({id,t:q.t,k:'offr',amt:10,cp:q.cp,note:'',st:'pending',off:1});save();render();toast(T('Received €10.00 offline from Jonas','Получено €10,00 офлайн от Jonas'));if(!S.offline)setTimeout(sync,700)})};
}
function sync(){if(S.offline)return;const pend=S.queue.filter(q=>q.st==='pending');if(!pend.length)return;
  toast(T('Syncing '+pend.length+' offline payment(s) with the ledger…','Синхронизация '+pend.length+' офлайн-платежей с реестром…'),'gold');
  setTimeout(()=>{pend.forEach(q=>{q.st='ok';const t=S.tx.find(x=>x.id===q.id);if(t)t.st='ok';S.cb.todayTx++;pushFeed(q.amt<0?'offp':'offr',Math.abs(q.amt))});S.offCount=0;save();render();toast(T('Offline payments settled ✓','Офлайн-платежи проведены ✓'))},1100)}

/* ---------- MERCHANT ---------- */
function rPos(){const el=$('#v-pos');const p=S.pos;const today=S.sales.filter(s=>s.st!=='void');const ok=today.filter(s=>s.st==='ok');
  const tot=ok.reduce((a,s)=>a+s.amt,0);const hrs=[];for(let h=7;h<=18;h++)hrs.push(h);
  const hv=hrs.map(h=>ok.filter(s=>new Date(s.t).getHours()===h).reduce((a,s)=>a+s.amt,0));
  let till='';
  if(p.stage===0)till=`<div class="disp">€${esc(p.amt||'0')}</div><div class="keys">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div><div class="err" id="kErr"></div><button class="btn pri blk" id="charge">${T('Charge','Выставить счёт')}</button>`;
  else if(p.stage===1){const a=parseAmt(p.amt);till=`<div class="wait">${qrSvg('POS:cafe.lumen:'+a+':'+S.seq,170)}<div class="disp" style="text-align:center;font-size:30px">${eur(a)}</div><div class="muted" style="font-size:13px;margin-bottom:10px"><span class="live"></span> ${T('Waiting for the customer to scan or tap…','Ожидаем, пока покупатель отсканирует или приложит телефон…')}</div>
    <div class="row" style="justify-content:center"><button class="btn pri sm" data-how="wallet">${T('Pay from my wallet (Lena)','Оплатить из моего кошелька (Лена)')}</button><button class="btn sm" data-how="online">${T('Another customer pays','Платит другой покупатель')}</button><button class="btn sm" data-how="offline">${T('Customer taps offline','Покупатель офлайн')}</button><button class="btn sm danger" id="cancel">${T('Cancel','Отмена')}</button></div></div>`}
  else{const l=p.last;till=`<div class="wait" style="padding:16px 0"><div style="font-size:50px">✅</div><div class="disp" style="text-align:center;font-size:30px">${eur(l.amt)}</div><div class="muted">${l.how==='offline'?T('Accepted offline — settles on sync','Принято офлайн — проведётся при синхронизации'):T('Settled instantly · final · €0.00 fee','Проведено мгновенно · окончательно · комиссия €0,00')}</div><button class="btn pri" id="next" style="margin-top:12px">${T('Next sale','Следующая продажа')}</button></div>`}
  el.innerHTML=`<div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))"><div class="card kpi"><div class="l">${T('Sales today','Продажи сегодня')}</div><div class="v">${eur(tot)}</div><div class="d">${ok.length} ${T('payments','платежей')}</div></div>
    <div class="card kpi"><div class="l">${T('Average ticket','Средний чек')}</div><div class="v">${eur(ok.length?tot/ok.length:0)}</div><div class="d">${T('digital euro only','только цифровой евро')}</div></div>
    <div class="card kpi"><div class="l">${T('Saved vs card fees','Экономия на комиссиях')}</div><div class="v ok-t">${eur(tot*.014)}</div><div class="d">${T('cards ≈ 1.4% MSC','карты ≈ 1,4%')}</div></div>
    <div class="card kpi"><div class="l">${T('Offline accepted','Принято офлайн')}</div><div class="v">${today.filter(s=>s.how==='offline').length}</div><div class="d">${today.filter(s=>s.st==='pending').length} ${T('awaiting sync','ждут синхр.')}</div></div></div>
  <div class="split"><div class="card"><h3>🏪 Café Lumen · ${T('till 1','касса 1')}<span class="sp"></span><span class="pill ok">${T('Acceptance active','Приём активен')}</span></h3>${till}</div>
  <div><div class="card chart" style="margin-bottom:14px"><h3>${T('Takings by hour','Выручка по часам')}</h3>${barChart({labels:hrs.map(h=>h+''),series:[{v:hv,c:cssv('--mal')}],fmt:v=>'€'+Math.round(v),h:190})}</div>
    <div class="card"><h3>${T('Today’s payments','Платежи сегодня')}</h3><div class="tw" style="max-height:320px;overflow:auto"><table><thead><tr><th>${T('Time','Время')}</th><th>ID</th><th>${T('Channel','Канал')}</th><th style="text-align:right">${T('Amount','Сумма')}</th><th>${T('Status','Статус')}</th><th></th></tr></thead><tbody>
    ${S.sales.slice(0,25).map(s=>`<tr><td>${fmtH(s.t)}</td><td class="mono">${s.id}</td><td>${{online:T('QR online','QR онлайн'),wallet:T('QR · Lena W.','QR · Лена В.'),offline:T('Tap offline','Касание офлайн')}[s.how]}</td><td class="mono" style="text-align:right">${eur(s.amt)}</td><td><span class="pill ${s.st==='ok'?'ok':s.st==='pending'?'warn':'bad'}">${{ok:T('settled','проведено'),pending:T('pending sync','ждёт синхр.'),refunded:T('refunded','возврат')}[s.st]}</span></td><td>${s.st==='ok'?`<button class="btn sm" data-ref="${s.id}">${T('Refund','Возврат')}</button>`:''}</td></tr>`).join('')}</tbody></table></div></div></div></div>`;
  $$('[data-k]',el).forEach(b=>b.onclick=()=>{const k=b.dataset.k;let a=p.amt||'';if(k==='⌫')a=a.slice(0,-1);else if(k==='.'){if(!a.includes('.'))a=(a||'0')+'.'}else{if(/\.\d\d$/.test(a)||a.replace('.','').length>=7)return;a=(a==='0'?'':a)+k}p.amt=a;save();$('.disp',el).textContent='€'+(a||'0')});
  const ch=$('#charge');if(ch)ch.onclick=()=>{const a=parseAmt(p.amt);if(!(a>0)||a>5000){$('#kErr').textContent=T('Enter an amount between €0.01 and €5,000','Введите сумму от €0,01 до €5 000');return}p.stage=1;save();rPos()};
  const cc=$('#cancel');if(cc)cc.onclick=()=>{p.stage=0;save();rPos()};
  const nx=$('#next');if(nx)nx.onclick=()=>{S.pos={amt:'',stage:0,last:p.last};save();rPos()};
  $$('[data-how]',el).forEach(b=>b.onclick=()=>{const a=parseAmt(p.amt),how=b.dataset.how;
    if(how==='wallet'){if(S.offline){toast(T('Your wallet is offline — use the offline purse or reconnect','Ваш кошелёк офлайн — используйте офлайн-кошелёк или подключитесь'),'bad');return}const er=spend(a,'Café Lumen','pos','');if(er){toast(er,'bad');return}}
    const s={id:nid('S'),t:now(),amt:a,how,st:how==='offline'?'pending':'ok'};S.sales.unshift(s);if(how!=='wallet')pushFeed(how==='offline'?'offp':'pos',a);
    p.last={amt:a,how,id:s.id};p.stage=2;save();rPos();toast(T('Payment received: '+eur(a),'Оплата получена: '+eur(a)));
    if(how==='offline')setTimeout(()=>{s.st='ok';save();if(S.view==='pos')rPos();toast(T('Offline sale '+s.id+' settled','Офлайн-продажа '+s.id+' проведена'))},2500)});
  $$('[data-ref]',el).forEach(b=>b.onclick=()=>{const s=S.sales.find(x=>x.id===b.dataset.ref);if(!s)return;s.st='refunded';if(s.how==='wallet')receive(s.amt,'Café Lumen','in',T('Refund','Возврат'));save();rPos();toast(T('Refunded '+eur(s.amt),'Возвращено '+eur(s.amt)))});
}

/* ---------- CENTRAL BANK MONITOR ---------- */
function rMon(){const el=$('#v-mon');const c=S.cb;const n=c.circ.length;const last=c.circ[n-1];const issT=c.iss.reduce((a,b)=>a+b,0),redT=c.red.reduce((a,b)=>a+b,0);
  const wal=c.psp.reduce((a,p)=>a+p.w,0);const lbl=c.circ.map((_,i)=>{const d=new Date(NOW0-(n-1-i)*864e5);return i%5===4||i===0?d.toLocaleDateString(loc(),{day:'numeric',month:'short'}):''});
  const B=[250,500,1000,1500,2000,2500,3000,4000,5000];const dist=[9.8,6.1,5.2,3.3,1.9,1.1,.62,.0,.0];
  const lim=c.limitPol;const bl=B.map((b,i)=>(i?B[i-1]:0)+'–'+(b>=1000?b/1000+'k':b));const markI=B.indexOf(lim)+1;
  const dv=dist.map((v,i)=>B[i]>lim?0:(B[i]===lim||(i&&B[i-1]<lim&&B[i]>=lim))?v+.4:v);
  el.innerHTML=`<div class="kpis"><div class="card kpi"><div class="l">${T('In circulation','В обращении')}</div><div class="v">€${num(last,2)} ${T('bn','млрд')}</div><div class="d ok-t">▲ ${num((last-c.circ[n-8])*1000,0)} ${T('m in 7 days','млн за 7 дней')}</div></div>
    <div class="card kpi"><div class="l">${T('Issued · 30 days','Выпущено · 30 дн.')}</div><div class="v">€${num(issT/1000,2)} ${T('bn','млрд')}</div><div class="d">${T('redeemed','погашено')} €${num(redT/1000,2)} ${T('bn','млрд')}</div></div>
    <div class="card kpi"><div class="l">${T('Active wallets','Активные кошельки')}</div><div class="v">${num(wal,1)} ${T('m','млн')}</div><div class="d">${T('6 intermediaries','6 посредников')}</div></div>
    <div class="card kpi"><div class="l">${T('Transactions today','Операций сегодня')}</div><div class="v" id="txCount">${num(c.todayTx)}</div><div class="d"><span class="live"></span> ${T('live','онлайн')}</div></div>
    <div class="card kpi"><div class="l">${T('Offline share','Доля офлайн')}</div><div class="v">7.4%</div><div class="d">${T('of payment count','от числа платежей')}</div></div></div>
  <div class="grid2"><div class="card chart"><h3>${T('Digital euro in circulation, € bn','Цифровой евро в обращении, € млрд')}<span class="sp"></span><span class="legend"><span><i style="background:${cssv('--blue')}"></i>${T('circulation','обращение')}</span></span></h3>
    ${lineChart({series:[{v:c.circ,c:cssv('--blue'),fill:1}],labels:lbl,fmt:v=>num(v,1)})}</div>
    <div class="card"><h3>${T('Ledger stream (pseudonymised)','Поток реестра (псевдонимы)')}<span class="sp"></span><span class="live"></span></h3><div class="feed" id="feed">${feedHtml()}</div></div></div>
  <div class="grid2"><div class="card chart"><h3>${T('Daily issuance vs redemption, € m','Выпуск и погашение по дням, € млн')}<span class="sp"></span><span class="legend"><span><i style="background:${cssv('--mal')}"></i>${T('issued','выпуск')}</span><span><i style="background:${cssv('--gold')}"></i>${T('redeemed','погашение')}</span></span></h3>
    ${barChart({labels:lbl.map((l,i)=>i%5===4||i===0?l:''),series:[{v:c.iss,c:cssv('--mal')},{v:c.red,c:cssv('--gold')}],fmt:v=>Math.round(v),h:210})}</div>
    <div class="card chart"><h3>${T('Holdings per wallet, m wallets','Остатки на кошелёк, млн кошельков')}</h3>${barChart({labels:bl,series:[{v:dv,c:cssv('--violet')}],fmt:v=>num(v,1),h:210,mark:markI,markL:T('limit ','лимит ')+eur(lim,0)})}
    <div class="muted" style="font-size:12px">${T('No wallet holds above the limit: amounts are swept to linked bank accounts.','Ни один кошелёк не держит больше лимита: излишек сбрасывается на банковские счета.')}</div></div></div>
  <div class="card"><h3>${T('Intermediaries (supervised PSPs)','Посредники (поднадзорные ПУП)')}</h3><div class="tw"><table><thead><tr><th>${T('Intermediary','Посредник')}</th><th style="text-align:right">${T('Wallets, m','Кошельки, млн')}</th><th style="text-align:right">${T('Holdings','Остатки')}</th><th>${T('Share','Доля')}</th><th style="text-align:right">${T('Limit breaches','Нарушения лимита')}</th><th>${T('Status','Статус')}</th></tr></thead><tbody>
    ${c.psp.map(p=>{const sh=p.h/last*100;return `<tr><td><b>${p.n}</b></td><td class="mono" style="text-align:right">${num(p.w,1)}</td><td class="mono" style="text-align:right">€${num(p.h,2)} ${T('bn','млрд')}</td><td><div class="row" style="flex-wrap:nowrap"><div class="prog" style="width:90px"><i style="width:${Math.min(100,sh*2.5)}%"></i></div><span class="mono">${num(sh,1)}%</span></div></td><td class="mono" style="text-align:right">${p.br}</td><td><span class="pill ${p.st==='ok'?'ok':'warn'}">${p.st==='ok'?T('compliant','соответствует'):T('under review','на проверке')}</span></td></tr>`}).join('')}</tbody></table></div></div>`;
}

/* ---------- ISSUANCE & POLICY ---------- */
function rIss(){const el=$('#v-iss');const c=S.cb;const n=c.circ.length;
  el.innerHTML=`<div class="split"><div class="card"><h3>🏛 ${T('Issue or redeem a tranche','Выпуск или погашение транша')}</h3>
    <div class="fgrid"><div class="f full"><label>${T('Intermediary','Посредник')}</label><select class="input" id="iPsp">${c.psp.map((p,i)=>`<option value="${i}">${p.n} — €${num(p.h,2)} ${T('bn','млрд')}</option>`).join('')}</select></div>
    <div class="f"><label>${T('Operation','Операция')}</label><select class="input" id="iOp"><option value="iss">${T('Issue (against reserves)','Выпуск (против резервов)')}</option><option value="red">${T('Redeem (back to reserves)','Погашение (в резервы)')}</option></select></div>
    <div class="f"><label>${T('Amount, € m','Сумма, € млн')}</label><input class="input" id="iAmt" inputmode="numeric" placeholder="1–500"></div>
    <div class="f full"><label>${T('Settlement reference','Референс расчёта')}</label><input class="input" id="iRef" value="RTGS-${(hashS(String(S.seq))%90000+10000)}"></div></div>
    <div class="err" id="iErr"></div><div class="row"><button class="btn pri" id="iGo">${T('Submit for dual approval','Отправить на двойное одобрение')}</button><span class="muted" style="font-size:12px">${T('4-eyes: a second operator signs automatically in the demo','Принцип 4 глаз: в демо второй оператор подписывает автоматически')}</span></div></div>
  <div class="card"><h3>⚖ ${T('Holding limit policy','Политика лимита хранения')}</h3>
    <div class="f"><label>${T('Holding limit per person','Лимит хранения на человека')}: <b id="limV">${eur(c.limitPol,0)}</b></label><input type="range" id="limR" min="1000" max="5000" step="500" value="${c.limitPol}" style="width:100%;accent-color:var(--mal)"></div>
    <div class="f" style="margin-top:12px"><label>${T('Offline purse limit','Лимит офлайн-кошелька')}</label><div class="chips">${[150,300,500,1000].map(v=>`<button class="chip ${S.purseLimit===v?'on':''}" data-ol="${v}">${eur(v,0)}</button>`).join('')}</div></div>
    <div class="sum" id="impact"></div>
    <button class="btn gold" id="limGo">${T('Apply policy to all wallets','Применить политику ко всем кошелькам')}</button></div></div>
  <div class="card"><h3>${T('Tranche ledger','Реестр траншей')}<span class="sp"></span><span class="pill">${c.tr.length} ${T('records','записей')}</span></h3><div class="tw"><table><thead><tr><th>ID</th><th>${T('Time','Время')}</th><th>${T('Intermediary','Посредник')}</th><th>${T('Operation','Операция')}</th><th style="text-align:right">${T('Amount','Сумма')}</th><th>${T('Reference','Референс')}</th><th>${T('Status','Статус')}</th></tr></thead><tbody>
    ${c.tr.map(t=>`<tr><td class="mono">${t.id}</td><td>${fmtT(t.t)}</td><td>${t.psp}</td><td>${t.op==='iss'?'<span class="ok-t">▲ '+T('Issue','Выпуск')+'</span>':'<span class="warn-t">▼ '+T('Redeem','Погашение')+'</span>'}</td><td class="mono" style="text-align:right">€${num(t.amt)} ${T('m','млн')}</td><td class="mono">${t.ref}</td><td><span class="pill ${t.st==='ok'?'ok':'warn'}">${t.st==='ok'?T('settled','проведён'):T('awaiting 2nd signature','ждёт 2-й подписи')}</span></td></tr>`).join('')}</tbody></table></div></div>`;
  let ol=S.purseLimit;
  const imp=()=>{const v=+$('#limR').value;$('#limV').textContent=eur(v,0);const B=[250,500,1000,1500,2000,2500,3000];const aff=v>=3000?0:v>=2500?.62:v>=2000?1.72:v>=1500?3.6:v>=1000?6.9:9;
    $('#impact').innerHTML=`<div><span>${T('Wallets above new limit','Кошельков выше нового лимита')}</span><b>${num(aff,2)} ${T('m','млн')}</b></div><div><span>${T('Est. outflow to bank deposits','Оценка оттока в депозиты')}</span><b>€${num(aff*(v<3000?420:0)/1000,2)} ${T('bn','млрд')}</b></div><div><span>${T('Your demo wallet','Ваш демо-кошелёк')}</span><b>${S.bal>v?T('will sweep ','сбросит ')+eur(S.bal-v):T('unaffected','без изменений')}</b></div>`};
  imp();$('#limR').oninput=imp;
  $$('[data-ol]',el).forEach(b=>b.onclick=()=>{ol=+b.dataset.ol;$$('[data-ol]',el).forEach(x=>x.classList.toggle('on',x===b))});
  $('#limGo').onclick=()=>{const v=+$('#limR').value;c.limitPol=v;S.limit=v;S.purseLimit=ol;
    if(S.bal>v){const ex=Math.round((S.bal-v)*100)/100;S.bal=v;S.bank+=ex;addTx({k:'sweep',amt:-ex,cp:'Aurel Bank',note:T('Policy change','Изменение политики')})}
    if(S.purse>ol){const ex=Math.round((S.purse-ol)*100)/100;S.purse=ol;S.bal+=ex;addTx({k:'offu',amt:ex,cp:T('Offline purse','Офлайн-кошелёк'),note:T('Policy change','Изменение политики')})}
    save();rIss();toast(T('Policy applied: holding limit '+eur(v,0)+', offline '+eur(ol,0),'Политика применена: лимит '+eur(v,0)+', офлайн '+eur(ol,0)))};
  $('#iGo').onclick=()=>{const i=+$('#iPsp').value,op=$('#iOp').value,a=parseInt($('#iAmt').value,10),ref=$('#iRef').value.trim();const p=c.psp[i];let er='';
    if(!(a>=1&&a<=500))er=T('Amount must be between €1 m and €500 m per tranche','Сумма транша — от €1 млн до €500 млн');
    else if(op==='red'&&a/1000>p.h)er=T('Cannot redeem more than the intermediary holds','Нельзя погасить больше, чем у посредника');
    else if(!/^[A-Z]{2,6}-\d{3,8}$/.test(ref))er=T('Reference format: RTGS-12345','Формат референса: RTGS-12345');
    if(er){$('#iErr').textContent=er;return}
    const t={id:'TR-26-'+(4417+c.tr.length),t:now(),psp:p.n,op,amt:a,st:'pending',ref};c.tr.unshift(t);save();rIss();toast(T('Tranche '+t.id+' submitted — awaiting second signature','Транш '+t.id+' отправлен — ждёт второй подписи'),'gold');
    setTimeout(()=>{t.st='ok';const d=(op==='iss'?1:-1)*a/1000;p.h=Math.round((p.h+d)*1000)/1000;c.circ[n-1]=Math.round((c.circ[n-1]+d)*1000)/1000;if(op==='iss')c.iss[n-1]+=a;else c.red[n-1]+=a;save();if(S.view==='iss'||S.view==='mon')render();toast(T('Tranche '+t.id+' settled in RTGS ✓','Транш '+t.id+' проведён в RTGS ✓'))},1600)};
}

/* ---------- login & wiring ---------- */
let startView='wallet';
$$('#roles .role').forEach(b=>b.onclick=()=>{startView=b.dataset.role;$$('#roles .role').forEach(x=>x.classList.toggle('on',x===b))});
$('#login').onclick=()=>{const u=$('#lgU').value.trim(),p=$('#lgP').value;if(!/^\S+@\S+\.\S+$/.test(u)&&!/^@\w/.test(u)){$('#lgErr').textContent=T('Enter a wallet ID or email','Введите ID кошелька или почту');return}
  if(p.length<6){$('#lgErr').textContent=T('Password must be at least 6 characters','Пароль — минимум 6 символов');return}
  $('#lgErr').textContent='';S.auth=true;S.view=startView;save();render();toast(T('Signed in · strong authentication passed','Вход выполнен · строгая аутентификация пройдена'))};
$('#logout').onclick=()=>{S.auth=false;save();render()};
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#reset').onclick=()=>{store.clear();S=seed();S.auth=true;save();render();toast(T('Demo reset','Демо сброшено'))};
PT.onLang(()=>render());
document.addEventListener('DOMContentLoaded',()=>render());
})();
</script>
