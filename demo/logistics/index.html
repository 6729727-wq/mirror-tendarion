<style>
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1306;font-size:16px;flex:none}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--gold);color:#1a1306;border-radius:999px;padding:0 7px;font-weight:700}
.nav .cnt.r{background:var(--red);color:#fff}
.grow{flex:1}
.who{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);font-size:12.5px}
.who b{display:block;font-size:13.5px}
.cls{display:inline-block;margin-top:6px;font-size:10px;font-weight:800;letter-spacing:.12em;color:#1a1306;background:var(--gold);border-radius:4px;padding:1px 6px}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.how>div>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold2);flex:none;font-size:13px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f{margin-bottom:10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fgrid .full{grid-column:1/-1}
.err{color:var(--red);font-size:12px;min-height:16px}
.input.bad{border-color:var(--red)}
.ok-t{color:var(--mal3)} .bad-t{color:var(--red)} .warn-t{color:var(--amber)} .gold-t{color:var(--gold2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal;min-width:180px}
tr:last-child td{border-bottom:none}
tr.sel td{background:color-mix(in srgb,var(--mal) 8%,transparent)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.loginw{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:24px 16px;background:radial-gradient(ellipse at 80% 0%,color-mix(in srgb,var(--gold) 14%,transparent),transparent 60%),radial-gradient(ellipse at 0% 100%,color-mix(in srgb,var(--mal) 14%,transparent),transparent 55%)}
.loginc{width:100%;max-width:430px;padding:26px;box-shadow:var(--shadow)}
.loginc h2{margin:6px 0 4px;font-size:21px}
.demo{font-size:12px;border:1px dashed var(--line2);border-radius:10px;padding:8px 10px;margin:12px 0;color:var(--muted)}
.banner{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-align:center;color:#1a1306;background:var(--gold);border-radius:6px;padding:3px;margin-bottom:12px}
/* board */
.unit{margin-bottom:16px}
.unit h4{margin:0 0 8px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.unit h4 .sp{flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-left:5px solid var(--mal);border-radius:10px;padding:8px 10px;background:var(--bg2);cursor:pointer;text-align:left;min-height:62px}
.tile.PMC{border-left-color:var(--amber)} .tile.NMC{border-left-color:var(--red)}
.tile.on{outline:2px solid var(--gold);outline-offset:1px}
.tile b{display:block;font-family:var(--mono);font-size:12.5px}
.tile span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-weight:800;font-size:11px}
.st.FMC{color:var(--mal3)} .st.PMC{color:var(--amber)} .st.NMC{color:var(--red)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:700;font-size:13px}
.seg button.on.FMC{background:var(--mal);color:#fff}.seg button.on.PMC{background:var(--amber);color:#1a1306}.seg button.on.NMC{background:var(--red);color:#fff}
.sticky{position:sticky;top:60px}
.steps{display:flex;margin:2px 0}
.steps div{flex:1;position:relative;text-align:center;font-size:10.5px;color:var(--dim);min-width:56px}
.steps div:before{content:"";position:absolute;top:5px;left:-50%;width:100%;height:2px;background:var(--line2)}
.steps div:first-child:before{display:none}
.steps i{display:block;width:12px;height:12px;border-radius:50%;margin:0 auto 3px;background:var(--panel2);border:2px solid var(--line2);position:relative;z-index:1}
.steps .ok i{background:var(--mal);border-color:var(--mal)} .steps .ok:before,.steps .cur:before{background:var(--mal)}
.steps .cur i{border-color:var(--gold);background:var(--gold)} .steps .ok,.steps .cur{color:var(--text)}
.map svg{width:100%;height:auto;display:block;touch-action:manipulation}
.map .dp{cursor:pointer}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mal2),var(--mal3))}
.cv{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--bg2);cursor:pointer}
.cv.on{border-color:var(--mal)}
.cv .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cv .top b{flex:1;min-width:140px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.intro{grid-template-columns:minmax(0,1fr)}.sticky{position:static}}
@media (max-width:860px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;left:0;top:45px;z-index:1500;width:260px;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
 .side.open{transform:none}
 .menu-btn{display:inline-flex}
 main{padding:14px 14px 50px}
 .head h1{font-size:20px}
}
@media (max-width:560px){.how{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}.kpi .v{font-size:20px}.kpis{gap:10px}.card{padding:14px}.tiles{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}.seg button{padding:8px 10px}}
</style>
</head>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const KEY='pt_logistics_state';
const store={load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},clear(){try{localStorage.removeItem(KEY)}catch(e){}}};
const loc=()=>PT.lang==='ru'?'ru-RU':'en-GB';
const num=n=>Math.round(n).toLocaleString(loc());
const eur=n=>'€'+Math.round(n).toLocaleString(loc());
const DAY=864e5;
const fmtD=t=>new Date(t).toLocaleDateString(loc(),{day:'numeric',month:'short'});
function toast(m,c){const t=document.createElement('div');t.className='toast '+(c||'');t.innerHTML=m;$('#toasts').append(t);setTimeout(()=>t.remove(),3800)}

const PLAT={BSN:['Bison MBT','Танк «Бизон»','1st Armoured Brigade','1-я бронетанковая бригада',8],KST:['Kestrel IFV','БМП «Кестрел»','7th Mechanised Brigade','7-я механизированная бригада',10],MUL:['Mule 8×8 truck','Грузовик «Мул» 8×8','12th Logistics Regiment','12-й полк обеспечения',12],OSP:['Osprey UH-4 helicopter','Вертолёт «Оспри» UH-4','4th Aviation Wing','4-е авиакрыло',6]};
const pl=k=>T(PLAT[k][0],PLAT[k][1]), un=k=>T(PLAT[k][2],PLAT[k][3]);
// nsn, en, ru, platform, unit price €
const PARTS=[['2815-21-700-1123','Engine fuel injector','Топливная форсунка двигателя','BSN',1840],['2520-21-633-0450','Final drive gearbox','Бортовая передача','BSN',46200],['5820-21-650-1177','Vehicle radio transceiver','Бортовая радиостанция','BSN',15300],
['2530-21-614-0071','Track tensioner','Натяжитель гусеницы','KST',3900],['5855-21-902-3311','Thermal imager module','Модуль тепловизора','KST',28700],['2540-21-118-7720','Track link set (80)','Комплект траков (80)','KST',12400],
['2920-21-510-0045','Starter motor 24 V','Стартер 24 В','MUL',1260],['2610-21-447-9032','Tyre 14.00R20','Шина 14.00R20','MUL',890],['6140-21-220-0808','Battery 6TL 12 V','Аккумулятор 6TL 12 В','MUL',410],
['1615-21-801-2290','Main rotor damper','Демпфер несущего винта','OSP',18600],['1680-21-334-5501','Hydraulic pump','Гидронасос','OSP',22400],['6610-21-090-4412','Air data computer','Вычислитель воздушных сигналов','OSP',31800]];
const PN={};PARTS.forEach(p=>PN[p[0]]={nsn:p[0],en:p[1],ru:p[2],plat:p[3],price:p[4]});
const pn=n=>T(PN[n].en,PN[n].ru);
// depots: id, en, ru, x, y, threat
const DEP=[['D1','Northgate Central Depot','Центральный склад Нортгейт',300,92,0],['D2','Varn Harbour Depot','Склад порт Варн',110,190,0],['D3','Kessel Air Base','Авиабаза Кессель',430,180,0],['D4','Eastmark Forward Base','Передовая база Истмарк',560,280,2],['D5','Southfort Depot','Склад Саутфорт',265,322,1]];
const DP={};DEP.forEach(d=>DP[d[0]]={id:d[0],en:d[1],ru:d[2],x:d[3],y:d[4],thr:d[5]});
const dn=id=>T(DP[id].en,DP[id].ru);
const ROADS=[['D1','D2'],['D1','D3'],['D2','D5'],['D3','D4'],['D3','D5'],['D5','D4'],['D1','D5']];
const KM=1.55;
const dist=(a,b)=>Math.hypot(DP[a].x-DP[b].x,DP[a].y-DP[b].y)*KM*1.18;
function route(a,b){const D={},P={},Q=new Set(DEP.map(d=>d[0]));Q.forEach(k=>D[k]=1e9);D[a]=0;
 while(Q.size){let u=null;Q.forEach(k=>{if(u===null||D[k]<D[u])u=k});Q.delete(u);if(u===b)break;
  ROADS.forEach(([x,y])=>{const v=x===u?y:y===u?x:null;if(v&&Q.has(v)){const alt=D[u]+dist(u,v);if(alt<D[v]){D[v]=alt;P[v]=u}}})}
 const path=[b];while(path[0]!==a)path.unshift(P[path[0]]);return{path,km:D[b]}}
const RST=[['Submitted','Подана'],['Approved','Согласована'],['Picked','Собрана'],['Shipped','Отгружена'],['Received','Получена']];
const CARGO={spares:['Spare parts','Запчасти'],ammo:['Ammunition','Боеприпасы'],fuel:['Fuel (bulk)','Топливо (наливом)'],rations:['Rations & water','Продовольствие и вода']};
const CST=[['Planned','Запланирована'],['En route','В пути'],['Arrived','Прибыла']];
const REASON={S:['Awaiting parts (NMCS)','Ждёт запчасти (NMCS)'],M:['In maintenance (NMCM)','На ремонте (NMCM)']};

function seed(){
 const r=rng(7),now=Date.now();const assets=[];
 Object.entries(PLAT).forEach(([k,p])=>{for(let i=0;i<p[4];i++){const x=r();const st=x<.68?'FMC':x<.82?'PMC':'NMC';

/* ---------- KPIs ---------- */
function rKpi(){
 const el=$('#v-kpi');const ks=Object.keys(PLAT);const cols={BSN:'var(--gold)',KST:'var(--mal)',MUL:'var(--blue)',OSP:'var(--violet)'};
 // bar chart
 const W=560,H=240,pl0=40,bw=(W-pl0-20)/ks.length;const Y=v=>20+(1-v/100)*(H-50);
 const bars=ks.map((k,i)=>{const r=ready(k);const x=pl0+i*bw+bw*.2,w=bw*.6;const fy=Y(r.f/r.n*100),py=Y((r.f+r.p)/r.n*100);
  return`<rect x="${x}" y="${py}" width="${w}" height="${fy-py}" rx="3" style="fill:var(--amber);opacity:.75"/><rect x="${x}" y="${fy}" width="${w}" height="${Y(0)-fy}" rx="3" style="fill:${cols[k]}"/><text x="${x+w/2}" y="${py-6}" text-anchor="middle" style="fill:var(--text);font-size:13px;font-weight:700">${r.pct}%</text><text x="${x+w/2}" y="${H-12}" text-anchor="middle" style="fill:var(--muted);font-size:11px">${esc(pl(k).split(' ')[0].replace(/[«»]/g,''))}</text>`}).join('');
 const grid=[0,25,50,75,100].map(v=>`<line x1="${pl0}" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:${v===75?'var(--red)':'var(--line)'};${v===75?'stroke-dasharray:5 4':''}"/><text x="${pl0-6}" y="${Y(v)+4}" text-anchor="end" style="fill:var(--dim);font-size:10px">${v}</text>`).join('');
 // trend
 const TW=560,TH=220,tl=36;const n=12;const TX=i=>tl+i*(TW-tl-14)/(n-1),TY=v=>14+(1-(v-40)/60)*(TH-44);
 const lines=ks.map(k=>{const s=S.trend[k].concat([ready(k).pct]);return`<polyline points="${s.map((v,i)=>TX(i).toFixed(1)+','+TY(v).toFixed(1)).join(' ')}" style="fill:none;stroke:${cols[k]};stroke-width:2.2"/><circle cx="${TX(n-1)}" cy="${TY(s[n-1])}" r="4" style="fill:${cols[k]}"/>`}).join('');
 const tg=[40,60,75,100].map(v=>`<line x1="${tl}" x2="${TW-14}" y1="${TY(v)}" y2="${TY(v)}" style="stroke:${v===75?'var(--red)':'var(--line)'};${v===75?'stroke-dasharray:5 4':''}"/><text x="${tl-6}" y="${TY(v)+4}" text-anchor="end" style="fill:var(--dim);font-size:10px">${v}</text>`).join('')+[0,3,6,9,11].map(i=>`<text x="${TX(i)}" y="${TH-8}" text-anchor="middle" style="fill:var(--dim);font-size:10px">${i===11?T('now','сейчас'):T('W','Н')+(i-11)}</text>`).join('');
 // donut NMC reasons
 const nmc=S.assets.filter(a=>a.st==='NMC');const ns=nmc.filter(a=>a.rsn==='S').length,nm=nmc.length-ns;
 const C=2*Math.PI*52;const fS=nmc.length?ns/nmc.length:0;
 const donut=`<svg viewBox="0 0 160 160" style="max-width:180px;margin:0 auto"><circle cx="80" cy="80" r="52" style="fill:none;stroke:var(--line);stroke-width:20"/><circle cx="80" cy="80" r="52" transform="rotate(-90 80 80)" style="fill:none;stroke:var(--red);stroke-width:20;stroke-dasharray:${fS*C} ${C}"/><circle cx="80" cy="80" r="52" transform="rotate(${-90+fS*360} 80 80)" style="fill:none;stroke:var(--amber);stroke-width:20;stroke-dasharray:${(1-fS)*C*(nmc.length?1:0)} ${C}"/><text x="80" y="78" text-anchor="middle" style="fill:var(--text);font-size:26px;font-weight:800">${nmc.length}</text><text x="80" y="98" text-anchor="middle" style="fill:var(--muted);font-size:11px">NMC</text></svg>`;
 // top drivers
 const drv={};nmc.filter(a=>a.part).forEach(a=>drv[a.part]=(drv[a.part]||0)+1);const drs=Object.entries(drv).sort((a,b)=>b[1]-a[1]);
 const avgWait=S.reqs.filter(q=>q.st<4&&q.st>=0).reduce((t,q)=>t+(now()-q.date)/DAY,0)/Math.max(1,S.reqs.filter(q=>q.st<4&&q.st>=0).length);
 const fill=(()=>{let ok=0,t=0;S.reqs.filter(q=>q.st>=0).forEach(q=>{t++;if(S.stock[q.depot][q.nsn]>=q.qty||q.st>=2)ok++});return t?Math.round(ok/t*100):100})();
 el.innerHTML=`<div class="kpis"><div class="card kpi"><div class="l">${T('Overall readiness','Общая готовность')}</div><div class="v ${ready().pct>=75?'ok-t':'warn-t'}">${ready().pct}%</div><div class="d">${T('target','цель')} 75%</div></div>
 <div class="card kpi"><div class="l">MICAP</div><div class="v bad-t">${micap()}</div><div class="d">${T('NMC awaiting parts','NMC в ожидании запчастей')}</div></div>
 <div class="card kpi"><div class="l">${T('Depot fill rate','Обеспеченность со склада')}</div><div class="v">${fill}%</div><div class="d">${T('requests met from stock','заявок со склада')}</div></div>
 <div class="card kpi"><div class="l">${T('Avg request age','Средний возраст заявки')}</div><div class="v">${avgWait.toFixed(1)} ${T('d','дн.')}</div><div class="d">${T('open requests','открытые')}</div></div></div>
 <div class="grid2"><div class="card chart"><h3>${T('Readiness by fleet','Готовность по паркам')}<span class="sp"></span><span class="legend"><span><i style="background:var(--mal)"></i>FMC</span><span><i style="background:var(--amber)"></i>PMC</span><span><i style="background:var(--red);height:2px"></i>${T('target 75%','цель 75%')}</span></span></h3><svg viewBox="0 0 ${W} ${H}" role="img">${grid}${bars}</svg></div>
 <div class="card chart"><h3>${T('NMC causes','Причины неисправности')}</h3>${donut}<div class="legend" style="justify-content:center;margin:8px 0 12px"><span><i style="background:var(--red)"></i>${T('Supply (NMCS)','Снабжение (NMCS)')} ${ns}</span><span><i style="background:var(--amber)"></i>${T('Maintenance (NMCM)','Ремонт (NMCM)')} ${nm}</span></div>
 <div class="muted" style="font-size:12px;margin-bottom:6px">${T('Top readiness drivers (parts)','Главные дефицитные запчасти')}</div>${drs.slice(0,4).map(([k,c])=>`<div class="row" style="font-size:13px;margin-bottom:4px;flex-wrap:nowrap"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(pn(k))}</span><b class="bad-t">${c}</b></div>`).join('')||`<div class="muted" style="font-size:13px">—</div>`}</div></div>
 <div class="card chart" style="margin-top:14px"><h3>${T('12-week readiness trend','Тренд готовности за 12 недель')}<span class="sp"></span><span class="legend">${ks.map(k=>`<span><i style="background:${cols[k]}"></i>${esc(pl(k))}</span>`).join('')}</span></h3><svg viewBox="0 0 ${TW} ${TH}" role="img">${tg}${lines}</svg></div>`;
}

function rReq(){
 const el=$('#v-req');const d=S.draft||{asset:'',nsn:'',pri:'06',depot:'D1'};
 const ast=S.assets.find(a=>a.id===d.asset);const parts=PARTS.filter(p=>!ast||p[3]===ast.plat);

function step(q,loud){

function plan(from,to,veh,cargo){const r=route(from,to);const km=Math.round(r.km);const hrs=km/42+Math.floor(km/42/4)*0.5+1;const fuel=Math.round(veh*km*0.48);const thr=Math.max(...r.path.map(p=>DP[p].thr));const escort=thr>=2||cargo==='ammo'||cargo==='fuel'||(thr>=1&&veh>10);return{...r,km,hrs,fuel,escort,thr}}
function posOn(path,f){const seg=[];let tot=0;for(let i=1;i<path.length;i++){const l=Math.hypot(DP[path[i]].x-DP[path[i-1]].x,DP[path[i]].y-DP[path[i-1]].y);seg.push(l);tot+=l}let d=f*tot;for(let i=0;i<seg.length;i++){if(d<=seg[i]){const a=DP[path[i]],b=DP[path[i+1]],t=seg[i]?d/seg[i]:0;return[a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t]}d-=seg[i]}const z=DP[path[path.length-1]];return[z.x,z.y]}

  if(p.from===p.to)e=T('Origin and destination must differ','Пункты отправления и назначения должны различаться');
  else if(!Number.isInteger(v)||v<2||v>40)e=T('Vehicles must be between 2 and 40','Число машин — от 2 до 40');
  else if(!p.date||new Date(p.date).getTime()<new Date(minD).getTime())e=T('Departure date cannot be in the past','Дата выхода не может быть в прошлом');
  $('#cerr').textContent=e;if(e)return;const pv=plan(p.from,p.to,v,p.cargo);
  const c={id:'CNV-0'+(S.nextCnv++),from:p.from,to:p.to,veh:v,cargo:p.cargo,date:new Date(p.date).getTime(),st:0,escort:pv.escort};S.convoys.unshift(c);S.selCnv=c.id;
  logit(`${c.id} planned ${DP[c.from].en} → ${DP[c.to].en}`,`${c.id} запланирована ${DP[c.from].ru} → ${DP[c.to].ru}`);save();toast(T(`${c.id} saved${pv.escort?' — escort requested':''}`,`${c.id} сохранена${pv.escort?' — запрошена охрана':''}`),pv.escort?'gold':'');rConv()};
 $$('[data-cv]',el).forEach(b=>b.onclick=e=>{if(e.target.closest('button'))return;S.selCnv=b.dataset.cv;const c=S.convoys.find(x=>x.id===b.dataset.cv);S.plan={...S.plan,from:c.from,to:c.to,veh:c.veh,cargo:c.cargo};save();rConv()});
 $$('[data-cgo]',el).forEach(b=>b.onclick=()=>{const c=S.convoys.find(x=>x.id===b.dataset.cgo);c.st++;c.prog=c.st===1?0.05:1;S.selCnv=c.id;logit(`${c.id} ${c.st===1?'departed':'arrived'}`,`${c.id} ${c.st===1?'вышла':'прибыла'}`);save();toast(T(`${c.id}: ${CST[c.st][0]}`,`${c.id}: ${CST[c.st][1]}`));render()});
 $$('[data-cx]',el).forEach(b=>b.onclick=()=>{S.convoys=S.convoys.filter(x=>x.id!==b.dataset.cx);save();toast(T('Movement cancelled','Перемещение отменено'),'bad');render()});
}

/* ---------- day simulation ---------- */
function advance(){
 S.day++;const r=rng(S.day*97+3);let moved=0,back=0,broke=0;
 S.reqs.filter(q=>q.st>=1&&q.st<4).forEach(q=>{const before=S.assets.filter(a=>a.st==='FMC').length;if(step(q,false))moved++;if(S.assets.filter(a=>a.st==='FMC').length>before)back++});
 S.convoys.forEach(c=>{if(c.st===0&&c.date<=now()){c.st=1;c.prog=0}if(c.st===1){const p=plan(c.from,c.to,c.veh,c.cargo);c.prog=Math.min(1,(c.prog||0)+Math.min(1,16/p.hrs));if(c.prog>=1){c.st=2;logit(`${c.id} arrived`,`${c.id} прибыла`)}}});
 S.assets.filter(a=>a.st==='NMC'&&a.rsn==='M').forEach(a=>{if(r()<.3){a.st='FMC';a.since=now();delete a.rsn;back++}});
 S.assets.filter(a=>a.st==='FMC').forEach(a=>{if(r()<.03){a.st='NMC';a.rsn=r()<.5?'S':'M';a.since=now();if(a.rsn==='S'){const ps=PARTS.filter(p=>p[3]===a.plat);a.part=ps[Math.floor(r()*ps.length)][0]}broke++}});
 Object.keys(PLAT).forEach(k=>{S.trend[k].push(ready(k).pct);S.trend[k]=S.trend[k].slice(-11)});
 save();toast(T(`Day +${S.day}: ${moved} requests progressed, ${back} returned to service, ${broke} new faults`,`День +${S.day}: заявок продвинуто ${moved}, в строй ${back}, новых неисправностей ${broke}`),broke?'gold':'');render();
}

$('#login').onclick=()=>{const u=$('#lu').value.trim(),p=$('#lp').value;if(!/^VLD-\d{5}-[A-Z]{3}$/.test(u)){$('#lerr').textContent=T('Service ID format: VLD-12345-ABC','Формат ID: VLD-12345-ABC');return}if(!/^\d{6}$/.test(p)){$('#lerr').textContent=T('PIN must be 6 digits','PIN — 6 цифр');return}
 $('#lerr').textContent='';S.auth=true;S.role=+$('#lr').value;save();render();toast(T('Signed in · session audited','Вход выполнен · сессия журналируется'))};
$('#lp').onkeydown=e=>{if(e.key==='Enter')$('#login').click()};
$('#logout').onclick=()=>{S.auth=false;save();render()};
$('#advance').onclick=advance;
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#reset').onclick=()=>{store.clear();S=seed();S.auth=true;save();render();toast(T('Demo reset','Демо сброшено'))};
PT.onLang(()=>render());
document.addEventListener('DOMContentLoaded',()=>render());
})();
</script>
