<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sentinel Grid — SOC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
body{overflow-x:hidden}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--bg2),var(--bg))}
.logo2{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em}
.shield{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal),var(--mal2));color:#fff}
.defcon{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2)}
.defcon.lvl1{color:var(--mal3)}.defcon.lvl2{color:var(--amber);border-color:var(--amber)}.defcon.lvl3{color:#fff;background:var(--red);border-color:var(--red);animation:flash 1s infinite}
@keyframes flash{50%{opacity:.6}}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{border:1px solid transparent;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.tab.on{background:var(--panel2);border-color:var(--line2);color:var(--text)}
.tab .cnt{font-size:10px;background:var(--red);color:#fff;border-radius:999px;padding:1px 6px;margin-left:4px}
.sim{margin-left:auto}
.btn.danger{background:linear-gradient(135deg,#ff6b6b,#c62828);border-color:transparent;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:12px 16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;min-width:0}
.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .d{font-size:11px;font-family:var(--mono)}
.page{display:none;padding:0 16px 20px}.page.on{display:block}
.ov{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px;flex-wrap:wrap}
.ph .sp{flex:1}
.live{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:flash 1.2s infinite}
#map{display:block;width:100%;height:380px;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--mal) 8%,transparent),transparent 70%)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.aq{max-height:440px;overflow:auto}
.al{display:grid;grid-template-columns:4px 1fr auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s;align-items:center}
.al:hover{background:var(--panel2)}
.al .sv{width:4px;align-self:stretch;border-radius:3px}
.al b{font-size:13px;display:block}.al small{color:var(--muted);font-size:11px;font-family:var(--mono)}
.al.new{animation:slidein .5s}
@keyframes slidein{from{transform:translateX(30px);opacity:0;background:color-mix(in srgb,var(--red) 20%,transparent)}}
.stream{height:300px;overflow:auto;font-family:var(--mono);font-size:12px;padding:6px 0;background:var(--bg2)}
.ln{padding:1px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .t{color:var(--dim)}.ln .s{font-weight:700;display:inline-block;width:44px}.ln .src{color:var(--blue);display:inline-block;width:40px}
.sv-crit{color:var(--red)}.sv-high{color:#ff8a4c}.sv-med{color:var(--amber)}.sv-low{color:var(--mal3)}.sv-info{color:var(--muted)}
.bg-crit{background:var(--red)}.bg-high{background:#ff8a4c}.bg-med{background:var(--amber)}.bg-low{background:var(--mal3)}.bg-info{background:var(--dim)}
.fchip{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:3px 10px;font-size:11px;cursor:pointer;font-weight:700;color:var(--muted)}
.fchip.on{color:var(--text);border-color:var(--mal);background:color-mix(in srgb,var(--mal) 15%,transparent)}
select.input{width:auto;padding:5px 8px;font-size:12px}
.eps{font-family:var(--mono);font-size:12px;color:var(--mal3)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:9px 10px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--panel2)}
.risk{height:6px;border-radius:6px;background:var(--line);width:90px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.risk i{display:block;height:100%;border-radius:6px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--panel);border-left:1px solid var(--line2);z-index:1500;transform:translateX(105%);transition:.3s;box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.db{flex:1;overflow:auto;padding:16px;display:grid;gap:14px;align-content:start}
.df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:13px}.kv span{color:var(--muted)}
.tl{border-left:2px solid var(--line2);margin-left:6px;padding-left:14px;display:grid;gap:10px;font-size:13px}
.tl div{position:relative}.tl div::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--mal);border:2px solid var(--panel)}
.tl small{color:var(--muted);font-family:var(--mono);font-size:11px;display:block}
pre.raw{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;overflow:auto;margin:0;max-height:200px}
.mitre{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2)}
.mitre .id{font-family:var(--mono);font-weight:800;color:var(--gold2);font-size:15px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1400;display:none}.scrim.on{display:block}
.pbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
.pb{cursor:pointer;transition:.15s}.pb:hover,.pb.sel{border-color:var(--mal)}.pb.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--mal) 20%,transparent)}
.pb .ic{font-size:26px}
.stp{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
.stp .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--panel2);border:1px solid var(--line2);flex:none}
.stp.run .n{background:var(--gold);color:#1a1306;border-color:var(--gold);animation:flash .8s infinite}
.stp.ok .n{background:var(--mal);color:#fff;border-color:var(--mal)}
.stp em{margin-left:auto;font-style:normal;font-size:11px;color:var(--muted);font-family:var(--mono)}
.prog{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:10px 12px}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mal),var(--gold));transition:width .4s}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.req{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.req .who{flex:1;min-width:180px;font-size:13px}.req .who small{display:block;color:var(--muted);font-size:11px}
.sess{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}.sess:hover{background:var(--panel2)}.sess.sel{background:color-mix(in srgb,var(--mal) 10%,transparent)}
.tline{position:relative;height:34px;margin:10px 12px;border-radius:8px;background:var(--bg2);border:1px solid var(--line)}
.tline i{position:absolute;top:6px;width:4px;height:20px;border-radius:2px;cursor:pointer}
.tline .head{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.term{background:#050a08;color:#9fe8c9;font-family:var(--mono);font-size:12px;height:220px;overflow:auto;padding:10px 12px;border-radius:0 0 14px 14px}
.term .bad{color:#ff7b7b}
.toast{position:fixed;right:16px;top:60px;z-index:2000;background:var(--panel);border:1px solid var(--mal);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);font-size:13px;transform:translateX(130%);transition:.3s;max-width:340px}
.toast.on{transform:none}.toast.bad{border-color:var(--red)}
@media (max-width:1050px){.ov{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px}.page{padding:0 10px 16px}#map{height:240px}.pbs,.g2{grid-template-columns:1fr}.hm{display:none}.kv{grid-template-columns:100px 1fr}.sim{margin-left:0}.top{padding:10px}}
</style>
</head>
<body data-demo-en="Sentinel Grid — national SOC / SIEM" data-demo-ru="Sentinel Grid — национальный SOC и SIEM">
<div class="top">
  <div class="logo2"><div class="shield"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/><path d="m9 12 2 2 4-4"/></svg></div><div>SENTINEL GRID<div class="muted" style="font-size:11px;font-weight:500;letter-spacing:0" data-en="National Cyber Defence Centre · Nordania" data-ru="Национальный центр киберзащиты · Нордания"></div></div></div>
  <span class="defcon lvl1" id="defcon"></span>
  <span class="eps hm" id="clock"></span>
  <div class="sim row" style="display:flex;gap:8px">
    <button class="btn" id="resetBtn" data-en="Reset" data-ru="Сброс"></button>
    <button class="btn danger" id="simBtn" data-en="⚡ Simulate attack" data-ru="⚡ Симулировать атаку"></button>
  </div>
</div>
<div class="kpis" id="kpis"></div>
<div class="tabs" id="tabs">
  <button class="tab on" data-p="ov" data-en="Overview" data-ru="Обзор"></button>

<div class="page on" id="p-ov">
  <div class="ov">
    <div class="panel">
      <div class="ph"><span class="live"></span><span data-en="Live threat map" data-ru="Карта угроз в реальном времени"></span><span class="sp"></span><span class="mono muted" style="font-size:11px" id="mapInfo"></span></div>
      <canvas id="map"></canvas>
      <div class="legend"><span><i class="dot bg-crit"></i><span data-en="Critical" data-ru="Критично"></span></span><span><i class="dot bg-high"></i><span data-en="High" data-ru="Высокий"></span></span><span><i class="dot bg-med"></i><span data-en="Medium" data-ru="Средний"></span></span><span><i class="dot" style="background:var(--mal3)"></i><span data-en="Protected node" data-ru="Защищённый узел"></span></span><span><i class="dot" style="background:var(--dim)"></i><span data-en="Isolated" data-ru="Изолирован"></span></span></div>
    </div>
    <div class="panel">
      <div class="ph"><span data-en="Alert queue" data-ru="Очередь алертов"></span><span class="sp"></span><span class="pill bad" id="openPill"></span></div>
      <div class="aq" id="aq"></div>
    </div>
  </div>
  <div class="panel" style="margin-top:12px">
    <div class="ph"><span class="live"></span><span data-en="Event stream" data-ru="Поток событий"></span><span class="eps" id="eps"></span><span class="sp"></span>
      <span id="sevF"></span>
      <select class="input" id="srcF"></select>
      <button class="btn" id="pauseBtn" style="padding:5px 12px;font-size:12px"></button>
    </div>
    <div class="stream" id="stream"></div>

</div>

<div class="page" id="p-al">
  <div class="panel">
    <div class="ph"><span data-en="All alerts" data-ru="Все алерты"></span><span class="sp"></span><span id="stF"></span></div>
    <div class="tw"><table><thead><tr><th data-en="Severity" data-ru="Уровень"></th><th>ID</th><th data-en="Alert" data-ru="Алерт"></th><th class="hm">MITRE</th><th class="hm" data-en="Asset" data-ru="Актив"></th><th data-en="Status" data-ru="Статус"></th></tr></thead><tbody id="alT"></tbody></table></div>
  </div>
</div>

<div class="page" id="p-pb">
  <div class="pbs" id="pbs"></div>
  <div class="g2">
    <div class="panel"><div class="ph"><span id="pbTitle"></span><span class="sp"></span><button class="btn pri" id="pbRun" style="padding:6px 14px;font-size:13px" data-en="▶ Run playbook" data-ru="▶ Запустить"></button></div><div class="prog"><i id="pbProg"></i></div><div id="pbSteps"></div></div>
    <div class="panel"><div class="ph" data-en="Execution log" data-ru="Журнал выполнения"></div><div class="term" id="pbLog" style="height:360px;border-radius:0"></div></div>
  </div>
</div>

<div class="page" id="p-as">
  <div class="panel">
    <div class="ph"><span data-en="Critical infrastructure inventory" data-ru="Реестр объектов КИИ"></span><span class="sp"></span><input class="input" id="asQ" style="width:200px;padding:6px 10px;font-size:13px" data-en-ph="Filter…" data-ru-ph="Фильтр…"></div>
    <div class="tw"><table><thead><tr><th data-en="Object" data-ru="Объект"></th><th class="hm" data-en="Sector" data-ru="Отрасль"></th><th data-en="Risk" data-ru="Риск"></th><th class="hm" data-en="Patch level" data-ru="Патчи"></th><th data-en="Status" data-ru="Статус"></th><th></th></tr></thead><tbody id="asT"></tbody></table></div>
  </div>
</div>

<div class="page" id="p-zt">
  <div class="g2">
    <div class="panel"><div class="ph"><span data-en="Access requests (just-in-time)" data-ru="Запросы доступа (just-in-time)"></span><span class="sp"></span><span class="pill" id="ztPol"></span></div><div id="reqs"></div></div>
    <div class="panel"><div class="ph" data-en="Privileged sessions (recorded)" data-ru="Привилегированные сессии (запись)"></div><div id="sess"></div>
      <div class="tline" id="tline"></div>
      <div class="ph" style="border-top:1px solid var(--line)"><button class="btn" id="playS" style="padding:5px 12px;font-size:12px" data-en="▶ Replay" data-ru="▶ Воспроизвести"></button><span class="sp"></span><button class="btn danger" id="killS" style="padding:5px 12px;font-size:12px" data-en="Terminate session" data-ru="Завершить сессию"></button></div>

<script>
(function(){
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const T=(e,r)=>PT.t(e,r), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)], ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function toast(m,bad){const t=$('#toast');t.innerHTML=m;t.className='toast on'+(bad?' bad':'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),3200)}
const SEV={crit:['CRIT','Critical','Критично'],high:['HIGH','High','Высокий'],med:['MED','Medium','Средний'],low:['LOW','Low','Низкий'],info:['INFO','Info','Инфо']};
const SEVC={crit:'--red',high:'#ff8a4c',med:'--amber',low:'--mal3',info:'--dim'};
const col=k=>{const c=SEVC[k];return c.startsWith('--')?css(c):c};
const now=()=>new Date().toTimeString().slice(0,8);

/* ---------- assets ---------- */
const ASSETS0=[
['pwr-01','North Grid Control Centre','Центр управления сетью «Север»','Energy','Энергетика',.535,.155,92],
['pwr-02','Hydro Plant Kaldvik','ГЭС Кальдвик','Energy','Энергетика',.525,.19,88],
['wtr-01','Water Utility SCADA','SCADA водоканала','Water','Водоснабжение',.548,.175,95],
['tel-01','National Backbone IX','Магистральная точка обмена','Telecom','Связь',.552,.205,81],
['bnk-01','Central Bank Payments','Платёжная система ЦБ','Finance','Финансы',.518,.172,97],
['gov-01','e-Gov Portal Cluster','Кластер портала госуслуг','Government','Госуправление',.56,.16,74],
['gov-02','Tax Service Database','БД налоговой службы','Government','Госуправление',.542,.145,70],
['hsp-01','Capital Hospital EHR','МИС столичной больницы','Health','Здравоохранение',.53,.21,83],
['rail-01','Rail Signalling Network','Сигнализация ЖД','Transport','Транспорт',.565,.188,79],
['air-01','Airport ATC Systems','Системы УВД аэропорта','Transport','Транспорт',.512,.2,90],
['ad-01','Gov Active Directory','Active Directory правительства','Identity','Идентификация',.546,.192,86],
['dns-01','National DNS Resolvers','Национальные DNS-резолверы','Telecom','Связь',.522,.158,77]];
let st=S.get('sg-state',null);
function freshState(){return{assets:ASSETS0.map(a=>({id:a[0],risk:ri(18,52),patch:ri(82,99),status:'ok'})),alerts:[],seq:1040,zt:null,closed:0,mttd:[],mttr:[]}}
if(!st||!st.assets||st.assets.length!==ASSETS0.length)st=freshState();
const A=id=>ASSETS0.findIndex(a=>a[0]===id);
const aName=(id)=>{const a=ASSETS0[A(id)];return a?a[PT.lang==='ru'?2:1]:id};
function save(){S.set('sg-state',{...st,alerts:st.alerts.slice(0,60)})}

/* ---------- alerts ---------- */
const TPL=[
['T1110','Brute Force','Credential Access','Password spraying against VPN gateway','Подбор паролей к VPN-шлюзу','high','ad-01'],
['T1190','Exploit Public-Facing Application','Initial Access','SQL injection attempt on e-Gov portal','Попытка SQL-инъекции на портал госуслуг','high','gov-01'],
['T1498','Network Denial of Service','Impact','Volumetric UDP flood on DNS resolvers','Объёмный UDP-флуд на DNS-резолверы','med','dns-01'],
['T1059.001','PowerShell','Execution','Encoded PowerShell on hospital workstation','Закодированный PowerShell на станции больницы','high','hsp-01'],
['T1071.004','DNS Application Layer Protocol','Command and Control','DNS tunnelling beacon detected','Обнаружен DNS-туннель (маяк)','med','tel-01'],
['T1046','Network Service Discovery','Discovery','Port scan from external host on rail OT','Сканирование портов ЖД-сети извне','low','rail-01'],
['T1078','Valid Accounts','Defense Evasion','Login from impossible travel location','Вход из невозможной геолокации','med','ad-01'],
['T0855','Unauthorized Command Message','Impair Process Control (ICS)','Unexpected Modbus write to pump controller','Неожиданная запись Modbus в контроллер насоса','crit','wtr-01']];
const SRCIP=['203.0.113.','198.51.100.','192.0.2.'];
function mkAlert(t,o){o=o||{};const id='SG-'+(++st.seq);const ip=o.ip||rnd(SRCIP)+ri(2,250);const ts=Date.now();
  const al={id,tech:t[0],tname:t[1],tactic:t[2],title:[t[3],t[4]],sev:t[5],asset:t[6],ip,ts,status:'new',owner:'',chain:o.chain||0,

    return `<tr><td><b>${esc(a[1+li])}</b><div class="mono muted" style="font-size:11px">${a[0]} · ${T('criticality','критичность')} ${a[7]}</div></td><td class="hm">${a[3+li]}</td><td><span class="risk"><i style="width:${s.risk}%;background:${rc}"></i></span><span class="mono">${s.risk}</span></td><td class="hm"><span class="pill ${s.patch>94?'ok':s.patch>87?'warn':'bad'}">${s.patch}%</span></td><td>${s.status==='isolated'?`<span class="pill">⛔ ${T('Isolated','Изолирован')}</span>`:`<span class="pill ok">● ${T('Online','В сети')}</span>`}</td><td style="white-space:nowrap">${s.status==='isolated'?`<button class="btn" style="padding:4px 10px;font-size:12px" data-ra="${a[0]}">${T('Restore','Вернуть')}</button>`:`<button class="btn" style="padding:4px 10px;font-size:12px" data-pa="${a[0]}">${T('Patch','Обновить')}</button> <button class="btn" style="padding:4px 10px;font-size:12px" data-ia="${a[0]}">⛔</button>`}</td></tr>`}).join('');
  $$('[data-ra]').forEach(b=>b.onclick=()=>{st.assets[A(b.dataset.ra)].status='ok';save();renderAssets();renderKPIs();toast(T('Host restored to network','Хост возвращён в сеть'))});
  $$('[data-ia]').forEach(b=>b.onclick=()=>isolate(b.dataset.ia));
  $$('[data-pa]').forEach(b=>b.onclick=()=>{const s=st.assets[A(b.dataset.pa)];b.disabled=true;b.textContent='…';setTimeout(()=>{s.patch=Math.min(100,s.patch+ri(4,12));s.risk=Math.max(8,s.risk-ri(5,12));save();renderAssets();renderKPIs();toast(T('Patches deployed','Обновления установлены'))},900)})}
$('#asQ').addEventListener('input',renderAssets);

/* ---------- playbooks ---------- */
const PB={ransomware:{ic:'🔒',n:['Ransomware containment','Сдерживание шифровальщика'],asset:'wtr-01',steps:[['Snapshot memory of affected host','Снимок памяти заражённого хоста'],['Isolate host via EDR','Изоляция хоста через EDR'],['Disable compromised account in AD','Блокировка скомпрометированной учётки в AD'],['Block C2 indicators on firewall & DNS','Блокировка индикаторов C2 на МЭ и DNS'],['Verify immutable backups','Проверка неизменяемых резервных копий'],['Notify CERT-NR and regulator','Уведомление CERT-NR и регулятора']]},
phishing:{ic:'🎣',n:['Phishing response','Реагирование на фишинг'],asset:'gov-01',steps:[['Extract URLs & attachments','Извлечение ссылок и вложений'],['Detonate in sandbox','Запуск в песочнице'],['Search & purge similar emails (412 mailboxes)','Поиск и удаление похожих писем (412 ящиков)'],['Reset credentials of clicked users','Сброс паролей кликнувших'],['Add sender domain to blocklist','Домен отправителя в блок-лист']]},
ddos:{ic:'🌊',n:['DDoS mitigation','Отражение DDoS'],asset:'dns-01',steps:[['Confirm volumetric anomaly (>40 Gbps)','Подтверждение аномалии (>40 Гбит/с)'],['Divert traffic to scrubbing centre','Перенаправление в центр очистки'],['Enable anycast & rate limits','Включение anycast и ограничений'],['Geo-filter top attacking ASNs','Гео-фильтр атакующих ASN'],['Return traffic to normal path','Возврат трафика в обычный маршрут']]}};
let pbSel='ransomware',pbRunning=false;
function renderPB(){const li=PT.lang==='ru'?1:0;$('#pbs').innerHTML=Object.entries(PB).map(([k,p])=>`<div class="card pb ${pbSel===k?'sel':''}" data-pb="${k}"><div class="ic">${p.ic}</div><b>${p.n[li]}</b><div class="muted" style="font-size:12px">${p.steps.length} ${T('automated steps','автошагов')} · SOAR</div></div>`).join('');
  $$('[data-pb]').forEach(e=>e.onclick=()=>{if(pbRunning)return;pbSel=e.dataset.pb;renderPB()});
  const p=PB[pbSel];$('#pbTitle').textContent=p.ic+' '+p.n[li];
  if(!pbRunning){$('#pbSteps').innerHTML=p.steps.map((s,i)=>`<div class="stp" id="ps${i}"><span class="n">${i+1}</span>${s[li]}<em></em></div>`).join('');$('#pbProg').style.width='0'}}
function plog(t,bad){const el=$('#pbLog');el.insertAdjacentHTML('beforeend',`<div class="${bad?'bad':''}">[${now()}] ${esc(t)}</div>`);el.scrollTop=el.scrollHeight}
async function runPB(k){if(pbRunning)return;pbSel=k||pbSel;pbRunning=false;renderPB();pbRunning=true;const p=PB[pbSel];const li=PT.lang==='ru'?1:0;$('#pbRun').disabled=true;
  plog('$ soar run '+pbSel+' --target '+p.asset+' --operator analyst');
  for(let i=0;i<p.steps.length;i++){const e=$('#ps'+i);e.classList.add('run');plog('→ '+p.steps[i][li]+' …');await new Promise(r=>setTimeout(r,700+Math.random()*700));
    if(pbSel==='ransomware'&&i===1)isolate(p.asset,true);
    e.classList.remove('run');e.classList.add('ok');const ms=ri(180,2400);e.querySelector('em').textContent=ms+' ms';plog('  ✓ OK ('+ms+' ms)');$('#pbProg').style.width=((i+1)/p.steps.length*100)+'%'}
  plog(T('Playbook completed. Incident contained.','Плейбук выполнен. Инцидент локализован.'));
  st.alerts.filter(a=>!['closed','fp'].includes(a.status)&&(a.asset===p.asset||(pbSel==='ransomware'&&a.chain))).forEach(a=>{a.status='closed';log(a,'Closed by playbook '+pbSel,'Закрыт плейбуком '+pbSel);st.mttr.push(ri(9,18))});
  const as=st.assets[A(p.asset)];as.risk=Math.max(12,as.risk-30);save();renderAlerts();renderKPIs();renderAssets();
  pbRunning=false;$('#pbRun').disabled=false;toast('✅ '+p.n[li]+T(' — done',' — выполнено'))}
$('#pbRun').onclick=()=>runPB();

/* ---------- Zero Trust ---------- */
const REQ0=[{id:'r1',u:'a.solberg',role:['DBA','Администратор БД'],res:'gov-02',why:['Monthly index rebuild','Ежемесячная перестройка индексов'],risk:12,dur:'2h'},{id:'r2',u:'contractor.vel',role:['Vendor engineer','Инженер подрядчика'],res:'pwr-02',why:['Firmware update on turbine PLC','Обновление прошивки ПЛК турбины'],risk:46,dur:'4h'},{id:'r3',u:'e.nygaard',role:['Network admin','Сетевой админ'],res:'tel-01',why:['BGP filter change ticket CHG-2291','Изменение BGP-фильтра, заявка CHG-2291'],risk:22,dur:'1h'}];
const SESS0=[{id:'s1',u:'admin.ops',res:'ad-01',cmds:['whoami /groups','Get-ADUser -Filter * | measure','Set-ADAccountPassword svc_print','net group "Domain Admins"','exit'],bad:[]},{id:'s2',u:'d.strand',res:'bnk-01',cmds:['ssh pay-gw-03','systemctl status settlement','tail -n 50 /var/log/settle.log','sudo cat /etc/shadow','exit'],bad:[3]}];
if(!st.zt)st.zt={reqs:REQ0.map(r=>({...r,st:'pending'})),sess:SESS0.map(s=>({...s,live:true}))};
let selS=st.zt.sess[0].id,playIdx=-1,playT=null;
function renderZT(){const li=PT.lang==='ru'?1:0;const pend=st.zt.reqs.filter(r=>r.st==='pending').length;$('#ztCnt').style.display=pend?'':'none';$('#ztCnt').textContent=pend;
  $('#ztPol').textContent=T('Policy: deny by default','Политика: запрет по умолчанию');
  $('#reqs').innerHTML=st.zt.reqs.map(r=>`<div class="req"><div class="who"><b class="mono">${r.u}</b> · ${r.role[li]}<small>→ ${esc(aName(r.res))} · ${r.dur} · ${esc(r.why[li])}</small><small>${T('Device posture','Состояние устройства')}: ${r.risk>60?'❌ '+T('unmanaged, new location','неуправляемое, новая геолокация'):r.risk>40?'⚠️ '+T('managed, patch overdue','управляемое, патчи просрочены'):'✅ '+T('compliant, MFA','соответствует, MFA')} · ${T('risk','риск')} <b style="color:${r.risk>60?col('crit'):r.risk>40?css('--amber'):css('--mal3')}">${r.risk}</b></small></div>${r.st==='pending'?`<button class="btn pri" style="padding:5px 12px;font-size:12px" data-ok="${r.id}">${T('Approve','Одобрить')}</button><button class="btn" style="padding:5px 12px;font-size:12px" data-no="${r.id}">${T('Deny','Отклонить')}</button>`:`<span class="pill ${r.st==='approved'?'ok':'bad'}">${r.st==='approved'?T('Approved · expires in ','Одобрено · истекает через ')+r.dur:T('Denied','Отклонено')}</span>`}</div>`).join('');
  $$('[data-ok]').forEach(b=>b.onclick=()=>decide(b.dataset.ok,'approved'));$$('[data-no]').forEach(b=>b.onclick=()=>decide(b.dataset.no,'denied'));
  $('#sess').innerHTML=st.zt.sess.map(s=>`<div class="sess ${selS===s.id?'sel':''}" data-ss="${s.id}"><b class="mono">${s.u}</b> → ${esc(aName(s.res))} <span class="pill ${s.live?(s.bad.length?'bad':'ok'):''}" style="margin-left:6px">${s.live?(s.bad.length?T('● live · flagged','● идёт · подозрит.'):T('● live','● идёт')):T('terminated','завершена')}</span><div class="muted mono" style="font-size:11px">${s.cmds.length} ${T('commands recorded','команд записано')}</div></div>`).join('');
  $$('[data-ss]').forEach(e=>e.onclick=()=>{selS=e.dataset.ss;playIdx=-1;renderZT()});
  const s=st.zt.sess.find(x=>x.id===selS)||st.zt.sess[0];
  $('#tline').innerHTML=s.cmds.map((c,i)=>`<i style="left:${4+i/(s.cmds.length-1||1)*92}%;background:${s.bad.includes(i)?col('crit'):css('--mal')}" title="${esc(c)}" data-ci="${i}"></i>`).join('')+(playIdx>=0?`<div class="head" style="left:${4+playIdx/(s.cmds.length-1||1)*92}%"></div>`:'');
  $$('#tline i').forEach(e=>e.onclick=()=>{playIdx=+e.dataset.ci;renderZT()});
  const upto=playIdx<0?s.cmds.length-1:playIdx;$('#term').innerHTML=`<div style="color:var(--dim)"># ${T('recorded session','запись сессии')} ${s.id} · ${s.u}@${s.res}</div>`+s.cmds.slice(0,upto+1).map((c,i)=>`<div class="${s.bad.includes(i)?'bad':''}">${s.u}$ ${esc(c)}${s.bad.includes(i)?'  ⚠ '+T('policy violation','нарушение политики'):''}</div>`).join('')+(s.live?'':`<div class="bad">— ${T('session terminated by SOC','сессия завершена SOC')} —</div>`);
  $('#killS').disabled=!s.live;$('#killS').style.opacity=s.live?1:.5}
function decide(id,v){const r=st.zt.reqs.find(x=>x.id===id);r.st=v;save();renderZT();toast(v==='approved'?T('Access granted just-in-time','Доступ выдан на ограниченное время'):T('Access denied, user notified','В доступе отказано, пользователь уведомлён'));
  if(r.mal&&v==='denied'){toast(T('Good call: request came from compromised account','Верно: запрос был от скомпрометированной учётки'))}
  if(r.mal&&v==='approved'){mkAlert(['T1078.002','Domain Accounts','Privilege Escalation','Privileged access granted to compromised account','Привилегированный доступ выдан скомпрометированной учётке','crit','ad-01'],{chain:1,user:r.u})}}
$('#playS').onclick=()=>{const s=st.zt.sess.find(x=>x.id===selS);clearInterval(playT);playIdx=0;renderZT();playT=setInterval(()=>{playIdx++;if(playIdx>=s.cmds.length){clearInterval(playT);playIdx=s.cmds.length-1}renderZT()},700)};
$('#killS').onclick=()=>{const s=st.zt.sess.find(x=>x.id===selS);if(!s.live)return;s.live=false;save();renderZT();toast(T('Session terminated, credentials rotated','Сессия завершена, пароль сменён'))};

/* ---------- attack simulation ---------- */
let attackOn=false;
async function simulate(){if(attackOn)return;attackOn=true;$('#simBtn').disabled=true;$('#simBtn').style.opacity=.6;const sl=ms=>new Promise(r=>setTimeout(r,ms));const ip='198.51.100.66';const user='k.berg';
  toast('⚡ '+T('Attack simulation started: APT "Grey Fjord"','Запущена симуляция атаки: APT «Серый фьорд»'),true);go('ov');
  pushEvent(mkEvent({src:'WAF',sev:'med',msg:'mail-gw: inbound from hr-portal-update.example attachment=Salary_2026.xlsm'}));
  burst('gov-01','med',ip,3);await sl(1600);
  mkAlert(['T1566.001','Spearphishing Attachment','Initial Access','Macro-enabled phishing attachment opened','Открыто фишинговое вложение с макросом','high','gov-01'],{ip,user,chain:1,mttd:1});
  pushEvent(mkEvent({src:'EDR',sev:'high',msg:'proc=excel.exe -> cmd.exe -> powershell.exe -enc host=WS-412 user='+user}));await sl(2400);
  mkAlert(['T1003.001','LSASS Memory','Credential Access','Credential dumping from LSASS on WS-412','Дамп учётных данных из LSASS на WS-412','high','ad-01'],{ip,user,chain:1,mttd:1});
  for(let i=0;i<5;i++)pushEvent(mkEvent({src:'AD',sev:'high',msg:'4624 logon type=3 user='+user+' host=SRV-'+ri(10,40)+' (lateral)'}));
  st.zt.reqs.unshift({id:'r'+Date.now(),u:user,role:['HR specialist','Специалист HR'],res:'wtr-01',why:['Urgent: need SCADA access for audit','Срочно: нужен доступ к SCADA для аудита'],risk:88,dur:'8h',st:'pending',mal:1});
  st.zt.sess.unshift({id:'s'+Date.now(),u:user,res:'ad-01',cmds:['whoami /priv','nltest /domain_trusts','net user svc_scada /domain','psexec \\\\SCADA-HMI-1 cmd','vssadmin delete shadows /all /quiet'],bad:[2,3,4],live:true});selS=st.zt.sess[0].id;save();renderZT();
  toast('🔐 '+T('Suspicious JIT access request in Zero Trust','Подозрительный запрос доступа в Zero Trust'),true);await sl(2600);
  mkAlert(['T1021.002','SMB/Windows Admin Shares','Lateral Movement','Lateral movement to SCADA HMI via admin shares','Горизонтальное перемещение к SCADA через админ-шары','crit','wtr-01'],{ip,user,chain:1,mttd:2});
  burst('wtr-01','crit',ip,6);await sl(2600);
  mkAlert(['T1486','Data Encrypted for Impact','Impact','Mass file encryption started on SCADA historian','Массовое шифрование файлов на историане SCADA','crit','wtr-01'],{ip,user,chain:1,mttd:1});
  for(let i=0;i<6;i++)pushEvent(mkEvent({src:'EDR',sev:'crit',msg:'ransom behaviour: rename *.dat -> *.fjord host=SCADA-HIST-1 rate='+ri(300,900)+'/s'}));
  burst('wtr-01','crit',ip,8);
  $('#toast').innerHTML=`<b>${T('Ransomware on Water Utility SCADA','Шифровальщик на SCADA водоканала')}</b><div style="margin:6px 0">${T('Recommended: run the Ransomware containment playbook.','Рекомендация: запустить плейбук «Сдерживание шифровальщика».')}</div><button class="btn danger" id="goPB" style="padding:5px 12px;font-size:12px">${T('Run playbook now','Запустить плейбук')}</button>`;$('#toast').className='toast on bad';clearTimeout(toast.h);toast.h=setTimeout(()=>$('#toast').classList.remove('on'),12000);
  $('#goPB').onclick=()=>{$('#toast').classList.remove('on');go('pb');runPB('ransomware')};
  await sl(8000);attackOn=false;$('#simBtn').disabled=false;$('#simBtn').style.opacity=1}
$('#simBtn').onclick=simulate;
$('#resetBtn').onclick=()=>{st=freshState();st.zt=null;st.zt={reqs:REQ0.map(r=>({...r,st:'pending'})),sess:SESS0.map(s=>({...s,live:true}))};selS='s1';save();seed();renderAll();toast(T('Console reset','Консоль сброшена'))};

/* ---------- nav & init ---------- */
function go(p){$$('.tab').forEach(t=>t.classList.toggle('on',t.dataset.p===p));$$('.page').forEach(x=>x.classList.toggle('on',x.id==='p-'+p));S.set('sg-tab',p);if(p==='ov')setTimeout(()=>{sizeMap()},0)}
$$('.tab').forEach(t=>t.onclick=()=>go(t.dataset.p));
function seed(){if(st.alerts.length)return;[0,1,2,5].forEach((k,i)=>{const a=mkAlert(TPL[k]);a.ts-=(i+1)*240000});st.alerts[3].status='assigned';st.alerts[3].owner='o.dahl';save()}
function renderAll(){readColors();renderKPIs();renderAlerts();renderAssets();renderPB();renderZT();renderStreamCtl();if(curAl)openAlert(curAl)}
PT.onLang(()=>{renderAll();sizeMap()});
document.addEventListener('DOMContentLoaded',()=>{seed();go(S.get('sg-tab','ov'));sizeMap();renderAll();for(let i=0;i<40;i++)pushEvent(mkEvent());requestAnimationFrame(loop)});
window.addEventListener('resize',sizeMap);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
setInterval(()=>{if(!document.hidden&&!curAl)renderAlerts()},15000);
})();
</script>
