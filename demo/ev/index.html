<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoltNet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.hide{display:none!important}
/* login */
.login{min-height:calc(100vh - 45px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0}
.hero{padding:56px 48px;background:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--mal) 22%,transparent),transparent 55%),radial-gradient(circle at 90% 90%,color-mix(in srgb,var(--gold) 16%,transparent),transparent 50%),var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;min-width:0}
.hero h2{font-size:34px;line-height:1.15;margin:0;letter-spacing:-.02em}
.hero h2 em{font-style:normal;color:var(--mal3)}
.hero p{margin:0;color:var(--muted);max-width:520px}
.hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:560px}
.hstats div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.hstats b{display:block;font-size:22px;letter-spacing:-.02em} .hstats span{font-size:12px;color:var(--muted)}
.hfeat{list-style:none;padding:0;margin:0;display:grid;gap:10px;max-width:560px}
.hfeat li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.hfeat li i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--mal) 18%,transparent);color:var(--mal3);flex:none;font-size:13px}
.lform{display:grid;place-items:center;padding:40px 24px}
.lcard{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:28px;box-shadow:var(--shadow)}
.lcard h3{margin:0 0 4px;font-size:21px}
.lcard .f{margin-top:14px}
.err{color:var(--red);font-size:12.5px;min-height:18px;margin-top:6px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
/* app shell */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:calc(100vh - 45px)}
.side{position:sticky;top:45px;height:calc(100vh - 45px);border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:17px}
.brand b{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mal3),var(--mal2));color:#fff;font-size:17px;flex:none}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent;background:none;width:100%;text-align:left;min-height:42px}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);border-color:var(--line2)}
.nav .ic{width:20px;text-align:center;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-weight:700}
.nav .cnt.g{background:var(--mal)}
.grow{flex:1}
.who{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);font-size:13px;display:flex;gap:10px;align-items:center}
.who .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold2);font-weight:800;flex:none}
.who div{min-width:0} .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .who span{font-size:11.5px;color:var(--muted)}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.sbtns .btn{justify-content:center}
main{padding:20px 26px 60px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px;margin:0;letter-spacing:-.01em}
.head .sp{flex:1}
.crumb{font-size:12px;color:var(--dim)}
.menu-btn{display:none}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mal3);box-shadow:0 0 0 0 var(--mal3);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.grid2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.stack{display:grid;gap:14px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--red) 55%,transparent);color:var(--red)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600;min-height:34px}
.chip.on{background:color-mix(in srgb,var(--mal) 18%,transparent);border-color:var(--mal);color:var(--mal3)}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.fgrid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.input.bad{border-color:var(--red)}
select.input{appearance:auto}
.opt{border:1px solid var(--line2);border-radius:14px;padding:12px;cursor:pointer;background:var(--bg2);text-align:left;width:100%}
.opt.on{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 10%,transparent)}
.opt b{display:block} .opt span{font-size:12.5px;color:var(--muted)}
.opts3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
/* map */
.map{position:relative}
.map svg{width:100%;height:auto;display:block}
.map .st{cursor:pointer}
.map .st:hover circle.c{stroke-width:3}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.slist{display:grid;gap:8px;max-height:420px;overflow:auto;padding-right:2px}
.sitem{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg2);text-align:left;width:100%}
.sitem.on{border-color:var(--mal)}
.sitem .m{flex:1;min-width:0} .sitem b{display:block;font-size:13.5px;overflow-wrap:anywhere} .sitem span{font-size:12px;color:var(--muted)}
.av{font-family:var(--mono);font-weight:700;font-size:13px;border-radius:8px;padding:3px 8px;flex:none}
.av.ok{background:color-mix(in srgb,var(--mal) 16%,transparent);color:var(--mal3)}
.av.warn{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.av.bad{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.ports{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:10px 0}
.port{border:1px solid var(--line2);border-radius:12px;padding:9px 10px;background:var(--bg2);font-size:12.5px}
.port b{display:block;font-size:13px}
.port.avail{border-color:color-mix(in srgb,var(--mal) 60%,transparent)}
.port.busy{border-color:color-mix(in srgb,var(--amber) 60%,transparent)}
.port.fault,.port.off{border-color:color-mix(in srgb,var(--red) 60%,transparent)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
/* charge */
.meter{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:center}
.ring svg{width:100%;max-width:200px;height:auto;display:block;margin:auto}
.mstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mstats div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mstats span{display:block;font-size:11.5px;color:var(--muted)} .mstats b{font-size:20px;font-family:var(--mono)}
canvas{display:block;width:100%}
.est{background:var(--bg2);border:1px dashed var(--line2);border-radius:12px;padding:12px;font-size:13px;display:grid;gap:4px}
.est div{display:flex;justify-content:space-between;gap:10px}
.est b{font-family:var(--mono)}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--mal2),var(--mal3));transition:width .4s}
input[type=range]{width:100%;accent-color:var(--mal)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td,tbody tr.sel td{background:color-mix(in srgb,var(--mal) 7%,transparent)}
.ub{display:inline-block;width:70px;height:6px;border-radius:6px;background:var(--line);vertical-align:middle;margin-right:8px;overflow:hidden}
.ub i{display:block;height:100%}
.log{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;height:240px;overflow:auto}
.log div{padding:2px 0;overflow-wrap:anywhere} .log .t{color:var(--dim)} .log .k{color:var(--gold2)}
.chart svg{width:100%;height:auto;display:block}
.inc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--bg2)}
.inc .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inc .top b{flex:1;min-width:150px;overflow-wrap:anywhere}
.inc .meta{font-size:12.5px;color:var(--muted);margin:6px 0 8px;overflow-wrap:anywhere}
.tl{display:flex;margin-top:8px}
.tl div{flex:1;position:relative;text-align:center;font-size:11px;color:var(--dim);min-width:0}
.tl div:before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line2)}
.tl div:first-child:before{display:none}
.tl i{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 4px;background:var(--panel2);border:2px solid var(--line2);position:relative;z-index:1}
.tl .ok i{background:var(--mal);border-color:var(--mal)} .tl .ok:before,.tl .cur:before{background:var(--mal)}
.tl .cur i{border-color:var(--gold);background:var(--gold)} .tl .ok,.tl .cur{color:var(--text)}
.tl span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.chk{list-style:none;padding:0;margin:0;font-size:13px}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.chk li span{flex:1;min-width:0}.chk li span:first-child{flex:none;width:14px}
.chk li em{font-style:normal;font-family:var(--mono);font-size:12px;flex:none}
.ok-t{color:var(--mal3)} .bad-t{color:var(--red)} .warn-t{color:var(--amber)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13.5px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:fade .2s}
.toast.bad{border-left-color:var(--red)} .toast.gold{border-left-color:var(--gold)}
.scrim{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid2e{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .login{grid-template-columns:minmax(0,1fr)}
  .hero{padding:28px 18px;border-right:0;border-bottom:1px solid var(--line)}
  .hero h2{font-size:26px}
  .lform{padding:22px 14px 40px}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:45px;z-index:1500;width:270px;max-width:86vw;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:45px 0 0 0;background:rgba(0,0,0,.35);z-index:1400}
  .menu-btn{display:inline-flex;min-height:38px}
  main{padding:14px 14px 50px}
  .head h1{font-size:20px}
  .meter{grid-template-columns:minmax(0,1fr)}
  .slist{max-height:none}
}
@media (max-width:560px){
  .fgrid,.roles,.opts3{grid-template-columns:minmax(0,1fr)}
  .hstats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.hstats b{font-size:17px}.hstats div{padding:10px}
  .kpi .v{font-size:20px}.kpis{gap:10px}
  .card{padding:14px}
  .lcard{padding:20px}
  .tl span{font-size:9.5px}
  .mstats b{font-size:17px}
}
</style>
</head>
<body data-demo-en="VoltNet — National EV charging network" data-demo-ru="VoltNet — Национальная сеть зарядки электромобилей">

<section class="login" id="login">
  <div class="hero">
    <div class="brand" style="padding:0"><b>⚡</b><div>VoltNet<small data-en="Federal Highway Administration · Republic of Avalor" data-ru="Федеральное управление дорог · Республика Авалор"></small></div></div>
    <h2 data-en="One national network. <em>Every charger, live.</em>" data-ru="Одна национальная сеть. <em>Каждая зарядка — онлайн.</em>"></h2>
    <p data-en="Federally funded fast-charging corridors across five states: drivers find a free connector, start and pay in seconds; operators and the agency track uptime and funding compliance in real time over OCPP 2.0.1 and OCPI 2.2." data-ru="Скоростные коридоры зарядки в пяти штатах на федеральные средства: водитель находит свободный разъём, запускает и оплачивает за секунды; операторы и агентство следят за доступностью и соблюдением условий финансирования в реальном времени через OCPP 2.0.1 и OCPI 2.2."></p>
    <div class="hstats">
      <div><b>24</b><span data-en="corridor sites" data-ru="площадки"></span></div>
      <div><b id="hPorts">–</b><span data-en="DC fast ports" data-ru="быстрых разъёмов"></span></div>
      <div><b>97%</b><span data-en="uptime target" data-ru="цель доступности"></span></div>
    </div>
    <ul class="hfeat">
      <li><i>◉</i><span data-en="Live charger map with per-connector availability" data-ru="Живая карта зарядок с доступностью каждого разъёма"></span></li>
      <li><i>▶</i><span data-en="Start a session, pay by card, wallet or RFID, get a receipt" data-ru="Запуск сессии, оплата картой, кошельком или RFID, чек"></span></li>
      <li><i>◷</i><span data-en="Station uptime monitor, OCPP message feed and incident dispatch" data-ru="Монитор доступности станций, поток сообщений OCPP и выезд техников"></span></li>
      <li><i>▤</i><span data-en="Quarterly funding-compliance reports for the program office" data-ru="Квартальные отчёты о соблюдении условий финансирования"></span></li>
    </ul>
  </div>
  <div class="lform">
    <div class="lcard">
      <h3 data-en="Sign in to VoltNet" data-ru="Вход в VoltNet"></h3>
      <div class="muted" style="font-size:13px" data-en="Demo credentials are prefilled." data-ru="Демо-данные уже заполнены."></div>
      <div class="f"><label data-en="Email" data-ru="Эл. почта"></label><input class="input" id="lEmail" value="demo@voltnet.example" autocomplete="off"></div>
      <div class="f"><label data-en="Password" data-ru="Пароль"></label><input class="input" id="lPass" type="password" value="charge-2025"></div>
      <div class="f"><label data-en="Sign in as" data-ru="Войти как"></label>
        <div class="roles">
          <button class="opt on" data-role="driver"><b data-en="Driver" data-ru="Водитель"></b><span data-en="Find, charge, pay" data-ru="Найти, зарядить, оплатить"></span></button>
          <button class="opt" data-role="operator"><b data-en="Operator / agency" data-ru="Оператор / агентство"></b><span data-en="Uptime, incidents, reports" data-ru="Доступность, инциденты, отчёты"></span></button>
        </div>
      </div>
      <div class="err" id="lErr"></div>
      <button class="btn pri" id="loginBtn" style="width:100%;justify-content:center;padding:12px" data-en="Sign in" data-ru="Войти"></button>
      <div class="muted" style="font-size:11.5px;margin-top:12px;text-align:center" data-en="Protected federal system. Fictional demo data." data-ru="Защищённая федеральная система. Вымышленные демо-данные."></div>
    </div>
  </div>
</section>

<div class="app hide" id="app">
  <aside class="side" id="side">
    <div class="brand"><b>⚡</b><div>VoltNet<small data-en="National EV network · Avalor" data-ru="Нац. сеть зарядки · Авалор"></small></div></div>
    <div class="sec" data-en="Drivers" data-ru="Водителям"></div>
    <button class="nav" data-view="map"><span class="ic">◉</span><span data-en="Charger map" data-ru="Карта зарядок"></span><span class="cnt g" id="cAvail"></span></button>
    <button class="nav" data-view="charge"><span class="ic">▶</span><span data-en="Charge &amp; pay" data-ru="Зарядка и оплата"></span><span class="cnt g hide" id="cLive">●</span></button>
    <button class="nav" data-view="history"><span class="ic">▦</span><span data-en="Receipts &amp; wallet" data-ru="Чеки и кошелёк"></span></button>
    <div class="sec" data-en="Operations" data-ru="Эксплуатация"></div>
    <button class="nav" data-view="uptime"><span class="ic">◷</span><span data-en="Uptime monitor" data-ru="Монитор доступности"></span></button>
    <button class="nav" data-view="incidents"><span class="ic">⚠</span><span data-en="Incidents" data-ru="Инциденты"></span><span class="cnt" id="cInc"></span></button>
    <div class="sec" data-en="Program office" data-ru="Программа"></div>
    <button class="nav" data-view="reports"><span class="ic">▤</span><span data-en="Funding compliance" data-ru="Условия финансирования"></span></button>
    <div class="grow"></div>
    <div class="who"><div class="av" id="whoAv">D</div><div><b id="whoName"></b><span id="whoRole"></span></div></div>
    <div class="sbtns">
      <button class="btn sm" id="reset" data-en="Reset demo" data-ru="Сбросить"></button>
      <button class="btn sm" id="logout" data-en="Log out" data-ru="Выйти"></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main>
    <div class="head">
      <button class="btn sm menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div style="min-width:0"><div class="crumb" id="crumb"></div><h1 id="title"></h1></div>
      <div class="sp"></div>
      <span class="pill ok"><span class="live-dot"></span><span data-en="Live · OCPP 2.0.1" data-ru="Онлайн · OCPP 2.0.1"></span></span>
    </div>
    <section class="view" id="v-map"></section>
    <section class="view" id="v-charge"></section>
    <section class="view" id="v-history"></section>
    <section class="view" id="v-uptime"></section>
    <section class="view" id="v-incidents"></section>
    <section class="view" id="v-reports"></section>
  </main>
</div>
<div class="toasts" id="toasts"></div>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=(en,ru)=>PT.t(en,ru);

function seed(){
  const r=rng(2025), now=Date.now();
  const stations=SITES.map((s,i)=>{
    const n=r()<.35?6:4, ports=[];
    for(let p=0;p<n;p++){
      let t='CCS',kw=r()<.4?350:150;
      if(p===n-1&&r()<.45){t='J3400';kw=250}
      if(p===n-1&&i%7===3){t='CHAdeMO';kw=50}
      const st=r()<.42?'busy':'avail';
      ports.push({t,kw,st,down:Math.round(40+r()*700)});
    }
    if([2,9,17].includes(i)) ports.forEach(p=>p.down=Math.round(1500+r()*1600));
    return {id:'VN-'+String(101+i*7).padStart(4,'0'),n:[s[0],s[1]],x:s[2],y:s[3],cor:s[4],st:stateOf(s[2],s[3]),op:OPS[i%4],
      price:+(0.42+r()*.14).toFixed(2),ports,hb:now-Math.round(r()*40000),ses:Math.round(380+r()*900),kwh:Math.round(14000+r()*30000),
      spacing:!(i===22),ocpi:i!==17,yr:2023+(i%3)};
  });
  stations[9].ports.forEach(p=>p.st='off'); stations[9].hb=now-26*60000;
  stations[2].ports[1].st='fault';
  const incidents=[
    {id:'INC-4180',sid:stations[9].id,port:-1,code:'CommunicationLost',txt:['Station offline — no heartbeat','Станция не на связи — нет heartbeat'],opened:now-26*60000,status:'dispatched',tech:TECHS[0]},
    {id:'INC-4181',sid:stations[2].id,port:1,code:'GroundFailure',opened:now-48*60000,status:'open'}];
  for(let k=0;k<5;k++){const s=stations[Math.floor(r()*24)];incidents.push({id:'INC-'+(4170+k),sid:s.id,port:Math.floor(r()*4),code:FCODES[k][0],opened:now-(k+1)*86400000-3600000*k,status:'resolved',tech:TECHS[k%5],closed:now-(k+1)*86400000+3600000*(1+k%3)})}
  const trend=[];for(let d=0;d<30;d++)trend.push(+(97.2+r()*2.3-(d===11||d===19?1.6:0)).toFixed(2));
  const receipts=[];
  for(let k=0;k<5;k++){const s=stations[[1,4,7,11,0][k]];const kwh=+(22+r()*38).toFixed(1);receipts.push({id:'RCP-'+(90412+k*13),sid:s.id,kwh,min:Math.round(kwh/1.9),cost:+(kwh*s.price).toFixed(2),pay:['card','wallet','rfid','card','wallet'][k],ts:now-(k*3+1)*86400000-r()*36e5,veh:1,tx:'TX'+Math.floor(1e7+r()*9e7)})}
  const reports=[{id:'RPT-2025-Q1',q:0,state:-1,created:now-200*864e5,status:'accepted',score:96},{id:'RPT-2025-Q2',q:1,state:-1,created:now-110*864e5,status:'accepted',score:94}];
  const funding=STATES.map((s,i)=>({ob:[118,96,84,132,107][i],dis:[71,52,49,88,58][i]}));
  const log=[];for(let k=0;k<14;k++){const s=stations[Math.floor(r()*24)];log.push({ts:now-k*4000-r()*3000,sid:s.id,m:['Heartbeat','StatusNotification','TransactionEvent','MeterValues'][k%4],d:k%4===1?'evse 1 → Available':k%4===2?'Updated':k%4===3?Math.round(40+r()*200)+' kW':''})}
  return {stations,incidents,trend,receipts,reports,funding,log,wallet:64.5,rfid:'VN-RFID-7731',veh:1,active:null,ui:{sel:stations[1].id,flt:'all',con:'any',q:2,rst:-1}};
}

const OUTLINE='60,120 180,70 360,60 520,80 700,60 860,90 940,160 930,260 900,330 940,420 880,520 760,540 640,500 520,560 380,540 260,520 140,470 80,380 50,260';
function polyLen(pts){let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);return L}
function polyAt(pts,f){let L=polyLen(pts)*f;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(L<=l){const k=l?L/l:0;return [a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]}L-=l}return pts[pts.length-1]}
const cars=[];{const r=rng(9);Object.keys(CORR).forEach(c=>{for(let k=0;k<3;k++)cars.push({c,f:r(),v:(.0018+r()*.002)*(r()<.5?1:-1)})})}
function passes(s){
  const f=S.ui.flt,c=S.ui.con;
  if(f==='avail'&&!availOf(s))return false;
  if(f==='150'&&!s.ports.some(p=>p.kw>=150&&p.st==='avail'))return false;
  if(f==='350'&&!s.ports.some(p=>p.kw>=350))return false;
  if(c!=='any'&&!s.ports.some(p=>p.t===c))return false;
  const q=(S.ui.q2||'').toLowerCase();if(q&&!(s.n[0]+' '+s.n[1]+' '+s.id+' '+s.cor).toLowerCase().includes(q))return false;
  return true;
}
function mapSVG(){
  const borders=`<path d="M300 40 L300 580 M520 40 L520 580 M740 40 L740 580 M300 310 L520 310" />`;
  const corr=Object.entries(CORR).map(([k,p])=>`<polyline points="${p.map(q=>q.join(',')).join(' ')}" style="fill:none;stroke:var(--line2);stroke-width:7;stroke-linecap:round;stroke-linejoin:round"/><polyline points="${p.map(q=>q.join(',')).join(' ')}" style="fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:10 8;opacity:.75"/>`).join('');
  const shields=Object.entries(CORR).map(([k,p])=>{const a=p[0];return `<g transform="translate(${a[0]-22},${a[1]-26})"><rect width="44" height="18" rx="5" style="fill:var(--panel2);stroke:var(--gold)"/><text x="22" y="13" text-anchor="middle" style="fill:var(--gold2);font:700 10px var(--mono)">${k}</text></g>`}).join('');
  const labels=[[170,560-60],[410,110],[400,420],[630,260],[850,560-60]].map((p,i)=>`<text x="${[200,330,330,560,770][i]}" y="${[80,100,530,90,95][i]}" style="fill:var(--dim);font:700 12px var(--font);letter-spacing:.14em;text-transform:uppercase">${esc(stName(i)).toUpperCase()}</text>`).join('');
  const dots=S.stations.map(s=>{const c=stCls(s),sel=s.id===S.ui.sel,dim=!passes(s);
    return `<g class="st" data-id="${s.id}" style="opacity:${dim?.25:1}">${sel?`<circle cx="${s.x}" cy="${s.y}" r="17" style="fill:none;stroke:var(--gold2);stroke-width:2.5"><animate attributeName="r" values="14;20;14" dur="1.8s" repeatCount="indefinite"/></circle>`:''}<circle class="c" cx="${s.x}" cy="${s.y}" r="11" style="fill:${colOf(c)};stroke:var(--bg);stroke-width:2"/><text x="${s.x}" y="${s.y+4}" text-anchor="middle" style="fill:#fff;font:800 10.5px var(--mono);pointer-events:none">${availOf(s)}</text></g>`}).join('');
  return `<svg viewBox="0 0 1000 600" role="img" aria-label="${T('Map of chargers','Карта зарядок')}"><defs><clipPath id="clipC"><polygon points="${OUTLINE}"/></clipPath></defs>
  <polygon points="${OUTLINE}" style="fill:var(--bg2);stroke:var(--line2);stroke-width:2"/>
  <g clip-path="url(#clipC)" style="fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 5">${borders}</g>
  ${labels}${corr}${shields}<g id="cars">${cars.map(()=>`<circle r="3.5" style="fill:var(--blue)"/>`).join('')}</g>${dots}</svg>`;
}
function moveCars(){
  const g=$('#cars');if(!g||view!=='map')return;const cs=g.children;
  cars.forEach((c,i)=>{c.f+=c.v;if(c.f>1)c.f-=1;if(c.f<0)c.f+=1;const p=polyAt(CORR[c.c],c.f);if(cs[i]){cs[i].setAttribute('cx',p[0].toFixed(1));cs[i].setAttribute('cy',p[1].toFixed(1))}});
}

function mapDyn(){
  if(view!=='map')return;
  const all=S.stations.flatMap(s=>s.ports),av=all.filter(p=>p.st==='avail').length,bz=all.filter(p=>p.st==='busy').length,fl=all.filter(p=>p.st==='fault'||p.st==='off').length;
  $('#mK').innerHTML=[[T('Free ports now','Свободно сейчас'),av,T('of '+all.length+' DC fast ports','из '+all.length+' быстрых разъёмов')],[T('Charging now','Заряжаются'),bz,T('active sessions network-wide','активных сессий в сети')],[T('Out of service','Не работают'),fl,T('ports faulted or offline','разъёмов с ошибкой или без связи')],[T('Network uptime (30 d)','Доступность сети (30 дн)'),num(netUp(),2)+'%',T('target 97.00%','цель 97,00%')]]
    .map((k,i)=>`<div class="card kpi"><div class="l">${k[0]}</div><div class="v" style="color:${['var(--mal3)','var(--amber)','var(--red)','var(--text)'][i]}">${k[1]}</div><div class="d">${k[2]}</div></div>`).join('');
  $('#mUpd').textContent=T('updated ','обновлено ')+fmtT(Date.now());
  $('#mSvg').innerHTML=mapSVG();moveCars();

function powerAt(maxKw,soc){return maxKw*(soc<55?1:Math.max(.22,1-(soc-55)/55))}

function drawCurve(){

  cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const s=stById(a.sid),vh=VEH[a.veh],max=Math.min(s.ports[a.port].kw,vh[3]),tot=Math.max(10,simulate(max,vh[2],a.soc0,a.tgt));
  const L=34,B=20,w=W-L-6,h=H-B-8,x=m=>L+w*m/tot,y=k=>8+h*(1-k/(max*1.1));
  g.font='10px '+cssv('--mono').split(',')[0];g.fillStyle=cssv('--dim');g.strokeStyle=cssv('--line');g.lineWidth=1;
  for(let i=0;i<=4;i++){const k=max*1.1*i/4;g.beginPath();g.moveTo(L,y(k));g.lineTo(W-6,y(k));g.stroke();g.fillText(Math.round(k),2,y(k)+3)}
  g.fillText('0',L,H-5);g.fillText(tot+' '+T('min','мин'),W-50,H-5);

  if(a.curve.length){const grad=g.createLinearGradient(0,8,0,H-B);const mc=cssv('--mal');grad.addColorStop(0,mc+'88');grad.addColorStop(1,mc+'00');
    g.beginPath();g.moveTo(x(0),y(0));a.curve.forEach(c=>g.lineTo(x(c[0]),y(c[1])));g.lineTo(x(a.curve[a.curve.length-1][0]),y(0));g.closePath();g.fillStyle=grad;g.fill();
    g.beginPath();a.curve.forEach((c,i)=>i?g.lineTo(x(c[0]),y(c[1])):g.moveTo(x(c[0]),y(c[1])));g.strokeStyle=cssv('--mal3');g.lineWidth=2.5;g.stroke()}
}

function compliance(q,st){

  const up=sts.filter(s=>upOf(s)>=97).length,sp=sts.filter(s=>s.spacing).length,oc=sts.filter(s=>s.ocpi).length;
  const items=[[T('≥4 CCS ports at ≥150 kW per site','≥4 разъёма CCS ≥150 кВт на площадке'),ports4,sts.length],[T('Port uptime ≥97% (rolling 12 mo)','Доступность разъёмов ≥97%'),up,sts.length],[T('Max 50 mi spacing along corridor','Расстояние ≤50 миль по коридору'),sp,sts.length],[T('Real-time status via OCPI 2.2','Статус в реальном времени через OCPI 2.2'),oc,sts.length],[T('Price per kWh shown before session','Цена за кВт·ч до начала сессии'),sts.length,sts.length]];
  const score=Math.round(items.reduce((a,i)=>a+i[1]/Math.max(1,i[2]),0)/items.length*100);

    <ul class="chk" style="margin-top:12px">${c.items.map(i=>{const ok=i[1]===i[2];return `<li><span class="${ok?'ok-t':'warn-t'}">${ok?'✓':'!'}</span><span>${i[0]}</span><em class="${ok?'ok-t':'warn-t'}">${i[1]}/${i[2]}</em></li>`}).join('')}</ul>
    <div class="row" style="margin-top:12px"><button class="btn pri" id="rGen">${T('Generate report','Сформировать отчёт')}</button><button class="btn sm" id="rCsv">⤓ ${T('Site data CSV','Данные площадок CSV')}</button></div></div>
    <div class="card chart"><h3>${T('Obligated vs reimbursed by state','Обязательства и возмещение по штатам')}</h3>${fundSVG()}<div class="legend"><span><i style="background:var(--line2);border-radius:3px"></i>${T('Obligated','Обязательства')}</span><span><i style="background:var(--mal);border-radius:3px"></i>${T('Reimbursed','Возмещено')}</span></div></div></div>
  <div class="card" style="margin-top:14px"><h3>${T('Submitted reports','Отчёты')}</h3><div class="tw"><table><thead><tr><th>ID</th><th>${T('Quarter','Квартал')}</th><th>${T('Scope','Охват')}</th><th>${T('Created','Создан')}</th><th>${T('Score','Оценка')}</th><th>${T('Status','Статус')}</th><th></th></tr></thead><tbody>
  ${S.reports.slice().reverse().map(r=>{const k=RST[r.status];return `<tr><td class="mono">${r.id}</td><td>${QS[r.q]}</td><td>${stName(r.state)}</td><td>${fmtDT(r.created)}</td><td class="mono">${r.score}%</td><td>${pill(k[2],T(k[0],k[1]))}${r.note?`<div class="muted" style="font-size:11.5px;white-space:normal;min-width:180px">${T(r.note[0],r.note[1])}</div>`:''}</td><td>${r.status==='draft'||r.status==='returned'?`<button class="btn sm pri" data-sub="${r.id}">${T('Submit','Отправить')}</button>`:''} <button class="btn sm" data-dl="${r.id}">⤓</button></td></tr>`}).join('')}</tbody></table></div></div>`;
  $('#rQ').onchange=e=>{S.ui.q=+e.target.value;save();rReports()};$('#rS').onchange=e=>{S.ui.rst=+e.target.value;save();rReports()};
  $('#rGen').onclick=()=>{const id='RPT-'+QS[q].replace(' ','-').split('-').reverse().join('-')+(st<0?'':'-'+STATES[st][0].slice(0,3).toUpperCase())+'-'+(S.reports.length+1);
    S.reports.push({id,q,state:st,created:Date.now(),status:'draft',score:c.score});save();toast(T('Draft report ','Черновик отчёта ')+id+T(' created',' создан'));rReports()};
  $('#rCsv').onclick=()=>download('voltnet-sites-'+QS[q].replace(' ','-')+'.csv',[['site_id','name','state','corridor','operator','ports','ccs_150kw','uptime_pct','sessions','kwh','ocpi'],...c.sts.map(s=>[s.id,s.n[0],STATES[s.st][0],s.cor,s.op,s.ports.length,s.ports.filter(p=>p.t==='CCS'&&p.kw>=150).length,upOf(s).toFixed(2),s.ses,s.kwh,s.ocpi?'yes':'no'])]);
  $$('[data-sub]',v).forEach(b=>b.onclick=()=>{const r=S.reports.find(x=>x.id===b.dataset.sub);r.status='submitted';r.note=null;save();toast(T('Report submitted to the program office','Отчёт отправлен в офис программы'));rReports();
    setTimeout(()=>{r.status='review';save();if(view==='reports')rReports()},2500);
    setTimeout(()=>{const ok=r.score>=90;r.status=ok?'accepted':'returned';r.note=ok?null:['Returned: uptime and spacing gaps — attach corrective action plan','Возвращён: недобор доступности и расстояний — приложите план исправлений'];save();toast(ok?T('Report '+r.id+' accepted','Отчёт '+r.id+' принят'):T('Report '+r.id+' returned for corrections','Отчёт '+r.id+' возвращён на доработку'),ok?'':'bad');if(view==='reports')rReports()},6000)});
  $$('[data-dl]',v).forEach(b=>b.onclick=()=>{const r=S.reports.find(x=>x.id===b.dataset.dl),cc=compliance(r.q,r.state);download(r.id+'.csv',[['report',r.id],['quarter',QS[r.q]],['scope',r.state<0?'All states':STATES[r.state][0]],['score_pct',r.score],['status',r.status],[],['requirement','met','total'],...cc.items.map((i,k)=>[['ports_4x150kw','uptime_97','spacing_50mi','ocpi_realtime','price_display'][k],i[1],i[2]])])});
}

/* ---------- simulation ---------- */
function logMsg(sid,m,d){S.log.unshift({ts:Date.now(),sid,m,d});if(S.log.length>80)S.log.length=80}
let T1=null,T2=null,T3=null;
function netTick(){
  const r=Math.random,now=Date.now();
  for(let k=0;k<3;k++){const s=S.stations[Math.floor(r()*S.stations.length)];if(s.ports.every(p=>p.st==='off'))continue;const i=Math.floor(r()*s.ports.length),p=s.ports[i];
    if(S.active&&S.active.sid===s.id&&S.active.port===i)continue;
    if(p.st==='avail'&&r()<.55){p.st='busy';s.ses++;logMsg(s.id,'TransactionEvent',`Started · evse ${i+1}`)}
    else if(p.st==='busy'&&r()<.6){p.st='avail';const e=Math.round(18+r()*45);s.kwh+=e;logMsg(s.id,'TransactionEvent',`Ended · evse ${i+1} · ${e} kWh`)}
    s.hb=now;}
  const hs=S.stations[Math.floor(r()*S.stations.length)];if(!hs.ports.every(p=>p.st==='off')){hs.hb=now;logMsg(hs.id,'Heartbeat','')}
  if(r()<.07&&S.incidents.filter(i=>i.status!=='resolved').length<6){const s=S.stations[Math.floor(r()*S.stations.length)],i=Math.floor(r()*s.ports.length);
    if(s.ports[i].st==='avail'){s.ports[i].st='fault';const f=FCODES[Math.floor(r()*FCODES.length)];S.incidents.push({id:'INC-'+(4200+S.incidents.length),sid:s.id,port:i,code:f[0],opened:now,status:'open'});logMsg(s.id,'StatusNotification',`evse ${i+1} → Faulted (${f[0]})`);toast(T('New incident: ','Новый инцидент: ')+fcode(f[0])+' · '+s.id,'bad')}}
  S.stations.forEach(s=>s.ports.forEach(p=>{if(p.st==='fault'||p.st==='off')p.down+=2}));
  save();badges();
  if(view==='map')mapDyn();else if(view==='uptime')upDyn();
}
function startSim(){stopSim();T1=setInterval(netTick,3000);T2=setInterval(tickSession,1000);T3=setInterval(moveCars,120)}
function stopSim(){clearInterval(T1);clearInterval(T2);clearInterval(T3)}

PT.onLang(()=>{$$('.view:not(.on)').forEach(x=>{x.innerHTML='';delete x.dataset.built});if(auth)render()});
addEventListener('resize',()=>{if(view==='charge')drawCurve()});
$('#hPorts').textContent=S.stations.reduce((a,s)=>a+s.ports.length,0);
if(auth&&auth.email){enter()}
})();
</script>
