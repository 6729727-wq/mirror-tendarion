<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas Data Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
[hidden]{display:none!important}
.wrap{max-width:1320px;margin:0 auto;padding:18px 20px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{margin:0;font-size:22px;display:flex;align-items:center;gap:10px}
.top h1 b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1306;font-size:16px}
.top .sp{flex:1}
.stack{display:flex;gap:6px;flex-wrap:wrap}.stack .pill{font-family:var(--mono);font-size:11px;padding:2px 8px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}.kpi .v{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:11.5px;color:var(--dim)}
.cgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.tw{overflow:auto;max-height:440px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;background:var(--panel2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);padding:8px 10px;white-space:nowrap;z-index:1}
th.so{cursor:pointer;user-select:none}th.so:hover{color:var(--text)}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:color-mix(in srgb,var(--mal) 6%,transparent)}
.nul{color:var(--dim);font-style:italic;font-family:var(--mono);font-size:11px}
.toasts{position:fixed;right:16px;top:60px;z-index:3000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:320px;animation:pop .2s}
.toast.bad{border-left-color:var(--red)}.toast.gold{border-left-color:var(--gold)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.tip{position:fixed;pointer-events:none;z-index:4000;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;max-width:260px}
.tip.on{opacity:1}.tip b{font-family:var(--mono)}
.f{margin-bottom:11px}.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
select.input{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:5px 11px;cursor:pointer;font-weight:600;font-size:12.5px}
.chip.on,.chip:hover{border-color:var(--gold);color:var(--gold2)}
.chip small{color:var(--dim);font-weight:500;margin-left:3px}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--gold);animation:sp .8s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid color-mix(in srgb,#fff 35%,transparent);border-radius:5px;padding:0 5px;opacity:.85}
/* catalogue */
.catl{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
.filt{position:sticky;top:60px}
.fg{margin-top:16px}.fh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:700;margin-bottom:8px}
.fo{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;cursor:pointer}
.fo input{accent-color:var(--mal);margin:0}.fo span{flex:1;min-width:0}.fo small{color:var(--dim);font-family:var(--mono)}
.lhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;font-size:13.5px}
.lhead .sp{flex:1}.lhead select{width:auto;padding-top:7px;padding-bottom:7px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:14px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:10px}
.dcard:hover{border-color:var(--mal);transform:translateY(-2px)}
.dch{display:flex;gap:11px;align-items:flex-start}
.dico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);font-size:19px;flex:none}
.dct{flex:1;min-width:0}.dct b{display:block;font-size:15px;line-height:1.3}.dct span{font-size:12px;color:var(--muted)}
.dcard p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap}.tags .pill{font-size:11px;padding:2px 8px}
.dmeta{font-size:11.5px;color:var(--dim);font-family:var(--mono);display:flex;gap:10px;flex-wrap:wrap}
.score{flex:none;font-family:var(--mono);font-weight:700;font-size:12px;border-radius:8px;padding:3px 7px;border:1px solid}
.score.ok{color:var(--mal3);border-color:color-mix(in srgb,var(--mal) 50%,transparent)}
.score.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,transparent)}
.score.bad{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,transparent)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r)}
.back{border:0;background:none;color:var(--muted);cursor:pointer;font-weight:600;padding:4px 0;margin-bottom:10px;font-size:13.5px}.back:hover{color:var(--text)}
.dhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px}
.dhead h2{margin:0;font-size:22px;line-height:1.25;display:flex;gap:12px;align-items:center}
.dhead .tid{font-style:italic;color:var(--dim);font-size:13px;margin-top:2px}
.dhead p{margin:10px 0 0;color:var(--muted);font-size:14px;max-width:760px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start;justify-content:flex-end;max-width:360px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.mgrid div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.mgrid span{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.mgrid b{font-size:14px}
pre.code{font-family:var(--mono);font-size:11.8px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;max-height:460px;margin:0;line-height:1.6;white-space:pre}
.jk{color:var(--gold2)}.js{color:var(--mal3)}.jn{color:var(--blue)}
.ty{font-family:var(--mono);font-size:11.5px;color:var(--violet)}
/* BI */
.bigrid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;align-items:start}
.chart{min-height:260px;position:relative}
.chart svg{display:block;max-width:100%}
.chart svg text{font-family:var(--font)}
.ax{fill:var(--dim);font-size:11px}.axv{fill:var(--muted);font-size:11px;font-family:var(--mono)!important}.lb{fill:var(--text);font-size:12px}
.chart [data-tip]{transition:opacity .12s}.chart [data-tip]:hover{opacity:.78}
.note{font-size:12px;color:var(--dim);margin-top:8px}
.dhd{display:flex;align-items:center;gap:10px;margin:22px 0 12px;flex-wrap:wrap}.dhd h2{margin:0;font-size:18px}.dhd .sp{flex:1}
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr));gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px;min-width:0;animation:pop .25s}
.tile .th{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.tile .th div{flex:1;min-width:0}.tile .th b{display:block;font-size:14px;line-height:1.3}.tile .th span{font-size:11.5px;color:var(--dim)}
.ib{border:1px solid var(--line2);background:transparent;border-radius:8px;width:28px;height:28px;cursor:pointer;color:var(--muted);flex:none;display:grid;place-items:center;font-size:13px}
.ib:hover{border-color:var(--mal);color:var(--text)}
.tile .chart{min-height:200px}
/* SQL */
.sqlgrid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;align-items:start}
#sqlIn{min-height:150px;resize:vertical;font-family:var(--mono);font-size:13px;line-height:1.55;tab-size:2;white-space:pre;overflow:auto}
.srow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.srow .sp{flex:1}
.sstat{font-size:12px;color:var(--muted);font-family:var(--mono)}
.tbl{border-bottom:1px solid var(--line);padding:7px 0}.tbl:last-child{border-bottom:0}
.tbl>button{border:0;background:none;cursor:pointer;display:flex;width:100%;gap:8px;align-items:center;padding:0;font-weight:600;font-size:13px;text-align:left}
.tbl>button span{flex:1;font-family:var(--mono)}.tbl>button small{color:var(--dim);font-family:var(--mono);font-weight:500}
.tcols{display:none;padding:6px 0 2px 18px}.tbl.open .tcols{display:block}
.tcols div{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-family:var(--mono);padding:2px 0;cursor:pointer;color:var(--muted)}.tcols div:hover{color:var(--mal3)}
.tcols i{font-style:normal;color:var(--dim);font-size:11px}
.sample{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:8px 10px;margin-bottom:7px;cursor:pointer;font-size:12.5px;font-weight:600}
.sample:hover{border-color:var(--gold)}.sample small{display:block;font-family:var(--mono);font-weight:400;color:var(--dim);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.err{border:1px solid color-mix(in srgb,var(--red) 50%,transparent);background:color-mix(in srgb,var(--red) 9%,transparent);border-radius:10px;padding:12px 14px;font-size:13px}
.err pre{font-family:var(--mono);font-size:12px;margin:8px 0 0;white-space:pre;overflow:auto;color:var(--muted)}
.hist{font-family:var(--mono);font-size:12px}
.hist div{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer;color:var(--muted)}.hist div:last-child{border-bottom:0}
.hist div:hover{color:var(--text)}.hist span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* stream */
#pipe svg{display:block;width:100%;height:auto}
.pn rect.bx{fill:var(--bg2);stroke:var(--line2);stroke-width:1.2}
.pn.k rect.bx{stroke:var(--gold)}.pn.c rect.bx{stroke:var(--mal)}
.pn .t1{fill:var(--text);font-size:13px;font-weight:700}
.pn .t2{fill:var(--dim);font-size:10.5px;font-family:var(--mono)}
.pn .t3{fill:var(--gold2);font-size:12.5px;font-weight:700;font-family:var(--mono)}
.pcell{fill:var(--panel2);stroke:var(--line2);transition:fill .25s}.pcell.hot{fill:var(--gold);transition:none}
.plink{fill:none;stroke:var(--line2);stroke-width:2;stroke-dasharray:4 5}
.lagbar{fill:var(--amber)}
#spark{width:100%;height:190px;display:block}
.leg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tail{height:250px;font-size:11.2px}
.btn.on{border-color:var(--gold);color:var(--gold2)}
/* quality */
.dqd{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;background:var(--bg2)}
.dqh{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.dqh .dico{width:34px;height:34px;font-size:16px}.dqh b{font-size:14.5px}.dqh .sp{flex:1}
.dqg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.chk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.chk.ok{box-shadow:inset 3px 0 0 var(--mal)}.chk.warn{box-shadow:inset 3px 0 0 var(--amber)}.chk.bad{box-shadow:inset 3px 0 0 var(--red)}
.chk .cl{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.chk .cl .pill{margin-left:auto;font-size:10.5px;padding:1px 7px;text-transform:none;letter-spacing:0}
.chk .cv{font-family:var(--mono);font-weight:700;font-size:17px}
.chk .cd{font-size:11.5px;color:var(--dim);line-height:1.4}
.chk .btn{align-self:flex-start;margin-top:2px;padding:4px 10px;font-size:11.5px}
.chk.run{opacity:.7}
.runlog div{display:flex;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.runlog div:last-child{border-bottom:0}
.runlog span:first-child{font-family:var(--mono);color:var(--dim);min-width:70px}
@media (max-width:1100px){.dqg{grid-template-columns:repeat(3,minmax(0,1fr))}.bigrid,.sqlgrid{grid-template-columns:minmax(0,1fr)}.cgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.catl{grid-template-columns:minmax(0,1fr)}.filt{position:static}.dhead{grid-template-columns:minmax(0,1fr)}.acts{justify-content:flex-start;max-width:none}.wrap{padding:14px 16px 50px}}
@media (max-width:560px){.dqg{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:19px}.top h1{font-size:20px}.dhead h2{font-size:19px}}
</style>
</head>
<body data-demo-en="Atlas — national data platform" data-demo-ru="Atlas — национальная платформа данных">
<div class="wrap">
  <div class="top">
    <h1><b>A</b>Atlas</h1>
    <span class="pill gold" data-en="Satu Data class · EU Open Data Hub" data-ru="Класс «Satu Data» · EU Open Data Hub"></span>
    <span class="stack"><span class="pill">Kafka</span><span class="pill">ClickHouse</span><span class="pill">Superset</span><span class="pill">lake</span></span>
    <span class="sp"></span>
    <div class="seg" id="seg"><button data-v="cat" class="on" data-en="Open data" data-ru="Открытые данные"></button><button data-v="bi" data-en="BI builder" data-ru="Конструктор BI"></button><button data-v="sql" data-en="SQL console" data-ru="SQL-консоль"></button><button data-v="stream" data-en="Streaming" data-ru="Потоки"></button><button data-v="dq" data-en="Data quality" data-ru="Качество данных"></button></div>
  </div>

  <section class="view on" id="v-cat">
    <div class="kpis" id="catKpis"></div>
    <div id="catList" class="catl">
      <aside class="card filt">
        <input class="input" id="q" type="search" data-en-ph="Search datasets, columns, tags…" data-ru-ph="Поиск по наборам, столбцам, тегам…">
        <div class="fg"><div class="fh" data-en="Publisher" data-ru="Издатель"></div><div id="fPub"></div></div>
        <div class="fg"><div class="fh" data-en="Format" data-ru="Формат"></div><div class="chips" id="fFmt"></div></div>
        <div class="fg"><div class="fh" data-en="Licence" data-ru="Лицензия"></div><div class="chips" id="fLic"></div></div>
        <div class="fg"><button class="btn sm" id="fReset" data-en="Reset filters" data-ru="Сбросить фильтры"></button></div>
      </aside>
      <div>
        <div class="lhead"><b id="catCount"></b><span class="sp"></span><select class="input" id="sort"><option value="rel" data-en="Sort: relevance" data-ru="Сортировка: релевантность"></option><option value="upd" data-en="Sort: recently updated" data-ru="Сортировка: недавно обновлённые"></option><option value="rows" data-en="Sort: most rows" data-ru="Сортировка: больше строк"></option><option value="q" data-en="Sort: quality score" data-ru="Сортировка: оценка качества"></option><option value="name" data-en="Sort: name" data-ru="Сортировка: название"></option></select></div>
        <div class="cards" id="cards"></div>
      </div>
    </div>
    <div id="catDetail" hidden></div>
  </section>

  <section class="view" id="v-bi">
    <div class="bigrid">
      <div class="card">
        <h3><span data-en="Chart builder" data-ru="Конструктор графика"></span><span class="sp"></span><span class="pill" data-en="Superset-compatible" data-ru="Совместим с Superset"></span></h3>
        <div class="f"><label data-en="Dataset" data-ru="Набор данных"></label><select class="input" id="biDs"></select></div>
        <div class="f"><label data-en="Dimension (group by)" data-ru="Измерение (группировка)"></label><select class="input" id="biDim"></select></div>
        <div class="f2"><div class="f"><label data-en="Measure" data-ru="Показатель"></label><select class="input" id="biMeas"></select></div><div class="f"><label data-en="Aggregation" data-ru="Агрегация"></label><select class="input" id="biAgg"></select></div></div>
        <div class="f2"><div class="f"><label data-en="Filter" data-ru="Фильтр"></label><select class="input" id="biFilt"></select></div><div class="f"><label data-en="Show" data-ru="Показать"></label><select class="input" id="biTop"></select></div></div>
        <div class="f"><label data-en="Chart type" data-ru="Тип графика"></label><div class="seg" id="biType" style="display:flex"><button data-t="bar" class="on" data-en="▮ Bar" data-ru="▮ Столбцы"></button><button data-t="line" data-en="⟋ Line" data-ru="⟋ Линия"></button><button data-t="pie" data-en="◔ Pie" data-ru="◔ Круг"></button><button data-t="map" data-en="◉ Map" data-ru="◉ Карта"></button></div></div>
        <div class="f"><label data-en="Chart title" data-ru="Заголовок графика"></label><input class="input" id="biTitle" data-en-ph="Auto title" data-ru-ph="Заголовок по умолчанию"></div>
        <button class="btn pri" id="biSave" style="width:100%;justify-content:center" data-en="＋ Save to dashboard" data-ru="＋ Сохранить на дашборд"></button>
      </div>
      <div class="card"><h3><span id="biCap"></span><span class="sp"></span><span class="pill mono" id="biInfo"></span></h3><div class="chart" id="biChart"></div><div class="note" id="biNote"></div></div>
    </div>
    <div class="dhd"><h2 data-en="Dashboard · National indicators" data-ru="Дашборд · Национальные показатели"></h2><span class="pill" id="dashCount"></span><span class="sp"></span><button class="btn sm" id="dashReset" data-en="Restore default" data-ru="Вернуть по умолчанию"></button></div>
    <div class="dash" id="dash"></div>
  </section>

  <section class="view" id="v-sql">
    <div class="sqlgrid">
      <aside class="card">
        <h3><span data-en="Tables" data-ru="Таблицы"></span><span class="sp"></span><span class="pill mono">atlas.public</span></h3>
        <div id="tree"></div>
        <h3 style="margin-top:18px" data-en="Sample queries" data-ru="Примеры запросов"></h3>
        <div id="samples"></div>
      </aside>

  el.innerHTML=`<h3><span>${T('First 100 rows','Первые 100 строк')}</span><span class="sp"></span><span class="muted" style="font-size:12px;font-weight:500">${T('Click a header to sort','Нажмите заголовок для сортировки')} · ${fmt(ds.rows.length)} ${T('total','всего')}</span></h3><div class="tw"><table><thead><tr>${ds.cols.map(c=>`<th class="so ${isNum(c)?'num':''}" data-c="${c.n}">${c.n}${pSort.c===c.n?(pSort.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${ds.cols.map(c=>r[c.n]==null?'<td><span class="nul">NULL</span></td>':isNum(c)?`<td class="num mono">${c.n==='year'?r[c.n]:fmt(r[c.n],2)}</td>`:`<td>${esc(r[c.n])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

 else if(dTab==='schema'){el.innerHTML=`<h3><span>${T('Columns','Столбцы')}</span><span class="sp"></span><span class="pill mono">ENGINE = ReplicatedMergeTree ORDER BY (${ds.key.join(', ')})</span></h3><div class="tw"><table><thead><tr><th>${T('Column','Столбец')}</th><th>${T('Type','Тип')}</th><th>${T('Description','Описание')}</th><th>${T('Unit','Ед.')}</th><th class="num">${T('Nulls','Пустые')}</th><th class="num">${T('Distinct','Уникальных')}</th><th>${T('Range / examples','Диапазон / примеры')}</th></tr></thead><tbody>${ds.cols.map(c=>{const s=colStats(ds,c);return `<tr><td class="mono"><b>${c.n}</b>${ds.key.includes(c.n)?' <span class="pill gold" style="font-size:10px;padding:0 6px">key</span>':''}</td><td><span class="ty">${c.t}</span></td><td>${esc(TT(c.d))}</td><td class="muted">${c.u||'—'}</td><td class="num mono ${s.nul>0?'':'muted'}" style="${s.nul>2?'color:var(--amber)':''}">${fmt(s.nul,1)}%</td><td class="num mono">${fmt(s.dist)}</td><td class="mono muted" style="font-size:11.5px">${esc(s.rg)}</td></tr>`}).join('')}</tbody></table></div>`}
 else if(dTab==='meta'){el.innerHTML=`<h3><span>DCAT-AP 2.1 · JSON-LD</span><span class="sp"></span><button class="btn sm" id="cpMeta">${T('Copy','Копировать')}</button><button class="btn sm" id="dlMeta">⬇ .jsonld</button></h3><pre class="code">${hlJson(dcat(ds))}</pre><div class="note">${T('Harvestable by data.europa.eu and CKAN via /catalog.jsonld · validated against the DCAT-AP SHACL shapes','Собирается data.europa.eu и CKAN через /catalog.jsonld · проверено SHACL-формами DCAT-AP')}</div>`;
  const txt=JSON.stringify(dcat(ds),null,2);$('#cpMeta').onclick=()=>copy(txt);$('#dlMeta').onclick=()=>dlBlob(ds.id+'.jsonld',txt,'application/ld+json')}
 else{const y=ds.cols.some(c=>c.n==='year')?'year=2024&':'';const sample=ds.rows.filter(r=>!y||r.year===2024).slice(0,2).map(clean);const curl=`curl -H "Authorization: Bearer $ATLAS_TOKEN" \\\n  "${BASE}/api/v1/datasets/${ds.id}/rows?${y}limit=2"`;
  el.innerHTML=`<h3><span>REST · OpenAPI 3.1</span><span class="sp"></span><button class="btn sm" id="cpApi">${T('Copy curl','Копировать curl')}</button></h3><pre class="code">${esc(curl)}</pre><h3 style="margin-top:14px">${T('Response','Ответ')} <span class="pill ok mono">200 OK</span><span class="pill mono">${Math.round(18+Math.random()*30)} ms</span></h3><pre class="code">${hlJson({dataset:ds.id,total:y?ds.rows.filter(r=>r.year===2024).length:ds.rows.length,limit:2,next:`/api/v1/datasets/${ds.id}/rows?${y}limit=2&cursor=Mg`,rows:sample})}</pre><div class="note">${T('Also: POST /api/v1/sql (read-only, 30 s timeout) · OData v4 · WFS for province geometries · rate limit 600 req/min per key','Также: POST /api/v1/sql (только чтение, тайм-аут 30 с) · OData v4 · WFS для границ провинций · лимит 600 запросов/мин на ключ')}</div>`;$('#cpApi').onclick=()=>copy(curl)}}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(T('Copied to clipboard','Скопировано в буфер')),()=>toast(T('Clipboard is blocked in this browser','Буфер обмена заблокирован браузером'),'bad'))}

/* ---------- Aggregation + charts ---------- */
const AGG={sum:['Sum','Сумма'],avg:['Average','Среднее'],max:['Max','Максимум'],min:['Min','Минимум'],count:['Count','Количество']};
function filtOpts(ds){if(ds.cols.some(c=>c.n==='year')){const ys=[...new Set(ds.rows.map(r=>r.year))].sort();return [['latest',[`Latest year (${ys[ys.length-1]})`,`Последний год (${ys[ys.length-1]})`]],['all',['All years','Все годы']],...ys.slice().reverse().map(y=>['y'+y,[String(y),String(y)]])]}if(ds.cols.some(c=>c.n==='date'))return [['all',['All 60 days','Все 60 дней']],['d30',['Last 30 days','Последние 30 дней']],['d7',['Last 7 days','Последние 7 дней']]];return [['all',['All rows','Все строки']]]}
function applyFilt(ds,f){let R=ds.rows;if(f==='latest'){const m=Math.max(...R.map(r=>r.year));R=R.filter(r=>r.year===m)}else if(f&&f[0]==='y'){const y=+f.slice(1);R=R.filter(r=>r.year===y)}else if(f==='d30'||f==='d7'){const lim=isoDay(NOW-(f==='d7'?6:29)*DAY);R=R.filter(r=>r.date>=lim)}return R}
function aggregate(sp){const ds=DSI[sp.ds];const rows=applyFilt(ds,sp.filt);const m=new Map();for(const r of rows){const k=r[sp.dim];if(k==null)continue;let g=m.get(k);if(!g)m.set(k,g={s:0,c:0,n:0,mn:Infinity,mx:-Infinity});g.n++;const v=sp.meas==='__count'?1:r[sp.meas];if(v==null)continue;g.s+=v;g.c++;if(v<g.mn)g.mn=v;if(v>g.mx)g.mx=v}
 let out=[...m].map(([k,g])=>({k,v:sp.agg==='count'||sp.meas==='__count'?(sp.meas==='__count'?g.n:g.c):sp.agg==='sum'?g.s:sp.agg==='avg'?(g.c?g.s/g.c:0):sp.agg==='max'?g.mx:g.mn}));
 const seq=sp.dim==='year'||sp.dim==='date';out.sort(seq?(a,b)=>a.k<b.k?-1:1:(a,b)=>b.v-a.v);return {data:out,rows:rows.length,seq}}
const PAL=['var(--mal)','var(--gold)','var(--blue)','var(--violet)','var(--amber)','var(--red)','var(--mal3)'];
let gid=0;
function nice(max){if(!(max>0))return{top:1,step:.25};const e=Math.pow(10,Math.floor(Math.log10(max)));const f=max/e;const st=(f<=1.2?0.25:f<=2.5?0.5:f<=5?1:2)*e;return{top:Math.ceil(max/st-1e-9)*st,step:st}}
const lab=(k,seq)=>seq&&typeof k==='string'&&k.length===10?k.slice(5):String(k);
const clip=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
function tipOf(k,v,u){return esc(k)+' · <b>'+esc(fmt(v,v<100?2:0))+'</b>'+(u?' '+esc(u):'')}
function chart(sp,w,small){const ds=DSI[sp.ds];const col=ds.cols.find(c=>c.n===sp.meas);const u=col&&col.u&&sp.agg!=='count'?col.u:'';let {data,rows,seq}=aggregate(sp);let other=0;
 if(sp.type==='pie'){const lim=6;if(data.length>lim+1){other=data.slice(lim).reduce((s,d)=>s+d.v,0);data=data.slice(0,lim)}return {svg:pie(data,other,w,small,u),n:data.length,rows}}
 if(sp.type==='map')return {svg:mapC(data,w,small,u),n:data.length,rows};
 if(!seq&&sp.top&&data.length>sp.top)data=data.slice(0,sp.top);
 if(sp.type==='line')return {svg:line(data,w,small?210:300,seq,u),n:data.length,rows};
 const maxL=Math.max(...data.map(d=>String(d.k).length));return {svg:seq||(data.length<=8&&maxL<=14)?barV(data,w,small?210:300,seq,u):barH(data,w,small,u),n:data.length,rows}}
const svgO=(w,h)=>`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img">`;
function yAxis(pl,pr,pt,ih,w,top,step){let s='';for(let v=0;v<=top+step/2;v+=step){const y=pt+ih-(v/top)*ih;s+=`<line x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}" style="stroke:var(--line)" ${v?'stroke-dasharray="3 4"':''}/><text x="${pl-7}" y="${y+4}" text-anchor="end" class="axv">${fmtC(v)}</text>`}return s}
function barV(data,w,H,seq,u){const pl=48,pr=10,pt=14,pb=28,iw=w-pl-pr,ih=H-pt-pb;const mx=Math.max(...data.map(d=>d.v),0);const {top,step}=nice(mx);let s=svgO(w,H)+yAxis(pl,pr,pt,ih,w,top,step);const n=data.length,bw=iw/n;const every=Math.max(1,Math.ceil(n/Math.max(1,Math.floor(iw/54))));
 data.forEach((d,i)=>{const bh=Math.max(1,d.v/top*ih),x=pl+i*bw+bw*.17,bwi=Math.max(1,bw*.66);s+=`<rect x="${x}" y="${pt+ih-bh}" width="${bwi}" height="${bh}" rx="${Math.min(4,bwi/3)}" style="fill:${d.v===mx?'var(--gold)':'var(--mal)'}" data-tip="${tipOf(d.k,d.v,u)}"/>`;if(i%every===0)s+=`<text x="${x+bwi/2}" y="${H-pb+17}" text-anchor="middle" class="ax">${esc(clip(lab(d.k,seq),12))}</text>`;if(n<=12&&!seq||n<=8)s+=`<text x="${x+bwi/2}" y="${pt+ih-bh-5}" text-anchor="middle" class="axv">${fmtC(d.v)}</text>`});return s+'</svg>'}
function barH(data,w,small,u){const rh=small?20:24,lw=Math.min(small?120:150,w*.36),pr=54,H=data.length*rh+6,mx=Math.max(...data.map(d=>d.v),0)||1,iw=w-lw-pr;let s=svgO(w,H);
 data.forEach((d,i)=>{const y=i*rh+3,bw=Math.max(2,d.v/mx*iw);s+=`<text x="${lw-8}" y="${y+rh/2+4}" text-anchor="end" class="lb" style="font-size:${small?11:12}px">${esc(clip(String(d.k),small?16:20))}</text><rect x="${lw}" y="${y+3}" width="${bw}" height="${rh-7}" rx="4" style="fill:${i===0?'var(--gold)':'var(--mal)'}" opacity="${1-i/data.length*.45}" data-tip="${tipOf(d.k,d.v,u)}"/><text x="${lw+bw+6}" y="${y+rh/2+4}" class="axv">${fmtC(d.v)}</text>`});return s+'</svg>'}
function line(data,w,H,seq,u){const pl=48,pr=14,pt=16,pb=28,iw=w-pl-pr,ih=H-pt-pb;const vals=data.map(d=>d.v);const mx=Math.max(...vals,0);const {top,step}=nice(mx);const n=data.length;const id='lg'+(++gid);
 const X=i=>n<2?pl+iw/2:pl+i*iw/(n-1),Y=v=>pt+ih-v/top*ih;let s=svgO(w,H)+`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--mal);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--mal);stop-opacity:0"/></linearGradient></defs>`+yAxis(pl,pr,pt,ih,w,top,step);
 const pts=data.map((d,i)=>[X(i),Y(d.v)]);if(n>1)s+=`<path d="M${pts[0][0]},${pt+ih}L${pts.map(p=>p.join(',')).join('L')}L${pts[n-1][0]},${pt+ih}Z" fill="url(#${id})"/><path d="M${pts.map(p=>p.join(',')).join('L')}" fill="none" style="stroke:var(--mal3)" stroke-width="2.2" stroke-linejoin="round"/>`;
 const every=Math.max(1,Math.ceil(n/Math.max(1,Math.floor(iw/58))));const mi=vals.indexOf(mx);
 data.forEach((d,i)=>{if(n<=24||i===mi)s+=`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${i===mi?4.5:3}" style="fill:${i===mi?'var(--gold)':'var(--panel)'};stroke:${i===mi?'var(--gold)':'var(--mal3)'}" stroke-width="2"/>`;s+=`<rect x="${pts[i][0]-Math.max(4,iw/n/2)}" y="${pt}" width="${Math.max(8,iw/n)}" height="${ih}" fill="transparent" data-tip="${tipOf(lab(d.k,false),d.v,u)}"/>`;if(i%every===0||i===n-1&&n<=12)s+=`<text x="${pts[i][0]}" y="${H-pb+17}" text-anchor="middle" class="ax">${esc(clip(lab(d.k,seq),12))}</text>`});
 return s+'</svg>'}
function pie(data,other,w,small,u){const all=other?[...data,{k:T('Other','Прочие'),v:other,o:1}]:data;const tot=all.reduce((s,d)=>s+d.v,0)||1;const side=w>=430;const R=Math.min(small?92:120,(side?w*.42:w)/2-10),r0=R*.58;const H=side?2*R+20:2*R+20+all.length*22+6;const cx=side?R+12:w/2,cy=R+10;let s=svgO(w,H),a=-Math.PI/2;
 all.forEach((d,i)=>{const f=d.v/tot,a2=a+f*Math.PI*2-1e-6,lg=f>.5?1:0;const p=(rr,an)=>[cx+rr*Math.cos(an),cy+rr*Math.sin(an)];const [x1,y1]=p(R,a),[x2,y2]=p(R,a2),[x3,y3]=p(r0,a2),[x4,y4]=p(r0,a);const col=d.o?'var(--dim)':PAL[i%PAL.length];
  s+=`<path d="M${x1},${y1}A${R},${R} 0 ${lg} 1 ${x2},${y2}L${x3},${y3}A${r0},${r0} 0 ${lg} 0 ${x4},${y4}Z" style="fill:${col};stroke:var(--panel)" stroke-width="2" data-tip="${tipOf(d.k,d.v,u)} · ${fmt(f*100,1)}%"/>`;
  const lx=side?cx+R+26:16,ly=side?cy-all.length*11+i*22+4:2*R+34+i*22;s+=`<rect x="${lx}" y="${ly-9}" width="11" height="11" rx="3" style="fill:${col}"/><text x="${lx+18}" y="${ly}" class="lb">${esc(clip(String(d.k),side?Math.max(8,Math.floor((w-lx-90)/7)):24))}</text><text x="${w-8}" y="${ly}" text-anchor="end" class="axv">${fmt(f*100,1)}%</text>`;a=a2+1e-6});
 s+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" class="ax">${T('Total','Всего')}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" class="lb" style="font-weight:800;font-size:15px">${fmtC(tot)}</text>`;return s+'</svg>'}
function mapC(data,w,small,u){const H=Math.round(w/2.45),p=14;const X=lon=>p+(lon-94.5)/47*(w-2*p),Y=lat=>p+(6.5-lat)/18*(H-2*p);const mx=Math.max(...data.map(d=>d.v),0)||1;const sc=w/24;let s=svgO(w,H)+`<rect x="0" y="0" width="${w}" height="${H}" rx="12" style="fill:var(--bg2)"/><line x1="0" x2="${w}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--line2)" stroke-dasharray="2 6"/><text x="${w-8}" y="${Y(0)-5}" text-anchor="end" class="ax" style="font-size:10px">0°</text>`;
 PV.forEach(q=>{s+=`<circle cx="${X(q.lon)}" cy="${Y(q.lat)}" r="${Math.sqrt(q.area)/392*sc}" style="fill:var(--line)" opacity=".75"/>`});
 if(!small)[['SUMATRA',99,-5.6],['JAVA',109.5,-9.6],['KALIMANTAN',112.3,2.6],['SULAWESI',119.3,1.9],['NUSA TENGGARA',118.5,-10.7],['MALUKU',129,-5.6],['PAPUA',134.6,-6.4]].forEach(l=>s+=`<text x="${X(l[1])}" y="${Y(l[2])}" text-anchor="middle" class="ax" style="font-size:10px;letter-spacing:.14em;font-weight:700">${l[0]}</text>`);
 const vm={};data.forEach(d=>vm[d.k]=d.v);const order=PV.filter(q=>vm[q.name]!=null).sort((a,b)=>vm[b.name]-vm[a.name]);
 order.forEach(q=>{const v=vm[q.name],t=v/mx;s+=`<circle cx="${X(q.lon)}" cy="${Y(q.lat)}" r="${3+Math.sqrt(Math.max(t,0))*w/(small?26:30)}" style="fill:${t>.66?'var(--gold)':'var(--mal)'};stroke:${t>.66?'var(--gold2)':'var(--mal3)'}" fill-opacity="${.3+.55*t}" stroke-width="1.2" data-tip="${tipOf(q.name,v,u)}"/>`});
 const plc=[];order.slice(0,small?3:6).forEach(q=>{const lt=q.name.replace('Jawa ','J. ')+' · '+fmtC(vm[q.name]),lx=X(q.lon),ly=Y(q.lat)-4-Math.sqrt(vm[q.name]/mx)*w/(small?26:30),lw=lt.length*(small?5.6:6.2)+6;if(plc.some(r=>Math.abs(r[0]-lx)<(r[2]+lw)/2&&Math.abs(r[1]-ly)<14)||plc.length>=(small?2:4))return;plc.push([lx,ly,lw]);s+=`<text x="${lx}" y="${ly}" text-anchor="middle" class="lb" style="font-size:${small?10:11}px;font-weight:700;paint-order:stroke;stroke:var(--bg2);stroke-width:3px">${esc(q.name.replace('Jawa ','J. '))} · ${fmtC(vm[q.name])}</text>`});
 return s+'</svg>'}

/* ---------- BI builder ---------- */
const BI={ds:'population',dim:'province',meas:'population',agg:'sum',type:'bar',filt:'latest',top:15};
const colL=(ds,n)=>n==='__count'?T('Rows','Строки'):TT(DSI[ds].cols.find(c=>c.n===n).d);
function autoTitle(sp){return (sp.meas==='__count'?T('Number of rows','Число строк'):TT(AGG[sp.agg])+' · '+colL(sp.ds,sp.meas))+' '+T('by','по')+' '+colL(sp.ds,sp.dim).toLowerCase()}
function biSet(id){const ds=DSI[id];BI.ds=id;BI.dim=ds.cols.some(c=>c.n==='province')?'province':ds.cols[0].n;const m=ds.cols.find(c=>isNum(c)&&c.n!=='year');BI.meas=m.n;BI.agg=m.avg?'avg':'sum';BI.filt=filtOpts(ds)[0][0];if(BI.type==='line')BI.type='bar';renderBi()}
const opt=(v,l,sel)=>`<option value="${esc(v)}" ${v==sel?'selected':''}>${esc(l)}</option>`;
function renderBi(){const ds=DSI[BI.ds];
 $('#biDs').innerHTML=DS.map(d=>opt(d.id,d.ico+'  '+TT(d.title),BI.ds)).join('');
 $('#biDim').innerHTML=ds.cols.filter(c=>!isNum(c)||c.n==='year').map(c=>opt(c.n,c.n+' — '+TT(c.d),BI.dim)).join('');
 $('#biMeas').innerHTML=ds.cols.filter(c=>isNum(c)&&c.n!=='year').map(c=>opt(c.n,c.n+(c.u?' ('+c.u+')':''),BI.meas)).join('')+opt('__count',T('row count','число строк'),BI.meas);
 $('#biAgg').innerHTML=Object.keys(AGG).map(k=>opt(k,TT(AGG[k]),BI.agg)).join('');$('#biAgg').disabled=BI.meas==='__count';
 $('#biFilt').innerHTML=filtOpts(ds).map(f=>opt(f[0],TT(f[1]),BI.filt)).join('');
 $('#biTop').innerHTML=[[5,'Top 5','Топ 5'],[10,'Top 10','Топ 10'],[15,'Top 15','Топ 15'],[20,'Top 20','Топ 20'],[0,'All','Все']].map(t=>opt(t[0],T(t[1],t[2]),BI.top)).join('');$('#biTop').disabled=BI.type==='pie'||BI.type==='map'||BI.dim==='year'||BI.dim==='date';
 $$('#biType button').forEach(b=>{b.classList.toggle('on',b.dataset.t===BI.type);b.disabled=b.dataset.t==='map'&&!ds.cols.some(c=>c.n==='province')});
 drawBi()}
function drawBi(){const el=$('#biChart');const w=el.clientWidth||640;const r=chart(BI,w,false);el.innerHTML=r.svg;$('#biCap').textContent=$('#biTitle').value.trim()||autoTitle(BI);$('#biInfo').textContent=r.n+' '+T('groups','групп');
 const fl=filtOpts(DSI[BI.ds]).find(f=>f[0]===BI.filt);$('#biNote').innerHTML=`${T('Source','Источник')}: <span class="mono">${BI.ds}</span> · ${T('filter','фильтр')}: ${esc(fl?TT(fl[1]):'—')} · ${fmt(r.rows)} ${T('rows aggregated','строк агрегировано')}${BI.type==='map'?' · '+T('bubble size and colour = value; grey discs = province land area','размер и цвет кружка = значение; серые диски = площадь провинции'):''} · <span class="mono">SELECT ${BI.dim}, ${BI.meas==='__count'?'count()':BI.agg+'('+BI.meas+')'} FROM ${BI.ds} GROUP BY ${BI.dim}</span>`}
$('#biDs').onchange=e=>biSet(e.target.value);
$('#biDim').onchange=e=>{BI.dim=e.target.value;if((BI.dim==='year'||BI.dim==='date')&&BI.filt!=='all'&&BI.filt!=='d30'&&BI.filt!=='d7'){BI.filt='all'}if(BI.type==='map'&&BI.dim!=='province')BI.type='bar';if((BI.dim==='year'||BI.dim==='date')&&BI.type==='pie')BI.type='line';renderBi()};
$('#biMeas').onchange=e=>{BI.meas=e.target.value;const c=DSI[BI.ds].cols.find(x=>x.n===BI.meas);if(c)BI.agg=c.avg?'avg':'sum';renderBi()};
$('#biAgg').onchange=e=>{BI.agg=e.target.value;drawBi()};
$('#biFilt').onchange=e=>{BI.filt=e.target.value;drawBi()};

const KW=new Set('SELECT FROM WHERE GROUP BY ORDER ASC DESC LIMIT OFFSET AND OR NOT AS LIKE IN BETWEEN IS NULL HAVING DISTINCT TRUE FALSE'.split(' '));
const AGGF=new Set(['COUNT','SUM','AVG','MIN','MAX','UNIQ']);
const FN={ROUND:(x,d=0)=>x==null?null:Math.round(x*10**d)/10**d,FLOOR:x=>x==null?null:Math.floor(x),CEIL:x=>x==null?null:Math.ceil(x),ABS:x=>x==null?null:Math.abs(x),UPPER:s=>s==null?null:String(s).toUpperCase(),LOWER:s=>s==null?null:String(s).toLowerCase(),LENGTH:s=>s==null?null:String(s).length,COALESCE:(...a)=>{for(const v of a)if(v!=null)return v;return null},SUBSTR:(s,a,n)=>s==null?null:String(s).substr((a||1)-1,n==null?undefined:n),IF:(c,a,b)=>truthy(c)?a:b,TOYEAR:s=>s==null?null:+String(s).slice(0,4),TOMONTH:s=>s==null?null:+String(s).slice(5,7)};
function SE(en,ru,pos){const e=new Error(en);e.ru=ru;e.pos=pos;e.sqlE=1;return e}
const truthy=v=>v!=null&&v!==0&&v!==''&&v!==false;

 if(ch==='"'||ch==='`'){const j=s.indexOf(ch,i+1);if(j<0)throw SE('Unterminated quoted identifier','Незакрытый идентификатор в кавычках',st);out.push({t:'id',v:s.slice(i+1,j),p:st,e:j+1});i=j+1;continue}
 const two=s.slice(i,i+2);if(['<=','>=','<>','!=','||'].includes(two)){out.push({t:'op',v:two,p:st,e:i+2});i+=2;continue}
 if('=<>+-*/%(),;.'.includes(ch)){out.push({t:'op',v:ch,p:st,e:i+1});i++;continue}

 const isK=v=>pk().t==='kw'&&pk().v===v,isO=v=>pk().t==='op'&&pk().v===v;const eatK=v=>isK(v)?(i++,true):false,eatO=v=>isO(v)?(i++,true):false;
 const near=()=>pk().t==='eof'?T('end of query','конца запроса'):'"'+sql.slice(pk().p,pk().p+18).split('\n')[0]+'"';
 const expK=v=>{if(!eatK(v))throw SE(`Expected ${v} near ${near()}`,`Ожидалось ${v} рядом с ${near()}`,pk().p)};const expO=v=>{if(!eatO(v))throw SE(`Expected "${v}" near ${near()}`,`Ожидалось «${v}» рядом с ${near()}`,pk().p)};

 function andE(){let a=notE();while(eatK('AND'))a={k:'bin',op:'AND',a,b:notE()};return a}
 function notE(){if(eatK('NOT'))return{k:'not',a:notE()};return cmpE()}
 function cmpE(){const a=addE(),t=pk();if(t.t==='op'&&['=','!=','<>','<','<=','>','>='].includes(t.v)){i++;return{k:'bin',op:t.v==='<>'?'!=':t.v,a,b:addE()}}
  let neg=false;if(isK('NOT')&&tk[i+1].t==='kw'&&['LIKE','IN','BETWEEN'].includes(tk[i+1].v)){i++;neg=true}
  if(eatK('LIKE'))return{k:'like',a,b:addE(),neg};
  if(eatK('IN')){expO('(');const list=[expr()];while(eatO(','))list.push(expr());expO(')');return{k:'in',a,list,neg}}

 function prim(){const t=pk();if(t.t==='num'||t.t==='str'){i++;return{k:'lit',v:t.v}}if(eatK('NULL'))return{k:'lit',v:null};if(eatK('TRUE'))return{k:'lit',v:1};if(eatK('FALSE'))return{k:'lit',v:0};
  if(eatO('(')){const e=expr();expO(')');return e}
  if(t.t==='id'){i++;if(eatO('(')){const name=t.v.toUpperCase();if(!FN[name]&&!AGGF.has(name))throw SE(`Unknown function ${t.v}()`,`Неизвестная функция ${t.v}()`,t.p);const n={k:'fn',name,args:[],agg:AGGF.has(name)};

    expO(')');if(n.agg&&!n.star&&n.args.length!==1)throw SE(`${name}() takes one argument`,`${name}() принимает один аргумент`,t.p);return n}
   if(eatO('.')){const c=nx();if(c.t!=='id')throw SE('Expected column name after "."','Ожидалось имя столбца после «.»',c.p);return{k:'col',name:c.v,p:c.p}}
   return{k:'col',name:t.v,p:t.p}}
  throw SE(`Unexpected ${t.t==='eof'?'end of query':'"'+t.v+'"'}`,`Неожиданно: ${t.t==='eof'?'конец запроса':'«'+t.v+'»'}`,t.p)}
 expK('SELECT');const q={distinct:eatK('DISTINCT'),items:[]};
 do{if(isO('*')){i++;q.items.push({star:true})}else{const e=expr();let alias=null;if(eatK('AS')){const a=nx();if(a.t!=='id'&&a.t!=='str')throw SE('Expected alias after AS','Ожидался псевдоним после AS',a.p);alias=a.v}else if(pk().t==='id')alias=nx().v;q.items.push({e,alias,name:alias||e.src})}}while(eatO(','));
 expK('FROM');const tt=nx();if(tt.t!=='id')throw SE('Expected table name after FROM','Ожидалось имя таблицы после FROM',tt.p);q.table=tt.v;q.tpos=tt.p;if(eatO('.')){const t2=nx();q.table=t2.v;q.tpos=t2.p}
 if(eatK('WHERE'))q.where=expr();
 if(eatK('GROUP')){expK('BY');q.group=[expr()];while(eatO(','))q.group.push(expr())}
 if(eatK('HAVING'))q.having=expr();
 if(eatK('ORDER')){expK('BY');q.order=[];do{const e=expr();let desc=false;if(eatK('DESC'))desc=true;else eatK('ASC');q.order.push({e,desc})}while(eatO(','))}
 if(eatK('LIMIT')){const n=nx();if(n.t!=='num')throw SE('LIMIT expects a number','LIMIT ожидает число',n.p);q.limit=n.v;if(eatO(',')){const m=nx();q.offset=q.limit;q.limit=m.v}else if(eatK('OFFSET')){const m=nx();if(m.t!=='num')throw SE('OFFSET expects a number','OFFSET ожидает число',m.p);q.offset=m.v}}
 eatO(';');if(pk().t!=='eof')throw SE(`Unexpected "${pk().v}" — only one statement is allowed`,`Неожиданно «${pk().v}» — допускается один оператор`,pk().p);return q}
function walk(n,f){if(!n)return;f(n);['a','b','lo','hi'].forEach(k=>n[k]&&walk(n[k],f));(n.list||[]).forEach(x=>walk(x,f));(n.args||[]).forEach(x=>walk(x,f))}
const hasAgg=n=>{let h=false;walk(n,x=>{if(x.k==='fn'&&x.agg)h=true});return h};
function likeRe(p){return new RegExp('^'+String(p).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/%/g,'.*').replace(/_/g,'.')+'$','i')}
function ev(n,c){switch(n.k){
 case 'lit':return n.v;
 case 'col':if(c.alias&&Object.prototype.hasOwnProperty.call(c.alias,n.name))return c.alias[n.name];{const v=c.row[n.name];return v===undefined?null:v}
 case 'neg':{const v=ev(n.a,c);return v==null?null:-v}
 case 'not':{const v=ev(n.a,c);return v==null?null:truthy(v)?0:1}
 case 'bin':{if(n.op==='AND'){const a=ev(n.a,c);if(a!=null&&!truthy(a))return 0;const b=ev(n.b,c);if(b!=null&&!truthy(b))return 0;return a==null||b==null?null:1}
  if(n.op==='OR'){const a=ev(n.a,c);if(truthy(a))return 1;const b=ev(n.b,c);if(truthy(b))return 1;return a==null||b==null?null:0}
  const a=ev(n.a,c),b=ev(n.b,c);if(a==null||b==null)return null;
  switch(n.op){case '+':return +a + +b;case '-':return a-b;case '*':return a*b;case '/':return +b===0?null:a/b;case '%':return +b===0?null:a%b;case '||':return String(a)+String(b);
   case '=':return cmp(a,b)===0?1:0;case '!=':return cmp(a,b)!==0?1:0;case '<':return cmp(a,b)<0?1:0;case '<=':return cmp(a,b)<=0?1:0;case '>':return cmp(a,b)>0?1:0;case '>=':return cmp(a,b)>=0?1:0}return null}

function execSql(sql){const t0=performance.now();const q=parse(sql);const ds=DS.find(d=>d.id.toLowerCase()===q.table.toLowerCase());

 const lc={};ds.cols.forEach(c=>lc[c.n.toLowerCase()]=c.n);const aliases=new Set(q.items.filter(x=>x.alias).map(x=>x.alias));

 if(aggMode){const groups=new Map();if(q.group){for(const r of rows){const key=JSON.stringify(q.group.map(g=>ev(g,{row:r})));let g=groups.get(key);if(!g)groups.set(key,g=[]);g.push(r)}}else groups.set('',rows);

  res.forEach(r=>r.k=keys.map(f=>f(r)));res.sort((x,y)=>{for(let j=0;j<keys.length;j++){const a=x.k[j],b=y.k[j];const d=a==null&&b==null?0:a==null?1:b==null?-1:cmp(a,b);if(d)return q.order[j].desc?-d:d}return 0})}

 return{cols:outCols.map(o=>o.name),rows:res.map(r=>r.out),ms:performance.now()-t0,scanned,matched:rows.length,table:ds.id}}

const stL={ok:['✓ Pass','✓ Норма'],warn:['! Warn','! Внимание'],bad:['✕ Fail','✕ Сбой']};
function renderDq(){renderDqKpis();
 $('#dqList').innerHTML=DS.map(ds=>{const o=dq(ds);const run=dqRunning.get(ds.id);return `<div class="dqd"><div class="dqh"><span class="dico">${ds.ico}</span><div><b>${esc(TT(ds.title))}</b><div class="mono muted" style="font-size:11.5px">${ds.id} · ${fmt(ds.rows.length)} ${T('rows','строк')}</div></div><span class="sp"></span><span class="score ${scoreCls(o.score)}">${o.score}/100</span><button class="btn sm" data-run="${ds.id}" ${run!=null?'disabled':''}>${run!=null?'<span class="spin"></span>':'▶'} ${T('Run','Запустить')}</button></div><div class="dqg">${CHK.map((c,ci)=>{const r=o[c[0]];const busy=run!=null&&ci>=run;return `<div class="chk ${busy?'run':r.st}"><div class="cl">${T(c[1],c[2])}${busy?'<span class="spin" style="margin-left:auto"></span>':`<span class="pill ${r.st}">${TT(stL[r.st])}</span>`}</div><div class="cv">${busy?'…':esc(r.val)}</div><div class="cd">${busy?T('running…','выполняется…'):esc(TT(r.det))}</div>${!busy&&r.fix?`<button class="btn" data-fix="${r.fix[0]}" data-ds="${ds.id}">${esc(T(r.fix[1],r.fix[2]))}</button>`:''}</div>`}).join('')}</div></div>`}).join('');
 $$('#dqList [data-run]').forEach(b=>b.onclick=()=>runChecks([b.dataset.run]));
 $$('#dqList [data-fix]').forEach(b=>b.onclick=()=>applyFix(b.dataset.fix));
 $('#dqHow').innerHTML=[[T('Completeness','Полнота'),T('share of non-null cells in the worst column; ≥ 98 % pass, ≥ 90 % warn','доля заполненных ячеек в худшем столбце; ≥ 98 % — норма, ≥ 90 % — внимание')],[T('Freshness','Свежесть'),T('time since last successful load vs the dataset SLA; streaming sets are fed live by the Kafka pipeline','время с последней загрузки против SLA набора; потоковые наборы обновляет конвейер Kafka')],[T('Schema drift','Дрейф схемы'),T('incoming batch schema compared with the registry (Avro / ClickHouse DDL)','схема входящей партии сравнивается с реестром (Avro / DDL ClickHouse)')],[T('Uniqueness','Уникальность'),T('duplicate business keys, e.g. replayed CDC events','повторы бизнес-ключа, например повторная доставка CDC')],[T('Validity','Корректность'),T('values outside declared physical ranges are quarantined, not published','значения вне заявленных диапазонов изолируются и не публикуются')]].map(x=>`<p style="margin:0 0 8px"><b style="color:var(--text)">${x[0]}</b> — ${x[1]}</p>`).join('')+`<p style="margin:0">${T('Fixes applied here change the live tables — check the SQL console and the catalogue scores.','Исправления здесь меняют рабочие таблицы — проверьте SQL-консоль и оценки в каталоге.')}</p>`;
 $('#dqLog').innerHTML=S.log.length?S.log.slice(0,8).map(l=>`<div><span>${new Date(l.t).toLocaleTimeString(LOC(),{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span><span style="flex:1">${esc(TT(l.m))}</span></div>`).join(''):`<span class="muted" style="font-size:13px">${T('No runs yet in this browser — press “Run all checks”.','В этом браузере ещё не было запусков — нажмите «Запустить все проверки».')}</span>`}
function logQ(en,ru){S.log.unshift({t:Date.now(),m:[en,ru]});S.log=S.log.slice(0,20);save()}
async function runChecks(ids){for(const id of ids)dqRunning.set(id,0);renderDq();
 await Promise.all(ids.map(async(id,k)=>{await new Promise(r=>setTimeout(r,k*180));for(let c=0;c<=CHK.length;c++){dqRunning.set(id,c);if(view==='dq')renderDq();await new Promise(r=>setTimeout(r,170+Math.random()*160))}dqRunning.delete(id)}));
 S.q.last=Date.now();const all=DS.filter(d=>ids.includes(d.id)).map(dq);const cnt={ok:0,warn:0,bad:0};all.forEach(o=>CHK.forEach(c=>cnt[o[c[0]].st]++));
 logQ(`${ids.length>1?'All datasets':ids[0]}: ${cnt.ok} pass · ${cnt.warn} warn · ${cnt.bad} fail`,`${ids.length>1?'Все наборы':ids[0]}: ${cnt.ok} норма · ${cnt.warn} внимание · ${cnt.bad} сбой`);if(view==='dq')renderDq();toast(T(`Checks finished: ${cnt.ok} pass, ${cnt.warn} warn, ${cnt.bad} fail`,`Проверки завершены: ${cnt.ok} норма, ${cnt.warn} внимание, ${cnt.bad} сбой`),cnt.bad?'bad':'')}
$('#dqRun').onclick=()=>runChecks(DS.map(d=>d.id));
function applyFix(k){const M={dedupe:['Removed 2 duplicate rows from school_enrolment','Удалены 2 строки-дубля из school_enrolment'],impute:['Imputed missing pm10 values from adjacent days per station','Пропуски pm10 заполнены по соседним дням станции'],quar:['Quarantined pm25 = 999.9 reading (MDN-BLW) to the DLQ','Показание pm25 = 999.9 (MDN-BLW) изолировано в DLQ'],accept:['Schema registry: air_quality v4 (no2 → Float32)','Реестр схем: air_quality v4 (no2 → Float32)'],waive:['Completeness exception recorded for regional_budget','Исключение по полноте записано для regional_budget'],sync:['regional_budget re-synced from SIPD','regional_budget синхронизирован с SIPD'],resume:['Pipeline resumed','Конвейер возобновлён']};
 if(k==='resume'){ST.paused=false}else{S.q[k]=k==='sync'?Date.now():1;FIX[k]()}save();logQ(...M[k]);toast(TT(M[k]),'gold');lastRes=null;renderDq()}

/* ---------- tooltips, routing, boot ---------- */
const tip=$('#tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.classList.remove('on');return}tip.innerHTML=t.getAttribute('data-tip');tip.classList.add('on');const w=tip.offsetWidth;tip.style.left=Math.min(innerWidth-w-8,e.clientX+14)+'px';tip.style.top=(e.clientY+16)+'px'});
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t&&matchMedia('(hover: none)').matches){tip.innerHTML=t.getAttribute('data-tip');tip.classList.add('on');const r=t.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(innerWidth-tip.offsetWidth-8,r.left))+'px';tip.style.top=(r.top-40)+'px';setTimeout(()=>tip.classList.remove('on'),1800)}});
function fromHash(){const h=(location.hash||'').slice(1).split('/');const v=['cat','bi','sql','stream','dq'].includes(h[0])?h[0]:'cat';if(v==='cat'&&h[1]&&DSI[h[1]])openDs=h[1];setView(v,true)}
let rz,lastW=innerWidth;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(innerWidth===lastW&&view!=='stream')return;lastW=innerWidth;if(view==='stream')buildPipe();renderView()},160)});
try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>renderView())}catch(e){}
PT.onLang(()=>{if(view==='stream')buildPipe();renderView()});
setInterval(stTick,500);for(let i=0;i<120;i++){const b=6200*(1+.12*Math.sin(i/7))*(.94+Math.random()*.12);ST.hist.push({i:b,o:b*.99,l:0})}
setInterval(()=>{if(view==='cat'&&!openDs)catKpis();if(view==='dq'&&!dqRunning.size)renderDq()},15000);
fromHash();runSql();
})();
</script>
