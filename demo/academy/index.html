function confetti(){const scr=$('#scr'),c=document.createElement('canvas');c.className='conf';c.width=scr.clientWidth*2;c.height=scr.clientHeight*2;scr.appendChild(c);const x=c.getContext('2d'),cols=[cv('--gold'),cv('--mal3'),cv('--gold2'),cv('--violet'),cv('--blue')];
  const ps=Array.from({length:140},()=>({x:c.width/2,y:c.height*.4,vx:(Math.random()-.5)*22,vy:-Math.random()*24-6,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*5)],a:Math.random()*6}));let f=0;
  (function fr(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.7;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++f<110)requestAnimationFrame(fr);else c.remove()})()}
function certFor(c){if(S.certs.find(x=>x.id===c.id))return;const code='OA-'+c.id.toUpperCase().slice(0,4)+'-'+Math.abs([...c.id+S.xp].reduce((a,ch)=>a*31+ch.charCodeAt(0)|0,7)).toString(36).toUpperCase().slice(0,5);S.certs.push({id:c.id,code,date:today()});S.hm[S.as][c.skill]=Math.min(100,S.hm[S.as][c.skill]+3);(S.fn[c.id]||[])[4]++;checkBadges();save();setTimeout(()=>showCert(S.certs.length-1),1300)}
function qrSVG(code){const n=25,R=rng([...code].reduce((a,c)=>a*33+c.charCodeAt(0)|0,5)),cell=4;let s=`<svg width="${n*cell}" height="${n*cell}" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/>`;const fin=(x,y)=>x<7&&y<7||x>=n-7&&y<7||x<7&&y>=n-7;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(fin(x,y))continue;if(R()<.48)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#0b1512"/>`}
  [[0,0],[n-7,0],[0,n-7]].forEach(([x,y])=>s+=`<rect x="${x}" y="${y}" width="7" height="7" fill="#0b1512"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#0b1512"/>`);return s+'</svg>'}

function renderCons(){const tot=heads(),act=Math.round(tot*.78)+S.certs.length,f=Object.values(S.fn),comp=f.reduce((a,x)=>a+x[4],0)/f.reduce((a,x)=>a+x[0],0)*100;
  $('#cons').innerHTML=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap"><div><div class="xs" style="color:var(--dim)">${T('L&D manager console','Консоль менеджера L&D')} · Nordania Telecom</div><h2 style="margin:2px 0 0;font-size:21px">${T('Learning operations','Управление обучением')}</h2></div><span style="flex:1"></span><span class="pill ok">● ${fmt(Math.round(act*.21))} ${T('learning now','учатся сейчас')}</span></div>
  <div class="kpis"><div class="card kpi"><div class="l">${T('Active learners','Активные')}</div><div class="v">${fmt(act)}</div><div class="xs" style="color:var(--muted)">${T('of','из')} ${fmt(tot)}</div></div><div class="card kpi"><div class="l">${T('Completion rate','Завершают')}</div><div class="v" style="color:var(--mal3)">${comp.toFixed(1)}%</div></div><div class="card kpi"><div class="l">${T('Avg XP / week','Средний XP / нед.')}</div><div class="v">${fmt(S.emp.reduce((a,e)=>a+e.w,S.wxp)/(S.emp.length+1))}</div></div><div class="card kpi"><div class="l">${T('Courses live','Курсов')}</div><div class="v" style="color:var(--gold2)">${S.courses.length}</div></div></div>
  <div class="ctabs">${CT.map(t=>`<button class="${S.ctab===t[0]?'on':''}" data-act="ctab" data-t="${t[0]}">${T(t[1],t[2])}</button>`).join('')}</div><div id="cbody">${C[S.ctab]()}</div>`}
function renderAll(){renderPhone();renderCons();if(SH)drawSheet();save()}

/* ---------- actions ---------- */
const A={
  tab:el=>{S.tab=el.dataset.t;renderPhone();$('#pbody').scrollTop=0},
  node:el=>{const id=el.dataset.id,cn=currentNode();if(id!==cn&&!S.done[id]){ptoast('🔒 '+T('Finish the previous step first','Сначала пройдите предыдущий шаг'));return}openNode(id)},
  daily:()=>{if(S.dailyDone===today()){ptoast('✓ '+T('Already done today','Уже выполнено сегодня'));return}const pool=S.courses.flatMap(c=>c.nodes.filter(n=>n.k==='quiz').flatMap(n=>n.qs)),R=rng(+today().replace(/-/g,''));const qs=pool.slice().sort(()=>R()-.5).slice(0,3);SH={k:'quiz',daily:1,qs,i:0,ok:0,t:30};drawSheet()},
  close:closeSheet,
  lnext:()=>{SH.i++;drawSheet()},lprev:()=>{SH.i=Math.max(0,SH.i-1);drawSheet()},
  lessondone:()=>{S.done[SH.id]=1;const c=SH.c;gain(40,15);if(courseDone(c))certFor(c);closeSheet();ptoast('✓ +40 XP · +15 🪙')},
  ans:el=>answer(+el.dataset.j),
  quizdone:()=>{const r=SH.res;if(SH.daily){S.dailyDone=today();award('daily')}else if(r.pass){S.done[SH.id]=1;if(courseDone(SH.c))certFor(SH.c)}if(r.perfect)award('ace');const c=SH.c;gain(r.xp,r.co);closeSheet();renderCons()},
  closelv:()=>{const e=$('#lvup');if(e)e.remove()},
  lbm:el=>{S.lbm=el.dataset.m;renderPhone()},
  buy:el=>{const it=SHOP.find(x=>x.id===el.dataset.id);if(S.coins<it.c)return;S.coins-=it.c;const code=it.id.toUpperCase().slice(0,3)+'-'+Math.random().toString(36).slice(2,8).toUpperCase();S.bought.unshift({id:it.id,code});checkBadges();save();renderPhone();ptoast(`${it.e} ${T('Redeemed! Code','Получено! Код')}: <span class="mono">${code}</span>`)},
  badge:el=>{const b=BADGES.find(x=>x.id===el.dataset.id);ptoast(`${b.e} <b>${L2(b.t)}</b> — ${L2(b.d)} ${S.badges.includes(b.id)?'✓':'🔒'}`)},
  cert:el=>showCert(+el.dataset.i),
  sharecert:el=>{const c=S.certs[+el.dataset.i];const t='https://academy.nordania-telecom.example/v/'+c.code;try{navigator.clipboard.writeText(t)}catch(e){}ptoast('↗ '+T('Verification link copied','Ссылка для проверки скопирована'))},
  verify:async el=>{const c=S.certs[+el.dataset.i];el.disabled=true;el.textContent='…';await new Promise(r=>setTimeout(r,700));el.disabled=false;el.textContent='✓ '+T('Valid','Действителен');ptoast('✅ '+c.code+' — '+T('valid, issued to Ari Lindqvist','действителен, выдан Ari Lindqvist'))},
  ctab:el=>{S.ctab=el.dataset.t;renderCons()},
  ddept:el=>{const d=S.draft,k=el.dataset.k;d.depts=d.depts.includes(k)?d.depts.filter(x=>x!==k):[...d.depts,k];renderCons()},
  addcard:()=>{const h=$('#bh').value.trim(),b=$('#bbody').value.trim();if(!h||!b){toast(T('Fill heading and text','Заполните заголовок и текст'));return}S.draft.cards.push({h,b});renderCons()},
  rmcard:el=>{S.draft.cards.splice(+el.dataset.i,1);renderCons()},
  addq:()=>{const q=$('#qq').value.trim(),o=[0,1,2].map(j=>$('#qo'+j).value.trim());if(!q||o.some(x=>!x)){toast(T('Fill the question and all 3 options','Заполните вопрос и 3 варианта'));return}const a=+(document.querySelector('input[name=qa]:checked')||{value:0}).value;S.draft.qs.push({q,o,a});renderCons()},
  rmq:el=>{S.draft.qs.splice(+el.dataset.i,1);renderCons()},
  pubcourse:async()=>{const d=S.draft;if(!d.t.trim()||!d.cards.length||!d.qs.length||!d.depts.length){toast(T('Need a title, ≥1 card, ≥1 question and a department','Нужны название, ≥1 карточка, ≥1 вопрос и отдел'));return}const b=$('#pubc');b.disabled=true;b.textContent='⏳ '+T('Publishing…','Публикация…');await new Promise(r=>setTimeout(r,800));
    const id='c'+nextId(),both=s=>[s,s];const c={id,icon:d.icon,skill:d.skill,t:both(d.t),depts:d.depts.slice(),isNew:true,nodes:[{k:'lesson',t:both(T('Lesson','Урок')+': '+d.t),cards:d.cards.map(x=>({e:'💡',h:both(x.h),b:both(x.b)}))},{k:'quiz',t:both(T('Quiz','Квиз')),qs:d.qs.map(x=>({q:both(x.q),o:x.o.map(both),a:x.a}))}]};
    S.courses.forEach(x=>delete x.isNew);S.courses.push(c);const n=d.depts.reduce((a,k)=>a+DEPTS[k][2],0);S.fn[id]=[n,Math.round(n*.12),Math.round(n*.05),Math.round(n*.03),0];S.fsel=id;
    if(!d.depts.includes(S.as))S.as=d.depts[0];S.tab='learn';renderAll();setTimeout(()=>{const p=$('#pbody');p.scrollTop=p.scrollHeight},80);ptoast('🔔 '+T('New course assigned','Назначен новый курс')+': <b>'+esc(d.t)+'</b>');toast(T(`Published · pushed to ${fmt(n)} employees`,`Опубликовано · уведомление ${fmt(n)} сотрудникам`),'gold')},
  nudge:()=>{const c=S.fsel,f=S.fn[c];if(f){f[1]=Math.min(f[0],Math.round(f[1]*1.06));f[2]=Math.min(f[1],Math.round(f[2]*1.08));f[3]=Math.min(f[2],Math.round(f[3]*1.07))}renderCons();ptoast('🔔 '+T('Reminder: finish your course this week for double XP!','Напоминание: закончите курс на этой неделе — двойной XP!'));toast(T('Nudge sent · funnel improving','Напоминание отправлено · воронка растёт'))},
  hm:el=>{const d=el.dataset.d,j=+el.dataset.j,c=S.courses.find(x=>x.skill===j);if(!c){toast(T('No course for this skill yet — build one in Course builder','Курса по навыку пока нет — создайте в конструкторе'));S.draft.skill=j;S.draft.depts=[d];S.ctab='build';renderCons();return}if(!c.depts.includes('all')&&!c.depts.includes(d))c.depts.push(d);toast(T(`“${L2(c.t)}” assigned to ${L2(DEPTS[d])}`,`«${L2(c.t)}» назначен отделу ${L2(DEPTS[d])}`),'gold');renderAll()},
  csv:el=>{const k=el.dataset.k;let rows;if(k==='emp')rows=[['employee','department','xp_total','xp_week','level'],['Ari Lindqvist',DEPTS[S.as][0],S.xp,S.wxp,lvl(S.xp)],...S.emp.map(e=>[e.n,DEPTS[e.d][0],e.xp,e.w,lvl(e.xp)])];
    else if(k==='fn')rows=[['course','assigned','started','lessons_done','quiz_passed','certified'],...S.courses.map(c=>[c.t[0],...(S.fn[c.id]||[0,0,0,0,0])])];else rows=[['department',...SKILLS.map(s=>s[0])],...Object.keys(DEPTS).map(d=>[DEPTS[d][0],...S.hm[d]])];
    const txt=rows.map(r=>r.map(v=>/[",]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download='orbit-'+k+'-'+today()+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),300);toast('⇩ '+a.download)},
  reset:()=>{try{localStorage.removeItem('orbit-v1')}catch(e){}S=seed();SH=null;$('#overlay').innerHTML='';renderAll()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f)f(el,e)});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.in==='dt'){S.draft.t=el.value;save()}});
document.addEventListener('change',e=>{const el=e.target,k=el.dataset.in;if(!k)return;
  if(k==='di')S.draft.icon=el.value;else if(k==='ds')S.draft.skill=+el.value;else if(k==='as'){S.as=el.value;renderAll();return}else if(k==='fsel')S.fsel=el.value;
  else if(k==='asg'){const c=S.courses[+el.dataset.c],d=el.dataset.k;if(d==='all')c.depts=el.checked?['all']:Object.keys(DEPTS);else c.depts=el.checked?[...c.depts,d]:c.depts.filter(x=>x!==d);if(!c.depts.length)c.depts=[d];renderAll();toast(T('Assignment updated · app refreshed','Назначение обновлено · приложение обновлено'));return}
  renderCons()});
/* live battle + clock */
setInterval(()=>{const b=S.battle;b.a+=Math.floor(Math.random()*14);b.b+=Math.floor(Math.random()*15);if(S.tab==='battle'&&!SH){const tot=Math.max(b.a,b.b)*1.15;const s=(id,v)=>{const e=$(id);if(e)e.textContent=fmt(v)};s('#ba',b.a);s('#bb',b.b);const ai=$('#bai'),bi=$('#bbi');if(ai){ai.style.width=b.a/tot*100+'%';bi.style.width=b.b/tot*100+'%'}const lv=$('#live');if(lv)lv.style.opacity=lv.style.opacity==='0.3'?'1':'0.3'}},1500);
setInterval(()=>{const d=new Date();$('#clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')},10000);
PT.onLang(()=>renderAll());
document.addEventListener('DOMContentLoaded',()=>{renderAll();const d=new Date();$('#clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')});
</script>
