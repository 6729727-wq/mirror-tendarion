<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit Bank & Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/pt.css">
<script src="../../assets/demo.js"></script>
<style>
.wrap{max-width:1320px;margin:0 auto;padding:18px 20px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.top h1{margin:0;font-size:22px;display:flex;align-items:center;gap:10px}
.top h1 b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold) 55%,#7a5a1c);color:#1a1306;font-size:16px;box-shadow:0 0 0 3px color-mix(in srgb,var(--mal) 45%,transparent)}
.top .sp{flex:1}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;max-width:100%}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.seg.full{display:flex;width:100%}.seg.full button{flex:1;padding:7px 6px}
.brief{display:none;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.brief.on{display:flex}
.brief .sp{flex:1}
.stack{font-family:var(--mono);font-size:11.5px;color:var(--muted);border:1px dashed var(--line2);border-radius:999px;padding:3px 10px}
.view{display:none}.view.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.sm{font-size:12px}.c{text-align:center}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lnk{border:0;background:none;color:var(--mal3);cursor:pointer;font-weight:600;font-size:12px;padding:0}
.pos{color:var(--mal3)} .neg{color:var(--text)} .red{color:var(--red)}
.fresh{animation:fl 1.8s}
@keyframes fl{0%{background:color-mix(in srgb,var(--gold) 30%,transparent)}100%{background:transparent}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--gold);animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.prog{height:6px;border-radius:99px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--mal),var(--mal3));border-radius:99px;transition:width .6s}
.prog.g i{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chips.sc{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.sc::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap}
.chip.on,.chip:hover{border-color:var(--gold);color:var(--gold2)}
.f{margin-bottom:10px}.f label{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.input.big{font-size:20px;font-weight:700}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.wbtn{width:100%;justify-content:center;margin-top:8px}
.toasts{position:fixed;right:16px;top:60px;z-index:6000;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mal);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;max-width:330px;animation:pop .2s}
.toast.bad{border-left-color:var(--red)}.toast.gold{border-left-color:var(--gold)}
.sw{position:relative;width:40px;height:22px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line2);transition:.2s;cursor:pointer}
.sw i:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--mal)} .sw input:checked+i:after{transform:translateX(18px)}
.sw.frz input:checked+i{background:var(--blue)}
/* ---------- BANK ---------- */
.flow{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.mtabs{display:none;margin-bottom:12px}
.kpis4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}.kpi .v{font-size:clamp(16px,1.35vw,20px);font-weight:800;font-variant-numeric:tabular-nums;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:11.5px;color:var(--dim)}
.igrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.donutw{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donutw svg{width:170px;height:170px;flex:none;margin:0 auto}
.donutw svg circle.sg{cursor:pointer;transition:stroke-width .15s}
.donutw svg circle.sg:hover,.donutw svg circle.sg.hl{stroke-width:24}
.legend{flex:1;min-width:230px;font-size:12.5px}
.legend .lr{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;cursor:pointer}
.legend .lr:hover,.legend .lr.hl{background:var(--panel2)}
.legend .lr i{width:10px;height:10px;border-radius:3px;flex:none}
.legend .lr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .lr b{font-variant-numeric:tabular-nums}
.legend .lr em{font-style:normal;color:var(--dim);width:34px;text-align:right}
svg text{font-family:var(--font)}
#bars{width:100%;height:auto;display:block}
#bars rect{transition:opacity .15s}#bars rect:hover{opacity:.75}
pre.xml{font-family:var(--mono);font-size:11px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:340px;margin:0;line-height:1.55}
.xt{color:var(--mal3)} .xv{color:var(--gold2)}
.evl .e{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:flex-start}
.evl .e:last-child{border-bottom:0}
.evl .e .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--panel2);flex:none;font-size:13px}
.evl .e .sp{flex:1;min-width:0}
.evl{max-height:340px;overflow:auto}
.phone{border-radius:44px;padding:12px;background:linear-gradient(160deg,#2a3b35,#0b1512);box-shadow:var(--shadow),inset 0 0 0 2px #3a4f47;position:sticky;top:64px}
.scr{border-radius:34px;overflow:hidden;background:var(--bg);height:720px;display:flex;flex-direction:column;position:relative}
.notch{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;font-weight:700;flex:none}
.notch i{width:90px;height:22px;background:#000;border-radius:14px;display:block}
.ws{flex:1;overflow:auto;padding:6px 16px 16px;display:flex;flex-direction:column;min-height:0}
.ws>*{flex-shrink:0}
.bnav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding:6px 4px 12px;flex:none}
.bnav.hide{display:none}
.bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:600;color:var(--dim);cursor:pointer;padding:4px 0}
.bnav button i{font-style:normal;font-size:18px;line-height:1.2}
.bnav button.on{color:var(--gold2)}
.hrow{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.hrow .sp{flex:1;min-width:0}
.avs{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--mal),var(--mal2));display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px;flex:none}
.ib{width:36px;height:36px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-size:15px;display:grid;place-items:center;flex:none}
.bal{border-radius:20px;padding:18px;color:#fff;background:radial-gradient(120% 120% at 0 0,#1fc795 0,#0d6e52 55%,#0a3e30 100%);position:relative;overflow:hidden}
.bal:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(243,215,154,.55),transparent 70%)}
.bal .l{font-size:12px;opacity:.85}
.bal .v{font-size:27px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bal .c{font-size:11.5px;opacity:.85;margin-top:8px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 6px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;font-size:11px;font-weight:600;color:var(--muted)}
.act span{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);font-size:19px;color:var(--text);transition:.15s}
.act:hover span{border-color:var(--gold)}
.act.big span{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1306;border:0}
.sec{display:flex;align-items:center;font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
.sec .sp{flex:1}
.acc{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;font-size:13.5px}
.acc .ic{font-size:18px}.acc .sp{flex:1;min-width:0}.acc .a{font-variant-numeric:tabular-nums;white-space:nowrap}
.hist{font-size:13px}
.hist .r{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);border-radius:6px}
.hist .r:last-child{border-bottom:0}
.hist .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);flex:none;font-size:14px}
.hist .r .sp{flex:1;min-width:0}
.hist .r .sp div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.hday{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--dim);margin:12px 0 2px;text-transform:uppercase;letter-spacing:.05em}
.back{border:0;background:none;color:var(--muted);cursor:pointer;font-weight:600;padding:4px 0;text-align:left;font-size:13px;align-self:flex-start}
.wtitle{font-size:20px;font-weight:800;margin:6px 0 12px}
.lock{display:flex;flex-direction:column;align-items:center;text-align:center;flex:1;padding-top:26px}
.lklogo{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold) 55%,#7a5a1c);display:grid;place-items:center;font-weight:800;font-size:28px;color:#1a1306;box-shadow:0 0 0 5px color-mix(in srgb,var(--mal) 40%,transparent),0 0 40px color-mix(in srgb,var(--mal) 40%,transparent)}
.face{width:118px;height:118px;margin:26px auto 16px;position:relative}
.face svg{width:100%;height:100%;stroke:var(--mal3);transition:stroke .2s}
.face .sl{position:absolute;left:8%;right:8%;height:3px;border-radius:3px;background:var(--mal3);box-shadow:0 0 14px var(--mal3);top:12%;opacity:0}
.face.scan .sl{opacity:1;animation:scan2 1s ease-in-out infinite}
@keyframes scan2{0%,100%{top:12%}50%{top:85%}}
.face.ok svg{stroke:var(--mal)} .face.ok .ff{stroke-dasharray:0}
.face.ok:after{content:"✓";position:absolute;right:-8px;bottom:-8px;width:36px;height:36px;border-radius:50%;background:var(--mal);color:#fff;display:grid;place-items:center;font-weight:800;animation:pop .3s}
.face.bad{animation:sh .35s}.face.bad svg{stroke:var(--red)}
.face.sm{width:70px;height:70px;margin:10px auto}
.pins{display:flex;gap:14px;justify-content:center;margin:18px 0}
.pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);transition:.15s}
.pins i.f{background:var(--gold);border-color:var(--gold)}
.pins.shake{animation:sh .35s}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto;width:100%}
.pad button{border:0;background:var(--panel2);border-radius:14px;padding:13px 0;font-size:20px;font-weight:700;cursor:pointer}
.pad button:active{background:var(--line2)}
.ccard{aspect-ratio:1.586;border-radius:18px;padding:16px 18px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#17b58a,#0b5d46 45%,#0a2a22);display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.3);margin:4px 0 12px;transition:filter .3s}
.ccard:before{content:"";position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;border:24px solid rgba(243,215,154,.18)}
.ccard.cc{background:linear-gradient(135deg,#5b4a22,#1d170b 50%,#3a2f17);color:#f3d79a}
.ccard .ct{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.12em}
.ccard .chipi{width:40px;height:30px;border-radius:7px;background:linear-gradient(135deg,#f3d79a,#b08a3e);margin:14px 0 auto}
.ccard .cn{font-size:16px;letter-spacing:.08em;margin-bottom:6px}
.ccard .cb{display:flex;justify-content:space-between;font-size:11.5px;opacity:.9;letter-spacing:.06em}
.ccard.frz{filter:saturate(.25) brightness(.85)}
.ccard .frzl{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;background:repeating-linear-gradient(135deg,rgba(160,210,255,.22) 0 10px,rgba(160,210,255,.08) 10px 20px);backdrop-filter:blur(2px);animation:pop .3s;letter-spacing:.04em}
.trow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.trow .sp{flex:1;min-width:0}
.lim{padding:6px 0}.lim .ll{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:2px;gap:8px}
.lim input{width:100%;accent-color:var(--mal)}
.cres{margin-top:10px;border-radius:12px;padding:10px 12px;font-size:13px;border:1px solid var(--line2);animation:pop .2s}
.cres.ok{border-color:var(--mal);background:color-mix(in srgb,var(--mal) 12%,transparent)}
.cres.no{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.nm{font-size:12.5px;margin:-4px 0 10px;min-height:18px}
.vf{aspect-ratio:1;border-radius:22px;background:radial-gradient(circle at 50% 40%,#1b2a25,#000);position:relative;overflow:hidden;display:grid;place-items:center;margin-bottom:12px}
.vf:before{content:"";position:absolute;inset:18%;border:3px solid var(--gold);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.45)}
.vf .ln{position:absolute;left:18%;right:18%;height:2px;background:var(--mal3);box-shadow:0 0 12px var(--mal3);animation:scan 1.8s ease-in-out infinite}
@keyframes scan{0%,100%{top:20%}50%{top:78%}}
.vf .tx{position:relative;color:#fff;font-size:12px;text-align:center;padding:0 26%;opacity:.85}
.merch{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;animation:pop .25s}
.merch .mi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--panel2);flex:none}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.bgrid button{border:1px solid var(--line2);background:var(--panel2);border-radius:14px;padding:10px 4px;cursor:pointer;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted)}
.bgrid button b{font-size:20px;font-weight:400}
.bgrid button.on{border-color:var(--gold);color:var(--gold2)}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:13px}
.sum .row{display:flex;justify-content:space-between;padding:5px 0;gap:10px}
.sum .row span:first-child{color:var(--muted);flex:none}
.sum .row span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.sum .row.t{border-top:1px solid var(--line);margin-top:4px;padding-top:9px;font-weight:800}
.okmark{width:86px;height:86px;margin:20px auto 8px;border-radius:50%;background:var(--mal);display:grid;place-items:center;animation:pop .4s cubic-bezier(.2,1.6,.4,1);flex:none}
.okmark svg{width:46px;stroke:#fff;stroke-width:4;fill:none;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .5s .25s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.ramt{font-size:28px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.goal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.goal .gh{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13.5px}
.goal .ge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);font-size:20px;flex:none}
.goal .gh .sp{flex:1;min-width:0}
.goal .chips{margin:8px 0 0}
.goal.done{border-color:color-mix(in srgb,var(--gold) 60%,transparent)}
.gsum{display:flex;gap:10px;margin-bottom:12px}
.gsum div{flex:1;background:var(--panel2);border-radius:14px;padding:10px 12px}
.gsum b{display:block;font-variant-numeric:tabular-nums;font-size:15px}
.bioov{text-align:center;font-size:13px;color:var(--muted);min-height:0}
/* ---------- ACADEMY ---------- */
.prof{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.av{width:54px;height:54px;border-radius:17px;background:linear-gradient(135deg,var(--mal),var(--mal2));display:grid;place-items:center;font-weight:800;color:#fff;font-size:18px;flex:none}
.pinfo{min-width:150px}
.lvbox{flex:1;min-width:230px;display:flex;align-items:center;gap:12px}
.lvb{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:19px;color:#1a1306;background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold));flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 30%,transparent)}
.lvb.pulse{animation:pulse 1s 2}
@keyframes pulse{50%{transform:scale(1.18);box-shadow:0 0 0 10px color-mix(in srgb,var(--gold) 0%,transparent)}}
.lvbox .sp{flex:1;min-width:0}
.xpbar{height:10px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;margin:5px 0 3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mal),var(--gold));width:0;transition:width .9s cubic-bezier(.2,.8,.2,1);border-radius:99px}
.stat{display:flex;flex-direction:column;min-width:76px}
.stat span{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.stat b{font-size:21px;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.agrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start;margin-top:14px}
.atabs{margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.atabs::-webkit-scrollbar{display:none}
.apane{display:none}.apane.on{display:block;animation:fade .2s}
.cgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.course{display:flex;flex-direction:column;gap:10px;transition:.15s}
.course:hover{border-color:var(--line2)}
.course .ch{display:flex;gap:12px;align-items:flex-start}
.course .ci{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--panel2);flex:none}
.course .ch .sp{flex:1;min-width:0}
.course b.t{font-size:15px;display:block}
.course .meta{font-size:12px;color:var(--muted)}
.course .cf{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.course .cf .sp{flex:1}
.player .steps{display:flex;gap:6px;margin:10px 0 18px}
.player .steps i{flex:1;height:5px;border-radius:9px;background:var(--line2)}

function histFilter(){const q=UI.hq.trim().toLowerCase();return B.tx.filter(t=>(UI.hc==='all'||t.cat===UI.hc)&&(!q||(t.en+' '+t.ru+' '+CATS[t.cat].en+' '+CATS[t.cat].ru+' '+Math.abs(t.amt)).toLowerCase().includes(q.replace(/\./g,''))))}
function histList(){const list=histFilter();if(!list.length)return `<div class="c muted" style="padding:40px 0">🔍 ${T('Nothing found','Ничего не найдено')}</div>`;
  const today=dayKey(Date.now());let out='',cur=null;const sums={};list.forEach(t=>{const k=dayKey(t.ts);sums[k]=(sums[k]||0)+(t.amt<0&&t.cat!=='save'?-t.amt:0)});
  list.forEach(t=>{const k=dayKey(t.ts);if(k!==cur){cur=k;out+=`<div class="hday"><span>${k===today?T('Today','Сегодня'):k===today-DAY?T('Yesterday','Вчера'):fDate(k)}</span><span>${sums[k]?'−'+(UI.hide?'••••':idr(sums[k])):''}</span></div>`}out+=txRow(t)});
  const out2=list.filter(t=>t.amt<0&&t.cat!=='save').reduce((a,t)=>a-t.amt,0);
  return `<div class="sm muted" style="margin-top:4px">${list.length} ${T('transactions','операций')} · ${T('spent','расходы')} <b style="color:var(--text)">${UI.hide?'••••':idr(out2)}</b></div><div class="hist">${out}</div>`}

function sGoals(){const tot=B.goals.reduce((a,g)=>a+g.saved,0);
  return `<div class="wtitle">${T('Savings goals','Цели накоплений')}</div>
  <div class="gsum"><div><span class="sm muted">${T('In goals','В целях')}</span><b>${money(tot)}</b></div><div><span class="sm muted">${T('Available in Saver','Доступно в Saver')}</span><b>${money(B.accts.sav.bal)}</b></div></div>

function spendBy(){const from=Date.now()-30*DAY,s={};SPEND.forEach(c=>s[c]=0);let inc=0;B.tx.forEach(t=>{if(t.ts<from)return;if(t.amt<0&&s[t.cat]!=null)s[t.cat]-=t.amt;if(t.amt>0)inc+=t.amt});return{s,inc}}
function renderKpis(){const {s,inc}=spendBy(),tot=Object.values(s).reduce((a,b)=>a+b,0),gs=B.goals.reduce((a,g)=>a+g.saved,0),gt=B.goals.reduce((a,g)=>a+g.target,0);
  const k=(l,v,d)=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
  $('#bk').innerHTML=k(T('Total balance','Баланс'),idr(B.accts.cur.bal+B.accts.sav.bal),T('2 accounts','2 счёта'))+k(T('Spent · 30 days','Расходы · 30 дн.'),idr(tot),`${B.tx.filter(t=>t.amt<0&&t.ts>Date.now()-30*DAY).length} ${T('payments','платежей')}`)+k(T('Income · 30 days','Доход · 30 дн.'),idr(inc),T('salary + transfers','зарплата + переводы'))+k(T('Saved in goals','Накоплено в целях'),Math.round(gs/gt*100)+'%',idr(gs)+' / '+short(gt))}
function renderDonut(){const {s}=spendBy(),tot=Object.values(s).reduce((a,b)=>a+b,0)||1,R=62,C=2*Math.PI*R;let acc=0;
  const cats=SPEND.filter(c=>s[c]>0).sort((a,b)=>s[b]-s[a]);
  let svg=`<circle cx="85" cy="85" r="${R}" fill="none" style="stroke:var(--bg2)" stroke-width="18"/>`;
  cats.forEach(c=>{const len=s[c]/tot*C;svg+=`<circle class="sg ${UI.hl===c?'hl':''}" data-c="${c}" cx="85" cy="85" r="${R}" fill="none" stroke-width="18" style="stroke:var(${CATS[c].c})" stroke-dasharray="${Math.max(0,len-1.5)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 85 85)"><title>${L(CATS[c])}: ${idr(s[c])}</title></circle>`;acc+=len});
  const hc=UI.hl&&s[UI.hl]!=null?UI.hl:null;
  svg+=`<text x="85" y="78" text-anchor="middle" style="fill:var(--muted)" font-size="10" font-weight="600">${hc?L(CATS[hc]).toUpperCase().slice(0,16):T('SPENT','ПОТРАЧЕНО')}</text><text x="85" y="96" text-anchor="middle" style="fill:var(--text)" font-size="14.5" font-weight="800">${idr(hc?s[hc]:tot).replace('Rp ','Rp ')}</text><text x="85" y="111" text-anchor="middle" style="fill:var(--dim)" font-size="9.5">${hc?Math.round(s[hc]/tot*100)+'%':cats.length+' '+T('categories','категорий')}</text>`;
  $('#donut').innerHTML=svg;
  $('#legend').innerHTML=cats.map(c=>`<div class="lr ${UI.hl===c?'hl':''}" data-c="${c}"><i style="background:var(${CATS[c].c})"></i><span>${CATS[c].ic} ${L(CATS[c])}</span><b>${idr(s[c])}</b><em>${Math.round(s[c]/tot*100)}%</em></div>`).join('')}
function renderBars(){const days=30,now=dayKey(Date.now()),v=Array(days).fill(0);B.tx.forEach(t=>{if(t.amt>=0||t.cat==='save')return;const i=Math.round((now-dayKey(t.ts))/DAY);if(i>=0&&i<days)v[days-1-i]-=t.amt});
  const max=Math.max(...v,1),W=600,H=170,pl=4,pb=22,bw=(W-pl*2)/days;let svg='';
  [0.5,1].forEach(f=>{const y=(H-pb)-(H-pb-14)*f;svg+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-dasharray="3 4"/><text x="${W}" y="${y-3}" text-anchor="end" font-size="10" style="fill:var(--dim)">${short(Math.round(max*f/1000)*1000)}</text>`});
  v.forEach((x,i)=>{const h=x?Math.max(3,(H-pb-14)*x/max):0,X=pl+i*bw+bw*.18,d=new Date(now-(days-1-i)*DAY);
    svg+=`<rect x="${X}" y="${H-pb-h}" width="${bw*.64}" height="${h}" rx="3" style="fill:var(${i===days-1?'--gold':'--mal'})"><title>${fDate(d)}: ${idr(x)}</title></rect>`;
    if(i%5===4||i===days-1)svg+=`<text x="${X+bw*.32}" y="${H-6}" text-anchor="middle" font-size="10" style="fill:var(--dim)">${d.getDate()}</text>`});
  svg+=`<line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" style="stroke:var(--line2)"/>`;
  $('#bars').innerHTML=svg;const tot=v.reduce((a,b)=>a+b,0),peak=v.indexOf(max);
  $('#avgDay').textContent='Ø '+idr(tot/days)+T('/day','/день');
  $('#barsNote').textContent=T(`Peak: ${fDate(now-(days-1-peak)*DAY)} · ${idr(max)}. Today is highlighted in gold.`,`Пик: ${fDate(now-(days-1-peak)*DAY)} · ${idr(max)}. Сегодня — золотым.`)}

      <DbtrAgt><FinInstnId><BICFI>ORBKIDJA</BICFI></FinInstnId></DbtrAgt>
      <CdtrAgt><FinInstnId><BICFI>${p.bic}</BICFI></FinInstnId></CdtrAgt>
      <Cdtr><Nm>${x(String(p.to).toUpperCase())}</Nm></Cdtr>
      <CdtrAcct><Id><Othr><Id>${x(p.toAcct)}</Id></Othr></Id></CdtrAcct>
      <Purp><Cd>${p.purp}</Cd></Purp>

function hlXml(s){return esc(s).replace(/(&gt;)([^&\n]+)(&lt;)/g,'$1<span class="xv">$2</span>$3').replace(/(&lt;\/?)([\w:?]+)/g,'$1<span class="xt">$2</span>')}
function renderEv(){const IC={sec:'🛡️',card:'💳',pay:'↗',goal:'🎯'};$('#evCount').textContent=B.ev.length;

/* ---------- XP / badges / level ---------- */
function unlock(id){if(A.badges.includes(id))return false;A.badges.push(id);const b=BADGES.find(x=>x.id===id);setTimeout(()=>toast(`🏅 ${T('Badge unlocked','Новый значок')}: <b>${b.ic} ${L(b.t)}</b>`,'gold'),1200);feed(`Rizky Aditya earned “${b.t.en}”`,`Rizky Aditya получил значок «${b.t.ru}»`);return true}

function fly(src,text){const r=src.getBoundingClientRect(),t=$('#xpfill').parentNode.getBoundingClientRect();const f=document.createElement('div');f.className='xpfly';f.textContent=text;document.body.append(f);
  const x0=r.left+r.width/2-40,y0=r.top-10;f.style.left=x0+'px';f.style.top=y0+'px';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const tx=t.top>-40&&t.top<innerHeight?t.left+t.width*.6-x0:0,ty=t.top>-40&&t.top<innerHeight?t.top-y0:-120;f.style.transform=`translate(${tx}px,${ty}px) scale(.7)`;f.style.opacity='0'}));setTimeout(()=>f.remove(),1100)}
function award(xp,src){if(xp<=0)return;const lvB=level(A.xp),rB=myRank();A.xp+=xp;A.pts+=xp;A.week+=xp;
  if(!A.today){A.today=true;A.streak++;setTimeout(()=>toast(`🔥 ${T('Streak','Серия')}: <b>${A.streak} ${T('days','дн.')}</b>`,'gold'),900)}
  if(src)fly(src,`+${xp} XP`);const rA=myRank();AU.rankUp=rB-rA;
  if(AU.rankUp>0)setTimeout(()=>toast(`🏆 ${T(`You climbed to #${rA} in your team`,`Вы поднялись на ${rA}-е место в команде`)}`),1500);
  checkBadges();saveA();
  setTimeout(()=>{const lv=level(A.xp);if(lv>lvB){const f=$('#xpfill');f.style.width='100%';setTimeout(()=>{f.style.transition='none';f.style.width='0';void f.offsetWidth;f.style.transition='';renderProf(true);levelUp(lv)},700)}else renderProf(true);
    if(lv>lvB)$('#lvNum').classList.add('pulse');renderSide();if(AU.tab==='badges')renderBadges();if(AU.tab==='mgr')renderMgr();if(AU.tab==='store')renderStore();setTimeout(()=>{AU.rankUp=0;$('#lvNum').classList.remove('pulse')},4000)},850)}
function levelUp(lv){A.pts+=100;saveA();const m=document.createElement('div');m.className='modal';
  const cols=['var(--gold)','var(--mal)','var(--gold2)','var(--mal3)','var(--violet)','var(--blue)'];
  m.innerHTML=Array.from({length:36},(_,i)=>`<i class="cf" style="left:${Math.random()*100}%;background:${cols[i%6]};animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.6}s"></i>`).join('')+
  `<div class="box card"><div class="burst"><span>${lv}</span></div><h2>${T('Level up!','Новый уровень!')}</h2><p class="muted">${T('You are now a','Теперь вы —')} <b style="color:var(--text)">${L(LVN[lv-1])}</b>.<br>${T('Bonus','Бонус')}: <b style="color:var(--gold2)">+100 ◆</b></p><button class="btn gold">${T('Awesome!','Отлично!')}</button></div>`;
  document.body.append(m);const close=()=>{m.remove();renderProf(true);if(AU.tab==='store')renderStore()};m.querySelector('.btn').onclick=close;m.onclick=e=>{if(e.target===m)close()};
  feed(`Rizky Aditya reached level ${lv}`,`Rizky Aditya достиг ${lv}-го уровня`)}

/* ---------- courses ---------- */
function courseState(c){const p=A.prog[c.id];if(p.done)return['done',T('Completed','Пройден'),'ok'];if(p.les>0)return['prog',T('In progress','В процессе'),'gold'];return['new',c.mand?T('Mandatory · due 30 Nov','Обязательный · до 30 ноя'):T('Not started','Не начат'),c.mand?'warn':'']}
function renderCourses(){const el=$('#a-courses');if(AU.open){el.innerHTML=player();return}
  const done=Object.values(A.prog).filter(p=>p.done).length;
  el.innerHTML=`<div class="sm muted" style="margin-bottom:10px">${done}/${COURSES.length} ${T('courses completed · each lesson ~2 min · pass mark 3 of 4','курсов пройдено · урок ~2 мин · проходной балл 3 из 4')}</div><div class="cgrid2">${COURSES.map(c=>{const p=A.prog[c.id],st=courseState(c),pct=Math.round(((p.les)+(p.done?1:0))/4*100);

    <div class="cf"><span class="pill ${st[2]}">${st[1]}</span>${p.best>=0?`<span class="sm muted">${T('best','лучший')} ${p.best}/4</span>`:''}<span class="sp"></span><button class="btn sm ${st[0]==='done'?'':'pri'}" data-open="${c.id}">${st[0]==='done'?T('Review','Повторить'):st[0]==='prog'?T('Continue','Продолжить'):T('Start','Начать')}</button></div></div>`}).join('')}</div>`}
function player(){const c=CRS(AU.open),p=A.prog[c.id],s=AU.step;
  const head=`<button class="back" data-pa="close">← ${T('All courses','Все курсы')}</button><div style="display:flex;align-items:center;gap:10px;margin-top:6px"><span style="font-size:24px">${c.ic}</span><b style="font-size:17px">${L(c.t)}</b></div><div class="steps">${[0,1,2,3].map(i=>`<i class="${i<s?'d':i===s?'c':''}" title="${i<3?T('Lesson','Урок')+' '+(i+1):T('Quiz','Тест')}"></i>`).join('')}</div>`;
  if(s<3){const l=c.lessons[s],first=s>=p.les;
    return `<div class="card player">${head}<div class="lesson"><span class="pill">${T('Lesson','Урок')} ${s+1}/3 · ~2 ${T('min','мин')}</span><h2>${L(l.t)}</h2><p>${L(l.b)}</p><div class="tip">💡 <b>${T('Key takeaway','Главное')}:</b> ${L(l.tip)}</div></div>
    <div class="pnav">${s>0?`<button class="btn" data-pa="prev">← ${T('Back','Назад')}</button>`:''}<button class="btn pri" data-pa="next">${first?T('Complete lesson','Завершить урок')+' · +10 XP':s<2?T('Next lesson →','Следующий урок →'):T('Go to quiz →','К тесту →')}</button></div></div>`}
  if(s===3){const q=c.quiz[AU.qi],pk=AU.picked;
    return `<div class="card player">${head}<span class="pill gold">${T('Quiz','Тест')} · ${T('question','вопрос')} ${AU.qi+1}/4</span> <span class="sm muted">${T('correct so far','верно')}: ${AU.ans.filter(Boolean).length}</span><div class="qq">${L(q.q)}</div>
    ${q.o.map((o,i)=>`<button class="opt ${pk!=null?(i===q.a?'ok':i===pk?'no':''):''}" data-pick="${i}" ${pk!=null?'disabled':''}><i>${'ABC'[i]}</i><span>${L(o)}</span></button>`).join('')}
    ${pk!=null?`<div class="expl">${pk===q.a?'✅ <b>'+T('Correct!','Верно!')+'</b> +25 XP':'❌ <b>'+T('Not quite.','Не совсем.')+'</b>'} ${L(q.x)}</div><div class="pnav"><button class="btn pri" data-pa="qnext">${AU.qi<3?T('Next question →','Следующий вопрос →'):T('See results','Результаты')}</button></div>`:''}</div>`}
  const r=AU.result,R=52,Cc=2*Math.PI*R,pass=r.score>=3;
  return `<div class="card player">${head}<div class="res"><svg class="ring" viewBox="0 0 130 130"><circle cx="65" cy="65" r="${R}" style="stroke:var(--bg2)"/><circle cx="65" cy="65" r="${R}" style="stroke:var(${pass?'--mal':'--amber'});transition:stroke-dashoffset 1s" stroke-linecap="round" stroke-dasharray="${Cc}" stroke-dashoffset="${Cc}" id="ringArc" transform="rotate(-90 65 65)"/><text x="65" y="64" text-anchor="middle" font-size="28" font-weight="800" style="fill:var(--text)">${r.score}/4</text><text x="65" y="84" text-anchor="middle" font-size="11" style="fill:var(--muted)">${pass?T('PASSED','СДАН'):T('TRY AGAIN','ЕЩЁ РАЗ')}</text></svg>
  <div class="xpl"><b style="font-size:18px">${pass?(r.score===4?T('Flawless! 🎯','Безупречно! 🎯'):T('Well done! 🎉','Отлично! 🎉')):T('Almost there — 3 of 4 to pass','Почти — нужно 3 из 4')}</b>${r.lines.map(l=>`<div class="row"><span>${LA(l[0])}</span><span class="mono">+${l[1]} XP</span></div>`).join('')}<div class="row t"><span>${T('Total earned','Всего')}</span><span class="mono" id="xpTotal">+${r.xp} XP · +${r.xp} ◆</span></div></div></div>
  <div class="pnav"><button class="btn" data-pa="retake">↺ ${T('Retake quiz','Пройти тест заново')}</button><button class="btn pri" data-pa="close">${T('Back to courses','К курсам')}</button>${pass?`<button class="btn gold" data-pa="store">🎁 ${T('Spend points','Потратить баллы')}</button>`:''}</div></div>`}
function finishQuiz(){const c=CRS(AU.open),p=A.prog[c.id],score=AU.ans.filter(Boolean).length,first=p.best<0,lines=[];
  if(first)lines.push([[`${score} correct × 25`,`${score} верных × 25`],score*25]);else{const imp=Math.max(0,score-p.best)*25;if(imp)lines.push([['Improvement bonus','Бонус за улучшение'],imp]);lines.push([[`Practice · ${score} × 5`,`Повторение · ${score} × 5`],score*5])}
  const pass=score>=3;if(pass&&!p.done){lines.push([['Course completion','Завершение курса'],40]);p.done=true;A.extra[c.id]=(A.extra[c.id]||0)+1;feed(`Rizky Aditya completed “${c.t.en}” · ${score}/4`,`Rizky Aditya прошёл «${c.t.ru}» · ${score}/4`)}
  if(score===4)unlock('perfect');p.best=Math.max(p.best,score);
  const xp=lines.reduce((a,l)=>a+l[1],0);AU.result={score,xp,lines};AU.step=4;saveA();renderCourses();
  requestAnimationFrame(()=>{const a=$('#ringArc');if(a)setTimeout(()=>a.style.strokeDashoffset=2*Math.PI*52*(1-score/4),50);const s=$('#xpTotal');if(s){s.scrollIntoView({block:'nearest',behavior:'smooth'});setTimeout(()=>award(xp,s),350)}})}

  const b=e.target.closest('[data-pa]');if(!b)return;const a=b.dataset.pa,c=AU.open&&CRS(AU.open),p=c&&A.prog[c.id];
  if(a==='close'){AU.open=null;renderCourses()}
  else if(a==='prev'){AU.step--;renderCourses()}
  else if(a==='next'){if(AU.step>=p.les){p.les=AU.step+1;feed(`Rizky Aditya finished a lesson in “${c.t.en}”`,`Rizky Aditya прошёл урок курса «${c.t.ru}»`);award(10,b)}AU.step++;AU.qi=0;AU.ans=[];AU.picked=null;saveA();renderCourses()}
  else if(a==='qnext'){if(AU.qi<3){AU.qi++;AU.picked=null;renderCourses()}else finishQuiz()}
  else if(a==='retake'){AU.step=3;AU.qi=0;AU.ans=[];AU.picked=null;renderCourses()}
  else if(a==='store'){AU.open=null;renderCourses();setTab('store')}});

/* ---------- store ---------- */
function renderStore(){const el=$('#a-store');
  el.innerHTML=`<div class="card" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px"><span style="font-size:28px">◆</span><div style="flex:1;min-width:160px"><div class="sm muted">${T('Your balance','Ваш баланс')}</div><b class="mono" style="font-size:24px;color:var(--gold2)" id="stBal">${num(A.pts)}</b> <span class="muted">${T('points','баллов')}</span></div><div class="sm muted" style="max-width:320px">${T('Earn 1 point for every XP. Level-ups add a +100 bonus. Points never expire while you’re employed.','1 балл за каждый XP. Новый уровень — +100 бонусом. Баллы не сгорают, пока вы в компании.')}</div></div>
  <div class="store">${REWARDS.map(r=>{const st=(A.stock[r.id]!=null?A.stock[r.id]:r.stock),can=A.pts>=r.cost&&st>0,cf=AU.confirm===r.id,got=A.red.some(x=>x.id===r.id);
    return `<div class="card item ${got?'got':''}"><div class="ii">${r.ic}</div><b>${L(r.t)}</b><div class="sm muted">${L(r.d)}</div><div style="display:flex;justify-content:space-between;align-items:center"><span class="cost">◆ ${num(r.cost)}</span><span class="sm muted">${st<50?st+' '+T('left','осталось'):''}</span></div>
    <button class="btn sm ${cf?'gold':can?'pri':''}" data-redeem="${r.id}" ${can?'':'disabled'}>${!can?(st<=0?T('Out of stock','Нет в наличии'):T(`Need ${num(r.cost-A.pts)} more`,`Не хватает ${num(r.cost-A.pts)}`)):cf?T(`Confirm −${num(r.cost)} ◆`,`Подтвердить −${num(r.cost)} ◆`):T('Redeem','Обменять')}</button></div>`}).join('')}</div>
  <div class="card rlist" style="margin-top:14px"><h3>🧾 ${T('Redeemed','Полученные награды')}<span class="sp"></span><span class="pill">${A.red.length}</span></h3>${A.red.length?A.red.map((x,i)=>{const r=REWARDS.find(y=>y.id===x.id);return `<div class="r ${i===0&&x.ts>Date.now()-3000?'fresh':''}"><span style="font-size:20px">${r.ic}</span><div class="sp"><b>${L(r.t)}</b><div class="sm muted">${fDate(x.ts)}, ${fTime(x.ts)} · −${num(r.cost)} ◆</div></div><span class="code">${x.code}</span></div>`}).join(''):`<div class="muted sm">${T('Nothing yet — pick a reward above.','Пока пусто — выберите награду выше.')}</div>`}</div>`}
let cfT=null;
$('#a-store').addEventListener('click',e=>{const b=e.target.closest('[data-redeem]');if(!b)return;const r=REWARDS.find(x=>x.id===b.dataset.redeem);
  if(AU.confirm!==r.id){AU.confirm=r.id;clearTimeout(cfT);cfT=setTimeout(()=>{AU.confirm=null;if(AU.tab==='store')renderStore()},4000);renderStore();return}
  clearTimeout(cfT);AU.confirm=null;if(A.pts<r.cost)return;const from=A.pts;A.pts-=r.cost;A.stock[r.id]=(A.stock[r.id]!=null?A.stock[r.id]:r.stock)-1;
  const code='ORB-'+r.id.toUpperCase().slice(0,3)+'-'+rid('',6);A.red.unshift({id:r.id,ts:Date.now(),code});feed(`Rizky Aditya redeemed “${r.t.en}”`,`Rizky Aditya обменял баллы на «${r.t.ru}»`);
  checkBadges();saveA();renderStore();countTo($('#stBal'),from,A.pts,num);renderProf(true);renderSide();toast(`🎁 ${L(r.t)} · <span class="mono">${code}</span>`,'gold')});

/* ---------- badges ---------- */
function renderBadges(){$('#a-badges').innerHTML=`<div class="sm muted" style="margin-bottom:10px">${A.badges.length}/${BADGES.length} ${T('unlocked','получено')}</div><div class="badges">${BADGES.map(b=>{const has=A.badges.includes(b.id);return `<div class="card bdg ${has?'':'lock'}"><div class="bi">${b.ic}</div><b>${L(b.t)}</b><div class="sm">${L(b.d)}</div><div style="margin-top:8px">${has?`<span class="pill ok">✓ ${T('Unlocked','Получен')}</span>`:`<span class="pill">🔒 ${T('Locked','Закрыт')}</span>`}</div></div>`}).join('')}</div>`}

/* ---------- manager analytics ---------- */
function deptStats(cid){const ids=cid==='all'?COURSES.map(c=>c.id):[cid];
  return DEPTS.map(d=>{let done=0,sc=0;ids.forEach(id=>{done+=Math.round(d.n*MG[id][d.id][0]/100)+(d.id==='rs'?(A.extra[id]||0):0);sc+=MG[id][d.id][1]});const tot=d.n*ids.length;return{d,done,tot,pct:done/tot*100,score:sc/ids.length}})}
function renderMgr(){const el=$('#a-mgr'),cid=AU.mc,st=deptStats(cid),target=cid==='pdp'?90:80;
  const tot=st.reduce((a,s)=>a+s.tot,0),done=st.reduce((a,s)=>a+s.done,0),avg=st.reduce((a,s)=>a+s.score*s.d.n,0)/st.reduce((a,s)=>a+s.d.n,0);
  const k=(l,v,d)=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
  const W=600,H=170,mx=4200,pts=WAU.map((v,i)=>[20+i*(W-40)/(WAU.length-1),H-24-(H-44)*v/mx]);
  const line=pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
  el.innerHTML=`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><select class="input" id="mc" style="max-width:300px"><option value="all">${T('All courses','Все курсы')}</option>${COURSES.map(c=>`<option value="${c.id}" ${cid===c.id?'selected':''}>${c.ic} ${L(c.t)}${c.mand?' · '+T('mandatory','обязательный'):''}</option>`).join('')}</select><span class="sp" style="flex:1"></span><button class="btn sm" id="csv">⬇ ${T('Export CSV','Экспорт CSV')}</button></div>
  <div class="mk">${k(T('Learners','Учащиеся'),num(DEPTS.reduce((a,d)=>a+d.n,0)),T('6 departments','6 подразделений'))}${k(T('Completion','Прохождение'),(done/tot*100).toFixed(1)+'%',num(done)+' / '+num(tot))}${k(T('Avg quiz score','Средний балл'),avg.toFixed(0)+'%',T('first attempt','с первой попытки'))}${k(T('Active this week','Активны за неделю'),num(WAU[WAU.length-1]),'▲ '+(((WAU[11]/WAU[10])-1)*100).toFixed(1)+'% '+T('vs last week','к прошлой'))}</div>
  <div class="card"><h3>🏢 ${T('Completion by department','Прохождение по подразделениям')}<span class="sp"></span><span class="pill gold">${T('target','цель')} ${target}%</span></h3>
  ${st.map(s=>{const c=s.pct>=target?'--mal':s.pct>=60?'--amber':'--red';return `<div class="dbar"><span class="dn" title="${L(s.d.t)}">${L(s.d.t)}</span><div class="tr"><i style="width:${s.pct}%;background:var(${c})"></i><u style="left:${target}%"></u></div><b>${s.pct.toFixed(1)}%</b></div>`}).join('')}</div>
  <div class="igrid" style="margin-top:14px"><div class="card"><h3>📈 ${T('Weekly active learners','Активные за неделю')}</h3><svg id="wau" viewBox="0 0 ${W} ${H}"><polygon points="${pts[0][0]},${H-24} ${line} ${pts[pts.length-1][0]},${H-24}" style="fill:var(--mal);fill-opacity:.14"/><polyline points="${line}" fill="none" style="stroke:var(--mal3)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3}" style="fill:var(${i===pts.length-1?'--gold':'--mal3'})"><title>${T('Week','Неделя')} ${i+1}: ${num(WAU[i])}</title></circle>`).join('')}<line x1="0" x2="${W}" y1="${H-24}" y2="${H-24}" style="stroke:var(--line2)"/>${pts.map((p,i)=>i%2===1?`<text x="${p[0]}" y="${H-8}" text-anchor="middle" font-size="10.5" style="fill:var(--dim)">${T('W','Н')}${i+1}</text>`:'').join('')}<text x="${pts[11][0]-8}" y="${pts[11][1]-12}" text-anchor="end" font-size="12" font-weight="700" style="fill:var(--gold2)">${num(WAU[11])}</text></svg></div>
  <div class="card"><h3>⚡ ${T('Live activity','Активность')}</h3><div class="feed">${(A.feed.length?A.feed:[]).concat([{ts:Date.now()-6e5,en:'Wulan Sari completed “Customer care excellence” · 4/4',ru:'Wulan Sari прошла «Сервис мирового уровня» · 4/4'},{ts:Date.now()-14e5,en:'Network Ops · Surabaya reached 90% on 5G basics',ru:'Эксплуатация · Сурабая: 90% по курсу 5G'},{ts:Date.now()-31e5,en:'Fajar Nugroho redeemed “Cinema for two”',ru:'Fajar Nugroho обменял баллы на «Кино на двоих»'}]).slice(0,7).map(f=>`<div class="e"><span class="t">${fTime(f.ts)}</span><span>${esc(L(f))}</span></div>`).join('')}</div></div></div>
  <div class="card" style="margin-top:14px"><h3>📋 ${T('Departments','Подразделения')}<span class="sp"></span><span class="sm muted" style="font-weight:500">${T('Nudge sends a push + email reminder to everyone not yet done','«Напомнить» — пуш и письмо всем, кто ещё не прошёл')}</span></h3><div class="tw"><table><thead><tr><th>${T('Department','Подразделение')}</th><th class="num">${T('Learners','Учащихся')}</th><th class="num">${T('Done','Прошли')}</th><th class="num">%</th><th class="num">${T('Score','Балл')}</th><th>${T('Status','Статус')}</th><th></th></tr></thead><tbody>
  ${st.map(s=>{const ok=s.pct>=target,warn=s.pct>=60,key=cid+':'+s.d.id,sent=A.nudged.includes(key);return `<tr class="${s.d.id==='rs'?'me':''}"><td>${L(s.d.t)}${s.d.id==='rs'?' · '+T('your dept','ваш отдел'):''}</td><td class="num">${num(s.d.n)}</td><td class="num">${num(s.done)}</td><td class="num"><b>${s.pct.toFixed(1)}</b></td><td class="num">${s.score.toFixed(0)}%</td><td><span class="pill ${ok?'ok':warn?'warn':'bad'}">${ok?T('On track','В норме'):warn?T('Behind','Отстаёт'):T('At risk','Под угрозой')}</span></td><td>${ok?'':`<button class="btn sm" data-nudge="${key}" data-n="${s.tot-s.done}" data-d="${s.d.id}" ${sent?'disabled':''}>${sent?'✓ '+T('Sent','Отправлено'):'🔔 '+T('Nudge','Напомнить')}</button>`}</td></tr>`}).join('')}</tbody></table></div></div>`;
  $('#mc').onchange=e=>{AU.mc=e.target.value;renderMgr()};
  $('#csv').onclick=()=>{const rows=[['department','learners','completed','completion_pct','avg_score_pct']].concat(st.map(s=>[s.d.t.en,s.d.n,s.done,s.pct.toFixed(1),s.score.toFixed(0)]));const blob=new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='orbit-academy-'+cid+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('⬇ '+T('CSV exported','CSV выгружен'))}}
$('#a-mgr').addEventListener('click',e=>{const b=e.target.closest('[data-nudge]');if(!b)return;A.nudged.push(b.dataset.nudge);const d=DEPTS.find(x=>x.id===b.dataset.d);feed(`Manager nudged ${d.t.en} · ${b.dataset.n} learners`,`Руководитель напомнил: ${d.t.ru} · ${b.dataset.n} чел.`);saveA();renderMgr();toast('🔔 '+T(`Reminder sent to ${num(+b.dataset.n)} learners in ${d.t.en}`,`Напоминание отправлено: ${num(+b.dataset.n)} чел. · ${d.t.ru}`))});

/* ---------- tabs / project switch ---------- */
function setTab(t){AU.tab=t;$$('#atabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$$('.apane').forEach(p=>p.classList.toggle('on',p.id==='a-'+t));renderAcadTab()}
function renderAcadTab(){({courses:renderCourses,store:renderStore,badges:renderBadges,mgr:renderMgr})[AU.tab]()}
$$('#atabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
function setProj(v){$$('#proj button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#v-bank').classList.toggle('on',v==='bank');$('#v-acad').classList.toggle('on',v==='acad');$('#br-bank').classList.toggle('on',v==='bank');$('#br-acad').classList.toggle('on',v==='acad');store.set('orbit-proj',v)}
$$('#proj button').forEach(b=>b.onclick=()=>setProj(b.dataset.v));
$$('[data-reset]').forEach(b=>b.onclick=()=>{if(b.dataset.reset==='bank'){B=freshBank();saveB();Object.assign(UI,{authed:false,scr:'lock',pend:null,last:null,hc:'all',hq:'',hl:null,cardRes:null,gform:false,lockMode:'bio'});renderPhone();renderIns()}else{A=freshAcad();saveA();Object.assign(AU,{open:null,confirm:null,rankUp:0,shown:{xp:A.xp,pts:A.pts}});renderProf();renderSide();renderAcadTab()}toast('↺ '+T('Demo reset','Демо сброшено'))});

function renderAll(){renderPhone();renderIns();renderProf();renderSide();renderAcadTab()}
PT.onLang(renderAll);
tick();setInterval(tick,30000);
setProj(store.get('orbit-proj')==='acad'?'acad':'bank');
renderAll();
})();
</script>
